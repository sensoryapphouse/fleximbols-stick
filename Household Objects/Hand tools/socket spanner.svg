  <!-- Ratchet handle - long arm pointing down-left -->
  <rect x="30" y="128" width="145" height="26" rx="10" ry="10" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Ratchet head body - circular disc -->
  <circle cx="194" cy="141" r="34" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Ratchet mechanism teeth around edge -->
  <circle cx="194" cy="141" r="28" fill="none" stroke="#1a1a1a" stroke-width="3.33" stroke-dasharray="8 4"/>
  <!-- Square drive nub -->
  <rect x="185" y="162" width="18" height="18" rx="2" ry="2" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Drive hole -->
  <rect x="190" y="167" width="8" height="8" rx="1" ry="1" fill="#000000" stroke="none"/>
  <!-- Socket - cylindrical hex, attached to square drive below -->
  <rect x="175" y="178" width="38" height="36" rx="4" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Socket hex bore (viewed from side - 6 flats hinted) -->
  <rect x="182" y="186" width="24" height="22" rx="2" ry="2" fill="#000000" stroke="#b8b8b8" stroke-width="2.22"/>
  <!-- Socket body detail lines -->
  <line x1="175" y1="190" x2="213" y2="190" stroke="#7f7f7f" stroke-width="2.22"/>
</g></svg>