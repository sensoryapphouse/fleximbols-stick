<path d="M 116 196 A 140 140 0 0 1 396 196 Z" fill="#eafbe4" stroke="#1a1a1a" stroke-width="6"/>
<!-- red flesh -->
<path d="M 134 196 A 122 122 0 0 1 378 196 Z" fill="#e85a55" stroke="#1a1a1a" stroke-width="6"/>
<!-- seeds (larger, clear teardrop pips) -->
<ellipse cx="256" cy="226" rx="8" ry="13" fill="#1a1a1a"/>
<ellipse cx="204" cy="214" rx="8" ry="13" fill="#1a1a1a" transform="rotate(-20 204 214)"/>
<ellipse cx="308" cy="214" rx="8" ry="13" fill="#1a1a1a" transform="rotate(20 308 214)"/>
<ellipse cx="232" cy="262" rx="8" ry="13" fill="#1a1a1a"/>
<ellipse cx="280" cy="262" rx="8" ry="13" fill="#1a1a1a"/>
<!-- juice droplets dripping from the cut edge -->
<path d="M 196 258 q -16 24 0 34 q 16 -10 0 -34 Z" fill="#62b8ef" stroke="#1a1a1a" stroke-width="6"/>
<path d="M 256 296 q -18 28 0 40 q 18 -12 0 -40 Z" fill="#62b8ef" stroke="#1a1a1a" stroke-width="6"/>
<path d="M 316 258 q -16 24 0 34 q 16 -10 0 -34 Z" fill="#62b8ef" stroke="#1a1a1a" stroke-width="6"/>
<path d="M 156 330 q -13 20 0 28 q 13 -8 0 -28 Z" fill="#62b8ef" stroke="#1a1a1a" stroke-width="6"/>
<path d="M 356 330 q -13 20 0 28 q 13 -8 0 -28 Z" fill="#62b8ef" stroke="#1a1a1a" stroke-width="6"/>
<path d="M 256 364 q -15 22 0 32 q 15 -10 0 -32 Z" fill="#62b8ef" stroke="#1a1a1a" stroke-width="6"/>
</g>
</svg>
