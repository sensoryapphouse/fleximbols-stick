<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- ground line -->
  <line x1="5" y1="200" x2="285" y2="200" stroke="#1a1a1a" stroke-width="5.33" stroke-linecap="round"/>
  <!-- elongated luxury sedan, EXTRA-LONG MIDDLE, tinted windows -->
  <path d="M 12 195 L 15 165 L 45 135 L 90 120 L 220 120 L 250 135 L 278 165 L 278 195 Z" fill="#1d0e82" stroke="#1a1a1a" stroke-width="5.33" stroke-linejoin="round"/>
  <!-- windshield -->
  <path d="M 55 135 L 70 145 L 95 145 L 95 125 Z" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- TINTED long passenger windows (dark grey to show tint) -->
  <rect x="100" y="125" width="40" height="22" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="145" y="125" width="40" height="22" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="190" y="125" width="40" height="22" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- rear windshield -->
  <path d="M 235 125 L 235 145 L 252 145 L 245 132 Z" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- door seams - extra long middle -->
  <line x1="100" y1="147" x2="100" y2="195" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="232" y1="147" x2="232" y2="195" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- chrome belt line -->
  <line x1="20" y1="150" x2="270" y2="150" stroke="#efefef" stroke-width="5.33"/>
  <!-- door handles -->
  <rect x="155" y="160" width="14" height="4" fill="#efefef" stroke="#1a1a1a" stroke-width="2.67"/>
  <rect x="200" y="160" width="14" height="4" fill="#efefef" stroke="#1a1a1a" stroke-width="2.67"/>
  <!-- headlight -->
  <ellipse cx="22" cy="172" rx="9" ry="6" fill="#fff200" stroke="#1a1a1a" stroke-width="3.56"/>
  <!-- tail light -->
  <ellipse cx="268" cy="172" rx="9" ry="6" fill="#f8130d" stroke="#1a1a1a" stroke-width="3.56"/>
  <!-- wheels (3, evenly spaced to show length) -->
  <circle cx="70" cy="200" r="18" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.33"/>
  <circle cx="70" cy="200" r="7" fill="#efefef" stroke="#1a1a1a" stroke-width="3.56"/>
  <circle cx="225" cy="200" r="18" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.33"/>
  <circle cx="225" cy="200" r="7" fill="#efefef" stroke="#1a1a1a" stroke-width="3.56"/>
</g></svg>