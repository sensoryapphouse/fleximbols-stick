<svg xmlns="http://www.w3.org/2000/svg" viewBox="80.29 71.76 368.48 368.48">
<!-- printed paper sheet -->
<rect x="110" y="180" width="180" height="232" rx="6" fill="#fdfdfd" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- printed star motif on paper -->
<path d="M 200 220 L 215 262 L 259 262 L 224 289 L 237 331 L 200 305 L 163 331 L 176 289 L 141 262 L 185 262 Z" fill="#5aa9e6" stroke="#1a1a1a" stroke-width="6" stroke-linejoin="round"/>
<!-- inked impression smudge under print -->
<ellipse cx="200" cy="372" rx="58" ry="12" fill="#bcd8f2"/>
<!-- ink brayer roller (above, clearly separate) -->
<rect x="300" y="150" width="120" height="56" rx="28" fill="#e2604f" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- ink coat on roller -->
<rect x="312" y="190" width="96" height="10" rx="5" fill="#1a1a1a"/>
<!-- axle + handle -->
<path d="M 360 150 L 360 110 L 322 110" fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="282" y="98" width="44" height="24" rx="11" fill="#f3d27a" stroke="#1a1a1a" stroke-width="8" stroke-linejoin="round"/>
</svg>
