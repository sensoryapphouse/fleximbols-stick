<!-- ground line -->
<line x1="70" y1="392" x2="470" y2="392" stroke="#9aa7b5" stroke-width="6" stroke-linecap="round"/>

<!-- front figure (faded) -->
<g opacity="0.34">
<circle id="h1" data-fig="ctx" cx="150" cy="262" r="30" fill="#f1c9a5" stroke="#1a1a1a" stroke-width="6"/>
<path d="M 118 388 q 0 -78 32 -78 q 32 0 32 78 Z" fill="#cdd3da" stroke="#1a1a1a" stroke-width="6" stroke-linejoin="round"/>
</g>
<!-- middle figure (faded) -->
<g opacity="0.34">
<circle id="h2" data-fig="ctx" cx="238" cy="262" r="30" fill="#f1c9a5" stroke="#1a1a1a" stroke-width="6"/>
<path d="M 206 388 q 0 -78 32 -78 q 32 0 32 78 Z" fill="#cdd3da" stroke="#1a1a1a" stroke-width="6" stroke-linejoin="round"/>
</g>

<!-- BACK figure = last, highlighted gold + bold outline -->
<circle id="h3" data-fig="mc" cx="350" cy="258" r="34" fill="#f1c9a5" stroke="#1a1a1a" stroke-width="7"/>
<path d="M 312 392 q 0 -86 38 -86 q 38 0 38 86 Z" fill="#f0b400" stroke="#1a1a1a" stroke-width="7" stroke-linejoin="round"/>

<!-- red END bar behind the last figure (the finish/end of the line) -->
<line x1="410" y1="296" x2="410" y2="392" stroke="#1a1a1a" stroke-width="22" stroke-linecap="round"/><line x1="410" y1="296" x2="410" y2="392" stroke="#e0473c" stroke-width="14" stroke-linecap="round"/>

<!-- bold green arrow pointing to the END of the line (right) -->
<line x1="350" y1="150" x2="350" y2="196" stroke="#1a1a1a" stroke-width="25.0" stroke-linecap="round"/><line x1="350" y1="196" x2="326" y2="170" stroke="#1a1a1a" stroke-width="25.0" stroke-linecap="round"/><line x1="350" y1="196" x2="374" y2="170" stroke="#1a1a1a" stroke-width="25.0" stroke-linecap="round"/><line x1="350" y1="150" x2="350" y2="196" stroke="#2f9e4a" stroke-width="19.5" stroke-linecap="round"/>
<line x1="350" y1="196" x2="326" y2="170" stroke="#2f9e4a" stroke-width="19.5" stroke-linecap="round"/>
<line x1="350" y1="196" x2="374" y2="170" stroke="#2f9e4a" stroke-width="19.5" stroke-linecap="round"/>
</g></svg>
