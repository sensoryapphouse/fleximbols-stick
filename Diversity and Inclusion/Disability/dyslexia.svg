<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Open book with jumbled/mirrored block tiles representing letter confusion -->
  <!-- Book left page -->
  <path d="M30 60 L145 75 L145 195 L30 180 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Book right page -->
  <path d="M260 60 L145 75 L145 195 L260 180 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Book spine -->
  <line x1="145" y1="75" x2="145" y2="195" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <!-- Book bottom curve -->
  <path d="M30 180 Q145 210 260 180" fill="none" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>

  <!-- Left page: upright block tiles (baseline) -->
  <rect x="50" y="100" width="22" height="28" rx="3" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="80" y="100" width="22" height="28" rx="3" fill="#529929" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="50" y="138" width="22" height="28" rx="3" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="80" y="138" width="22" height="28" rx="3" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- Right page: mirrored/rotated/jumbled block tiles -->
  <!-- Flipped vertically tile -->
  <rect x="158" y="100" width="22" height="28" rx="3" fill="#529929" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" transform="scale(1,-1) translate(0,-228)"/>
  <!-- Rotated 90deg tile -->
  <rect x="190" y="104" width="28" height="22" rx="3" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Mirrored horizontally tile -->
  <rect x="158" y="138" width="22" height="28" rx="3" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" transform="scale(-1,1) translate(-338,0)"/>
  <!-- Tilted tile -->
  <rect x="193" y="136" width="22" height="28" rx="3" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" transform="rotate(20,204,150)"/>

  <!-- Confusion arrows on right page -->
  <path d="M170 95 Q180 88 190 95" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <polygon points="190,90 194,97 186,97" fill="#000000"/>
</g></svg>