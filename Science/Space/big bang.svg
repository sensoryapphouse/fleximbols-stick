  <!-- central burst ring -->
  <circle cx="145" cy="120" r="36" fill="#f2e40d" stroke="#1a1a1a" stroke-width="5.33"/>
  <circle cx="145" cy="120" r="22" fill="#ff9900" stroke="#1a1a1a" stroke-width="5.33"/>
  <!-- singularity point -->
  <circle cx="145" cy="120" r="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- galaxies forming at outer edges (spiral hints) -->
  <g>
    <ellipse cx="50" cy="45" rx="14" ry="7" fill="#7c3fac" stroke="#1a1a1a" stroke-width="4.45" transform="rotate(-30 50 45)"/>
