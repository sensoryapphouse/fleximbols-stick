  <!-- pale arctic sky -->
  <rect x="10" y="20" width="270" height="115" fill="#dff3fd" stroke="#1a1a1a" stroke-width="3.56"/>
  <!-- pale frozen ground -->
  <rect x="10" y="135" width="270" height="90" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- ice patches -->
  <ellipse cx="55" cy="200" rx="22" ry="6" fill="#90a7d6" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="220" cy="205" rx="28" ry="7" fill="#90a7d6" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="160" cy="215" rx="18" ry="5" fill="#90a7d6" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- moss patches (low green clumps) -->
  <ellipse cx="40" cy="180" rx="12" ry="4" fill="#67832d" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="250" cy="175" rx="14" ry="4" fill="#67832d" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="110" cy="185" rx="9" ry="3" fill="#529929" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- distant horizon line -->
  <line x1="10" y1="135" x2="280" y2="135" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- caribou body -->
  <ellipse cx="155" cy="145" rx="32" ry="12" fill="#9d7246" stroke="#1a1a1a" stroke-width="5.33"/>
  <!-- neck -->
  <path d="M180 142 Q 192 128 196 112 L 204 114 Q 200 132 188 150 Z" fill="#9d7246" stroke="#1a1a1a" stroke-width="5.33" stroke-linejoin="round"/>
  <!-- head -->
  <path d="M192 108 Q 208 102 214 112 Q 214 122 204 124 Q 196 122 192 116 Z" fill="#9d7246" stroke="#1a1a1a" stroke-width="5.33" stroke-linejoin="round"/>
  <!-- antlers -->
  <path d="M196 104 l-4 -16 l-6 4 M196 104 l4 -14 l6 2 M198 92 l-4 -8 M204 92 l4 -8" fill="none" stroke="#5e1f0a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- eye -->
  <circle cx="207" cy="115" r="1.4" fill="#000000"/>
  <!-- legs -->
  <rect x="130" y="154" width="5" height="22" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="142" y="154" width="5" height="22" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="166" y="154" width="5" height="22" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="178" y="154" width="5" height="22" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- tail -->
