  <!-- Fish hook curve -->
  <path d="M 210,28 Q 240,28 240,58 Q 240,100 210,110 Q 185,118 170,105" fill="none" stroke="#4d4d4d" stroke-width="5.33" stroke-linecap="round" stroke-linejoin="round"/>
