  <!-- Time markers -->
  <line x1="25"  y1="148" x2="25"  y2="155" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="85"  y1="148" x2="85"  y2="155" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="145" y1="148" x2="145" y2="158" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="205" y1="148" x2="205" y2="155" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
