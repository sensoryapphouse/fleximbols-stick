  <!-- Pill box: tiny round single circular tin with lid, one pill beside it -->
  <!-- Tin body (bottom half of circle = base) -->
  <ellipse cx="120" cy="158" rx="62" ry="14" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="58" y="132" width="124" height="26" rx="0" ry="0" fill="#b8b8b8" stroke="none"/>
  <rect x="58" y="131" width="124" height="28" rx="0" ry="0" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="120" cy="131" rx="62" ry="14" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Lid (top circle, slightly larger, coloured) -->
  <ellipse cx="120" cy="118" rx="66" ry="16" fill="#efefef" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <ellipse cx="120" cy="118" rx="56" ry="12" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <!-- Cross embossed on lid -->
  <rect x="116" y="108" width="8" height="20" fill="#ffffff" stroke="none"/>
  <rect x="108" y="114" width="24" height="8" fill="#ffffff" stroke="none"/>
  <!-- One round pill beside the tin -->
  <circle cx="218" cy="145" r="26" fill="#dff3fd" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Pill score line -->
  <line x1="218" y1="121" x2="218" y2="169" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
</g></svg>