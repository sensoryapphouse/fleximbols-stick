<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- ALARM CLOCK body (slightly smaller to leave room for hand above) -->
  <circle cx="145" cy="168" r="62" fill="#efefef" stroke="#1a1a1a" stroke-width="6.66"/>
  <!-- Clock face -->
  <circle cx="145" cy="168" r="52" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Clock tick marks -->
  <line x1="145" y1="120" x2="145" y2="128" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="145" y1="208" x2="145" y2="216" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="87" y1="168" x2="95" y2="168" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="195" y1="168" x2="203" y2="168" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Clock hands (showing alarm time ~6am - just gone off) -->
  <!-- Hour hand -->
  <line x1="145" y1="168" x2="130" y2="142" stroke="#1a1a1a" stroke-width="6.66" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="145" y1="168" x2="145" y2="128" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <!-- Center -->
  <circle cx="145" cy="168" r="5" fill="#000000"/>

  <!-- Twin bells on top of clock -->
  <!-- Left bell -->
  <ellipse cx="114" cy="118" rx="18" ry="16" fill="#f7de58" stroke="#1a1a1a" stroke-width="5.55"/>
  <ellipse cx="114" cy="118" rx="11" ry="10" fill="#f2e40d" stroke="#1a1a1a" stroke-width="3.33"/>
  <rect x="110" y="108" width="8" height="12" rx="2" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Right bell -->
  <ellipse cx="176" cy="118" rx="18" ry="16" fill="#f7de58" stroke="#1a1a1a" stroke-width="5.55"/>
  <ellipse cx="176" cy="118" rx="11" ry="10" fill="#f2e40d" stroke="#1a1a1a" stroke-width="3.33"/>
  <rect x="172" y="108" width="8" height="12" rx="2" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.33"/>

  <!-- SNOOZE BUTTON on top of clock (large raised button between bells) -->
  <!-- Button base/housing -->
  <ellipse cx="145" cy="110" rx="28" ry="14" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Button top (the actual pressable button) -->
  <ellipse cx="145" cy="104" rx="24" ry="11" fill="#f8130d" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Button depression lines (showing it's being pressed) -->
  <line x1="136" y1="104" x2="154" y2="104" stroke="#1a1a1a" stroke-width="2.22" stroke-linecap="round"/>
  <line x1="138" y1="100" x2="152" y2="100" stroke="#1a1a1a" stroke-width="2.22" stroke-linecap="round"/>

  <!-- HAND pressing snooze button (coming from above) -->
  <!-- Arm -->
  <path d="M145 60 L145 92" stroke="#eed5b6" stroke-width="17.77" fill="none" stroke-linecap="round"/>
  <path d="M145 60 L118 24" stroke="#eed5b6" stroke-width="15.55" fill="none" stroke-linecap="round"/>
  <!-- Hand palm pressing down -->
  <ellipse cx="145" cy="94" rx="22" ry="14" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Fingers (4 fingers curled down) -->
  <!-- Index finger -->
  <path d="M130 90 Q126 78 130 72 Q134 72 134 82" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Middle finger -->
  <path d="M140 88 Q136 74 140 68 Q145 68 145 80" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Ring finger -->
  <path d="M150 88 Q148 74 152 68 Q156 70 156 82" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Pinky -->
  <path d="M160 92 Q160 80 162 76 Q166 78 166 88" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Thumb -->
  <path d="M126 96 Q116 88 118 80 Q124 78 128 86" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Arm outline -->
  <line x1="133" y1="60" x2="145" y2="90" stroke="#1a1a1a" stroke-width="5.55" fill="none" stroke-linecap="round"/>
  <line x1="157" y1="60" x2="145" y2="90" stroke="#1a1a1a" stroke-width="5.55" fill="none" stroke-linecap="round"/>

  <!-- SMALL Z wisp (sleep wisp - drawn as zig-zag polygon, NOT text) -->
  <!-- Z shape 1 (large) -->
  <polyline points="192,28 212,28 196,46 216,46" fill="none" stroke="#2a4ec0" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Z shape 2 (small) -->
  <polyline points="222,18 234,18 224,30 236,30" fill="none" stroke="#2a4ec0" stroke-width="3.33" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Clock feet -->
  <ellipse cx="122" cy="228" rx="12" ry="6" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="114" y="220" width="16" height="10" rx="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="168" cy="228" rx="12" ry="6" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="160" y="220" width="16" height="10" rx="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
</g></svg>