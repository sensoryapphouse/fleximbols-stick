<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Single glucose test strip, angled slightly, large and clear -->
  <!-- Strip body: long thin rectangle, tilted ~15 degrees -->
  <g transform="rotate(-15, 145, 120)">
    <!-- Strip backing -->
    <rect x="90" y="48" width="110" height="34" rx="8" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
    <!-- Contact end (left/insertion end): darker band -->
    <rect x="90" y="48" width="32" height="34" rx="8" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
    <!-- Contact fingers (gold lines) -->
    <line x1="100" y1="54" x2="100" y2="76" stroke="#f7de58" stroke-width="4.45" stroke-linecap="round"/>
    <line x1="110" y1="54" x2="110" y2="76" stroke="#f7de58" stroke-width="4.45" stroke-linecap="round"/>
    <line x1="120" y1="54" x2="120" y2="76" stroke="#f7de58" stroke-width="4.45" stroke-linecap="round"/>
    <!-- Reactive zone (right end): cream/tan with red reactive pad -->
    <rect x="166" y="50" width="30" height="30" rx="6" fill="#e6b98a" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
    <!-- Reactive pad colour (enzyme zone) -->
    <rect x="170" y="54" width="22" height="22" rx="4" fill="#f8130d" stroke="none"/>
    <!-- Blood drop sitting on the reactive tip -->
    <path d="M196,65 Q204,53 196,44 Q188,53 196,65 Z" fill="#d01424" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  </g>
  <!-- Shadow/ground line beneath strip -->
  <ellipse cx="145" cy="190" rx="70" ry="8" fill="#b8b8b8" stroke="none"/>
</g></svg>