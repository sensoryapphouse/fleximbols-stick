<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Moussaka: square slice with visible layers - eggplant, meat, béchamel top -->
  <!-- Plate -->
  <ellipse cx="145" cy="215" rx="115" ry="16" fill="#efefef" stroke="#1a1a1a" stroke-width="11.11" stroke-linejoin="round"/>
  <!-- Main block - the slice -->
  <!-- Back face (side visible) -->
  <path d="M75,195 L75,85 L215,85 L215,195 Z" fill="#eed5b6" stroke="#1a1a1a" stroke-width="11.11" stroke-linejoin="round"/>

  <!-- Layer 1 bottom - eggplant (dark purple-grey, visible on side) -->
  <rect x="75" y="170" width="140" height="25" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="8.89" stroke-linejoin="round"/>
  <!-- Layer 2 - meat/tomato sauce -->
  <rect x="75" y="140" width="140" height="30" fill="#d01424" stroke="#1a1a1a" stroke-width="8.89" stroke-linejoin="round"/>
  <!-- Meat texture in sauce layer -->
  <rect x="85" y="145" width="22" height="8" rx="3" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="118" y="147" width="20" height="7" rx="3" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="150" y="144" width="24" height="8" rx="3" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="185" y="146" width="18" height="7" rx="3" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Layer 3 - another eggplant layer -->
  <rect x="75" y="115" width="140" height="25" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="8.89" stroke-linejoin="round"/>
  <!-- Eggplant slice hints -->
  <rect x="85" y="118" width="30" height="18" rx="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="125" y="118" width="30" height="18" rx="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="162" y="118" width="30" height="18" rx="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Layer 4 top - golden béchamel -->
  <rect x="75" y="85" width="140" height="30" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="11.11" stroke-linejoin="round"/>
  <!-- Béchamel golden top surface -->
  <rect x="75" y="85" width="140" height="14" rx="2" fill="#f7de58" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- Béchamel golden-brown spots -->
  <ellipse cx="105" cy="92" rx="14" ry="7" fill="#e65a00" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="145" cy="90" rx="18" ry="6" fill="#ff9900" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="185" cy="92" rx="13" ry="6" fill="#e65a00" stroke="#1a1a1a" stroke-width="4.45"/>
</g></svg>