<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Oscilloscope: benchtop with screen showing sine waveform + knobs -->
  <!-- Main body -->
  <rect x="25" y="45" width="240" height="170" rx="10" ry="10" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Screen bezel -->
  <rect x="35" y="55" width="160" height="120" rx="8" ry="8" fill="#000000" stroke="#1a1a1a" stroke-width="7.40"/>
  <!-- Screen face -->
  <rect x="40" y="60" width="150" height="110" rx="5" ry="5" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Screen grid lines (graticule) -->
  <line x1="40" y1="88" x2="190" y2="88" stroke="#2a4ec0" stroke-width="1.48"/>
  <line x1="40" y1="115" x2="190" y2="115" stroke="#2a4ec0" stroke-width="1.48"/>
  <line x1="40" y1="143" x2="190" y2="143" stroke="#2a4ec0" stroke-width="1.48"/>
  <line x1="70" y1="60" x2="70" y2="170" stroke="#2a4ec0" stroke-width="1.48"/>
  <line x1="100" y1="60" x2="100" y2="170" stroke="#2a4ec0" stroke-width="1.48"/>
  <line x1="130" y1="60" x2="130" y2="170" stroke="#2a4ec0" stroke-width="1.48"/>
  <line x1="160" y1="60" x2="160" y2="170" stroke="#2a4ec0" stroke-width="1.48"/>
  <!-- Sine waveform on screen (channel 1 - yellow) -->
  <path d="M42,115 C52,115 58,75 70,75 C82,75 88,155 100,155 C112,155 118,75 130,75 C142,75 148,155 160,155 C172,155 178,95 188,115" fill="none" stroke="#f7de58" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Channel 2 sine slightly offset (blue) -->
  <path d="M42,125 C52,125 58,90 70,90 C82,90 88,160 100,160 C112,160 118,90 130,90 C142,90 148,160 160,160 C170,160 178,130 188,125" fill="none" stroke="#90a7d6" stroke-width="2.96" stroke-linecap="round"/>
  <!-- Knob panel (right side) -->
  <!-- Large vertical scale knob -->
  <circle cx="220" cy="85" r="14" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.93"/>
  <line x1="220" y1="74" x2="220" y2="80" stroke="#ffffff" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Time/div knob -->
  <circle cx="220" cy="120" r="14" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.93"/>
  <line x1="220" y1="109" x2="220" y2="115" stroke="#ffffff" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Trigger knob -->
  <circle cx="220" cy="155" r="10" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.93"/>
  <line x1="220" y1="148" x2="220" y2="152" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- CH1/CH2 input BNCs -->
  <circle cx="65" cy="192" r="9" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.93"/>
  <circle cx="65" cy="192" r="4" fill="#000000"/>
  <circle cx="100" cy="192" r="9" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.93"/>
  <circle cx="100" cy="192" r="4" fill="#000000"/>
  <!-- Power button -->
  <circle cx="165" cy="192" r="10" fill="#529929" stroke="#1a1a1a" stroke-width="5.93"/>
  <!-- Power indicator LED -->
  <circle cx="180" cy="192" r="5" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Feet -->
  <rect x="35" y="208" width="30" height="7" rx="3" fill="#000000" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="225" y="208" width="30" height="7" rx="3" fill="#000000" stroke="#1a1a1a" stroke-width="4.45"/>
</g></svg>