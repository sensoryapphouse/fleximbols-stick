  <circle cx="70" cy="45" r="4" fill="#f266aa" stroke="#1a1a1a" stroke-width="3.33"/>
  <circle cx="210" cy="45" r="4" fill="#f266aa" stroke="#1a1a1a" stroke-width="3.33"/>
  <circle cx="70" cy="195" r="4" fill="#f266aa" stroke="#1a1a1a" stroke-width="3.33"/>
  <circle cx="210" cy="195" r="4" fill="#f266aa" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Two interlocking wedding rings at top of card -->
  <circle cx="130" cy="75" r="13" fill="none" stroke="#f2e40d" stroke-width="8.89"/>
  <circle cx="148" cy="75" r="13" fill="none" stroke="#f2e40d" stroke-width="8.89"/>
  <circle cx="130" cy="75" r="13" fill="none" stroke="#1a1a1a" stroke-width="2.22"/>
  <circle cx="148" cy="75" r="13" fill="none" stroke="#1a1a1a" stroke-width="2.22"/>
  <!-- Heart between rings -->
  <path d="M 140,98 L 134,92 Q 130,88 134,84 Q 138,80 140,86 Q 142,80 146,84 Q 150,88 146,92 Z" fill="#d01424" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <path d="M 75,170 Q 145,180 215,170" fill="none" stroke="#7c3fac" stroke-width="5.56" stroke-linecap="round"/>
  <!-- Small flowers along decoration -->
  <circle cx="100" cy="178" r="3" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="3.33"/>
