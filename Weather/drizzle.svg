<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Bottle/container tilted, pouring a thin continuous drizzle -->
  <!-- Bottle (tilted ~45°, upper left) -->
  <g transform="rotate(40, 95, 60)">
    <!-- Bottle body -->
    <rect x="65" y="20" width="36" height="70" rx="10" fill="#dff3fd" stroke="#1a1a1a" stroke-width="6.34" stroke-linejoin="round"/>
    <!-- Bottle neck -->
    <rect x="74" y="8" width="18" height="18" rx="5" fill="#dff3fd" stroke="#1a1a1a" stroke-width="6.34" stroke-linejoin="round"/>
    <!-- Bottle cap -->
    <rect x="72" y="4" width="22" height="8" rx="3" fill="#ff9900" stroke="#1a1a1a" stroke-width="5.08" stroke-linejoin="round"/>
    <!-- Liquid inside bottle -->
    <rect x="67" y="48" width="32" height="38" rx="8" fill="#ff9900" stroke="none"/>
    <!-- Bottle label -->
    <rect x="70" y="36" width="26" height="22" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.54" stroke-linejoin="round"/>
    <line x1="74" y1="42" x2="92" y2="42" stroke="#1a1a1a" stroke-width="2.54" stroke-linecap="round"/>
    <line x1="74" y1="48" x2="92" y2="48" stroke="#1a1a1a" stroke-width="2.54" stroke-linecap="round"/>
    <line x1="74" y1="54" x2="92" y2="54" stroke="#1a1a1a" stroke-width="2.54" stroke-linecap="round"/>
  </g>

  <!-- Thin continuous drizzle stream (wavy line falling down) -->
  <!-- Stream exits the tilted bottle spout and flows down-right in a continuous wavy line -->
  <path d="M128 55 Q135 80 125 105 Q115 130 130 155 Q145 178 135 200 Q128 218 132 232"
        fill="none" stroke="#ff9900" stroke-width="8.88" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Inner highlight of stream -->
  <path d="M128 55 Q135 80 125 105 Q115 130 130 155 Q145 178 135 200 Q128 218 132 232"
        fill="none" stroke="#f2e40d" stroke-width="3.81" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6,8"/>

  <!-- Drizzle pool/surface collecting at bottom -->
  <ellipse cx="132" cy="234" rx="22" ry="6" fill="#ff9900" stroke="#1a1a1a" stroke-width="5.08" stroke-linejoin="round"/>

  <!-- Small drizzle droplets on food surface (plate/food below) -->
  <!-- Plate/surface being drizzled on -->
  <ellipse cx="175" cy="198" rx="60" ry="14" fill="#efefef" stroke="#1a1a1a" stroke-width="5.08" stroke-linejoin="round"/>
  <!-- Food on plate -->
  <ellipse cx="175" cy="194" rx="44" ry="10" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="3.81" stroke-linejoin="round"/>
  <!-- Drizzle marks on food -->
  <path d="M148 192 Q162 188 176 192 Q190 196 204 192" fill="none" stroke="#ff9900" stroke-width="5.08" stroke-linecap="round"/>
  <path d="M152 196 Q168 192 182 196" fill="none" stroke="#ff9900" stroke-width="3.81" stroke-linecap="round"/>
</g></svg>