<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Modern mason jar: clear body, banded screw lid, measurement ridges -->

  <!-- Screw band (outer ring of lid) -->
  <rect x="82" y="28" width="126" height="22" rx="6" ry="6" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Band screw thread lines -->
  <line x1="100" y1="28" x2="97" y2="50" stroke="#7f7f7f" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="120" y1="28" x2="118" y2="50" stroke="#7f7f7f" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="140" y1="28" x2="140" y2="50" stroke="#7f7f7f" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="160" y1="28" x2="162" y2="50" stroke="#7f7f7f" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="180" y1="28" x2="183" y2="50" stroke="#7f7f7f" stroke-width="3.33" stroke-linecap="round"/>

  <!-- Lid flat top disc -->
  <rect x="88" y="22" width="114" height="14" rx="5" ry="5" fill="#efefef" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Lid centre button (sealed indicator) -->
  <ellipse cx="145" cy="22" rx="18" ry="5" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- Jar neck (narrower section below lid) -->
  <path d="M90 50 L78 72 L212 72 L200 50 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>

  <!-- Jar body (slightly tapered, wider in middle) -->
  <path d="M78 72 L62 210 L228 210 L212 72 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>

  <!-- Contents (water/liquid fill, lower portion) -->
  <path d="M66 165 L62 210 L228 210 L224 165 Z" fill="#90a7d6" stroke="none"/>
  <!-- Liquid surface line -->
  <line x1="66" y1="165" x2="224" y2="165" stroke="#2a4ec0" stroke-width="3.33" stroke-linecap="round"/>

  <!-- Measurement ridges on jar body (horizontal embossed lines) -->
  <line x1="68" y1="120" x2="222" y2="120" stroke="#b8b8b8" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="65" y1="148" x2="225" y2="148" stroke="#b8b8b8" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="64" y1="176" x2="226" y2="176" stroke="#b8b8b8" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Measurement tick marks (right side) -->
  <line x1="218" y1="120" x2="228" y2="120" stroke="#7f7f7f" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="220" y1="148" x2="230" y2="148" stroke="#7f7f7f" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="221" y1="176" x2="231" y2="176" stroke="#7f7f7f" stroke-width="3.33" stroke-linecap="round"/>

  <!-- Jar base -->
  <rect x="62" y="206" width="166" height="10" rx="4" ry="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>

  <!-- Highlight on jar (shine) -->
  <path d="M88 80 Q82 130 84 160" fill="none" stroke="#ffffff" stroke-width="4.45" stroke-linecap="round"/>
</g></svg>