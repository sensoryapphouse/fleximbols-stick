  <!-- Lipstick outer case bottom -->
  <rect x="95" y="140" width="100" height="75" rx="8" ry="8" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Case shine line -->
