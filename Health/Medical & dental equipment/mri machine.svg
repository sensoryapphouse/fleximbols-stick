  <ellipse cx="145" cy="128" rx="70" ry="70" fill="none" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Front face panel detail top -->
  <rect x="42" y="62" width="188" height="16" rx="5" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Front face panel detail bottom -->
  <rect x="42" y="172" width="188" height="16" rx="5" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45"/>
