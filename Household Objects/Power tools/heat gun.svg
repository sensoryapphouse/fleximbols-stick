<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Heat gun: handheld pistol-shaped hot-air gun with wide nozzle + heat waves -->
  <!-- Main body / barrel -->
  <rect x="90" y="70" width="120" height="52" rx="14" ry="14" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Wide nozzle -->
  <path d="M90,74 L52,80 L52,112 L90,118 Z" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Nozzle opening -->
  <ellipse cx="52" cy="96" rx="6" ry="16" fill="#000000" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Nozzle ring accent -->
  <line x1="68" y1="76" x2="68" y2="116" stroke="#b8b8b8" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Pistol grip / handle -->
  <path d="M155,120 Q158,160 148,185 Q144,195 148,200 L170,200 Q174,195 172,185 Q165,160 165,120 Z" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Trigger guard -->
  <path d="M158,130 Q142,148 150,162 Q155,168 165,165" fill="none" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Trigger -->
  <rect x="153" y="130" width="10" height="22" rx="4" ry="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Rear vent slits -->
  <line x1="196" y1="80" x2="196" y2="112" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="203" y1="80" x2="203" y2="112" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Power cord from base of grip -->
  <path d="M158,200 Q155,218 170,222 Q185,225 200,218" fill="none" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <!-- Heat waves from nozzle -->
  <path d="M36,88 Q20,78 28,66 Q36,54 22,44" fill="none" stroke="#f8130d" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M42,93 Q26,81 34,69 Q42,57 28,47" fill="none" stroke="#e65a00" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M48,98 Q32,88 40,76 Q48,64 34,54" fill="none" stroke="#f7de58" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M36,103 Q20,95 28,83 Q36,71 24,62" fill="none" stroke="#f8130d" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Body accent stripe -->
  <rect x="105" y="70" width="10" height="52" rx="3" fill="#7f7f7f" stroke="none"/>
  <!-- Speed selector switch -->
  <rect x="172" y="85" width="30" height="14" rx="5" ry="5" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <circle cx="183" cy="92" r="5" fill="#529929" stroke="#1a1a1a" stroke-width="3.33"/>
</g></svg>