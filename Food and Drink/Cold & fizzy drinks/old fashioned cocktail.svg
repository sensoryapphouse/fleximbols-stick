  <!-- amber whiskey liquid -->
  <path d="M76 90 L78 213 L212 213 L214 90 Z" fill="#e65a00" stroke="#1a1a1a" stroke-width="2.96" stroke-linejoin="round"/>
  <!-- liquid surface ellipse -->
