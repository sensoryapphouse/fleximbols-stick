  <!-- Sun arc path -->
  <path d="M 45 155 Q 145 30 245 155" fill="none" stroke="#ff9900" stroke-width="4.45" stroke-linecap="round" stroke-dasharray="10 7"/>
  <!-- Sun disc at apex -->
  <circle cx="145" cy="55" r="28" fill="#f7de58" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Sun rays -->
  <line x1="145" y1="18" x2="145" y2="10" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="172" y1="28" x2="178" y2="22" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="183" y1="55" x2="191" y2="55" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="172" y1="82" x2="178" y2="88" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="118" y1="28" x2="112" y2="22" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="107" y1="55" x2="99" y2="55" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="118" y1="82" x2="112" y2="88" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
