  <path d="M216,32 Q210,30 210,34 L206,96 Q206,112 226,116 Q246,112 246,96 L242,34 Q242,30 238,32 Q228,38 216,32 Z" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="8.89" stroke-linejoin="round" stroke-linecap="round"/>
