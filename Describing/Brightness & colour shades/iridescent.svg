<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Bubble segments drawn as arcs using clipPath simulation via overlapping wedge shapes -->
  <!-- Full circle base -->
  <circle cx="145" cy="120" r="90" fill="#dff3fd" stroke="#1a1a1a" stroke-width="8.89"/>
  <!-- Colour band wedges — pie slices of the circle -->
  <!-- Blue band top -->
  <path d="M145,120 L145,30 A90,90 0 0,1 235,120 Z" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Purple band right -->
  <path d="M145,120 L235,120 A90,90 0 0,1 145,210 Z" fill="#7c3fac" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Teal band bottom -->
  <path d="M145,120 L145,210 A90,90 0 0,1 55,120 Z" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Pink band left -->
  <path d="M145,120 L55,120 A90,90 0 0,1 145,30 Z" fill="#f266aa" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Outer circle border redrawn clean on top -->
  <circle cx="145" cy="120" r="90" fill="none" stroke="#1a1a1a" stroke-width="8.89"/>
  <!-- White highlight glint (soap bubble sheen) -->
  <ellipse cx="108" cy="76" rx="22" ry="13" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.56"/>
  <!-- Small secondary glint -->
  <ellipse cx="92" cy="90" rx="8" ry="5" fill="#ffffff" stroke="none"/>
</g></svg>