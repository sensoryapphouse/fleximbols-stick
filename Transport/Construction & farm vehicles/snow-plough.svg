<line x1="330" y1="250" x2="410" y2="250" stroke="#1a1a1a" stroke-width="6"/>
<!-- amber beacon -->
<rect x="206" y="222" width="20" height="16" rx="4" fill="#f4c430" stroke="#1a1a1a" stroke-width="6"/>
