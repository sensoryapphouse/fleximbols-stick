<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Bowl of melted chocolate -->
  <path d="M50 130 Q50 200 110 210 Q130 212 150 210 Q210 200 210 130 Z" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Bowl rim -->
  <ellipse cx="130" cy="130" rx="80" ry="14" fill="#7d5e23" stroke="#1a1a1a" stroke-width="7.40"/>
  <!-- Chocolate surface -->
  <ellipse cx="130" cy="130" rx="72" ry="10" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Heat waves rising -->
  <path d="M85 110 Q80 100 88 92 Q80 84 88 76" fill="none" stroke="#d01424" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M110 105 Q105 95 113 87 Q105 79 113 71" fill="none" stroke="#d01424" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Thermometer -->
  <rect x="225" y="50" width="14" height="120" rx="6" ry="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Mercury column -->
  <rect x="229" y="90" width="6" height="78" fill="#d01424" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- Thermometer bulb -->
  <circle cx="232" cy="180" r="14" fill="#d01424" stroke="#1a1a1a" stroke-width="5.93"/>
  <!-- Tick marks -->
  <line x1="239" y1="70" x2="245" y2="70" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="239" y1="90" x2="245" y2="90" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="239" y1="110" x2="245" y2="110" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="239" y1="130" x2="245" y2="130" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="239" y1="150" x2="245" y2="150" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
  <!-- Cycle arrow: heat up then cool then reheat (circular arrow around bowl) -->
  <path d="M40 60 Q20 100 30 150 Q35 180 60 200" fill="none" stroke="#ff9900" stroke-width="5.93" stroke-linecap="round"/>
  <path d="M55 195 L60 202 L66 196" fill="none" stroke="#ff9900" stroke-width="5.93" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Snowflake/cooling indicator -->
  <g stroke="#2a4ec0" stroke-width="4.45" stroke-linecap="round" fill="none">
    <line x1="50" y1="30" x2="50" y2="55"/>
    <line x1="38" y1="42" x2="62" y2="42"/>
    <line x1="42" y1="34" x2="58" y2="50"/>
    <line x1="58" y1="34" x2="42" y2="50"/>
  </g>
</g></svg>