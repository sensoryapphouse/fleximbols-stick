  <path d="M 229 40 L 220 35 M 229 50 L 220 45 M 229 60 L 220 55 M 229 70 L 220 65 M 229 40 L 238 35 M 229 50 L 238 45 M 229 60 L 238 55 M 229 70 L 238 65 M 229 80 L 220 75 M 229 80 L 238 75 M 229 95 L 220 90 M 229 95 L 238 90 M 229 110 L 220 105 M 229 110 L 238 105 M 229 125 L 220 120 M 229 125 L 238 120 M 229 140 L 220 135 M 229 140 L 238 135" stroke="#137827" stroke-width="4.45" stroke-linecap="round"/>
