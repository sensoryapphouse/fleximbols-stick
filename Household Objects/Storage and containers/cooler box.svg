  <rect x="194" y="38" width="18" height="34" fill="#137827" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="194" y="38" width="18" height="4" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="2.96"/>
