  <!-- Individual yogurt cup: tapered tub with foil lid, spoon, YOGURT label -->
  <!-- Cup body (tapered tub) -->
  <path d="M75 80 L95 215 L195 215 L215 80 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="8.08" stroke-linejoin="round"/>
  <path d="M85 110 L101 200 L189 200 L205 110 Z" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="4.85" stroke-linejoin="round"/>
  <!-- Foil lid (top oval) -->
  <ellipse cx="145" cy="80" rx="72" ry="14" fill="#efefef" stroke="#1a1a1a" stroke-width="8.08"/>
  <!-- Foil pull tab -->
  <path d="M210 78 L240 60 L245 70 L215 86 Z" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="6.47" stroke-linejoin="round"/>
  <!-- Foil radial pattern -->
  <line x1="145" y1="70" x2="145" y2="90" stroke="#b8b8b8" stroke-width="3.23"/>
  <line x1="100" y1="75" x2="190" y2="85" stroke="#b8b8b8" stroke-width="3.23"/>
  <line x1="100" y1="85" x2="190" y2="75" stroke="#b8b8b8" stroke-width="3.23"/>
  <!-- Spoon beside cup -->
  <line x1="248" y1="200" x2="232" y2="120" stroke="#7f7f7f" stroke-width="9.69" stroke-linecap="round"/>
  <ellipse cx="229" cy="113" rx="9" ry="6" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.85"/>
  <!-- Cup bottom rim -->
  <ellipse cx="145" cy="215" rx="50" ry="6" fill="#dff3fd" stroke="#1a1a1a" stroke-width="6.47"/>

  <!-- fresh berry on lid (yogurt flavour indicator) -->
  <circle cx="100" cy="55" r="8" fill="#d01424" stroke="#1a1a1a" stroke-width="4.04"/>
  <path d="M97 48 Q100 42 103 48" fill="none" stroke="#529929" stroke-width="4.04" stroke-linecap="round"/>
  <circle cx="116" cy="60" r="6" fill="#7c3fac" stroke="#1a1a1a" stroke-width="3.23"/>
  <circle cx="84" cy="62" r="6" fill="#d01424" stroke="#1a1a1a" stroke-width="3.23"/>
</g></svg>