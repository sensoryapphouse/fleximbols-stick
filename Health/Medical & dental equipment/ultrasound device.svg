<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Ultrasound device: cart with screen + handheld transducer probe on a cord -->
  <!-- Cart body -->
  <rect x="60" y="80" width="110" height="120" rx="8" fill="#efefef" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Screen bezel on cart -->
  <rect x="70" y="88" width="90" height="68" rx="5" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Screen display (blue-ish ultrasound image suggestion) -->
  <rect x="75" y="93" width="80" height="58" rx="3" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Ultrasound wave arcs on screen -->
  <path d="M 95 150 Q 115 120 135 150" fill="none" stroke="#90a7d6" stroke-width="3.33" stroke-linecap="round"/>
  <path d="M 90 155 Q 115 115 140 155" fill="none" stroke="#dff3fd" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Keyboard/control panel on cart -->
  <rect x="70" y="162" width="90" height="28" rx="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Buttons on panel -->
  <rect x="76" y="168" width="12" height="8" rx="2" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="3.33"/>
  <rect x="94" y="168" width="12" height="8" rx="2" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="3.33"/>
  <rect x="112" y="168" width="12" height="8" rx="2" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="3.33"/>
  <rect x="130" y="168" width="22" height="8" rx="2" fill="#529929" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Cart column/stem -->
  <rect x="106" y="200" width="18" height="15" rx="3" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Cart base -->
  <rect x="75" y="213" width="80" height="10" rx="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Wheels -->
  <circle cx="92" cy="223" r="8" fill="#000000" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="138" cy="223" r="8" fill="#000000" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Probe cord curving from cart to probe -->
  <path d="M 170 130 Q 200 100 210 80 Q 218 62 225 68" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Handheld transducer probe body -->
  <rect x="216" y="50" width="22" height="50" rx="8" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Probe head (emitter face) -->
  <rect x="216" y="92" width="22" height="14" rx="5" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Probe grip ridges -->
  <line x1="220" y1="62" x2="234" y2="62" stroke="#7f7f7f" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="220" y1="70" x2="234" y2="70" stroke="#7f7f7f" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="220" y1="78" x2="234" y2="78" stroke="#7f7f7f" stroke-width="3.33" stroke-linecap="round"/>
</g></svg>