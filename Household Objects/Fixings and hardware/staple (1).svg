<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Stack of papers on surface -->
  <!-- Bottom sheet -->
  <rect x="40" y="160" width="210" height="55" rx="4" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Middle sheet -->
  <rect x="40" y="150" width="210" height="55" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Top sheet -->
  <rect x="40" y="140" width="210" height="55" rx="4" fill="#dff3fd" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Metal staple on top-left of papers -->
  <path d="M68,140 L68,155 L90,155 L90,140" fill="none" stroke="#7f7f7f" stroke-width="6.66" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Staple legs going through papers (darker) -->
  <line x1="68" y1="155" x2="68" y2="195" stroke="#4d4d4d" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="90" y1="155" x2="90" y2="195" stroke="#4d4d4d" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Stapler body - upper jaw -->
  <rect x="30" y="52" width="230" height="52" rx="12" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Stapler top surface -->
  <rect x="38" y="44" width="214" height="30" rx="10" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Stapler body - lower jaw/base -->
  <rect x="30" y="104" width="230" height="38" rx="10" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Stapler hinge at back -->
  <ellipse cx="248" cy="104" rx="14" ry="12" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Stapler nose/anvil area -->
  <rect x="30" y="100" width="40" height="18" rx="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Staple reload strip visible on side -->
  <line x1="55" y1="62" x2="220" y2="62" stroke="#b8b8b8" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Arrow showing press action -->
  <polygon points="145,22 155,40 135,40" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round" stroke-linejoin="round"/>
</g></svg>