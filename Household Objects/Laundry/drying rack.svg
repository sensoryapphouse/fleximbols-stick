  <!-- drying rack: folding accordion drying rack with wet clothes hanging -->

  <!-- Back A-frame leg (lighter) -->
  <g stroke="#1a1a1a" stroke-width="5.93" stroke-linecap="round">
    <path d="M65 215 L100 70" stroke-width="7.40"/>
    <path d="M225 215 L190 70" stroke-width="7.40"/>
  </g>
  <!-- Back frame inner color -->
  <path d="M65 215 L100 70" fill="none" stroke="#b8b8b8" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M225 215 L190 70" fill="none" stroke="#b8b8b8" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Front A-frame leg -->
  <path d="M50 215 L85 70" fill="none" stroke="#1a1a1a" stroke-width="8.88" stroke-linecap="round"/>
  <path d="M240 215 L205 70" fill="none" stroke="#1a1a1a" stroke-width="8.88" stroke-linecap="round"/>
  <path d="M50 215 L85 70" fill="none" stroke="#7f7f7f" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M240 215 L205 70" fill="none" stroke="#7f7f7f" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Top apex (where A-frame pivots) -->
  <circle cx="92" cy="70" r="6" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.96"/>
  <circle cx="198" cy="70" r="6" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.96"/>

  <!-- Horizontal drying bars (4 rungs) -->
  <g stroke="#1a1a1a" stroke-width="5.93" stroke-linecap="round">
    <line x1="92" y1="85" x2="198" y2="85"/>
    <line x1="88" y1="120" x2="202" y2="120"/>
    <line x1="82" y1="155" x2="208" y2="155"/>
    <line x1="76" y1="190" x2="214" y2="190"/>
  </g>
  <!-- Inner bar color -->
  <g stroke="#b8b8b8" stroke-width="2.96" stroke-linecap="round">
    <line x1="92" y1="85" x2="198" y2="85"/>
    <line x1="88" y1="120" x2="202" y2="120"/>
    <line x1="82" y1="155" x2="208" y2="155"/>
    <line x1="76" y1="190" x2="214" y2="190"/>
  </g>

  <!-- Wet clothes hanging - towel on top bar -->
  <path d="M115 85 L115 130 L150 130 L150 85"
        fill="#3aa6a0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- water drip from towel -->
  <path d="M125 130 L125 138 Q125 142 122 142 Q120 142 120 138 Z"
