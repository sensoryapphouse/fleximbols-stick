  <!-- thin wiry stem -->
  <line x1="145" y1="190" x2="145" y2="228" stroke="#1a1a1a" stroke-width="8.89" stroke-linecap="round"/>
  <!-- feathery thread-like leaves (pinnate, very fine) -->
