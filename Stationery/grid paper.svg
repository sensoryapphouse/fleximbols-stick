    <line x1="95" y1="30" x2="95" y2="210"/>
    <line x1="120" y1="30" x2="120" y2="210"/>
    <line x1="145" y1="30" x2="145" y2="210"/>
    <line x1="170" y1="30" x2="170" y2="210"/>
    <line x1="195" y1="30" x2="195" y2="210"/>
    <line x1="220" y1="30" x2="220" y2="210"/>
    <line x1="50" y1="50" x2="240" y2="50"/>
    <line x1="50" y1="75" x2="240" y2="75"/>
    <line x1="50" y1="100" x2="240" y2="100"/>
    <line x1="50" y1="125" x2="240" y2="125"/>
    <line x1="50" y1="150" x2="240" y2="150"/>
