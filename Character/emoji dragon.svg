<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Dragon face: green, horns, sharp teeth, eye, smoke from nostril -->
  <!-- Horns -->
  <polygon points="105,30 92,8 78,35" fill="#67832d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polygon points="185,30 198,8 212,35" fill="#67832d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Head -->
  <ellipse cx="145" cy="138" rx="108" ry="90" fill="#529929" stroke="#1a1a1a" stroke-width="5.08"/>
  <!-- Brow ridge -->
  <path d="M80 100 Q145 82 210 100" fill="none" stroke="#67832d" stroke-width="10.15" stroke-linecap="round"/>
  <!-- Eye left (angry slant) -->
  <ellipse cx="112" cy="115" rx="20" ry="16" fill="#f2e40d" stroke="#1a1a1a" stroke-width="3.81"/>
  <ellipse cx="112" cy="115" rx="8" ry="14" fill="#000000"/>
  <circle cx="115" cy="110" r="3" fill="#ffffff"/>
  <!-- Nostril smoke -->
  <ellipse cx="120" cy="160" rx="11" ry="8" fill="#67832d" stroke="#1a1a1a" stroke-width="2.54"/>
  <path d="M118 152 Q112 140 118 128 Q124 116 116 106" fill="none" stroke="#b8b8b8" stroke-width="5.08" stroke-linecap="round"/>
  <!-- Snout -->
  <ellipse cx="145" cy="175" rx="64" ry="38" fill="#67832d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Teeth -->
  <path d="M98 175 L98 185 Q105 195 112 185 Q119 195 126 185 Q133 195 140 185 Q147 195 154 185 Q161 195 168 185 Q175 195 182 185 Q189 195 192 185 L192 175" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.18" stroke-linejoin="round"/>
  <!-- Mouth line -->
  <path d="M95 175 Q145 162 195 175" fill="none" stroke="#1a1a1a" stroke-width="3.81" stroke-linecap="round"/>
  <!-- Second eye partially covered by snout -->
  <ellipse cx="178" cy="115" rx="20" ry="16" fill="#f2e40d" stroke="#1a1a1a" stroke-width="3.81"/>
  <ellipse cx="178" cy="115" rx="8" ry="14" fill="#000000"/>
  <circle cx="181" cy="110" r="3" fill="#ffffff"/>
</g></svg>