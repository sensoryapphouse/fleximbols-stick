<path d="M 234 232 Q 256 214 278 232 Q 256 250 234 232 Z" fill="none" stroke="#5e5640" stroke-width="6" stroke-linejoin="round"/>
<path d="M 234 232 Q 256 250 278 232" fill="none" stroke="#8a7f60" stroke-width="3"/>
