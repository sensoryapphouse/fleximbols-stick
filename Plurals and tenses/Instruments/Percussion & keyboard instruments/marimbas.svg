  <!-- MARIMBA-MODERN: wide warm-brown wooden bars + LONG graduated resonator tubes (key differentiator), wood frame, yarn mallets -->

  <!-- Stand legs -->
  <line x1="52" y1="205" x2="38" y2="232" stroke="#1a1a1a" stroke-width="7.40" stroke-linecap="round"/>
  <line x1="238" y1="205" x2="252" y2="232" stroke="#1a1a1a" stroke-width="7.40" stroke-linecap="round"/>
  <line x1="38" y1="232" x2="85" y2="232" stroke="#1a1a1a" stroke-width="7.40" stroke-linecap="round"/>
  <line x1="205" y1="232" x2="252" y2="232" stroke="#1a1a1a" stroke-width="7.40" stroke-linecap="round"/>

  <!-- Wood frame rails and uprights -->
  <rect x="44" y="95" width="202" height="9" rx="3" fill="#7d5e23" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <rect x="44" y="200" width="202" height="9" rx="3" fill="#7d5e23" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
