<line x1="58" y1="290" x2="150" y2="290" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
<line x1="58" y1="330" x2="150" y2="330" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
<!-- shoe sole -->
<path d="M 150 360 Q 150 392 184 392 L 430 392 Q 470 392 470 358 Q 470 344 452 340 L 360 318 Q 300 304 264 276 L 214 240 Q 196 228 178 234 Q 158 242 158 268 L 158 320 Z"
      fill="#e8554e" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
