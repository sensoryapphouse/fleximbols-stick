<svg xmlns="http://www.w3.org/2000/svg" viewBox="80.37 32.58 395.64 395.64">
<!-- fabric piece -->
<rect x="110" y="170" width="292" height="172" rx="16" fill="#3d7fb5" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- running stitch line (dashes = stitches) across the fabric -->
<line x1="130" y1="256" x2="382" y2="256" stroke="#f4c430" stroke-width="12" stroke-linecap="round" stroke-dasharray="26 20"/>
<!-- needle pulling thread, entering top-right -->
<line x1="356" y1="256" x2="446" y2="120" stroke="#9aa0a6" stroke-width="11" stroke-linecap="round"/>
<!-- needle eye -->
<ellipse cx="438" cy="132" rx="7" ry="11" fill="#fff" stroke="#1a1a1a" stroke-width="5" transform="rotate(-34 438 132)"/>
<!-- thread trailing from eye to last stitch -->
<path d="M 432 142 Q 400 200 372 256" fill="none" stroke="#f4c430" stroke-width="7" stroke-linecap="round"/>
</svg>
