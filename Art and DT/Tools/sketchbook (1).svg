  <!-- Spine center line -->
  <rect x="140" y="40" width="10" height="160" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Spiral coils along spine -->
  <circle cx="145" cy="65" r="7" fill="none" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="145" cy="90" r="7" fill="none" stroke="#1a1a1a" stroke-width="4.45"/>
