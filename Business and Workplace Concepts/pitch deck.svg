  <!-- Pitch deck modern: stack of slides with chart slide on top -->

  <!-- Bottom slide (back, offset) -->
  <rect x="60" y="75" width="185" height="128" rx="8" ry="8" fill="#efefef" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>

  <!-- Middle slide -->
  <rect x="50" y="62" width="185" height="128" rx="8" ry="8" fill="#dff3fd" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>

  <!-- Top slide (front) -->
  <rect x="40" y="48" width="185" height="128" rx="8" ry="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>

  <!-- Header bar on top slide -->
  <rect x="40" y="48" width="185" height="26" rx="8" ry="8" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <rect x="40" y="63" width="185" height="11" fill="#2a4ec0" stroke="none"/>

  <!-- Chart on top slide: bar chart with upward bars -->
  <rect x="60" y="128" width="18" height="28" fill="#90a7d6" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <rect x="84" y="112" width="18" height="44" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <rect x="108" y="95" width="18" height="61" fill="#529929" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <rect x="132" y="80" width="18" height="76" fill="#137827" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>

  <!-- Trend arrow on chart -->
  <polyline points="60,138 93,120 117,102 145,84" fill="none" stroke="#f8130d" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrowhead -->
  <polygon points="145,84 133,80 139,94" fill="#f8130d" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>

  <!-- Chart baseline -->
  <line x1="55" y1="156" x2="200" y2="156" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Slide dots: three circles bottom of top slide (pagination) -->
  <circle cx="103" cy="168" r="5" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.33"/>
  <circle cx="118" cy="168" r="5" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="3.33"/>
  <circle cx="133" cy="168" r="5" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.33"/>

  <!-- Binding spiral left edge -->
  <circle cx="45" cy="75" r="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="45" cy="98" r="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="45" cy="121" r="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="45" cy="144" r="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
</g></svg>