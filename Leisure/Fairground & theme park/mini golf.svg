  <rect x="147" y="85" width="6" height="28" rx="3" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round" transform="rotate(90,150,120)"/>
  <rect x="147" y="85" width="6" height="28" rx="3" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round" transform="rotate(45,150,120)"/>
  <rect x="147" y="85" width="6" height="28" rx="3" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round" transform="rotate(135,150,120)"/>

