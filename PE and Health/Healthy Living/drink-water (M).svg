<g transform="translate(286 250) rotate(-46) translate(-37 -4)">
  <!-- glass body -->
  <path d="M 4 0 L 70 0 L 61 156 L 13 156 Z" fill="#dff1fb" stroke="#1a1a1a" stroke-width="7" stroke-linejoin="round"/>
  <!-- water -->
  <path d="M 7 6 L 67 6 L 61 150 L 13 150 Z" fill="#7ec8f0"/>
