  <line x1="80" y1="20" x2="80" y2="8" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <line x1="80" y1="132" x2="80" y2="144" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <line x1="24" y1="76" x2="12" y2="76" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <line x1="136" y1="76" x2="148" y2="76" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <line x1="40" y1="36" x2="32" y2="28" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <line x1="120" y1="116" x2="128" y2="124" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <line x1="120" y1="36" x2="128" y2="28" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <line x1="40" y1="116" x2="32" y2="124" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <!-- Sweat drops on sun face area -->
  <path d="M62,88 Q60,98 65,102 Q70,98 68,88 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="2.78" stroke-linejoin="round"/>
  <path d="M78,92 Q76,102 81,106 Q86,102 84,92 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="2.78" stroke-linejoin="round"/>
  <!-- Thermometer tube (tall, right side) -->
  <rect x="176" y="22" width="28" height="158" rx="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Glass tube inner area -->
  <rect x="182" y="40" width="16" height="140" rx="6" fill="#efefef" stroke="#1a1a1a" stroke-width="2.22"/>
  <!-- Red mercury column: reading HIGH (nearly full) -->
  <rect x="182" y="52" width="16" height="128" fill="#f8130d"/>
  <!-- Mercury bulb at base -->
  <circle cx="190" cy="198" r="26" fill="#f8130d" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Tick marks on left of thermometer -->
  <line x1="166" y1="60" x2="176" y2="60" stroke="#4d4d4d" stroke-width="2.78" stroke-linecap="round"/>
  <line x1="166" y1="82" x2="176" y2="82" stroke="#4d4d4d" stroke-width="2.78" stroke-linecap="round"/>
  <line x1="166" y1="104" x2="176" y2="104" stroke="#4d4d4d" stroke-width="2.78" stroke-linecap="round"/>
  <line x1="166" y1="126" x2="176" y2="126" stroke="#4d4d4d" stroke-width="2.78" stroke-linecap="round"/>
  <line x1="166" y1="148" x2="176" y2="148" stroke="#4d4d4d" stroke-width="2.78" stroke-linecap="round"/>
