<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- compact USB-C / Thunderbolt hub -->
  <!-- main hub body -->
  <rect x="25" y="90" width="240" height="60" rx="10" ry="10" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="8.89" stroke-linejoin="round"/>
  <!-- top highlight strip -->
  <rect x="25" y="90" width="240" height="10" rx="10" ry="10" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- thunderbolt logo (lightning bolt) on top -->
  <path d="M140 50 L150 50 L144 70 L155 70 L138 90 L143 75 L133 75 Z" fill="#fff200" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- port row on front face: USB-C, USB-A, HDMI, SD, Ethernet -->
  <!-- USB-C port -->
  <rect x="40" y="115" width="22" height="9" rx="4" ry="4" fill="#000000" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- label tab -->
  <rect x="40" y="130" width="22" height="6" fill="#fff200" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- USB-C port 2 -->
  <rect x="72" y="115" width="22" height="9" rx="4" ry="4" fill="#000000" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="72" y="130" width="22" height="6" fill="#fff200" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- USB-A port -->
  <rect x="104" y="113" width="26" height="13" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="107" y="116" width="20" height="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.22"/>
  <rect x="104" y="130" width="26" height="6" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- HDMI port -->
  <path d="M140 113 L172 113 L174 121 L172 126 L140 126 L138 121 Z" fill="#000000" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="140" y="130" width="34" height="6" fill="#7c3fac" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- SD card slot -->
  <rect x="184" y="115" width="28" height="9" fill="#000000" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="184" y="130" width="28" height="6" fill="#ff9900" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Ethernet port (RJ45) -->
  <path d="M222 113 L250 113 L250 124 L246 128 L226 128 L222 124 Z" fill="#000000" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="222" y="130" width="28" height="6" fill="#529929" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- LED indicator -->
  <circle cx="250" cy="105" r="3" fill="#529929" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- USB-C cable trailing from back-left to off-canvas (host side) -->
  <path d="M30 100 Q 15 80 35 50" fill="none" stroke="#1a1a1a" stroke-width="11.11" stroke-linecap="round"/>
  <rect x="28" y="42" width="14" height="12" rx="2" ry="2" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- subtle base shadow line (NOT a drop shadow ellipse) -->
  <line x1="40" y1="160" x2="250" y2="160" stroke="#1a1a1a" stroke-width="4.45"/>
</g></svg>