<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Atomic whirl: nucleus + three elliptical orbits at different angles -->
  <!-- Orbit 1 (horizontal ellipse) -->
  <ellipse cx="145" cy="120" rx="105" ry="38" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Orbit 2 (rotated ~60deg) -->
  <ellipse cx="145" cy="120" rx="105" ry="38" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round" transform="rotate(60 145 120)"/>
  <!-- Orbit 3 (rotated ~120deg) -->
  <ellipse cx="145" cy="120" rx="105" ry="38" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round" transform="rotate(120 145 120)"/>
  <!-- Nucleus (central dot) -->
  <circle cx="145" cy="120" r="14" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Nucleus highlight -->
  <circle cx="139" cy="114" r="4" fill="#ffffff"/>
  <!-- Electron dots on each orbit -->
  <circle cx="250" cy="120" r="7" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="3.55"/>
  <circle cx="93" cy="86" r="7" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="3.55"/>
  <circle cx="93" cy="154" r="7" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="3.55"/>
</g></svg>