<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- TALL NARROW GLASS FOUNDATION BOTTLE with pump dispenser -->

  <!-- Bottle body (tall, slight shoulder taper at top) -->
  <path d="M100 200 L100 90 Q100 80 108 74 L120 60 L170 60 L182 74 Q190 80 190 90 L190 200 Z" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Bottle base rounded -->
  <rect x="100" y="196" width="90" height="18" rx="8" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Glass shine highlight -->
  <rect x="106" y="80" width="12" height="110" rx="5" fill="#ffffff" stroke="none"/>

  <!-- Beige/skin-tone liquid fill (inside bottle, lower portion) -->
  <path d="M103 200 L103 120 Q103 116 106 114 L105 200 Z" fill="#e6b98a" stroke="none"/>
  <path d="M103 120 L103 200 L187 200 L187 120 Q170 115 145 114 Q120 115 103 120Z" fill="#e6b98a" stroke="none"/>
  <!-- Liquid level line -->
  <path d="M103 120 Q145 114 187 120" fill="none" stroke="#9d7246" stroke-width="3.33" stroke-linecap="round"/>

  <!-- Bottle neck (narrow, above shoulder) -->
  <rect x="126" y="30" width="38" height="34" rx="6" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>

  <!-- PUMP DISPENSER HEAD -->
  <!-- Pump collar/base ring -->
  <rect x="122" y="26" width="46" height="14" rx="6" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Pump tube (vertical, going up) -->
  <rect x="140" y="8" width="10" height="22" rx="4" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Pump nozzle (horizontal elbow at top) -->
  <rect x="148" y="8" width="28" height="10" rx="5" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Pump nozzle tip / dispense hole -->
  <circle cx="175" cy="13" r="5" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Drop of foundation coming from nozzle -->
  <path d="M176 18 Q179 24 176 30 Q173 36 176 30" fill="#e6b98a" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round" stroke-linejoin="round"/>
</g></svg>