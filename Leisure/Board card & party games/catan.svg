  <!-- Catan: hex tile cluster with road + settlement (house) + resource card -->
  <!-- centre hex (pasture green) -->
  <polygon points="145,70 185,93 185,139 145,162 105,139 105,93" fill="#529929" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- upper left hex (forest dark green) -->
  <polygon points="105,47 145,70 145,116 105,139 65,116 65,70" fill="#67832d" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- upper right hex (wheat yellow) -->
  <polygon points="185,47 225,70 225,116 185,139 145,116 145,70" fill="#f7de58" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- lower left hex (clay/brick) -->
  <polygon points="105,139 145,162 145,208 105,231 65,208 65,162" fill="#e65a00" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- lower right hex (ore grey) -->
  <polygon points="185,139 225,162 225,208 185,231 145,208 145,162" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- number token in centre hex -->
  <circle cx="145" cy="116" r="11" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="145" cy="116" r="1.5" fill="#000000"/>
  <circle cx="141" cy="120" r="1.2" fill="#000000"/>
  <circle cx="149" cy="120" r="1.2" fill="#000000"/>
  <!-- road on edge between hexes (red) -->
  <rect x="138" y="155" width="14" height="22" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" transform="rotate(-30 145 166)"/>
  <!-- settlement (house) on a vertex -->
  <path d="M 175 130 L 175 145 L 200 145 L 200 130 L 187 120 Z" fill="#f8130d" stroke="#1a1a1a" stroke-width="5.56" stroke-linejoin="round"/>
  <!-- resource card overlapping bottom-right -->
  <rect x="195" y="175" width="60" height="55" rx="4" fill="#dff3fd" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- wheat sheaf on the card -->
  <path d="M 225 188 L 225 220" stroke="#7d5e23" stroke-width="4.45" stroke-linecap="round"/>
  <ellipse cx="219" cy="195" rx="4" ry="7" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.33"/>
