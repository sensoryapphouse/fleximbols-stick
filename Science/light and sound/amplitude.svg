<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Sine wave + vertical arrow measuring peak height + bracket shapes -->
  <!-- Axis baseline (horizontal) -->
  <line x1="20" y1="130" x2="270" y2="130" stroke="#4d4d4d" stroke-width="2.96" stroke-linecap="round"/>
  <!-- Sine wave -->
  <path d="M30 130 Q70 40 110 130 Q150 220 190 130 Q230 40 270 130" fill="none" stroke="#1d0e82" stroke-width="8.88" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bracket shapes marking amplitude on left side -->
  <!-- Top bracket at peak -->
  <path d="M50 50 L40 50 L40 60" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M50 50 L60 50" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Bottom bracket at axis -->
  <path d="M50 130 L40 130 L40 120" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M50 130 L60 130" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Vertical double-headed arrow between brackets measuring peak height -->
  <!-- Shaft -->
  <line x1="80" y1="55" x2="80" y2="125" stroke="#d01424" stroke-width="7.40" stroke-linecap="round"/>
  <!-- Top arrow head -->
  <polygon points="80,42 70,58 90,58" fill="#d01424" stroke="#1a1a1a" stroke-width="3.70" stroke-linejoin="round"/>
  <!-- Bottom arrow head -->
  <polygon points="80,138 70,122 90,122" fill="#d01424" stroke="#1a1a1a" stroke-width="3.70" stroke-linejoin="round"/>
  <!-- Peak marker dot -->
  <circle cx="70" cy="50" r="5" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.70"/>
  <!-- Trough indicator (just a smaller bracket below to reinforce amplitude meaning) -->
  <circle cx="150" cy="210" r="5" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.70"/>
</g></svg>