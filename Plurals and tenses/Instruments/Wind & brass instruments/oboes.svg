<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Oboe: slim straight black body, small conical bell, double reed at top, keys -->
  <!-- Small conical bell (narrower than clarinet) -->
  <path d="M133 203 Q129 216 131 226 Q138 233 145 233 Q152 233 159 226 Q161 216 157 203 Z"
        fill="#4d4d4d" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Bell opening (smaller) -->
  <ellipse cx="145" cy="230" rx="13" ry="5" fill="#000000" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- Lower joint (slim) -->
  <rect x="136" y="158" width="18" height="50" rx="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Joint ring -->
  <rect x="134" y="155" width="22" height="5" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Upper joint (slim) -->
  <rect x="137" y="88" width="16" height="72" rx="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Joint ring 2 -->
  <rect x="135" y="85" width="20" height="5" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Top section (slim, slightly tapered) -->
  <path d="M138 45 L152 45 L151 88 L139 88 Z"
        fill="#4d4d4d" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Double reed (two overlapping reeds at top — key oboe feature) -->
  <!-- Reed staple (small metal tube) -->
  <rect x="141" y="30" width="8" height="18" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Reed blade 1 -->
  <path d="M141 30 Q141 18 145 14 Q145 18 141 30 Z"
        fill="#529929" stroke="#1a1a1a" stroke-width="2.96" stroke-linejoin="round"/>
  <!-- Reed blade 2 -->
  <path d="M149 30 Q149 18 145 14 Q145 18 149 30 Z"
        fill="#67832d" stroke="#1a1a1a" stroke-width="2.96" stroke-linejoin="round"/>
  <!-- Reed tip line -->
  <line x1="141" y1="30" x2="149" y2="30" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
  <!-- Keys left side - upper joint -->
  <circle cx="130" cy="100" r="6" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="130" cy="116" r="6" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="130" cy="132" r="6" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="130" cy="148" r="5" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Key rod left -->
  <line x1="130" y1="92" x2="130" y2="155" stroke="#7f7f7f" stroke-width="2.96" stroke-linecap="round"/>
  <!-- Keys right side - lower joint -->
  <circle cx="160" cy="165" r="6" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="160" cy="181" r="6" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="160" cy="197" r="5" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Key rod right -->
  <line x1="160" y1="157" x2="160" y2="203" stroke="#7f7f7f" stroke-width="2.96" stroke-linecap="round"/>
  <!-- Thumb/octave keys -->
  <circle cx="160" cy="100" r="5" fill="#efefef" stroke="#1a1a1a" stroke-width="3.70"/>
  <circle cx="160" cy="114" r="5" fill="#efefef" stroke="#1a1a1a" stroke-width="3.70"/>
  <!-- Trill keys (small side) -->
  <rect x="153" y="126" width="11" height="5" rx="2" fill="#efefef" stroke="#1a1a1a" stroke-width="2.96"/>
  <rect x="153" y="137" width="11" height="5" rx="2" fill="#efefef" stroke="#1a1a1a" stroke-width="2.96"/>
</g><g transform="translate(360 8) scale(0.2812)"><defs><radialGradient id="plg2505" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#plg2505)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>