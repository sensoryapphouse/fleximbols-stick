  <!-- blade gleam -->
  <path d="M 80 128 L 140 122" fill="none" stroke="#ffffff" stroke-width="2.96" stroke-linecap="round"/>
  <!-- adjustable thickness knob on side -->
  <circle cx="250" cy="115" r="14" fill="#d01424" stroke="#1a1a1a" stroke-width="4.94"/>
  <circle cx="250" cy="115" r="6" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="2.96"/>
  <line x1="250" y1="105" x2="250" y2="100" stroke="#1a1a1a" stroke-width="4.94" stroke-linecap="round"/>
