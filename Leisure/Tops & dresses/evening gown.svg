  <!-- Evening gown: slim elegant floor-length coloured gown, sleek column, no veil -->
  <!-- Bodice (fitted, strapless, deep jewel colour) -->
  <path d="M115 45 Q115 35 145 32 Q175 35 175 45 L172 115 L118 115 Z" fill="#7c3fac" stroke="#1a1a1a" stroke-width="7.40" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Sweetheart neckline -->
  <path d="M115 45 Q128 53 145 49 Q162 53 175 45" fill="none" stroke="#1a1a1a" stroke-width="5.93" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Thin shoulder straps -->
  <line x1="122" y1="45" x2="118" y2="35" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="168" y1="45" x2="172" y2="35" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Slim column skirt (narrow, floor-length — key difference from ball-gown) -->
  <path d="M118 115 Q108 160 105 222 L185 222 Q182 160 172 115 Z" fill="#7c3fac" stroke="#1a1a1a" stroke-width="7.40" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Subtle vertical seam lines for sleekness -->
  <line x1="135" y1="115" x2="132" y2="222" stroke="#392170" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="155" y1="115" x2="158" y2="222" stroke="#392170" stroke-width="2.96" stroke-linecap="round"/>
  <!-- Waist definition line -->
  <path d="M118 115 Q145 122 172 115" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Small side slit hint -->
  <path d="M105 190 L110 222" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Jewel/gem accent at neckline centre -->
  <ellipse cx="145" cy="50" rx="6" ry="4" fill="#f266aa" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
</g></svg>