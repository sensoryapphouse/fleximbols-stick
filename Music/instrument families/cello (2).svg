  <!-- 4 cello pegs (larger than violin pegs) -->
  <ellipse cx="103" cy="27" rx="6" ry="3.5" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="3.70"/>
  <line x1="103" y1="27" x2="135" y2="27" stroke="#5e1f0a" stroke-width="4.45" stroke-linecap="round"/>
  <ellipse cx="135" cy="27" rx="6" ry="3.5" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="3.70"/>
  <ellipse cx="103" cy="37" rx="6" ry="3.5" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="3.70"/>
  <line x1="103" y1="37" x2="135" y2="37" stroke="#5e1f0a" stroke-width="4.45" stroke-linecap="round"/>
  <ellipse cx="135" cy="37" rx="6" ry="3.5" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="3.70"/>
  <!-- Nut -->
  <rect x="109" y="41" width="20" height="4" rx="1" fill="#efefef" stroke="#1a1a1a" stroke-width="2.96"/>

  <!-- Neck (cello neck is shorter relative to body than violin) -->
  <path d="M 111,43 L 107,70 L 131,70 L 127,43 Z"
    fill="#9d7246" stroke="#1a1a1a" stroke-width="7.40" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Fingerboard (ebony) -->
  <path d="M 113,43 L 109,70 L 129,70 L 125,43 Z"
    fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bridge with cutouts -->
  <path d="M 98,143 L 96,158 M 140,143 L 142,158"
    fill="none" stroke="#f5e7c4" stroke-width="2.96"/>
  <path d="M 96,158 Q 108,152 118,154 Q 128,152 142,158 L 140,143 Q 128,138 118,140 Q 108,138 98,143 Z"
    fill="#f5e7c4" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="108" cy="153" r="4" fill="#9d7246" stroke="none"/>
  <circle cx="128" cy="153" r="4" fill="#9d7246" stroke="none"/>

  <!-- Tailpiece (cello has a large tailpiece, no chinrest) -->
  <path d="M 104,186 Q 100,192 102,200 Q 110,208 118,208 Q 126,208 134,208 Q 142,200 138,190 Q 134,186 118,185 Q 108,185 104,186 Z"
    fill="#5e1f0a" stroke="#1a1a1a" stroke-width="5.93" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Tailgut (attaches tailpiece to end button) -->
  <line x1="108" y1="208" x2="108" y2="216" stroke="#4d4d4d" stroke-width="3.70" stroke-linecap="round"/>
  <line x1="128" y1="208" x2="128" y2="216" stroke="#4d4d4d" stroke-width="3.70" stroke-linecap="round"/>
  <!-- End button -->
  <circle cx="118" cy="218" r="5" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.96"/>

  <!-- Endpin spike (cello is played upright, resting on the spike) -->
  <line x1="118" y1="223" x2="118" y2="234" stroke="#7f7f7f" stroke-width="7.40" stroke-linecap="round"/>
  <polygon points="118,237 114,232 122,232" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="2.96" stroke-linejoin="round"/>

  <!-- 4 strings — C G D A (lowest to highest, thickest to thinnest) -->
  <line x1="110" y1="46" x2="106" y2="200" stroke="#4d4d4d" stroke-width="5.18" stroke-linecap="round"/>
  <line x1="115" y1="46" x2="112" y2="200" stroke="#4d4d4d" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="121" y1="46" x2="124" y2="200" stroke="#b8b8b8" stroke-width="3.70" stroke-linecap="round"/>
  <line x1="126" y1="46" x2="130" y2="200" stroke="#b8b8b8" stroke-width="2.96" stroke-linecap="round"/>
</g></svg>