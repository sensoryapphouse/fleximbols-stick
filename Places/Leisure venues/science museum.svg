<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Science museum: modern building with a dome, atom/orbit emblem on front -->
  <!-- Building base steps -->
  <rect x="18" y="212" width="254" height="14" rx="2" ry="2" fill="#efefef" stroke="#1a1a1a" stroke-width="5.08" stroke-linejoin="round"/>
  <rect x="26" y="200" width="238" height="14" rx="2" ry="2" fill="#efefef" stroke="#1a1a1a" stroke-width="5.08" stroke-linejoin="round"/>
  <!-- Main building body (modern flat facade) -->
  <rect x="30" y="110" width="230" height="92" rx="6" ry="6" fill="#dff3fd" stroke="#1a1a1a" stroke-width="6.34" stroke-linejoin="round"/>
  <!-- Entablature / frieze band -->
  <rect x="30" y="110" width="230" height="16" rx="0" ry="0" fill="#90a7d6" stroke="#1a1a1a" stroke-width="3.81"/>
  <!-- Dome on top of building (centred) -->
  <path d="M90,110 Q145,38 200,110 Z" fill="#90a7d6" stroke="#1a1a1a" stroke-width="6.34" stroke-linejoin="round"/>
  <!-- Dome sheen highlight -->
  <path d="M105,110 Q145,52 170,110" fill="none" stroke="#dff3fd" stroke-width="3.81" stroke-linecap="round"/>
  <!-- Dome base drum -->
  <rect x="88" y="106" width="114" height="12" rx="4" ry="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.08" stroke-linejoin="round"/>
  <!-- 4 columns on lower building -->
  <rect x="44" y="126" width="16" height="74" rx="4" ry="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.08" stroke-linejoin="round"/>
  <rect x="90" y="126" width="16" height="74" rx="4" ry="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.08" stroke-linejoin="round"/>
  <rect x="184" y="126" width="16" height="74" rx="4" ry="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.08" stroke-linejoin="round"/>
  <rect x="230" y="126" width="16" height="74" rx="4" ry="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.08" stroke-linejoin="round"/>
  <!-- ATOM / ORBIT EMBLEM on facade (centred) -->
  <!-- Nucleus -->
  <circle cx="145" cy="162" r="10" fill="#ff9900" stroke="#1a1a1a" stroke-width="3.81"/>
  <!-- 3 elliptical orbits -->
  <ellipse cx="145" cy="162" rx="34" ry="14" fill="none" stroke="#1a1a1a" stroke-width="3.81"/>
  <ellipse cx="145" cy="162" rx="34" ry="14" fill="none" stroke="#2a4ec0" stroke-width="2.54" transform="rotate(60,145,162)"/>
  <ellipse cx="145" cy="162" rx="34" ry="14" fill="none" stroke="#2a4ec0" stroke-width="2.54" transform="rotate(-60,145,162)"/>
  <!-- Electrons on orbits -->
  <circle cx="179" cy="162" r="5" fill="#f7de58" stroke="#1a1a1a" stroke-width="2.54"/>
  <circle cx="128" cy="150" r="5" fill="#f7de58" stroke="#1a1a1a" stroke-width="2.54"/>
  <circle cx="128" cy="174" r="5" fill="#f7de58" stroke="#1a1a1a" stroke-width="2.54"/>
</g></svg>