  <!-- antigen-test: lateral-flow cassette, 2 result lines (positive) -->

  <!-- cassette body -->
  <rect x="45" y="60" width="200" height="130" rx="14" ry="14" fill="#efefef" stroke="#1a1a1a" stroke-width="5.33" stroke-linejoin="round"/>

  <!-- sample well (round hole on left) -->
  <circle cx="90" cy="125" r="22" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="90" cy="125" r="13" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="2.66"/>
  <path d="M 90,158 L 90,170 M 84,164 L 96,164" stroke="#1a1a1a" stroke-width="2.66" stroke-linecap="round"></path>

  <!-- result window -->
  <rect x="130" y="88" width="90" height="74" rx="8" ry="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <circle cx="140" cy="103" r="3" fill="#4d4d4d"></circle>
  <circle cx="140" cy="143" r="3" fill="#4d4d4d"></circle>

  <!-- Control line -->
  <line x1="152" y1="103" x2="212" y2="103" stroke="#f8130d" stroke-width="5.33" stroke-linecap="round"/>
  <!-- Test line (2nd line = positive antigen result) -->
  <line x1="152" y1="143" x2="212" y2="143" stroke="#f8130d" stroke-width="5.33" stroke-linecap="round"/>

  <!-- result indicator: two lines positive -->
  <rect x="196" y="76" width="32" height="24" rx="5" ry="5" fill="#f8130d" stroke="#1a1a1a" stroke-width="2.66" stroke-linejoin="round"/>
  <path d="M 212,82 L 212,94 M 206,88 L 218,88" stroke="#ffffff" stroke-width="3.55" stroke-linecap="round"/>
</g></svg>