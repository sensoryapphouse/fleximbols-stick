  <line x1="140" y1="106" x2="145" y2="92" stroke="#f8130d" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="108" y1="122" x2="95" y2="120" stroke="#f8130d" stroke-width="4.45" stroke-linecap="round"/>
