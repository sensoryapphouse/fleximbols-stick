  <line x1="195" y1="113" x2="202" y2="135" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="138" y1="135" x2="202" y2="135" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Chart on board: bars going up -->
