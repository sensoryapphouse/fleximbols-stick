<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Contour stick: chunky twist-up stick, cool-brown/taupe cream poking out top -->
  <!-- Outer casing body (chunky, like thick lipstick tube) -->
  <rect x="113" y="118" width="64" height="90" rx="10" ry="10" fill="#efefef" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Twist mechanism lines on barrel -->
  <line x1="113" y1="150" x2="177" y2="150" stroke="#b8b8b8" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="113" y1="166" x2="177" y2="166" stroke="#b8b8b8" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Bottom twist-wheel (wider, ribbed) -->
  <rect x="109" y="204" width="72" height="14" rx="7" ry="7" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Twist wheel ribs -->
  <line x1="122" y1="205" x2="122" y2="217" stroke="#7f7f7f" stroke-width="2.96"/>
  <line x1="133" y1="205" x2="133" y2="217" stroke="#7f7f7f" stroke-width="2.96"/>
  <line x1="145" y1="205" x2="145" y2="217" stroke="#7f7f7f" stroke-width="2.96"/>
  <line x1="157" y1="205" x2="157" y2="217" stroke="#7f7f7f" stroke-width="2.96"/>
  <line x1="168" y1="205" x2="168" y2="217" stroke="#7f7f7f" stroke-width="2.96"/>
  <!-- Collar ring where stick emerges -->
  <rect x="113" y="106" width="64" height="16" rx="5" ry="5" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Cool-brown/taupe cream stick poking up from collar -->
  <!-- Stick body: cool taupe (not warm orange) -->
  <rect x="124" y="44" width="42" height="66" rx="8" ry="8" fill="#9d7246" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Cool taupe overlay to shift tone cooler -->
  <rect x="128" y="52" width="10" height="54" rx="4" fill="#7d5e23" stroke="none"/>
  <!-- Angled top of stick (worn/used cut) -->
  <path d="M 124,52 Q 128,38 166,46 L 166,52 Z" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
</g></svg>