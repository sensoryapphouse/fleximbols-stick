  <!-- Sky -->
  <rect x="26" y="32" width="238" height="176" rx="8" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Rigid delta wing - large triangular shape -->
  <polygon points="145,60 30,160 260,160" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Wing centre line (keel) -->
  <line x1="145" y1="60" x2="145" y2="160" stroke="#1a1a1a" stroke-width="3.55" stroke-linecap="round"/>
  <!-- Leading edge left -->
  <line x1="145" y1="60" x2="30" y2="160" stroke="#1a1a1a" stroke-width="3.55" stroke-linecap="round"/>
  <!-- Leading edge right -->
  <line x1="145" y1="60" x2="260" y2="160" stroke="#1a1a1a" stroke-width="3.55" stroke-linecap="round"/>
  <!-- Control bar (A-frame trapeze) -->
  <line x1="100" y1="145" x2="190" y2="145" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="100" y1="145" x2="145" y2="100" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="190" y1="145" x2="145" y2="100" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Pilot body - prone under the frame bar -->
  <!-- Head -->
  <circle cx="145" cy="165" r="11" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Helmet -->
  <path d="M134,161 Q145,150 156,161" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="3.55" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Body prone horizontal -->
  <rect x="110" y="173" width="60" height="14" rx="7" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Arms gripping bar -->
  <line x1="122" y1="177" x2="100" y2="148" stroke="#eed5b6" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="168" y1="177" x2="190" y2="148" stroke="#eed5b6" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Legs trailing back -->
  <line x1="120" y1="185" x2="105" y2="200" stroke="#2a4ec0" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="150" y1="187" x2="145" y2="205" stroke="#2a4ec0" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Harness strap from bar to pilot -->
  <line x1="145" y1="145" x2="145" y2="173" stroke="#7d5e23" stroke-width="3.55" stroke-linecap="round"/>
</g></svg>