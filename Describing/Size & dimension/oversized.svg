  <!-- Oversized: a small figure wearing a hugely baggy oversized shirt/garment -->

  <!-- Oversized shirt hanging very wide and low on the small figure -->
  <!-- Shirt body (very wide, draping to near knees) -->
  <path d="M55,85 Q60,82 85,80 L95,68 Q112,55 145,55 Q178,55 195,68 L205,80 Q230,82 235,85 L228,170 Q220,178 200,178 Q175,180 145,180 Q115,180 90,178 Q70,178 62,170 Z" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Collar opening (too wide for figure) -->
  <path d="M118,56 Q145,48 172,56" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Sleeve left (very long, draping past hands) -->
  <path d="M55,85 Q38,95 30,108 Q24,120 28,130 Q34,138 48,132 Q60,125 62,110 L85,80 Z" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Sleeve right -->
  <path d="M235,85 Q252,95 260,108 Q266,120 262,130 Q256,138 242,132 Q230,125 228,110 L205,80 Z" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- Small figure head sticking out of the top -->
  <circle cx="145" cy="42" r="20" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Eyes -->
  <circle cx="138" cy="38" r="3" fill="#000000"/>
  <circle cx="152" cy="38" r="3" fill="#000000"/>
  <!-- Mouth (grin) -->
  <path d="M139 47 Q145 52 151 47" fill="none" stroke="#1a1a1a" stroke-width="2.66" stroke-linecap="round"/>

  <!-- Small legs poking out below shirt hem -->
  <rect x="126" y="178" width="14" height="34" rx="6" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="150" y="178" width="14" height="34" rx="6" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Feet -->
  <ellipse cx="133" cy="214" rx="11" ry="6" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="3.55"/>
  <ellipse cx="157" cy="214" rx="11" ry="6" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="3.55"/>

  <!-- Shirt hem draping lower than arms, visual sag lines -->
  <path d="M90,178 Q100,192 110,180" fill="none" stroke="#d01424" stroke-width="2.66" stroke-linecap="round"/>
  <path d="M180,178 Q190,192 200,180" fill="none" stroke="#d01424" stroke-width="2.66" stroke-linecap="round"/>
</g></svg>