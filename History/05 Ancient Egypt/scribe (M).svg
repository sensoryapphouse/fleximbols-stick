<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><metadata id="sah">{"v":1,"fig":[["h1","ma"]]}</metadata><g data-fit="1" transform="translate(256 256) scale(1.4724) translate(-256.00 -258.00)">
<!-- ===== Seated cross-legged scribe (classic Egyptian Seated Scribe pose) ===== -->
<!-- crossed shins forming the wide seated base (drawn first, behind the lap papyrus) -->
<path d="M 256 330 L 150 392 Q 142 400 152 404 L 232 404 Q 246 404 250 392 Z" fill="#c8884f" stroke="#9c6634" stroke-width="6" stroke-linejoin="round"/>
<path d="M 256 330 L 362 392 Q 370 400 360 404 L 280 404 Q 266 404 262 392 Z" fill="#c8884f" stroke="#9c6634" stroke-width="6" stroke-linejoin="round"/>
<!-- crossed feet tucked under -->
<ellipse cx="170" cy="402" rx="20" ry="9" fill="#9c6634"/>
<ellipse cx="342" cy="402" rx="20" ry="9" fill="#9c6634"/>
<!-- torso (white linen, leaning slightly forward over the scroll) -->
<path d="M 224 214 L 288 214 Q 296 280 290 336 L 222 336 Q 216 280 224 214 Z" fill="#f3ead4" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
<!-- shoulders -->
<line x1="226" y1="216" x2="288" y2="216" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
<!-- neck -->
<line x1="256" y1="214" x2="256" y2="186" stroke="#1a1a1a" stroke-width="14" stroke-linecap="round"/>
<!-- head -->
<circle id="h1" data-fig="ma" class="skin" cx="256" cy="150" r="38" fill="#c8884f" stroke="#1a1a1a" stroke-width="6"/>
<!-- modest short scribe wig: a soft rounded cap that hugs the crown but does NOT swamp the face -->
<path d="M 218 152 Q 216 106 256 106 Q 296 106 298 152 Q 287 132 256 134 Q 225 132 218 152 Z" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
<!-- simple face cue: eye + brow so it reads as a person looking down at the work -->
<circle cx="246" cy="150" r="3" fill="#1a1a1a"/>
<circle cx="266" cy="150" r="3" fill="#1a1a1a"/>
<!-- ===== LARGE unrolled papyrus scroll across the lap — the visual focus ===== -->
<!-- rolled ends -->
<path d="M 150 330 q -14 12 0 24 q 14 12 0 24 q -14 -12 -10 -24 q -4 -12 10 -24 Z" fill="#e8dcb8" stroke="#b9a06a" stroke-width="3" stroke-linejoin="round"/>
<path d="M 362 330 q 14 12 0 24 q -14 12 0 24 q 14 -12 10 -24 q 4 -12 -10 -24 Z" fill="#e8dcb8" stroke="#b9a06a" stroke-width="3" stroke-linejoin="round"/>
<!-- the open sheet -->
<rect x="150" y="330" width="212" height="48" rx="2" fill="#f6efd9" stroke="#b9a06a" stroke-width="4"/>
<!-- written lines of script on the page -->
<line x1="166" y1="342" x2="330" y2="342" stroke="#7d6a3e" stroke-width="3" stroke-linecap="round"/>
<line x1="166" y1="354" x2="346" y2="354" stroke="#7d6a3e" stroke-width="3" stroke-linecap="round"/>
<line x1="166" y1="366" x2="300" y2="366" stroke="#7d6a3e" stroke-width="3" stroke-linecap="round"/>
<!-- left arm + hand steadying the left edge of the scroll -->
<path d="M 226 224 Q 196 280 168 336" fill="none" stroke="#1a1a1a" stroke-width="13" stroke-linecap="round"/>
<circle cx="170" cy="342" r="11" fill="#c8884f" stroke="#9c6634" stroke-width="3"/>
<!-- right arm + hand holding the reed brush, writing ON the page -->
<path d="M 286 224 Q 312 270 300 330" fill="none" stroke="#1a1a1a" stroke-width="13" stroke-linecap="round"/>
<circle cx="298" cy="334" r="11" fill="#c8884f" stroke="#9c6634" stroke-width="3"/>
<!-- reed brush: held in the right hand, slanting down to touch the sheet (writing gesture) -->
<line x1="318" y1="300" x2="288" y2="352" stroke="#9a6a32" stroke-width="6" stroke-linecap="round"/>
<line x1="318" y1="300" x2="324" y2="290" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
<!-- ink mark where the nib meets the page -->
<circle cx="288" cy="353" r="3.5" fill="#1a1a1a"/>
</g></svg>
