  <!-- pottery-wheel: spinning wheel disc with clay pot being thrown + hands hint + motion lines -->
  <!-- Wheel base / stand -->
  <rect x="110" y="185" width="70" height="18" rx="4" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <rect x="130" y="165" width="30" height="24" rx="3" ry="3" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Wheel disc (spinning, shown with motion arcs) -->
  <ellipse cx="145" cy="175" rx="72" ry="14" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Motion arc lines on wheel -->
  <path d="M 88,170 Q 145,158 202,170" fill="none" stroke="#7f7f7f" stroke-width="2.22" stroke-linecap="round"/>
  <path d="M 82,175 Q 145,162 208,175" fill="none" stroke="#7f7f7f" stroke-width="2.22" stroke-linecap="round"/>
  <!-- Clay pot being thrown on centre of wheel -->
  <ellipse cx="145" cy="163" rx="28" ry="7" fill="#e6b98a" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <path d="M 117,163 Q 108,130 120,105 Q 132,85 145,83 Q 158,85 170,105 Q 182,130 173,163" fill="#e6b98a" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Pot rim opening -->
  <ellipse cx="145" cy="83" rx="25" ry="7" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Left hand hint -->
  <path d="M 70,120 Q 90,110 108,125 Q 114,140 110,155" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right hand hint -->
  <path d="M 220,120 Q 200,110 182,125 Q 176,140 180,155" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Motion speed lines around wheel -->
  <line x1="60" y1="175" x2="75" y2="175" stroke="#b8b8b8" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="215" y1="175" x2="230" y2="175" stroke="#b8b8b8" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="63" y1="167" x2="77" y2="170" stroke="#b8b8b8" stroke-width="2.22" stroke-linecap="round"/>
  <line x1="217" y1="170" x2="227" y2="167" stroke="#b8b8b8" stroke-width="2.22" stroke-linecap="round"/>
