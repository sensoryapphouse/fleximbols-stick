  <!-- Ice Cream Truck - pastel van with serving hatch + cone on roof, back-to-front -->
  <!-- Shadow -->
  <ellipse cx="145" cy="208" rx="108" ry="7" fill="#4d4d4d" stroke="none"/>
  <!-- Main van body -->
  <rect x="30" y="110" width="230" height="80" rx="8" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Cab roof -->
  <path d="M190 110 Q190 82 210 80 L248 80 Q262 80 262 110" fill="#f266aa" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Box roof -->
  <rect x="30" y="96" width="166" height="18" rx="4" fill="#dff3fd" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Windshield -->
  <path d="M212 83 L258 90 L258 112 L212 112 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Cab side window -->
  <rect x="194" y="114" width="26" height="22" rx="3" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Serving hatch (open) -->
  <rect x="110" y="110" width="52" height="34" rx="3" fill="#fff200" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Hatch awning flap -->
  <path d="M108 110 L164 110 L164 100 Q136 92 108 100 Z" fill="#f266aa" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Decorative side stripe -->
  <rect x="30" y="152" width="166" height="10" rx="2" fill="#dff3fd" stroke="none"/>
  <!-- Small side window rear -->
  <rect x="48" y="116" width="34" height="26" rx="3" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Ice cream cone on roof -->
  <!-- Cone body -->
  <path d="M140 96 L150 72 L160 96 Z" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Soft-serve swirl -->
  <ellipse cx="150" cy="72" rx="12" ry="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <path d="M142 68 Q150 58 158 68" fill="none" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Swirl top dot -->
  <circle cx="150" cy="60" r="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Front bumper -->
  <rect x="252" y="180" width="10" height="8" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Rear bumper -->
  <rect x="28" y="182" width="10" height="8" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Front wheel -->
