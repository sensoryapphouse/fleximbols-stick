<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Large expedition trekking backpack with frame, top lid, side straps, sleeping roll at base -->
  <!-- Sleeping roll at base -->
  <rect x="95" y="192" width="100" height="22" rx="11" fill="#9d7246" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <rect x="95" y="192" width="100" height="10" rx="5" fill="#7d5e23" stroke="none"/>
  <!-- Roll straps -->
  <line x1="113" y1="192" x2="113" y2="214" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="177" y1="192" x2="177" y2="214" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Main body of backpack -->
  <rect x="80" y="62" width="130" height="134" rx="12" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Frame rails on sides -->
  <rect x="80" y="70" width="12" height="118" rx="6" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="198" y="70" width="12" height="118" rx="6" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Central front pocket -->
  <rect x="100" y="110" width="90" height="70" rx="8" fill="#90a7d6" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Pocket zip line -->
  <line x1="100" y1="130" x2="190" y2="130" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Pocket pull tab -->
  <ellipse cx="145" cy="130" rx="6" ry="5" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Top lid -->
  <rect x="85" y="34" width="120" height="34" rx="10" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Lid zip -->
  <line x1="98" y1="51" x2="192" y2="51" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <ellipse cx="145" cy="51" rx="6" ry="5" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Shoulder straps (left and right) -->
  <path d="M92 68 C72 90 68 140 80 192" fill="none" stroke="#1d0e82" stroke-width="5.55" stroke-linecap="round"/>
  <path d="M198 68 C218 90 222 140 210 192" fill="none" stroke="#1d0e82" stroke-width="5.55" stroke-linecap="round"/>
  <!-- Strap buckles -->
  <rect x="68" y="128" width="18" height="12" rx="3" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <rect x="204" y="128" width="18" height="12" rx="3" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <!-- Hip belt -->
  <path d="M80 186 Q145 200 210 186" fill="none" stroke="#1d0e82" stroke-width="5.55" stroke-linecap="round"/>
  <!-- Compression side straps -->
  <line x1="80" y1="90" x2="65" y2="105" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="80" y1="150" x2="65" y2="165" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="210" y1="90" x2="225" y2="105" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="210" y1="150" x2="225" y2="165" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Buckle clips on compression straps -->
  <rect x="56" y="100" width="14" height="10" rx="3" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.33"/>
  <rect x="56" y="160" width="14" height="10" rx="3" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.33"/>
  <rect x="220" y="100" width="14" height="10" rx="3" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.33"/>
  <rect x="220" y="160" width="14" height="10" rx="3" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.33"/>
</g></svg>