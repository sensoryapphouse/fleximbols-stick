  <!-- Speech bubble: rounded rectangle body -->
  <rect x="40" y="44" width="204" height="148" rx="28" ry="28" fill="#d01424" stroke="#1a1a1a" stroke-width="11.11" stroke-linejoin="round"/>
  <!-- Bubble tail pointing bottom-left -->
  <polygon points="72,192 56,228 100,192" fill="#d01424" stroke="#1a1a1a" stroke-width="11.11" stroke-linejoin="round"/>
  <!-- Cover the tail-join interior line -->
  <polygon points="72,192 100,192 86,200" fill="#d01424" stroke="none"/>
  <!-- Large yellow star (main) — offset left of centre to leave room for 4 small -->
  <use href="#bigstar" transform="translate(128,118)" fill="#f7de58" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- Four small yellow stars arranged in arc around the large one -->
