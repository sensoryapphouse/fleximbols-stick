  <!-- Sheet background -->
  <rect x="28" y="22" width="234" height="196" rx="5" ry="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Wire: battery - to top-left node -->
