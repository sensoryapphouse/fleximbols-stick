<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- toggle switch in ON position + arrow + 'ON' as path letters -->
  <!-- track / pill shape -->
  <rect x="30" y="80" width="230" height="100" rx="50" fill="#529929" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- inner shadow track -->
  <rect x="40" y="90" width="210" height="80" rx="40" fill="#67832d" stroke="#1a1a1a" stroke-width="1.78"/>
  <!-- toggle knob (slid to the RIGHT = ON) -->
  <circle cx="210" cy="130" r="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="210" cy="130" r="30" fill="#efefef" stroke="#1a1a1a" stroke-width="1.78"/>
  <!-- knob highlight -->
  <ellipse cx="200" cy="120" rx="9" ry="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.78"/>
  <!-- 'ON' label paths on left of track -->
  <!-- O -->
  <ellipse cx="80" cy="130" rx="14" ry="20" fill="none" stroke="#ffffff" stroke-width="5.33"/>
  <!-- N -->
  <path d="M 110 150 L 110 110 L 140 150 L 140 110" fill="none" stroke="#ffffff" stroke-width="5.33" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- arrow pointing from OFF to ON direction -->
  <path d="M 145 200 L 215 200" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M 200 190 L 215 200 L 200 210" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
</g></svg>