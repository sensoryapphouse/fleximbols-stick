  <circle cx="212" cy="43" r="5" fill="#000000" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="78" cy="202" r="5" fill="#000000" stroke="#1a1a1a" stroke-width="4.45"/>
