<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- House cross-section: triangular attic filled with stacked boxes -->
  <!-- House outline -->
  <path d="M30 220 L30 110 L145 30 L260 110 L260 220 Z" fill="#eed5b6" stroke="#1a1a1a" stroke-width="8.89" stroke-linejoin="round"/>
  <!-- Floor dividing attic from lower house -->
  <rect x="30" y="116" width="230" height="8" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="6.67"/>
  <!-- Lower house interior (lighter) -->
  <rect x="34" y="124" width="222" height="92" fill="#f5e7c4" stroke="none"/>
  <!-- Door of lower house -->
  <rect x="130" y="160" width="30" height="56" fill="#9d7246" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <circle cx="153" cy="190" r="2" fill="#000000"/>
  <!-- Windows -->
  <rect x="60" y="150" width="30" height="30" fill="#dff3fd" stroke="#1a1a1a" stroke-width="6.67"/>
  <line x1="75" y1="150" x2="75" y2="180" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="60" y1="165" x2="90" y2="165" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="200" y="150" width="30" height="30" fill="#dff3fd" stroke="#1a1a1a" stroke-width="6.67"/>
  <line x1="215" y1="150" x2="215" y2="180" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="200" y1="165" x2="230" y2="165" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Attic interior (clip via mask is not allowed, just draw boxes inside triangle) -->
  <!-- Box 1 bottom-left -->
  <rect x="60" y="90" width="32" height="22" fill="#9d7246" stroke="#1a1a1a" stroke-width="5.56" stroke-linejoin="round"/>
  <line x1="60" y1="100" x2="92" y2="100" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="76" y1="90" x2="76" y2="100" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Box 2 bottom-middle -->
  <rect x="98" y="88" width="34" height="24" fill="#e6b98a" stroke="#1a1a1a" stroke-width="5.56" stroke-linejoin="round"/>
  <line x1="98" y1="98" x2="132" y2="98" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="115" y1="88" x2="115" y2="98" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Box 3 stacked on box 2 -->
  <rect x="104" y="68" width="26" height="20" fill="#9d7246" stroke="#1a1a1a" stroke-width="5.56" stroke-linejoin="round"/>
  <line x1="104" y1="76" x2="130" y2="76" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Box 4 bottom-right -->
  <rect x="140" y="90" width="34" height="22" fill="#9d7246" stroke="#1a1a1a" stroke-width="5.56" stroke-linejoin="round"/>
  <line x1="140" y1="100" x2="174" y2="100" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="157" y1="90" x2="157" y2="100" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Box 5 -->
  <rect x="180" y="92" width="32" height="20" fill="#e6b98a" stroke="#1a1a1a" stroke-width="5.56" stroke-linejoin="round"/>
  <line x1="180" y1="100" x2="212" y2="100" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Box 6 small top -->
  <rect x="132" y="50" width="24" height="18" fill="#e6b98a" stroke="#1a1a1a" stroke-width="5.56" stroke-linejoin="round"/>
  <line x1="132" y1="57" x2="156" y2="57" stroke="#1a1a1a" stroke-width="3.33"/>
</g></svg>