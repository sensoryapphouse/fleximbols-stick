  <!-- Bongo: pair of small joined drums, two different small sizes side by side, played on lap -->
  <!-- === LARGER BONGO (left) === -->
  <!-- Body cylinder -->
  <path d="M38,128 Q32,210 58,214 Q90,218 106,214 Q122,210 116,128 Z" fill="#9d7246" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Bottom rim -->
  <ellipse cx="77" cy="214" rx="32" ry="9" fill="#7d5e23" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Drum head top -->
  <ellipse cx="77" cy="128" rx="40" ry="12" fill="#eed5b6" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Head tensioning rim -->
  <ellipse cx="77" cy="128" rx="40" ry="12" fill="none" stroke="#7d5e23" stroke-width="5.93"/>
  <!-- Tuning lugs (left drum, 4 lugs) -->
  <rect x="38" y="138" width="8" height="14" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="108" y="138" width="8" height="14" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="55" y="136" width="8" height="14" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="91" y="136" width="8" height="14" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- === SMALLER BONGO (right) === -->
  <!-- Body cylinder -->
  <path d="M130,140 Q126,210 148,213 Q174,216 190,213 Q206,210 202,140 Z" fill="#9d7246" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Bottom rim -->
  <ellipse cx="166" cy="213" rx="24" ry="7" fill="#7d5e23" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Drum head top -->
  <ellipse cx="166" cy="140" rx="30" ry="10" fill="#eed5b6" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Head tensioning rim -->
  <ellipse cx="166" cy="140" rx="30" ry="10" fill="none" stroke="#7d5e23" stroke-width="5.93"/>
  <!-- Tuning lugs (right drum, 4 lugs) -->
  <rect x="130" y="150" width="7" height="12" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="197" y="150" width="7" height="12" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="145" y="148" width="7" height="12" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="182" y="148" width="7" height="12" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Bridge connector between drums -->
  <rect x="114" y="158" width="18" height="10" rx="4" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
