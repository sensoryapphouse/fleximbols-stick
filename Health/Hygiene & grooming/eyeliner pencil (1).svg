<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Eyeliner pencil: sharpened pencil, diagonal left-leaning orientation -->
  <!-- Group rotated -35 degrees around centre -->
  <g transform="rotate(-35 145 120)">
    <!-- Pencil body (wood grain, long rectangle) -->
    <rect x="70" y="90" width="140" height="40" rx="6" fill="#9d7246" stroke="#1a1a1a" stroke-width="8.89" stroke-linejoin="round"/>
    <!-- Wood grain lines -->
    <line x1="95" y1="92" x2="95" y2="128" stroke="#7d5e23" stroke-width="3.55" stroke-linecap="round"/>
    <line x1="115" y1="92" x2="115" y2="128" stroke="#7d5e23" stroke-width="3.55" stroke-linecap="round"/>
    <line x1="135" y1="92" x2="135" y2="128" stroke="#7d5e23" stroke-width="3.55" stroke-linecap="round"/>
    <line x1="155" y1="92" x2="155" y2="128" stroke="#7d5e23" stroke-width="3.55" stroke-linecap="round"/>
    <line x1="175" y1="92" x2="175" y2="128" stroke="#7d5e23" stroke-width="3.55" stroke-linecap="round"/>
    <!-- Ferrule (silver band at right end) -->
    <rect x="205" y="90" width="16" height="40" rx="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="8.89"/>
    <!-- Eraser nub (pink, right end) -->
    <rect x="218" y="94" width="18" height="32" rx="6" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="7.11"/>
    <!-- Sharpened wood cone at left end -->
    <polygon points="70,90 70,130 42,110" fill="#e6b98a" stroke="#1a1a1a" stroke-width="8.89" stroke-linejoin="round"/>
    <!-- Dark pencil tip point -->
    <polygon points="42,110 62,98 62,122" fill="#000000" stroke="#1a1a1a" stroke-width="5.34" stroke-linejoin="round"/>
    <!-- Pencil colour stripe (dark black pigment showing through body, thin strip at bottom) -->
    <rect x="70" y="120" width="134" height="10" rx="0" fill="#4d4d4d" stroke="none"/>
  </g>
</g></svg>