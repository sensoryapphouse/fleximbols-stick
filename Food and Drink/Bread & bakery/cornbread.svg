  <path d="M75 120 L215 120 L215 95 L75 95 Z" fill="#f7de58" stroke="#1a1a1a" stroke-width="11.11" stroke-linejoin="round"/>
  <!-- Side face (front) -->
  <path d="M75 195 L215 195 L215 120 L75 120 Z" fill="#ff9900" stroke="#1a1a1a" stroke-width="11.11" stroke-linejoin="round"/>
