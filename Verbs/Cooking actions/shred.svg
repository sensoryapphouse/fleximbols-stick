<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Paper/food being shredded into many thin strips — hands tearing, ragged strips -->

  <!-- Left hand (warm skin tone) holding left side -->
  <ellipse cx="55" cy="100" rx="28" ry="20" fill="#e6b98a" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Fingers left -->
  <ellipse cx="32" cy="90" rx="10" ry="7" fill="#e6b98a" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="28" cy="103" rx="10" ry="7" fill="#e6b98a" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="32" cy="116" rx="10" ry="7" fill="#e6b98a" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Right hand (warm skin tone) holding right side -->
  <ellipse cx="235" cy="100" rx="28" ry="20" fill="#e6b98a" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Fingers right -->
  <ellipse cx="258" cy="90" rx="10" ry="7" fill="#e6b98a" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="262" cy="103" rx="10" ry="7" fill="#e6b98a" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="258" cy="116" rx="10" ry="7" fill="#e6b98a" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Torn strips hanging/splaying from the tear zone -->
  <!-- Strip 1 (leftward) -->
  <polygon points="80,80 95,80 98,185 75,185" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Strip 2 -->
  <polygon points="103,78 118,78 120,183 101,188" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Strip 3 centre -->
  <polygon points="126,76 141,76 142,182 124,185" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Strip 4 -->
  <polygon points="148,77 163,77 165,186 146,183" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Strip 5 (rightward) -->
  <polygon points="170,79 185,79 188,185 168,183" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Strip 6 (rightmost) -->
  <polygon points="192,80 207,80 210,185 190,185" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- Ragged tear at top of strips -->
  <polyline points="78,80 88,70 95,80 105,68 118,80 128,66 141,79 152,67 163,79 174,68 185,79 196,70 208,80" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- Tension arrows: hands pulling apart -->
  <line x1="70" y1="100" x2="45" y2="100" stroke="#1a1a1a" stroke-width="3.33"/>
  <polygon points="45,100 53,95 53,105" fill="#000000"/>
  <line x1="220" y1="100" x2="245" y2="100" stroke="#1a1a1a" stroke-width="3.33"/>
  <polygon points="245,100 237,95 237,105" fill="#000000"/>
</g></svg>