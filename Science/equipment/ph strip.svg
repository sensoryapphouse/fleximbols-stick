  <!-- Strip background (cream card) -->
  <rect x="55" y="68" width="180" height="104" rx="10" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="6.34" stroke-linejoin="round"/>

  <!-- pH colour patches — 10 distinct colours across the strip -->
  <!-- Patch 1: strong acid - bright red -->
  <rect x="63" y="78" width="15" height="84" rx="4" fill="#f8130d" stroke="#1a1a1a" stroke-width="5.08" stroke-linejoin="round"/>
  <!-- Patch 2: acid orange -->
  <rect x="82" y="78" width="15" height="84" rx="4" fill="#ff9900" stroke="#1a1a1a" stroke-width="5.08" stroke-linejoin="round"/>
  <!-- Patch 3: weak acid yellow-orange -->
  <rect x="101" y="78" width="15" height="84" rx="4" fill="#f2e40d" stroke="#1a1a1a" stroke-width="5.08" stroke-linejoin="round"/>
  <!-- Patch 4: slightly acid bright yellow -->
  <rect x="120" y="78" width="15" height="84" rx="4" fill="#fff200" stroke="#1a1a1a" stroke-width="5.08" stroke-linejoin="round"/>
  <!-- Patch 5: neutral yellow-green -->
  <rect x="139" y="78" width="15" height="84" rx="4" fill="#529929" stroke="#1a1a1a" stroke-width="5.08" stroke-linejoin="round"/>
  <!-- Patch 6: slightly base green -->
  <rect x="158" y="78" width="15" height="84" rx="4" fill="#137827" stroke="#1a1a1a" stroke-width="5.08" stroke-linejoin="round"/>
  <!-- Patch 7: base teal -->
  <rect x="177" y="78" width="15" height="84" rx="4" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="5.08" stroke-linejoin="round"/>
  <!-- Patch 8: strong base blue -->
  <rect x="196" y="78" width="15" height="84" rx="4" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="5.08" stroke-linejoin="round"/>
  <!-- Patch 9: strong alkaline indigo -->
  <rect x="215" y="78" width="15" height="84" rx="4" fill="#1d0e82" stroke="#1a1a1a" stroke-width="5.08" stroke-linejoin="round"/>

  <!-- Scale tick marks above strip -->
