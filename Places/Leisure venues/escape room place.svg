  <!-- Clock face markings -->
  <line x1="50" y1="90" x2="50" y2="96" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="50" y1="134" x2="50" y2="140" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
