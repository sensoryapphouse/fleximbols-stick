  <!-- Chalkboard/board frame -->
  <rect x="18" y="30" width="254" height="168" rx="8" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.33" stroke-linejoin="round"/>
  <!-- Board surface -->
  <rect x="28" y="40" width="234" height="148" rx="5" fill="#137827"/>
  <!-- Board chalk ledge -->
  <rect x="18" y="198" width="254" height="12" rx="4" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Period dot (large, top-left zone) -->
  <circle cx="70" cy="85" r="16" fill="#ffffff" stroke="#ffffff" stroke-width="1.78"/>

  <!-- Comma (top-center zone) -->
  <circle cx="145" cy="78" r="14" fill="#ffffff"/>
  <!-- Comma tail -->
  <path d="M145,92 Q138,102 140,112" fill="none" stroke="#ffffff" stroke-width="7.11" stroke-linecap="round"/>

  <!-- Exclamation mark (top-right zone, drawn as path) -->
  <!-- Exclamation body (tall rounded rect) -->
  <rect x="210" y="58" width="16" height="52" rx="8" fill="#ffffff"/>
  <!-- Exclamation dot -->
  <circle cx="218" cy="125" r="9" fill="#ffffff"/>

  <!-- Question mark (bottom zone, drawn as path) -->
  <!-- Question curve -->
  <path d="M55,150 Q55,128 75,128 Q95,128 95,145 Q95,158 80,162 Q80,168 80,172" fill="none" stroke="#ffffff" stroke-width="8.00" stroke-linecap="round"/>
  <!-- Question dot -->
  <circle cx="80" cy="182" r="7" fill="#ffffff"/>

  <!-- Drawn wave/squiggle line (represents more punctuation/grammar marks, bottom right) -->
  <path d="M120,155 Q130,145 140,155 Q150,165 160,155 Q170,145 180,155 Q190,165 200,155 Q210,145 220,155" fill="none" stroke="#f7de58" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M120,172 Q135,162 150,172 Q165,182 180,172 Q195,162 210,172" fill="none" stroke="#f7de58" stroke-width="4.45" stroke-linecap="round"/>
</g></svg>