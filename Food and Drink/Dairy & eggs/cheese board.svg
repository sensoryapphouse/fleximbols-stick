<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Wood board (rectangular, lighter wood) -->
  <rect x="18" y="55" width="254" height="160" rx="16" fill="#e6b98a" stroke="#1a1a1a" stroke-width="6.67" stroke-linecap="round"/>
  <!-- Wood grain -->
  <line x1="38" y1="70" x2="36" y2="200" stroke="#9d7246" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="65" y1="68" x2="63" y2="202" stroke="#9d7246" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="225" y1="69" x2="227" y2="201" stroke="#9d7246" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="252" y1="71" x2="254" y2="199" stroke="#9d7246" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Handle -->
  <rect x="242" y="108" width="30" height="28" rx="9" fill="#e6b98a" stroke="#1a1a1a" stroke-width="6.67" stroke-linecap="round"/>

  <!-- Cheese 1: large wedge (brie style, pale) top-left -->
  <polygon points="50,75 120,75 105,130 35,130" fill="#fff200" stroke="#1a1a1a" stroke-width="5.56" stroke-linecap="round"/>
  <polygon points="50,75 35,130 37,133 53,78" fill="#f2e40d" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Rind edge -->
  <polygon points="120,75 105,130 110,132 125,77" fill="#eed5b6" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>

  <!-- Cheese 2: wheel slice (gouda, orange-ish) top-right -->
  <path d="M155 115 L155 72 A50 50 0 0 1 215 115 Z" fill="#ff9900" stroke="#1a1a1a" stroke-width="5.56" stroke-linecap="round"/>
  <!-- Wheel rind -->
  <path d="M155 115 A50 50 0 0 0 215 115" fill="none" stroke="#e65a00" stroke-width="11.11" stroke-linecap="round"/>
  <!-- Holes in gouda -->
  <circle cx="178" cy="98" r="5" fill="#e65a00" stroke="#1a1a1a" stroke-width="2.22" stroke-linecap="round"/>
  <circle cx="195" cy="90" r="4" fill="#e65a00" stroke="#1a1a1a" stroke-width="2.22" stroke-linecap="round"/>

  <!-- Cheese 3: block (cheddar, sharp yellow) bottom-left -->
  <rect x="35" y="148" width="55" height="35" rx="3" fill="#f7de58" stroke="#1a1a1a" stroke-width="5.56" stroke-linecap="round"/>
  <polygon points="35,148 90,148 95,143 40,143" fill="#f2e40d" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <polygon points="90,148 95,143 95,178 90,183" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Cheese 4: crumble (feta/bleu) bottom-center -->
  <ellipse cx="150" cy="178" rx="28" ry="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <circle cx="138" cy="175" r="5" fill="#efefef" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <circle cx="152" cy="170" r="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <circle cx="163" cy="177" r="5" fill="#efefef" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <circle cx="144" cy="183" r="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>

  <!-- Cheese 5: soft round (camembert wheel) bottom-right -->
  <circle cx="210" cy="173" r="22" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.56" stroke-linecap="round"/>
  <circle cx="210" cy="173" r="16" fill="#fff200" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Rind ring -->
  <circle cx="210" cy="173" r="22" fill="none" stroke="#9d7246" stroke-width="8.89" stroke-linecap="round" stroke-dasharray="4 3"/>

  <!-- Grapes (top center) -->
  <circle cx="138" cy="82" r="8" fill="#392170" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <circle cx="149" cy="77" r="8" fill="#7c3fac" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <circle cx="131" cy="91" r="8" fill="#7c3fac" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <circle cx="143" cy="88" r="8" fill="#392170" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M143 69 Q145 63 149 60" stroke="#529929" stroke-width="4.45" fill="none" stroke-linecap="round"/>

  <!-- Crackers (right side) -->
  <rect x="170" y="145" width="30" height="20" rx="3" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="185" y1="145" x2="185" y2="165" stroke="#9d7246" stroke-width="2.22" stroke-linecap="round"/>
  <line x1="170" y1="155" x2="200" y2="155" stroke="#9d7246" stroke-width="2.22" stroke-linecap="round"/>
  <rect x="178" y="137" width="30" height="20" rx="3" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="193" y1="137" x2="193" y2="157" stroke="#9d7246" stroke-width="2.22" stroke-linecap="round"/>
  <line x1="178" y1="147" x2="208" y2="147" stroke="#9d7246" stroke-width="2.22" stroke-linecap="round"/>
</g></svg>