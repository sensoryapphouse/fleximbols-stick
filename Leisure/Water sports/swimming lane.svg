<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Swimming pool lane — literal pool, lane divider ropes/floats, deck, lane marker -->

  <!-- Pool deck / surround (beige/stone) -->
  <rect x="24" y="26" width="242" height="188" rx="8" ry="8" fill="#eed5b6" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>

  <!-- Pool water (blue interior) -->
  <rect x="40" y="38" width="210" height="168" rx="4" ry="4" fill="#dff3fd" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>

  <!-- Lane divider rope lines (3 ropes = 4 lanes across width) -->
  <!-- Rope lines as dashed, simulated with float circles on lines -->
  <!-- Rope 1 at x≈93 -->
  <line x1="93" y1="38" x2="93" y2="206" stroke="#1a1a1a" stroke-width="4.45" stroke-dasharray="6,6"/>
  <!-- Floats rope 1 (alternating red/blue circles) -->
  <circle cx="93" cy="58"  r="5" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="93" cy="80"  r="5" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="93" cy="102" r="5" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="93" cy="124" r="5" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="93" cy="146" r="5" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="93" cy="168" r="5" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="93" cy="190" r="5" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Rope 2 at x≈145 -->
  <line x1="145" y1="38" x2="145" y2="206" stroke="#1a1a1a" stroke-width="4.45" stroke-dasharray="6,6"/>
  <circle cx="145" cy="58"  r="5" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="145" cy="80"  r="5" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="145" cy="102" r="5" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="145" cy="124" r="5" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="145" cy="146" r="5" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="145" cy="168" r="5" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="145" cy="190" r="5" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Rope 3 at x≈197 -->
  <line x1="197" y1="38" x2="197" y2="206" stroke="#1a1a1a" stroke-width="4.45" stroke-dasharray="6,6"/>
  <circle cx="197" cy="58"  r="5" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="197" cy="80"  r="5" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="197" cy="102" r="5" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="197" cy="124" r="5" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="197" cy="146" r="5" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="197" cy="168" r="5" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="197" cy="190" r="5" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Lane number marker on deck (top-left corner of pool surround: a small numbered tile shape, NO text — use a bold square marker) -->
  <rect x="22" y="22" width="16" height="14" rx="3" ry="3" fill="#000000"/>
</g></svg>