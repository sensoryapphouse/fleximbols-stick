  <line x1="243" y1="181" x2="264" y2="183" stroke="#f7de58" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="243" y1="193" x2="264" y2="195" stroke="#f7de58" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="243" y1="205" x2="263" y2="207" stroke="#f7de58" stroke-width="4.45" stroke-linecap="round"/>
