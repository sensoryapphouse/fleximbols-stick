  <!-- Sleeve ring -->
  <rect x="62" y="100" width="86" height="14" rx="5" ry="5" fill="#f8130d" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Inner cylinder -->
