<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- PET scanner: ring gantry + patient on bed; radioactive tracer molecules; brain image -->
  <!-- Floor line -->
  <path d="M10 215 L280 215" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Scanner gantry outer ring -->
  <ellipse cx="100" cy="120" rx="62" ry="78" fill="#dff3fd" stroke="#1a1a1a" stroke-width="5.93"/>
  <!-- Scanner inner bore -->
  <ellipse cx="100" cy="120" rx="38" ry="52" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Gantry tick marks -->
  <path d="M100 50 L100 60" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M100 180 L100 190" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M44 120 L54 120" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M146 120 L156 120" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Patient bed sliding into bore -->
  <rect x="135" y="135" width="135" height="22" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Bed legs -->
  <rect x="240" y="157" width="8" height="50" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Patient body (whole body visible across the bed) -->
  <!-- Torso -->
  <rect x="150" y="118" width="80" height="22" rx="8" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Head -->
  <circle cx="240" cy="128" r="14" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Legs -->
  <rect x="140" y="120" width="20" height="18" rx="5" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Arm visible -->
  <path d="M180 138 L190 152 L210 152" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Radioactive tracer molecules floating above scanner -->
  <circle cx="60" cy="40" r="8" fill="#ff9900" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="80" cy="28" r="6" fill="#f2e40d" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="42" cy="58" r="6" fill="#f2e40d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Tracer rays -->
  <path d="M60 24 L60 18" fill="none" stroke="#e65a00" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M48 32 L44 28" fill="none" stroke="#e65a00" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M72 32 L76 28" fill="none" stroke="#e65a00" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Brain image display (small monitor) -->
  <rect x="200" y="30" width="70" height="62" rx="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="206" y="36" width="58" height="42" fill="#000000" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- Brain outline on monitor -->
  <path d="M218 58 Q214 48 224 44 Q232 40 240 46 Q252 42 256 54 Q260 64 252 70 Q244 76 234 72 Q224 76 218 68 Z" fill="#f266aa" stroke="#ffffff" stroke-width="2.96" stroke-linejoin="round"/>
  <!-- Hotspot on brain -->
  <circle cx="240" cy="58" r="5" fill="#ff9900" stroke="#ffffff" stroke-width="2.96"/>
  <circle cx="230" cy="64" r="3" fill="#f2e40d" stroke="#ffffff" stroke-width="2.96"/>
  <!-- Monitor stand -->
  <rect x="228" y="92" width="14" height="10" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
</g></svg>