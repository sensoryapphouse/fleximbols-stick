  <rect x="18" y="75" width="24" height="20" rx="2" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="248" y="75" width="24" height="20" rx="2" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
