<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Universal travel adapter: chunky cube with multiple socket hole types + folding prongs -->
  <!-- Main adapter body (cube) -->
  <rect x="75" y="55" width="140" height="140" rx="14" fill="#efefef" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Top face of cube (3D illusion) -->
  <polygon points="75,55 215,55 240,30 100,30" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Right face of cube -->
  <polygon points="215,55 240,30 240,170 215,195" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>

  <!-- Socket hole: US two-pin (two vertical slots) -->
  <rect x="92" y="75" width="9" height="18" rx="4" fill="#000000"/>
  <rect x="106" y="75" width="9" height="18" rx="4" fill="#000000"/>
  <!-- US socket label area -->

  <!-- Socket hole: UK three-pin (two small + one large below) -->
  <rect x="130" y="70" width="8" height="14" rx="3" fill="#000000"/>
  <rect x="144" y="70" width="8" height="14" rx="3" fill="#000000"/>
  <rect x="137" y="87" width="8" height="16" rx="4" fill="#000000"/>

  <!-- Socket hole: EU two-round-pin -->
  <circle cx="98" cy="130" r="6" fill="#000000"/>
  <circle cx="114" cy="130" r="6" fill="#000000"/>
  <!-- EU socket oval recess -->
  <ellipse cx="106" cy="130" rx="20" ry="13" fill="none" stroke="#4d4d4d" stroke-width="3.33"/>

  <!-- Socket hole: AU/CN angled slots -->
  <rect x="143" y="118" width="9" height="16" rx="4" fill="#000000" transform="rotate(-30 147 126)"/>
  <rect x="159" y="118" width="9" height="16" rx="4" fill="#000000" transform="rotate(30 163 126)"/>

  <!-- USB-A port on front face -->
  <rect x="95" y="158" width="22" height="12" rx="2" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <rect x="98" y="161" width="16" height="6" rx="1" fill="#2a4ec0"/>

  <!-- USB-C port -->
  <rect x="130" y="158" width="20" height="10" rx="5" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="3.33"/>

  <!-- Folding prong (UK style, folded out on right side) -->
  <rect x="218" y="85" width="16" height="30" rx="5" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="224" y="115" width="8" height="14" rx="3" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Folding prong hinge dot -->
  <circle cx="226" cy="90" r="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.22"/>

  <!-- Folding prong (US style pins, other side) -->
  <rect x="218" y="135" width="7" height="22" rx="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="228" y="135" width="7" height="22" rx="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
</g></svg>