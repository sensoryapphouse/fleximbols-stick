  <circle cx="220" cy="115" r="22" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="13.34"/>
  <circle cx="220" cy="115" r="14" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="8.89"/>
  <!-- six band positions -->
  <circle cx="220" cy="98" r="2.5" fill="#fff200" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="234" cy="106" r="2.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="234" cy="124" r="2.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="220" cy="132" r="2.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="206" cy="124" r="2.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="206" cy="106" r="2.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="220" y1="115" x2="220" y2="103" stroke="#f8130d" stroke-width="13.34" stroke-linecap="round"/>
  <!-- tuning knob bottom right -->
  <circle cx="220" cy="175" r="18" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="13.34"/>
  <circle cx="220" cy="175" r="10" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="8.89"/>
  <line x1="220" y1="167" x2="220" y2="175" stroke="#f7de58" stroke-width="13.34" stroke-linecap="round"/>
