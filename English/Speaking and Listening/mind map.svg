  <!-- Mind map: central node with 5 branches radiating to child bubbles -->

  <!-- Branch lines (drawn first, behind nodes) -->
  <!-- Centre 145,120 -->
  <!-- Branch to top-left -->
  <line x1="145" y1="120" x2="58" y2="52" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Branch to top-right -->
  <line x1="145" y1="120" x2="232" y2="52" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Branch to right -->
  <line x1="145" y1="120" x2="248" y2="130" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Branch to bottom-left -->
  <line x1="145" y1="120" x2="58" y2="188" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Branch to bottom-right -->
  <line x1="145" y1="120" x2="232" y2="188" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Child bubbles (rx/ry rounded rectangles) -->
  <!-- Top-left: blue -->
  <rect x="28" y="30" width="60" height="42" rx="21" ry="21" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Top-right: red -->
  <rect x="202" y="30" width="60" height="42" rx="21" ry="21" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Right: orange -->
  <rect x="218" y="109" width="60" height="42" rx="21" ry="21" fill="#ff9900" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Bottom-left: green -->
  <rect x="28" y="168" width="60" height="42" rx="21" ry="21" fill="#529929" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Bottom-right: purple -->
  <rect x="202" y="168" width="60" height="42" rx="21" ry="21" fill="#7c3fac" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- Central node (larger, yellow rounded rect) -->
  <rect x="100" y="88" width="90" height="64" rx="32" ry="32" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
</g></svg>