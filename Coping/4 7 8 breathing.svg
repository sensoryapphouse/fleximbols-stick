  <path d="M155 134 L150 130" fill="none" stroke="#ff9900" stroke-width="4.45" stroke-linecap="round"/>
  <!-- 7 numeral -->
  <path d="M185 105 L215 105 L200 140" fill="none" stroke="#ff9900" stroke-width="5.55" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Breath-out arrow (8) -->
  <path d="M180 180 Q160 185 140 180" fill="none" stroke="#d01424" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M147 173 L140 180 L147 187" fill="none" stroke="#d01424" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 8 numeral (two stacked circles) -->
