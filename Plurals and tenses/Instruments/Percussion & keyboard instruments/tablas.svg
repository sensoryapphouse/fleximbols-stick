  <!-- Tabla-modern: PAIR of hand drums — small wooden right drum + larger metal bowl-shaped left drum (bayan) -->
  <!-- LEFT drum: bayan — larger metal bowl-shaped (wider, lower, bowl/hemisphere shape) -->
  <!-- Bowl body -->
  <path d="M35,148 Q35,208 105,215 Q175,208 175,148 Z" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Metal sheen highlight -->
  <path d="M50,148 Q50,200 105,205 Q160,200 160,148 Z" fill="#efefef" stroke="#1a1a1a" stroke-width="0.00"/>
  <path d="M35,148 Q35,208 105,215 Q175,208 175,148 Z" fill="none" stroke="#1a1a1a" stroke-width="7.40"/>
  <!-- Bayan drumhead (flat top ellipse) -->
  <ellipse cx="105" cy="148" rx="70" ry="18" fill="#efefef" stroke="#1a1a1a" stroke-width="7.40"/>
  <!-- Black tuning circle on bayan head -->
  <ellipse cx="105" cy="148" rx="38" ry="10" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Lacing/straps on bayan side -->
  <line x1="55" y1="152" x2="50" y2="205" stroke="#5e1f0a" stroke-width="4.45"/>
  <line x1="75" y1="156" x2="72" y2="212" stroke="#5e1f0a" stroke-width="4.45"/>
  <line x1="105" y1="158" x2="105" y2="213" stroke="#5e1f0a" stroke-width="4.45"/>
  <line x1="135" y1="156" x2="138" y2="212" stroke="#5e1f0a" stroke-width="4.45"/>
  <line x1="155" y1="152" x2="160" y2="205" stroke="#5e1f0a" stroke-width="4.45"/>

  <!-- RIGHT drum: dayan — small wooden cylinder/tapering drum -->
  <!-- Drum body (cylinder, tapering slightly) -->
  <path d="M185,115 L185,210 Q185,218 210,220 Q235,218 235,210 L235,115 Z" fill="#9d7246" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Wood grain lines -->
  <line x1="195" y1="115" x2="195" y2="220" stroke="#7d5e23" stroke-width="2.96"/>
  <line x1="207" y1="115" x2="207" y2="221" stroke="#7d5e23" stroke-width="2.96"/>
  <line x1="220" y1="115" x2="220" y2="221" stroke="#7d5e23" stroke-width="2.96"/>
  <!-- Dayan drumhead (top ellipse) -->
  <ellipse cx="210" cy="115" rx="25" ry="9" fill="#efefef" stroke="#1a1a1a" stroke-width="7.40"/>
  <!-- Black tuning circle on dayan head -->
  <ellipse cx="210" cy="115" rx="14" ry="5" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Lacing/straps on dayan side -->
  <line x1="187" y1="122" x2="184" y2="210" stroke="#5e1f0a" stroke-width="4.45"/>
  <line x1="197" y1="124" x2="196" y2="219" stroke="#5e1f0a" stroke-width="4.45"/>
  <line x1="210" y1="124" x2="210" y2="220" stroke="#5e1f0a" stroke-width="4.45"/>
  <line x1="223" y1="124" x2="224" y2="219" stroke="#5e1f0a" stroke-width="4.45"/>
  <line x1="233" y1="122" x2="236" y2="210" stroke="#5e1f0a" stroke-width="4.45"/>
