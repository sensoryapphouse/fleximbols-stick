<line x1="225" y1="316" x2="231" y2="328"/>
<line x1="225" y1="316" x2="237" y2="322"/>
<line x1="205" y1="274" x2="199" y2="262"/>
<line x1="205" y1="274" x2="193" y2="268"/>
<line x1="205" y1="316" x2="199" y2="328"/>
<line x1="205" y1="316" x2="193" y2="322"/>
<line x1="225" y1="274" x2="231" y2="262"/>
<line x1="225" y1="274" x2="237" y2="268"/>
</g>
</g>
<!-- cold thermometer (blue, bottomed out) at right -->
<rect x="416" y="246" width="30" height="180" rx="15" fill="#ffffff" stroke="#1a1a1a" stroke-width="9"/>
<circle cx="431" cy="430" r="28" fill="#3aa6d6" stroke="#1a1a1a" stroke-width="9"/>
<rect x="422" y="398" width="18" height="36" rx="9" fill="#3aa6d6" stroke="#1a1a1a" stroke-width="0"/>
