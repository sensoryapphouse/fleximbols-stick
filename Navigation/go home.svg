  <!-- Sky background suggestion via house -->
  <!-- Arrow pointing toward house (direction indicator) -->
  <polygon points="30,130 55,110 55,120 90,120 90,140 55,140 55,150" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- House body -->
  <rect x="160" y="130" width="110" height="90" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Roof -->
  <polygon points="150,135 215,75 280,135" fill="#d01424" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Door -->
  <rect x="196" y="170" width="38" height="50" fill="#9d7246" stroke="#1a1a1a" stroke-width="3.55" stroke-linejoin="round"/>
  <!-- Door knob -->
  <circle cx="228" cy="196" r="4" fill="#f7de58" stroke="#1a1a1a" stroke-width="1.78"/>
  <!-- Window -->
  <rect x="165" y="148" width="26" height="22" fill="#dff3fd" stroke="#1a1a1a" stroke-width="2.66" stroke-linejoin="round"/>
  <!-- Window cross -->
  <line x1="178" y1="148" x2="178" y2="170" stroke="#1a1a1a" stroke-width="1.78"/>
  <line x1="165" y1="159" x2="191" y2="159" stroke="#1a1a1a" stroke-width="1.78"/>
  <!-- Walking figure facing away (back view, walking toward house) -->
  <!-- Head (back) -->
  <circle cx="115" cy="85" r="18" fill="#e6b98a" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Body -->
  <rect x="101" y="103" width="28" height="42" rx="4" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Left leg (striding) -->
  <line x1="108" y1="145" x2="100" y2="185" stroke="#4d4d4d" stroke-width="5.33" stroke-linecap="round"/>
  <line x1="100" y1="185" x2="92" y2="185" stroke="#4d4d4d" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Right leg (forward) -->
  <line x1="122" y1="145" x2="132" y2="178" stroke="#4d4d4d" stroke-width="5.33" stroke-linecap="round"/>
  <line x1="132" y1="178" x2="142" y2="180" stroke="#4d4d4d" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Left arm -->
  <line x1="101" y1="112" x2="88" y2="138" stroke="#e6b98a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Right arm (swinging forward) -->
  <line x1="129" y1="112" x2="142" y2="130" stroke="#e6b98a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Ground line -->
  <line x1="15" y1="215" x2="275" y2="215" stroke="#529929" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Grass -->
  <rect x="15" y="215" width="260" height="15" rx="3" fill="#529929" stroke="#1a1a1a" stroke-width="2.66" stroke-linejoin="round"/>
