  <!-- USB device body — tall rounded rectangle -->
  <rect x="102" y="38" width="86" height="152" rx="16" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- USB plug at top -->
  <rect x="120" y="26" width="50" height="22" rx="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- USB plug inner contacts -->
  <rect x="130" y="32" width="10" height="10" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <rect x="150" y="32" width="10" height="10" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <!-- Small screen on device -->
  <rect x="114" y="65" width="62" height="44" rx="6" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Screen content — abstract bar suggestion of data (no text) -->
  <rect x="122" y="75" width="46" height="6" rx="2" fill="#90a7d6" stroke="none"/>
  <rect x="122" y="87" width="32" height="6" rx="2" fill="#90a7d6" stroke="none"/>
  <!-- Confirm button -->
  <circle cx="145" cy="138" r="16" fill="#529929" stroke="#1a1a1a" stroke-width="5.55"/>
  <circle cx="145" cy="138" r="9" fill="#137827" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Side button suggestion -->
  <rect x="97" y="100" width="8" height="22" rx="4" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Lanyard hole -->
  <circle cx="145" cy="178" r="8" fill="none" stroke="#1a1a1a" stroke-width="5.55"/>
</g></svg>