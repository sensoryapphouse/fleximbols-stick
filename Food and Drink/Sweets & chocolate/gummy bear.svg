  <circle cx="104" cy="40" r="22" fill="#f8130d" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="104" cy="40" r="12" fill="#f4a4b2" stroke="none"/>
  <!-- Right ear -->
  <circle cx="186" cy="40" r="22" fill="#f8130d" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round" stroke-linejoin="round"/>
