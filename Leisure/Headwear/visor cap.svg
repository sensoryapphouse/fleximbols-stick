  <!-- Open headband arc (no crown — key distinguisher) -->
  <path d="M62,155 Q60,110 145,98 Q230,110 228,155" fill="none" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Headband body — a curved strip -->
  <path d="M62,155 Q60,110 145,98 Q230,110 228,155 L218,160 Q228,118 145,108 Q62,118 72,160 Z" fill="#f8130d" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Open top — show sky/void clearly by not filling above band -->
  <!-- Curved brim projecting forward from front of band -->
  <path d="M72,160 Q55,163 38,172 Q34,181 44,186 Q80,190 145,188 Q210,190 246,186 Q256,181 252,172 Q235,163 218,160 Z" fill="#d01424" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round" stroke-linejoin="round"/>
