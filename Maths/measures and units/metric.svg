<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Metric: gauge/number-card with trend arrow -->

  <!-- Card background -->
  <rect x="40" y="30" width="210" height="150" rx="14" ry="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>

  <!-- Card header bar -->
  <rect x="40" y="30" width="210" height="38" rx="14" ry="14" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <rect x="40" y="50" width="210" height="18" fill="#2a4ec0" stroke="none"/>

  <!-- Gauge semicircle track -->
  <path d="M 80 150 A 65 65 0 0 1 210 150" fill="none" stroke="#b8b8b8" stroke-width="15.55" stroke-linecap="round"/>
  <!-- Gauge fill (showing ~70% reading) -->
  <path d="M 80 150 A 65 65 0 0 1 174 96" fill="none" stroke="#529929" stroke-width="15.55" stroke-linecap="round"/>

  <!-- Gauge needle -->
  <line x1="145" y1="150" x2="172" y2="98" stroke="#f8130d" stroke-width="5.55" stroke-linecap="round"/>
  <circle cx="145" cy="150" r="9" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Gauge tick marks -->
  <line x1="80" y1="150" x2="90" y2="150" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="210" y1="150" x2="200" y2="150" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="145" y1="85" x2="145" y2="95" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Trend arrow (up-right, bottom right of card) -->
  <polyline points="195,165 220,140 235,155" fill="none" stroke="#529929" stroke-width="5.55" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow head -->
  <polygon points="235,155 222,136 242,136" fill="#529929" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- Small bar chart inside card bottom -->
  <rect x="55" y="140" width="12" height="22" fill="#90a7d6" stroke="#1a1a1a" stroke-width="3.33"/>
  <rect x="72" y="128" width="12" height="34" fill="#90a7d6" stroke="#1a1a1a" stroke-width="3.33"/>
  <rect x="89" y="118" width="12" height="44" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="3.33"/>
</g></svg>