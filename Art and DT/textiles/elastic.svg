  <path d="M 68 112 Q 145 60 222 112" fill="none" stroke="#1a1a1a" stroke-width="7.77" stroke-linecap="round"/>
  <path d="M 68 112 Q 145 60 222 112" fill="none" stroke="#f8130d" stroke-width="3.33" stroke-linecap="round" stroke-dasharray="8,4"/>
