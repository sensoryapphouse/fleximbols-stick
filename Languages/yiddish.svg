<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Traditional book (siddur / Yiddish book) - back cover -->
  <path d="M 40,55 L 250,55 L 250,210 L 40,210 Z" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Book spine highlight -->
  <line x1="145" y1="55" x2="145" y2="210" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Open book pages -->
  <path d="M 50,65 L 142,65 L 145,205 L 50,200 Z" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <path d="M 148,65 L 240,65 L 240,200 L 145,205 Z" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Left page: Yiddish-style letter shapes (alef, lamed, shin - drawn as shapes not text) -->
  <!-- Alef-like shape -->
  <path d="M 65,85 L 65,110 M 65,85 L 80,90 M 65,110 L 80,108 M 80,90 L 80,108" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Lamed-like shape -->
  <path d="M 95,75 L 95,115 L 110,115" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Shin-like shape -->
  <path d="M 120,85 L 120,115 M 128,80 L 128,115 M 136,85 L 136,115 M 120,115 L 136,115" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Left page lines (text) -->
  <line x1="60" y1="135" x2="135" y2="135" stroke="#7f7f7f" stroke-width="2.96"/>
  <line x1="60" y1="150" x2="135" y2="150" stroke="#7f7f7f" stroke-width="2.96"/>
  <line x1="60" y1="165" x2="135" y2="165" stroke="#7f7f7f" stroke-width="2.96"/>
  <line x1="60" y1="180" x2="125" y2="180" stroke="#7f7f7f" stroke-width="2.96"/>
  <!-- Right page: Star of David -->
  <!-- Upward triangle -->
  <path d="M 193,80 L 215,118 L 171,118 Z" fill="none" stroke="#1d0e82" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Downward triangle -->
  <path d="M 193,128 L 171,90 L 215,90 Z" fill="none" stroke="#1d0e82" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Right page lines beneath star -->
  <line x1="160" y1="150" x2="230" y2="150" stroke="#7f7f7f" stroke-width="2.96"/>
  <line x1="160" y1="165" x2="230" y2="165" stroke="#7f7f7f" stroke-width="2.96"/>
  <line x1="160" y1="180" x2="220" y2="180" stroke="#7f7f7f" stroke-width="2.96"/>
  <!-- Book cover decorative border -->
  <rect x="48" y="63" width="194" height="6" fill="#f7de58" stroke="#1a1a1a" stroke-width="2.96"/>
</g></svg>