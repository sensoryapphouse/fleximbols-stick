<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- drawing compass: pivot at top, two legs (point + pencil), circle being drawn -->

  <!-- partial circle being drawn (dashed) -->
  <circle cx="135" cy="180" r="45" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-dasharray="5 4"/>
  <!-- the freshly drawn arc segment (solid) -->
  <path d="M 90 180 A 45 45 0 0 1 135 135" fill="none" stroke="#137827" stroke-width="6.67" stroke-linecap="round"/>

  <!-- pivot / hinge knob at top -->
  <circle cx="135" cy="50" r="12" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="8.89"/>
  <circle cx="135" cy="50" r="4" fill="#000000"/>
  <!-- adjustment screw on knob -->
  <line x1="135" y1="38" x2="135" y2="32" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <circle cx="135" cy="30" r="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- left leg ending in needle point (anchor of compass at the circle centre) -->
  <path d="M132 60 L88 178 L92 182 L138 62 Z" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- needle tip -->
  <path d="M88 178 L92 182 L90 188 L86 184 Z" fill="#000000" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- right leg holding pencil -->
  <path d="M138 60 L178 168 L174 172 L132 62 Z" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- pencil collar -->
  <rect x="170" y="160" width="14" height="12" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- pencil body -->
  <rect x="171" y="170" width="12" height="22" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- pencil wood -->
  <path d="M171 192 L183 192 L181 198 L173 198 Z" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- pencil graphite tip -->
  <path d="M173 198 L181 198 L177 204 Z" fill="#000000" stroke="#1a1a1a" stroke-width="2.22" stroke-linejoin="round"/>

  <!-- centre dot where the point meets paper -->
  <circle cx="90" cy="186" r="2.5" fill="#000000"/>
</g></svg>