<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- X-shaped chromosome — two sister chromatids crossing -->
  <!-- Left chromatid -->
  <path d="M 90 30 Q 80 70 120 115 Q 80 160 90 210" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Right chromatid -->
  <path d="M 200 30 Q 210 70 170 115 Q 210 160 200 210" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Centromere band (constriction in middle) -->
  <ellipse cx="145" cy="115" rx="30" ry="10" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Banding patterns on left chromatid -->
  <path d="M 87 55 Q 95 55 105 55" stroke="#1a1a1a" stroke-width="4.45" fill="none" stroke-linecap="round"/>
  <path d="M 85 80 Q 95 80 110 80" stroke="#1a1a1a" stroke-width="4.45" fill="none" stroke-linecap="round"/>
  <path d="M 88 150 Q 95 150 110 150" stroke="#1a1a1a" stroke-width="4.45" fill="none" stroke-linecap="round"/>
  <path d="M 87 180 Q 95 180 105 180" stroke="#1a1a1a" stroke-width="4.45" fill="none" stroke-linecap="round"/>
  <!-- Banding patterns on right chromatid -->
  <path d="M 185 55 Q 195 55 203 55" stroke="#1a1a1a" stroke-width="4.45" fill="none" stroke-linecap="round"/>
  <path d="M 180 80 Q 195 80 205 80" stroke="#1a1a1a" stroke-width="4.45" fill="none" stroke-linecap="round"/>
  <path d="M 180 150 Q 195 150 205 150" stroke="#1a1a1a" stroke-width="4.45" fill="none" stroke-linecap="round"/>
  <path d="M 185 180 Q 195 180 203 180" stroke="#1a1a1a" stroke-width="4.45" fill="none" stroke-linecap="round"/>
</g></svg>