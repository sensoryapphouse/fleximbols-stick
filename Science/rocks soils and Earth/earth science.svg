<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Earth cross-section as a circle, clipped to show layers -->
  <!-- Outer circle boundary -->
  <circle cx="145" cy="125" r="105" fill="#9d7246" stroke="#1a1a1a" stroke-width="7.40"/>
  <!-- Mantle layer -->
  <circle cx="145" cy="125" r="85" fill="#e65a00" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Outer core -->
  <circle cx="145" cy="125" r="58" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Inner core -->
  <circle cx="145" cy="125" r="30" fill="#f2e40d" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Cross-section cut line (horizontal) - flat earth cross-section look -->
  <line x1="40" y1="125" x2="250" y2="125" stroke="#1a1a1a" stroke-width="2.96" stroke-dasharray="6,4" stroke-linecap="round"/>
  <line x1="145" y1="20" x2="145" y2="230" stroke="#1a1a1a" stroke-width="2.96" stroke-dasharray="6,4" stroke-linecap="round"/>

  <!-- Crust detail: small mountain bumps on top surface -->
  <path d="M80,22 L95,10 L110,22 L125,15 L145,20" fill="none" stroke="#5e1f0a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M145,20 L162,14 L178,22 L195,18 L210,22" fill="none" stroke="#5e1f0a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Tectonic plate fault line on crust surface -->
  <path d="M80,42 Q100,38 112,45 Q125,52 140,46 Q155,40 170,47 Q185,54 200,48 Q215,42 225,50"
        fill="none" stroke="#5e1f0a" stroke-width="3.70" stroke-linecap="round"/>

  <!-- Layer labels (drawn as indicator bars/arrows) -->
  <!-- Crust indicator -->
  <line x1="15" y1="32" x2="40" y2="32" stroke="#9d7246" stroke-width="5.93" stroke-linecap="round"/>
  <polygon points="38,28 38,36 46,32" fill="#9d7246"/>
  <!-- Mantle indicator -->
  <line x1="15" y1="85" x2="40" y2="85" stroke="#e65a00" stroke-width="5.93" stroke-linecap="round"/>
  <polygon points="38,81 38,89 46,85" fill="#e65a00"/>
  <!-- Core indicator -->
  <line x1="15" y1="125" x2="40" y2="125" stroke="#f8130d" stroke-width="5.93" stroke-linecap="round"/>
  <polygon points="38,121 38,129 46,125" fill="#f8130d"/>

  <!-- Small bracket lines to show crust thickness at left -->
  <line x1="33" y1="22" x2="33" y2="42" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="29" y1="22" x2="37" y2="22" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="29" y1="42" x2="37" y2="42" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
</g></svg>