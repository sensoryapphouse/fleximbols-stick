  <ellipse cx="88" cy="175" rx="52" ry="16" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Black tuning spot on head -->
  <ellipse cx="88" cy="175" rx="26" ry="8" fill="#000000" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Tuning straps (vertical laces around bowl) -->
  <line x1="50" y1="175" x2="58" y2="218" stroke="#5e1f0a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="64" y1="174" x2="68" y2="219" stroke="#5e1f0a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="78" y1="174" x2="80" y2="220" stroke="#5e1f0a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="98" y1="174" x2="98" y2="220" stroke="#5e1f0a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="112" y1="174" x2="110" y2="219" stroke="#5e1f0a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="126" y1="175" x2="120" y2="217" stroke="#5e1f0a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Tuning ring (wooden block) on left drum -->
  <rect x="40" y="188" width="12" height="8" rx="2" fill="#9d7246" stroke="#1a1a1a" stroke-width="3.33"/>
  <rect x="122" y="188" width="12" height="8" rx="2" fill="#9d7246" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- === SMALL WOODEN DRUM (dayan) RIGHT === -->
