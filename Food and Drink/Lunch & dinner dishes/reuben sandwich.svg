<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Reuben sandwich: grilled rye bread + corned beef + SAUERKRAUT + melted Swiss + Russian-dressing drip -->

  <!-- Bottom grilled rye slice -->
  <rect x="48" y="198" width="194" height="26" rx="5" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="7.40" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Butter-toasted golden edge -->
  <rect x="48" y="198" width="194" height="6" rx="3" fill="#ff9900" stroke="none"/>
  <!-- Grill marks on bottom bread -->
  <line x1="76" y1="200" x2="72" y2="222" stroke="#4d4d4d" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="104" y1="200" x2="100" y2="222" stroke="#4d4d4d" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="148" y1="200" x2="144" y2="222" stroke="#4d4d4d" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="192" y1="200" x2="188" y2="222" stroke="#4d4d4d" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="220" y1="200" x2="216" y2="222" stroke="#4d4d4d" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Corned beef layer (pink-grey meat, ruffled slices) -->
  <path d="M52,188 Q52,174 145,172 Q238,174 238,188 L238,200 Q238,190 145,190 Q52,190 52,200 Z" fill="#e6b98a" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Corned beef fat streaks -->
  <path d="M70,180 Q102,177 134,180" fill="none" stroke="#eed5b6" stroke-width="2.96" stroke-linecap="round"/>
  <path d="M158,178 Q190,175 222,178" fill="none" stroke="#eed5b6" stroke-width="2.96" stroke-linecap="round"/>

  <!-- SAUERKRAUT layer (KEY differentiator: pale yellow-white shredded kraut) -->
  <path d="M50,158 Q50,145 145,142 Q240,145 240,158 L238,172 Q238,163 145,161 Q52,163 52,172 Z" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Sauerkraut wiggly shred texture -->
  <path d="M64,151 Q74,147 84,152 Q92,146 104,151 Q112,146 122,151" fill="none" stroke="#7d5e23" stroke-width="2.96" stroke-linecap="round"/>
  <path d="M128,149 Q138,144 148,149 Q158,144 168,149 Q178,144 188,149" fill="none" stroke="#7d5e23" stroke-width="2.96" stroke-linecap="round"/>
  <path d="M192,151 Q202,146 214,151 Q222,146 232,151" fill="none" stroke="#7d5e23" stroke-width="2.96" stroke-linecap="round"/>
  <path d="M68,158 Q82,154 96,158 Q108,154 120,158" fill="none" stroke="#7d5e23" stroke-width="2.96" stroke-linecap="round"/>
  <path d="M136,156 Q152,151 168,156 Q180,151 196,156" fill="none" stroke="#7d5e23" stroke-width="2.96" stroke-linecap="round"/>

  <!-- Melted Swiss cheese draped over sauerkraut -->
  <path d="M50,144 Q50,134 145,131 Q240,134 240,144 L240,158 Q240,148 145,145 Q50,148 50,158 Z" fill="#f2e40d" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Melted cheese drips on sides -->
  <path d="M57,150 Q55,162 57,158" fill="none" stroke="#f2e40d" stroke-width="5.93" stroke-linecap="round"/>
  <path d="M234,150 Q236,162 234,158" fill="none" stroke="#f2e40d" stroke-width="5.93" stroke-linecap="round"/>
  <!-- Swiss cheese holes -->
  <ellipse cx="92" cy="138" rx="8" ry="4" fill="#fff200" stroke="#7d5e23" stroke-width="2.22"/>
  <ellipse cx="145" cy="136" rx="8" ry="4" fill="#fff200" stroke="#7d5e23" stroke-width="2.22"/>
  <ellipse cx="198" cy="138" rx="8" ry="4" fill="#fff200" stroke="#7d5e23" stroke-width="2.22"/>

  <!-- Russian dressing drip on side (orange-red) -->
  <path d="M96,194 Q94,206 95,216" fill="none" stroke="#ff9900" stroke-width="6.66" stroke-linecap="round"/>
  <circle cx="95" cy="217" r="5" fill="#ff9900" stroke="#1a1a1a" stroke-width="2.96"/>

  <!-- Top grilled rye slice -->
  <rect x="48" y="104" width="194" height="26" rx="5" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="7.40" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Golden toasted top edge -->
  <rect x="48" y="104" width="194" height="6" rx="3" fill="#ff9900" stroke="none"/>
  <!-- Grill marks top bread -->
  <line x1="76" y1="106" x2="72" y2="128" stroke="#4d4d4d" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="112" y1="106" x2="108" y2="128" stroke="#4d4d4d" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="148" y1="106" x2="144" y2="128" stroke="#4d4d4d" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="184" y1="106" x2="180" y2="128" stroke="#4d4d4d" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="218" y1="106" x2="214" y2="128" stroke="#4d4d4d" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Caraway seeds on rye -->
  <ellipse cx="88" cy="116" rx="4" ry="2" fill="#4d4d4d" stroke="none" transform="rotate(-20,88,116)"/>
  <ellipse cx="128" cy="114" rx="4" ry="2" fill="#4d4d4d" stroke="none" transform="rotate(15,128,114)"/>
  <ellipse cx="166" cy="114" rx="4" ry="2" fill="#4d4d4d" stroke="none" transform="rotate(-15,166,114)"/>
  <ellipse cx="204" cy="116" rx="4" ry="2" fill="#4d4d4d" stroke="none" transform="rotate(20,204,116)"/>
</g></svg>