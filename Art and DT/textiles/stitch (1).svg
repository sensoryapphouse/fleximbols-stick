  <ellipse cx="187.5" cy="116" rx="3" ry="5" fill="none" stroke="#1a1a1a" stroke-width="3.70" stroke-linecap="round"/>
  <!-- Thread coming from needle eye up and to the side -->
  <path d="M187,116 Q200,80 230,60 Q245,52 255,58" fill="none" stroke="#f8130d" stroke-width="5.93" stroke-linecap="round"/>
  <!-- Thread spool at top right -->
