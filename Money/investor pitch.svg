  <path d="M 68 48 Q 84 32 100 48" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.66" stroke-linecap="round"/>
  <!-- Body/shirt -->
  <rect x="68" y="68" width="32" height="48" rx="6" ry="6" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Pointing arm toward board -->
  <line x1="100" y1="80" x2="120" y2="72" stroke="#eed5b6" stroke-width="7.11" stroke-linecap="round"/>
  <!-- Other arm down -->
  <line x1="68" y1="80" x2="58" y2="105" stroke="#eed5b6" stroke-width="7.11" stroke-linecap="round"/>
  <!-- Legs -->
  <rect x="72" y="116" width="12" height="48" rx="4" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="84" y="116" width="12" height="48" rx="4" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
