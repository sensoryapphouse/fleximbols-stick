  <!-- Cup body (weighted, wider bottom) -->
  <path d="M108 85 L98 195 Q98 206 110 206 L185 206 Q197 206 197 195 L182 85 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.94" stroke-linejoin="round"/>
  <!-- Weighted base bump -->
  <ellipse cx="145" cy="202" rx="50" ry="12" fill="#90a7d6" stroke="#1a1a1a" stroke-width="4.94"/>
  <!-- 360-degree rim lid — outer ring -->
  <ellipse cx="145" cy="84" rx="52" ry="16" fill="#529929" stroke="#1a1a1a" stroke-width="4.94"/>
  <!-- 360-degree rim lid — inner ring (channel) -->
  <ellipse cx="145" cy="84" rx="34" ry="10" fill="#67832d" stroke="#1a1a1a" stroke-width="3.95"/>
  <!-- Rim top dome (no-spill lip) -->
  <path d="M93 84 Q93 58 145 58 Q197 58 197 84" fill="#529929" stroke="#1a1a1a" stroke-width="4.94" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Tilt motion arc (shows cup tilts freely) -->
  <path d="M54 150 Q46 120 64 96" fill="none" stroke="#f8130d" stroke-width="3.95" stroke-linecap="round" stroke-dasharray="7 5"/>
