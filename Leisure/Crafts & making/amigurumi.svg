  <!-- Mouth -->
  <path d="M 145 94 L 145 100 M 145 100 Q 138 105 134 102 M 145 100 Q 152 105 156 102" fill="none" stroke="#1a1a1a" stroke-width="3.56" stroke-linecap="round"/>

  <!-- Cheek blush -->
  <circle cx="112" cy="92" r="5" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="2.13"/>
  <circle cx="178" cy="92" r="5" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="2.13"/>
