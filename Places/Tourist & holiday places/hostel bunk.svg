  <rect x="241" y="30" width="14" height="196" rx="5" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Top bunk platform/board -->
  <rect x="35" y="68" width="220" height="14" rx="4" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
