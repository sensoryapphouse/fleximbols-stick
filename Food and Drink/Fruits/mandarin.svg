<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <defs>
    <!-- Large 5-point star r=26 -->
    <path id="bigstar" d="M0,-26 L6.1,-8.4 L24.7,-8.1 L10.0,3.2 L15.3,22.4 L0,11.7 L-15.3,22.4 L-10.0,3.2 L-24.7,-8.1 L-6.1,-8.4 Z"/>
    <!-- Small 5-point star r=9 -->
    <path id="smstar" d="M0,-9 L2.1,-2.9 L8.6,-2.8 L3.5,1.1 L5.3,7.8 L0,4.1 L-5.3,7.8 L-3.5,1.1 L-8.6,-2.8 L-2.1,-2.9 Z"/>
  </defs>
  <!-- Speech bubble: rounded rectangle body -->
  <rect x="40" y="44" width="204" height="148" rx="28" ry="28" fill="#d01424" stroke="#1a1a1a" stroke-width="11.11" stroke-linejoin="round"/>
  <!-- Bubble tail pointing bottom-left -->
  <polygon points="72,192 56,228 100,192" fill="#d01424" stroke="#1a1a1a" stroke-width="11.11" stroke-linejoin="round"/>
  <!-- Cover the tail-join interior line -->
  <polygon points="72,192 100,192 86,200" fill="#d01424" stroke="none"/>
  <!-- Large yellow star (main) — offset left of centre to leave room for 4 small -->
  <use href="#bigstar" transform="translate(128,118)" fill="#f7de58" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- Four small yellow stars arranged in arc around the large one -->
  <!-- Top right -->
  <use href="#smstar" transform="translate(175,80)" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Right -->
  <use href="#smstar" transform="translate(192,110)" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Lower right -->
  <use href="#smstar" transform="translate(183,143)" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Lower -->
  <use href="#smstar" transform="translate(162,162)" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
</g></svg>