<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- clothes hanger: single wire hanger + curved hook on top -->

  <!-- Hook -->
  <path d="M145 70 L145 50 Q145 30 130 30 Q115 30 115 45"
        fill="none" stroke="#7f7f7f" stroke-width="11.85" stroke-linecap="round"/>
  <!-- Hook inner highlight -->
  <path d="M145 70 L145 50 Q145 30 130 30 Q115 30 115 45"
        fill="none" stroke="#b8b8b8" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Hook outline -->
  <path d="M145 70 L145 50 Q145 30 130 30 Q115 30 115 45"
        fill="none" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>

  <!-- Twist where hook meets triangle (small coil) -->
  <ellipse cx="145" cy="72" rx="6" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.96"/>

  <!-- Hanger triangle (wire) - two sloping shoulders -->
  <path d="M145 75 L55 165 L235 165 Z"
        fill="none" stroke="#1a1a1a" stroke-width="2.96" stroke-linejoin="round"/>

  <!-- Wire body - outer black + inner gray to make it look like wire -->
  <path d="M145 75 L55 165" fill="none" stroke="#1a1a1a" stroke-width="11.85" stroke-linecap="round"/>
  <path d="M145 75 L235 165" fill="none" stroke="#1a1a1a" stroke-width="11.85" stroke-linecap="round"/>
  <path d="M55 165 L235 165" fill="none" stroke="#1a1a1a" stroke-width="11.85" stroke-linecap="round"/>

  <!-- Wire inner color (gray) -->
  <path d="M145 78 L60 162" fill="none" stroke="#7f7f7f" stroke-width="7.40" stroke-linecap="round"/>
  <path d="M145 78 L230 162" fill="none" stroke="#7f7f7f" stroke-width="7.40" stroke-linecap="round"/>
  <path d="M60 165 L230 165" fill="none" stroke="#7f7f7f" stroke-width="7.40" stroke-linecap="round"/>

  <!-- Highlight -->
  <path d="M145 80 L70 158" fill="none" stroke="#b8b8b8" stroke-width="2.96" stroke-linecap="round"/>
  <path d="M65 168 L220 168" fill="none" stroke="#b8b8b8" stroke-width="2.96" stroke-linecap="round"/>

  <!-- Tips of bottom bar (rounded ends emphasised) -->
  <circle cx="55" cy="165" r="6" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.96"/>
  <circle cx="235" cy="165" r="6" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.96"/>
</g><g transform="translate(360 8) scale(0.2812)"><defs><radialGradient id="plg1902" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#plg1902)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>