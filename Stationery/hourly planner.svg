  <!-- schedule blocks spanning multiple hours -->
  <rect x="88" y="68" width="125" height="20" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="88" y="104" width="125" height="13" fill="#529929" stroke="#1a1a1a" stroke-width="4.45"/>
