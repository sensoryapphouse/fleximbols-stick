  <!-- cream-moisturizer: rich opaque cream jar + thick dollop on fingertip + CREAM label -->
  <!-- Jar body (opaque pink/cream, rich) -->
  <rect x="55" y="100" width="180" height="120" rx="18" ry="18" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Jar inner shadow -->
  <line x1="222" y1="115" x2="222" y2="205" stroke="#d01424" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Lid (matte heavy cap) -->
  <rect x="50" y="68" width="190" height="38" rx="10" ry="10" fill="#f266aa" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Lid rim line -->
  <line x1="50" y1="84" x2="240" y2="84" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Jar label (creamy white) -->
  <rect x="92" y="140" width="106" height="42" rx="3" ry="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- "CREAM" big letters as paths -->
  <!-- Fingertip with thick cream dollop (above jar) -->
  <!-- Finger -->
  <path d="M165 30 Q165 55 195 55 Q225 55 225 30 L225 12 Q225 6 220 6 L170 6 Q165 6 165 12 Z" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Nail -->
  <ellipse cx="195" cy="12" rx="14" ry="5" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="3.70"/>
  <!-- Thick cream dollop on finger pad (rich, peaked) -->
  <path d="M170 42 Q175 26 195 28 Q215 26 220 42 Q220 50 195 50 Q170 50 170 42 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.18" stroke-linejoin="round"/>
  <!-- Cream peak (rich, swirled top) -->
  <path d="M188 28 Q192 18 200 22 Q198 28 195 28 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Cream highlight -->
  <ellipse cx="185" cy="38" rx="8" ry="3" fill="#efefef" stroke="none"/>
  <!-- Cream sparkle -->
  <path d="M210 30 L212 34 L216 36 L212 38 L210 42 L208 38 L204 36 L208 34 Z" fill="#fff200" stroke="#1a1a1a" stroke-width="2.22" stroke-linejoin="round"/>
  <!-- cream dollop swirl (replaces CREAM text) -->
  <path d="M140 170 Q148 160 156 168 Q162 175 155 180 Q148 186 140 180 Q134 175 140 170 Z" fill="#eed5b6" stroke="#1a1a1a" stroke-width="3.70" stroke-linejoin="round"/>
  <path d="M148 160 Q148 152 152 148 Q156 152 155 160" fill="none" stroke="#eed5b6" stroke-width="4.45" stroke-linecap="round"/>
</g></svg>