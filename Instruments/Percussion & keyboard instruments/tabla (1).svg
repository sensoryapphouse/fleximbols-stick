  <path d="M168,152 Q158,220 176,222 Q210,224 228,222 Q246,220 236,152 Z" fill="#9d7246" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Drum bottom rim -->
  <ellipse cx="202" cy="222" rx="28" ry="7" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Drum head -->
  <ellipse cx="202" cy="152" rx="34" ry="11" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Black tuning spot on head -->
  <ellipse cx="202" cy="152" rx="16" ry="6" fill="#000000" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Tuning straps (vertical laces on cylinder) -->
  <line x1="172" y1="152" x2="178" y2="221" stroke="#5e1f0a" stroke-width="4.45" stroke-linecap="round"/>
