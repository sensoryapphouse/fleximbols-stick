  <!-- sparkler handle (wooden stick) at bottom -->
  <rect x="125" y="155" width="40" height="75" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- handle wood grain line -->
  <path d="M145 165 L145 220" fill="none" stroke="#5e1f0a" stroke-width="2.96"/>
  <!-- metal wire stem rising from handle -->
  <rect x="140" y="100" width="10" height="60" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- bright burning core at the top of the wire -->
  <circle cx="145" cy="100" r="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- yellow outer flare around core -->
  <circle cx="145" cy="100" r="38" fill="#fff200" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- white hot center over yellow -->
  <circle cx="145" cy="100" r="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- sparks shooting outward as straight rays with little dots at the ends -->
  <path d="M145 100 L145 25" fill="none" stroke="#fff200" stroke-width="5.93" stroke-linecap="round"/>
  <path d="M145 100 L195 40" fill="none" stroke="#ffffff" stroke-width="5.93" stroke-linecap="round"/>
