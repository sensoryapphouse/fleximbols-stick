  <!-- Gelato cup with two rounded scoops and flat spade -->
  <!-- Cup body -->
  <path d="M100 148 L108 210 L182 210 L190 148 Z" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cup stripe decoration -->
  <path d="M103 163 L107 188 L112 188 L108 163 Z" fill="#f4a4b2" stroke="none"/>
  <path d="M115 163 L118 188 L123 188 L120 163 Z" fill="#f4a4b2" stroke="none"/>
  <!-- Cup rim -->
  <rect x="96" y="143" width="98" height="12" rx="5" ry="5" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Back scoop (strawberry pink) -->
  <ellipse cx="158" cy="118" rx="38" ry="34" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Front scoop (pistachio green) -->
  <ellipse cx="128" cy="122" rx="38" ry="34" fill="#529929" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Spade/spatula handle -->
  <rect x="172" y="68" width="11" height="62" rx="5" ry="5" fill="#efefef" stroke="#1a1a1a" stroke-width="3.55" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Spade flat blade -->
  <rect x="161" y="55" width="32" height="18" rx="4" ry="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.55" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Gelato texture dots on front scoop -->
  <circle cx="118" cy="115" r="4" fill="#67832d" stroke="none"/>
  <circle cx="132" cy="108" r="4" fill="#67832d" stroke="none"/>
  <circle cx="125" cy="128" r="4" fill="#67832d" stroke="none"/>
  <!-- Ground line -->
  <line x1="80" y1="210" x2="210" y2="210" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
</g></svg>