  <rect x="138" y="110" width="11" height="9" rx="1" fill="#90a7d6" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="156" y="110" width="11" height="9" rx="1" fill="#90a7d6" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="174" y="110" width="11" height="9" rx="1" fill="#90a7d6" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="192" y="110" width="11" height="9" rx="1" fill="#90a7d6" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="210" y="110" width="11" height="9" rx="1" fill="#90a7d6" stroke="#1a1a1a" stroke-width="4.45"/>
