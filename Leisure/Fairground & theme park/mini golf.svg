  <!-- Putter (angled, striking ball) -->
  <!-- Shaft -->
  <line x1="120" y1="80" x2="172" y2="163" stroke="#7f7f7f" stroke-width="5.55" stroke-linecap="round"/>
  <!-- Putter head -->
  <rect x="163" y="160" width="22" height="10" rx="3" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" transform="rotate(-30,163,160)"/>

