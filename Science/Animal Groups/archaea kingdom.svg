  <!-- extremophile rod-shaped microbes in hot spring/geyser background -->
  <!-- sky -->
  <rect x="0" y="0" width="290" height="120" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- ground/rim around spring -->
  <path d="M 0 120 L 290 120 L 290 240 L 0 240 Z" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- hot spring pool -->
  <ellipse cx="145" cy="170" rx="115" ry="50" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="5.18"/>
  <!-- inner hotter pool -->
  <ellipse cx="145" cy="170" rx="80" ry="32" fill="#ff9900" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="145" cy="170" rx="45" ry="18" fill="#f2e40d" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- steam puffs rising -->
  <circle cx="100" cy="80" r="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.70"/>
  <circle cx="120" cy="60" r="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.70"/>
  <circle cx="155" cy="55" r="15" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.70"/>
  <circle cx="180" cy="75" r="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.70"/>
  <circle cx="200" cy="60" r="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.70"/>

  <!-- rod-shaped microbes (archaea), larger to be visible at thumbnail -->
  <g>
    <rect x="70" y="155" width="42" height="14" rx="7" ry="7" fill="#7c3fac" stroke="#1a1a1a" stroke-width="4.45"/>
    <circle cx="80" cy="162" r="3" fill="#392170"/>
    <circle cx="100" cy="162" r="3" fill="#392170"/>
  </g>
  <g>
    <rect x="170" y="180" width="50" height="14" rx="7" ry="7" fill="#7c3fac" stroke="#1a1a1a" stroke-width="4.45" transform="rotate(20 195 187)"/>
  </g>
  <g>
    <rect x="120" y="190" width="42" height="14" rx="7" ry="7" fill="#7c3fac" stroke="#1a1a1a" stroke-width="4.45" transform="rotate(-12 141 197)"/>
  </g>
  <g>
    <rect x="190" y="150" width="38" height="12" rx="6" ry="6" fill="#7c3fac" stroke="#1a1a1a" stroke-width="4.45"/>
  </g>

  <!-- magnifying glass corner to imply micro-view -->
  <circle cx="248" cy="208" r="18" fill="none" stroke="#1a1a1a" stroke-width="5.18"/>
  <path d="M 261 221 L 275 235" fill="none" stroke="#1a1a1a" stroke-width="7.40" stroke-linecap="round"/>
</g></svg>