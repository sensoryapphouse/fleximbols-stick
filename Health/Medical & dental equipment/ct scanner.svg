<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- CT Scanner: thinner doughnut ring + patient bed, clearly slimmer than MRI bore -->
  <!-- Outer housing ring -->
  <ellipse cx="130" cy="118" rx="88" ry="88" fill="#efefef" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Inner ring cutout (the large open centre of CT ring) -->
  <ellipse cx="130" cy="118" rx="62" ry="62" fill="#dff3fd" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Very thin detector ring wall (the thinner ring vs MRI deep bore) -->
  <ellipse cx="130" cy="118" rx="50" ry="50" fill="none" stroke="#b8b8b8" stroke-width="4.45"/>
  <!-- Housing body (flat disc shape, thin) -->
  <rect x="45" y="70" width="170" height="96" rx="85" fill="none" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Housing top panel highlight -->
  <rect x="58" y="70" width="144" height="14" rx="7" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Housing bottom panel highlight -->
  <rect x="58" y="152" width="144" height="14" rx="7" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Indicator light -->
  <circle cx="62" cy="100" r="6" fill="#529929" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="62" cy="118" r="6" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Control panel on housing -->
  <rect x="50" y="108" width="14" height="20" rx="3" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Patient bed/table extending through ring -->
  <rect x="128" y="108" width="132" height="20" rx="4" fill="#efefef" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Table support column -->
  <rect x="236" y="128" width="16" height="24" rx="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Table base -->
  <rect x="228" y="150" width="32" height="8" rx="3" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- X-ray tube indicator on ring -->
  <rect x="110" y="44" width="40" height="14" rx="5" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45"/>
</g></svg>