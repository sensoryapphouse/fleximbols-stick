<svg xmlns="http://www.w3.org/2000/svg" viewBox="94.80 78.58 368.48 368.48">
<!-- caliper (orthotic leg brace / KAFO): paired metal side bars with leather/padded straps, knee ring joint, into a boot. NO person. -->
<!-- side bars -->
<line x1="214" y1="110" x2="214" y2="360" stroke="#9aa3ab" stroke-width="13" stroke-linecap="round"/>
<line x1="214" y1="110" x2="214" y2="360" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round" opacity="0"/>
<line x1="298" y1="110" x2="298" y2="360" stroke="#9aa3ab" stroke-width="13" stroke-linecap="round"/>
<!-- bar outlines -->
<rect x="207" y="104" width="14" height="262" rx="7" fill="none" stroke="#1a1a1a" stroke-width="6"/>
<rect x="291" y="104" width="14" height="262" rx="7" fill="none" stroke="#1a1a1a" stroke-width="6"/>
<!-- thigh strap -->
<rect x="200" y="150" width="112" height="30" rx="8" fill="#9c6b3f" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- knee joint rings -->
<circle cx="214" cy="240" r="18" fill="#cfd6dc" stroke="#1a1a1a" stroke-width="8"/>
<circle cx="214" cy="240" r="5" fill="#1a1a1a"/>
<circle cx="298" cy="240" r="18" fill="#cfd6dc" stroke="#1a1a1a" stroke-width="8"/>
<circle cx="298" cy="240" r="5" fill="#1a1a1a"/>
<!-- calf strap -->
<rect x="200" y="300" width="112" height="30" rx="8" fill="#9c6b3f" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- boot -->
<path d="M 206 360 L 306 360 L 306 392 L 350 392 Q 362 392 362 404 L 362 414 Q 362 420 354 420 L 206 420 Z" fill="#3f4a55" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
</svg>
