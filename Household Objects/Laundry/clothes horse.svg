<!-- A-frame folding clothes horse / airer seen side-on: two leg panels hinged at the apex -->
<!-- rails span EXACTLY between the two legs at each height so they read as joined -->
<line x1="226" y1="186" x2="286" y2="186" stroke="#c89a5b" stroke-width="9" stroke-linecap="round"/>
<line x1="210" y1="222" x2="302" y2="222" stroke="#c89a5b" stroke-width="9" stroke-linecap="round"/>
<line x1="190" y1="266" x2="322" y2="266" stroke="#c89a5b" stroke-width="9" stroke-linecap="round"/>
<line x1="170" y1="310" x2="342" y2="310" stroke="#c89a5b" stroke-width="9" stroke-linecap="round"/>
<line x1="150" y1="354" x2="362" y2="354" stroke="#c89a5b" stroke-width="9" stroke-linecap="round"/>
<!-- the two leg panels (drawn over the rail ends so the joints read solid) -->
<line x1="256" y1="120" x2="128" y2="404" stroke="#8a5a2b" stroke-width="13" stroke-linecap="round"/>
<line x1="256" y1="120" x2="384" y2="404" stroke="#8a5a2b" stroke-width="13" stroke-linecap="round"/>
<!-- a second (rear) pair of legs for the A-frame depth -->
<line x1="256" y1="120" x2="168" y2="404" stroke="#a06f38" stroke-width="11" stroke-linecap="round"/>
<line x1="256" y1="120" x2="344" y2="404" stroke="#a06f38" stroke-width="11" stroke-linecap="round"/>
<!-- feet -->
<line x1="108" y1="404" x2="148" y2="404" stroke="#1a1a1a" stroke-width="12" stroke-linecap="round"/>
<line x1="364" y1="404" x2="404" y2="404" stroke="#1a1a1a" stroke-width="12" stroke-linecap="round"/>
<line x1="150" y1="404" x2="186" y2="404" stroke="#1a1a1a" stroke-width="10" stroke-linecap="round"/>
<line x1="326" y1="404" x2="362" y2="404" stroke="#1a1a1a" stroke-width="10" stroke-linecap="round"/>
<!-- hinge knob at apex -->
<circle cx="256" cy="120" r="14" fill="#9aa0a6" stroke="#1a1a1a" stroke-width="7"/>
<!-- garments draped over the rails -->
<rect x="196" y="222" width="56" height="80" rx="4" fill="#4a90d9" stroke="#1a1a1a" stroke-width="8"/>
<line x1="210" y1="232" x2="210" y2="294" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
<line x1="238" y1="232" x2="238" y2="294" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
<rect x="276" y="266" width="60" height="82" rx="4" fill="#e23c3c" stroke="#1a1a1a" stroke-width="8"/>
<line x1="292" y1="276" x2="292" y2="340" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
<line x1="320" y1="276" x2="320" y2="340" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
</svg>
