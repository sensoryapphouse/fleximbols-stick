  <!-- VIBRAPHONE: silver metal bars + resonator tubes + spinning discs at tube tops + sustain pedal -->

  <!-- Stand legs -->
  <line x1="52" y1="195" x2="38" y2="228" stroke="#1a1a1a" stroke-width="7.40" stroke-linecap="round"/>
  <line x1="238" y1="195" x2="252" y2="228" stroke="#1a1a1a" stroke-width="7.40" stroke-linecap="round"/>
  <line x1="38" y1="228" x2="85" y2="228" stroke="#1a1a1a" stroke-width="7.40" stroke-linecap="round"/>
  <line x1="205" y1="228" x2="252" y2="228" stroke="#1a1a1a" stroke-width="7.40" stroke-linecap="round"/>

  <!-- Sustain pedal rod and pedal bar (key differentiator) -->
  <line x1="145" y1="195" x2="145" y2="220" stroke="#1a1a1a" stroke-width="5.93" stroke-linecap="round"/>
  <rect x="110" y="218" width="70" height="7" rx="3" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Frame rails and uprights -->
  <rect x="44" y="95" width="202" height="9" rx="3" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <rect x="44" y="190" width="202" height="9" rx="3" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <rect x="44" y="95" width="9" height="104" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <rect x="237" y="95" width="9" height="104" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>

  <!-- Resonator tubes (graduated, silver/grey) with spinning disc at top of each -->
  <!-- 10 tubes. Lengths graduated: bass long (65px), treble short (25px). Bottom all at y=190. -->
  <!-- Tube x positions correspond to bars. Bars span 54..236, width 18, gap 1. -->

  <!-- Tube 1 (bass): top at y=125, height=65 -->
  <rect x="58" y="125" width="12" height="65" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Disc 1 at top of tube: small dark ellipse -->
  <ellipse cx="64" cy="127" rx="7" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.96"/>

  <!-- Tube 2: height=60, top=130 -->
  <rect x="77" y="130" width="12" height="60" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="83" cy="132" rx="7" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.96"/>

  <!-- Tube 3: height=55, top=135 -->
  <rect x="96" y="135" width="12" height="55" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="102" cy="137" rx="7" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.96"/>

  <!-- Tube 4: height=50, top=140 -->
  <rect x="115" y="140" width="12" height="50" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="121" cy="142" rx="7" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.96"/>

  <!-- Tube 5: height=46, top=144 -->
  <rect x="134" y="144" width="12" height="46" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="140" cy="146" rx="7" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.96"/>

  <!-- Tube 6: height=42, top=148 -->
  <rect x="153" y="148" width="12" height="42" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="159" cy="150" rx="7" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.96"/>

  <!-- Tube 7: height=38, top=152 -->
  <rect x="172" y="152" width="12" height="38" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="178" cy="154" rx="7" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.96"/>

  <!-- Tube 8: height=34, top=156 -->
  <rect x="191" y="156" width="12" height="34" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="197" cy="158" rx="7" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.96"/>

  <!-- Tube 9: height=30, top=160 -->
  <rect x="210" y="160" width="12" height="30" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="216" cy="162" rx="7" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.96"/>

  <!-- Tube 10 (treble): height=26, top=164 -->
  <rect x="222" y="164" width="12" height="26" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="228" cy="166" rx="7" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.96"/>

  <!-- 10 silver metal bars (same width as marimba but silver not wood) -->
  <!-- Bar 1 -->
  <rect x="54" y="103" width="18" height="20" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="56" y="105" width="5" height="16" rx="1" fill="#efefef" stroke="none"/>
  <!-- Bar 2 -->
  <rect x="73" y="103" width="18" height="20" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="75" y="105" width="5" height="16" rx="1" fill="#efefef" stroke="none"/>
  <!-- Bar 3 -->
  <rect x="92" y="103" width="18" height="20" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="94" y="105" width="5" height="16" rx="1" fill="#efefef" stroke="none"/>
  <!-- Bar 4 -->
  <rect x="111" y="103" width="18" height="20" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="113" y="105" width="5" height="16" rx="1" fill="#efefef" stroke="none"/>
  <!-- Bar 5 -->
  <rect x="130" y="103" width="18" height="20" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="132" y="105" width="5" height="16" rx="1" fill="#efefef" stroke="none"/>
  <!-- Bar 6 -->
  <rect x="149" y="103" width="18" height="20" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="151" y="105" width="5" height="16" rx="1" fill="#efefef" stroke="none"/>
  <!-- Bar 7 -->
  <rect x="168" y="103" width="18" height="20" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="170" y="105" width="5" height="16" rx="1" fill="#efefef" stroke="none"/>
  <!-- Bar 8 -->
  <rect x="187" y="103" width="18" height="20" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="189" y="105" width="5" height="16" rx="1" fill="#efefef" stroke="none"/>
  <!-- Bar 9 -->
  <rect x="206" y="103" width="15" height="20" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="208" y="105" width="4" height="16" rx="1" fill="#efefef" stroke="none"/>
  <!-- Bar 10 -->
  <rect x="221" y="103" width="15" height="20" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="223" y="105" width="4" height="16" rx="1" fill="#efefef" stroke="none"/>

  <!-- Motor bar (horizontal rod linking discs at top) -->
  <line x1="54" y1="123" x2="236" y2="123" stroke="#4d4d4d" stroke-width="4.45" stroke-linecap="round"/>
</g><g transform="translate(360 8) scale(0.2812)"><defs><radialGradient id="plg2537" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#plg2537)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>