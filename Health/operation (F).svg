<line x1="155" y1="169" x2="217" y2="169" stroke="#9fb4c4" stroke-width="3" stroke-linecap="round"/>
<!-- mask straps to ears -->
<line x1="150" y1="150" x2="142" y2="142" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
<line x1="222" y1="150" x2="230" y2="142" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
