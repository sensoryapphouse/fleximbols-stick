  <!-- camera body behind -->
  <rect x="30" y="75" width="75" height="100" rx="6" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <rect x="55" y="60" width="30" height="18" rx="3" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <circle cx="88" cy="87" r="5" fill="#d01424" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- lens barrel attached to body -->
  <rect x="100" y="100" width="55" height="50" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <line x1="115" y1="100" x2="115" y2="150" stroke="#1a1a1a" stroke-width="2.96"/>
  <line x1="135" y1="100" x2="135" y2="150" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- lens glass face -->
  <ellipse cx="155" cy="125" rx="8" ry="25" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- petal-shaped lens hood (4 petals visible from side - tulip shape) -->
  <!-- top petal -->
  <path d="M155 100 Q170 92 220 70 Q235 80 230 105 Z" fill="#000000" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- bottom petal -->
  <path d="M155 150 Q170 158 220 180 Q235 170 230 145 Z" fill="#000000" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- middle (recessed) section between petals -->
  <path d="M155 105 Q175 115 200 125 Q175 135 155 145 Z" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- petal highlight -->
  <path d="M165 95 Q190 85 215 78" fill="none" stroke="#7f7f7f" stroke-width="2.96" stroke-linecap="round"/>
  <path d="M165 155 Q190 165 215 172" fill="none" stroke="#7f7f7f" stroke-width="2.96" stroke-linecap="round"/>
  <!-- attachment ring at lens -->
  <rect x="152" y="98" width="8" height="54" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="2.96" stroke-linejoin="round"/>
</g></svg>