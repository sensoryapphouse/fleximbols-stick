  <!-- Car body lower -->
  <rect x="28" y="130" width="224" height="68" rx="14" ry="14" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Car body upper (cabin) -->
  <path d="M 72,130 Q 80,80 118,70 L 186,70 Q 218,78 226,130 Z" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Windshield -->
  <path d="M 90,128 Q 96,90 120,82 L 170,82 Q 192,88 198,128 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Windshield divider -->
  <line x1="145" y1="82" x2="145" y2="128" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Side windows merged into windshield illusion — side glass -->
  <!-- Left window -->
  <path d="M 72,130 Q 74,104 84,90 L 92,128 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Right window -->
  <path d="M 218,130 Q 216,104 206,90 L 198,128 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- Wheels -->
  <circle cx="82" cy="198" r="30" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.55"/>
  <circle cx="82" cy="198" r="17" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="82" cy="198" r="6" fill="#000000"/>

  <circle cx="204" cy="198" r="30" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.55"/>
  <circle cx="204" cy="198" r="17" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="204" cy="198" r="6" fill="#000000"/>

  <!-- Headlight -->
  <ellipse cx="44" cy="152" rx="10" ry="8" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Tail light -->
  <ellipse cx="246" cy="152" rx="10" ry="8" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45"/>

