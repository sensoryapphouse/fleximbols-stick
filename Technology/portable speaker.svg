  <line x1="80" y1="188" x2="210" y2="188" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Main woofer grille circle -->
  <circle cx="145" cy="150" r="44" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.55"/>
  <circle cx="145" cy="150" r="30" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="145" cy="150" r="14" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="145" cy="150" r="5" fill="#000000" stroke="none"/>
