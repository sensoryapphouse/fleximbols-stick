<line x1="335" y1="155" x2="309" y2="170" stroke="#f37121" stroke-width="10" stroke-linecap="round"/>
<line x1="326" y1="120" x2="296" y2="120" stroke="#f37121" stroke-width="10" stroke-linecap="round"/>
