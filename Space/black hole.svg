  <!-- black-hole: black disc with bright accretion ring + bending light arcs -->
  <!-- Space panel -->
  <rect x="26" y="26" width="238" height="188" rx="6" fill="#000000" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Stars -->
  <circle cx="45" cy="45" r="2" fill="#ffffff" stroke="none"/>
  <circle cx="85" cy="38" r="2" fill="#ffffff" stroke="none"/>
  <circle cx="245" cy="50" r="3" fill="#ffffff" stroke="none"/>
  <circle cx="260" cy="90" r="2" fill="#ffffff" stroke="none"/>
  <circle cx="255" cy="175" r="2" fill="#ffffff" stroke="none"/>
  <circle cx="40" cy="180" r="2" fill="#ffffff" stroke="none"/>
  <circle cx="52" cy="130" r="2" fill="#ffffff" stroke="none"/>
  <circle cx="250" cy="140" r="2" fill="#ffffff" stroke="none"/>
  <!-- Accretion disk - outer orange/yellow ring (ellipse) -->
  <ellipse cx="145" cy="120" rx="100" ry="30" fill="#ff9900" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Accretion disk inner bright yellow -->
  <ellipse cx="145" cy="120" rx="80" ry="22" fill="#f2e40d" stroke="none"/>
  <!-- Accretion disk hot inner -->
  <ellipse cx="145" cy="120" rx="62" ry="15" fill="#f7de58" stroke="none"/>
  <!-- Gravitational lensing arcs - bending light above -->
  <path d="M60,95 Q95,55 145,52 Q195,55 230,95" fill="none" stroke="#ff9900" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M72,88 Q105,58 145,56 Q185,58 218,88" fill="none" stroke="#f2e40d" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Lensing arcs below -->
  <path d="M62,145 Q100,185 145,188 Q190,185 228,145" fill="none" stroke="#ff9900" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M74,150 Q108,182 145,184 Q182,182 216,150" fill="none" stroke="#f2e40d" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Black hole disc - centre, solid black -->
  <circle cx="145" cy="120" r="55" fill="#000000" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Bright ring edge highlight around event horizon -->
  <circle cx="145" cy="120" r="55" fill="none" stroke="#f8130d" stroke-width="4.45"/>
  <!-- Photon ring shimmer -->
  <circle cx="145" cy="120" r="60" fill="none" stroke="#ff9900" stroke-width="2.22"/>
</g></svg>