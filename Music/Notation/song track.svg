  <rect x="172" y="104" width="6" height="32" rx="2" fill="#b8b8b8" stroke="none"/>
  <rect x="182" y="109" width="6" height="22" rx="2" fill="#b8b8b8" stroke="none"/>
  <rect x="192" y="113" width="6" height="14" rx="2" fill="#b8b8b8" stroke="none"/>
  <rect x="202" y="107" width="6" height="26" rx="2" fill="#b8b8b8" stroke="none"/>
  <rect x="212" y="110" width="6" height="20" rx="2" fill="#b8b8b8" stroke="none"/>
  <rect x="222" y="105" width="6" height="30" rx="2" fill="#b8b8b8" stroke="none"/>
  <rect x="232" y="112" width="6" height="16" rx="2" fill="#b8b8b8" stroke="none"/>
  <!-- Playhead line -->
  <line x1="135" y1="88" x2="135" y2="152" stroke="#f8130d" stroke-width="5.93" stroke-linecap="round"/>
  <!-- Playhead diamond handle -->
  <polygon points="135,82 143,92 135,102 127,92" fill="#f8130d" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
