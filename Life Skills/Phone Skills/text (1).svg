<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Phone handset body — classic candybar shape to signal SMS context -->
  <rect x="86" y="12" width="118" height="216" rx="20" ry="20" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="11.11" stroke-linejoin="round"/>
  <!-- Screen area -->
  <rect x="97" y="36" width="96" height="150" rx="8" ry="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- Home button circle -->
  <circle cx="145" cy="210" r="9" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="6.67"/>
  <!-- SMS bubble 1 — incoming (left) -->
  <path d="M104 52 Q104 44 112 44 L168 44 Q176 44 176 52 L176 74 Q176 82 168 82 L132 82 L125 92 L122 82 L112 82 Q104 82 104 74 Z" fill="#efefef" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Lines representing text inside bubble 1 -->
  <rect x="112" y="54" width="42" height="6" rx="3" ry="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="112" y="66" width="30" height="6" rx="3" ry="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- SMS bubble 2 — outgoing (right, green tint) -->
  <path d="M186 100 Q186 92 178 92 L122 92 Q114 92 114 100 L114 130 Q114 138 122 138 L158 138 L165 148 L168 138 L178 138 Q186 138 186 130 Z" fill="#529929" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Lines representing text inside bubble 2 -->
  <rect x="122" y="104" width="46" height="6" rx="3" ry="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="122" y="116" width="34" height="6" rx="3" ry="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- SMS indicator label area (simple dots to imply typing / next msg) -->
  <circle cx="115" cy="160" r="5" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="130" cy="160" r="5" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="145" cy="160" r="5" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
</g></svg>