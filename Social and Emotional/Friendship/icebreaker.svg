  <rect x="68" y="132" width="28" height="12" rx="2" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="6.67"/>
  <circle cx="82" cy="138" r="5" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
