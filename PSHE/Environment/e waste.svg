  <line x1="46" y1="114" x2="54" y2="122" stroke="#90a7d6" stroke-width="3.33" stroke-linecap="round"/>
  <!-- CRT base neck -->
  <rect x="62" y="170" width="26" height="12" rx="3" ry="3" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="50" y="182" width="50" height="8" rx="4" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
