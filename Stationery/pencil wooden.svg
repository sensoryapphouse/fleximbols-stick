  <!-- classic yellow wooden pencil, sharpened tip left, eraser end right -->
  <!-- pencil body, diagonal orientation -->
  <g transform="rotate(-15 145 120)">
    <!-- sharpened wood cone -->
    <polygon points="40,120 80,100 80,140" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
    <!-- graphite tip -->
    <polygon points="40,120 55,113 55,127" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
    <!-- wood-paint boundary -->
    <line x1="80" y1="100" x2="80" y2="140" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
    <!-- yellow shaft -->
    <rect x="80" y="100" width="140" height="40" fill="#f2e40d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
    <!-- metal ferrule -->
    <rect x="220" y="98" width="22" height="44" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
    <line x1="226" y1="100" x2="226" y2="140" stroke="#1a1a1a" stroke-width="2.96"/>
    <line x1="232" y1="100" x2="232" y2="140" stroke="#1a1a1a" stroke-width="2.96"/>
    <line x1="238" y1="100" x2="238" y2="140" stroke="#1a1a1a" stroke-width="2.96"/>
    <!-- pink eraser end -->
    <rect x="242" y="100" width="20" height="40" rx="3" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  </g>
</g></svg>