  <rect x="62" y="100" width="56" height="50" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- WATERPROOF text implied as a path/line group on label -->
  <line x1="68" y1="116" x2="112" y2="116" stroke="#dff3fd" stroke-width="2.22" stroke-linecap="round"/>
  <line x1="68" y1="124" x2="112" y2="124" stroke="#dff3fd" stroke-width="2.22" stroke-linecap="round"/>
  <line x1="68" y1="132" x2="112" y2="132" stroke="#dff3fd" stroke-width="2.22" stroke-linecap="round"/>
  <line x1="78" y1="140" x2="102" y2="140" stroke="#dff3fd" stroke-width="2.22" stroke-linecap="round"/>
  <!-- Cap -->
  <rect x="68" y="22" width="44" height="30" rx="6" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
