  <path d="M 205 48 L 225 45 L 232 62 L 213 65 Z" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Bottom end: flat curved heel with slight curve -->
