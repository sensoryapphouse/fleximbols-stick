<path d="M 180 196 q -22 -24 0 -48 q 22 -24 0 -48"/>
<path d="M 244 178 q -22 -24 0 -48 q 22 -24 0 -48"/>
</g>
<!-- fly -->
<g>
<ellipse cx="316" cy="150" rx="13" ry="8" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="6"/>
<path d="M 316 143 q -24 -20 -40 -7" fill="none" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
<path d="M 316 143 q 24 -20 40 -7" fill="none" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
</g>
