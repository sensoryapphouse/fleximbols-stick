  <path d="M165 165 Q190 155 215 165 Q240 155 265 165 Q260 185 215 188 Q175 185 165 165 Z" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Mask coating on lips (overnight treatment glaze) -->
  <path d="M170 170 Q200 160 230 165 Q255 160 263 170" fill="none" stroke="#dff3fd" stroke-width="7.40" stroke-linecap="round"/>
  <!-- Shine on coating -->
  <ellipse cx="200" cy="172" rx="10" ry="3" fill="#ffffff"/>
  <ellipse cx="245" cy="172" rx="6" ry="2" fill="#ffffff"/>
  <!-- Closed-eye style line above lips (sleeping/resting) -->
  <path d="M195 145 Q215 142 235 145" fill="none" stroke="#4d4d4d" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Sleeping Z near lips -->
  <path d="M250 195 L260 195 L250 205 L260 205" fill="none" stroke="#1a1a1a" stroke-width="3.70" stroke-linecap="round" stroke-linejoin="round"/>
