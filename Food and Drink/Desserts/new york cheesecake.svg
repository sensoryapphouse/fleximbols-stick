<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- New York cheesecake: TALLER denser slice, thick yellow filling, thick graham crust, single strawberry -->
  <!-- Plate -->
  <ellipse cx="145" cy="220" rx="108" ry="13" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- THICK graham cracker crust - tall band, warm brown -->
  <path d="M 50,210 L 240,210 L 230,185 L 60,185 Z" fill="#7d5e23" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Crust texture -->
  <line x1="80" y1="186" x2="78" y2="209" stroke="#5e1f0a" stroke-width="3.70" stroke-linecap="round"/>
  <line x1="112" y1="186" x2="110" y2="209" stroke="#5e1f0a" stroke-width="3.70" stroke-linecap="round"/>
  <line x1="145" y1="186" x2="143" y2="209" stroke="#5e1f0a" stroke-width="3.70" stroke-linecap="round"/>
  <line x1="178" y1="186" x2="176" y2="209" stroke="#5e1f0a" stroke-width="3.70" stroke-linecap="round"/>
  <line x1="210" y1="186" x2="208" y2="209" stroke="#5e1f0a" stroke-width="3.70" stroke-linecap="round"/>
  <!-- TALL DENSE filling body - rich yellow, taller than cheesecake-modern -->
  <path d="M 60,185 L 230,185 L 180,68 L 110,68 Z" fill="#f7de58" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Top surface flat - NY style has flat even top -->
  <path d="M 110,68 Q 145,62 180,68" fill="#f7de58" stroke="#1a1a1a" stroke-width="7.40" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dense texture - slight lines to show firm filling -->
  <path d="M 115,120 Q 145,116 175,120" fill="none" stroke="#ff9900" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M 105,148 Q 145,144 185,148" fill="none" stroke="#ff9900" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M 88,168 Q 145,164 202,168" fill="none" stroke="#ff9900" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Single strawberry slice on top -->
  <path d="M 133,58 Q 145,42 157,58 Q 155,72 145,74 Q 135,72 133,58 Z" fill="#d01424" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 140,46 Q 145,40 150,46" fill="none" stroke="#137827" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Seed dots on strawberry -->
  <ellipse cx="140" cy="56" rx="2" ry="3" fill="#eed5b6" stroke="none" transform="rotate(-10 140 56)"/>
  <ellipse cx="150" cy="56" rx="2" ry="3" fill="#eed5b6" stroke="none" transform="rotate(10 150 56)"/>
  <ellipse cx="145" cy="64" rx="2" ry="3" fill="#eed5b6" stroke="none"/>
</g></svg>