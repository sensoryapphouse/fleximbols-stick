<!-- pretty flower (faded) vs wilted/ugly flower (full); arrow at wilted -->
<g opacity="0.34" transform="translate(150 300) scale(0.62)">
<line x1="0" y1="150" x2="0" y2="-6" stroke="#5fae6a" stroke-width="12" stroke-linecap="round"/>
<g stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round">
<ellipse cx="0" cy="-78" rx="30" ry="44" fill="#ff7eb0"/>
<ellipse cx="74" cy="-24" rx="44" ry="30" fill="#ff7eb0"/>
<ellipse cx="-74" cy="-24" rx="44" ry="30" fill="#ff7eb0"/>
<ellipse cx="46" cy="62" rx="30" ry="44" fill="#ff7eb0" transform="rotate(35 46 62)"/>
<ellipse cx="-46" cy="62" rx="30" ry="44" fill="#ff7eb0" transform="rotate(-35 -46 62)"/>
</g>
<circle cx="0" cy="-6" r="36" fill="#ffd23f" stroke="#1a1a1a" stroke-width="9"/>
</g>
<!-- wilted ugly flower full opacity -->
<g transform="translate(330 300) scale(0.62)">
<!-- droopy bent stem -->
<path d="M 0 150 Q 6 70 -34 18 Q -54 -8 -34 -34" fill="none" stroke="#8a9a4a" stroke-width="12" stroke-linecap="round"/>
<!-- droopy wilted petals (brownish, sagging) -->
<g stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round">
<path d="M -34 -34 Q -86 -42 -96 4 Q -60 16 -34 -10 Z" fill="#b08a6a"/>
<path d="M -34 -34 Q -4 -78 22 -54 Q 6 -22 -28 -22 Z" fill="#b08a6a"/>
<path d="M -34 -34 Q -70 4 -50 44 Q -22 22 -22 -16 Z" fill="#9c7a58"/>
<path d="M -34 -34 Q 18 -28 26 18 Q -6 26 -32 -6 Z" fill="#9c7a58"/>
</g>
<circle cx="-34" cy="-30" r="26" fill="#7a5c3c" stroke="#1a1a1a" stroke-width="9"/>
<!-- falling petal -->
<path d="M 30 70 q 22 6 18 30 q -22 0 -26 -22 Z" fill="#9c7a58" stroke="#1a1a1a" stroke-width="7" stroke-linejoin="round"/>
</g>
<!-- green arrow at the ugly (right) one -->
<line x1="334" y1="120" x2="334" y2="170" stroke="#1a1a1a" stroke-width="23.0" stroke-linecap="round"/><line x1="334" y1="170" x2="310" y2="144" stroke="#1a1a1a" stroke-width="23.0" stroke-linecap="round"/><line x1="334" y1="170" x2="358" y2="144" stroke="#1a1a1a" stroke-width="23.0" stroke-linecap="round"/><line x1="334" y1="120" x2="334" y2="170" stroke="#2f9e4a" stroke-width="17.5" stroke-linecap="round"/>
<line x1="334" y1="170" x2="310" y2="144" stroke="#2f9e4a" stroke-width="17.5" stroke-linecap="round"/>
<line x1="334" y1="170" x2="358" y2="144" stroke="#2f9e4a" stroke-width="17.5" stroke-linecap="round"/>
