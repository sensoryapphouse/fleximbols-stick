<line x1="160" y1="276" x2="160" y2="298"/>
<line x1="142" y1="275" x2="160" y2="275"/>
</g>
<circle cx="178" cy="262" r="5" fill="#e23c3c"/>
<circle cx="178" cy="288" r="5" fill="#e23c3c"/>
<g stroke="#e23c3c" stroke-width="9" stroke-linecap="round">
<line x1="196" y1="252" x2="196" y2="276"/>
<line x1="196" y1="276" x2="196" y2="298"/>
