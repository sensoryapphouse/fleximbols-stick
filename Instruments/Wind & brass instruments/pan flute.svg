  <!-- Pan flute: row of 8 graduated pipes bound together, descending left-to-right -->
  <!-- Pipes from tallest (left) to shortest (right), bound with two cord bands -->
  <!-- Pipe 1 (tallest) -->
  <rect x="38" y="45" width="22" height="162" rx="5" ry="5" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Pipe 2 -->
  <rect x="65" y="60" width="22" height="147" rx="5" ry="5" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Pipe 3 -->
  <rect x="92" y="74" width="22" height="133" rx="5" ry="5" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Pipe 4 -->
  <rect x="119" y="88" width="22" height="119" rx="5" ry="5" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Pipe 5 -->
  <rect x="146" y="100" width="22" height="107" rx="5" ry="5" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Pipe 6 -->
  <rect x="173" y="112" width="22" height="95" rx="5" ry="5" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Pipe 7 -->
  <rect x="200" y="123" width="22" height="84" rx="5" ry="5" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Pipe 8 (shortest) -->
  <rect x="227" y="133" width="22" height="74" rx="5" ry="5" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Binding cord band 1 (upper) -->
  <rect x="35" y="105" width="217" height="12" rx="4" ry="4" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Binding cord band 2 (lower) -->
  <rect x="35" y="155" width="217" height="12" rx="4" ry="4" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Open tops of pipes (dark holes) -->
  <ellipse cx="49" cy="46" rx="8" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.22"/>
  <ellipse cx="76" cy="61" rx="8" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.22"/>
  <ellipse cx="103" cy="75" rx="8" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.22"/>
  <ellipse cx="130" cy="89" rx="8" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.22"/>
  <ellipse cx="157" cy="101" rx="8" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.22"/>
  <ellipse cx="184" cy="113" rx="8" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.22"/>
  <ellipse cx="211" cy="124" rx="8" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.22"/>
  <ellipse cx="238" cy="134" rx="8" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.22"/>
