  <!-- Blanket being folded — neat square result on table surface -->
  <!-- Table surface -->
  <rect x="25" y="170" width="240" height="14" rx="4" fill="#9d7246" stroke="#1a1a1a" stroke-width="3.55" stroke-linejoin="round"/>
  <!-- Bottom folded layer (neat square) -->
  <rect x="60" y="110" width="170" height="62" rx="6" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Fold crease lines on bottom layer -->
  <line x1="60" y1="141" x2="230" y2="141" stroke="#f2e40d" stroke-width="2.66" stroke-linecap="round"/>
  <!-- Top flap being folded down (slightly lifted at top edge) -->
  <path d="M60,62 Q145,50 230,62 L230,112 L60,112 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Fold line on top flap -->
  <line x1="65" y1="87" x2="225" y2="87" stroke="#90a7d6" stroke-width="2.66" stroke-linecap="round" stroke-dasharray="12,7"/>
  <!-- Left hand gripping left edge of top flap -->
  <ellipse cx="72" cy="66" rx="14" ry="10" fill="#eed5b6" stroke="#1a1a1a" stroke-width="3.55"/>
  <!-- Left fingers -->
  <line x1="62" y1="60" x2="58" y2="52" stroke="#eed5b6" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="68" y1="57" x2="65" y2="49" stroke="#eed5b6" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="75" y1="56" x2="73" y2="48" stroke="#eed5b6" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="82" y1="58" x2="81" y2="50" stroke="#eed5b6" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Right hand gripping right edge of top flap -->
  <ellipse cx="218" cy="66" rx="14" ry="10" fill="#eed5b6" stroke="#1a1a1a" stroke-width="3.55"/>
  <!-- Right fingers -->
  <line x1="208" y1="58" x2="205" y2="50" stroke="#eed5b6" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="215" y1="57" x2="212" y2="49" stroke="#eed5b6" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="222" y1="57" x2="220" y2="49" stroke="#eed5b6" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="228" y1="60" x2="228" y2="52" stroke="#eed5b6" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Fold arrows pointing downward -->
  <path d="M110 78 Q110 100 110 110" fill="none" stroke="#1a1a1a" stroke-width="3.11" stroke-linecap="round"/>
  <polygon points="110,110 104,100 116,100" fill="#000000"/>
  <path d="M180 78 Q180 100 180 110" fill="none" stroke="#1a1a1a" stroke-width="3.11" stroke-linecap="round"/>
  <polygon points="180,110 174,100 186,100" fill="#000000"/>
</g></svg>