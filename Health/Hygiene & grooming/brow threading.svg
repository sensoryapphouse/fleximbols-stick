  <!-- Twist node where threads cross (the trap point that pulls hair) -->
  <circle cx="145" cy="118" r="5" fill="#f8130d" stroke="#1a1a1a" stroke-width="3.56"/>
  <!-- LEFT HAND (technician's hand holding the thread loop, fingers visible) -->
  <path d="M8 70 Q4 88 8 108 Q12 122 22 124 L34 122 Q42 118 40 108 L36 96 Q40 86 36 80 L32 78 Q28 86 26 90 L24 76 Q20 70 16 72 L14 88 L10 78 Q6 70 8 70 Z" fill="#e6b98a" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
