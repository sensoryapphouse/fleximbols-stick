  <path d="M80 68 Q100 56 108 38 L108 68 Z" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <path d="M108 68 Q128 58 136 38 L136 68 Z" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
