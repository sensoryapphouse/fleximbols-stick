<path d="M 96 110 Q 230 30 360 92" fill="none" stroke="#e08a00" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 18"/>
<!-- sun, lower on the right -->
<circle cx="384" cy="92" r="30" fill="#f5b800" stroke="#e08a00" stroke-width="6"/>
<g stroke="#f5b800" stroke-width="7" stroke-linecap="round">
<line x1="384" y1="44" x2="384" y2="56"/><line x1="384" y1="128" x2="384" y2="140"/>
<line x1="336" y1="92" x2="348" y2="92"/><line x1="420" y1="92" x2="432" y2="92"/>
<line x1="350" y1="58" x2="358" y2="66"/><line x1="410" y1="118" x2="418" y2="126"/>
<line x1="418" y1="58" x2="410" y2="66"/><line x1="358" y1="118" x2="350" y2="126"/>
</g>
<!-- THREE LARGE afternoon-routine activity tiles in a row, chevrons between -->
