  <circle cx="208" cy="136" r="9" fill="#eed5b6" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Legs wrapped in silk going up (inverted - legs up toward anchor) -->
  <path d="M 135,143 L 128,98" stroke="#1a1a1a" stroke-width="7.77" stroke-linecap="round" fill="none"/>
