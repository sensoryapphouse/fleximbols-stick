<!-- caulk gun frame (open skeleton) -->
<path d="M 140 250 L 356 250 L 356 296 L 140 296 Z" fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- cartridge inside frame -->
<rect x="150" y="256" width="196" height="34" rx="6" fill="#3d7fb5" stroke="#1a1a1a" stroke-width="8"/>

<!-- RIGHT-HAND END: cartridge front cap + tapered nozzle cone + bead -->
<!-- front cap of the cartridge -->
<rect x="346" y="252" width="18" height="42" rx="4" fill="#9aa0a6" stroke="#1a1a1a" stroke-width="8"/>
<!-- tapered nozzle cone -->
<path d="M 364 258 L 420 268 L 420 278 L 364 288 Z"
      fill="#f4c430" stroke="#1a1a1a" stroke-width="8" stroke-linejoin="round"/>
<!-- nozzle tip opening -->
<line x1="420" y1="268" x2="420" y2="278" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
<!-- bead of sealant squeezing out and laying down a line -->
<path d="M 422 273 Q 452 268 476 278" fill="none" stroke="#eef1f4" stroke-width="12" stroke-linecap="round"/>
<path d="M 422 273 Q 452 268 476 278" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" opacity="0.35"/>

<!-- push rod at back -->
<line x1="140" y1="273" x2="96" y2="273" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
<circle cx="92" cy="273" r="12" fill="#9aa0a6" stroke="#1a1a1a" stroke-width="8"/>
<!-- trigger + handle -->
<path d="M 200 296 L 196 360 L 240 372" fill="none" stroke="#1a1a1a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="186" y1="298" x2="178" y2="340" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
</svg>
