  <!-- Phone body (back view, portrait) -->
  <rect x="85" y="25" width="120" height="190" rx="18" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Phone camera module top-left of back -->
  <rect x="100" y="40" width="36" height="36" rx="7" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="2.66" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="118" cy="58" r="9" fill="#000000" stroke="#b8b8b8" stroke-width="1.78"/>
  <!-- Finger-loop strap band: wide band across centre of back -->
  <rect x="85" y="108" width="120" height="28" rx="5" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
