  <!-- yukon gold: round-oval potato with SMOOTH pale yellow skin + light eye-spots -->
  <ellipse cx="145" cy="130" rx="92" ry="74" fill="#f7de58" stroke="#1a1a1a" stroke-width="11.86"/>
  <!-- soft highlight to read as smooth -->
  <path d="M86 96 C108 80 134 78 156 84 C140 96 116 102 92 110 Z" fill="#fff200" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- light eye-spots (small, pale, sparse) -->
  <circle cx="100" cy="130" r="3" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="140" cy="115" r="3" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="180" cy="135" r="3" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="120" cy="160" r="3" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="170" cy="170" r="3" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="200" cy="155" r="3" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- tiny crease lines around each eye to read as a 'spot' not a freckle -->
  <path d="M94 130 q6 -3 12 0" fill="none" stroke="#9d7246" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M134 115 q6 -3 12 0" fill="none" stroke="#9d7246" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M174 135 q6 -3 12 0" fill="none" stroke="#9d7246" stroke-width="4.45" stroke-linecap="round"/>
