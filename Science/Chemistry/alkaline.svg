<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Test tube with blue liquid + pH strip dark blue + '>7' indicator drawn as shapes -->
  <!-- Test tube body -->
  <path d="M86 30 L86 200 Q86 222 110 222 Q134 222 134 200 L134 30 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="8.89" stroke-linejoin="round"/>
  <!-- Test tube rim -->
  <rect x="80" y="26" width="60" height="10" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- Blue alkaline liquid -->
  <path d="M88 110 L132 110 L132 200 Q132 220 110 220 Q88 220 88 200 Z" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- Liquid meniscus highlight -->
  <path d="M88 110 Q110 102 132 110" fill="none" stroke="#1a1a1a" stroke-width="5.56" stroke-linecap="round"/>
  <!-- Tick marks on tube -->
  <line x1="86" y1="140" x2="94" y2="140" stroke="#ffffff" stroke-width="4.45"/>
  <line x1="86" y1="170" x2="94" y2="170" stroke="#ffffff" stroke-width="4.45"/>
  <line x1="86" y1="200" x2="94" y2="200" stroke="#ffffff" stroke-width="4.45"/>
  <!-- pH paper strip (dark blue, dipped into liquid) -->
  <rect x="160" y="40" width="30" height="170" fill="#1d0e82" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- Top portion lighter (un-dipped end) -->
  <rect x="160" y="40" width="30" height="60" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- Stripe markings -->
  <line x1="160" y1="110" x2="190" y2="110" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="160" y1="140" x2="190" y2="140" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="160" y1="170" x2="190" y2="170" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- '>7' indicator drawn as shapes -->
  <!-- Greater-than arrow (triangle) -->
  <polygon points="210,70 240,90 210,110 218,90" fill="#137827" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- '7' shape using paths -->
  <!-- 7 horizontal bar -->
  <rect x="222" y="130" width="44" height="10" fill="#000000" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- 7 diagonal stroke -->
  <polygon points="266,130 256,130 232,200 244,200" fill="#000000" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
</g></svg>