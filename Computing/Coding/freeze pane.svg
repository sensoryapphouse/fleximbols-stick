<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- spreadsheet frame -->
  <rect x="26" y="32" width="238" height="176" fill="#ffffff" stroke="#1a1a1a" stroke-width="8.89" stroke-linejoin="round"/>
  <!-- frozen top row (highlighted, with icy blue) -->
  <rect x="20" y="20" width="250" height="42" fill="#dff3fd" stroke="#1a1a1a" stroke-width="6.67"/>
  <!-- frozen row content cells -->
  <line x1="100" y1="20" x2="100" y2="62" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="180" y1="20" x2="180" y2="62" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- freeze divider line (thick, distinctive) -->
  <line x1="20" y1="62" x2="270" y2="62" stroke="#2a4ec0" stroke-width="11.11" stroke-linecap="round"/>
  <!-- scrollable area below (rows hinting motion) -->
  <line x1="20" y1="90" x2="270" y2="90" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="20" y1="120" x2="270" y2="120" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="20" y1="150" x2="270" y2="150" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="20" y1="180" x2="270" y2="180" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="100" y1="62" x2="100" y2="220" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="180" y1="62" x2="180" y2="220" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- scroll arrows on right showing scroll happens below freeze line -->
  <path d="M 245 100 L 252 90 L 259 100" fill="none" stroke="#7f7f7f" stroke-width="6.67" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 245 200 L 252 210 L 259 200" fill="none" stroke="#7f7f7f" stroke-width="6.67" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- snowflake freeze indicator (top right, padlock-ish but icy) -->
  <g>
    <circle cx="240" cy="41" r="14" fill="#90a7d6" stroke="#1a1a1a" stroke-width="6.67"/>
    <!-- snowflake -->
    <path d="M 240 30 L 240 52 M 230 41 L 250 41 M 232 33 L 248 49 M 248 33 L 232 49" stroke="#ffffff" stroke-width="5.56" stroke-linecap="round"/>
  </g>
  <!-- icicle drips along freeze line -->
  <path d="M 50 62 L 50 72 L 53 67 Z" fill="#90a7d6" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <path d="M 140 62 L 140 76 L 144 70 Z" fill="#90a7d6" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <path d="M 215 62 L 215 72 L 219 67 Z" fill="#90a7d6" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
</g></svg>