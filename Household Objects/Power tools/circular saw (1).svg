  <path d="M75,168 Q78,205 145,210 Q170,208 185,185 L165,170 Q155,192 130,195 Q98,193 92,170Z" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="10.00" stroke-linejoin="round"/>
  <!-- Circular blade -->
  <circle cx="135" cy="150" r="55" fill="#efefef" stroke="#1a1a1a" stroke-width="10.00"/>
  <!-- Blade center arbor -->
  <circle cx="135" cy="150" r="10" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="8.89"/>
  <circle cx="135" cy="150" r="4" fill="#000000"/>
  <!-- Blade teeth (triangular around circumference) -->
  <polyline points="135,95 139,85 143,95" fill="#000000" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polyline points="155,98 162,90 165,101" fill="#000000" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polyline points="174,108 184,104 183,116" fill="#000000" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polyline points="186,130 197,130 192,141" fill="#000000" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polyline points="188,155 199,158 190,167" fill="#000000" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polyline points="130,204 134,215 126,214" fill="#000000" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polyline points="108,200 107,211 100,205" fill="#000000" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polyline points="90,187 86,197 80,188" fill="#000000" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polyline points="82,163 74,168 74,158" fill="#000000" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polyline points="83,138 73,136 76,126" fill="#000000" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polyline points="94,115 88,107 98,104" fill="#000000" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polyline points="114,98 113,88 121,93" fill="#000000" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Top D-handle -->
  <path d="M140,60 Q172,50 188,65 Q200,78 196,92 L180,95 Q178,82 170,76 Q158,70 145,75 L140,60Z" fill="#ff9900" stroke="#1a1a1a" stroke-width="11.11" stroke-linejoin="round"/>
  <!-- Handle inner opening -->
  <path d="M150,68 Q166,62 176,72 Q184,82 180,90 L168,88 Q170,80 164,76 Q155,72 148,76Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="6.67"/>
  <!-- Front knob handle -->
  <rect x="88" y="90" width="22" height="30" rx="8" fill="#ff9900" stroke="#1a1a1a" stroke-width="10.00"/>
  <!-- Depth adjustment -->
  <line x1="42" y1="170" x2="42" y2="190" stroke="#1a1a1a" stroke-width="6.67" stroke-linecap="round"/>
  <circle cx="42" cy="180" r="5" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.56"/>
</g></svg>