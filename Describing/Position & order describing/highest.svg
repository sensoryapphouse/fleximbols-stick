<svg xmlns="http://www.w3.org/2000/svg" viewBox="8.73 9.58 494.55 494.55">
<!-- HIGHEST: three balloons held at different heights. The TOP balloon is highlighted; the others faded. Green arrow points up at the highest one. -->
<!-- ground / hand line -->
<line x1="120" y1="470" x2="392" y2="470" stroke="#9aa7b5" stroke-width="6" stroke-linecap="round"/>

<!-- LEFT balloon (mid height, faded) -->
<g opacity="0.34">
  <line x1="176" y1="300" x2="200" y2="470" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="176" cy="262" rx="42" ry="50" fill="#4a90d9" stroke="#1a1a1a" stroke-width="9"/>
  <polygon points="176,310 166,300 186,300" fill="#4a90d9" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
</g>

<!-- RIGHT balloon (low, faded) -->
<g opacity="0.34">
  <line x1="336" y1="360" x2="312" y2="470" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="336" cy="322" rx="42" ry="50" fill="#3fb24a" stroke="#1a1a1a" stroke-width="9"/>
  <polygon points="336,370 326,360 346,360" fill="#3fb24a" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
</g>

<!-- CENTRE balloon = HIGHEST (highlighted, red, riding tallest) -->
<line x1="256" y1="208" x2="256" y2="470" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
<ellipse cx="256" cy="166" rx="48" ry="56" fill="#e0473c" stroke="#1a1a1a" stroke-width="9"/>
<polygon points="256,220 244,208 268,208" fill="#e0473c" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>

<!-- bold green arrow pointing UP at the highest balloon -->
<line x1="256" y1="100" x2="256" y2="48" stroke="#1a1a1a" stroke-width="22.0" stroke-linecap="round"/><line x1="256" y1="48" x2="230" y2="76" stroke="#1a1a1a" stroke-width="22.0" stroke-linecap="round"/><line x1="256" y1="48" x2="282" y2="76" stroke="#1a1a1a" stroke-width="22.0" stroke-linecap="round"/><line x1="256" y1="100" x2="256" y2="48" stroke="#2f9e4a" stroke-width="16.5" stroke-linecap="round"/>
<line x1="256" y1="48" x2="230" y2="76" stroke="#2f9e4a" stroke-width="16.5" stroke-linecap="round"/>
<line x1="256" y1="48" x2="282" y2="76" stroke="#2f9e4a" stroke-width="16.5" stroke-linecap="round"/>
</svg>
