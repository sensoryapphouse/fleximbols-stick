<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Two singer silhouettes (busts) with sound waves emerging that MERGE into a combined wave -->

  <!-- LEFT SINGER bust (head + shoulders) -->
  <!-- Shoulders -->
  <path d="M22 200 Q22 162 50 156 Q78 162 78 200 Z" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="5.47" stroke-linejoin="round"/>
  <!-- Head -->
  <circle cx="50" cy="120" r="28" fill="#eed5b6" stroke="#1a1a1a" stroke-width="6.15"/>
  <!-- Hair -->
  <path d="M22 116 Q24 90 50 86 Q76 90 78 116 L74 112 Q68 100 50 100 Q32 100 26 112 Z" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="4.79" stroke-linejoin="round"/>
  <!-- Eyes closed (singing) -->
  <path d="M38 116 Q42 120 46 116" fill="none" stroke="#1a1a1a" stroke-width="4.10" stroke-linecap="round"/>
  <path d="M54 116 Q58 120 62 116" fill="none" stroke="#1a1a1a" stroke-width="4.10" stroke-linecap="round"/>
  <!-- Open singing mouth -->
  <ellipse cx="50" cy="138" rx="8" ry="7" fill="#000000" stroke="#1a1a1a" stroke-width="3.42"/>

  <!-- RIGHT SINGER bust -->
  <path d="M212 200 Q212 162 240 156 Q268 162 268 200 Z" fill="#d01424" stroke="#1a1a1a" stroke-width="5.47" stroke-linejoin="round"/>
  <circle cx="240" cy="120" r="28" fill="#e6b98a" stroke="#1a1a1a" stroke-width="6.15"/>
  <path d="M212 116 Q212 88 240 84 Q268 88 268 116 L268 134 L264 130 Q260 100 240 100 Q220 100 216 130 L212 134 Z" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.79" stroke-linejoin="round"/>
  <path d="M228 116 Q232 120 236 116" fill="none" stroke="#1a1a1a" stroke-width="4.10" stroke-linecap="round"/>
  <path d="M244 116 Q248 120 252 116" fill="none" stroke="#1a1a1a" stroke-width="4.10" stroke-linecap="round"/>
  <ellipse cx="240" cy="138" rx="8" ry="7" fill="#000000" stroke="#1a1a1a" stroke-width="3.42"/>

  <!-- Sound wave from LEFT singer emerging from mouth, going right and converging at center -->
  <path d="M62 138 Q80 130 100 138 Q120 146 140 138" fill="none" stroke="#7c3fac" stroke-width="6.15" stroke-linecap="round"/>
  <path d="M62 146 Q82 158 102 146 Q122 134 140 146" fill="none" stroke="#7c3fac" stroke-width="6.15" stroke-linecap="round"/>

  <!-- Sound wave from RIGHT singer emerging, going left and converging at center -->
  <path d="M228 138 Q210 130 190 138 Q170 146 150 138" fill="none" stroke="#3aa6a0" stroke-width="6.15" stroke-linecap="round"/>
  <path d="M228 146 Q208 158 188 146 Q168 134 150 146" fill="none" stroke="#3aa6a0" stroke-width="6.15" stroke-linecap="round"/>

  <!-- MERGED combined wave in middle (larger, double-line) -->
  <path d="M120 100 Q132 80 145 100 Q158 120 170 100" fill="none" stroke="#ff9900" stroke-width="7.52" stroke-linecap="round"/>
  <path d="M120 76 Q132 56 145 76 Q158 96 170 76" fill="none" stroke="#ff9900" stroke-width="7.52" stroke-linecap="round"/>

  <!-- Merge convergence marks: arrows pointing inward and starburst at center top -->
  <polygon points="145,40 158,60 152,60 152,72 138,72 138,60 132,60" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.10" stroke-linejoin="round"/>

  <!-- Musical notes attached to merged wave -->
  <ellipse cx="132" cy="92" rx="5" ry="4" fill="#000000" stroke="#1a1a1a" stroke-width="2.74"/>
  <line x1="137" y1="90" x2="137" y2="72" stroke="#1a1a1a" stroke-width="4.10" stroke-linecap="round"/>
  <ellipse cx="158" cy="92" rx="5" ry="4" fill="#000000" stroke="#1a1a1a" stroke-width="2.74"/>
  <line x1="163" y1="90" x2="163" y2="72" stroke="#1a1a1a" stroke-width="4.10" stroke-linecap="round"/>
  <path d="M137 72 L163 72" stroke="#1a1a1a" stroke-width="4.10" stroke-linecap="round"/>
</g></svg>