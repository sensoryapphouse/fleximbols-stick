<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- pcr-test: a nasal swab inserted into a collection tube -->

  <!-- tube body -->
  <rect x="118" y="80" width="44" height="130" rx="6" ry="6" fill="#dff3fd" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- tube liquid fill (blue tinted medium) -->
  <rect x="123" y="140" width="34" height="64" rx="4" ry="4" fill="#90a7d6" stroke="none"/>
  <!-- tube cap -->
  <rect x="112" y="68" width="56" height="20" rx="6" ry="6" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- tube label band -->
  <rect x="118" y="120" width="44" height="18" rx="2" ry="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- label lines -->
  <line x1="124" y1="126" x2="156" y2="126" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="124" y1="132" x2="148" y2="132" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>

  <!-- swab stick going through cap into tube -->
  <line x1="140" y1="15" x2="140" y2="110" stroke="#efefef" stroke-width="7.40" stroke-linecap="round"/>
  <line x1="140" y1="15" x2="140" y2="110" stroke="#1a1a1a" stroke-width="7.40" stroke-linecap="round" stroke-dasharray="0" opacity="0"/>
  <!-- swab stick outline -->
  <rect x="137" y="15" width="6" height="95" rx="3" ry="3" fill="#efef ef" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- swab tip (fluffy end) -->
  <ellipse cx="140" cy="18" rx="12" ry="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- swab tip texture lines -->
  <line x1="132" y1="15" x2="148" y2="21" stroke="#b8b8b8" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="131" y1="19" x2="149" y2="17" stroke="#b8b8b8" stroke-width="2.96" stroke-linecap="round"/>

  <!-- PCR label below tube -->
  <text x="140" y="228" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#000000">PCR</text>
</g></svg>