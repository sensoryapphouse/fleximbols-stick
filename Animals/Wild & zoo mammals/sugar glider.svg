  <!-- Patagium (gliding membrane) left — stretched from wrist to ankle -->
  <path d="M80 55 Q60 110 68 175 Q90 155 115 145 Q128 120 130 95 Q110 72 80 55Z" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Patagium right -->
  <path d="M210 55 Q230 110 222 175 Q200 155 175 145 Q162 120 160 95 Q180 72 210 55Z" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- Membrane texture lines left -->
  <path d="M82 65 Q72 115 76 160" fill="none" stroke="#7d5e23" stroke-width="2.22" stroke-linecap="round"/>
  <path d="M95 58 Q82 108 86 155" fill="none" stroke="#7d5e23" stroke-width="2.22" stroke-linecap="round"/>
  <!-- Membrane texture lines right -->
  <path d="M208 65 Q218 115 214 160" fill="none" stroke="#7d5e23" stroke-width="2.22" stroke-linecap="round"/>
  <path d="M195 58 Q208 108 204 155" fill="none" stroke="#7d5e23" stroke-width="2.22" stroke-linecap="round"/>

  <!-- Body — small, compact -->
  <ellipse cx="145" cy="130" rx="30" ry="38" fill="#9d7246" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Belly stripe (pale) -->
  <ellipse cx="145" cy="132" rx="16" ry="26" fill="#eed5b6" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <!-- Dark dorsal stripe -->
  <line x1="145" y1="92" x2="145" y2="165" stroke="#4d4d4d" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Arms stretched out to sides -->
  <path d="M116 110 Q98 82 80 55" fill="none" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <path d="M174 110 Q192 82 210 55" fill="none" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <!-- Wrist/hand -->
  <circle cx="80" cy="55" r="7" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="210" cy="55" r="7" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Hind legs stretched down -->
  <path d="M128 165 Q108 172 68 175" fill="none" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <path d="M162 165 Q182 172 222 175" fill="none" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <!-- Ankle/foot -->
  <circle cx="68" cy="175" r="7" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="222" cy="175" r="7" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Head — large eyes key feature -->
  <ellipse cx="145" cy="92" rx="28" ry="26" fill="#9d7246" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Dark eye rings -->
  <ellipse cx="133" cy="88" rx="12" ry="11" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="3.33"/>
  <ellipse cx="157" cy="88" rx="12" ry="11" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Big eyes -->
  <circle cx="133" cy="88" r="8" fill="#000000" stroke="#1a1a1a" stroke-width="2.22"/>
  <circle cx="157" cy="88" r="8" fill="#000000" stroke="#1a1a1a" stroke-width="2.22"/>
  <circle cx="135" cy="86" r="3" fill="#ffffff"/>
  <circle cx="159" cy="86" r="3" fill="#ffffff"/>
  <!-- Nose -->
  <ellipse cx="145" cy="101" rx="5" ry="4" fill="#000000"/>
  <!-- Mouth -->
  <path d="M139 107 Q145 111 151 107" fill="none" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Ears — large, rounded -->
  <ellipse cx="122" cy="70" rx="10" ry="13" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <ellipse cx="122" cy="70" rx="5" ry="7" fill="#eed5b6"/>
  <ellipse cx="168" cy="70" rx="10" ry="13" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <ellipse cx="168" cy="70" rx="5" ry="7" fill="#eed5b6"/>

  <!-- Tail — long, bushy, curving behind -->
  <path d="M145 168 Q132 188 128 210 Q126 225 138 228 Q152 230 158 218 Q162 205 155 190 Q150 178 145 168Z" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Tail fluff -->
