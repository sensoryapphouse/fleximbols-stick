  <!-- BOW (upper right) -->
  <!-- Bow stick -->
  <line x1="162" y1="16" x2="278" y2="50" stroke="#7d5e23" stroke-width="5.93" stroke-linecap="round"/>
  <!-- Bow hair -->
  <line x1="165" y1="22" x2="276" y2="55" stroke="#efefef" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="164" y1="20" x2="277" y2="53" stroke="#efefef" stroke-width="2.22" stroke-linecap="round"/>
  <!-- Frog -->
  <rect x="155" y="14" width="14" height="10" rx="2" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Tip -->
  <path d="M 276,50 L 282,48 L 280,56 Z" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="2.96" stroke-linejoin="round"/>

