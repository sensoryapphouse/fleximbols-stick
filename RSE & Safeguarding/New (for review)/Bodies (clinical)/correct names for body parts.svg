<rect x="244" y="166" width="24" height="34" rx="8" fill="#f5d6b0" stroke="#1a1a1a" stroke-width="9"/>
<!-- head -->
<circle id="h1" data-fig="ma" cx="256" cy="120" r="46" fill="#f5d6b0" stroke="#1a1a1a" stroke-width="9"/>
