  <ellipse cx="145" cy="120" rx="118" ry="98" fill="none" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Wheel side cylinder -->
  <path d="M 27 120 L 27 188" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M 263 120 L 263 188" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M 27 188 Q 145 208 263 188" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- MASSIVE holes - key Emmental cue -->
  <!-- Hole 1 top-left large -->
  <ellipse cx="95" cy="85" rx="28" ry="25" fill="#e6b98a" stroke="#1a1a1a" stroke-width="3.70"/>
  <ellipse cx="95" cy="85" rx="20" ry="18" fill="#9d7246" stroke="none"/>
  <ellipse cx="88" cy="78" rx="8" ry="5" fill="#e6b98a" stroke="none"/>
  <!-- Hole 2 top-right large -->
  <ellipse cx="195" cy="90" rx="26" ry="24" fill="#e6b98a" stroke="#1a1a1a" stroke-width="3.70"/>
  <ellipse cx="195" cy="90" rx="18" ry="17" fill="#9d7246" stroke="none"/>
  <ellipse cx="188" cy="83" rx="7" ry="4" fill="#e6b98a" stroke="none"/>
  <!-- Hole 3 center massive -->
  <ellipse cx="145" cy="140" rx="30" ry="27" fill="#e6b98a" stroke="#1a1a1a" stroke-width="3.70"/>
  <ellipse cx="145" cy="140" rx="22" ry="20" fill="#9d7246" stroke="none"/>
