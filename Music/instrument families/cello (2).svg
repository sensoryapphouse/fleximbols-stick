    Q 170,132 174,118
    Q 178,102 164,86
    Q 152,70 128,68
    Q 118,66 108,68 Z"
    fill="#9d7246" stroke="#1a1a1a" stroke-width="7.40" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Body top face (front plate) -->
  <path d="M 110,71
    Q 86,73 74,89
    Q 60,104 64,120
    Q 68,134 80,140
    C 84,146 82,158 78,164
    Q 68,178 64,194
    Q 62,208 76,214
    Q 94,222 118,223
    Q 142,222 160,214
    Q 174,208 172,194
    Q 168,178 158,164
    C 154,158 152,146 156,140
    Q 168,134 172,120
    Q 176,104 162,89
    Q 150,73 126,71
    Q 118,69 110,71 Z"
    fill="#9d7246" stroke="none"/>
  <!-- C-bout waist left -->
  <path d="M 64,128 Q 74,124 78,136 Q 74,148 64,145"
