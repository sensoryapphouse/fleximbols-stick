  <rect x="50" y="160" width="135" height="40" rx="3" ry="3" fill="#000000" stroke="#1a1a1a" stroke-width="8.89"/>
  <line x1="58" y1="170" x2="180" y2="170" stroke="#b8b8b8" stroke-width="8.89"/>
  <line x1="58" y1="180" x2="180" y2="180" stroke="#b8b8b8" stroke-width="8.89"/>
  <line x1="58" y1="190" x2="180" y2="190" stroke="#b8b8b8" stroke-width="8.89"/>
