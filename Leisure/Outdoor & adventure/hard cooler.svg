  <path d="M52 62 Q52 52 60 52 Q68 52 68 62 L68 68 L52 68 Z" fill="none" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <rect x="46" y="68" width="28" height="22" rx="3" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="3.33"/>
  <circle cx="60" cy="79" r="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="2.22"/>
