<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Bar chart: 5 vertical bars on a baseline, varying heights -->
  <!-- Baseline y=200, bars sit above it, left margin 28, right margin 28 -->
  <!-- Axis baseline -->
  <line x1="28" y1="200" x2="262" y2="200" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Vertical axis -->
  <line x1="28" y1="30" x2="28" y2="200" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Bar 1: x=42 w=32 h=120 blue -->
  <rect x="42" y="80" width="32" height="120" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Bar 2: x=88 w=32 h=80 red -->
  <rect x="88" y="120" width="32" height="80" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Bar 3: x=134 w=32 h=150 green -->
  <rect x="134" y="50" width="32" height="150" fill="#529929" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Bar 4: x=180 w=32 h=60 yellow -->
  <rect x="180" y="140" width="32" height="60" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Bar 5: x=226 w=32 h=100 orange -->
  <rect x="226" y="100" width="32" height="100" fill="#ff9900" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
</g></svg>