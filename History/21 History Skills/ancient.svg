<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(256 256) scale(1.2728) translate(-276.00 -292.00)">
<!-- ANCIENT: a ruined classical column - broken top + a fallen drum beside it -->
<!-- ===== standing (but broken) fluted column ===== -->
<!-- stepped base -->
<rect x="110.0" y="424.0" width="192.0" height="26.0" rx="5" fill="#c7c2b6" stroke="#8c867a" stroke-width="5"/>
<rect x="128.0" y="402.0" width="156.0" height="24.0" rx="5" fill="#ded9cd" stroke="#8c867a" stroke-width="5"/>
<!-- shaft with a jagged BROKEN top edge (the ruin cue) -->
<path d="M 154 402
         L 154 168
         L 170 150 L 184 172 L 200 146 L 216 176 L 232 150 L 246 170 L 258 152
         L 258 402 Z"
      fill="#ded9cd" stroke="#8c867a" stroke-width="6" stroke-linejoin="round"/>
<!-- flutes -->
<line x1="171" y1="180" x2="171" y2="396" stroke="#8c867a" stroke-width="4" stroke-linecap="round"/>
<line x1="189" y1="176" x2="189" y2="396" stroke="#8c867a" stroke-width="4" stroke-linecap="round"/>
<line x1="206" y1="166" x2="206" y2="396" stroke="#8c867a" stroke-width="4" stroke-linecap="round"/>
<line x1="223" y1="178" x2="223" y2="396" stroke="#8c867a" stroke-width="4" stroke-linecap="round"/>
<line x1="241" y1="172" x2="241" y2="396" stroke="#8c867a" stroke-width="4" stroke-linecap="round"/>
<!-- a horizontal crack across the shaft -->
<path d="M 154 290 L 178 282 L 200 292 L 226 284 L 258 292" fill="none" stroke="#8c867a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

<!-- ===== fallen broken column DRUM lying beside it ===== -->
<!-- the drum: a short cylinder on its side -->
<rect x="318.0" y="402.0" width="120.0" height="48.0" rx="10" fill="#ded9cd" stroke="#8c867a" stroke-width="6"/>
<!-- circular end face (shows it is a round column piece) -->
<ellipse cx="330.0" cy="426.0" rx="13.0" ry="24.0" fill="#c7c2b6" stroke="#8c867a" stroke-width="5"/>
<ellipse cx="330.0" cy="426.0" rx="6.0" ry="12.0" fill="none" stroke="#8c867a" stroke-width="3"/>
<!-- broken jagged right end of the drum -->
<path d="M 438 408 L 426 416 L 440 424 L 426 434 L 438 444"
      fill="none" stroke="#8c867a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<!-- flute lines along the drum -->
<line x1="350" y1="408" x2="350" y2="444" stroke="#8c867a" stroke-width="3.5" stroke-linecap="round"/>
<line x1="372" y1="406" x2="372" y2="446" stroke="#8c867a" stroke-width="3.5" stroke-linecap="round"/>
<line x1="394" y1="406" x2="394" y2="446" stroke="#8c867a" stroke-width="3.5" stroke-linecap="round"/>
<line x1="414" y1="408" x2="414" y2="444" stroke="#8c867a" stroke-width="3.5" stroke-linecap="round"/>
</g></svg>
