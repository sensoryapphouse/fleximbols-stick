  <!-- factory building behind, on the right -->
  <rect x="160" y="80" width="120" height="115" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="6.67"/>
  <!-- factory roof (sawtooth) -->
  <path d="M160,80 L175,65 L190,80 L205,65 L220,80 L235,65 L250,80 L265,65 L280,80 Z" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- factory chimney -->
  <rect x="245" y="35" width="18" height="48" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="6.67"/>
  <rect x="242" y="32" width="24" height="6" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- smoke puffs -->
  <circle cx="254" cy="25" r="6" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="263" cy="18" r="5" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="270" cy="10" r="4" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- factory windows -->
  <rect x="175" y="100" width="20" height="20" fill="#90a7d6" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="185" y1="100" x2="185" y2="120" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="175" y1="110" x2="195" y2="110" stroke="#1a1a1a" stroke-width="3.33"/>
  <rect x="205" y="100" width="20" height="20" fill="#90a7d6" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="215" y1="100" x2="215" y2="120" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="205" y1="110" x2="225" y2="110" stroke="#1a1a1a" stroke-width="3.33"/>
  <rect x="235" y="100" width="20" height="20" fill="#90a7d6" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="245" y1="100" x2="245" y2="120" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="235" y1="110" x2="255" y2="110" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- factory door -->
  <rect x="208" y="155" width="22" height="40" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="226" cy="175" r="1.5" fill="#f7de58"/>
  <!-- vinyl record (foreground left) -->
  <circle cx="95" cy="135" r="75" fill="#000000" stroke="#1a1a1a" stroke-width="6.67"/>
  <!-- vinyl grooves -->
  <circle cx="95" cy="135" r="68" fill="none" stroke="#4d4d4d" stroke-width="2.22"/>
  <circle cx="95" cy="135" r="60" fill="none" stroke="#4d4d4d" stroke-width="2.22"/>
  <circle cx="95" cy="135" r="52" fill="none" stroke="#4d4d4d" stroke-width="2.22"/>
  <circle cx="95" cy="135" r="44" fill="none" stroke="#4d4d4d" stroke-width="2.22"/>
  <!-- centre label (the "record label") -->
  <circle cx="95" cy="135" r="32" fill="#d01424" stroke="#1a1a1a" stroke-width="6.67"/>
  <!-- label logo: a stylised stamp/star -->
  <path d="M95,118 L99,128 L110,128 L101,135 L104,146 L95,140 L86,146 L89,135 L80,128 L91,128 Z" fill="#fff200" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- centre spindle hole -->
  <circle cx="95" cy="135" r="3.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- stamp icon: a rectangular stamp pressing down (shows label stamp idea) -->
  <rect x="135" y="40" width="50" height="38" rx="3" ry="3" fill="#9d7246" stroke="#1a1a1a" stroke-width="6.67"/>
  <rect x="142" y="48" width="36" height="22" rx="1" ry="1" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- star on stamp face -->
  <path d="M160,52 L162,58 L168,58 L163,62 L165,68 L160,64 L155,68 L157,62 L152,58 L158,58 Z" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <!-- stamp handle on top -->
  <rect x="152" y="20" width="16" height="22" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="6.67"/>
  <ellipse cx="160" cy="20" rx="14" ry="5" fill="#7d5e23" stroke="#1a1a1a" stroke-width="6.67"/>
  <!-- impact lines around stamp -->
  <line x1="125" y1="50" x2="115" y2="45" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="125" y1="65" x2="115" y2="68" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="195" y1="50" x2="205" y2="45" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="195" y1="65" x2="205" y2="68" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
</g></svg>