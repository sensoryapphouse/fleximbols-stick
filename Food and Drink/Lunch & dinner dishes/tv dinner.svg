  <!-- Foil tray outer (3/4 perspective rectangle) -->
  <path d="M 30,75 L 260,65 L 270,205 L 20,215 Z" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="11.11" stroke-linejoin="round"/>
  <!-- Tray inner well -->
  <path d="M 45,85 L 245,77 L 253,193 L 38,201 Z" fill="#efefef" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- Divider 1 (vertical, dividing left/right top) -->
  <line x1="115" y1="80" x2="118" y2="138" stroke="#1a1a1a" stroke-width="8.89" stroke-linecap="round"/>
  <!-- Divider 2 (horizontal across middle) -->
  <line x1="43" y1="138" x2="252" y2="135" stroke="#1a1a1a" stroke-width="8.89" stroke-linecap="round"/>
  <!-- Compartment 1 (top-left): meat (brown) -->
  <path d="M 50,90 L 113,87 L 116,133 L 47,136 Z" fill="#7d5e23" stroke="#1a1a1a" stroke-width="5.56" stroke-linejoin="round"/>
  <!-- Gravy highlight on meat -->
  <ellipse cx="80" cy="110" rx="20" ry="8" fill="#5e1f0a" stroke="none"/>
  <!-- Compartment 2 (top-right): vegetables (peas + carrots) -->
  <path d="M 120,87 L 243,80 L 250,131 L 121,134 Z" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.56" stroke-linejoin="round"/>
  <!-- Peas -->
  <circle cx="140" cy="100" r="5" fill="#529929" stroke="#1a1a1a" stroke-width="3.33"/>
  <circle cx="155" cy="108" r="5" fill="#529929" stroke="#1a1a1a" stroke-width="3.33"/>
  <circle cx="170" cy="100" r="5" fill="#529929" stroke="#1a1a1a" stroke-width="3.33"/>
  <circle cx="148" cy="120" r="5" fill="#529929" stroke="#1a1a1a" stroke-width="3.33"/>
  <circle cx="165" cy="122" r="5" fill="#529929" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Carrots (orange diced) -->
  <rect x="190" y="98" width="9" height="8" fill="#ff9900" stroke="#1a1a1a" stroke-width="3.33"/>
  <rect x="210" y="105" width="9" height="8" fill="#ff9900" stroke="#1a1a1a" stroke-width="3.33"/>
  <rect x="195" y="118" width="9" height="8" fill="#ff9900" stroke="#1a1a1a" stroke-width="3.33"/>
  <rect x="218" y="120" width="9" height="8" fill="#ff9900" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Compartment 3 (bottom, full width): dessert (pink/cream) -->
  <path d="M 43,141 L 252,138 L 250,190 L 41,198 Z" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="5.56" stroke-linejoin="round"/>
  <!-- Cherry on dessert -->
  <circle cx="145" cy="168" r="10" fill="#d01424" stroke="#1a1a1a" stroke-width="5.56"/>
  <!-- Cherry stem -->
  <path d="M 145,158 Q 150,150 158,153" fill="none" stroke="#529929" stroke-width="5.56" stroke-linecap="round"/>
  <!-- Whipped cream dots -->
  <circle cx="100" cy="170" r="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="115" cy="175" r="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="180" cy="175" r="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="200" cy="172" r="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Foil cover (peeled back from top corner) -->
  <path d="M 30,75 L 130,40 L 165,52 L 90,80 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- Foil crinkles -->
  <line x1="60" y1="58" x2="70" y2="63" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="90" y1="50" x2="100" y2="55" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="115" y1="48" x2="125" y2="53" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
</g></svg>