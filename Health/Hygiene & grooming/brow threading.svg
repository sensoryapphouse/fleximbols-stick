  <!-- Thread strand 1 - left hand to right (twisted in middle) -->
  <path d="M30 90 L100 110 Q130 118 145 118 Q160 118 190 124 L260 152" fill="none" stroke="#f8130d" stroke-width="4.45" stroke-linecap="round"/>
