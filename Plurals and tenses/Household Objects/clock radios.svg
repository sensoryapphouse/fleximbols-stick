<line x1="250" y1="276" x2="250" y2="298"/>
<line x1="232" y1="275" x2="250" y2="275"/>
</g>
<!-- speaker grille (right) -->
<rect x="296" y="232" width="96" height="80" rx="8" fill="#9aa0a6" stroke="#1a1a1a" stroke-width="6"/>
<line x1="312" y1="248" x2="376" y2="248" stroke="#1a1a1a" stroke-width="5"/>
