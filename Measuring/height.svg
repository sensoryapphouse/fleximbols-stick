<!-- vertical height chart / measuring board -->
<rect x="92" y="60" width="72" height="392" rx="10" fill="#f4c869" stroke="#caa015" stroke-width="5"/>
<line x1="92" y1="60" x2="138" y2="60" stroke="#caa015" stroke-width="5" stroke-linecap="round"/>
<line x1="92" y1="100" x2="119" y2="100" stroke="#caa015" stroke-width="4" stroke-linecap="round"/>
<line x1="92" y1="140" x2="138" y2="140" stroke="#caa015" stroke-width="5" stroke-linecap="round"/>
<line x1="92" y1="180" x2="119" y2="180" stroke="#caa015" stroke-width="4" stroke-linecap="round"/>
<line x1="92" y1="220" x2="138" y2="220" stroke="#caa015" stroke-width="5" stroke-linecap="round"/>
<line x1="92" y1="260" x2="119" y2="260" stroke="#caa015" stroke-width="4" stroke-linecap="round"/>
<line x1="92" y1="300" x2="138" y2="300" stroke="#caa015" stroke-width="5" stroke-linecap="round"/>
<line x1="92" y1="340" x2="119" y2="340" stroke="#caa015" stroke-width="4" stroke-linecap="round"/>
<line x1="92" y1="380" x2="138" y2="380" stroke="#caa015" stroke-width="5" stroke-linecap="round"/>
<line x1="92" y1="420" x2="119" y2="420" stroke="#caa015" stroke-width="4" stroke-linecap="round"/>
<!-- PERSON standing against the chart (the referent whose height is shown) -->
<g fill="none" stroke="#1a1a1a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
<!-- head -->
<circle cx="300" cy="120" r="34" fill="#1a1a1a" stroke="none"/>
<!-- body -->
<line x1="300" y1="156" x2="300" y2="300"/>
<!-- arms -->
<line x1="300" y1="196" x2="252" y2="252"/>
<line x1="300" y1="196" x2="348" y2="252"/>
<!-- legs -->
<line x1="300" y1="300" x2="262" y2="392"/>
<line x1="300" y1="300" x2="338" y2="392"/>
</g>
<!-- ground line under the feet -->
<line x1="178" y1="402" x2="392" y2="402" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
<!-- head marker line from top of head back to the chart -->
<line x1="180" y1="86" x2="300" y2="86" stroke="#e0473c" stroke-width="7" stroke-linecap="round" stroke-dasharray="4 12"/>
<!-- vertical dimension arrow spanning the person's FULL height, beside the chart -->
<line x1="200" y1="92" x2="200" y2="398" stroke="#e0473c" stroke-width="11" stroke-linecap="round"/>
<polygon points="200.0,84.0 185.0,110.0 215.0,110.0" fill="#e0473c" stroke="#1a1a1a" stroke-width="6"/>
<polygon points="200.0,406.0 185.0,380.0 215.0,380.0" fill="#e0473c" stroke="#1a1a1a" stroke-width="6"/>
</g></svg>
