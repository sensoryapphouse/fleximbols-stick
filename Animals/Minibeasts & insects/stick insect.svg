  <!-- Abdomen twig bark texture lines -->
  <line x1="141" y1="120" x2="153" y2="122" stroke="#7d5e23" stroke-width="2.96"/>
  <line x1="141" y1="132" x2="153" y2="130" stroke="#7d5e23" stroke-width="2.96"/>
  <line x1="141" y1="144" x2="153" y2="146" stroke="#7d5e23" stroke-width="2.96"/>
  <line x1="141" y1="156" x2="153" y2="154" stroke="#7d5e23" stroke-width="2.96"/>
  <line x1="141" y1="168" x2="153" y2="170" stroke="#7d5e23" stroke-width="2.96"/>
  <line x1="141" y1="180" x2="153" y2="178" stroke="#7d5e23" stroke-width="2.96"/>
  <line x1="141" y1="192" x2="153" y2="194" stroke="#7d5e23" stroke-width="2.96"/>
  <!-- Thorax - slightly wider join -->
