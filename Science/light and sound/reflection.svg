<svg xmlns="http://www.w3.org/2000/svg" viewBox="50.58 32.66 380.12 380.12"><!-- reflection: light ray hits mirror and bounces off --><g stroke-linejoin="round" stroke-linecap="round"><!-- mirror surface (tilted) --><rect x="150" y="300" width="220" height="34" rx="10" fill="#bfe3f2" stroke="#1a1a1a" stroke-width="9" transform="rotate(-20 260 317)"/><!-- mirror back/frame strip --><rect x="150" y="328" width="220" height="16" rx="6" fill="#9aa0a6" stroke="#1a1a1a" stroke-width="7" transform="rotate(-20 260 317)"/><!-- incoming ray --><line x1="120" y1="110" x2="244" y2="262" stroke="#f4c430" stroke-width="11"/><!-- incoming arrowhead --><path d="M244 262 L222 242 L252 236 Z" fill="#f4c430" stroke="#1a1a1a" stroke-width="6"/><!-- outgoing ray (bounced) --><line x1="244" y1="262" x2="402" y2="150" stroke="#f4c430" stroke-width="11"/><!-- outgoing arrowhead --><path d="M402 150 L372 152 L382 178 Z" fill="#f4c430" stroke="#1a1a1a" stroke-width="6"/><!-- sun source --><circle cx="108" cy="98" r="30" fill="#f4c430" stroke="#1a1a1a" stroke-width="8"/></g></svg>
