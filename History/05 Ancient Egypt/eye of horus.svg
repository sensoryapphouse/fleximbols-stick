<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Eye of Horus (Wedjat): eyebrow, outer eye, iris, pupil, teardrop, inner curl, outer curl -->
  <!-- Eyebrow bar -->
  <rect x="80" y="68" width="130" height="10" rx="5" fill="#000000" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Outer eye white (almond) -->
  <path d="M70 120 Q145 68 220 120 Q145 172 70 120 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Iris -->
  <circle cx="145" cy="120" r="30" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Pupil -->
  <circle cx="145" cy="120" r="14" fill="#000000"/>
  <!-- Eye highlight -->
  <circle cx="135" cy="112" r="5" fill="#ffffff"/>
  <!-- Teardrop line descending from inner corner -->
  <path d="M100 130 L85 165 L95 185" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Teardrop horizontal crossbar -->
  <path d="M85 165 L115 165" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Inner curl (spiral under inner eye corner) -->
  <path d="M100 138 Q80 148 88 162" fill="none" stroke="#1a1a1a" stroke-width="3.55" stroke-linecap="round"/>
  <!-- Outer curl (spiral descending from outer corner) -->
  <path d="M190 132 L205 150 Q215 175 195 180 Q175 185 180 168" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Outer curl tail -->
  <path d="M180 168 Q172 158 185 155" fill="none" stroke="#1a1a1a" stroke-width="3.55" stroke-linecap="round"/>
  <!-- Brow spiral decoration left -->
  <path d="M80 68 Q65 60 70 50 Q78 42 88 52" fill="none" stroke="#1a1a1a" stroke-width="3.55" stroke-linecap="round"/>
</g></svg>