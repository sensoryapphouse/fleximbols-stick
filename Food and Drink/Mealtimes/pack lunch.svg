<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Hands putting sandwich and fruit into a lunchbox -->
  <!-- Lunchbox body (open, on surface) -->
  <rect x="80" y="148" width="140" height="72" rx="10" fill="#f7de58" stroke="#1a1a1a" stroke-width="6.34" stroke-linejoin="round"/>
  <!-- Lunchbox lid (open, hinged back) -->
  <path d="M80 148 Q150 108 220 148" fill="#f2e40d" stroke="#1a1a1a" stroke-width="6.34" stroke-linejoin="round"/>
  <!-- Lunchbox interior (visible base) -->
  <rect x="86" y="155" width="128" height="60" rx="6" fill="#fff200" stroke="#1a1a1a" stroke-width="3.81"/>
  <!-- Inside divider line -->
  <line x1="150" y1="155" x2="150" y2="215" stroke="#1a1a1a" stroke-width="3.81" stroke-linecap="round"/>
  <!-- Sandwich already inside lunchbox (left half) -->
  <!-- Bread bottom -->
  <rect x="92" y="182" width="50" height="12" rx="4" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="3.81"/>
  <!-- Sandwich filling (green lettuce + red) -->
  <rect x="92" y="176" width="50" height="8" rx="2" fill="#529929" stroke="#1a1a1a" stroke-width="2.54"/>
  <rect x="94" y="170" width="46" height="8" rx="2" fill="#f8130d" stroke="#1a1a1a" stroke-width="2.54"/>
  <!-- Bread top -->
  <rect x="92" y="162" width="50" height="12" rx="5" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="3.81"/>
  <!-- Apple / fruit being placed (right side of box, held by hand) -->
  <circle cx="175" cy="115" r="18" fill="#f8130d" stroke="#1a1a1a" stroke-width="5.08"/>
  <!-- Apple stem -->
  <path d="M175 97 Q177 90 182 87" fill="none" stroke="#529929" stroke-width="3.81" stroke-linecap="round"/>
  <!-- Apple leaf -->
  <ellipse cx="181" cy="89" rx="7" ry="5" fill="#529929" stroke="#1a1a1a" stroke-width="2.54" transform="rotate(-30 181 89)"/>
  <!-- Right hand holding apple -->
  <ellipse cx="192" cy="128" rx="13" ry="10" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.08"/>
  <!-- Right arm -->
  <path d="M218 100 Q207 114 192 126" fill="none" stroke="#eed5b6" stroke-width="16.50" stroke-linecap="round"/>
  <!-- Left hand gesture / placing -->
  <ellipse cx="96" cy="130" rx="13" ry="10" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.08"/>
  <!-- Left arm -->
  <path d="M68 102 Q80 116 96 128" fill="none" stroke="#eed5b6" stroke-width="16.50" stroke-linecap="round"/>
  <!-- Lunchbox handle on lid -->
  <path d="M132 128 Q150 118 168 128" fill="none" stroke="#1a1a1a" stroke-width="6.34" stroke-linecap="round"/>
  <!-- Lunchbox clasp on box front -->
  <rect x="136" y="144" width="28" height="10" rx="4" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="3.81"/>
  <!-- Surface line -->
  <line x1="40" y1="222" x2="250" y2="222" stroke="#1a1a1a" stroke-width="5.08" stroke-linecap="round"/>
</g></svg>