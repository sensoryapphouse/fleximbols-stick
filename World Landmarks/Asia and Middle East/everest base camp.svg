<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- sky -->
  <rect x="0" y="0" width="290" height="170" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- snowy ground -->
  <rect x="0" y="170" width="290" height="70" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Everest peak (dominant) -->
  <path d="M40 170 L150 30 L260 170 Z" fill="#90a7d6" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- snow cap zigzag -->
  <path d="M105 85 L150 30 L195 85 L182 92 L170 82 L160 92 L150 82 L140 92 L130 82 L118 92 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- summit flag pole on peak -->
  <line x1="150" y1="30" x2="150" y2="15" stroke="#1a1a1a" stroke-width="6.67" stroke-linecap="round"/>
  <!-- summit flag -->
  <path d="M150 15 L168 19 L150 24 Z" fill="#d01424" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- altitude marker / signpost -->
  <line x1="50" y1="220" x2="50" y2="175" stroke="#7d5e23" stroke-width="8.89" stroke-linecap="round"/>
  <rect x="20" y="175" width="58" height="16" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- altitude marks (no text, use chevrons) -->
  <path d="M28 183 L34 179 L34 187 Z" fill="#000000"/>
  <path d="M44 183 L50 179 L50 187 Z" fill="#000000"/>
  <path d="M60 183 L66 179 L66 187 Z" fill="#000000"/>
  <!-- base camp tent (dome) -->
  <path d="M170 220 Q200 165 230 220 Z" fill="#ff9900" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- tent door -->
  <path d="M200 220 L195 195 L205 195 Z" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- tent guy lines -->
  <line x1="170" y1="220" x2="160" y2="225" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="230" y1="220" x2="240" y2="225" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- climber FULL BODY (foreground left of tent) -->
  <!-- head with beanie -->
  <circle cx="115" cy="170" r="9" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45"/>
  <path d="M105 168 L125 168 L122 158 L108 158 Z" fill="#d01424" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- pom -->
  <circle cx="115" cy="156" r="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.22"/>
  <!-- jacket -->
  <rect x="103" y="178" width="24" height="26" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- backpack visible behind -->
  <rect x="127" y="180" width="8" height="20" fill="#67832d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- arms -->
  <line x1="103" y1="184" x2="94" y2="200" stroke="#1a1a1a" stroke-width="8.89" stroke-linecap="round"/>
  <line x1="127" y1="184" x2="138" y2="200" stroke="#1a1a1a" stroke-width="8.89" stroke-linecap="round"/>
  <!-- ice axe in right hand -->
  <line x1="138" y1="200" x2="146" y2="178" stroke="#7f7f7f" stroke-width="6.67" stroke-linecap="round"/>
  <path d="M146 178 L152 175 L148 182 Z" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- legs -->
  <rect x="105" y="204" width="9" height="22" fill="#000000" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="116" y="204" width="9" height="22" fill="#000000" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- boots -->
  <ellipse cx="110" cy="229" rx="7" ry="4" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="121" cy="229" rx="7" ry="4" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="4.45"/>
</g></svg>