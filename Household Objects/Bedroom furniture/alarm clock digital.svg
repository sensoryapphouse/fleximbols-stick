<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Clock body: rectangular digital clock -->
  <rect x="40" y="55" width="210" height="140" rx="14" ry="14" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <rect x="52" y="67" width="186" height="116" rx="8" ry="8" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Display area background -->
  <rect x="60" y="75" width="170" height="90" rx="5" ry="5" fill="#000000"/>
  <!-- Colon separator dots -->
  <rect x="135" y="100" width="8" height="8" rx="2" fill="#f7de58"/>
  <rect x="135" y="118" width="8" height="8" rx="2" fill="#f7de58"/>

  <!-- LEFT DIGIT: "1" — two vertical segments only -->
  <!-- top-right vertical -->
  <rect x="101" y="82" width="6" height="20" rx="2" fill="#f7de58"/>
  <!-- bottom-right vertical -->
  <rect x="101" y="107" width="6" height="20" rx="2" fill="#f7de58"/>
  <!-- top horizontal (dim) -->
  <rect x="77" y="82" width="20" height="6" rx="2" fill="#2a4ec0"/>
  <!-- middle horizontal (dim) -->
  <rect x="77" y="106" width="20" height="6" rx="2" fill="#2a4ec0"/>
  <!-- bottom horizontal (dim) -->
  <rect x="77" y="127" width="20" height="6" rx="2" fill="#2a4ec0"/>
  <!-- top-left vertical (dim) -->
  <rect x="75" y="83" width="6" height="20" rx="2" fill="#2a4ec0"/>
  <!-- bottom-left vertical (dim) -->
  <rect x="75" y="107" width="6" height="20" rx="2" fill="#2a4ec0"/>

  <!-- Second LEFT digit: "2" -->
  <!-- top horizontal -->
  <rect x="107" y="82" width="20" height="6" rx="2" fill="#f7de58"/>
  <!-- top-right vertical -->
  <rect x="125" y="83" width="6" height="20" rx="2" fill="#f7de58"/>
  <!-- middle horizontal -->
  <rect x="107" y="106" width="20" height="6" rx="2" fill="#f7de58"/>
  <!-- bottom-left vertical -->
  <rect x="107" y="107" width="6" height="20" rx="2" fill="#f7de58"/>
  <!-- bottom horizontal -->
  <rect x="107" y="127" width="20" height="6" rx="2" fill="#f7de58"/>
  <!-- top-left vertical (dim) -->
  <rect x="107" y="83" width="6" height="20" rx="2" fill="#2a4ec0"/>
  <!-- bottom-right vertical (dim) -->
  <rect x="125" y="107" width="6" height="20" rx="2" fill="#2a4ec0"/>

  <!-- RIGHT digit group: "3" and "0" -->
  <!-- "3" segments -->
  <!-- top horizontal -->
  <rect x="148" y="82" width="20" height="6" rx="2" fill="#f7de58"/>
  <!-- top-right vertical -->
  <rect x="166" y="83" width="6" height="20" rx="2" fill="#f7de58"/>
  <!-- middle horizontal -->
  <rect x="148" y="106" width="20" height="6" rx="2" fill="#f7de58"/>
  <!-- bottom-right vertical -->
  <rect x="166" y="107" width="6" height="20" rx="2" fill="#f7de58"/>
  <!-- bottom horizontal -->
  <rect x="148" y="127" width="20" height="6" rx="2" fill="#f7de58"/>
  <!-- top-left (dim) -->
  <rect x="148" y="83" width="6" height="20" rx="2" fill="#2a4ec0"/>
  <!-- bottom-left (dim) -->
  <rect x="148" y="107" width="6" height="20" rx="2" fill="#2a4ec0"/>

  <!-- "0" segments -->
  <!-- top horizontal -->
  <rect x="175" y="82" width="20" height="6" rx="2" fill="#f7de58"/>
  <!-- top-right vertical -->
  <rect x="193" y="83" width="6" height="20" rx="2" fill="#f7de58"/>
  <!-- bottom-right vertical -->
  <rect x="193" y="107" width="6" height="20" rx="2" fill="#f7de58"/>
  <!-- bottom horizontal -->
  <rect x="175" y="127" width="20" height="6" rx="2" fill="#f7de58"/>
  <!-- top-left vertical -->
  <rect x="175" y="83" width="6" height="20" rx="2" fill="#f7de58"/>
  <!-- bottom-left vertical -->
  <rect x="175" y="107" width="6" height="20" rx="2" fill="#f7de58"/>
  <!-- middle horizontal (dim) -->
  <rect x="175" y="106" width="20" height="6" rx="2" fill="#2a4ec0"/>

  <!-- AM indicator dots -->
  <rect x="68" y="155" width="5" height="5" rx="1" fill="#f7de58"/>
  <rect x="76" y="155" width="5" height="5" rx="1" fill="#f7de58"/>
  <rect x="84" y="155" width="5" height="5" rx="1" fill="#2a4ec0"/>

  <!-- Alarm bell buttons on top -->
  <rect x="80" y="42" width="22" height="18" rx="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="188" y="42" width="22" height="18" rx="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Bell icon on buttons -->
  <ellipse cx="91" cy="50" rx="6" ry="5" fill="#7f7f7f"/>
  <ellipse cx="199" cy="50" rx="6" ry="5" fill="#7f7f7f"/>

  <!-- Feet -->
  <rect x="68" y="191" width="30" height="10" rx="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="192" y="191" width="30" height="10" rx="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
</g></svg>