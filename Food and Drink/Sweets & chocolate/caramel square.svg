  <circle cx="170" cy="130" r="2" fill="#392170"/>
  <circle cx="190" cy="150" r="2" fill="#392170"/>
  <circle cx="165" cy="170" r="2" fill="#392170"/>
  <circle cx="185" cy="175" r="2" fill="#392170"/>
  <!-- Chewy texture: dots on top face -->
  <circle cx="120" cy="92" r="1.8" fill="#9d7246"/>
  <circle cx="145" cy="95" r="1.8" fill="#9d7246"/>
  <circle cx="170" cy="92" r="1.8" fill="#9d7246"/>
  <!-- Highlight stripe on top edge -->
  <path d="M 88,96 L 145,84 L 200,96" fill="none" stroke="#eed5b6" stroke-width="3.81" stroke-linecap="round"/>
