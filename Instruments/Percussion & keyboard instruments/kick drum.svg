<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Large drum lying on its side (horizontal), facing front, foot pedal + beater in front -->

  <!-- Drum resting spurs / legs at bottom -->
  <line x1="85" y1="195" x2="78" y2="218" stroke="#4d4d4d" stroke-width="5.55" stroke-linecap="round"/>
  <line x1="205" y1="195" x2="212" y2="218" stroke="#4d4d4d" stroke-width="5.55" stroke-linecap="round"/>

  <!-- Bass drum shell (cylinder on its side = very wide ellipse front + rect body) -->
  <!-- Shell body sides -->
  <rect x="82" y="75" width="126" height="122" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Hoops/tension rods detail on shell top -->
  <rect x="82" y="75" width="14" height="122" fill="#1d0e82" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <rect x="194" y="75" width="14" height="122" fill="#1d0e82" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <!-- Lug casings on shell side visible -->
  <rect x="100" y="90" width="12" height="20" rx="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <rect x="100" y="160" width="12" height="20" rx="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <rect x="178" y="90" width="12" height="20" rx="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <rect x="178" y="160" width="12" height="20" rx="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>

  <!-- Front head (batter head) - ellipse at left side of horizontal drum -->
  <ellipse cx="82" cy="136" rx="14" ry="60" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Hoop ring front -->
  <ellipse cx="82" cy="136" rx="14" ry="60" fill="none" stroke="#4d4d4d" stroke-width="4.45"/>

  <!-- Rear head - ellipse at right -->
  <ellipse cx="208" cy="136" rx="14" ry="60" fill="#dff3fd" stroke="#1a1a1a" stroke-width="5.55"/>

  <!-- Foot pedal board at bottom front -->
  <rect x="50" y="200" width="90" height="18" rx="6" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Pedal base plate -->
  <rect x="40" y="212" width="110" height="12" rx="5" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- Beater arm (pivoting from pedal) -->
  <line x1="88" y1="200" x2="68" y2="160" stroke="#4d4d4d" stroke-width="6.66" stroke-linecap="round"/>
  <!-- Beater head (felt ball) -->
  <circle cx="66" cy="154" r="12" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Pedal spring (coil symbol) -->
  <path d="M75 200 Q70 192 76 186 Q82 180 76 174 Q70 168 75 162" fill="none" stroke="#7f7f7f" stroke-width="3.33" stroke-linecap="round"/>
</g></svg>