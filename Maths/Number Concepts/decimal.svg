<!-- zoomed number line 0..1 split into ten equal tenths, marker at 0.5 -->
<!-- shaded run from 0 to the 0.5 marker: five tenths filled = .5 -->
<line x1="56" y1="300" x2="256" y2="300" stroke="#f3b0aa" stroke-width="20" stroke-linecap="butt"/>
<!-- main axis -->
<line x1="56" y1="300" x2="456" y2="300" stroke="#1a1a1a" stroke-width="12" stroke-linecap="round"/>
<!-- ten equal subdivisions: minor ticks at the nine interior tenths -->
<line x1="96" y1="288" x2="96" y2="312" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
<line x1="136" y1="288" x2="136" y2="312" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
<line x1="176" y1="288" x2="176" y2="312" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
<line x1="216" y1="288" x2="216" y2="312" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
<line x1="296" y1="288" x2="296" y2="312" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
<line x1="336" y1="288" x2="336" y2="312" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
<line x1="376" y1="288" x2="376" y2="312" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
<line x1="416" y1="288" x2="416" y2="312" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
<!-- bold end ticks at 0 (left) and 1 (right) -->
<line x1="56" y1="276" x2="56" y2="324" stroke="#1a1a1a" stroke-width="12" stroke-linecap="round"/>
<line x1="456" y1="276" x2="456" y2="324" stroke="#1a1a1a" stroke-width="12" stroke-linecap="round"/>
<!-- end labels as dot-glyphs: 0 = open ring at left, 1 = single filled bar at right (no text) -->
<circle cx="56" cy="356" r="16" fill="none" stroke="#1a1a1a" stroke-width="7"/>
<rect x="451" y="340" width="10" height="32" rx="5" fill="#1a1a1a"/>
<!-- emphasised midpoint 0.5 : big red marker drop-pin with tall tick -->
<line x1="256" y1="270" x2="256" y2="312" stroke="#e0473c" stroke-width="14" stroke-linecap="round"/>
<circle cx="256" cy="234" r="34" fill="#e0473c" stroke="#1a1a1a" stroke-width="8"/>
<!-- half-split inside the marker to read as one-half / .5 -->
<path d="M256 200 A34 34 0 0 0 256 268 Z" fill="#ffffff" stroke="none"/>
<line x1="256" y1="200" x2="256" y2="268" stroke="#1a1a1a" stroke-width="6"/>
</g></svg>
