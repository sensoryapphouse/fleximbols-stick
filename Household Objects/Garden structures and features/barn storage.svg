  <line x1="206" y1="190" x2="230" y2="196" stroke="#7d5e23" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="246" y1="178" x2="270" y2="184" stroke="#7d5e23" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="246" y1="190" x2="270" y2="196" stroke="#7d5e23" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="226" y1="142" x2="250" y2="148" stroke="#7d5e23" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="226" y1="154" x2="250" y2="160" stroke="#7d5e23" stroke-width="3.33" stroke-linecap="round"/>
