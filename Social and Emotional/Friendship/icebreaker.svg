  <path d="M22 175 L48 158" stroke="#1a1a1a" stroke-width="8.89" stroke-linecap="round"/>
  <path d="M22 175 L55 148" stroke="#7f7f7f" stroke-width="6.67" stroke-linecap="round"/>
  <!-- Upper hull / boot topping -->
  <path d="M22 175 L30 168 L270 168 L278 175" fill="#000000" stroke="none"/>
  <!-- Deck - wide, sturdy -->
  <rect x="55" y="142" width="213" height="8" rx="1" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="6.67" stroke-linecap="round" stroke-linejoin="round"/>
