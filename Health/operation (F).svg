<path d="M 139.0 200.0 L 139.0 144.0 Q 139.0 92.0 186.0 92.0 Q 233.0 92.0 233.0 144.0 L 233.0 200.0 L 220.0 200.0 L 220.0 146.0 Q 220.0 112.0 186.0 112.0 Q 152.0 112.0 152.0 146.0 L 152.0 200.0 Z" fill="#5a3a1f" stroke="#1a1a1a" stroke-width="3"/>
<circle id="h1" data-fig="fa" class="skin" cx="186" cy="146" r="40" fill="#f5d6b0" stroke="#1a1a1a" stroke-width="6"/>
