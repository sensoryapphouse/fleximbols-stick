<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- clothes-rack: free-standing rolling rack with row of hanging clothes -->

  <!-- Vertical posts -->
  <rect x="42" y="45" width="8" height="170" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="240" y="45" width="8" height="170" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- Top horizontal bar (where clothes hang) -->
  <rect x="35" y="40" width="220" height="12" rx="5" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- bar highlight -->
  <path d="M45 45 L245 45" fill="none" stroke="#efefef" stroke-width="2.96" stroke-linecap="round"/>

  <!-- Hanger 1 hooks -->
  <g fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round">
    <path d="M75 45 L75 35 Q75 28 82 28 Q88 28 88 35"/>
    <path d="M125 45 L125 35 Q125 28 132 28 Q138 28 138 35"/>
    <path d="M175 45 L175 35 Q175 28 182 28 Q188 28 188 35"/>
    <path d="M220 45 L220 35 Q220 28 213 28 Q207 28 207 35"/>
  </g>

  <!-- Garment 1 (red shirt) -->
  <g stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round">
    <!-- hanger triangle -->
    <path d="M75 55 L55 75 L95 75 Z" fill="none"/>
    <!-- shirt body -->
    <path d="M55 75 L50 95 L65 95 L65 165 L85 165 L85 95 L100 95 L95 75 Z"
          fill="#d01424"/>
    <!-- neckline -->
    <path d="M70 75 Q75 82 80 75" fill="#5e1f0a"/>
  </g>

  <!-- Garment 2 (blue shirt) -->
  <g stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round">
    <path d="M125 55 L105 75 L145 75 Z" fill="none"/>
    <path d="M105 75 L100 95 L115 95 L115 170 L135 170 L135 95 L150 95 L145 75 Z"
          fill="#2a4ec0"/>
    <path d="M120 75 Q125 82 130 75" fill="#1d0e82"/>
  </g>

  <!-- Garment 3 (yellow dress) -->
  <g stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round">
    <path d="M175 55 L155 75 L195 75 Z" fill="none"/>
    <path d="M155 75 L150 95 L165 95 L155 180 L195 180 L185 95 L200 95 L195 75 Z"
          fill="#f2e40d"/>
    <path d="M170 75 Q175 82 180 75" fill="#7d5e23"/>
  </g>

  <!-- Garment 4 (green pants) on right hanger -->
  <g stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round">
    <path d="M220 55 L205 70 L235 70 Z" fill="none"/>
    <!-- pants waist + legs -->
    <path d="M205 70 L235 70 L240 90 L228 90 L225 165 L215 165 L215 100 L210 165 L200 165 L205 90 L200 90 Z"
          fill="#529929"/>
  </g>

  <!-- Bottom support brace -->
  <rect x="35" y="200" width="220" height="8" rx="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- Wheels -->
  <circle cx="50" cy="220" r="12" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="50" cy="220" r="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="2.96"/>
  <circle cx="240" cy="220" r="12" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="240" cy="220" r="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="2.96"/>
</g></svg>