<path d="M 336 168 L 384 220 L 362 250 L 320 214 Z" fill="#bfe3f2" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- body of gown -->
<path d="M 184 162 Q 256 140 328 162 L 332 400 Q 256 416 180 400 Z" fill="#d7eef8" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
