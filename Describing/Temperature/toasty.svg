<svg xmlns="http://www.w3.org/2000/svg" viewBox="57.68 66.21 432.48 432.48">
<!-- TOASTY: warm orange glow/sun-warmth + warm-orange thermometer (comfortably high) -->
<!-- warm radiating glow rays -->
<g stroke="#f6a93b" stroke-width="11" stroke-linecap="round">
<line x1="226" y1="150" x2="226" y2="108"/>
<line x1="160" y1="180" x2="130" y2="150"/>
<line x1="132" y1="246" x2="90" y2="246"/>
<line x1="160" y1="312" x2="130" y2="342"/>
<line x1="226" y1="342" x2="226" y2="384"/>
<line x1="292" y1="312" x2="322" y2="342"/>
</g>
<!-- warm core (sun-like) -->
<circle cx="226" cy="246" r="74" fill="#ffd27a" stroke="#1a1a1a" stroke-width="9"/>
<!-- inner warmth -->
<circle cx="226" cy="246" r="40" fill="#f6a93b" stroke="#1a1a1a" stroke-width="0"/>
<!-- warm thermometer (orange, comfortably high) at right -->
<rect x="416" y="246" width="30" height="180" rx="15" fill="#ffffff" stroke="#1a1a1a" stroke-width="9"/>
<circle cx="431" cy="430" r="28" fill="#f6862b" stroke="#1a1a1a" stroke-width="9"/>
<rect x="422" y="296" width="18" height="138" rx="9" fill="#f6862b" stroke="#1a1a1a" stroke-width="0"/>
</svg>
