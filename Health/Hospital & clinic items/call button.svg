<svg xmlns="http://www.w3.org/2000/svg" viewBox="74.47 67.65 380.12 380.12">
<!-- nurse call button: handset pendant with a big red button -->
<!-- cord -->
<path d="M 256 96 Q 300 140 264 180" fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
<!-- pendant body -->
<rect x="176" y="170" width="160" height="250" rx="36" fill="#eef1f4" stroke="#1a1a1a" stroke-width="9"/>
<!-- big red call button -->
<circle cx="256" cy="262" r="54" fill="#d63b46" stroke="#1a1a1a" stroke-width="9"/>
<!-- bell glyph on button -->
<path d="M 236 268 Q 236 240 256 240 Q 276 240 276 268 L 280 274 L 232 274 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="6" stroke-linejoin="round"/>
<circle cx="256" cy="282" r="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="5"/>
<!-- ring waves -->
<path d="M 318 230 Q 336 262 318 294" fill="none" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
<path d="M 340 214 Q 368 262 340 310" fill="none" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
<!-- secondary small button -->
<rect x="216" y="346" width="80" height="40" rx="20" fill="#cfd6dc" stroke="#1a1a1a" stroke-width="8"/>
</svg>
