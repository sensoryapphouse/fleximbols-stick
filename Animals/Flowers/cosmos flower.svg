  <line x1="182" y1="195" x2="192" y2="187" stroke="#529929" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="182" y1="195" x2="190" y2="198" stroke="#529929" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="182" y1="195" x2="174" y2="188" stroke="#529929" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="182" y1="195" x2="187" y2="203" stroke="#529929" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="192" y1="187" x2="198" y2="183" stroke="#529929" stroke-width="2.22" stroke-linecap="round"/>
