  <!-- Chunky twist-up tube outer case -->
  <rect x="95" y="140" width="100" height="75" rx="10" ry="10" fill="#dff3fd" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Label area on case -->
  <rect x="100" y="152" width="90" height="50" rx="5" ry="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Small leaf icon on label -->
  <path d="M133,170 Q145,155 157,170 Q145,178 133,170 Z" fill="#529929" stroke="#1a1a1a" stroke-width="3.70"/>
  <!-- Leaf vein -->
  <line x1="145" y1="157" x2="145" y2="175" stroke="#137827" stroke-width="2.22" stroke-linecap="round"/>
  <!-- Label lines (medicinal feel) -->
  <line x1="104" y1="185" x2="186" y2="185" stroke="#b8b8b8" stroke-width="2.96"/>
  <line x1="104" y1="193" x2="175" y2="193" stroke="#b8b8b8" stroke-width="2.96"/>
  <!-- Middle sleeve ring -->
  <rect x="98" y="130" width="94" height="18" rx="5" ry="5" fill="#90a7d6" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
