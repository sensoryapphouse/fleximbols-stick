  <!-- travel-journal: leather-strap-wrapped notebook with map/compass motif -->
  <!-- Book body -->
  <rect x="55" y="30" width="180" height="185" rx="6" ry="6" fill="#9d7246" stroke="#1a1a1a" stroke-width="11.11" stroke-linejoin="round"/>
  <!-- Inner page area -->
  <rect x="68" y="43" width="154" height="159" rx="3" ry="3" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- Leather strap horizontal -->
  <rect x="55" y="100" width="180" height="18" rx="4" ry="4" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="11.11" stroke-linejoin="round"/>
  <!-- Strap buckle -->
  <rect x="215" y="97" width="22" height="24" rx="3" ry="3" fill="#f7de58" stroke="#1a1a1a" stroke-width="8.89" stroke-linejoin="round"/>
  <line x1="226" y1="97" x2="226" y2="121" stroke="#1a1a1a" stroke-width="6.67" stroke-linecap="round"/>
  <!-- Compass rose on page (below strap, centered) -->
  <circle cx="145" cy="155" r="32" fill="#dff3fd" stroke="#1a1a1a" stroke-width="8.89"/>
  <!-- Compass cardinal points -->
  <polygon points="145,128 140,148 150,148" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polygon points="145,182 140,162 150,162" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polygon points="118,155 138,150 138,160" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polygon points="172,155 152,150 152,160" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <circle cx="145" cy="155" r="5" fill="#000000"/>
  <!-- Map grid lines on page above strap -->
  <line x1="90" y1="60" x2="200" y2="60" stroke="#90a7d6" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="90" y1="75" x2="200" y2="75" stroke="#90a7d6" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="90" y1="90" x2="200" y2="90" stroke="#90a7d6" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="110" y1="55" x2="110" y2="95" stroke="#90a7d6" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="145" y1="55" x2="145" y2="95" stroke="#90a7d6" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="180" y1="55" x2="180" y2="95" stroke="#90a7d6" stroke-width="4.45" stroke-linecap="round"/>
</g></svg>