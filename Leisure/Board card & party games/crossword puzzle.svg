  <rect x="125" y="40" width="20" height="20" fill="#000000" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="205" y="40" width="20" height="20" fill="#000000" stroke="#1a1a1a" stroke-width="4.45"/>
