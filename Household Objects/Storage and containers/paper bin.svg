  <!-- Wheelie bin body - blue-grey -->
  <path d="M68 105 L75 210 Q75 220 85 220 L205 220 Q215 220 215 210 L222 105 Z" fill="#90a7d6" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round" stroke-linecap="round"/>
