<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Sitar-modern: very long broad fretted neck, large round gourd body, second small gourd near top, many tuning pegs, sympathetic strings -->
  <!-- Large round gourd body at bottom -->
  <ellipse cx="145" cy="195" rx="55" ry="38" fill="#9d7246" stroke="#1a1a1a" stroke-width="8.89"/>
  <!-- Body dome (gourd top curve) -->
  <ellipse cx="145" cy="185" rx="42" ry="28" fill="#7d5e23" stroke="#1a1a1a" stroke-width="0.00"/>
  <ellipse cx="145" cy="195" rx="55" ry="38" fill="none" stroke="#1a1a1a" stroke-width="8.89"/>
  <!-- Long broad neck -->
  <rect x="128" y="38" width="34" height="162" rx="4" fill="#7d5e23" stroke="#1a1a1a" stroke-width="8.89"/>
  <!-- Many curved frets on neck -->
  <line x1="128" y1="55" x2="162" y2="55" stroke="#1a1a1a" stroke-width="5.33"/>
  <line x1="128" y1="68" x2="162" y2="68" stroke="#1a1a1a" stroke-width="5.33"/>
  <line x1="128" y1="81" x2="162" y2="81" stroke="#1a1a1a" stroke-width="5.33"/>
  <line x1="128" y1="94" x2="162" y2="94" stroke="#1a1a1a" stroke-width="5.33"/>
  <line x1="128" y1="107" x2="162" y2="107" stroke="#1a1a1a" stroke-width="5.33"/>
  <line x1="128" y1="120" x2="162" y2="120" stroke="#1a1a1a" stroke-width="5.33"/>
  <line x1="128" y1="133" x2="162" y2="133" stroke="#1a1a1a" stroke-width="5.33"/>
  <line x1="128" y1="146" x2="162" y2="146" stroke="#1a1a1a" stroke-width="5.33"/>
  <line x1="128" y1="159" x2="162" y2="159" stroke="#1a1a1a" stroke-width="5.33"/>
  <line x1="128" y1="172" x2="162" y2="172" stroke="#1a1a1a" stroke-width="5.33"/>
  <!-- Second small gourd near top of neck -->
  <ellipse cx="162" cy="55" rx="18" ry="14" fill="#9d7246" stroke="#1a1a1a" stroke-width="7.11"/>
  <ellipse cx="162" cy="52" rx="13" ry="9" fill="#7d5e23" stroke="#1a1a1a" stroke-width="0.00"/>
  <ellipse cx="162" cy="55" rx="18" ry="14" fill="none" stroke="#1a1a1a" stroke-width="7.11"/>
  <!-- Headstock with many tuning pegs -->
  <rect x="124" y="18" width="38" height="24" rx="4" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="8.89"/>
  <!-- Main tuning pegs (top) -->
  <circle cx="132" cy="14" r="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.56"/>
  <circle cx="140" cy="14" r="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.56"/>
  <circle cx="148" cy="14" r="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.56"/>
  <circle cx="156" cy="14" r="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.56"/>
  <!-- Side pegs for sympathetic strings along neck -->
  <circle cx="125" cy="75" r="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.56"/>
  <circle cx="125" cy="90" r="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.56"/>
  <circle cx="125" cy="105" r="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.56"/>
  <circle cx="125" cy="120" r="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.56"/>
  <circle cx="125" cy="135" r="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.56"/>
  <!-- Main strings (4) -->
  <line x1="134" y1="18" x2="134" y2="195" stroke="#1a1a1a" stroke-width="3.56"/>
  <line x1="140" y1="18" x2="140" y2="195" stroke="#1a1a1a" stroke-width="3.56"/>
  <line x1="147" y1="18" x2="147" y2="195" stroke="#1a1a1a" stroke-width="3.56"/>
  <line x1="154" y1="18" x2="154" y2="195" stroke="#1a1a1a" stroke-width="3.56"/>
  <!-- Sympathetic strings (thin, along neck edge) -->
  <line x1="127" y1="75" x2="127" y2="195" stroke="#1a1a1a" stroke-width="1.78"/>
  <line x1="129" y1="90" x2="129" y2="195" stroke="#1a1a1a" stroke-width="1.78"/>
  <line x1="131" y1="105" x2="131" y2="195" stroke="#1a1a1a" stroke-width="1.78"/>
</g></svg>