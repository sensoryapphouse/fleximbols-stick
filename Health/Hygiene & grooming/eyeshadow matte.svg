  <!-- Matte eyeshadow pan (no shine) + brush + flat finish -->
  <!-- Round matte pan -->
  <circle cx="120" cy="140" r="76" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="11.11"/>
  <!-- Inner rim -->
  <circle cx="120" cy="140" r="66" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="8.89"/>
  <!-- Flat matte powder (dusty mauve) -->
  <circle cx="120" cy="140" r="56" fill="#9d7246" stroke="#1a1a1a" stroke-width="6.67"/>
  <!-- Matte powder texture: horizontal flat lines, no highlights -->
  <line x1="76" y1="120" x2="164" y2="120" stroke="#7d5e23" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="70" y1="132" x2="170" y2="132" stroke="#7d5e23" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="68" y1="144" x2="172" y2="144" stroke="#7d5e23" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="70" y1="156" x2="170" y2="156" stroke="#7d5e23" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="76" y1="168" x2="164" y2="168" stroke="#7d5e23" stroke-width="4.45" stroke-linecap="round"/>
  <!-- 'Matte' indicator: flat dull patch (not bright) -->
  <!-- No sparkle, no highlight. Add a small 'flat finish' swatch below -->
  <rect x="60" y="208" width="120" height="20" rx="4" fill="#9d7246" stroke="#1a1a1a" stroke-width="6.67"/>
  <!-- Swatch matte texture lines -->
  <line x1="68" y1="216" x2="172" y2="216" stroke="#7d5e23" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="68" y1="222" x2="172" y2="222" stroke="#7d5e23" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Brush (right side, slanted) -->
  <g transform="rotate(20 230 130)">
    <rect x="216" y="118" width="100" height="14" rx="6" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="11.11"/>
    <rect x="210" y="114" width="12" height="22" rx="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="8.89"/>
    <ellipse cx="194" cy="125" rx="22" ry="14" fill="#9d7246" stroke="#1a1a1a" stroke-width="8.89"/>
    <line x1="178" y1="118" x2="172" y2="112" stroke="#5e1f0a" stroke-width="4.45" stroke-linecap="round"/>
    <line x1="174" y1="126" x2="166" y2="128" stroke="#5e1f0a" stroke-width="4.45" stroke-linecap="round"/>
    <line x1="180" y1="134" x2="174" y2="140" stroke="#5e1f0a" stroke-width="4.45" stroke-linecap="round"/>
  </g>
</g></svg>