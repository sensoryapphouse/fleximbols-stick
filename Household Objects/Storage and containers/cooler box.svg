  <rect x="55" y="48" width="22" height="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="82" y="42" width="20" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="106" y="50" width="22" height="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
