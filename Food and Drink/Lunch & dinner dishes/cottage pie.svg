  <circle cx="135" cy="149" r="4" fill="#7d5e23" stroke="none"/>
  <circle cx="155" cy="142" r="3" fill="#4d4d4d" stroke="none"/>
  <circle cx="175" cy="150" r="5" fill="#7d5e23" stroke="none"/>
  <circle cx="195" cy="143" r="3" fill="#4d4d4d" stroke="none"/>
