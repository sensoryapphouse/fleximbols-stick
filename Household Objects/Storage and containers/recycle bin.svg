  <!-- Wheelie bin body -->
  <path d="M68 105 L75 210 Q75 220 85 220 L205 220 Q215 220 215 210 L222 105 Z" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Bin lid (blue) -->
  <rect x="55" y="88" width="180" height="22" rx="8" ry="8" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Lid hinge bump -->
  <rect x="125" y="82" width="40" height="12" rx="6" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="3.55" stroke-linejoin="round"/>
  <!-- Wheel axle bar -->
  <rect x="90" y="215" width="110" height="8" rx="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="3.55" stroke-linejoin="round"/>
  <!-- Wheels -->
  <circle cx="105" cy="223" r="12" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="185" cy="223" r="12" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Recycle symbol on body: three chasing arrows forming a triangle loop -->
  <!-- Arrow 1: top, pointing right-down -->
  <path d="M145 128 L162 158 L128 158 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.66" stroke-linejoin="round"/>
  <!-- Arrow 1 shaft -->
  <line x1="145" y1="128" x2="145" y2="115" stroke="#ffffff" stroke-width="7.11" stroke-linecap="round"/>
  <!-- Arrow 2: bottom-right, pointing left -->
  <path d="M168 162 L138 162 L153 188 Z" fill="none" stroke="none"/>
  <!-- Clean triangular recycle loop: three arrows tip-on-axis -->
  <!-- Using a clean path for the recycle symbol -->
  <!-- Shaft 1 (top-left going up-right) -->
  <line x1="125" y1="175" x2="138" y2="152" stroke="#ffffff" stroke-width="7.11" stroke-linecap="round"/>
  <!-- Arrowhead 1 pointing upper-right -->
  <polygon points="145,138 133,155 157,155" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.78" stroke-linejoin="round"/>
  <!-- Shaft 2 (top-right going down-right) -->
  <line x1="157" y1="152" x2="170" y2="175" stroke="#ffffff" stroke-width="7.11" stroke-linecap="round"/>
  <!-- Arrowhead 2 pointing lower-right -->
  <polygon points="178,188 158,182 168,162" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.78" stroke-linejoin="round"/>
  <!-- Shaft 3 (bottom going left) -->
  <line x1="165" y1="190" x2="125" y2="190" stroke="#ffffff" stroke-width="7.11" stroke-linecap="round"/>
  <!-- Arrowhead 3 pointing left -->
  <polygon points="112,190 128,182 128,198" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.78" stroke-linejoin="round"/>
</g></svg>