  <!-- Main body -->
  <rect x="28" y="80" width="234" height="80" rx="10" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Roof dome -->
  <path d="M38 80 Q38 50 70 50 L220 50 Q262 50 262 80" fill="#1d0e82" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Tinted window band -->
  <rect x="38" y="58" width="180" height="28" rx="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Front windshield -->
  <path d="M222 58 L258 62 L258 86 L222 86 Z" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Luggage bay doors -->
  <rect x="50" y="160" width="40" height="20" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="100" y="160" width="40" height="20" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="150" y="160" width="40" height="20" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="200" y="160" width="45" height="20" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Luggage bay divider line -->
  <line x1="28" y1="155" x2="262" y2="155" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Decorative stripe -->
  <rect x="28" y="130" width="234" height="8" rx="2" fill="#f7de58" stroke="none"/>
