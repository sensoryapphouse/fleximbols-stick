<path d="M 222 68 L 290 68 L 290 118 L 340 118 L 340 182 L 290 182 L 290 214 L 222 214 L 222 182 L 172 182 L 172 118 L 222 118 Z" fill="none" stroke="#5e5640" stroke-width="7" stroke-linejoin="round"/>
