  <circle cx="145" cy="185" r="20" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Hair hanging down (inverted) -->
  <path d="M 127,190 Q 128,205 145,206 Q 162,205 163,190" stroke="#5e1f0a" stroke-width="4.45" fill="none" stroke-linecap="round"/>
  <path d="M 127,190 Q 125,200 128,208 Q 132,215 145,216 Q 158,215 162,208 Q 165,200 163,190 Q 155,198 145,198 Q 135,198 127,190 Z" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="2.22" stroke-linejoin="round"/>
  <!-- Eyes wide / surprised/joyful inverted -->
  <circle cx="139" cy="183" r="2.5" fill="#000000"/>
  <circle cx="151" cy="183" r="2.5" fill="#000000"/>
  <!-- Smile (inverted smile on inverted face reads as expression) -->
  <path d="M 138,192 Q 145,188 152,192" stroke="#1a1a1a" stroke-width="2.78" fill="none" stroke-linecap="round"/>
