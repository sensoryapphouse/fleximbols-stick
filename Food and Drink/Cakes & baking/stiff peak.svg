  <path d="M210 144 L232 95 L246 144 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Whisk lifted to the right with peaked stiff cream stuck on it (peak straight up) -->
