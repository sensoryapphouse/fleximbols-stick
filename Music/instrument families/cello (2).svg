  <!-- C-bout waist right -->
  <path d="M 172,128 Q 162,124 158,136 Q 162,148 172,145"
    fill="#9d7246" stroke="#1a1a1a" stroke-width="5.93" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Edge purfling -->
  <path d="M 72,86 Q 58,102 62,118"
    fill="none" stroke="#5e1f0a" stroke-width="2.96" stroke-linecap="round"/>
  <path d="M 164,86 Q 178,102 174,118"
    fill="none" stroke="#5e1f0a" stroke-width="2.96" stroke-linecap="round"/>

  <!-- Left f-hole -->
  <path d="M 87,128 Q 83,136 85,144 Q 87,150 91,148 Q 89,154 87,162 Q 85,168 89,170"
    fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="88" cy="130" r="4.5" fill="#000000" stroke="none"/>
  <circle cx="88" cy="168" r="4.5" fill="#000000" stroke="none"/>
  <!-- Right f-hole -->
  <path d="M 149,128 Q 153,136 151,144 Q 149,150 145,148 Q 147,154 149,162 Q 151,168 147,170"
    fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="148" cy="130" r="4.5" fill="#000000" stroke="none"/>
  <circle cx="148" cy="168" r="4.5" fill="#000000" stroke="none"/>

