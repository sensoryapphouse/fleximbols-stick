  <polygon points="145,90 78,142 212,142" fill="#137827" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Lower branches more sparse -->
  <path d="M128 155 Q100 148 75 158" fill="none" stroke="#67832d" stroke-width="5.55" stroke-linecap="round"/>
  <path d="M162 155 Q190 148 215 158" fill="none" stroke="#67832d" stroke-width="5.55" stroke-linecap="round"/>
