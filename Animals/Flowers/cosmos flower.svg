  <line x1="108" y1="195" x2="103" y2="203" stroke="#529929" stroke-width="4.45" stroke-linecap="round"/>
  <!-- tiny leaf filaments -->
  <line x1="98" y1="187" x2="92" y2="183" stroke="#529929" stroke-width="2.22" stroke-linecap="round"/>
  <line x1="98" y1="187" x2="94" y2="191" stroke="#529929" stroke-width="2.22" stroke-linecap="round"/>
