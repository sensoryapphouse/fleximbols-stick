  <path d="M104 55 Q108 52 112 55" fill="none" stroke="#1a1a1a" stroke-width="2.22" stroke-linecap="round"/>
  <!-- Mouth slightly open (breathing) -->
  <ellipse cx="102" cy="66" rx="3" ry="4" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="2.22"/>
  <!-- Torso -->
  <path d="M80 78 L80 145 Q100 155 120 145 L120 78 Z" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
