  <rect x="118" y="82" width="54" height="88" rx="8" ry="8" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <rect x="126" y="90" width="38" height="50" rx="4" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Cracked screen line -->
  <line x1="130" y1="94" x2="158" y2="136" stroke="#f8130d" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Phone button -->
  <circle cx="145" cy="156" r="8" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45"/>
