<svg xmlns="http://www.w3.org/2000/svg" viewBox="93.17 59.04 352.97 352.97">
<!-- circuit loop with a break (open switch) and an UNLIT bulb -->
<!-- battery on left side -->
<rect x="120" y="232" width="44" height="48" rx="4" fill="#f4c430" stroke="#1a1a1a" stroke-width="8"/>
<line x1="142" y1="218" x2="142" y2="232" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
<!-- wires forming loop -->
<path d="M 142 232 L 142 140 L 372 140" fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
<path d="M 142 280 L 142 372 L 372 372" fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
<!-- right wire up to switch -->
<path d="M 372 372 L 372 296" fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
<!-- open switch: lever lifted, gap -->
<circle cx="372" cy="296" r="9" fill="#1a1a1a"/>
<circle cx="372" cy="220" r="9" fill="#1a1a1a"/>
<line x1="372" y1="296" x2="420" y2="244" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
<!-- wire from top switch terminal up to bulb -->
<path d="M 372 220 L 372 140" fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
<!-- unlit bulb at top middle -->
<circle cx="257" cy="140" r="40" fill="#b9bdc2" stroke="#1a1a1a" stroke-width="9"/>
<path d="M 240 174 L 274 174 L 270 194 L 244 194 Z" fill="#9aa0a6" stroke="#1a1a1a" stroke-width="7" stroke-linejoin="round"/>
</svg>
