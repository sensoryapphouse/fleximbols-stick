<ellipse cx="236" cy="276" rx="74" ry="58" fill="#f0ece2" stroke="none"/>
<!-- big curled rams horns (behind head, spiralling down beside face) -->
<path d="M 332 214 C 300 196 270 214 268 252 C 266 286 296 304 326 296" fill="none" stroke="#8a5a2b" stroke-width="15" stroke-linecap="round"/>
<path d="M 368 214 C 400 196 430 214 432 252 C 434 286 404 304 374 296" fill="none" stroke="#8a5a2b" stroke-width="15" stroke-linecap="round"/>
