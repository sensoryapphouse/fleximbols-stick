<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- rocks (old-fashioned) glass: short, thick, straight walls, heavy base -->
  <path d="M 90 60 L 200 60 L 195 200 L 95 200 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="10.16" stroke-linejoin="round"/>
  <!-- thick base highlight (heavy bottom) -->
  <rect x="95" y="185" width="100" height="15" fill="#efefef" stroke="#1a1a1a" stroke-width="6.35"/>
  <!-- amber whiskey liquid -->
  <path d="M 93 95 L 197 95 L 193 195 L 97 195 Z" fill="#ff9900" stroke="#1a1a1a" stroke-width="5.08"/>
  <!-- liquid surface -->
  <line x1="93" y1="95" x2="197" y2="95" stroke="#1a1a1a" stroke-width="5.08"/>
  <!-- darker amber tone overlay (using a brown to deepen the sazerac look) -->
  <path d="M 93 140 L 197 140 L 193 195 L 97 195 Z" fill="#7d5e23" stroke="#1a1a1a" stroke-width="3.81"/>
  <!-- large ice cube floating -->
  <rect x="120" y="100" width="35" height="35" fill="#dff3fd" stroke="#1a1a1a" stroke-width="6.35"/>
  <line x1="120" y1="108" x2="155" y2="108" stroke="#1a1a1a" stroke-width="3.81"/>
  <line x1="128" y1="100" x2="128" y2="135" stroke="#1a1a1a" stroke-width="3.81"/>
  <!-- lemon peel twist (curly spiral on top of liquid) -->
  <path d="M 165 70 Q 180 80 170 95 Q 158 105 168 118 Q 178 125 168 135" fill="none" stroke="#f2e40d" stroke-width="17.78" stroke-linecap="round"/>
  <path d="M 165 70 Q 180 80 170 95 Q 158 105 168 118 Q 178 125 168 135" fill="none" stroke="#1a1a1a" stroke-width="6.35" stroke-linecap="round"/>
  <!-- sugar cube on the side, beside the glass -->
  <rect x="215" y="170" width="28" height="28" fill="#ffffff" stroke="#1a1a1a" stroke-width="7.62" stroke-linejoin="round"/>
  <line x1="215" y1="178" x2="243" y2="178" stroke="#1a1a1a" stroke-width="3.81"/>
  <line x1="215" y1="188" x2="243" y2="188" stroke="#1a1a1a" stroke-width="3.81"/>
  <line x1="222" y1="170" x2="222" y2="198" stroke="#1a1a1a" stroke-width="3.81"/>
  <line x1="232" y1="170" x2="232" y2="198" stroke="#1a1a1a" stroke-width="3.81"/>
  <!-- sugar sparkle dot -->
  <circle cx="229" cy="184" r="2" fill="#fff200" stroke="#1a1a1a" stroke-width="2.54"/>
</g></svg>