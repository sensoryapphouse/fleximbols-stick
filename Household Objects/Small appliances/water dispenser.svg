  <!-- Freestanding floor water cooler with inverted bottle on top and two taps -->

  <!-- Body of cooler (lower cabinet) -->
  <rect x="85" y="130" width="120" height="85" rx="8" ry="8" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- Upper dispenser section -->
  <rect x="90" y="90" width="110" height="45" rx="6" ry="6" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- Bottle neck connector (collar) -->
  <rect x="120" y="68" width="50" height="26" rx="4" ry="4" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- Inverted large blue bottle on top -->
  <ellipse cx="145" cy="68" rx="25" ry="8" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <path d="M120 68 L115 30 Q115 22 145 22 Q175 22 175 30 L170 68 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <ellipse cx="145" cy="22" rx="30" ry="8" fill="#90a7d6" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- Water visible inside bottle -->
  <path d="M122 55 Q145 48 168 55 L170 68 Q145 65 120 68 Z" fill="#2a4ec0" stroke="none"/>

  <!-- Drip tray -->
  <rect x="88" y="168" width="114" height="8" rx="3" ry="3" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- Hot tap (red, left) -->
  <rect x="100" y="148" width="30" height="18" rx="5" ry="5" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="108" y="166" width="8" height="8" rx="2" ry="2" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- Cold tap (blue, right) -->
  <rect x="160" y="148" width="30" height="18" rx="5" ry="5" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="172" y="166" width="8" height="8" rx="2" ry="2" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- Cabinet door line -->
  <line x1="145" y1="185" x2="145" y2="210" stroke="#1a1a1a" stroke-width="3.55" stroke-linecap="round"/>

  <!-- Small door knob -->
  <circle cx="152" cy="198" r="5" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="3.55"/>
</g></svg>