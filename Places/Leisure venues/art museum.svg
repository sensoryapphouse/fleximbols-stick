  <polygon points="50,112 145,62 240,112" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <!-- 6 columns -->
  <rect x="44" y="112" width="18" height="88" rx="4" ry="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="80" y="112" width="18" height="88" rx="4" ry="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="116" y="112" width="18" height="88" rx="4" ry="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="156" y="112" width="18" height="88" rx="4" ry="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="192" y="112" width="18" height="88" rx="4" ry="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="228" y="112" width="18" height="88" rx="4" ry="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Column capitals (top flare) -->
  <rect x="40" y="112" width="26" height="6" rx="2" ry="2" fill="#efefef" stroke="#1a1a1a" stroke-width="2.22"/>
  <rect x="76" y="112" width="26" height="6" rx="2" ry="2" fill="#efefef" stroke="#1a1a1a" stroke-width="2.22"/>
  <rect x="112" y="112" width="26" height="6" rx="2" ry="2" fill="#efefef" stroke="#1a1a1a" stroke-width="2.22"/>
  <rect x="152" y="112" width="26" height="6" rx="2" ry="2" fill="#efefef" stroke="#1a1a1a" stroke-width="2.22"/>
  <rect x="188" y="112" width="26" height="6" rx="2" ry="2" fill="#efefef" stroke="#1a1a1a" stroke-width="2.22"/>
  <rect x="224" y="112" width="26" height="6" rx="2" ry="2" fill="#efefef" stroke="#1a1a1a" stroke-width="2.22"/>
  <!-- FRAMED PAINTING emblem centred on facade -->
  <!-- Frame outer -->
  <rect x="110" y="128" width="70" height="56" rx="4" ry="4" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
