<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Machine body (bedside box, slightly wider than CPAP) -->
  <rect x="20" y="75" width="155" height="108" rx="12" ry="12" fill="#e6b98a" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Front panel screen -->
  <rect x="32" y="90" width="72" height="48" rx="5" ry="5" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Screen shows two pressure wave arches to distinguish from CPAP -->
  <path d="M 38,114 Q 46,98 54,114 Q 62,130 70,114 Q 78,98 86,114" fill="none" stroke="#f7de58" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dual-pressure dial (key BiPAP differentiator) -->
  <circle cx="138" cy="105" r="18" fill="#efefef" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="138" cy="105" r="5" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.96" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Dial tick marks -->
  <line x1="138" y1="88" x2="138" y2="93" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="155" y1="105" x2="150" y2="105" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="138" y1="122" x2="138" y2="117" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="121" y1="105" x2="126" y2="105" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
  <!-- Dial pointer needle -->
  <line x1="138" y1="105" x2="148" y2="96" stroke="#f8130d" stroke-width="2.96" stroke-linecap="round"/>
  <!-- IPAP indicator: upward arrow (higher pressure) -->
  <line x1="116" y1="150" x2="116" y2="138" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <polyline points="112,142 116,138 120,142" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- EPAP indicator: downward arrow (lower pressure) -->
  <line x1="148" y1="138" x2="148" y2="150" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <polyline points="144,146 148,150 152,146" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hose port -->
  <rect x="172" y="120" width="18" height="22" rx="5" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Flexible hose -->
  <path d="M 190,131 Q 214,131 222,142 Q 230,154 244,154" fill="none" stroke="#7f7f7f" stroke-width="11.85" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Full-face mask (larger than CPAP nasal, covering nose+mouth area) -->
  <path d="M 244,136 Q 260,124 276,138 Q 282,160 262,174 Q 250,178 244,170 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Mask strap -->
  <line x1="262" y1="124" x2="272" y2="112" stroke="#b8b8b8" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="262" y1="174" x2="272" y2="186" stroke="#b8b8b8" stroke-width="4.45" stroke-linecap="round"/>
</g></svg>