  <!-- Reusable bottle: tall sturdy stainless steel water bottle with sport cap and carry loop -->
  <!-- Bottle body (tall narrow cylinder) -->
  <rect x="96" y="88" width="98" height="140" rx="14" ry="14" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Stainless sheen lines -->
  <line x1="108" y1="92" x2="108" y2="224" stroke="#efefef" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="116" y1="92" x2="116" y2="224" stroke="#efefef" stroke-width="2.96" stroke-linecap="round"/>
  <!-- Brand band / accent ring -->
  <rect x="96" y="152" width="98" height="18" rx="0" ry="0" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Shoulder (bottle narrows to neck) -->
  <path d="M96,88 L106,68 L184,68 L194,88 Z" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Neck -->
  <rect x="118" y="50" width="54" height="22" rx="8" ry="8" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Screw cap (sport cap, rounded top) -->
  <rect x="122" y="28" width="46" height="26" rx="10" ry="10" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Carry loop on top of cap -->
  <path d="M136,28 Q145,12 154,28" fill="none" stroke="#1a1a1a" stroke-width="7.40" stroke-linecap="round"/>
  <path d="M136,28 Q145,16 154,28" fill="none" stroke="#7f7f7f" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Cap thread lines -->
  <line x1="118" y1="56" x2="172" y2="56" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="118" y1="63" x2="172" y2="63" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
</g></svg>