  <!-- wire with curve and ammeter in line -->
  <!-- left wire segment -->
  <path d="M 20 120 L 90 120" fill="none" stroke="#5e1f0a" stroke-width="11.85" stroke-linecap="round"/>
  <path d="M 20 120 L 90 120" fill="none" stroke="#e65a00" stroke-width="5.93" stroke-linecap="round"/>
  <!-- ammeter circle in line -->
  <circle cx="145" cy="120" r="55" fill="#efefef" stroke="#1a1a1a" stroke-width="5.93"/>
  <!-- dial arc -->
  <path d="M 105 125 Q 145 75 185 125" fill="none" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- ticks -->
  <g stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round">
    <line x1="108" y1="125" x2="115" y2="128"/>
    <line x1="125" y1="100" x2="130" y2="105"/>
    <line x1="145" y1="85" x2="145" y2="93"/>
    <line x1="165" y1="100" x2="160" y2="105"/>
    <line x1="182" y1="125" x2="175" y2="128"/>
  </g>
  <!-- needle -->
  <line x1="145" y1="125" x2="160" y2="98" stroke="#d01424" stroke-width="5.93" stroke-linecap="round"/>
  <circle cx="145" cy="125" r="6" fill="#000000"/>
  <!-- right wire segment with arrow showing flow -->
  <path d="M 200 120 L 270 120" fill="none" stroke="#5e1f0a" stroke-width="11.85" stroke-linecap="round"/>
  <path d="M 200 120 L 270 120" fill="none" stroke="#e65a00" stroke-width="5.93" stroke-linecap="round"/>
  <!-- big flow arrow above wire -->
  <g stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round" fill="#fff200">
    <line x1="20" y1="60" x2="240" y2="60" stroke-width="7.40"/>
    <polygon points="230,48 230,72 260,60"/>
  </g>
  <!-- small electron dots on wire -->
  <circle cx="40" cy="120" r="5" fill="#fff200" stroke="#1a1a1a" stroke-width="2.96"/>
  <circle cx="65" cy="120" r="5" fill="#fff200" stroke="#1a1a1a" stroke-width="2.96"/>
  <circle cx="225" cy="120" r="5" fill="#fff200" stroke="#1a1a1a" stroke-width="2.96"/>
  <circle cx="250" cy="120" r="5" fill="#fff200" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- terminal nodes -->
  <circle cx="90" cy="120" r="6" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.96"/>
  <circle cx="200" cy="120" r="6" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.96"/>
