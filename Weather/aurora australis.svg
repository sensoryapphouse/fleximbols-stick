  <!-- aurora-australis: night sky with purple/pink curtain ribbons + curved horizon + star pattern -->
  <!-- Night sky panel - deeper dark -->
  <rect x="26" y="26" width="238" height="176" rx="6" fill="#392170" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Southern Cross star pattern (5 stars) -->
  <circle cx="205" cy="48" r="4" fill="#ffffff" stroke="none"/>
  <circle cx="220" cy="60" r="3" fill="#ffffff" stroke="none"/>
  <circle cx="200" cy="68" r="3" fill="#ffffff" stroke="none"/>
  <circle cx="215" cy="78" r="4" fill="#ffffff" stroke="none"/>
  <circle cx="228" cy="54" r="2" fill="#f4a4b2" stroke="none"/>
  <!-- Extra stars -->
  <circle cx="50" cy="42" r="2" fill="#ffffff" stroke="none"/>
  <circle cx="75" cy="52" r="3" fill="#ffffff" stroke="none"/>
  <circle cx="110" cy="38" r="2" fill="#ffffff" stroke="none"/>
  <circle cx="155" cy="44" r="2" fill="#ffffff" stroke="none"/>
  <circle cx="248" cy="72" r="2" fill="#ffffff" stroke="none"/>
  <!-- Aurora curtain ribbon 1 - purple/violet -->
  <polygon points="36,58 44,80 40,112 46,140 52,158 58,140 56,112 62,82 54,58" fill="#7c3fac" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Aurora curtain ribbon 2 - pink -->
  <polygon points="74,44 82,68 76,102 82,132 90,152 100,134 96,104 102,70 96,44" fill="#f266aa" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Aurora curtain ribbon 3 - deep purple, central -->
  <polygon points="110,36 118,62 112,96 118,128 128,152 140,130 134,98 140,64 132,36" fill="#392170" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Aurora curtain ribbon 4 - light pink -->
  <polygon points="150,40 157,65 151,100 156,130 164,152 176,132 170,102 176,66 168,40" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Aurora curtain ribbon 5 - purple -->
  <polygon points="188,46 196,70 190,104 196,134 204,154 214,134 210,104 216,72 208,48" fill="#7c3fac" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Aurora curtain ribbon 6 - pink rightmost -->
  <polygon points="226,54 234,76 228,110 234,140 240,158 248,140 244,110 250,80 242,54" fill="#f266aa" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Curved/southern horizon (arc instead of flat line) -->
  <path d="M26,180 Q145,165 264,180 L264,202 L26,202 Z" fill="#4d4d4d" stroke="none"/>
  <path d="M26,180 Q145,165 264,180" fill="none" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <!-- Ice shelf / snow on curved horizon -->
  <ellipse cx="90" cy="186" rx="38" ry="7" fill="#dff3fd" stroke="#1a1a1a" stroke-width="3.33"/>
  <ellipse cx="200" cy="188" rx="34" ry="6" fill="#dff3fd" stroke="#1a1a1a" stroke-width="3.33"/>
</g></svg>