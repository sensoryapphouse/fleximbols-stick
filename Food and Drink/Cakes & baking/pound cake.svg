  <line x1="243" y1="133" x2="262" y2="135" stroke="#f7de58" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="243" y1="145" x2="263" y2="147" stroke="#f7de58" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="243" y1="157" x2="263" y2="159" stroke="#f7de58" stroke-width="4.45" stroke-linecap="round"/>
