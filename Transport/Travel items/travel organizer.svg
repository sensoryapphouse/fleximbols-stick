  <!-- back cover of open zip-pouch -->
  <rect x="30" y="50" width="115" height="160" rx="10" fill="#7c3fac" stroke="#1a1a1a" stroke-width="8.89" stroke-linejoin="round"/>
  <!-- front cover (open, lying flat to the right) -->
  <rect x="145" y="50" width="115" height="160" rx="10" fill="#392170" stroke="#1a1a1a" stroke-width="8.89" stroke-linejoin="round"/>
  <!-- spine fold line -->
  <line x1="145" y1="50" x2="145" y2="210" stroke="#1a1a1a" stroke-width="6.67" stroke-linecap="round"/>
  <!-- zipper running around the perimeter (left side) -->
  <path d="M 35 55 L 35 205 L 140 205" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-dasharray="4,3"/>
  <path d="M 150 205 L 255 205 L 255 55 L 150 55" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-dasharray="4,3"/>
  <!-- zipper pull -->
  <rect x="248" y="100" width="14" height="10" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- LEFT SIDE: mesh pocket with cards -->
  <rect x="45" y="68" width="85" height="60" rx="4" fill="#dff3fd" stroke="#1a1a1a" stroke-width="5.56"/>
  <!-- mesh pattern crosshatch -->
  <g stroke="#90a7d6" stroke-width="2.67">
    <line x1="55" y1="68" x2="55" y2="128"/>
    <line x1="70" y1="68" x2="70" y2="128"/>
    <line x1="85" y1="68" x2="85" y2="128"/>
    <line x1="100" y1="68" x2="100" y2="128"/>
    <line x1="115" y1="68" x2="115" y2="128"/>
    <line x1="45" y1="80" x2="130" y2="80"/>
    <line x1="45" y1="95" x2="130" y2="95"/>
    <line x1="45" y1="110" x2="130" y2="110"/>
  </g>
  <rect x="45" y="68" width="85" height="60" rx="4" fill="none" stroke="#1a1a1a" stroke-width="5.56"/>
  <!-- credit cards in mesh pocket -->
  <rect x="52" y="78" width="40" height="26" rx="3" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="56" y="90" width="14" height="6" rx="1" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.33"/>
  <rect x="62" y="92" width="40" height="26" rx="3" fill="#529929" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- elastic strap on left side -->
  <rect x="45" y="145" width="85" height="10" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="45" y="165" width="85" height="10" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- RIGHT SIDE: passport in pocket -->
  <rect x="160" y="68" width="85" height="120" rx="4" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="5.56"/>
  <!-- passport -->
  <rect x="170" y="85" width="65" height="90" rx="3" fill="#137827" stroke="#1a1a1a" stroke-width="5.56"/>
  <!-- passport emblem circle -->
  <circle cx="202" cy="125" r="14" fill="none" stroke="#f7de58" stroke-width="5.56"/>
  <circle cx="202" cy="125" r="6" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- passport stripe at top -->
  <line x1="178" y1="100" x2="228" y2="100" stroke="#f7de58" stroke-width="4.45"/>
  <line x1="185" y1="158" x2="220" y2="158" stroke="#f7de58" stroke-width="4.45"/>
</g></svg>