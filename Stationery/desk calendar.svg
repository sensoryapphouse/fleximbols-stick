  <rect x="96" y="148" width="20" height="14" rx="2" ry="2" fill="#efefef" stroke="#b8b8b8" stroke-width="4.45"/>
  <rect x="122" y="148" width="20" height="14" rx="2" ry="2" fill="#efefef" stroke="#b8b8b8" stroke-width="4.45"/>
  <rect x="148" y="148" width="20" height="14" rx="2" ry="2" fill="#efefef" stroke="#b8b8b8" stroke-width="4.45"/>
  <rect x="174" y="148" width="20" height="14" rx="2" ry="2" fill="#efefef" stroke="#b8b8b8" stroke-width="4.45"/>
