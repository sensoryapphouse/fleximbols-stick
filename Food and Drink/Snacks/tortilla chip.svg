  <!-- Single triangular pale-yellow corn tortilla chip -->
  <!-- Main chip body - isoceles triangle, large and centered -->
  <polygon points="145,35 40,205 250,205" fill="#f7de58" stroke="#1a1a1a" stroke-width="13.34" stroke-linejoin="round"/>
  <!-- Inner surface color for depth -->
  <polygon points="145,55 58,195 232,195" fill="#f2e40d" stroke="none"/>
  <!-- Corn texture lines - grain of the chip -->
  <line x1="90" y1="155" x2="145" y2="55" stroke="#9d7246" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="200" y1="155" x2="145" y2="55" stroke="#9d7246" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="78" y1="175" x2="212" y2="175" stroke="#9d7246" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="95" y1="150" x2="197" y2="150" stroke="#9d7246" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="110" y1="125" x2="180" y2="125" stroke="#9d7246" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="124" y1="100" x2="167" y2="100" stroke="#9d7246" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Toasted/golden spots on chip surface -->
  <ellipse cx="120" cy="165" rx="12" ry="8" fill="#ff9900" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="170" cy="160" rx="10" ry="7" fill="#e65a00" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="145" cy="140" rx="8" ry="6" fill="#ff9900" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Salt crystals -->
  <circle cx="100" cy="180" r="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.22"/>
  <circle cx="160" cy="180" r="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.22"/>
  <circle cx="130" cy="170" r="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.22"/>
  <circle cx="152" cy="120" r="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.22"/>
</g></svg>