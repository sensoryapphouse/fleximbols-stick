  <!-- Barn roof (gambrel) -->
  <path d="M30 100 L60 70 L60 50 L160 50 L160 70 L190 100 Z" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- Hay loft door -->
  <rect x="96" y="62" width="28" height="28" fill="#9d7246" stroke="#1a1a1a" stroke-width="5.56" stroke-linejoin="round"/>
