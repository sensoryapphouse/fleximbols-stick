  <path d="M70 150 Q70 175 80 195 L210 195 Q220 175 220 150" fill="#f8130d" stroke="#1a1a1a" stroke-width="5.33" stroke-linejoin="round"/>
  <!-- Gold trim on body -->
  <path d="M75 170 L215 170" stroke="#f7de58" stroke-width="7.11" stroke-linecap="round"/>
  <!-- Performer 1 legs (left) -->
  <rect x="92" y="195" width="14" height="35" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="112" y="195" width="14" height="35" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Performer 1 shoes -->
  <ellipse cx="99" cy="232" rx="10" ry="5" fill="#000000" stroke="#1a1a1a" stroke-width="3.56"/>
  <ellipse cx="119" cy="232" rx="10" ry="5" fill="#000000" stroke="#1a1a1a" stroke-width="3.56"/>
  <!-- Performer 2 legs (right) -->
  <rect x="164" y="195" width="14" height="35" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="184" y="195" width="14" height="35" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Performer 2 shoes -->
