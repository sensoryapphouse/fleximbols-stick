  <!-- sky with sunrise gradient feel via flat colour -->
  <rect x="0" y="0" width="290" height="170" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- sun rising -->
  <circle cx="145" cy="150" r="32" fill="#ff9900" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- sun rays -->
  <path d="M145 100 L145 85 M180 115 L192 105 M110 115 L98 105 M85 150 L70 150 M205 150 L220 150" stroke="#e65a00" stroke-width="4.45" stroke-linecap="round"/>
  <!-- grass ground -->
  <rect x="0" y="170" width="290" height="70" fill="#67832d" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- back stone (smaller, in circle behind) -->
  <rect x="135" y="135" width="20" height="50" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- far left/right back stones -->
  <rect x="55" y="145" width="18" height="45" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="217" y="145" width="18" height="45" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- front trilithon: left upright -->
  <rect x="78" y="130" width="24" height="80" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- front trilithon: right upright -->
  <rect x="188" y="130" width="24" height="80" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- front trilithon: lintel -->
  <rect x="70" y="115" width="150" height="20" fill="#9d7246" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- middle trilithon (smaller, behind) -->
  <rect x="118" y="145" width="18" height="60" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="154" y="145" width="18" height="60" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="113" y="135" width="64" height="14" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
