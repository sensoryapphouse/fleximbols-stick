  <!-- Ice maker machine with ice cubes falling into a bin/glass -->

  <!-- Machine body -->
  <rect x="60" y="25" width="170" height="120" rx="10" ry="10" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>

  <!-- Machine front panel -->
  <rect x="72" y="37" width="146" height="96" rx="6" ry="6" fill="#efefef" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>

  <!-- Ice dispense slot at bottom of machine -->
  <rect x="110" y="118" width="70" height="12" rx="4" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>

  <!-- Control button (blue) -->
  <circle cx="185" cy="70" r="14" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Indicator light (green) -->
  <circle cx="185" cy="100" r="7" fill="#529929" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Ice display window on panel -->
  <rect x="82" y="47" width="80" height="55" rx="4" ry="4" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Ice cubes inside machine visible through window -->
  <rect x="88" y="53" width="20" height="20" rx="3" ry="3" fill="#90a7d6" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <rect x="114" y="53" width="20" height="20" rx="3" ry="3" fill="#90a7d6" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <rect x="88" y="78" width="20" height="18" rx="3" ry="3" fill="#90a7d6" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <rect x="114" y="78" width="20" height="18" rx="3" ry="3" fill="#90a7d6" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>

  <!-- Falling ice cubes -->
  <rect x="118" y="135" width="18" height="18" rx="3" ry="3" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="142" y="142" width="16" height="16" rx="3" ry="3" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

