  <path d="M180 50 Q200 55 215 70" fill="none" stroke="#1a1a1a" stroke-width="3.56" stroke-linecap="round"/>
  <!-- Forehead jewel/horn -->
  <circle cx="145" cy="55" r="10" fill="#f2e40d" stroke="#1a1a1a" stroke-width="4.45"/>
  <path d="M145 45 L150 55 L145 65 L140 55 Z" fill="#f8130d" stroke="#1a1a1a" stroke-width="3.56"/>
  <!-- Eyes (big round bulging) -->
  <circle cx="115" cy="90" r="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.33"/>
  <circle cx="115" cy="92" r="8" fill="#000000"/>
  <circle cx="175" cy="90" r="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.33"/>
  <circle cx="175" cy="92" r="8" fill="#000000"/>
  <!-- Eyebrows (white furry) -->
  <path d="M100 75 Q115 68 130 75" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <path d="M160 75 Q175 68 190 75" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Nose -->
  <path d="M138 115 Q145 122 152 115 Q150 125 145 128 Q140 125 138 115 Z" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Mouth (big open) -->
  <path d="M110 135 Q145 160 180 135 Q180 150 145 155 Q110 150 110 135 Z" fill="#392170" stroke="#1a1a1a" stroke-width="5.33"/>
  <!-- Teeth -->
  <path d="M120 140 L125 148 L130 140 L135 148 L140 140 L145 148 L150 140 L155 148 L160 140 L165 148 L170 140" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.56" stroke-linejoin="round"/>
  <!-- Ears -->
  <ellipse cx="75" cy="80" rx="12" ry="16" fill="#d01424" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="215" cy="80" rx="12" ry="16" fill="#d01424" stroke="#1a1a1a" stroke-width="4.45"/>
