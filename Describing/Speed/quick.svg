<line x1="284" y1="308" x2="322" y2="282" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
<line x1="306" y1="326" x2="344" y2="300" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
<!-- forward arrow -->
<path d="M 364.0 170.0 L 468.0 170.0 L 468.0 182.0 L 500.0 160.0 L 468.0 138.0 L 468.0 150.0 L 364.0 150.0 Z" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
</svg>
