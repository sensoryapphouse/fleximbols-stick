  <ellipse cx="232" cy="58" rx="16" ry="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="252" cy="50" rx="12" ry="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="266" cy="44" rx="10" ry="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.33"/>
