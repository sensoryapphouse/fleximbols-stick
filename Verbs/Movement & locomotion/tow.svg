  <polygon points="5,125 15,125 10,110" fill="#f8130d" stroke="#f8130d" stroke-width="1.97" stroke-linejoin="round"/>
  <line x1="10" y1="140" x2="10" y2="125" stroke="#f8130d" stroke-width="3.95" stroke-linecap="round"/>
