<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Body fat scale: flat square scale with body silhouette + fat % indicator on display -->
  <!-- Scale platform -->
  <rect x="30" y="85" width="230" height="140" rx="18" ry="18" fill="#efefef" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Scale edge depth -->
  <rect x="30" y="205" width="230" height="12" rx="8" ry="8" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Digital display screen area -->
  <rect x="65" y="98" width="160" height="70" rx="7" ry="7" fill="#1d0e82" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Human body silhouette (simple torso+legs icon) on left side of display -->
  <!-- Head -->
  <circle cx="98" cy="112" r="7" fill="#eed5b6" stroke="#eed5b6" stroke-width="1.48"/>
  <!-- Torso -->
  <rect x="91" y="120" width="14" height="18" rx="3" ry="3" fill="#eed5b6"/>
  <!-- Body fat overlay (slightly wider, showing fat layer) -->
  <rect x="88" y="120" width="18" height="18" rx="4" ry="4" fill="none" stroke="#f7de58" stroke-width="3.70"/>
  <!-- Legs -->
  <rect x="91" y="137" width="5" height="14" rx="2" ry="2" fill="#eed5b6"/>
  <rect x="98" y="137" width="5" height="14" rx="2" ry="2" fill="#eed5b6"/>
  <!-- Fat percentage reading on right side of display -->
  <!-- "18%" in simplified segments -->
  <rect x="116" y="108" width="6" height="3" rx="1" ry="1" fill="#fff200"/>
  <rect x="116" y="118" width="6" height="3" rx="1" ry="1" fill="#fff200"/>
  <rect x="112" y="109" width="4" height="9" rx="1" ry="1" fill="#fff200"/>
  <rect x="112" y="119" width="4" height="9" rx="1" ry="1" fill="#fff200"/>
  <rect x="122" y="109" width="4" height="9" rx="1" ry="1" fill="#fff200"/>
  <rect x="122" y="119" width="4" height="9" rx="1" ry="1" fill="#fff200"/>
  <!-- 8 -->
  <rect x="130" y="108" width="6" height="3" rx="1" ry="1" fill="#fff200"/>
  <rect x="130" y="118" width="6" height="3" rx="1" ry="1" fill="#fff200"/>
  <rect x="130" y="128" width="6" height="3" rx="1" ry="1" fill="#fff200"/>
  <rect x="126" y="109" width="4" height="9" rx="1" ry="1" fill="#fff200"/>
  <rect x="136" y="109" width="4" height="9" rx="1" ry="1" fill="#fff200"/>
  <rect x="126" y="119" width="4" height="9" rx="1" ry="1" fill="#fff200"/>
  <rect x="136" y="119" width="4" height="9" rx="1" ry="1" fill="#fff200"/>
  <!-- % symbol -->
  <circle cx="147" cy="112" r="3" fill="none" stroke="#fff200" stroke-width="2.96"/>
  <line x1="143" y1="128" x2="151" y2="108" stroke="#fff200" stroke-width="3.70"/>
  <circle cx="149" cy="126" r="3" fill="none" stroke="#fff200" stroke-width="2.96"/>
  <!-- "BODY FAT" label below digits -->
  <rect x="112" y="134" width="44" height="6" rx="2" ry="2" fill="#3aa6a0"/>
  <!-- Electrode pads on scale surface (for bioimpedance measurement) -->
  <ellipse cx="100" cy="190" rx="22" ry="10" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.19"/>
  <ellipse cx="190" cy="190" rx="22" ry="10" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.19"/>
</g></svg>