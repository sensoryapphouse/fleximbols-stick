  <rect x="142" y="190" width="22" height="18" fill="#1d0e82" stroke="#1a1a1a" stroke-width="2.96"/>
  <rect x="172" y="190" width="22" height="18" fill="#1d0e82" stroke="#1a1a1a" stroke-width="2.96"/>
