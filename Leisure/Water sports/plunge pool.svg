  <rect x="120" y="54" width="22" height="14" rx="3" fill="#dff3fd" stroke="#90a7d6" stroke-width="3.33"/>
  <rect x="162" y="58" width="16" height="11" rx="3" fill="#dff3fd" stroke="#90a7d6" stroke-width="3.33"/>
  <rect x="108" y="68" width="14" height="10" rx="2" fill="#dff3fd" stroke="#90a7d6" stroke-width="3.33"/>
  <rect x="150" y="65" width="18" height="10" rx="2" fill="#dff3fd" stroke="#90a7d6" stroke-width="3.33"/>
  <!-- Step/ladder entry right side -->
  <rect x="210" y="50" width="10" height="115" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="210" y1="75" x2="220" y2="75" stroke="#7f7f7f" stroke-width="6.67" stroke-linecap="round"/>
  <line x1="210" y1="95" x2="220" y2="95" stroke="#7f7f7f" stroke-width="6.67" stroke-linecap="round"/>
  <line x1="210" y1="115" x2="220" y2="115" stroke="#7f7f7f" stroke-width="6.67" stroke-linecap="round"/>
  <line x1="210" y1="135" x2="220" y2="135" stroke="#7f7f7f" stroke-width="6.67" stroke-linecap="round"/>
  <!-- Depth indicator marks on wall -->
  <line x1="70" y1="110" x2="80" y2="110" stroke="#dff3fd" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="70" y1="145" x2="80" y2="145" stroke="#dff3fd" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="70" y1="180" x2="80" y2="180" stroke="#dff3fd" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Thermometer icon top-left deck -->
  <rect x="53" y="35" width="6" height="22" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.33"/>
  <circle cx="56" cy="57" r="5" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="3.33"/>
