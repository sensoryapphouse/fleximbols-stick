  <rect x="35" y="131" width="18" height="22" rx="2" fill="#90a7d6" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Ground line -->
  <line x1="18" y1="223" x2="272" y2="223" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <!-- Escape staircase structure: vertical rails -->
