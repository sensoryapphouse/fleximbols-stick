<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Voltage converter: transformer brick + cable + step-up/down dial/switch -->
  <!-- Power cable coming out left side, going to a small plug -->
  <line x1="25" y1="148" x2="78" y2="148" stroke="#4d4d4d" stroke-width="7.40" stroke-linecap="round"/>
  <!-- Plug head (wall plug, two-pin EU) -->
  <rect x="22" y="136" width="18" height="24" rx="5" fill="#efefef" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <ellipse cx="28" cy="143" rx="3" ry="5" fill="#000000"/>
  <ellipse cx="34" cy="143" rx="3" ry="5" fill="#000000"/>

  <!-- Main transformer brick body -->
  <rect x="78" y="90" width="134" height="110" rx="12" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>

  <!-- Ventilation slots on top face -->
  <line x1="100" y1="100" x2="100" y2="116" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="114" y1="100" x2="114" y2="116" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="128" y1="100" x2="128" y2="116" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="142" y1="100" x2="142" y2="116" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Voltage selector dial (rotary switch) -->
  <circle cx="122" cy="152" r="30" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="7.40"/>
  <circle cx="122" cy="152" r="20" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.93"/>
  <!-- Dial notch/indicator -->
  <rect x="120" y="134" width="5" height="14" rx="2" fill="#f8130d" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- Tick marks around dial -->
  <line x1="122" y1="122" x2="122" y2="128" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="152" y1="152" x2="146" y2="152" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="138" y1="127" x2="134" y2="132" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="107" y1="127" x2="111" y2="132" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="93" y1="152" x2="99" y2="152" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Step-up / step-down toggle switch -->
  <rect x="163" y="135" width="34" height="20" rx="5" fill="#efefef" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Switch lever left position -->
  <rect x="165" y="137" width="14" height="16" rx="4" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Output socket on right face -->
  <rect x="214" y="130" width="20" height="34" rx="5" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <ellipse cx="224" cy="140" rx="4" ry="5" fill="#000000"/>
  <ellipse cx="224" cy="153" rx="4" ry="5" fill="#000000"/>

  <!-- Output cable -->
  <path d="M234 147 Q258 147 265 130 Q268 118 258 108" fill="none" stroke="#4d4d4d" stroke-width="7.40" stroke-linecap="round"/>
  <!-- Small output plug -->
  <rect x="248" y="96" width="16" height="20" rx="5" fill="#efefef" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <ellipse cx="253" cy="103" rx="2" ry="4" fill="#000000"/>
  <ellipse cx="259" cy="103" rx="2" ry="4" fill="#000000"/>
</g></svg>