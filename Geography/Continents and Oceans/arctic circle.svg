<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- pale arctic sky -->
  <rect x="0" y="0" width="290" height="130" fill="#dff3fd" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- snow ground -->
  <rect x="0" y="125" width="290" height="115" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- globe pole / arctic dome with circle line -->
  <!-- the polar circle as a dashed ring around the top -->
  <ellipse cx="145" cy="120" rx="125" ry="35" fill="none" stroke="#1d0e82" stroke-width="4.45" stroke-dasharray="8,5"/>
  <!-- iceberg back -->
  <path d="M30,150 L60,110 L90,150 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <path d="M210,155 L240,115 L270,155 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- polar bear body -->
  <ellipse cx="145" cy="195" rx="55" ry="28" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- polar bear head -->
  <circle cx="200" cy="175" r="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- ears -->
  <circle cx="188" cy="160" r="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.70"/>
  <circle cx="210" cy="160" r="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.70"/>
  <!-- eye -->
  <circle cx="210" cy="172" r="2" fill="#000000"/>
  <!-- snout/nose -->
  <ellipse cx="218" cy="183" rx="6" ry="4" fill="#efefef" stroke="#1a1a1a" stroke-width="2.96"/>
  <circle cx="222" cy="183" r="2" fill="#000000"/>
  <!-- mouth -->
  <path d="M217,188 C219,190 222,190 224,188" stroke="#1a1a1a" stroke-width="2.96" fill="none" stroke-linecap="round"/>
  <!-- legs -->
  <rect x="105" y="210" width="14" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="130" y="210" width="14" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="155" y="210" width="14" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="180" y="210" width="14" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- tail -->
  <circle cx="92" cy="185" r="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.70"/>
</g></svg>