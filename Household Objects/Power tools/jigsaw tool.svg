  <line x1="172" y1="116" x2="172" y2="120" stroke="#1a1a1a" stroke-width="3.42" stroke-linecap="round"/>
  <!-- Blade clamp detail at base -->
  <rect x="133" y="180" width="20" height="8" rx="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.10"/>
</g></svg>