  <!-- Transgender symbol: circle + Mars arrow (upper-right) + Venus cross (bottom) + hybrid cross-arrow (upper-left) -->
  <!-- Central circle -->
  <circle cx="145" cy="118" r="38" fill="none" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Venus stem down -->
  <line x1="145" y1="156" x2="145" y2="180" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Venus cross -->
  <line x1="128" y1="172" x2="162" y2="172" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Mars arrow upper-right -->
