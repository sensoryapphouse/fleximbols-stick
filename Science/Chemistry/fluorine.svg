  <!-- toothpaste tube (horizontal, lying on its side) -->
  <!-- tube body -->
  <rect x="40" y="100" width="150" height="60" rx="10" ry="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- tube colour band/stripe -->
  <rect x="60" y="100" width="110" height="20" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- crimped (sealed) end on left -->
  <path d="M40 100 L25 90 L25 170 L40 160 Z" fill="#efefef" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- crimp ridges -->
  <path d="M30 100 L30 160" fill="none" stroke="#1a1a1a" stroke-width="2.96"/>
  <path d="M35 100 L35 160" fill="none" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- neck of tube on right -->
  <rect x="190" y="115" width="18" height="30" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- cap -->
  <rect x="208" y="108" width="20" height="44" rx="3" ry="3" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- paste being squeezed out at the cap top, curling -->
  <path d="M228 130 Q 250 130 252 110 Q 254 90 235 88 Q 218 86 218 70 Q 220 55 240 55" fill="none" stroke="#3aa6a0" stroke-width="20.73" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M228 130 Q 250 130 252 110 Q 254 90 235 88 Q 218 86 218 70 Q 220 55 240 55" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- toothbrush below, angled -->
  <!-- handle -->
  <rect x="55" y="185" width="130" height="18" rx="4" ry="4" fill="#f266aa" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- brush head -->
  <rect x="180" y="180" width="45" height="28" rx="4" ry="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- bristles -->
  <path d="M185 180 L185 170" fill="none" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
  <path d="M193 180 L193 168" fill="none" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
  <path d="M201 180 L201 170" fill="none" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
  <path d="M209 180 L209 168" fill="none" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
  <path d="M217 180 L217 170" fill="none" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
</g></svg>