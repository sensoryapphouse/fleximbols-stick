  <rect x="25" y="100" width="110" height="40" rx="6" fill="#2a4ec0" stroke="none"/>
  <!-- Waveform bars (varying heights, centred on y=120) -->
  <rect x="36"  y="112" width="6" height="16" rx="2" fill="#ffffff" stroke="none"/>
  <rect x="46"  y="107" width="6" height="26" rx="2" fill="#ffffff" stroke="none"/>
  <rect x="56"  y="110" width="6" height="20" rx="2" fill="#ffffff" stroke="none"/>
  <rect x="66"  y="104" width="6" height="32" rx="2" fill="#ffffff" stroke="none"/>
