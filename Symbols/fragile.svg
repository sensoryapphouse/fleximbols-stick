  <!-- Teacup body -->
  <path d="M85,90 L100,185 Q145,198 190,185 L205,90 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Cup rim -->
  <ellipse cx="145" cy="90" rx="60" ry="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Saucer -->
  <ellipse cx="145" cy="192" rx="72" ry="16" fill="#efefef" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Handle -->
  <path d="M205,110 Q238,110 238,145 Q238,178 205,175" fill="none" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <!-- Crack: main jagged line on cup -->
  <polyline points="145,95 138,120 150,130 135,158 142,178" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Crack branch 1 -->
  <polyline points="138,120 125,112" fill="none" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Crack branch 2 -->
  <polyline points="150,130 162,126" fill="none" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Crack branch 3 -->
  <polyline points="135,158 120,162" fill="none" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>

