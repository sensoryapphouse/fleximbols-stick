<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Shallow cylindrical drum on tripod stand, snare wires across bottom, crossed sticks on top -->

  <!-- Tripod stand legs -->
  <line x1="95" y1="225" x2="112" y2="185" stroke="#4d4d4d" stroke-width="7.40" stroke-linecap="round"/>
  <line x1="195" y1="225" x2="178" y2="185" stroke="#4d4d4d" stroke-width="7.40" stroke-linecap="round"/>
  <line x1="145" y1="228" x2="145" y2="185" stroke="#4d4d4d" stroke-width="7.40" stroke-linecap="round"/>

  <!-- Stand basket (holding the drum) - two curved arms -->
  <line x1="112" y1="185" x2="115" y2="162" stroke="#7f7f7f" stroke-width="5.93" stroke-linecap="round"/>
  <line x1="178" y1="185" x2="175" y2="162" stroke="#7f7f7f" stroke-width="5.93" stroke-linecap="round"/>

  <!-- Drum shell (shallow cylinder) - side view -->
  <rect x="75" y="148" width="140" height="38" rx="4" fill="#efefef" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Drum shell stripes / lug casings -->
  <rect x="85" y="148" width="10" height="38" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="108" y="148" width="10" height="38" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="132" y="148" width="10" height="38" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="156" y="148" width="10" height="38" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="179" y="148" width="10" height="38" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- Top head (batter head) -->
  <ellipse cx="145" cy="150" rx="70" ry="13" fill="#ffffff" stroke="#1a1a1a" stroke-width="7.40"/>
  <!-- Top head hoop -->
  <ellipse cx="145" cy="150" rx="70" ry="13" fill="none" stroke="#4d4d4d" stroke-width="4.45"/>

  <!-- Bottom head -->
  <ellipse cx="145" cy="185" rx="70" ry="13" fill="#ffffff" stroke="#1a1a1a" stroke-width="7.40"/>

  <!-- Snare wires across bottom head -->
  <line x1="88" y1="185" x2="202" y2="185" stroke="#b8b8b8" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="88" y1="181" x2="202" y2="181" stroke="#b8b8b8" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="88" y1="189" x2="202" y2="189" stroke="#b8b8b8" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="88" y1="177" x2="202" y2="177" stroke="#b8b8b8" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="88" y1="193" x2="202" y2="193" stroke="#b8b8b8" stroke-width="2.96" stroke-linecap="round"/>
  <!-- Snare strainer (side adjuster) -->
  <rect x="200" y="178" width="18" height="14" rx="3" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- Two crossed drumsticks on top -->
  <!-- Stick 1 (lower-left to upper-right) -->
  <line x1="90" y1="130" x2="200" y2="108" stroke="#9d7246" stroke-width="11.85" stroke-linecap="round"/>
  <!-- Stick 1 tip -->
  <circle cx="200" cy="107" r="6" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Stick 2 (upper-left to lower-right) -->
  <line x1="90" y1="108" x2="200" y2="130" stroke="#9d7246" stroke-width="11.85" stroke-linecap="round"/>
  <!-- Stick 2 tip -->
  <circle cx="90" cy="107" r="6" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.45"/>
</g></svg>