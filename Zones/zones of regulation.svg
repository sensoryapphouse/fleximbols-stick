  <circle cx="82" cy="68" r="32" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="72" cy="62" r="3" fill="#000000"/>
  <circle cx="92" cy="62" r="3" fill="#000000"/>
  <path d="M 70 82 Q 82 74 94 82" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- tear -->
  <path d="M 72 70 Q 70 78 74 80 Q 78 78 76 70 Z" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="2.67"/>
  <!-- GREEN zone face: happy/calm -->
  <circle cx="207" cy="68" r="32" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="197" cy="62" r="3" fill="#000000"/>
  <circle cx="217" cy="62" r="3" fill="#000000"/>
  <path d="M 195 75 Q 207 88 219 75" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- YELLOW zone face: worried -->
