<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Dark sky during solar eclipse -->
  <rect x="26" y="20" width="238" height="200" rx="10" fill="#1d0e82" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Corona rays (outermost glow ring — irregular spike rays) -->
  <!-- Long corona spikes radiating outward from centre (145,120) -->
  <line x1="145" y1="50" x2="145" y2="28" stroke="#f7de58" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="170" y1="53" x2="183" y2="34" stroke="#f7de58" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="191" y1="67" x2="210" y2="53" stroke="#f7de58" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="200" y1="92" x2="222" y2="84" stroke="#f7de58" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="200" y1="120" x2="225" y2="120" stroke="#f7de58" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="191" y1="148" x2="212" y2="158" stroke="#f7de58" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="170" y1="167" x2="183" y2="186" stroke="#f7de58" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="145" y1="175" x2="145" y2="198" stroke="#f7de58" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="120" y1="167" x2="107" y2="186" stroke="#f7de58" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="99" y1="148" x2="78" y2="158" stroke="#f7de58" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="90" y1="120" x2="65" y2="120" stroke="#f7de58" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="99" y1="92" x2="78" y2="84" stroke="#f7de58" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="120" y1="67" x2="107" y2="50" stroke="#f7de58" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Outer corona halo ring -->
  <circle cx="145" cy="120" r="78" fill="none" stroke="#f7de58" stroke-width="15.55"/>
  <circle cx="145" cy="120" r="78" fill="none" stroke="#fff200" stroke-width="6.66"/>
  <!-- Mid corona ring -->
  <circle cx="145" cy="120" r="62" fill="#ff9900" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Sun body (partially visible) — warm yellow ring -->
  <circle cx="145" cy="120" r="56" fill="#f7de58" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Moon disc (dark) passing in front -->
  <circle cx="145" cy="120" r="52" fill="#000000" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Thin bright corona inner edge -->
  <circle cx="145" cy="120" r="52" fill="none" stroke="#f7de58" stroke-width="3.33"/>
  <!-- Stars visible during totality -->
  <circle cx="55" cy="48" r="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.22"/>
  <circle cx="240" cy="55" r="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.22"/>
  <circle cx="58" cy="188" r="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.22"/>
  <circle cx="238" cy="185" r="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.22"/>
</g></svg>