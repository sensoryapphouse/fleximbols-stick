  <rect x="210" y="131" width="40" height="36" fill="#7c3fac" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Granny-square centre motifs: small diamond + dot in each cell -->
  <g stroke="#1a1a1a" stroke-width="2.96" stroke-linejoin="round">
    <polygon points="48,103 56,113 48,123 40,113" fill="#ffffff"/>
    <polygon points="84,103 92,113 84,123 76,113" fill="#ffffff"/>
