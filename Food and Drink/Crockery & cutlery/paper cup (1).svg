  <!-- Paper cup: disposable coffee cup with lid and sleeve -->
  <!-- Cup body (tapered, wider at top) -->
  <path d="M88,200 L98,95 L192,95 L202,200 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.94" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Sleeve (corrugated band around middle) -->
  <path d="M93,160 L96,120 L194,120 L197,160 Z" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.94" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Sleeve texture lines -->
  <line x1="115" y1="122" x2="113" y2="158" stroke="#7d5e23" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="135" y1="121" x2="133" y2="159" stroke="#7d5e23" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="155" y1="121" x2="155" y2="159" stroke="#7d5e23" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="175" y1="122" x2="177" y2="158" stroke="#7d5e23" stroke-width="2.96" stroke-linecap="round"/>
  <!-- Cup outline on top of sleeve -->
  <path d="M88,200 L98,95 L192,95 L202,200 Z" fill="none" stroke="#1a1a1a" stroke-width="4.94" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Base ellipse -->
  <ellipse cx="145" cy="200" rx="57" ry="10" fill="#efefef" stroke="#1a1a1a" stroke-width="4.94"/>
  <!-- Lid body -->
  <path d="M92,95 Q92,78 145,78 Q198,78 198,95 Z" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.94" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Lid rim -->
  <ellipse cx="145" cy="95" rx="53" ry="9" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.94"/>
  <!-- Lid drink spout -->
  <rect x="128" y="70" width="34" height="14" rx="7" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="3.95" stroke-linejoin="round"/>
  <!-- Spout opening slit -->
  <line x1="136" y1="77" x2="154" y2="77" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
</g></svg>