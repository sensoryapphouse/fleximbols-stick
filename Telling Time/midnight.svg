  <rect x="26" y="8" width="238" height="224" rx="14" fill="#1d0e82" stroke="#1a1a1a" stroke-width="11.11"/>
  <!-- Crescent moon -->
  <circle cx="145" cy="52" r="32" fill="#f7de58" stroke="#1a1a1a" stroke-width="11.11"/>
  <circle cx="160" cy="42" r="28" fill="#1d0e82" stroke="none"/>
  <!-- Stars scattered -->
  <polygon points="88,28 90,34 96,34 91,38 93,44 88,40 83,44 85,38 80,34 86,34" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polygon points="206,18 208,24 214,24 209,28 211,34 206,30 201,34 203,28 198,24 204,24" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polygon points="56,62 57,67 62,67 58,70 60,75 56,72 52,75 54,70 50,67 55,67" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polygon points="235,54 236,59 241,59 237,62 239,67 235,64 231,67 233,62 229,59 234,59" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Clock face -->
  <circle cx="145" cy="170" r="62" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="11.11"/>
  <circle cx="145" cy="170" r="52" fill="#2a4ec0" stroke="none"/>
  <!-- Hour markers bright -->
  <rect x="142" y="122" width="6" height="12" rx="3" fill="#dff3fd"/>
  <rect x="142" y="202" width="6" height="12" rx="3" fill="#dff3fd"/>
  <rect x="88" y="167" width="12" height="6" rx="3" fill="#dff3fd"/>
  <rect x="191" y="167" width="12" height="6" rx="3" fill="#dff3fd"/>
  <!-- Both hands straight up — 12:00 midnight -->
  <rect x="141" y="122" width="8" height="48" rx="4" fill="#ffffff"/>
  <rect x="143" y="122" width="4" height="48" rx="2" fill="#ffffff"/>
  <!-- Centre -->
