  <circle cx="145" cy="119" r="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.93"/>
  <circle cx="135" cy="108" r="8" fill="#efefef" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- right ball: green (matcha) -->
