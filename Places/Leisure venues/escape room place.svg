  <path d="M130,120 L130,104 Q145,90 160,104 L160,120" fill="none" stroke="#f7de58" stroke-width="11.85" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M130,120 L130,104 Q145,90 160,104 L160,120" fill="none" stroke="#1a1a1a" stroke-width="7.40" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Padlock keyhole -->
  <circle cx="145" cy="138" r="7" fill="#000000"/>
  <rect x="141" y="138" width="8" height="12" rx="2" fill="#000000"/>
  <!-- Key emblem - to the right of door -->
  <!-- Key bow (ring) -->
  <circle cx="240" cy="130" r="16" fill="#ff9900" stroke="#1a1a1a" stroke-width="5.93"/>
  <circle cx="240" cy="130" r="8" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Key shaft -->
  <rect x="220" y="126" width="58" height="9" rx="4" fill="#ff9900" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Key teeth -->
  <rect x="248" y="135" width="8" height="10" rx="2" fill="#ff9900" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="260" y="135" width="8" height="8" rx="2" fill="#ff9900" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="270" y="135" width="8" height="12" rx="2" fill="#ff9900" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Countdown clock emblem - upper left wall -->
