<!-- horse head/neck -->
<path d="M 268 230 L 272 196 Q 274 178 292 176 L 320 174 Q 332 180 330 196 L 326 230 Z" fill="#6b4a2b" stroke="#1a1a1a" stroke-width="6" stroke-linejoin="round"/>
