  <rect x="237" y="95" width="9" height="114" fill="#7d5e23" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>

  <!-- LONG resonator tubes below bars: bass left very long, treble right short -->
  <!-- 10 tubes, each centered under a bar. Lengths: 95, 85, 75, 66, 58, 50, 43, 37, 31, 26 -->
  <!-- Tube x positions correspond to bar centers. Bars span x=54..236. Each bar ~18px wide, gap 1. -->
  <!-- Bar centers approx: 63,82,101,120,139,158,177,196,215,226 (10 bars) -->

  <!-- Tube 1 (bass/leftmost): x=55, length=95, bottom at y=200 so top=105 -->
  <rect x="57" y="148" width="12" height="52" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Tube 2: length=88 -->
  <rect x="76" y="155" width="12" height="45" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Tube 3: length=80 -->
  <rect x="95" y="160" width="12" height="40" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Tube 4: length=72 -->
  <rect x="114" y="165" width="12" height="35" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Tube 5: length=64 -->
  <rect x="133" y="169" width="12" height="31" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Tube 6: length=56 -->
  <rect x="152" y="173" width="12" height="27" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
