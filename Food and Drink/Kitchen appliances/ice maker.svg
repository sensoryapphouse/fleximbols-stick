  <path d="M95 165 L88 210 L202 210 L195 165 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Ice in bin -->
  <rect x="102" y="180" width="20" height="20" rx="3" ry="3" fill="#dff3fd" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <rect x="128" y="185" width="18" height="18" rx="3" ry="3" fill="#90a7d6" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <rect x="152" y="178" width="20" height="20" rx="3" ry="3" fill="#dff3fd" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <!-- Bin rim -->
  <line x1="88" y1="165" x2="202" y2="165" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
