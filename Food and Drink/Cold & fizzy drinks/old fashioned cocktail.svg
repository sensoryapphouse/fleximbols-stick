  <!-- large ice cube -->
  <rect x="105" y="100" width="50" height="50" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="105" y1="115" x2="155" y2="115" stroke="#90a7d6" stroke-width="2.96"/>
  <line x1="120" y1="100" x2="120" y2="150" stroke="#90a7d6" stroke-width="2.96"/>
  <!-- second smaller ice cube -->
  <rect x="160" y="125" width="32" height="32" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- orange slice/wedge -->
  <path d="M85 100 Q90 75 115 80 Q120 95 100 105 Z" fill="#ff9900" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <path d="M93 88 L108 92" stroke="#ffffff" stroke-width="2.96"/>
