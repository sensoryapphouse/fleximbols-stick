  <path d="M90 150 Q135 145 200 150" fill="none" stroke="#1a1a1a" stroke-width="5.33" stroke-linecap="round"/>
  <!-- Eyelashes (closed eye) -->
  <path d="M100 152 L98 158 M120 152 L120 160 M140 151 L140 160 M160 151 L160 160 M180 152 L180 158" fill="none" stroke="#1a1a1a" stroke-width="2.67" stroke-linecap="round"/>
