<!-- connecting lines between outer and inner cubes -->
<line x1="55" y1="75" x2="95" y2="80" stroke="#1a1a1a" stroke-width="2" opacity="0.6"/>
<line x1="235" y1="75" x2="175" y2="80" stroke="#1a1a1a" stroke-width="2" opacity="0.6"/>
<line x1="235" y1="210" x2="185" y2="180" stroke="#1a1a1a" stroke-width="2" opacity="0.6"/>
<line x1="55" y1="210" x2="105" y2="180" stroke="#1a1a1a" stroke-width="2" opacity="0.6"/>
<line x1="35" y1="30" x2="95" y2="80" stroke="#1a1a1a" stroke-width="2" opacity="0.6"/>
<line x1="215" y1="30" x2="175" y2="80" stroke="#1a1a1a" stroke-width="2" opacity="0.6"/>
<line x1="215" y1="170" x2="185" y2="180" stroke="#1a1a1a" stroke-width="2" opacity="0.6"/>
