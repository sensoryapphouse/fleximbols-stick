  <!-- Loaf top surface (slightly angled top, dome shape - characteristic crack) -->
  <path d="M 55,115 Q 75,88 145,80 Q 215,88 240,115" fill="#e6b98a" stroke="#1a1a1a" stroke-width="11.11" stroke-linejoin="round" stroke-linecap="round"/>
