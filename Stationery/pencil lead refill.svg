<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Pencil lead refill: small tube/cartridge + individual lead sticks -->
  <!-- Tube/cartridge laid horizontally in upper area -->
  <!-- Tube cap (right end, round) -->
  <ellipse cx="244" cy="95" rx="14" ry="22" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Tube body -->
  <rect x="70" y="73" width="174" height="44" rx="0" fill="#efefef" stroke="none"/>
  <!-- Tube body left end cap ellipse -->
  <ellipse cx="70" cy="95" rx="14" ry="22" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Tube body sides (draw over) -->
  <line x1="70" y1="73" x2="244" y2="73" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <line x1="70" y1="117" x2="244" y2="117" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <!-- Tube label/color band -->
  <rect x="90" y="75" width="138" height="40" rx="0" fill="#2a4ec0" stroke="none"/>
  <!-- Label highlight stripe -->
  <rect x="100" y="78" width="118" height="14" rx="3" fill="#90a7d6" stroke="none"/>
  <!-- Tube window (shows leads inside) -->
  <rect x="118" y="80" width="60" height="30" rx="4" fill="#dff3fd" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Individual lead sticks visible through window -->
  <line x1="122" y1="88" x2="174" y2="88" stroke="#4d4d4d" stroke-width="2.78" stroke-linecap="round"/>
  <line x1="122" y1="93" x2="174" y2="93" stroke="#4d4d4d" stroke-width="2.78" stroke-linecap="round"/>
  <line x1="122" y1="98" x2="174" y2="98" stroke="#4d4d4d" stroke-width="2.78" stroke-linecap="round"/>
  <line x1="122" y1="103" x2="174" y2="103" stroke="#4d4d4d" stroke-width="2.78" stroke-linecap="round"/>

  <!-- Tube cap right end detail -->
  <ellipse cx="244" cy="95" rx="14" ry="22" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Push button nub on cap -->
  <ellipse cx="258" cy="95" rx="6" ry="8" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Individual lead sticks scattered below the tube -->
  <!-- Lead stick 1 (long, horizontal) -->
  <line x1="55" y1="148" x2="195" y2="148" stroke="#4d4d4d" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Pointed tip of lead 1 -->
  <line x1="195" y1="148" x2="205" y2="148" stroke="#4d4d4d" stroke-width="2.22" stroke-linecap="round"/>

  <!-- Lead stick 2 (slightly offset) -->
  <line x1="65" y1="160" x2="200" y2="160" stroke="#4d4d4d" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="200" y1="160" x2="210" y2="160" stroke="#4d4d4d" stroke-width="2.22" stroke-linecap="round"/>

  <!-- Lead stick 3 (shorter, below) -->
  <line x1="78" y1="172" x2="185" y2="172" stroke="#4d4d4d" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="185" y1="172" x2="194" y2="172" stroke="#4d4d4d" stroke-width="2.22" stroke-linecap="round"/>

  <!-- Lead stick 4 (even shorter, offset) -->
  <line x1="88" y1="184" x2="170" y2="184" stroke="#4d4d4d" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="170" y1="184" x2="178" y2="184" stroke="#4d4d4d" stroke-width="2.22" stroke-linecap="round"/>
</g></svg>