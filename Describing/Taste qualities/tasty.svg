<svg xmlns="http://www.w3.org/2000/svg" viewBox="60.24 33.78 389.82 389.82">
<!-- tasty: steaming bowl of food with heart + sparkle (delicious) -->
<g stroke-linecap="round" stroke-linejoin="round">
