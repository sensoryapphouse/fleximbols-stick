  <circle cx="234" cy="130" r="13" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="222" y="143" width="24" height="18" rx="4" ry="4" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <line x1="226" y1="161" x2="226" y2="182" stroke="#4d4d4d" stroke-width="7.11" stroke-linecap="round"/>
  <line x1="242" y1="161" x2="242" y2="182" stroke="#4d4d4d" stroke-width="7.11" stroke-linecap="round"/>
