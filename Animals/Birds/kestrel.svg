  <!-- Hovering kestrel: wings spread wide, fanned tail downward, russet/rusty colouring -->
  <!-- Tail fanned downward -->
  <polygon points="145,185 118,220 172,220" fill="#e65a00" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Tail bars -->
  <line x1="122" y1="213" x2="168" y2="213" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="120" y1="206" x2="170" y2="206" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
  <!-- Body -->
  <ellipse cx="145" cy="148" rx="28" ry="44" fill="#ff9900" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Belly pale -->
  <ellipse cx="145" cy="160" rx="16" ry="24" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Belly spots -->
  <circle cx="140" cy="155" r="3" fill="#000000"/>
  <circle cx="150" cy="157" r="3" fill="#000000"/>
  <circle cx="143" cy="165" r="3" fill="#000000"/>
  <circle cx="152" cy="167" r="3" fill="#000000"/>
  <!-- Left wing spread -->
  <polygon points="117,142 28,118 30,145 110,162" fill="#e65a00" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Left wing coverts -->
  <polygon points="117,142 28,118 50,112" fill="#ff9900" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Right wing spread -->
  <polygon points="173,142 262,118 260,145 180,162" fill="#e65a00" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Right wing coverts -->
  <polygon points="173,142 262,118 240,112" fill="#ff9900" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Wing bars left -->
  <line x1="50" y1="128" x2="110" y2="148" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="38" y1="133" x2="60" y2="125" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
  <!-- Wing bars right -->
  <line x1="240" y1="128" x2="180" y2="148" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="252" y1="133" x2="230" y2="125" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="145" cy="107" r="24" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Malar stripe -->
  <path d="M130,116 Q124,124 127,130" fill="none" stroke="#1a1a1a" stroke-width="7.40" stroke-linecap="round"/>
  <path d="M160,116 Q166,124 163,130" fill="none" stroke="#1a1a1a" stroke-width="7.40" stroke-linecap="round"/>
  <!-- White cheek -->
  <ellipse cx="130" cy="114" rx="8" ry="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="160" cy="114" rx="8" ry="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Beak -->
  <path d="M145,101 Q139,106 141,113 L149,113 Q151,106 145,101Z" fill="#f2e40d" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
