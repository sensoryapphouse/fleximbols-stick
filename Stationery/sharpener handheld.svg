<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- small handheld pocket sharpener with pencil inserted, shavings curl -->
  <!-- shavings curl, behind everything, sitting bottom-left -->
  <path d="M 35 175 Q 50 150 75 165 Q 90 175 80 195 Q 65 205 55 195 Q 50 188 60 182" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.33" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 60 182 Q 70 178 72 188" fill="none" stroke="#5e1f0a" stroke-width="3.56" stroke-linecap="round"/>
  <!-- second smaller curl -->
  <path d="M 90 200 Q 105 190 115 205 Q 110 215 100 210" fill="#e6b98a" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- pencil, diagonal, going into the sharpener at right -->
  <g transform="rotate(20 160 120)">
    <!-- shaft -->
    <rect x="60" y="110" width="130" height="22" fill="#f2e40d" stroke="#1a1a1a" stroke-width="5.33" stroke-linejoin="round"/>
    <!-- end (eraser end) on the left -->
    <rect x="55" y="110" width="10" height="22" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="5.33" stroke-linejoin="round"/>
    <!-- wood cone on right going into sharpener -->
    <polygon points="190,110 215,121 190,132" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.33" stroke-linejoin="round"/>
    <!-- pencil ridges -->
    <line x1="100" y1="110" x2="100" y2="132" stroke="#1a1a1a" stroke-width="2.67"/>
    <line x1="140" y1="110" x2="140" y2="132" stroke="#1a1a1a" stroke-width="2.67"/>
  </g>
  <!-- sharpener body, blocky wedge shape, right side -->
  <rect x="180" y="95" width="80" height="70" rx="8" fill="#7c3fac" stroke="#1a1a1a" stroke-width="7.11" stroke-linejoin="round"/>
  <!-- blade plate -->
  <rect x="190" y="105" width="60" height="20" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.33" stroke-linejoin="round"/>
  <!-- blade screw -->
  <circle cx="220" cy="115" r="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="3.56"/>
  <line x1="217" y1="115" x2="223" y2="115" stroke="#1a1a1a" stroke-width="2.67"/>
  <!-- insertion hole where pencil enters (left face) -->
  <ellipse cx="180" cy="130" rx="6" ry="10" fill="#000000" stroke="#1a1a1a" stroke-width="3.56"/>
</g></svg>