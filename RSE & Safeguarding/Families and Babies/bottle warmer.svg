  <!-- Modern bottle warmer: sleek tall unit with digital display, bottle inside, heat waves -->
  <!-- Warmer body (sleek tall, rounded rect) -->
  <rect x="85" y="80" width="120" height="135" rx="20" ry="20" fill="#efefef" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Top opening well -->
  <ellipse cx="145" cy="82" rx="48" ry="12" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.55"/>
  <ellipse cx="145" cy="80" rx="42" ry="9" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Digital display panel -->
  <rect x="105" y="155" width="80" height="30" rx="4" ry="4" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Digital readout segments -->
  <rect x="115" y="162" width="14" height="16" rx="1" ry="1" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="2.22"/>
  <rect x="133" y="162" width="14" height="16" rx="1" ry="1" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="2.22"/>
  <circle cx="153" cy="166" r="1.5" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="1.11"/>
  <circle cx="153" cy="174" r="1.5" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="1.11"/>
  <rect x="158" y="162" width="14" height="16" rx="1" ry="1" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="2.22"/>
  <!-- Touch buttons row -->
  <circle cx="115" cy="200" r="6" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.33"/>
  <circle cx="145" cy="200" r="6" fill="#ff9900" stroke="#1a1a1a" stroke-width="3.33"/>
  <circle cx="175" cy="200" r="6" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Baby bottle inside (showing above rim) -->
  <rect x="128" y="30" width="34" height="50" rx="10" ry="10" fill="#dff3fd" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Bottle neck -->
  <rect x="135" y="18" width="20" height="14" rx="5" ry="5" fill="#dff3fd" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Bottle nipple -->
  <path d="M138 10 Q145 4 152 10 L152 20 L138 20 Z" fill="#e6b98a" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Liquid level -->
  <line x1="132" y1="60" x2="158" y2="60" stroke="#90a7d6" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Heat waves rising around bottle -->
  <path d="M108 60 Q102 50 108 40" fill="none" stroke="#f8130d" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M115 65 Q109 55 115 45" fill="none" stroke="#ff9900" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M175 65 Q181 55 175 45" fill="none" stroke="#ff9900" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M182 60 Q188 50 182 40" fill="none" stroke="#f8130d" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Sleek base foot -->
  <rect x="78" y="210" width="134" height="12" rx="6" ry="6" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
