  <path d="M68 80 Q68 60 80 50 Q92 60 92 80 Q92 95 80 98 Q68 95 68 80 Z" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
