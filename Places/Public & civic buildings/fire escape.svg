  <circle cx="220" cy="82" r="10" fill="#000000" stroke="none"/>
  <!-- Torso leaning forward -->
  <line x1="220" y1="92" x2="210" y2="115" stroke="#1a1a1a" stroke-width="8.88" stroke-linecap="round"/>
  <!-- Arm back -->
