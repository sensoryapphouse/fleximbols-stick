  <line x1="60" y1="142" x2="230" y2="142" stroke="#90a7d6" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="60" y1="162" x2="230" y2="162" stroke="#90a7d6" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="60" y1="182" x2="230" y2="182" stroke="#90a7d6" stroke-width="4.45" stroke-linecap="round"/>
