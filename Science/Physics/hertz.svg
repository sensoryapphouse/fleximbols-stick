  <circle cx="52" cy="120" r="9" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- sound emission lines -->
  <path d="M85 100 C95 110 95 130 85 140" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- sine wave with one full cycle (between 105 and 215) -->
  <path d="M95 150 C115 150 115 90 160 90 C200 90 200 150 220 150 C245 150 245 90 270 90" fill="none" stroke="#2a4ec0" stroke-width="7.40" stroke-linecap="round"/>
