  <ellipse cx="40" cy="205" rx="14" ry="4" fill="#529929" stroke="#1a1a1a" stroke-width="3.95"/>
  <!-- mandoline body: long sloped rectangular frame -->
  <path d="M 35 75 L 245 75 L 260 175 L 50 195 Z" fill="#efefef" stroke="#1a1a1a" stroke-width="6.92" stroke-linejoin="round"/>
