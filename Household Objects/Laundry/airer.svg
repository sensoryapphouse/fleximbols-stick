<!-- metal concertina/winged airer: X-shaped legs with a rack of horizontal bars on top -->
<!-- crossing legs -->
<line x1="140" y1="200" x2="380" y2="420" stroke="#9aa0a6" stroke-width="10" stroke-linecap="round"/>
<line x1="372" y1="200" x2="132" y2="420" stroke="#9aa0a6" stroke-width="10" stroke-linecap="round"/>
<circle cx="256" cy="310" r="11" fill="#cfd6dc" stroke="#1a1a1a" stroke-width="7"/>
<!-- feet -->
<line x1="120" y1="420" x2="150" y2="420" stroke="#1a1a1a" stroke-width="10" stroke-linecap="round"/>
<line x1="362" y1="420" x2="392" y2="420" stroke="#1a1a1a" stroke-width="10" stroke-linecap="round"/>
<!-- top frame: outer rectangle of the drying rack -->
<rect x="120" y="150" width="272" height="86" rx="10" fill="none" stroke="#1a1a1a" stroke-width="9"/>
<!-- horizontal drying bars -->
<line x1="130" y1="174" x2="382" y2="174" stroke="#b9bdc2" stroke-width="7" stroke-linecap="round"/>
<line x1="130" y1="193" x2="382" y2="193" stroke="#b9bdc2" stroke-width="7" stroke-linecap="round"/>
<line x1="130" y1="212" x2="382" y2="212" stroke="#b9bdc2" stroke-width="7" stroke-linecap="round"/>
<!-- a draped cloth over the bars -->
<path d="M 200 150 Q 256 130 312 150 L 312 230 L 200 230 Z" fill="#8cc152" stroke="#1a1a1a" stroke-width="8" stroke-linejoin="round"/>
</svg>
