  <rect x="116" y="168" width="30" height="36" rx="4" ry="4" fill="#ff9900" stroke="#1a1a1a" stroke-width="5.08" stroke-linejoin="round"/>
  <!-- pump top -->
  <rect x="120" y="158" width="22" height="14" rx="3" ry="3" fill="#ff9900" stroke="#1a1a1a" stroke-width="5.08" stroke-linejoin="round"/>
  <!-- nozzle arm -->
  <path d="M 146 164 L 162 164 L 162 178 L 158 178" fill="none" stroke="#1a1a1a" stroke-width="5.08" stroke-linecap="round" stroke-linejoin="round"/>
