<!-- hood -->
<path d="M 222 132 Q 256 96 290 132 Q 256 120 222 132 Z" fill="#c2902c" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- neck / head opening -->
<ellipse cx="256" cy="158" rx="34" ry="20" fill="#c2902c" stroke="#1a1a1a" stroke-width="8"/>
<!-- side fold lines -->
<line x1="256" y1="178" x2="256" y2="384" stroke="#c2902c" stroke-width="6" stroke-linecap="round"/>
<line x1="200" y1="210" x2="156" y2="300" stroke="#c2902c" stroke-width="6" stroke-linecap="round"/>
<line x1="312" y1="210" x2="356" y2="300" stroke="#c2902c" stroke-width="6" stroke-linecap="round"/>
<!-- bottom fringe -->
