  <!-- BURRITO — large cylinder, angled, partly unwrapped -->

  <!-- Foil/wrapper lower portion — silver metallic -->
  <path d="M48 165 Q45 220 145 225 Q245 220 242 165 Q220 185 145 190 Q70 185 48 165 Z" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Foil fold at bottom end (closed end) -->
  <ellipse cx="145" cy="165" rx="97" ry="18" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>

  <!-- Foil wrap body (silver cylinder upper section) -->
  <path d="M48 95 Q48 165 145 175 Q242 165 242 95 Q220 112 145 118 Q70 112 48 95 Z" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>

  <!-- Foil crinkle lines on wrapper -->
  <path d="M70 100 Q68 140 70 165" fill="none" stroke="#7f7f7f" stroke-width="2.96" stroke-linecap="round"/>
  <path d="M100 98 Q98 140 100 168" fill="none" stroke="#7f7f7f" stroke-width="2.96" stroke-linecap="round"/>
  <path d="M190 98 Q192 140 190 168" fill="none" stroke="#7f7f7f" stroke-width="2.96" stroke-linecap="round"/>
  <path d="M220 100 Q222 140 220 165" fill="none" stroke="#7f7f7f" stroke-width="2.96" stroke-linecap="round"/>

  <!-- Unwrapped top end of burrito — tortilla showing -->
  <ellipse cx="145" cy="95" rx="97" ry="18" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>

  <!-- Filling visible from top opening -->
  <!-- Rice (white/cream) -->
  <ellipse cx="128" cy="90" rx="18" ry="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Black beans -->
  <ellipse cx="155" cy="88" rx="14" ry="7" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Meat (brown) -->
  <ellipse cx="140" cy="78" rx="22" ry="9" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Guacamole (green) -->
  <ellipse cx="118" cy="77" rx="12" ry="6" fill="#529929" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Sour cream (white) -->
  <ellipse cx="165" cy="76" rx="10" ry="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Salsa red -->
  <ellipse cx="145" cy="68" rx="16" ry="7" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Cheese yellow -->
  <ellipse cx="130" cy="65" rx="12" ry="5" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- Tortilla wrap fold visible at top (open end seam) -->
  <path d="M48 95 Q95 80 145 77 Q195 80 242 95" fill="none" stroke="#e6b98a" stroke-width="5.93" stroke-linecap="round"/>

  <!-- Foil partially peeled back (top left flap) -->
  <path d="M48 95 L55 60 Q80 55 100 70 Q75 80 48 95 Z" fill="#efefef" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Foil crinkle on peel -->
  <line x1="58" y1="90" x2="65" y2="65" stroke="#b8b8b8" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="72" y1="85" x2="80" y2="60" stroke="#b8b8b8" stroke-width="2.96" stroke-linecap="round"/>
</g></svg>