  <rect x="140" y="95" width="10" height="6" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- handshake -->
  <!-- left hand (sleeve) -->
  <path d="M50,150 L90,150 L100,160 L100,175 L50,175 Z" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="5.56" stroke-linejoin="round"/>
  <!-- right hand (sleeve) -->
  <path d="M240,150 L200,150 L190,160 L190,175 L240,175 Z" fill="#7c3fac" stroke="#1a1a1a" stroke-width="5.56" stroke-linejoin="round"/>
