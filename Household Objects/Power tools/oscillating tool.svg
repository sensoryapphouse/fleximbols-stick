  <!-- Blade tip (triangular point) -->
  <polygon points="258,98 272,120 258,142" fill="#efefef" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Blade mounting holes -->
  <circle cx="232" cy="115" r="4" fill="#000000" stroke="#1a1a1a" stroke-width="2.96"/>
  <circle cx="232" cy="125" r="4" fill="#000000" stroke="#1a1a1a" stroke-width="2.96"/>
  <circle cx="245" cy="120" r="4" fill="#000000" stroke="#1a1a1a" stroke-width="2.96"/>

