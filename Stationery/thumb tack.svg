  <!-- Spike tip -->
  <polygon points="145,210 142,222 148,222" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="2.54" stroke-linejoin="round"/>
  <!-- Collar / neck connecting disc to spike -->
