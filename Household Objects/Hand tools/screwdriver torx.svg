  <!-- Round handle - large, at top -->
  <ellipse cx="145" cy="65" rx="38" ry="52" fill="#529929" stroke="#1a1a1a" stroke-width="7.40"/>
  <!-- Handle grip lines -->
  <line x1="111" y1="55" x2="179" y2="55" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="111" y1="67" x2="179" y2="67" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="111" y1="79" x2="179" y2="79" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Shank - thin metal rod -->
  <rect x="138" y="112" width="14" height="88" rx="2" ry="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.93"/>
  <!-- Ferrule (collar between handle and shank) -->
  <rect x="130" y="108" width="30" height="14" rx="3" ry="3" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.93"/>
  <!-- Torx 6-pointed star tip -->
  <!-- Build star as 6 lobes radiating from centre point at (145,228) -->
  <!-- Star polygon: 6 outer points, 6 inner points (12-point shape) -->
  <polygon points="145,200 151,208 161,207 156,215 161,223 151,222 145,230 139,222 129,223 134,215 129,207 139,208" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Star centre hole (Torx characteristic centre pin) -->
  <circle cx="145" cy="215" r="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.96"/>
</g></svg>