<!-- a swarm of bees -->
<!-- buzzing motion swirls behind the cluster -->
<g fill="none" stroke="#9aa0a6" stroke-width="7" stroke-linecap="round">
<path d="M 90 235 Q 130 175 200 185"/>
<path d="M 430 215 Q 400 280 320 290"/>
<path d="M 200 95 Q 270 80 320 110"/>
</g>
<g stroke="#1a1a1a" stroke-linejoin="round" stroke-linecap="round">
