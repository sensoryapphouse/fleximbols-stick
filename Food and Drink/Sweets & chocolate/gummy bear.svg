  <circle cx="145" cy="82" r="56" fill="#f8130d" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Head inner highlight -->
  <ellipse cx="140" cy="78" rx="34" ry="30" fill="#f4a4b2" stroke="none"/>
