<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Single horizontal paper stacking tray with papers stacked on it -->

  <!-- TRAY BODY (horizontal open frame tray) -->
  <!-- Tray base/floor -->
  <rect x="34" y="170" width="222" height="18" rx="6" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Tray left wall -->
  <rect x="34" y="126" width="16" height="62" rx="5" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Tray right wall -->
  <rect x="240" y="126" width="16" height="62" rx="5" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Tray front rail (low, can see papers) -->
  <rect x="34" y="160" width="222" height="14" rx="5" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Tray back wall (taller) -->
  <rect x="34" y="110" width="222" height="22" rx="5" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>

  <!-- STACK OF PAPERS in the tray -->
  <!-- Bottom paper (widest fan) -->
  <rect x="50" y="142" width="190" height="22" rx="3" fill="#efefef" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <!-- Second paper (slight offset) -->
  <rect x="52" y="132" width="188" height="22" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <!-- Third paper -->
  <rect x="54" y="122" width="184" height="22" rx="3" fill="#efefef" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <!-- Top paper (topmost, cleanest) -->
  <rect x="56" y="112" width="180" height="22" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <!-- Lines on top paper suggesting text -->
  <line x1="68" y1="118" x2="160" y2="118" stroke="#b8b8b8" stroke-width="2.22" stroke-linecap="round"/>
  <line x1="68" y1="125" x2="180" y2="125" stroke="#b8b8b8" stroke-width="2.22" stroke-linecap="round"/>
  <line x1="68" y1="131" x2="150" y2="131" stroke="#b8b8b8" stroke-width="2.22" stroke-linecap="round"/>

  <!-- Tray feet (4 small rubber feet) -->
  <rect x="46" y="186" width="16" height="10" rx="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="228" y="186" width="16" height="10" rx="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="112" y="186" width="16" height="10" rx="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="162" y="186" width="16" height="10" rx="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
</g></svg>