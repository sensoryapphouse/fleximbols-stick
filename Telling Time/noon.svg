  <!-- NOON: bright sun high at top centre + clock showing 12:00 -->
  <!-- Sun body -->
  <circle cx="145" cy="56" r="30" fill="#fff200" stroke="#1a1a1a" stroke-width="2.78"/>
  <!-- Sun rays -->
  <line x1="145" y1="14" x2="145" y2="4" stroke="#f2e40d" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="175" y1="22" x2="183" y2="14" stroke="#f2e40d" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="196" y1="46" x2="206" y2="42" stroke="#f2e40d" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="115" y1="22" x2="107" y2="14" stroke="#f2e40d" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="94" y1="46" x2="84" y2="42" stroke="#f2e40d" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="196" y1="66" x2="208" y2="70" stroke="#f2e40d" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="94" y1="66" x2="82" y2="70" stroke="#f2e40d" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Clock face -->
  <circle cx="145" cy="170" r="62" fill="#f8130d" stroke="#1a1a1a" stroke-width="2.78"/>
  <circle cx="145" cy="170" r="52" fill="#efefef" stroke="none"/>
  <!-- Hour markers -->
  <rect x="142" y="122" width="6" height="12" rx="3" fill="#4d4d4d"/>
  <rect x="142" y="202" width="6" height="12" rx="3" fill="#4d4d4d"/>
  <rect x="88" y="167" width="12" height="6" rx="3" fill="#4d4d4d"/>
  <rect x="191" y="167" width="12" height="6" rx="3" fill="#4d4d4d"/>
  <!-- Both hands straight up pointing 12 -->
  <rect x="141" y="122" width="8" height="48" rx="4" fill="#000000"/>
  <rect x="143" y="122" width="4" height="48" rx="2" fill="#000000"/>
  <!-- Centre -->
  <circle cx="145" cy="170" r="5" fill="#000000"/>
</g></svg>