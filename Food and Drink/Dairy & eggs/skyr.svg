<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Icelandic skyr tub - similar width to greek but with distinctive lid off and standing spoon -->
  <path d="M 82,90 L 90,212 Q 92,224 145,226 Q 198,224 200,212 L 208,90 Z" fill="#efefef" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Tub rim -->
  <path d="M 79,90 Q 79,100 145,102 Q 211,100 211,90 Q 211,80 145,78 Q 79,80 79,90 Z" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Very thick yogurt surface - filled near top showing density -->
  <path d="M 90,108 Q 90,118 145,120 Q 200,118 200,108 L 208,90 Q 211,100 145,102 Q 79,100 82,90 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Very thick flat-topped dollop - skyr is much denser than greek -->
  <path d="M 108,108 Q 106,88 120,80 Q 132,74 145,73 Q 158,74 170,80 Q 184,88 182,108 Q 170,104 145,103 Q 120,104 108,108 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Flat dense top surface of skyr (very little dome - it holds shape) -->
  <path d="M 118,82 Q 145,76 172,82" fill="none" stroke="#b8b8b8" stroke-width="2.78" stroke-linecap="round"/>
  <!-- STANDING SPOON - upright in the thick skyr (key differentiator) -->
  <!-- Spoon handle standing vertically -->
  <path d="M 178,108 L 182,22" fill="none" stroke="#b8b8b8" stroke-width="7.77" stroke-linecap="round"/>
  <!-- Spoon bowl at top of handle -->
  <ellipse cx="182" cy="18" rx="11" ry="8" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Spoon bowl highlight -->
  <path d="M 175,15 Q 178,13 182,14" fill="none" stroke="#ffffff" stroke-width="2.22" stroke-linecap="round"/>
  <!-- Spoon base embedded in thick yogurt -->
  <path d="M 174,106 Q 178,102 182,105 Q 186,108 182,110 Q 178,112 174,110 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.22" stroke-linejoin="round"/>
  <!-- Tub label - Iceland blue coloring -->
  <path d="M 92,178 Q 92,186 145,188 Q 198,186 198,178 L 196,162 Q 196,170 145,172 Q 94,170 94,162 Z" fill="#2a4ec0" stroke="none"/>
  <!-- Small white cross on label - Icelandic flag suggestion -->
  <path d="M 130,170 L 160,170" fill="none" stroke="#ffffff" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M 145,163 L 145,177" fill="none" stroke="#ffffff" stroke-width="4.45" stroke-linecap="round"/>
</g></svg>