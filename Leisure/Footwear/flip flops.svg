<g>
<ellipse cx="186" cy="270" rx="64" ry="148" fill="#33b5c4" stroke="#1a1a1a" stroke-width="9"/>
<ellipse cx="186" cy="270" rx="46" ry="128" fill="#5fd0dd" stroke="#1a1a1a" stroke-width="6"/>
<!-- Y strap -->
<path d="M 186 168 L 150 232" fill="none" stroke="#f25c54" stroke-width="14" stroke-linecap="round"/>
<path d="M 186 168 L 222 232" fill="none" stroke="#f25c54" stroke-width="14" stroke-linecap="round"/>
<!-- toe post -->
<circle cx="186" cy="166" r="9" fill="#f25c54" stroke="#1a1a1a" stroke-width="5"/>
</g>
<!-- RIGHT flip flop -->
<g>
<ellipse cx="326" cy="270" rx="64" ry="148" fill="#33b5c4" stroke="#1a1a1a" stroke-width="9"/>
<ellipse cx="326" cy="270" rx="46" ry="128" fill="#5fd0dd" stroke="#1a1a1a" stroke-width="6"/>
<!-- Y strap -->
<path d="M 326 168 L 290 232" fill="none" stroke="#f25c54" stroke-width="14" stroke-linecap="round"/>
<path d="M 326 168 L 362 232" fill="none" stroke="#f25c54" stroke-width="14" stroke-linecap="round"/>
<!-- toe post -->
<circle cx="326" cy="166" r="9" fill="#f25c54" stroke="#1a1a1a" stroke-width="5"/>
</g>
</svg>
