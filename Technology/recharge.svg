<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Battery outline — horizontal, slightly smaller to leave room for refresh arrow -->
  <rect x="14" y="72" width="200" height="96" rx="12" ry="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.94" stroke-linejoin="round"/>
  <!-- Battery positive terminal nub -->
  <rect x="214" y="98" width="26" height="44" rx="7" ry="7" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.94" stroke-linejoin="round"/>
  <!-- Battery fill — LOW level (red, ~20%) to show it needs recharging -->
  <rect x="22" y="80" width="38" height="80" rx="8" ry="8" fill="#f8130d" stroke="#1a1a1a" stroke-width="2.96" stroke-linejoin="round"/>
  <!-- Lightning bolt centred in battery -->
  <polygon points="124,82 100,124 118,124 106,158 144,108 124,108" fill="#fff200" stroke="#1a1a1a" stroke-width="3.95" stroke-linejoin="round"/>
  <!-- Circular refresh / renew arrow — top right, indicating cyclic recharge -->
  <!-- Arc (about 270 degrees, clockwise) -->
  <path d="M248 36 A34 34 0 1 1 222 62" fill="none" stroke="#2a4ec0" stroke-width="6.92" stroke-linecap="round"/>
  <!-- Arrowhead at end of arc (pointing downward-left at ~225deg position) -->
  <polygon points="209,52 209,74 228,62" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="2.96" stroke-linejoin="round"/>
</g></svg>