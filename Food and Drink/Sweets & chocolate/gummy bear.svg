  <!-- Left arm -->
  <ellipse cx="84" cy="140" rx="22" ry="32" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-20 84 140)"/>
  <!-- Right arm -->
  <ellipse cx="206" cy="140" rx="22" ry="32" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round" transform="rotate(20 206 140)"/>
  <!-- Left leg -->
  <ellipse cx="110" cy="215" rx="24" ry="18" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right leg -->
  <ellipse cx="180" cy="215" rx="24" ry="18" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
