  <!-- sky -->
  <rect x="0" y="0" width="290" height="110" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- sea -->
  <rect x="0" y="110" width="290" height="130" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- wave lines -->
  <path d="M10 175 Q35 168 60 175 T110 175 T160 175 T210 175 T260 175 T285 175" fill="none" stroke="#ffffff" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M10 210 Q35 203 60 210 T110 210 T160 210 T210 210 T260 210 T285 210" fill="none" stroke="#ffffff" stroke-width="4.45" stroke-linecap="round"/>
  <!-- ice shelf - flat ice extending over sea with cliff edge -->
  <!-- top flat -->
  <path d="M0 60 L0 110 L180 110 L180 60 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- cliff edge - vertical face dropping to sea -->
  <path d="M180 60 L180 165 L0 165 L0 110" fill="#dff3fd" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- highlight on cliff -->
  <path d="M180 60 L180 165" fill="none" stroke="#1a1a1a" stroke-width="6.67" stroke-linecap="round"/>
  <!-- cliff face vertical cracks -->
  <path d="M40 110 L40 165" fill="none" stroke="#90a7d6" stroke-width="4.45"/>
  <path d="M90 110 L90 165" fill="none" stroke="#90a7d6" stroke-width="4.45"/>
  <path d="M140 110 L140 165" fill="none" stroke="#90a7d6" stroke-width="4.45"/>
  <!-- top surface texture -->
  <path d="M20 80 L60 80" fill="none" stroke="#90a7d6" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M80 92 L130 92" fill="none" stroke="#90a7d6" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M30 100 L75 100" fill="none" stroke="#90a7d6" stroke-width="4.45" stroke-linecap="round"/>
  <!-- water meets cliff base - white foam -->
  <path d="M0 165 Q40 170 80 165 T160 165 T180 165" fill="none" stroke="#ffffff" stroke-width="6.67" stroke-linecap="round"/>
  <!-- small floating ice chunk in sea -->
  <path d="M220 175 L240 175 L245 185 L215 185 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.56" stroke-linejoin="round"/>
</g></svg>