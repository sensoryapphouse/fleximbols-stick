  <line x1="165" y1="68" x2="165" y2="60" stroke="#1a1a1a" stroke-width="3.81" stroke-linecap="round"/>
  <line x1="184" y1="68" x2="184" y2="60" stroke="#1a1a1a" stroke-width="3.81" stroke-linecap="round"/>
  <line x1="203" y1="68" x2="203" y2="60" stroke="#1a1a1a" stroke-width="3.81" stroke-linecap="round"/>
