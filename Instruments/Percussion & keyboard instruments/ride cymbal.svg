<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Larger flatter brass cymbal on stand with prominent raised bell centre, drumstick -->

  <!-- Stand base - tripod feet -->
  <line x1="90" y1="225" x2="122" y2="188" stroke="#4d4d4d" stroke-width="5.55" stroke-linecap="round"/>
  <line x1="170" y1="225" x2="144" y2="188" stroke="#4d4d4d" stroke-width="5.55" stroke-linecap="round"/>
  <line x1="130" y1="225" x2="133" y2="188" stroke="#4d4d4d" stroke-width="5.55" stroke-linecap="round"/>

  <!-- Stand pole -->
  <rect x="128" y="105" width="8" height="88" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- Tilter mechanism -->
  <ellipse cx="132" cy="108" rx="13" ry="7" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Ride cymbal - larger and flatter than crash, minimal tilt -->
  <!-- Outer edge - very wide flat -->
  <ellipse cx="132" cy="98" rx="85" ry="16" fill="#f7de58" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round" transform="rotate(-5, 132, 98)"/>
  <!-- Inner bow area -->
  <ellipse cx="132" cy="98" rx="70" ry="12" fill="none" stroke="#f2e40d" stroke-width="2.22" transform="rotate(-5, 132, 98)"/>
  <!-- Mid ring -->
  <ellipse cx="132" cy="96" rx="45" ry="9" fill="#f2e40d" stroke="#1a1a1a" stroke-width="3.33" transform="rotate(-5, 132, 96)"/>

  <!-- Prominent raised bell - taller/more pronounced than crash bell -->
  <ellipse cx="132" cy="90" rx="22" ry="10" fill="#f2e40d" stroke="#1a1a1a" stroke-width="4.45" transform="rotate(-5, 132, 90)"/>
  <!-- Bell dome top - tall dome shape -->
  <ellipse cx="132" cy="84" rx="13" ry="8" fill="#fff200" stroke="#1a1a1a" stroke-width="4.45" transform="rotate(-5, 132, 84)"/>
  <ellipse cx="132" cy="79" rx="7" ry="5" fill="#fff200" stroke="#1a1a1a" stroke-width="3.33"/>

  <!-- Drumstick playing the bell area -->
  <line x1="232" y1="25" x2="155" y2="82" stroke="#9d7246" stroke-width="7.77" stroke-linecap="round"/>
  <!-- Stick tip -->
  <circle cx="153" cy="84" r="7" fill="#7d5e23" stroke="#1a1a1a" stroke-width="3.33"/>
</g></svg>