  <!-- outer rays (radiating outward) -->
  <g stroke="#f2e40d" stroke-width="10.67" stroke-linecap="round" fill="none">
    <path d="M 145 120 L 145 30"/>
    <path d="M 145 120 L 145 210"/>
    <path d="M 145 120 L 55 120"/>
    <path d="M 145 120 L 235 120"/>
    <path d="M 145 120 L 80 55"/>
    <path d="M 145 120 L 210 55"/>
    <path d="M 145 120 L 80 185"/>
    <path d="M 145 120 L 210 185"/>
  </g>
  <g stroke="#1a1a1a" stroke-width="3.56" stroke-linecap="round" fill="none">
    <path d="M 145 120 L 145 30"/>
    <path d="M 145 120 L 145 210"/>
    <path d="M 145 120 L 55 120"/>
    <path d="M 145 120 L 235 120"/>
    <path d="M 145 120 L 80 55"/>
    <path d="M 145 120 L 210 55"/>
    <path d="M 145 120 L 80 185"/>
    <path d="M 145 120 L 210 185"/>
  </g>

  <!-- shorter intermediate rays -->
  <g stroke="#ff9900" stroke-width="7.11" stroke-linecap="round" fill="none">
