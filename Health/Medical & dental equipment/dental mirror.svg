<svg xmlns="http://www.w3.org/2000/svg" viewBox="86.26 64.93 368.48 368.48"><g transform="rotate(25 256 256)">
<!-- dentist's round mouth mirror on a long slim handle -->
<!-- handle -->
<rect x="244" y="200" width="24" height="220" rx="12" fill="#cdd3da" stroke="#1a1a1a" stroke-width="9"/>
<!-- handle ridges -->
<line x1="250" y1="300" x2="262" y2="300" stroke="#9aa7b1" stroke-width="4" stroke-linecap="round"/>
<line x1="250" y1="322" x2="262" y2="322" stroke="#9aa7b1" stroke-width="4" stroke-linecap="round"/>
<line x1="250" y1="344" x2="262" y2="344" stroke="#9aa7b1" stroke-width="4" stroke-linecap="round"/>
<!-- short neck -->
<rect x="248" y="170" width="16" height="40" fill="#cdd3da" stroke="#1a1a1a" stroke-width="9"/>
<!-- round mirror head -->
<circle cx="256" cy="138" r="56" fill="#cdd3da" stroke="#1a1a1a" stroke-width="9"/>
<!-- reflective face -->
<circle cx="256" cy="138" r="42" fill="#bfe3f7" stroke="#1a1a1a" stroke-width="6"/>
<!-- mirror glint -->
<path d="M 234 116 Q 256 110 278 122" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
<line x1="232" y1="148" x2="250" y2="140" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
</g></svg>
