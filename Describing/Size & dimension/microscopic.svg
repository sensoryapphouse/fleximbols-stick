<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Microscopic: a microscope with tiny cell/speck on the slide -->

  <!-- Base of microscope -->
  <rect x="85" y="205" width="120" height="14" rx="5" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Arm/pillar -->
  <rect x="127" y="105" width="18" height="104" rx="5" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Stage (slide platform) -->
  <rect x="90" y="148" width="90" height="12" rx="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Stage arm connecting pillar to stage -->
  <rect x="125" y="143" width="22" height="20" rx="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Slide on stage -->
  <rect x="108" y="138" width="64" height="10" rx="2" fill="#efefef" stroke="#1a1a1a" stroke-width="3.55" stroke-linejoin="round"/>
  <!-- Tiny cell/speck on slide (center of slide) -->
  <circle cx="140" cy="143" r="4" fill="#529929" stroke="#1a1a1a" stroke-width="2.66"/>
  <!-- Cell nucleus dot -->
  <circle cx="140" cy="143" r="1.5" fill="#000000"/>

  <!-- Eyepiece at top -->
  <rect x="148" y="55" width="16" height="36" rx="5" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="144" y="50" width="24" height="12" rx="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Lens tube going from arm down to stage -->
  <rect x="130" y="68" width="14" height="72" rx="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Objective lens at bottom of tube -->
  <ellipse cx="137" cy="140" rx="10" ry="6" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="3.55"/>

  <!-- Focus knob on side -->
  <circle cx="125" cy="120" r="9" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.55"/>
</g></svg>