<svg xmlns="http://www.w3.org/2000/svg" viewBox="-25.21 31.96 562.42 562.42">
<!-- bland: contrasting pair - seasoned/flavourful bowl (faded) vs plain unseasoned bowl (arrow). plain = bland -->
<g stroke-linecap="round" stroke-linejoin="round">

<!-- LEFT (faded): flavourful seasoned bowl with sprinkles + sparkle -->
<g opacity="0.34">
<g transform="translate(-118 96)">
<path d="M 152 268 A 104 104 0 0 1 360 268 Z" fill="#f0a92b" stroke="#1a1a1a" stroke-width="9"/>
<!-- seasoning sprinkles -->
<circle cx="206" cy="238" r="6" fill="#e0473c"/>
<circle cx="256" cy="224" r="6" fill="#5bbf4a"/>
<circle cx="306" cy="238" r="6" fill="#e0473c"/>
<circle cx="232" cy="252" r="6" fill="#7a4a25"/>
<circle cx="284" cy="252" r="6" fill="#7a4a25"/>
<path d="M 140 268 L 372 268 A 116 116 0 0 1 140 268 Z" fill="#dfe6ec" stroke="#1a1a1a" stroke-width="9"/>
<line x1="132" y1="268" x2="380" y2="268" stroke="#1a1a1a" stroke-width="9"/>
<path d="M 226 384 L 286 384" fill="none" stroke="#1a1a1a" stroke-width="9"/>
<path d="M 256 358 L 256 384" fill="none" stroke="#1a1a1a" stroke-width="9"/>
<!-- sparkle (tasty cue) -->
<path d="M 350 150 l 6 16 l 16 6 l -16 6 l -6 16 l -6 -16 l -16 -6 l 16 -6 Z" fill="#f7d83a" stroke="#1a1a1a" stroke-width="5"/>
</g>
</g>

<!-- RIGHT (active): plain, unseasoned bowl = bland -->
<g transform="translate(118 96)">
<path d="M 152 268 A 104 104 0 0 1 360 268 Z" fill="#efe7d2" stroke="#1a1a1a" stroke-width="9"/>
<path d="M 140 268 L 372 268 A 116 116 0 0 1 140 268 Z" fill="#dfe6ec" stroke="#1a1a1a" stroke-width="9"/>
<line x1="132" y1="268" x2="380" y2="268" stroke="#1a1a1a" stroke-width="9"/>
<path d="M 226 384 L 286 384" fill="none" stroke="#1a1a1a" stroke-width="9"/>
<path d="M 256 358 L 256 384" fill="none" stroke="#1a1a1a" stroke-width="9"/>
<!-- flat "no flavour" dashes -->
<line x1="222" y1="230" x2="262" y2="230" stroke="#b7ad95" stroke-width="7"/>
<line x1="282" y1="246" x2="316" y2="246" stroke="#b7ad95" stroke-width="7"/>
</g>

<!-- green arrow pointing at the plain (bland) bowl -->
<line x1="256" y1="150" x2="320" y2="210" stroke="#1a1a1a" stroke-width="22.0"/><line x1="320" y1="210" x2="320" y2="178" stroke="#1a1a1a" stroke-width="22.0"/><line x1="320" y1="210" x2="288" y2="210" stroke="#1a1a1a" stroke-width="22.0"/><line x1="256" y1="150" x2="320" y2="210" stroke="#2f9e4a" stroke-width="16.5"/>
<line x1="320" y1="210" x2="320" y2="178" stroke="#2f9e4a" stroke-width="16.5"/>
<line x1="320" y1="210" x2="288" y2="210" stroke="#2f9e4a" stroke-width="16.5"/>
</g>
</svg>
