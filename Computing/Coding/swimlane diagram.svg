<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Swimlane diagram: 3 horizontal labelled lanes with flow boxes and arrows -->

  <!-- Outer frame -->
  <rect x="24" y="26" width="242" height="188" rx="6" ry="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>

  <!-- Lane header column (left strip) -->
  <rect x="20" y="22" width="36" height="196" rx="6" ry="6" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>

  <!-- Lane divider lines (2 dividers = 3 lanes) -->
  <line x1="20" y1="87" x2="270" y2="87" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="20" y1="152" x2="270" y2="152" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Lane 1 header marker (coloured strip in header col) -->
  <rect x="21" y="23" width="34" height="63" rx="5" ry="5" fill="#2a4ec0"/>
  <!-- Lane 2 header -->
  <rect x="21" y="88" width="34" height="63" rx="5" ry="5" fill="#529929"/>
  <!-- Lane 3 header -->
  <rect x="21" y="153" width="34" height="64" rx="5" ry="5" fill="#f8130d"/>

  <!-- === Lane 1 flow (top, y centre ~54) === -->
  <!-- Box A -->
  <rect x="65" y="35" width="52" height="38" rx="5" ry="5" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Arrow A→B -->
  <line x1="117" y1="54" x2="137" y2="54" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <polygon points="147,54 133,47 133,61" fill="#000000"/>
  <!-- Box B -->
  <rect x="147" y="35" width="52" height="38" rx="5" ry="5" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Arrow B cross-lane down to lane 2 (from box B bottom) -->
  <line x1="173" y1="73" x2="173" y2="83" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>

  <!-- === Lane 2 flow (middle, y centre ~120) === -->
  <!-- Arrow entering lane 2 from lane 1 -->
  <line x1="173" y1="83" x2="173" y2="97" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <polygon points="173,107 166,93 180,93" fill="#000000"/>
  <!-- Box C -->
  <rect x="147" y="97" width="52" height="38" rx="5" ry="5" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Arrow C→D (rightward) -->
  <line x1="199" y1="116" x2="213" y2="116" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <polygon points="223,116 209,109 209,123" fill="#000000"/>
  <!-- Box D -->
  <rect x="223" y="97" width="42" height="38" rx="5" ry="5" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- === Lane 3 flow (bottom, y centre ~185) === -->
  <!-- Box E (start lane 3) -->
  <rect x="65" y="163" width="52" height="38" rx="5" ry="5" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Arrow E→F -->
  <line x1="117" y1="182" x2="137" y2="182" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <polygon points="147,182 133,175 133,189" fill="#000000"/>
  <!-- Box F -->
  <rect x="147" y="163" width="52" height="38" rx="5" ry="5" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
</g></svg>