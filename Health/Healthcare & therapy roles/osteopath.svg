<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- ground -->
  <rect x="0" y="218" width="290" height="22" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="5.56"/>

  <!-- treatment table -->
  <rect x="20" y="150" width="220" height="20" rx="3" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <rect x="30" y="170" width="8" height="48" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="222" y="170" width="8" height="48" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- PATIENT FULL BODY lying supine, leg being lifted -->
  <g>
    <!-- head -->
    <circle cx="50" cy="138" r="14" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.56"/>
    <path d="M36 134 Q42 122 50 122 Q58 122 64 134 Q58 128 50 128 Q42 128 36 134 Z" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.45"/>
    <circle cx="46" cy="138" r="1.5" fill="#000000"/>
    <circle cx="54" cy="138" r="1.5" fill="#000000"/>
    <path d="M47 144 Q50 146 53 144" fill="none" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
    <!-- neck -->
    <rect x="46" y="150" width="8" height="5" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45"/>
    <!-- torso (shirt) lying down -->
    <rect x="62" y="135" width="100" height="28" rx="4" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="5.56" stroke-linejoin="round"/>
    <!-- arms at side -->
    <rect x="62" y="137" width="50" height="9" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="4.45"/>
    <rect x="62" y="153" width="50" height="9" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="4.45"/>
    <!-- hips/shorts -->
    <rect x="162" y="135" width="20" height="28" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="5.56" stroke-linejoin="round"/>
    <!-- LEFT leg flat on table -->
    <rect x="180" y="148" width="60" height="12" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="5.56"/>
    <ellipse cx="244" cy="154" rx="6" ry="4" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45"/>
    <!-- RIGHT leg lifted being manipulated (raised diagonally) -->
    <path d="M178 138 L218 78 L230 90 L190 148 Z" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="5.56" stroke-linejoin="round"/>
    <!-- foot at top -->
    <ellipse cx="222" cy="80" rx="7" ry="5" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45" transform="rotate(-50 222 80)"/>
  </g>

  <!-- joint indicators (highlighted hip + knee) -->
  <circle cx="180" cy="138" r="6" fill="none" stroke="#d01424" stroke-width="5.56"/>
  <circle cx="205" cy="108" r="5" fill="none" stroke="#d01424" stroke-width="5.56"/>

  <!-- OSTEOPATH FULL BODY (right) hands on patient's lifted ankle -->
  <g transform="translate(245 90)">
    <circle cx="0" cy="0" r="12" fill="#e6b98a" stroke="#1a1a1a" stroke-width="5.56"/>
    <path d="M-12 0 Q-12 -14 0 -14 Q12 -14 12 0 Q12 5 10 8 L10 -5 Q5 -9 0 -9 Q-5 -9 -10 -5 L-10 8 Q-12 5 -12 0 Z" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="4.45"/>
    <circle cx="-4" cy="0" r="1.5" fill="#000000"/>
    <circle cx="4" cy="0" r="1.5" fill="#000000"/>
    <path d="M-3 6 Q0 8 3 6" fill="none" stroke="#1a1a1a" stroke-width="4.00" stroke-linecap="round"/>
    <rect x="-5" y="11" width="10" height="5" fill="#e6b98a" stroke="#1a1a1a" stroke-width="4.45"/>
    <!-- torso (scrubs) -->
    <rect x="-16" y="16" width="32" height="40" rx="3" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="5.56" stroke-linejoin="round"/>
    <!-- V-neck -->
    <path d="M-6 16 L0 26 L6 16" fill="#e6b98a" stroke="#1a1a1a" stroke-width="4.00"/>
    <!-- left arm reaching down/left to ankle -->
    <path d="M-16 20 L-32 -8 L-24 -12 L-12 14 Z" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="5.56" stroke-linejoin="round"/>
    <circle cx="-30" cy="-10" r="5" fill="#e6b98a" stroke="#1a1a1a" stroke-width="4.45"/>
    <!-- right arm down -->
    <rect x="16" y="18" width="8" height="32" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="4.45"/>
    <circle cx="20" cy="53" r="4" fill="#e6b98a" stroke="#1a1a1a" stroke-width="4.45"/>
    <!-- legs -->
    <rect x="-14" y="56" width="12" height="60" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="5.56"/>
    <rect x="2" y="56" width="12" height="60" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="5.56"/>
    <ellipse cx="-8" cy="118" rx="8" ry="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
    <ellipse cx="8" cy="118" rx="8" ry="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  </g>

  <!-- motion arrow showing manipulation direction -->
  <path d="M210 70 Q220 60 230 70" fill="none" stroke="#d01424" stroke-width="5.56" stroke-linecap="round"/>
  <polygon points="228,67 233,72 226,74" fill="#d01424" stroke="#1a1a1a" stroke-width="3.33"/>
</g></svg>