  <rect x="141" y="62" width="12" height="28" rx="5" fill="#9d7246" stroke="#1a1a1a" stroke-width="7.40" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Small eye -->
  <circle cx="148" cy="70" r="4" fill="#000000"/>
  <circle cx="147" cy="69" r="1.5" fill="#ffffff"/>
  <!-- Very long thin antennae - twig-like extensions -->
  <path d="M147 63 Q138 48 122 28" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M147 63 Q156 48 172 28" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- SIX extremely thin legs - splayed at angles, very fine -->
  <!-- Front left leg -->
  <path d="M141 94 Q118 88 95 80 Q80 76 68 82" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
