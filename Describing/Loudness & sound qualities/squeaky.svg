<svg xmlns="http://www.w3.org/2000/svg" viewBox="38.56 28.32 438.30 438.30"><!-- squeaky: rubber squeak toy duck being pressed, small high squeaks -->
<!-- body -->
<ellipse cx="220" cy="320" rx="118" ry="84" fill="#ffd23f" stroke="#1a1a1a" stroke-width="9"/>
<!-- tail -->
<path d="M 110 300 Q 70 286 70 320 Q 92 332 120 332 Z" fill="#ffd23f" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- head -->
<circle cx="300" cy="216" r="66" fill="#ffd23f" stroke="#1a1a1a" stroke-width="9"/>
<!-- beak -->
<path d="M 360 210 Q 412 198 412 222 Q 412 246 360 234 Z" fill="#f3902a" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- eye -->
<circle cx="312" cy="198" r="11" fill="#1a1a1a"/>
<!-- wing -->
<path d="M 200 300 Q 250 280 270 320 Q 240 350 200 340 Z" fill="#f7c52e" stroke="#1a1a1a" stroke-width="8" stroke-linejoin="round"/>
<!-- press arrow down on head -->
<path d="M 289.0 90.0 L 289.0 116.0 L 280.0 116.0 L 300.0 142.0 L 320.0 116.0 L 311.0 116.0 L 311.0 90.0 Z" fill="#2f9e4a" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- small high squeak marks -->
<g fill="none" stroke="#2f9e4a" stroke-width="8" stroke-linecap="round">
<path d="M 398 150 Q 414 138 426 150"/>
<path d="M 410 174 Q 430 158 446 174"/>
</g>
</svg>
