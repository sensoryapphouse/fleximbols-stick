  <!-- open drawer box, perspective: front lower, back upper -->
  <polygon points="30,200 260,200 240,80 50,80" fill="#9d7246" stroke="#1a1a1a" stroke-width="8.89" stroke-linejoin="round"/>
  <!-- drawer interior floor -->
  <polygon points="45,190 245,190 228,90 62,90" fill="#eed5b6" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- drawer front face -->
  <rect x="25" y="195" width="240" height="30" fill="#7d5e23" stroke="#1a1a1a" stroke-width="6.67"/>
  <!-- drawer pull handle -->
  <rect x="125" y="206" width="40" height="8" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- compartmented insert: 4 slots dividing the drawer -->
  <!-- slot 1 -->
  <polygon points="60,185 100,185 96,98 70,98" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- slot 2 -->
  <polygon points="105,185 145,185 138,98 102,98" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- slot 3 -->
  <polygon points="150,185 190,185 184,98 144,98" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- slot 4 -->
  <polygon points="195,185 235,185 226,98 190,98" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- contents: spatula in slot 1 -->
  <rect x="75" y="105" width="6" height="60" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="70" y="100" width="16" height="14" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- whisk in slot 2 -->
  <rect x="120" y="105" width="6" height="60" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="123" cy="100" rx="11" ry="9" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- ladle in slot 3 -->
  <rect x="165" y="105" width="6" height="55" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="168" cy="165" r="11" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- tongs in slot 4 -->
  <path d="M210 100 L207 165 L218 165 L215 100 Z" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
</g></svg>