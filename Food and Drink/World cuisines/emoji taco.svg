  <!-- Tomato chunks visible in filling -->
  <circle cx="90" cy="92" r="9" fill="#d01424" stroke="#1a1a1a" stroke-width="5.34"></circle>
  <circle cx="140" cy="86" r="9" fill="#d01424" stroke="#1a1a1a" stroke-width="5.34"></circle>
  <circle cx="190" cy="92" r="9" fill="#d01424" stroke="#1a1a1a" stroke-width="5.34"></circle>
  <!-- Cheese strips -->
