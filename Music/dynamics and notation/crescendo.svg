  <path d="M 215 85 Q 240 105 215 125" fill="none" stroke="#1a1a1a" stroke-width="5.18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 200 145 Q 215 155 200 165" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 215 135 Q 240 155 215 175" fill="none" stroke="#1a1a1a" stroke-width="5.18" stroke-linecap="round" stroke-linejoin="round"/>
