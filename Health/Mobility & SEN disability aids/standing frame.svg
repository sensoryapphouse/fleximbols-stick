<svg xmlns="http://www.w3.org/2000/svg" viewBox="75.64 82.46 360.73 360.73">
<!-- standing frame: upright support frame holding a person standing -->

<!-- ===== FRAME (behind the person) ===== -->
<!-- base bar -->
<line x1="140" y1="410" x2="372" y2="410" stroke="#1a1a1a" stroke-width="12" stroke-linecap="round"/>
<!-- base wheels -->
<circle cx="156" cy="420" r="16" fill="#cfd6dc" stroke="#1a1a1a" stroke-width="7"/>
<circle cx="356" cy="420" r="16" fill="#cfd6dc" stroke="#1a1a1a" stroke-width="7"/>
<!-- upright post (single central mast behind figure) -->
<line x1="330" y1="150" x2="330" y2="410" stroke="#1a1a1a" stroke-width="12" stroke-linecap="round"/>
<!-- support arms from mast to each pad -->
<line x1="330" y1="196" x2="272" y2="196" stroke="#1a1a1a" stroke-width="10" stroke-linecap="round"/>
<line x1="330" y1="300" x2="272" y2="300" stroke="#1a1a1a" stroke-width="10" stroke-linecap="round"/>

<!-- ===== PERSON (standing, supported) ===== -->
<!-- head -->
<circle cx="216" cy="150" r="40" fill="#f5d6b0" stroke="#1a1a1a" stroke-width="10"/>
<!-- body/torso -->
<path d="M 190 200 Q 216 186 242 200 L 240 300 L 192 300 Z" fill="#3aa6d6" stroke="#1a1a1a" stroke-width="10" stroke-linejoin="round"/>
<!-- arms resting on chest support -->
<path d="M 192 214 Q 168 240 190 268" fill="none" stroke="#f5d6b0" stroke-width="18" stroke-linecap="round"/>
<path d="M 240 214 Q 264 240 250 262" fill="none" stroke="#f5d6b0" stroke-width="18" stroke-linecap="round"/>
<!-- legs -->
<line x1="204" y1="300" x2="204" y2="386" stroke="#2b6c8f" stroke-width="18" stroke-linecap="round"/>
<line x1="228" y1="300" x2="228" y2="386" stroke="#2b6c8f" stroke-width="18" stroke-linecap="round"/>

<!-- ===== SUPPORT PADS (in front, holding the person) ===== -->
<!-- chest / trunk support pad -->
<rect x="184" y="214" width="92" height="34" rx="12" fill="#3fae5a" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- knee support pad -->
<rect x="188" y="316" width="84" height="30" rx="12" fill="#d23c3c" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- foot plate -->
<rect x="176" y="386" width="108" height="22" rx="6" fill="#f3d27a" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
</svg>
