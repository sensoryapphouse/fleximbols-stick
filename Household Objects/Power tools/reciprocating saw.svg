  <!-- reciprocating-saw: long horizontal sawzall, long straight blade out the front, barrel grip -->
  <!-- Long straight blade sticking out front (left side) -->
  <rect x="22" y="113" width="120" height="12" rx="3" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.71"/>
  <!-- Blade teeth on bottom edge -->
  <polyline points="22,125 30,135 38,125 46,135 54,125 62,135 70,125 78,135 86,125 94,135 102,125 110,135 118,125 126,135 134,130 142,125" fill="none" stroke="#1a1a1a" stroke-width="3.81" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Blade clamp / chuck at front of tool -->
  <rect x="130" y="108" width="22" height="22" rx="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="6.34"/>
  <!-- Long horizontal tool body / barrel -->
  <rect x="148" y="98" width="120" height="42" rx="14" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="6.34"/>
  <!-- Barrel grip detail (ridged grip area) -->
  <rect x="148" y="98" width="45" height="42" rx="14" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.08"/>
  <!-- Barrel grip ridges -->
  <line x1="158" y1="100" x2="158" y2="138" stroke="#4d4d4d" stroke-width="3.81" stroke-linecap="round"/>
  <line x1="168" y1="100" x2="168" y2="138" stroke="#4d4d4d" stroke-width="3.81" stroke-linecap="round"/>
  <line x1="178" y1="100" x2="178" y2="138" stroke="#4d4d4d" stroke-width="3.81" stroke-linecap="round"/>
  <line x1="188" y1="100" x2="188" y2="138" stroke="#4d4d4d" stroke-width="3.81" stroke-linecap="round"/>
  <!-- Motor housing bump (rounded body section) -->
  <ellipse cx="220" cy="119" rx="28" ry="22" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Ventilation slots -->
  <line x1="210" y1="100" x2="210" y2="138" stroke="#1a1a1a" stroke-width="2.54" stroke-linecap="round"/>
  <line x1="240" y1="100" x2="240" y2="138" stroke="#1a1a1a" stroke-width="2.54" stroke-linecap="round"/>
  <!-- Pistol grip handle pointing down -->
  <path d="M240,135 Q248,135 252,145 Q256,160 250,175 Q244,188 235,185 Q226,182 226,168 Q225,155 232,145 Q236,138 240,135Z" fill="#ff9900" stroke="#1a1a1a" stroke-width="6.34" stroke-linejoin="round"/>
  <!-- Trigger -->
  <rect x="228" y="148" width="12" height="18" rx="4" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Speed dial / switch on side -->
  <circle cx="262" cy="108" r="9" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="262" y1="100" x2="262" y2="104" stroke="#1a1a1a" stroke-width="3.18" stroke-linecap="round"/>
  <!-- Cord / tail at rear -->
  <path d="M268,115 Q278,115 284,120 Q288,128 282,135" fill="none" stroke="#1a1a1a" stroke-width="6.34" stroke-linecap="round"/>
</g></svg>