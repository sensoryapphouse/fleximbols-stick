  <!-- Storm cloud at top: thick dark base cloud -->
  <path d="M60,68 Q50,52 68,44 Q76,30 98,32 Q110,16 135,18 Q158,10 176,26 Q196,22 210,36 Q230,36 238,52 Q250,58 246,72 Q238,82 215,78 L90,78 Q70,82 60,68 Z" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="8.89" stroke-linejoin="round"/>
