  <line x1="55" y1="120" x2="180" y2="120" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="55" y1="135" x2="180" y2="135" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- tick marks band 1 -->
  <line x1="60" y1="97" x2="60" y2="105" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="75" y1="97" x2="75" y2="105" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="90" y1="97" x2="90" y2="105" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="105" y1="97" x2="105" y2="105" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="120" y1="97" x2="120" y2="105" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="135" y1="97" x2="135" y2="105" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="150" y1="97" x2="150" y2="105" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="165" y1="97" x2="165" y2="105" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- tick marks band 2 -->
  <line x1="60" y1="112" x2="60" y2="120" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="80" y1="112" x2="80" y2="120" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="100" y1="112" x2="100" y2="120" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="120" y1="112" x2="120" y2="120" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="140" y1="112" x2="140" y2="120" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="160" y1="112" x2="160" y2="120" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- tick marks band 3 -->
  <line x1="60" y1="127" x2="60" y2="135" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="85" y1="127" x2="85" y2="135" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="110" y1="127" x2="110" y2="135" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="135" y1="127" x2="135" y2="135" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="160" y1="127" x2="160" y2="135" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- needle (red vertical) -->
  <line x1="110" y1="92" x2="110" y2="148" stroke="#f8130d" stroke-width="8.89" stroke-linecap="round"/>
