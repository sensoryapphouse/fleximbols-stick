  <!-- folded cloth diaper (square folded into triangle shape) -->
  <!-- back layer (cloth fold) -->
  <path d="M 50 60 L 240 60 L 220 200 L 70 200 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="6.67" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- diagonal fold lines -->
  <path d="M 50 60 L 145 130 L 240 60" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- center triangle fold flap -->
  <path d="M 70 200 L 145 130 L 220 200 Z" fill="#efefef" stroke="#1a1a1a" stroke-width="6.67" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- top edge stitching -->
  <path d="M 55 65 L 235 65" fill="none" stroke="#1a1a1a" stroke-width="3.33" stroke-dasharray="4 3"/>
  <!-- bottom hem stitching -->
  <path d="M 73 195 L 217 195" fill="none" stroke="#1a1a1a" stroke-width="3.33" stroke-dasharray="4 3"/>
  <!-- safety pin at center top of front fold -->
  <ellipse cx="145" cy="100" rx="22" ry="8" fill="none" stroke="#7f7f7f" stroke-width="6.67"/>
  <line x1="125" y1="100" x2="165" y2="100" stroke="#7f7f7f" stroke-width="6.67" stroke-linecap="round"/>
  <!-- pin head cap -->
  <path d="M 162 92 L 172 92 L 172 108 L 162 108 Z" fill="#f2e40d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- pin point -->
  <path d="M 122 100 L 118 96 L 118 104 Z" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <!-- outline around pin assembly -->
  <ellipse cx="145" cy="100" rx="22" ry="8" fill="none" stroke="#1a1a1a" stroke-width="4.45"/>
</g></svg>