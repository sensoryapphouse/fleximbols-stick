  <rect x="143" y="116" width="10" height="28" rx="4" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="3.55" stroke-linejoin="round"/>
  <!-- right arm reaching up-right to hold -->
  <line x1="153" y1="120" x2="165" y2="108" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
