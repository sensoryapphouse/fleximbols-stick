<line x1="380" y1="355" x2="416" y2="355" stroke="#e0473c" stroke-width="6" stroke-linecap="round"/>
<line x1="386" y1="349" x2="386" y2="361" stroke="#e0473c" stroke-width="4" stroke-linecap="round"/>
<line x1="396" y1="349" x2="396" y2="361" stroke="#e0473c" stroke-width="4" stroke-linecap="round"/>
<line x1="406" y1="349" x2="406" y2="361" stroke="#e0473c" stroke-width="4" stroke-linecap="round"/>

<!-- ===== surgeon figure (left) ===== -->
<!-- legs -->
<line x1="171" y1="318" x2="162" y2="455" stroke="#39425c" stroke-width="16.0" stroke-linecap="round"/>
