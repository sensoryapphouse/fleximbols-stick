<svg xmlns="http://www.w3.org/2000/svg" viewBox="96.00 84.91 320.00 320.00"><!-- square-based pyramid: apex top, square base in perspective; front face + right side face (darker) -->
<!-- base square corners: front-left FL, front-right FR(closest), back-right BR, back-left BL -->
<!-- right side face (darker) -->
<polygon points="256,110 380,300 256,380" fill="#d98a3f" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- front-left face (lighter) -->
<polygon points="256,110 132,300 256,380" fill="#f3b870" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- visible back-left base edge (dashed-style hidden shown as thin) -->
<polyline points="132,300 256,250 380,300" fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round" stroke-dasharray="14 12"/>
</svg>
