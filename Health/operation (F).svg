<ellipse cx="162" cy="457" rx="13" ry="7" fill="#33373d"/>
<ellipse cx="210" cy="457" rx="13" ry="7" fill="#33373d"/>
<!-- teal scrubs torso -->
<polygon points="154,212 218,212 216,320 156,320" fill="#2f9e8f" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
