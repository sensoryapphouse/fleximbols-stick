  <line x1="190" y1="70" x2="200" y2="70" stroke="#b8b8b8" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="190" y1="82" x2="200" y2="82" stroke="#b8b8b8" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="190" y1="94" x2="200" y2="94" stroke="#b8b8b8" stroke-width="4.45" stroke-linecap="round"/>
