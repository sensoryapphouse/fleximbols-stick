  <!-- Long narrow rectangular loaf pan, slight 3D perspective -->
  <!-- Back rim ellipse -->
  <ellipse cx="145" cy="80" rx="115" ry="20" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Inner cavity (darker) -->
  <ellipse cx="145" cy="80" rx="100" ry="13" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Body of pan: long narrow trapezoid sides -->
  <path d="M 30 80 L 45 175 L 245 175 L 260 80 Z" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.93" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Front rim highlight line -->
  <path d="M 45 175 L 245 175" fill="none" stroke="#4d4d4d" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Side handle lugs -->
  <path d="M 30 80 L 22 95 L 38 100 L 45 90" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 260 80 L 268 95 L 252 100 L 245 90" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bread loaf inside, peeking above rim -->
  <path d="M 55 75 Q 145 30 235 75 L 230 82 Q 145 50 60 82 Z" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Loaf top scoring -->
  <path d="M 90 60 L 110 50" fill="none" stroke="#5e1f0a" stroke-width="2.96" stroke-linecap="round"/>
  <path d="M 140 45 L 160 45" fill="none" stroke="#5e1f0a" stroke-width="2.96" stroke-linecap="round"/>
  <path d="M 190 50 L 210 60" fill="none" stroke="#5e1f0a" stroke-width="2.96" stroke-linecap="round"/>
  <!-- Bottom shadow on pan -->
  <path d="M 50 175 L 245 175" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
</g></svg>