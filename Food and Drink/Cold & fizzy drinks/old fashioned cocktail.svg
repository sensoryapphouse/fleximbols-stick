  <circle cx="178" cy="90" r="10" fill="#d01424" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- cherry stem -->
  <path d="M170 40 Q166 32 162 30" fill="none" stroke="#5e1f0a" stroke-width="4.45" stroke-linecap="round"/>
