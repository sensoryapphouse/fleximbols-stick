  <!-- small smooth round dish, no ribs, slightly larger than ramekin -->
  <ellipse cx="145" cy="205" rx="88" ry="14" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- body sides smooth -->
