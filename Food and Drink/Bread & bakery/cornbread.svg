  <!-- Top surface texture (crumb dots) -->
  <circle cx="110" cy="100" r="4" fill="#e65a00" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="135" cy="98" r="3" fill="#ff9900" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="155" cy="102" r="4" fill="#e65a00" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="178" cy="99" r="3" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="195" cy="103" r="3" fill="#ff9900" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Front face crumb texture -->
  <circle cx="100" cy="140" r="5" fill="#f2e40d" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="130" cy="148" r="4" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="155" cy="135" r="5" fill="#f2e40d" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="178" cy="150" r="4" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="195" cy="142" r="4" fill="#f2e40d" stroke="#1a1a1a" stroke-width="4.45"/>
