  <!-- AirPods case: tall rounded-square shape, hinged lid open at top -->
  <!-- Case body -->
  <rect x="80" y="100" width="130" height="130" rx="30" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Inner well -->
  <rect x="95" y="112" width="100" height="108" rx="22" fill="#efefef" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lid open (tall, hinged at back top) -->
  <rect x="80" y="18" width="130" height="90" rx="30" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lid inner face -->
  <rect x="95" y="28" width="100" height="72" rx="22" fill="#efefef" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hinge joining lid to body (small band at back) -->
  <rect x="118" y="100" width="54" height="10" rx="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left AirPod in case: round head + long stem -->
  <!-- Left head (round bud) -->
  <circle cx="116" cy="138" r="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Left stem -->
  <rect x="110" y="152" width="12" height="40" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right AirPod in case: round head + long stem -->
  <!-- Right head -->
  <circle cx="174" cy="138" r="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Right stem -->
  <rect x="168" y="152" width="12" height="40" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Front status LED -->
  <circle cx="145" cy="221" r="5" fill="#529929" stroke="#1a1a1a" stroke-width="2.22"/>
  <!-- Lightning/USB port hint at bottom -->
  <rect x="137" y="228" width="16" height="5" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="2.22"/>
</g></svg>