<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Single plantain chip - round/oval coin shape, golden-yellow with brown edge -->
  <!-- Outer chip edge - slightly oval, with brown rim indicating fried edge -->
  <ellipse cx="145" cy="130" rx="105" ry="90" fill="#e65a00" stroke="#1a1a1a" stroke-width="13.34" stroke-linejoin="round"/>
  <!-- Inner chip face - golden yellow flesh color -->
  <ellipse cx="145" cy="130" rx="95" ry="80" fill="#ff9900" stroke="#1a1a1a" stroke-width="8.89" stroke-linejoin="round"/>
  <!-- Chip face - lighter center shows tostado/fried color -->
  <ellipse cx="145" cy="128" rx="82" ry="68" fill="#f7de58" stroke="none"/>
  <ellipse cx="140" cy="125" rx="56" ry="46" fill="#f2e40d" stroke="none"/>
  <!-- Plantain fiber lines - characteristic starchy texture markings -->
  <line x1="80" y1="100" x2="210" y2="100" stroke="#ff9900" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="68" y1="118" x2="222" y2="118" stroke="#ff9900" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="64" y1="136" x2="226" y2="136" stroke="#ff9900" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="68" y1="154" x2="222" y2="154" stroke="#ff9900" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="80" y1="170" x2="210" y2="170" stroke="#ff9900" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Brown caramelised spots - characteristic of plantain chip -->
  <ellipse cx="112" cy="112" rx="16" ry="10" fill="#e65a00" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="178" cy="148" rx="14" ry="10" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="155" cy="108" rx="10" ry="7" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="118" cy="152" rx="12" ry="8" fill="#e65a00" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Salt specks -->
  <circle cx="145" cy="122" r="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.22"/>
  <circle cx="165" cy="135" r="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.22"/>
  <circle cx="128" cy="140" r="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.22"/>
</g></svg>