  <!-- Simple desk cradle/easel — passive, no loop or knob -->
  <!-- Base plate of cradle -->
  <rect x="70" y="190" width="150" height="16" rx="7" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Rear support prop (angled back strut) -->
  <line x1="185" y1="190" x2="210" y2="115" stroke="#7f7f7f" stroke-width="8.88" stroke-linecap="round"/>
  <!-- Prop tip rounded cap -->
  <circle cx="210" cy="115" r="6" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="2.66"/>
  <!-- Bottom cradle lip/ledge (phone rests here) -->
  <rect x="88" y="172" width="114" height="22" rx="6" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Phone (front face) sitting in cradle, portrait -->
  <rect x="100" y="55" width="90" height="125" rx="13" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Phone screen -->
  <rect x="110" y="65" width="70" height="100" rx="7" fill="#dff3fd" stroke="#1a1a1a" stroke-width="2.66" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Front camera dot -->
  <circle cx="145" cy="62" r="4" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="1.78"/>
</g></svg>