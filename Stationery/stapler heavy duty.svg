  <!-- Heavy-duty stapler: extra tall body, long arm, chunky profile -->
  <!-- Base platform -->
  <rect x="30" y="178" width="230" height="28" rx="8" ry="8" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Anvil strip on base -->
