  <circle cx="220" cy="55" r="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.93"/>
  <line x1="220" y1="55" x2="220" y2="38" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="220" y1="55" x2="232" y2="55" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <circle cx="220" cy="55" r="2" fill="#000000"/>
  <circle cx="220" cy="35" r="2" fill="#000000"/>
  <circle cx="240" cy="55" r="2" fill="#000000"/>
  <circle cx="200" cy="55" r="2" fill="#000000"/>
  <circle cx="220" cy="75" r="2" fill="#000000"/>
  <!-- Curved arrow between clocks (day change) -->
  <path d="M 250 75 Q 265 90 250 105" fill="none" stroke="#f8130d" stroke-width="5.93" stroke-linecap="round"/>
  <polygon points="250,105 244,98 256,97" fill="#f8130d" stroke="#1a1a1a" stroke-width="2.96" stroke-linejoin="round"/>
  <!-- Second clock -->
