<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Single cylindrical pen/pencil holder cup -->

  <!-- Cup body (cylinder) -->
  <!-- Bottom ellipse -->
  <ellipse cx="145" cy="198" rx="60" ry="18" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Cup walls -->
  <rect x="85" y="120" width="120" height="78" rx="0" fill="#2a4ec0" stroke="none"/>
  <!-- Side strokes for cylinder -->
  <line x1="85" y1="120" x2="85" y2="198" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <line x1="205" y1="120" x2="205" y2="198" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <!-- Top opening ellipse -->
  <ellipse cx="145" cy="120" rx="60" ry="18" fill="#1d0e82" stroke="#1a1a1a" stroke-width="5.55"/>

  <!-- PENCIL 1 (yellow, tallest, leftmost) -->
  <rect x="100" y="32" width="14" height="96" rx="4" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Pencil tip -->
  <polygon points="100,32 114,32 107,16" fill="#eed5b6" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <!-- Graphite point -->
  <polygon points="104,18 110,18 107,10" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.22" stroke-linejoin="round"/>
  <!-- Eraser band -->
  <rect x="100" y="120" width="14" height="8" rx="0" fill="#f266aa" stroke="#1a1a1a" stroke-width="3.33"/>

  <!-- PENCIL 2 (red pen, medium height) -->
  <rect x="121" y="44" width="12" height="84" rx="4" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polygon points="121,44 133,44 127,28" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <!-- Pen click top -->
  <rect x="123" y="44" width="8" height="8" rx="2" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="3.33"/>

  <!-- PENCIL 3 (blue pen, slightly shorter) -->
  <rect x="140" y="50" width="12" height="78" rx="4" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polygon points="140,50 152,50 146,34" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <!-- Clip on side -->
  <rect x="150" y="36" width="4" height="40" rx="2" fill="#90a7d6" stroke="#1a1a1a" stroke-width="2.22"/>
  <ellipse cx="152" cy="76" rx="4" ry="3" fill="#90a7d6" stroke="#1a1a1a" stroke-width="2.22"/>

  <!-- PENCIL 4 (green marker, slightly angled) -->
  <rect x="159" y="42" width="14" height="86" rx="4" fill="#529929" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Marker cap -->
  <rect x="157" y="32" width="18" height="16" rx="4" fill="#67832d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- PENCIL 5 (orange marker, shortest) -->
  <rect x="180" y="56" width="12" height="72" rx="4" fill="#ff9900" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="178" y="46" width="16" height="14" rx="4" fill="#e65a00" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- Cup decorative band near top -->
  <rect x="85" y="130" width="120" height="10" rx="0" fill="#90a7d6" stroke="#1a1a1a" stroke-width="3.33"/>
</g></svg>