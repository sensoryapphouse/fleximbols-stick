  <!-- Sharp pointed peaks above rim (stiff - tall, narrow, pointed straight up) -->
  <path d="M50 144 L78 90 L100 144 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <path d="M95 144 L130 60 L160 144 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
