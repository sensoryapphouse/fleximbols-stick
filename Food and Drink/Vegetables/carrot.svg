<line x1="256" y1="196" x2="256" y2="140" stroke="#2e7d40" stroke-width="9" stroke-linecap="round"/>
<line x1="282" y1="196" x2="292" y2="150" stroke="#2e7d40" stroke-width="9" stroke-linecap="round"/>
<!-- leafy top: three sprigs sitting on the root shoulders -->
