<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Angle grinder: long barrel body, round abrasive disc at right angle at head, half guard, side handle -->

  <!-- Main barrel body (long horizontal) -->
  <rect x="30" y="95" width="170" height="50" rx="16" ry="16" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="7.40"/>

  <!-- Grip / rubber rear section -->
  <rect x="30" y="98" width="70" height="44" rx="14" ry="14" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="7.40"/>
  <!-- Grip texture bands -->
  <line x1="45" y1="98" x2="45" y2="142" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="58" y1="98" x2="58" y2="142" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="71" y1="98" x2="71" y2="142" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="84" y1="98" x2="84" y2="142" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Side handle (threaded stub on side, top of barrel, near front) -->
  <line x1="140" y1="95" x2="140" y2="68" stroke="#7f7f7f" stroke-width="11.85" stroke-linecap="round"/>
  <ellipse cx="140" cy="62" rx="12" ry="9" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="7.40"/>

  <!-- Power switch / paddle -->
  <rect x="105" y="88" width="35" height="14" rx="5" ry="5" fill="#f8130d" stroke="#1a1a1a" stroke-width="5.93"/>

  <!-- Gear head housing (slightly wider section at front) -->
  <rect x="195" y="85" width="40" height="70" rx="8" ry="8" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="7.40"/>
  <!-- Gear housing rib -->
  <line x1="195" y1="110" x2="235" y2="110" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Disc spindle -->
  <circle cx="215" cy="155" r="8" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.93"/>

  <!-- Abrasive disc (round, at right angle — hanging below head, center at gear head bottom) -->
  <circle cx="215" cy="172" r="42" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="7.40"/>
  <!-- Disc face texture (abrasive pattern — concentric rings) -->
  <circle cx="215" cy="172" r="32" fill="none" stroke="#7f7f7f" stroke-width="4.45"/>
  <circle cx="215" cy="172" r="20" fill="none" stroke="#7f7f7f" stroke-width="2.96"/>
  <circle cx="215" cy="172" r="10" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.93"/>
  <!-- Center arbor hole -->
  <circle cx="215" cy="172" r="4" fill="#000000" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- Radial lines for abrasive texture -->
  <line x1="215" y1="130" x2="215" y2="140" stroke="#4d4d4d" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="215" y1="204" x2="215" y2="214" stroke="#4d4d4d" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="173" y1="172" x2="183" y2="172" stroke="#4d4d4d" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="247" y1="172" x2="257" y2="172" stroke="#4d4d4d" stroke-width="2.96" stroke-linecap="round"/>

  <!-- Half guard (semi-circle over the top of the disc) -->
  <path d="M 180,155 Q 180,128 215,128 Q 250,128 250,155" fill="#f8130d" stroke="#1a1a1a" stroke-width="7.40" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Guard edge thickness -->
  <path d="M 180,155 L 178,162 Q 178,135 215,135 Q 252,135 252,162 L 250,155" fill="none" stroke="#1a1a1a" stroke-width="5.93" stroke-linecap="round"/>
</g></svg>