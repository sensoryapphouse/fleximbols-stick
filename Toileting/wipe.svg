<!-- the surface being wiped (a seat / bottom surface band) -->
<rect x="120" y="350" width="272" height="40" rx="20" fill="#dfe6ec" stroke="#1a1a1a" stroke-width="5"/>
<!-- motion arcs showing the wiping sweep across the surface -->
<path d="M 150 318 Q 210 300 268 318" fill="none" stroke="#e0473c" stroke-width="7" stroke-linecap="round"/>
<path d="M 168 296 Q 222 280 276 296" fill="none" stroke="#e0473c" stroke-width="7" stroke-linecap="round"/>
<!-- arrowhead on the upper motion arc (direction of wipe) -->
<path d="M 288.0 300.0 L 263.2 306.2 L 270.6 281.3 Z" fill="#e0473c" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
<!-- folded piece of paper / wipe being pressed on the surface, peeking out under the hand -->
<path d="M 238 318 L 340 318 L 330 362 L 228 362 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
<!-- fold lines on the paper -->
<line x1="272" y1="318" x2="262" y2="362" stroke="#cdd3da" stroke-width="3" stroke-linecap="round"/>
<line x1="306" y1="318" x2="298" y2="362" stroke="#cdd3da" stroke-width="3" stroke-linecap="round"/>
<!-- hand gripping the paper, pressing down on the surface -->
<ellipse cx="290" cy="332" rx="40" ry="26" fill="#f1c9a5" stroke="#1a1a1a" stroke-width="5"/>
<rect x="262" y="312" width="16" height="34" rx="8" fill="#f1c9a5" stroke="#1a1a1a" stroke-width="4"/>
<rect x="284" y="308" width="16" height="34" rx="8" fill="#f1c9a5" stroke="#1a1a1a" stroke-width="4"/>
<rect x="306" y="312" width="16" height="34" rx="8" fill="#f1c9a5" stroke="#1a1a1a" stroke-width="4"/>
<!-- wrist -->
<rect x="306" y="330" width="44" height="26" rx="13" fill="#f1c9a5" stroke="#1a1a1a" stroke-width="5"/>
</g></svg>
