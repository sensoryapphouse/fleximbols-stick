<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Rollerball pen: cap (no clicker), smooth dark ink line, intermediate style -->

  <!-- Cap (left end, separate removable cap) -->
  <rect x="22" y="100" width="38" height="34" rx="10" ry="10" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Cap clip -->
  <rect x="54" y="103" width="7" height="48" rx="3" ry="3" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <ellipse cx="57" cy="153" rx="4" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Cap dome top -->
  <ellipse cx="41" cy="100" rx="19" ry="7" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Barrel body: dark, matte finish -->
  <rect x="60" y="103" width="162" height="28" rx="5" ry="5" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Accent band near tip -->
  <rect x="185" y="105" width="16" height="24" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Barrel shine stripe -->
  <rect x="65" y="105" width="135" height="8" rx="3" fill="#7f7f7f" stroke="none"/>

  <!-- Tip section: metal, slim -->
  <rect x="201" y="106" width="34" height="22" rx="3" ry="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Tip cone -->
  <path d="M 235,108 L 260,117 L 235,126 Z" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Rollerball nib tip -->
  <circle cx="260" cy="117" r="3.5" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="2.22"/>

  <!-- Smooth flowing dark ink line (medium weight, even, darker than ballpoint) -->
  <path d="M 75,160 Q 130,153 195,158 Q 228,161 260,157" fill="none" stroke="#1d0e82" stroke-width="5.55" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Second smooth line showing even ink flow -->
  <path d="M 80,173 Q 140,167 210,173 Q 235,175 260,172" fill="none" stroke="#1d0e82" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
</g></svg>