<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Sarod: fretless lute, shiny metal fingerboard, rounded skin-covered body, small round metal resonator at top, short neck -->
  <!-- Main rounded body (wider lower section, skin-covered) -->
  <ellipse cx="145" cy="178" rx="62" ry="50" fill="#9d7246" stroke="#1a1a1a" stroke-width="7.40"/>
  <!-- Skin covering on body (slightly lighter, textured) -->
  <ellipse cx="145" cy="178" rx="62" ry="50" fill="#eed5b6" stroke="#1a1a1a" stroke-width="7.40"/>
  <!-- Body center detail ring -->
  <ellipse cx="145" cy="178" rx="30" ry="24" fill="#e6b98a" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Short neck with SHINY METAL fingerboard -->
  <rect x="133" y="78" width="24" height="105" rx="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="7.40"/>
  <!-- Metal fingerboard shine -->
  <rect x="137" y="82" width="12" height="97" rx="2" fill="#efefef" stroke="#1a1a1a" stroke-width="0.00"/>
  <!-- No fret lines (fretless) -->
  <!-- Small round metal resonator at TOP of neck -->
  <circle cx="145" cy="58" r="22" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="7.40"/>
  <circle cx="145" cy="58" r="15" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="145" cy="58" r="8" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- Resonator connects to neck -->
  <rect x="136" y="76" width="18" height="8" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Headstock (short, above resonator) -->
  <rect x="130" y="22" width="30" height="20" rx="4" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="7.40"/>
  <!-- Neck from headstock to resonator -->
  <rect x="138" y="36" width="14" height="24" rx="3" fill="#7d5e23" stroke="#1a1a1a" stroke-width="5.93"/>
  <!-- Tuning pegs -->
  <circle cx="136" cy="18" r="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="2.96"/>
  <circle cx="143" cy="18" r="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="2.96"/>
  <circle cx="150" cy="18" r="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="2.96"/>
  <circle cx="157" cy="18" r="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- Strings (4+) -->
  <line x1="137" y1="22" x2="135" y2="220" stroke="#1a1a1a" stroke-width="2.96"/>
  <line x1="142" y1="22" x2="141" y2="220" stroke="#1a1a1a" stroke-width="2.96"/>
  <line x1="147" y1="22" x2="148" y2="220" stroke="#1a1a1a" stroke-width="2.96"/>
  <line x1="152" y1="22" x2="153" y2="220" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- Bridge on body -->
  <rect x="133" y="215" width="24" height="6" rx="2" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="4.45"/>
</g><g transform="translate(360 8) scale(0.2812)"><defs><radialGradient id="plg2519" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#plg2519)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>