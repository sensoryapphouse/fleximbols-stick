<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- megayacht: large multi-deck luxury MOTOR yacht (no sails), 2-3 tiered decks, sleek white superstructure -->

  <!-- water band -->
  <path d="M 0 192 Q 36 183 72 192 Q 108 201 144 192 Q 180 183 216 192 Q 252 201 290 192 L 290 240 L 0 240 Z" fill="#2a4ec0" stroke="none"/>
  <path d="M 0 192 Q 36 183 72 192 Q 108 201 144 192 Q 180 183 216 192 Q 252 201 290 192" fill="none" stroke="#1a1a1a" stroke-width="5.33" stroke-linecap="round"/>

  <!-- main hull (sleek, long) -->
  <path d="M 25 182 Q 35 198 80 202 Q 150 208 215 204 L 258 192 L 250 178 L 80 178 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="8.89" stroke-linejoin="round"/>

  <!-- hull blue waterline stripe -->
  <path d="M 50 196 Q 120 203 195 200 L 240 194 L 238 190 Q 188 197 115 194 L 55 190 Z" fill="#2a4ec0" stroke="none"/>

  <!-- DECK 1 - main deck (widest) -->
  <rect x="65" y="158" width="185" height="22" rx="3" fill="#efefef" stroke="#1a1a1a" stroke-width="7.11" stroke-linejoin="round"/>

  <!-- bow swim platform / foredeck extension -->
  <rect x="240" y="168" width="20" height="12" rx="2" fill="#efefef" stroke="#1a1a1a" stroke-width="5.33"/>

  <!-- DECK 2 - bridge deck (narrower, higher) -->
  <rect x="80" y="126" width="145" height="35" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="7.11" stroke-linejoin="round"/>
  <!-- deck 2 windows - row of rectangular windows -->
  <rect x="90" y="133" width="22" height="14" rx="3" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="118" y="133" width="22" height="14" rx="3" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="146" y="133" width="22" height="14" rx="3" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="174" y="133" width="22" height="14" rx="3" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="202" y="133" width="16" height="14" rx="3" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- DECK 3 - upper/fly bridge (narrower) -->
  <rect x="100" y="100" width="105" height="28" rx="4" fill="#efefef" stroke="#1a1a1a" stroke-width="7.11" stroke-linejoin="round"/>
  <!-- deck 3 windows -->
  <rect x="110" y="107" width="18" height="12" rx="2" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="134" y="107" width="18" height="12" rx="2" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="158" y="107" width="18" height="12" rx="2" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="182" y="107" width="14" height="12" rx="2" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- radar arch / comms mast -->
  <line x1="125" y1="100" x2="120" y2="62" stroke="#4d4d4d" stroke-width="7.11" stroke-linecap="round"/>
  <line x1="185" y1="100" x2="180" y2="62" stroke="#4d4d4d" stroke-width="7.11" stroke-linecap="round"/>
  <line x1="120" y1="62" x2="180" y2="62" stroke="#4d4d4d" stroke-width="7.11" stroke-linecap="round"/>

  <!-- radar dome -->
  <ellipse cx="150" cy="62" rx="18" ry="10" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.33"/>
  <!-- antenna -->
  <line x1="150" y1="52" x2="150" y2="38" stroke="#4d4d4d" stroke-width="5.33" stroke-linecap="round"/>
  <!-- flag at top -->
  <path d="M 150 37 L 168 31 L 150 25 Z" fill="#f8130d" stroke="#1a1a1a" stroke-width="2.67"/>

  <!-- tender garage / transom door at stern -->
  <rect x="35" y="180" width="32" height="18" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.33"/>
  <line x1="35" y1="189" x2="67" y2="189" stroke="#4d4d4d" stroke-width="3.56"/>

  <!-- exhaust stacks -->
  <rect x="218" y="150" width="8" height="22" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="3.56"/>
  <rect x="230" y="150" width="8" height="22" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="3.56"/>

  <!-- deck railing lines -->
  <line x1="65" y1="158" x2="250" y2="158" stroke="#b8b8b8" stroke-width="3.56"/>
  <line x1="80" y1="126" x2="225" y2="126" stroke="#b8b8b8" stroke-width="3.56"/>
</g><g transform="translate(360 8) scale(0.2812)"><defs><radialGradient id="plg3530" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#plg3530)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>