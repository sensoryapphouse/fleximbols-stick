  <line x1="174" y1="188" x2="169" y2="191" stroke="#529929" stroke-width="2.22" stroke-linecap="round"/>
  <!-- 8 broad evenly-spaced flat petals (pink) around small yellow centre -->
  <!-- petals spaced at 45 degrees -->
  <!-- petal 0 deg (top) -->
  <ellipse cx="145" cy="85" rx="18" ry="36" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="8.89"/>
  <!-- petal 45 deg -->
  <ellipse cx="145" cy="85" rx="18" ry="36" transform="rotate(45 145 133)" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="8.89"/>
  <!-- petal 90 deg -->
  <ellipse cx="145" cy="85" rx="18" ry="36" transform="rotate(90 145 133)" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="8.89"/>
  <!-- petal 135 deg -->
  <ellipse cx="145" cy="85" rx="18" ry="36" transform="rotate(135 145 133)" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="8.89"/>
  <!-- petal 180 deg -->
  <ellipse cx="145" cy="85" rx="18" ry="36" transform="rotate(180 145 133)" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="8.89"/>
  <!-- petal 225 deg -->
  <ellipse cx="145" cy="85" rx="18" ry="36" transform="rotate(225 145 133)" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="8.89"/>
  <!-- petal 270 deg -->
  <ellipse cx="145" cy="85" rx="18" ry="36" transform="rotate(270 145 133)" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="8.89"/>
  <!-- petal 315 deg -->
  <ellipse cx="145" cy="85" rx="18" ry="36" transform="rotate(315 145 133)" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="8.89"/>
