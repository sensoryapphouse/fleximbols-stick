<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Felt-tip liquid eyeliner pen: slim pen body, fine felt tip, precise drawn line -->
  <!-- Pen body (slim, long, diagonal) -->
  <rect x="40" y="80" width="170" height="34" rx="10" fill="#000000" stroke="#1a1a1a" stroke-width="6.34" stroke-linejoin="round"/>
  <!-- Pen label band -->
  <rect x="80" y="84" width="100" height="26" fill="#1d0e82" stroke="none"/>
  <line x1="90" y1="92" x2="170" y2="92" stroke="#90a7d6" stroke-width="2.54" stroke-linecap="round"/>
  <line x1="90" y1="100" x2="170" y2="100" stroke="#90a7d6" stroke-width="2.54" stroke-linecap="round"/>
  <!-- Cap end (right) blunt -->
  <rect x="190" y="78" width="22" height="38" rx="6" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="6.34" stroke-linejoin="round"/>
  <!-- Front nib housing (taper from body to tip) -->
  <polygon points="40,80 40,114 8,108 8,86" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.08" stroke-linejoin="round"/>
  <!-- Fine felt tip (very narrow pointed) -->
  <polygon points="8,90 8,104 -2,97" fill="#000000" stroke="#1a1a1a" stroke-width="3.81" stroke-linejoin="round"/>
  <!-- Pen shine highlight -->
  <line x1="50" y1="86" x2="180" y2="86" stroke="#4d4d4d" stroke-width="3.81" stroke-linecap="round"/>
  <!-- Precise drawn eyeliner line (fine, tapered) below pen -->
  <path d="M30,170 Q120,150 220,170 Q240,172 258,160" stroke="#1a1a1a" stroke-width="6.34" fill="none" stroke-linecap="round"/>
  <!-- Small wing flick at end -->
  <path d="M250,164 Q262,156 270,148" stroke="#1a1a1a" stroke-width="5.08" fill="none" stroke-linecap="round"/>
  <!-- Tiny ink dot from tip -->
  <circle cx="22" cy="178" r="3" fill="#000000" stroke="#1a1a1a" stroke-width="2.54"/>
</g></svg>