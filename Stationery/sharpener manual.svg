  <!-- manual crank sharpener mounted on desk edge, crank handle, shavings -->
  <!-- desk edge -->
  <rect x="0" y="180" width="290" height="20" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <line x1="0" y1="185" x2="290" y2="185" stroke="#5e1f0a" stroke-width="2.96"/>
  <!-- mounting bracket clamp under desk -->
  <rect x="105" y="180" width="60" height="40" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="120" y="215" width="30" height="8" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.96" stroke-linejoin="round"/>
  <!-- main sharpener body, drum -->
  <rect x="90" y="95" width="90" height="85" rx="8" fill="#d01424" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- side detail band -->
  <rect x="90" y="135" width="90" height="10" fill="#f8130d" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- pencil insertion hole front -->
  <circle cx="135" cy="120" r="11" fill="#000000" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="135" cy="120" r="6" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- pencil sticking in -->
  <rect x="55" y="113" width="40" height="14" fill="#f2e40d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polygon points="55,113 45,120 55,127" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- crank shaft on right side -->
  <line x1="180" y1="135" x2="215" y2="135" stroke="#1a1a1a" stroke-width="5.93" stroke-linecap="round"/>
  <!-- crank arm -->
  <line x1="215" y1="135" x2="215" y2="100" stroke="#4d4d4d" stroke-width="8.88" stroke-linecap="round"/>
  <!-- crank knob -->
  <circle cx="215" cy="95" r="10" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- shavings curl on desk -->
  <path d="M 195 195 Q 210 175 230 188 Q 240 195 232 205 Q 222 210 215 200" fill="#eed5b6" stroke="#1a1a1a" stroke-width="3.70" stroke-linejoin="round"/>
  <path d="M 230 200 Q 245 195 250 205 Q 245 212 235 208" fill="#e6b98a" stroke="#1a1a1a" stroke-width="3.70" stroke-linejoin="round"/>
  <!-- single curl shaving free -->
  <path d="M 45 198 Q 55 188 65 195 Q 70 200 60 205" fill="#eed5b6" stroke="#1a1a1a" stroke-width="3.70" stroke-linejoin="round"/>
</g></svg>