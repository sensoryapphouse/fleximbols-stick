  <!-- monitor (dark screen) -->
  <rect x="35" y="20" width="190" height="130" rx="8" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <rect x="48" y="32" width="164" height="100" fill="#000000" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="115" y="150" width="30" height="18" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="85" y="168" width="90" height="10" rx="3" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- cave on screen (dark arch over hill) -->
  <path d="M55 132 L55 90 Q55 55 95 55 Q135 55 135 90 L135 132 Z" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- cave interior (darker) -->
  <path d="M70 132 L70 100 Q70 75 95 75 Q120 75 120 100 L120 132 Z" fill="#000000" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- bear inside cave (curled up) -->
  <!-- body curl -->
  <ellipse cx="95" cy="118" rx="25" ry="14" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- head -->
  <circle cx="115" cy="115" r="11" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- ears -->
  <circle cx="108" cy="106" r="4" fill="#9d7246" stroke="#1a1a1a" stroke-width="2.96"/>
  <circle cx="120" cy="106" r="4" fill="#9d7246" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- snout -->
  <ellipse cx="120" cy="118" rx="5" ry="4" fill="#eed5b6" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- closed eye -->
  <path d="M111 113 Q113 115 115 113" fill="none" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
  <!-- nose -->
  <circle cx="122" cy="117" r="1.5" fill="#000000"/>
  <!-- paws tucked -->
  <ellipse cx="78" cy="126" rx="6" ry="4" fill="#9d7246" stroke="#1a1a1a" stroke-width="2.96"/>

  <!-- Z (single, sleeping deeper than sleep-mode but quieter) -->
  <path d="M145 65 L160 65 L160 70 L150 80 L160 80 L160 85 L145 85 L145 80 L155 70 L145 70 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="2.96" stroke-linejoin="round"/>

  <!-- HIBERNATE letters below screen -->
  <!-- snowflake hint (cold/winter hibernation) -->
  <g stroke="#90a7d6" stroke-width="2.96" stroke-linecap="round" fill="none">
    <path d="M255 50 L255 80"/>
    <path d="M240 65 L270 65"/>
    <path d="M245 55 L265 75"/>
    <path d="M245 75 L265 55"/>
