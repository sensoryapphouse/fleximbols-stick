<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Seaplane: light plane with two separate pontoon floats, nose propeller, on water -->
  <!-- Water surface -->
  <rect x="10" y="185" width="270" height="45" rx="6" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Water ripples -->
  <path d="M20,195 Q40,190 60,195 Q80,200 100,195 Q120,190 140,195 Q160,200 180,195 Q200,190 220,195 Q240,200 260,195" fill="none" stroke="#90a7d6" stroke-width="2.22"/>
  <!-- Fuselage - light plane body -->
  <polygon points="28,128 60,112 215,110 252,120 215,130 60,144" fill="#efefef" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Nose with propeller hub -->
  <circle cx="28" cy="128" r="10" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Propeller blades -->
  <ellipse cx="28" cy="105" rx="6" ry="20" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" transform="rotate(-20,28,128)"/>
  <ellipse cx="28" cy="151" rx="6" ry="20" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" transform="rotate(20,28,128)"/>
  <!-- Cockpit canopy -->
  <ellipse cx="100" cy="110" rx="32" ry="13" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="70" y1="110" x2="130" y2="110" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Wings - high mounted -->
  <polygon points="90,112 70,68 200,68 185,112" fill="#efefef" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Tail fin -->
  <polygon points="220,110 215,68 240,68 248,110" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Horizontal stabiliser -->
  <polygon points="220,122 195,140 252,140 252,122" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Struts connecting to floats (left) -->
  <line x1="100" y1="144" x2="95" y2="180" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="140" y1="144" x2="135" y2="180" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Struts connecting to floats (right) -->
  <line x1="155" y1="144" x2="160" y2="180" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="185" y1="144" x2="190" y2="180" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Left pontoon float -->
  <ellipse cx="115" cy="184" rx="42" ry="10" fill="#90a7d6" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Right pontoon float -->
  <ellipse cx="175" cy="184" rx="42" ry="10" fill="#90a7d6" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Float detail lines -->
  <line x1="80" y1="184" x2="150" y2="184" stroke="#1a1a1a" stroke-width="2.22"/>
  <line x1="140" y1="184" x2="210" y2="184" stroke="#1a1a1a" stroke-width="2.22"/>
</g></svg>