<line x1="256" y1="170" x2="256" y2="98" stroke="#cfd6dc" stroke-width="16" stroke-linecap="round"/>
<line x1="278" y1="170" x2="278" y2="104" stroke="#cfd6dc" stroke-width="16" stroke-linecap="round"/>
<line x1="234" y1="170" x2="234" y2="104" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
<line x1="256" y1="170" x2="256" y2="98" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
<line x1="278" y1="170" x2="278" y2="104" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
</svg>
