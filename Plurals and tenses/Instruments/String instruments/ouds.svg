<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Oud: Arabic lute, deep round bowl-back body, large face with rosettes, sharply bent pegbox, NO frets, 11 strings -->

  <!-- Body: large round pear/teardrop shape, wide and deep -->
  <ellipse cx="148" cy="168" rx="72" ry="68" fill="#9d7246" stroke="#1a1a1a" stroke-width="11.11" stroke-linejoin="round"/>
  <!-- Body face edge highlight (suggests depth/bowl) -->
  <ellipse cx="148" cy="168" rx="68" ry="64" fill="none" stroke="#7d5e23" stroke-width="4.45"/>

  <!-- Main decorative rosette (center) -->
  <circle cx="148" cy="168" r="18" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="6.67"/>
  <circle cx="148" cy="168" r="12" fill="none" stroke="#9d7246" stroke-width="4.45"/>
  <circle cx="148" cy="168" r="6" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Two smaller rosettes (upper left and upper right of main) -->
  <circle cx="122" cy="148" r="9" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="122" cy="148" r="5" fill="none" stroke="#9d7246" stroke-width="4.45"/>
  <circle cx="174" cy="148" r="9" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="174" cy="148" r="5" fill="none" stroke="#9d7246" stroke-width="4.45"/>

  <!-- Neck: short, no frets -->
  <rect x="134" y="48" width="28" height="58" rx="5" fill="#7d5e23" stroke="#1a1a1a" stroke-width="8.89"/>

  <!-- Sharply bent-back pegbox (angled at ~45 degrees back) -->
  <polygon points="134,50 162,50 175,18 121,18" fill="#7d5e23" stroke="#1a1a1a" stroke-width="8.89" stroke-linejoin="round"/>

  <!-- Tuning pegs (6 per side = 12, but we'll show 6 visible on bent pegbox) -->
  <circle cx="116" cy="22" r="5" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="116" cy="34" r="5" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="116" cy="46" r="5" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="180" cy="22" r="5" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="180" cy="34" r="5" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="180" cy="46" r="5" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- 11 strings (close together, no frets on neck) -->
  <line x1="137" y1="22" x2="137" y2="228" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="139" y1="22" x2="139" y2="228" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="141" y1="22" x2="141" y2="228" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="143" y1="22" x2="143" y2="228" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="145" y1="22" x2="145" y2="228" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="147" y1="22" x2="147" y2="228" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="149" y1="22" x2="149" y2="228" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="151" y1="22" x2="151" y2="228" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="153" y1="22" x2="153" y2="228" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="155" y1="22" x2="155" y2="228" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="157" y1="22" x2="157" y2="228" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Nut at top of neck -->
  <line x1="134" y1="52" x2="162" y2="52" stroke="#4d4d4d" stroke-width="6.67"/>
  <!-- Bridge -->
  <rect x="136" y="210" width="24" height="7" rx="2" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
</g><g transform="translate(360 8) scale(0.2812)"><defs><radialGradient id="plg2507" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#plg2507)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>