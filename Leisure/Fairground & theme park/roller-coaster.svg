<line x1="60" y1="-28" x2="60" y2="4" stroke="#1a1a1a" stroke-width="5"/>
<circle cx="-18" cy="10" r="8" fill="#1a1a1a"/>
<circle cx="16" cy="10" r="8" fill="#1a1a1a"/>
<circle cx="58" cy="10" r="8" fill="#1a1a1a"/>
</g>
</svg>
