  <!-- The ring (a flat band, ellipse with inner ellipse cutaway feel) -->
  <ellipse cx="145" cy="130" rx="78" ry="28" fill="#f7de58" stroke="#1a1a1a" stroke-width="7.40"/>
  <!-- Ring shadow/edge band on inner top -->
  <path d="M75,128 Q145,108 215,128" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
