  <line x1="218" y1="125" x2="245" y2="145" stroke="#1a1a1a" stroke-width="6.67" stroke-linecap="round"/>
  <line x1="215" y1="135" x2="240" y2="160" stroke="#1a1a1a" stroke-width="6.67" stroke-linecap="round"/>

  <!-- Rear grooming tiller (left side) - small ridged attachment -->
  <rect x="8" y="170" width="20" height="22" rx="2" fill="#d01424" stroke="#1a1a1a" stroke-width="5.56"/>
  <line x1="12" y1="174" x2="12" y2="188" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="18" y1="174" x2="18" y2="188" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="24" y1="174" x2="24" y2="188" stroke="#1a1a1a" stroke-width="3.33"/>

