  <rect x="138" y="32" width="20" height="40" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="142" y="24" width="12" height="10" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="2.96"/>
