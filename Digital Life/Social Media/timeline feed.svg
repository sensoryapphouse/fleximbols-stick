<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Phone body -->
  <rect x="90" y="22" width="110" height="196" rx="14" ry="14" fill="#efefef" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Phone screen -->
  <rect x="100" y="40" width="90" height="160" rx="6" ry="6" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Feed cards: equal-height, evenly spaced = chronological -->
  <rect x="106" y="48" width="78" height="24" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <rect x="106" y="78" width="78" height="24" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <rect x="106" y="108" width="78" height="24" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <rect x="106" y="138" width="78" height="24" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <rect x="106" y="168" width="78" height="24" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <!-- Equal bars inside each card (not ranked) -->
  <rect x="110" y="55" width="40" height="7" rx="3" fill="#90a7d6"/>
  <rect x="110" y="85" width="40" height="7" rx="3" fill="#90a7d6"/>
  <rect x="110" y="115" width="40" height="7" rx="3" fill="#90a7d6"/>
  <rect x="110" y="145" width="40" height="7" rx="3" fill="#90a7d6"/>
  <rect x="110" y="175" width="40" height="7" rx="3" fill="#90a7d6"/>
  <!-- Clock icon to the left of phone -->
  <circle cx="46" cy="120" r="28" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Clock face -->
  <line x1="46" y1="120" x2="46" y2="100" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <line x1="46" y1="120" x2="62" y2="128" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Down-arrow beside clock to show reverse-chron order -->
  <line x1="46" y1="154" x2="46" y2="172" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <polygon points="46,180 38,168 54,168" fill="#000000"/>
</g></svg>