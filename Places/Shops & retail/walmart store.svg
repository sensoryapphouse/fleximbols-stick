<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- BLUE storefront building -->
  <rect x="15" y="65" width="260" height="145" rx="4" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Roof band -->
  <rect x="8" y="52" width="274" height="22" rx="3" fill="#1d0e82" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Ground -->
  <rect x="8" y="207" width="274" height="8" rx="2" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Glass entrance -->
  <rect x="105" y="162" width="80" height="48" rx="3" fill="#dff3fd" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <line x1="145" y1="162" x2="145" y2="210" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- YELLOW SIX-SPARK SUNBURST / ASTERISK EMBLEM -->
  <!-- Centre circle -->
  <circle cx="145" cy="115" r="16" fill="#f7de58" stroke="#1a1a1a" stroke-width="5.93"/>
  <!-- 6 spokes at 60-degree intervals -->
  <!-- Spoke 1: top (90 deg) -->
  <rect x="139" y="68" width="12" height="30" rx="6" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Spoke 2: top-right (30 deg) -->
  <rect x="139" y="68" width="12" height="30" rx="6" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" transform="rotate(60 145 115)"/>
  <!-- Spoke 3: bottom-right (330 deg) -->
  <rect x="139" y="68" width="12" height="30" rx="6" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" transform="rotate(120 145 115)"/>
  <!-- Spoke 4: bottom (270 deg) -->
  <rect x="139" y="68" width="12" height="30" rx="6" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" transform="rotate(180 145 115)"/>
  <!-- Spoke 5: bottom-left (210 deg) -->
  <rect x="139" y="68" width="12" height="30" rx="6" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" transform="rotate(240 145 115)"/>
  <!-- Spoke 6: top-left (150 deg) -->
  <rect x="139" y="68" width="12" height="30" rx="6" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" transform="rotate(300 145 115)"/>
  <!-- Centre redraw on top -->
  <circle cx="145" cy="115" r="13" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45"/>
</g></svg>