  <ellipse cx="78" cy="163" rx="10" ry="5" fill="#000000" stroke="#1a1a1a" stroke-width="2.66"/>
  <ellipse cx="90" cy="163" rx="10" ry="5" fill="#000000" stroke="#1a1a1a" stroke-width="2.66"/>

  <!-- Seated investor 1 (left) -->
  <!-- Chair seat -->
  <rect x="22" y="160" width="28" height="8" rx="3" ry="3" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="3.55" stroke-linejoin="round"/>
