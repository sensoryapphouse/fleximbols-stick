  <path d="M20,118 Q45,108 68,112" fill="none" stroke="#392170" stroke-width="11.11" stroke-linecap="round"/>
  <path d="M20,130 Q45,122 68,124" fill="none" stroke="#392170" stroke-width="5.55" stroke-linecap="round"/>
  <!-- Right strap -->
  <path d="M222,112 Q245,108 270,118" fill="none" stroke="#392170" stroke-width="11.11" stroke-linecap="round"/>
  <path d="M222,124 Q245,122 270,130" fill="none" stroke="#392170" stroke-width="5.55" stroke-linecap="round"/>
  <!-- Strap adjuster buckle on left side -->
  <rect x="28" y="110" width="18" height="22" rx="4" ry="4" fill="#7c3fac" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="37" y1="110" x2="37" y2="132" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Main mask body (wide soft padded shape) -->
  <!-- Convex top/bottom padding shape with eye cavities -->
  <path d="M68,90 Q90,68 145,68 Q200,68 222,90 Q240,108 235,130 Q228,152 210,158 Q190,165 145,165 Q100,165 80,158 Q62,152 55,130 Q50,108 68,90 Z" fill="#7c3fac" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
