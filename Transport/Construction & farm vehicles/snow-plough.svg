<circle cx="220" cy="362" r="30" fill="#1a1a1a"/>
<circle cx="220" cy="362" r="13" fill="#cfd6dc" stroke="#1a1a1a" stroke-width="6"/>
<circle cx="370" cy="362" r="30" fill="#1a1a1a"/>
