  <circle cx="112" cy="122" r="5" fill="#000000"/>
  <circle cx="148" cy="122" r="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="148" cy="122" r="5" fill="#000000"/>
  <!-- Gritted mouth -->
  <path d="M106,148 Q130,158 154,148" fill="none" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <!-- Teeth suggestion -->
  <line x1="114" y1="150" x2="114" y2="156" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="124" y1="153" x2="124" y2="158" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="136" y1="153" x2="136" y2="158" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="146" y1="150" x2="146" y2="156" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Steam lines rising from top of head -->
  <path d="M100,60 Q92,44 100,28" fill="none" stroke="#ffffff" stroke-width="5.55" stroke-linecap="round"/>
  <path d="M130,54 Q122,38 130,22" fill="none" stroke="#ffffff" stroke-width="5.55" stroke-linecap="round"/>
  <path d="M160,60 Q152,44 160,28" fill="none" stroke="#ffffff" stroke-width="5.55" stroke-linecap="round"/>
  <!-- Pressure valve on top right of head -->
  <!-- Valve body -->
  <rect x="178" y="68" width="30" height="20" rx="6" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Valve stem -->
