  <!-- Single rugged tall battery block -->
  <rect x="80" y="70" width="130" height="148" rx="8" ry="8" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Ridged top case detail (rugged look) -->
  <rect x="80" y="70" width="130" height="22" rx="8" ry="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Positive terminal -->
  <rect x="102" y="52" width="28" height="22" rx="4" ry="4" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Negative terminal -->
  <rect x="160" y="52" width="28" height="22" rx="4" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- + symbol on positive terminal -->
  <line x1="116" y1="58" x2="116" y2="68" stroke="#ffffff" stroke-width="3.55" stroke-linecap="round"/>
  <line x1="111" y1="63" x2="121" y2="63" stroke="#ffffff" stroke-width="3.55" stroke-linecap="round"/>
  <!-- - symbol on negative terminal -->
  <line x1="169" y1="63" x2="179" y2="63" stroke="#ffffff" stroke-width="3.55" stroke-linecap="round"/>
  <!-- Battery fill level (mostly full) -->
  <rect x="85" y="140" width="120" height="74" rx="5" ry="5" fill="#529929"/>
  <!-- Horizontal case ribs (rugged detail) -->
  <line x1="80" y1="110" x2="210" y2="110" stroke="#b8b8b8" stroke-width="3.55" stroke-linecap="round"/>
  <line x1="80" y1="130" x2="210" y2="130" stroke="#b8b8b8" stroke-width="3.55" stroke-linecap="round"/>
  <!-- Cyclic arrow icon (front face centre, below ribs) -->
  <!-- circular arrow: two arcs with arrowheads -->
  <path d="M 145 152 m -22 0 a 22 22 0 1 1 22 22" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <polygon points="167,174 157,180 157,168" fill="#000000"/>
  <path d="M 145 152 m 22 0 a 22 22 0 1 1 -22 -22" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <polygon points="123,130 133,124 133,136" fill="#000000"/>
</g></svg>