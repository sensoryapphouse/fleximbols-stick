  <!-- redraw outline on top -->
  <path d="M 4 0 L 70 0 L 61 156 L 13 156 Z" fill="none" stroke="#1a1a1a" stroke-width="7" stroke-linejoin="round"/>
  <!-- hand gripping the glass -->
  <path class="skin" d="M 8 96 q -26 6 -26 26 q 0 22 30 24 l 0 -50 Z" fill="#f5d6b0" stroke="#1a1a1a" stroke-width="6" stroke-linejoin="round"/>
