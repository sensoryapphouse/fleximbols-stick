  <!-- Hole 4 small right -->
  <circle cx="215" cy="152" r="14" fill="#e6b98a" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="215" cy="152" r="9" fill="#9d7246" stroke="none"/>
  <!-- Hole 5 small left -->
