  <!-- Pencil body (wooden, slightly thick) rotated diagonally -->
  <!-- Pencil shaft -->
  <rect x="60" y="70" width="28" height="130" rx="3" ry="3" fill="#f7de58" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Pencil ferrule (metal band near eraser end) -->
  <rect x="60" y="70" width="28" height="14" rx="2" ry="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.93"/>
  <!-- Eraser end (pink) -->
  <rect x="63" y="58" width="22" height="16" rx="3" ry="3" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="5.93"/>
  <!-- Pencil tip taper (wooden) -->
  <polygon points="60,200 88,200 74,218" fill="#e6b98a" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Brown tip / graphite point -->
  <polygon points="68,218 80,218 74,232" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Wood grain lines on shaft -->
  <line x1="62" y1="90" x2="86" y2="90" stroke="#9d7246" stroke-width="2.96"/>
  <line x1="62" y1="105" x2="86" y2="105" stroke="#9d7246" stroke-width="2.96"/>
  <line x1="62" y1="120" x2="86" y2="120" stroke="#9d7246" stroke-width="2.96"/>

  <!-- Eyebrow indicator shape (drawn arc) -->
  <path d="M130,130 Q160,100 200,115" stroke="#5e1f0a" stroke-width="7.40" fill="none" stroke-linecap="round"/>
  <!-- Small hairs on brow -->
  <line x1="140" y1="127" x2="138" y2="112" stroke="#5e1f0a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="152" y1="118" x2="150" y2="103" stroke="#5e1f0a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="164" y1="112" x2="163" y2="97" stroke="#5e1f0a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="176" y1="111" x2="175" y2="96" stroke="#5e1f0a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="188" y1="114" x2="188" y2="99" stroke="#5e1f0a" stroke-width="4.45" stroke-linecap="round"/>
