<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<!-- simple breast outline with nipple, clinical (front, both) -->
<!-- chest baseline -->
<line x1="112" y1="170" x2="400" y2="170" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
<!-- left breast: rounded teardrop hanging from chest line -->
<path d="M 130 170 Q 130 326 206 326 Q 250 326 250 240 Q 250 188 240 170 Z"
      fill="#f5d6b0" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- right breast (mirror) -->
<path d="M 382 170 Q 382 326 306 326 Q 262 326 262 240 Q 262 188 272 170 Z"
      fill="#f5d6b0" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- areola + nipple, left -->
<circle cx="190" cy="268" r="22" fill="none" stroke="#1a1a1a" stroke-width="6"/>
<circle cx="190" cy="268" r="8" fill="#1a1a1a"/>
<!-- areola + nipple, right -->
<circle cx="322" cy="268" r="22" fill="none" stroke="#1a1a1a" stroke-width="6"/>
<circle cx="322" cy="268" r="8" fill="#1a1a1a"/>
</svg>
