  <path d="M100 50 L93 95 L197 95 L190 50 Z" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <!-- Glass rim (top) -->
  <rect x="97" y="46" width="96" height="10" rx="4" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Glass base -->
  <rect x="82" y="207" width="126" height="12" rx="5" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Phin drip filter (metal, sits on top of glass) -->
