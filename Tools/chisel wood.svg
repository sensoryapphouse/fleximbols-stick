<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- chisel-wood: flat bevelled steel blade with rounded wooden handle, small mallet hint -->
  <!-- === CHISEL === -->
  <!-- Wooden handle - rounded cylindrical -->
  <rect x="60" y="55" width="55" height="130" rx="20" fill="#9d7246" stroke="#1a1a1a" stroke-width="7.40"/>
  <!-- Handle ferrule (metal collar at blade end) -->
  <rect x="60" y="162" width="55" height="14" rx="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="6.66"/>
  <!-- Handle top cap (metal) -->
  <rect x="63" y="55" width="49" height="14" rx="7" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.93"/>
  <!-- Handle wood grain -->
  <line x1="66" y1="80" x2="108" y2="80" stroke="#7d5e23" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="64" y1="95" x2="110" y2="95" stroke="#7d5e23" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="64" y1="110" x2="110" y2="110" stroke="#7d5e23" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="64" y1="125" x2="110" y2="125" stroke="#7d5e23" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="64" y1="140" x2="110" y2="140" stroke="#7d5e23" stroke-width="2.96" stroke-linecap="round"/>
  <!-- Flat steel blade - narrows to bevelled tip -->
  <polygon points="70,176 104,176 108,230 66,230" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Bevel face at cutting edge (angled flat, lighter tone) -->
  <polygon points="66,216 108,216 108,230 66,230" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Blade centre groove/fuller line -->
  <line x1="87" y1="178" x2="87" y2="228" stroke="#7f7f7f" stroke-width="3.70" stroke-linecap="round"/>
  <!-- === SMALL MALLET (hint, upper right) === -->
  <!-- Mallet head -->
  <rect x="160" y="52" width="90" height="46" rx="10" fill="#9d7246" stroke="#1a1a1a" stroke-width="7.40"/>
  <!-- Mallet head wood grain -->
  <line x1="168" y1="62" x2="242" y2="62" stroke="#7d5e23" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="168" y1="72" x2="242" y2="72" stroke="#7d5e23" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="168" y1="82" x2="242" y2="82" stroke="#7d5e23" stroke-width="2.96" stroke-linecap="round"/>
  <!-- Mallet head end caps (darker end grain) -->
  <rect x="160" y="52" width="16" height="46" rx="6" fill="#7d5e23" stroke="#1a1a1a" stroke-width="5.93"/>
  <rect x="234" y="52" width="16" height="46" rx="6" fill="#7d5e23" stroke="#1a1a1a" stroke-width="5.93"/>
  <!-- Mallet handle going down -->
  <rect x="195" y="95" width="22" height="120" rx="8" fill="#9d7246" stroke="#1a1a1a" stroke-width="7.40"/>
  <!-- Handle grip bands -->
  <rect x="193" y="155" width="26" height="8" rx="3" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="193" y="185" width="26" height="8" rx="3" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.45"/>
</g></svg>