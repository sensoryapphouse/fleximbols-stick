  <!-- Bar 10 -->
  <rect x="221" y="103" width="15" height="44" rx="2" fill="#9d7246" stroke="#7d5e23" stroke-width="4.45"/>

  <!-- 4 yarn-headed mallets (longer shafts, large soft heads) -->
  <!-- Mallet 1 -->
  <line x1="68" y1="228" x2="88" y2="88" stroke="#7d5e23" stroke-width="5.93" stroke-linecap="round"/>
  <circle cx="89" cy="83" r="12" fill="#529929" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Mallet 2 -->
  <line x1="105" y1="228" x2="120" y2="88" stroke="#7d5e23" stroke-width="5.93" stroke-linecap="round"/>
