<path d="M 232 300 L 224 470 Q 224 480 234 480 L 248 480 Q 254 480 254 470 L 256 360 L 258 470 Q 258 480 264 480 L 278 480 Q 288 480 288 470 L 280 300 Z" fill="#f5d6b0" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- arms -->
<path d="M 214 200 L 188 320 Q 186 330 196 332 Q 206 332 208 322 L 230 210 Z" fill="#f5d6b0" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<path d="M 298 200 L 324 320 Q 326 330 316 332 Q 306 332 304 322 L 282 210 Z" fill="#f5d6b0" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- torso -->
<path d="M 222 196 L 290 196 Q 298 196 298 206 L 292 300 Q 256 312 220 300 L 214 206 Q 214 196 222 196 Z" fill="#f5d6b0" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
