  <!-- ground line -->
  <line x1="20" y1="200" x2="270" y2="200" stroke="#1a1a1a" stroke-width="5.33" stroke-linecap="round"/>
  <!-- hatchback body: sloped single rear door, no separate trunk -->
  <path d="M 40 190 L 40 160 L 70 110 L 180 95 L 230 130 L 250 160 L 250 190 Z" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="5.33" stroke-linejoin="round"/>
  <!-- front windshield -->
  <path d="M 80 115 L 95 130 L 140 130 L 140 100 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- rear hatch window (sloped) -->
  <path d="M 150 100 L 150 130 L 215 130 L 180 100 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- single rear hatch door line (vertical seam from roof slope down to bumper) -->
  <line x1="225" y1="125" x2="240" y2="175" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- hatch handle -->
  <line x1="228" y1="148" x2="238" y2="152" stroke="#1a1a1a" stroke-width="5.33" stroke-linecap="round"/>
  <!-- side door line -->
  <line x1="145" y1="100" x2="145" y2="190" stroke="#1a1a1a" stroke-width="3.56"/>
  <!-- door handle -->
  <rect x="125" y="145" width="14" height="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.67"/>
  <!-- headlight -->
  <rect x="44" y="155" width="14" height="10" fill="#fff200" stroke="#1a1a1a" stroke-width="3.56"/>
  <!-- tail light -->
  <rect x="232" y="170" width="14" height="10" fill="#f8130d" stroke="#1a1a1a" stroke-width="3.56"/>
  <!-- wheels -->
  <circle cx="85" cy="200" r="20" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.33"/>
  <circle cx="85" cy="200" r="8" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.56"/>
  <circle cx="210" cy="200" r="20" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.33"/>
  <circle cx="210" cy="200" r="8" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.56"/>
</g></svg>