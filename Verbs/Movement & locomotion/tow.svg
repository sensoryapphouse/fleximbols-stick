  <!-- Truck cab top -->
  <rect x="10" y="118" width="50" height="30" rx="6" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.94" stroke-linejoin="round"/>
  <!-- Cab window -->
  <rect x="16" y="122" width="38" height="20" rx="4" fill="#dff3fd" stroke="#1a1a1a" stroke-width="3.95" stroke-linejoin="round"/>
  <!-- Truck front bumper -->
  <rect x="6" y="168" width="10" height="20" rx="3" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="3.95" stroke-linejoin="round"/>
  <!-- Wheels of truck -->
  <circle cx="30" cy="202" r="14" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.94"/>
  <circle cx="30" cy="202" r="6" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="2.96"/>
  <circle cx="76" cy="202" r="14" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.94"/>
  <circle cx="76" cy="202" r="6" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- Truck boom/crane arm -->
  <line x1="80" y1="145" x2="108" y2="120" stroke="#1a1a1a" stroke-width="7.90" stroke-linecap="round"/>
  <line x1="80" y1="145" x2="108" y2="120" stroke="#f2e40d" stroke-width="3.95" stroke-linecap="round"/>

  <!-- TOW BAR / chain connecting vehicles -->
  <path d="M88 190 Q145 198 175 190" fill="none" stroke="#4d4d4d" stroke-width="5.93" stroke-linecap="round" stroke-dasharray="10,5"/>

  <!-- BROKEN-DOWN CAR (right vehicle, being towed) -->
  <!-- Car body -->
  <rect x="175" y="160" width="102" height="38" rx="6" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.94" stroke-linejoin="round"/>
  <!-- Car roof -->
  <rect x="192" y="140" width="68" height="24" rx="6" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.94" stroke-linejoin="round"/>
  <!-- Windshield -->
  <rect x="196" y="143" width="26" height="18" rx="3" fill="#dff3fd" stroke="#1a1a1a" stroke-width="3.95" stroke-linejoin="round"/>
  <!-- Rear window -->
  <rect x="235" y="143" width="22" height="18" rx="3" fill="#dff3fd" stroke="#1a1a1a" stroke-width="3.95" stroke-linejoin="round"/>
  <!-- Car wheels -->
  <circle cx="200" cy="202" r="14" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.94"/>
  <circle cx="200" cy="202" r="6" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="2.96"/>
  <circle cx="253" cy="202" r="14" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.94"/>
  <circle cx="253" cy="202" r="6" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="2.96"/>
