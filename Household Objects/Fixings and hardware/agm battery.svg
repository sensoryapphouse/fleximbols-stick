<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- AGM battery: sealed sleek case, no vent caps, smooth top, terminals, mat-layer hint -->
  <!-- Battery body -->
  <rect x="45" y="80" width="200" height="130" rx="8" ry="8" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="6.34" stroke-linejoin="round"/>
  <!-- Sealed top (smooth, no caps) -->
  <rect x="45" y="74" width="200" height="14" rx="4" ry="4" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="6.34" stroke-linejoin="round"/>
  <!-- Terminals -->
  <rect x="90" y="52" width="28" height="28" rx="4" ry="4" fill="#efefef" stroke="#1a1a1a" stroke-width="6.34" stroke-linejoin="round"/>
  <rect x="172" y="52" width="28" height="28" rx="4" ry="4" fill="#efefef" stroke="#1a1a1a" stroke-width="6.34" stroke-linejoin="round"/>
  <!-- + on positive terminal -->
  <line x1="186" y1="58" x2="186" y2="72" stroke="#1a1a1a" stroke-width="5.08" stroke-linecap="round"/>
  <line x1="179" y1="65" x2="193" y2="65" stroke="#1a1a1a" stroke-width="5.08" stroke-linecap="round"/>
  <!-- - on negative terminal -->
  <line x1="97" y1="65" x2="111" y2="65" stroke="#1a1a1a" stroke-width="5.08" stroke-linecap="round"/>
  <!-- Mat layer hint: horizontal lines inside body suggesting absorbed mat layers -->
  <line x1="65" y1="110" x2="225" y2="110" stroke="#4d4d4d" stroke-width="2.54" stroke-linecap="round"/>
  <line x1="65" y1="125" x2="225" y2="125" stroke="#4d4d4d" stroke-width="2.54" stroke-linecap="round"/>
  <line x1="65" y1="140" x2="225" y2="140" stroke="#4d4d4d" stroke-width="2.54" stroke-linecap="round"/>
  <line x1="65" y1="155" x2="225" y2="155" stroke="#4d4d4d" stroke-width="2.54" stroke-linecap="round"/>
  <line x1="65" y1="170" x2="225" y2="170" stroke="#4d4d4d" stroke-width="2.54" stroke-linecap="round"/>
  <!-- AGM label area: small sealed badge on side -->
  <rect x="55" y="88" width="50" height="24" rx="3" ry="3" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="3.81" stroke-linejoin="round"/>
  <!-- Sealed indicator: small filled circle row on top edge (sealed, not open) -->
  <rect x="100" y="77" width="90" height="8" rx="3" ry="3" fill="#efefef" stroke="#1a1a1a" stroke-width="2.54" stroke-linejoin="round"/>
</g></svg>