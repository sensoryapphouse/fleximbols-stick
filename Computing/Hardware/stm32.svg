  <rect x="220" y="55" width="12" height="155" rx="3" ry="3" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <line x1="232" y1="68" x2="242" y2="68" stroke="#b8b8b8" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="232" y1="82" x2="242" y2="82" stroke="#b8b8b8" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="232" y1="96" x2="242" y2="96" stroke="#b8b8b8" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="232" y1="110" x2="242" y2="110" stroke="#b8b8b8" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="232" y1="124" x2="242" y2="124" stroke="#b8b8b8" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="232" y1="138" x2="242" y2="138" stroke="#b8b8b8" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="232" y1="152" x2="242" y2="152" stroke="#b8b8b8" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="232" y1="166" x2="242" y2="166" stroke="#b8b8b8" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="232" y1="180" x2="242" y2="180" stroke="#b8b8b8" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="232" y1="194" x2="242" y2="194" stroke="#b8b8b8" stroke-width="4.45" stroke-linecap="round"/>
  <!-- USB Mini-B connector (different from ESP32's Micro) -->
