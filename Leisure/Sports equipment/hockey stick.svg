  <!-- ice hockey stick: long shaft with angled flat blade at bottom -->
  <!-- shaft (diagonal from top-right down to lower-left) -->
  <path d="M 240 22 L 258 22 L 110 195 L 92 195 Z" fill="#9d7246" stroke="#1a1a1a" stroke-width="11.86" stroke-linejoin="round"/>
  <!-- wood grain -->
  <line x1="245" y1="30" x2="100" y2="195" stroke="#7d5e23" stroke-width="4.45"/>
  <line x1="252" y1="30" x2="106" y2="195" stroke="#7d5e23" stroke-width="4.45"/>
  <!-- tape wrap on grip end (top) -->
  <path d="M 230 22 L 258 22 L 240 44 L 218 44 Z" fill="#000000" stroke="#1a1a1a" stroke-width="7.41" stroke-linejoin="round"/>
  <line x1="226" y1="30" x2="252" y2="30" stroke="#4d4d4d" stroke-width="3.56"/>
  <line x1="222" y1="38" x2="248" y2="38" stroke="#4d4d4d" stroke-width="3.56"/>
  <!-- blade (angled flat paddle at bottom) -->
  <path d="M 110 195 L 92 195 L 35 210 Q 28 213 32 220 L 38 224 Q 44 225 52 222 L 105 215 Z" fill="#efefef" stroke="#1a1a1a" stroke-width="11.86" stroke-linejoin="round"/>
