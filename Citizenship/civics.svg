<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Government building dome -->
  <!-- Dome arc -->
  <path d="M155,95 Q200,55 245,95" fill="#efefef" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <!-- Dome body -->
  <rect x="155" y="95" width="90" height="55" fill="#efefef" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Columns on building -->
  <rect x="163" y="100" width="12" height="48" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.33"/>
  <rect x="183" y="100" width="12" height="48" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.33"/>
  <rect x="203" y="100" width="12" height="48" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.33"/>
  <rect x="223" y="100" width="12" height="48" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Building steps -->
  <rect x="150" y="150" width="100" height="8" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="145" y="158" width="110" height="8" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Dome top finial -->
  <rect x="196" y="55" width="8" height="20" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="3.33"/>
  <polygon points="196,55 204,55 200,45" fill="#f8130d" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>

  <!-- Ballot box -->
  <rect x="22" y="130" width="105" height="75" rx="5" fill="#90a7d6" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Slot on top -->
  <rect x="50" y="125" width="50" height="10" rx="3" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Ballot paper being inserted -->
  <rect x="62" y="100" width="26" height="38" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Checkmark on ballot -->
  <polyline points="68,118 74,126 86,108" fill="none" stroke="#529929" stroke-width="5.55" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Large voting checkmark -->
  <polyline points="30,170 52,195 100,148" fill="none" stroke="#529929" stroke-width="7.77" stroke-linecap="round" stroke-linejoin="round"/>
</g></svg>