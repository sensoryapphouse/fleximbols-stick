<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- praying mantis: green, triangular head, raised folded raptorial forelegs -->
  <!-- Abdomen - elongated, slightly leaf-shaped -->
  <ellipse cx="145" cy="185" rx="18" ry="42" fill="#529929" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Abdomen segments -->
  <line x1="128" y1="165" x2="162" y2="165" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="128" y1="175" x2="162" y2="175" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="128" y1="185" x2="162" y2="185" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="128" y1="195" x2="162" y2="195" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="130" y1="205" x2="160" y2="205" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Wings folded along abdomen -->
  <ellipse cx="145" cy="183" rx="14" ry="38" fill="#67832d" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Thorax - prothorax long and narrow -->
  <rect x="136" y="120" width="18" height="46" rx="8" fill="#529929" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Triangular head - characteristic mantis -->
  <polygon points="145,72 162,108 128,108" fill="#529929" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Large compound eyes on corners of triangle -->
  <circle cx="130" cy="100" r="9" fill="#f2e40d" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="160" cy="100" r="9" fill="#f2e40d" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Pupils -->
  <circle cx="130" cy="100" r="4" fill="#000000"/>
  <circle cx="160" cy="100" r="4" fill="#000000"/>
  <!-- Eye highlights -->
  <circle cx="128" cy="98" r="2" fill="#ffffff"/>
  <circle cx="158" cy="98" r="2" fill="#ffffff"/>
  <!-- Antennae - thin, long -->
  <path d="M140 74 Q125 52 112 30" fill="none" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <path d="M150 74 Q165 52 178 30" fill="none" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <!-- RAPTORIAL FORELEGS - raised and folded, key feature -->
  <!-- Left foreleg upper segment (femur) raised up -->
  <path d="M138 128 Q115 110 105 88" fill="none" stroke="#1a1a1a" stroke-width="8.88" stroke-linecap="round"/>
  <path d="M138 128 Q115 110 105 88" fill="none" stroke="#529929" stroke-width="5.55" stroke-linecap="round"/>
  <!-- Left foreleg lower segment (tibia) folding back down - spiny -->
  <path d="M105 88 Q100 108 108 128" fill="none" stroke="#1a1a1a" stroke-width="7.77" stroke-linecap="round"/>
  <path d="M105 88 Q100 108 108 128" fill="none" stroke="#529929" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Left foreleg spines -->
  <line x1="101" y1="96" x2="94" y2="92" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="100" y1="104" x2="93" y2="100" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="101" y1="112" x2="94" y2="110" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Right foreleg upper segment -->
  <path d="M152 128 Q175 110 185 88" fill="none" stroke="#1a1a1a" stroke-width="8.88" stroke-linecap="round"/>
  <path d="M152 128 Q175 110 185 88" fill="none" stroke="#529929" stroke-width="5.55" stroke-linecap="round"/>
  <!-- Right foreleg lower segment folding back -->
  <path d="M185 88 Q190 108 182 128" fill="none" stroke="#1a1a1a" stroke-width="7.77" stroke-linecap="round"/>
  <path d="M185 88 Q190 108 182 128" fill="none" stroke="#529929" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Right foreleg spines -->
  <line x1="189" y1="96" x2="196" y2="92" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="190" y1="104" x2="197" y2="100" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="189" y1="112" x2="196" y2="110" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Middle legs -->
  <path d="M138 145 Q112 148 90 162" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M152 145 Q178 148 200 162" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Hind legs -->
  <path d="M138 158 Q108 165 85 182" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M152 158 Q182 165 205 182" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
</g></svg>