<!-- fossil: ammonite spiral shell embedded in a rock slab -->
<!-- rock slab -->
<path d="M 96 120 L 416 120 L 400 400 Q 256 424 112 400 Z" fill="#cfd6dc" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- slab inner shade -->
<path d="M 122 148 L 390 148 L 376 380 Q 256 400 136 380 Z" fill="#b9bdc2" stroke="#1a1a1a" stroke-width="0"/>
<!-- ammonite outer shell disc -->
<circle cx="256" cy="270" r="108" fill="#9aa0a6" stroke="#1a1a1a" stroke-width="9"/>
<!-- spiral chambers as concentric arcs, opening to one side -->
<circle cx="256" cy="270" r="86" fill="none" stroke="#1a1a1a" stroke-width="8"/>
<path d="M 256 206 A 64 64 0 1 0 320 270" fill="none" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
<path d="M 256 228 A 42 42 0 1 1 214 270" fill="none" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
<circle cx="256" cy="270" r="16" fill="#6b6f74" stroke="#1a1a1a" stroke-width="6"/>
<!-- chamber rib lines radiating -->
<path d="M 256 184 L 256 162 M 342 270 L 364 270 M 256 356 L 256 378 M 170 270 L 148 270" fill="none" stroke="#6b6f74" stroke-width="6" stroke-linecap="round"/>
<path d="M 317 209 L 333 193 M 317 331 L 333 347 M 195 331 L 179 347 M 195 209 L 179 193" fill="none" stroke="#6b6f74" stroke-width="5" stroke-linecap="round"/>
</svg>
