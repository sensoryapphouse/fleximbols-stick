  <!-- stem on top -->
  <rect x="135" y="22" width="20" height="20" fill="#67832d" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- round dark green kabocha body, slightly squat -->
  <path d="M60 130
           C 60 80, 95 50, 145 50
           C 195 50, 230 80, 230 130
           C 230 185, 195 220, 145 220
           C 95 220, 60 185, 60 130 Z"
        fill="#137827" stroke="#1a1a1a" stroke-width="6.92" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- subtle ridges (gentle curves) -->
  <path d="M95 60 C 88 110, 90 160, 105 210" fill="none" stroke="#1a1a1a" stroke-width="3.95" stroke-linecap="round"/>
  <path d="M125 53 C 122 110, 125 165, 130 217" fill="none" stroke="#1a1a1a" stroke-width="3.95" stroke-linecap="round"/>
  <path d="M165 53 C 168 110, 165 165, 160 217" fill="none" stroke="#1a1a1a" stroke-width="3.95" stroke-linecap="round"/>
  <path d="M195 60 C 202 110, 200 160, 185 210" fill="none" stroke="#1a1a1a" stroke-width="3.95" stroke-linecap="round"/>
  <!-- pale green flecks/stripes typical of kabocha -->
  <path d="M75 105 C 80 108, 88 112, 95 115" fill="none" stroke="#529929" stroke-width="4.94" stroke-linecap="round"/>
  <path d="M210 105 C 205 108, 197 112, 190 115" fill="none" stroke="#529929" stroke-width="4.94" stroke-linecap="round"/>
  <path d="M115 150 C 125 153, 145 154, 175 150" fill="none" stroke="#529929" stroke-width="4.94" stroke-linecap="round"/>
  <!-- small orange-red interior peek (cut wedge at bottom-right) -->
  <path d="M170 200 L 210 175 L 220 200 C 215 215, 195 220, 175 218 Z"
        fill="#ff9900" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- seeds in cut -->
  <ellipse cx="195" cy="195" rx="3" ry="4" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="1.98"/>
  <ellipse cx="205" cy="205" rx="3" ry="4" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="1.98"/>
</g></svg>