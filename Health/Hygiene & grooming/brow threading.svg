  <!-- Eyebrow being shaped by twisted thread held in two hands -->
  <!-- Forehead/skin background (face fragment showing brow area) -->
  <path d="M40 60 Q40 40 60 36 L240 36 Q260 40 260 60 L260 200 Q260 220 240 220 L60 220 Q40 220 40 200 Z" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.33" stroke-linejoin="round"/>
  <!-- Brow bone shading -->
  <path d="M70 130 Q145 125 220 130" fill="none" stroke="#e6b98a" stroke-width="10.67" stroke-linecap="round"/>
  <!-- EYEBROW (being shaped - dark, thick, well-defined) -->
  <path d="M80 118 Q120 108 160 112 Q190 116 210 122 Q200 126 175 124 Q145 122 110 126 Q90 128 80 124 Z" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Brow hair flicks -->
  <path d="M90 120 L88 114 M105 116 L103 110 M120 114 L118 108 M135 114 L133 108 M150 114 L148 108 M165 116 L163 110 M180 118 L178 112 M195 122 L193 116" fill="none" stroke="#1a1a1a" stroke-width="2.67" stroke-linecap="round"/>
