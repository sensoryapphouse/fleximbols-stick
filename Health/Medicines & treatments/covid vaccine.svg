  <line x1="245" y1="60" x2="265" y2="40" stroke="#b8b8b8" stroke-width="5.93" stroke-linecap="round"/>
  <line x1="245" y1="60" x2="265" y2="40" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
