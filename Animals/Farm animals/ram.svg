<line x1="200" y1="338" x2="196" y2="410"/>
<line x1="248" y1="344" x2="248" y2="412"/>
<line x1="292" y1="344" x2="296" y2="412"/>
</g>
<!-- woolly body bumps -->
<g fill="#f0ece2" stroke="#1a1a1a" stroke-width="8">
<circle cx="168" cy="292" r="34"/>
<circle cx="186" cy="244" r="34"/>
<circle cx="228" cy="220" r="38"/>
<circle cx="276" cy="228" r="36"/>
<circle cx="252" cy="324" r="34"/>
<circle cx="198" cy="326" r="32"/>
<circle cx="294" cy="316" r="32"/>
<circle cx="300" cy="266" r="34"/>
