<rect x="0.0" y="0.0" width="512.0" height="512.0" rx="0" fill="#cfe8f5" stroke="#1a1a1a" stroke-width="0"/>
<!-- sun visible in the dip between the hills -->
<circle cx="256.0" cy="118.0" r="40.0" fill="#f6a800" stroke="#1a1a1a" stroke-width="0"/>
<!-- left hillside sloping DOWN toward the central valley floor (U-shaped) -->
<path d="M 0 512 L 0 110 Q 60 150 130 300 Q 175 400 200 512 Z" fill="#3fae5a" stroke="#2e8b46" stroke-width="6" stroke-linejoin="round"/>
<!-- right hillside sloping DOWN toward the central valley floor -->
<path d="M 512 512 L 512 110 Q 452 150 382 300 Q 337 400 312 512 Z" fill="#3fae5a" stroke="#2e8b46" stroke-width="6" stroke-linejoin="round"/>
<!-- darker far hillsides for depth -->
<path d="M 0 110 Q 70 160 150 340 L 120 340 Q 50 170 0 150 Z" fill="#2e8b46" stroke="#1a1a1a" stroke-width="0" stroke-linejoin="round"/>
<path d="M 512 110 Q 442 160 362 340 L 392 340 Q 462 170 512 150 Z" fill="#2e8b46" stroke="#1a1a1a" stroke-width="0" stroke-linejoin="round"/>
<!-- river running along the valley FLOOR, narrow far away, widening toward the viewer -->
<path d="M 240 360 L 272 360 L 326 512 L 186 512 Z" fill="#2b86b3" stroke="#1a1a1a" stroke-width="0" stroke-linejoin="round"/>
<path d="M 246 365 L 266 365 L 308 512 L 204 512 Z" fill="#3aa6d6" stroke="#1a1a1a" stroke-width="0" stroke-linejoin="round"/>
