<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- tool-bag: open-top soft canvas tote tool bag with carry handles and tool tops poking out -->

  <!-- bag body (canvas tote, trapezoid shape) -->
  <path d="M 60 210 L 40 100 L 250 100 L 230 210 Z" fill="#9d7246" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>

  <!-- bag fold/opening at top (lighter inner area) -->
  <path d="M 40 100 L 60 210 L 230 210 L 250 100 Z" fill="none" stroke="#1a1a1a" stroke-width="7.40"/>

  <!-- stitching seam lines on bag body -->
  <line x1="80" y1="105" x2="68" y2="200" stroke="#7d5e23" stroke-width="2.96" stroke-dasharray="6,4"/>
  <line x1="210" y1="105" x2="222" y2="200" stroke="#7d5e23" stroke-width="2.96" stroke-dasharray="6,4"/>

  <!-- bottom reinforcement band -->
  <path d="M 56 190 L 234 190 L 230 210 L 60 210 Z" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- carry handles (two arched straps) -->
  <path d="M 100 100 Q 100 55 125 55 Q 150 55 150 100" fill="none" stroke="#7d5e23" stroke-width="11.85" stroke-linecap="round"/>
  <path d="M 155 100 Q 155 55 175 55 Q 200 55 200 100" fill="none" stroke="#7d5e23" stroke-width="11.85" stroke-linecap="round"/>

  <!-- handle attachment patches -->
  <rect x="92" y="92" width="20" height="14" rx="3" fill="#7d5e23" stroke="#1a1a1a" stroke-width="2.96"/>
  <rect x="143" y="92" width="20" height="14" rx="3" fill="#7d5e23" stroke="#1a1a1a" stroke-width="2.96"/>
  <rect x="191" y="92" width="20" height="14" rx="3" fill="#7d5e23" stroke="#1a1a1a" stroke-width="2.96"/>

  <!-- tool tops poking out of bag -->
  <!-- hammer handle -->
  <rect x="90" y="58" width="12" height="45" rx="4" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- hammer head -->
  <rect x="80" y="50" width="30" height="16" rx="3" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- screwdriver handle -->
  <rect x="140" y="50" width="14" height="52" rx="5" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- screwdriver shaft tip -->
  <rect x="145" y="44" width="5" height="14" rx="1" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="2.96"/>

  <!-- wrench top -->
  <rect x="185" y="55" width="10" height="46" rx="3" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="190" cy="52" rx="10" ry="8" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="190" cy="52" rx="5" ry="4" fill="none" stroke="#1a1a1a" stroke-width="2.96"/>

  <!-- pliers handle tip -->
  <rect x="222" y="65" width="11" height="37" rx="4" fill="#ff9900" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="232" y="60" width="11" height="37" rx="4" fill="#ff9900" stroke="#1a1a1a" stroke-width="4.45"/>
</g></svg>