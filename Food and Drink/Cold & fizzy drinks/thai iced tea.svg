  <!-- Glass (tall, tapered) -->
  <path d="M95 40 L80 215 L210 215 L195 40 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Glass base -->
  <rect x="74" y="212" width="142" height="14" rx="6" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Glass top rim -->
  <rect x="92" y="36" width="106" height="12" rx="5" fill="#dff3fd" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>

  <!-- Ice cubes (light blue-white) -->
  <rect x="92" y="55" width="32" height="28" rx="4" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="130" y="60" width="30" height="26" rx="4" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="165" y="57" width="28" height="28" rx="4" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="85" y="78" width="28" height="24" rx="4" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="152" y="80" width="30" height="24" rx="4" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Ice shine lines -->
  <line x1="96" y1="60" x2="96" y2="78" stroke="#ffffff" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="134" y1="65" x2="134" y2="82" stroke="#ffffff" stroke-width="2.96" stroke-linecap="round"/>

  <!-- Bright orange Thai tea (lower 2/3 of glass) -->
  <path d="M83 100 L81 212 L209 212 L207 100 Z" fill="#e65a00" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Tea highlight -->
  <path d="M87 108 L85 200" stroke="#ff9900" stroke-width="7.40" stroke-linecap="round"/>

  <!-- Cream/milk top layer (lighter, sits above orange) -->
