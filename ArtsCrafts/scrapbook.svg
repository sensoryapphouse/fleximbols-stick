<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- scrapbook: chunky book with photos/cutouts + tape + star sticker -->
  <!-- Book body - chunky spine visible -->
  <rect x="40" y="25" width="22" height="190" rx="3" ry="3" fill="#7d5e23" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Book cover -->
  <rect x="55" y="25" width="185" height="190" rx="5" ry="5" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Page edges suggesting thickness -->
  <rect x="57" y="28" width="180" height="184" rx="3" ry="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.22"/>
  <!-- Photo 1 - top left, tilted slightly -->
  <g transform="rotate(-5 100 90)">
    <rect x="70" y="45" width="68" height="55" rx="2" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
    <!-- photo content: simple landscape lines -->
    <rect x="70" y="75" width="68" height="25" rx="0" fill="#529929" stroke="none"/>
    <rect x="70" y="45" width="68" height="30" rx="0" fill="#90a7d6" stroke="none"/>
    <!-- tape strip top -->
    <rect x="88" y="40" width="32" height="10" rx="2" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="2.22" stroke-linejoin="round"/>
  </g>
  <!-- Photo 2 - top right, tilted other way -->
  <g transform="rotate(6 185 85)">
    <rect x="155" y="42" width="62" height="52" rx="2" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
    <rect x="155" y="68" width="62" height="26" rx="0" fill="#67832d" stroke="none"/>
    <rect x="155" y="42" width="62" height="26" rx="0" fill="#dff3fd" stroke="none"/>
    <rect x="172" y="37" width="28" height="10" rx="2" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="2.22" stroke-linejoin="round"/>
  </g>
  <!-- Cutout / ticket shape bottom left -->
  <polygon points="68,140 130,135 135,175 65,180" fill="#fff200" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Tape on cutout -->
  <rect x="85" y="130" width="30" height="10" rx="2" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="2.22" stroke-linejoin="round"/>
  <!-- Washi tape strip bottom -->
  <rect x="55" y="185" width="185" height="14" rx="2" fill="#f266aa" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <!-- Star sticker poking out top right corner -->
  <polygon points="240,18 244,30 257,30 247,38 251,51 240,43 229,51 233,38 223,30 236,30" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
</g></svg>