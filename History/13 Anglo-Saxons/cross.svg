<circle cx="256.0" cy="150.0" r="62.0" fill="none" stroke="#5e5640" stroke-width="20"/>
<circle cx="256.0" cy="150.0" r="62.0" fill="none" stroke="#d6cdb4" stroke-width="11"/>
