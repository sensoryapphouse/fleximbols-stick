  <line x1="74" y1="29" x2="74" y2="25" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="74" y1="29" x2="77" y2="29" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
