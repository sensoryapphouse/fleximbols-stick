  <!-- Pole base / stand -->
  <rect x="60" y="195" width="44" height="14" rx="5" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="50" y="207" width="64" height="10" rx="4" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Spanish flag: red-yellow-red horizontal bands -->
  <!-- Red top band -->
  <rect x="86" y="35" width="130" height="38" rx="3" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Yellow center band -->
