  <circle cx="145" cy="130" r="7" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="190" cy="130" r="6" fill="#d01424" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Decorative scrolls between gems -->
  <path d="M115,130 Q122,124 130,130 Q138,136 130,130" fill="none" stroke="#7d5e23" stroke-width="3.70" stroke-linecap="round"/>
  <path d="M160,130 Q168,124 175,130 Q182,136 175,130" fill="none" stroke="#7d5e23" stroke-width="3.70" stroke-linecap="round"/>
