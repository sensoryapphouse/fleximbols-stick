<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- ground line -->
  <line x1="10" y1="200" x2="280" y2="200" stroke="#1a1a1a" stroke-width="5.33" stroke-linecap="round"/>
  <!-- long station wagon: extended rear cargo area, flat back, no separate trunk -->
  <path d="M 20 195 L 20 160 L 55 115 L 260 115 L 270 130 L 270 195 Z" fill="#137827" stroke="#1a1a1a" stroke-width="5.33" stroke-linejoin="round"/>
  <!-- front windshield -->
  <path d="M 70 125 L 80 135 L 110 135 L 110 118 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- front passenger window -->
  <rect x="115" y="118" width="40" height="20" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- rear passenger window -->
  <rect x="160" y="118" width="40" height="20" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- EXTENDED CARGO AREA WINDOW (long, defining feature) -->
  <rect x="205" y="118" width="55" height="20" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- door pillars -->
  <line x1="155" y1="118" x2="155" y2="195" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="200" y1="118" x2="200" y2="195" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- roof rails (typical station wagon) -->
  <line x1="60" y1="113" x2="258" y2="113" stroke="#1a1a1a" stroke-width="5.33" stroke-linecap="round"/>
  <line x1="80" y1="113" x2="80" y2="108" stroke="#1a1a1a" stroke-width="3.56"/>
  <line x1="240" y1="113" x2="240" y2="108" stroke="#1a1a1a" stroke-width="3.56"/>
  <!-- door handles -->
  <rect x="125" y="155" width="14" height="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.67"/>
  <rect x="170" y="155" width="14" height="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.67"/>
  <!-- headlight -->
  <rect x="24" y="160" width="14" height="10" fill="#fff200" stroke="#1a1a1a" stroke-width="3.56"/>
  <!-- tail light (flat back) -->
  <rect x="252" y="135" width="14" height="40" fill="#f8130d" stroke="#1a1a1a" stroke-width="3.56"/>
  <!-- wheels -->
  <circle cx="75" cy="200" r="20" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.33"/>
  <circle cx="75" cy="200" r="8" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.56"/>
  <circle cx="225" cy="200" r="20" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.33"/>
  <circle cx="225" cy="200" r="8" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.56"/>
</g></svg>