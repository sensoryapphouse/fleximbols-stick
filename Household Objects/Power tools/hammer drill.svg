<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Hammer drill: robust pistol drill, chuck + percussion burst lines at bit, heavier than cordless -->

  <!-- Main motor body (chunkier/heavier barrel than cordless) -->
  <rect x="45" y="65" width="158" height="68" rx="14" ry="14" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="7.40"/>
  <!-- Body ribbing (robust chunky look) -->
  <line x1="90" y1="65" x2="90" y2="133" stroke="#7f7f7f" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="115" y1="65" x2="115" y2="133" stroke="#7f7f7f" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Mode selector collar ring (hammer/drill selector) -->
  <rect x="148" y="62" width="20" height="74" rx="6" ry="6" fill="#f8130d" stroke="#1a1a1a" stroke-width="7.40"/>
  <!-- Selector marks -->
  <line x1="148" y1="82" x2="168" y2="82" stroke="#ffffff" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="148" y1="100" x2="168" y2="100" stroke="#ffffff" stroke-width="2.96" stroke-linecap="round"/>

  <!-- Chuck (heavier, wider than cordless) -->
  <rect x="200" y="79" width="40" height="40" rx="8" ry="8" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="7.40"/>
  <line x1="216" y1="79" x2="216" y2="119" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="226" y1="79" x2="226" y2="119" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Drill bit -->
  <line x1="240" y1="99" x2="265" y2="99" stroke="#4d4d4d" stroke-width="7.40" stroke-linecap="round"/>
  <polygon points="265,94 278,99 265,104" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- Percussion/impact burst lines around chuck/bit area -->
  <line x1="250" y1="86" x2="256" y2="80" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="255" y1="93" x2="263" y2="90" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="250" y1="112" x2="256" y2="118" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="255" y1="106" x2="263" y2="109" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Small arc lines to show vibration/hammer action -->
  <path d="M 243,80 Q 252,85 243,90" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M 243,108 Q 252,113 243,118" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Pistol grip handle -->
  <path d="M 72,131 L 95,131 L 102,200 L 62,200 Z" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>

  <!-- Trigger -->
  <rect x="92" y="142" width="18" height="26" rx="4" ry="4" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.93"/>

  <!-- Side handle (auxiliary handle — robust drills have a side handle on the barrel) -->
  <ellipse cx="55" cy="99" rx="10" ry="6" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.93"/>
  <line x1="45" y1="99" x2="22" y2="99" stroke="#4d4d4d" stroke-width="11.85" stroke-linecap="round"/>
  <ellipse cx="20" cy="99" rx="10" ry="8" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="7.40"/>
</g></svg>