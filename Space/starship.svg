<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Space background -->
  <rect x="26" y="32" width="238" height="176" rx="8" fill="#1d0e82" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Stars -->
  <circle cx="42" cy="38" r="3" fill="#ffffff" stroke="none"/>
  <circle cx="245" cy="50" r="3" fill="#ffffff" stroke="none"/>
  <circle cx="262" cy="32" r="2" fill="#ffffff" stroke="none"/>
  <circle cx="33" cy="90" r="2" fill="#ffffff" stroke="none"/>
  <circle cx="258" cy="110" r="3" fill="#ffffff" stroke="none"/>
  <!-- Starship body - fat stainless cylinder, rounded nose, no fins -->
  <!-- Body cylinder -->
  <rect x="110" y="90" width="70" height="110" rx="12" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Rounded nose (domey top, no sharp point) -->
  <path d="M110,90 Q110,40 145,32 Q180,40 180,90 Z" fill="#efefef" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Stainless steel panel lines (horizontal bands) -->
  <line x1="110" y1="110" x2="180" y2="110" stroke="#7f7f7f" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="110" y1="130" x2="180" y2="130" stroke="#7f7f7f" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="110" y1="150" x2="180" y2="150" stroke="#7f7f7f" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="110" y1="170" x2="180" y2="170" stroke="#7f7f7f" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Canard flaps at top (small, near nose) -->
  <path d="M110,95 L85,75 L95,95 Z" fill="#efefef" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M180,95 L205,75 L195,95 Z" fill="#efefef" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Large aft flaps (at base) -->
  <path d="M110,175 L78,210 L110,198 Z" fill="#efefef" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M180,175 L212,210 L180,198 Z" fill="#efefef" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Engine cluster at base -->
  <rect x="118" y="198" width="54" height="10" rx="5" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Three engine nozzles -->
  <ellipse cx="130" cy="208" rx="7" ry="5" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="145" cy="208" rx="7" ry="5" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="160" cy="208" rx="7" ry="5" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Flames from three engines -->
  <path d="M123,213 Q130,228 137,213 Z" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <path d="M138,213 Q145,228 152,213 Z" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <path d="M153,213 Q160,228 167,213 Z" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <!-- Outer flame glow -->
  <path d="M120,213 Q130,235 140,213 Z" fill="#ff9900" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <path d="M150,213 Q160,235 170,213 Z" fill="#ff9900" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
</g></svg>