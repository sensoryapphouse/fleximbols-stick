  <path d="M10 178 L35 172 L58 176 L50 185 L20 188 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M55 180 L80 175 L95 180 L88 190 L60 190 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M8 190 L30 185 L40 192 L25 200 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Crack lines in ice -->
  <line x1="35" y1="172" x2="50" y2="185" stroke="#90a7d6" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="20" y1="178" x2="35" y2="190" stroke="#90a7d6" stroke-width="4.45" stroke-linecap="round"/>
