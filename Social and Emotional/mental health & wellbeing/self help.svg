  <!-- Figure seated, holding open book -->
  <!-- Body torso -->
  <rect x="118" y="118" width="36" height="44" rx="6" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Head -->
  <circle cx="136" cy="104" r="16" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Left arm down to book -->
  <line x1="118" y1="130" x2="88" y2="148" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <!-- Right arm down to book -->
  <line x1="154" y1="130" x2="184" y2="148" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <!-- Open book: left page -->
  <polygon points="88,148 136,155 136,185 78,182" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Open book: right page -->
  <polygon points="184,148 136,155 136,185 194,182" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Book spine -->
  <line x1="136" y1="155" x2="136" y2="185" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Lines on book pages (text stand-in) -->
  <line x1="95" y1="163" x2="128" y2="165" stroke="#1a1a1a" stroke-width="2.22" stroke-linecap="round"/>
  <line x1="95" y1="172" x2="128" y2="174" stroke="#1a1a1a" stroke-width="2.22" stroke-linecap="round"/>
  <line x1="144" y1="163" x2="178" y2="165" stroke="#1a1a1a" stroke-width="2.22" stroke-linecap="round"/>
  <line x1="144" y1="172" x2="178" y2="174" stroke="#1a1a1a" stroke-width="2.22" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="128" y1="162" x2="118" y2="212" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <line x1="144" y1="162" x2="154" y2="212" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <!-- Lightbulb above head -->
  <circle cx="200" cy="68" r="22" fill="#f7de58" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Bulb base cap -->
  <rect x="192" y="88" width="16" height="7" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Filament lines inside bulb -->
  <polyline points="196,80 200,72 204,80" fill="none" stroke="#1a1a1a" stroke-width="2.22" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Rays from bulb -->
  <line x1="200" y1="40" x2="200" y2="32" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="222" y1="46" x2="228" y2="40" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="178" y1="46" x2="172" y2="40" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="226" y1="68" x2="234" y2="68" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="174" y1="68" x2="166" y2="68" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
