  <!-- Decline bench: head-end LOW, feet-end HIGH (opposite of incline) -->
  <!-- Bench surface: foot at (200,120), head at (50,178) -->
  <path d="M50 178 L200 120 L210 132 L60 190 Z" fill="#9d7246" stroke="#1a1a1a" stroke-width="3.18" stroke-linejoin="round"/>
  <!-- Bench legs -->
  <line x1="62" y1="184" x2="56" y2="215" stroke="#7d5e23" stroke-width="5.08" stroke-linecap="round"/>
  <line x1="190" y1="126" x2="190" y2="215" stroke="#7d5e23" stroke-width="5.08" stroke-linecap="round"/>
  <!-- Ankle hook bar at the high foot end -->
  <line x1="196" y1="116" x2="220" y2="116" stroke="#4d4d4d" stroke-width="5.08" stroke-linecap="round"/>
  <!-- Ankle hook post -->
  <line x1="210" y1="116" x2="210" y2="132" stroke="#4d4d4d" stroke-width="3.81" stroke-linecap="round"/>
  <!-- Figure: HEAD lower-left, FEET upper-right (hooked) -->
  <!-- Head (lower-left, declined) -->
  <circle cx="46" cy="164" r="14" fill="#eed5b6" stroke="#1a1a1a" stroke-width="2.54"/>
  <!-- Torso along declined bench angle -->
  <path d="M58 172 L182 116" fill="none" stroke="#f4a4b2" stroke-width="11.42" stroke-linecap="round"/>
  <!-- Legs upper-right, ankles hooked -->
  <path d="M190 110 l12 -8 l10 0" fill="none" stroke="#eed5b6" stroke-width="5.71" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Ankle locked behind bar -->
  <line x1="212" y1="102" x2="218" y2="116" stroke="#eed5b6" stroke-width="5.08" stroke-linecap="round"/>
  <!-- Arms: from upper torso area pressing barbell up-left -->
  <line x1="100" y1="150" x2="78" y2="112" stroke="#eed5b6" stroke-width="5.71" stroke-linecap="round"/>
  <line x1="126" y1="138" x2="104" y2="100" stroke="#eed5b6" stroke-width="5.71" stroke-linecap="round"/>
  <!-- Barbell shaft (horizontal, above upper chest area) -->
  <line x1="32" y1="98" x2="196" y2="98" stroke="#4d4d4d" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Plates left -->
  <rect x="32" y="82" width="14" height="32" rx="6" fill="#000000" stroke="#1a1a1a" stroke-width="1.91" stroke-linejoin="round"/>
  <!-- Plates right -->
  <rect x="182" y="82" width="14" height="32" rx="6" fill="#000000" stroke="#1a1a1a" stroke-width="1.91" stroke-linejoin="round"/>
  <!-- Plate holes -->
  <circle cx="39" cy="98" r="5" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="1.27"/>
  <circle cx="189" cy="98" r="5" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="1.27"/>
  <!-- Ground line -->
  <line x1="20" y1="216" x2="270" y2="216" stroke="#1a1a1a" stroke-width="2.54" stroke-linecap="round"/>
</g></svg>