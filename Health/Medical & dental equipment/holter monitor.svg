<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Holter monitor: portable ECG device clipped to belt + wires running to chest electrodes -->
  <!-- Background ground line -->
  <path d="M10 226 L280 226" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Person figure (full body bust+torso so belt + chest both visible) -->
  <!-- Head -->
  <circle cx="145" cy="40" r="22" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Hair -->
  <path d="M124 36 Q124 20 145 18 Q166 20 166 36 L164 28 Q156 22 145 22 Q134 22 126 28 Z" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Eyes -->
  <circle cx="138" cy="42" r="2" fill="#000000"/>
  <circle cx="152" cy="42" r="2" fill="#000000"/>
  <!-- Neck -->
  <rect x="138" y="60" width="14" height="10" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Torso (open shirt to show chest electrodes) -->
  <path d="M100 70 L190 70 L194 170 L96 170 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Shirt opening (V neck) -->
  <path d="M145 70 L130 130 L160 130 Z" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Belt -->
  <rect x="96" y="165" width="98" height="14" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Belt buckle -->
  <rect x="140" y="167" width="14" height="10" fill="#f7de58" stroke="#1a1a1a" stroke-width="2.96"/>

  <!-- Pants -->
  <path d="M96 179 L194 179 L188 226 L98 226 Z" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Leg divider -->
  <path d="M145 179 L145 226" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Shoes -->
  <ellipse cx="115" cy="226" rx="18" ry="6" fill="#000000" stroke="#1a1a1a" stroke-width="2.96"/>
  <ellipse cx="175" cy="226" rx="18" ry="6" fill="#000000" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- Arms (along sides) -->
  <path d="M100 75 L82 150 L80 195" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M190 75 L208 150 L210 195" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Chest electrodes -->
  <circle cx="120" cy="105" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="120" cy="105" r="2" fill="#7f7f7f"/>
  <circle cx="170" cy="105" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="170" cy="105" r="2" fill="#7f7f7f"/>
  <circle cx="135" cy="135" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="135" cy="135" r="2" fill="#7f7f7f"/>
  <circle cx="158" cy="135" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="158" cy="135" r="2" fill="#7f7f7f"/>

  <!-- Holter device clipped to belt (right side) -->
  <rect x="208" y="160" width="48" height="40" rx="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Device screen -->
  <rect x="214" y="166" width="36" height="14" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- Mini waveform on device screen -->
  <path d="M216 173 L222 173 L224 169 L226 178 L228 173 L234 173 L236 168 L238 178 L240 173 L248 173" fill="none" stroke="#1a1a1a" stroke-width="2.22" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Buttons -->
  <circle cx="220" cy="190" r="3" fill="#f8130d" stroke="#1a1a1a" stroke-width="2.22"/>
  <circle cx="232" cy="190" r="3" fill="#529929" stroke="#1a1a1a" stroke-width="2.22"/>
  <circle cx="244" cy="190" r="3" fill="#f2e40d" stroke="#1a1a1a" stroke-width="2.22"/>
  <!-- Belt clip -->
  <path d="M232 160 L232 152 L240 152 L240 160" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Wires from electrodes routed to device -->
  <path d="M120 105 Q150 130 200 160" fill="none" stroke="#f8130d" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M170 105 Q190 130 210 162" fill="none" stroke="#2a4ec0" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M135 135 Q170 145 208 165" fill="none" stroke="#7c3fac" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M158 135 Q180 150 210 168" fill="none" stroke="#137827" stroke-width="4.45" stroke-linecap="round"/>
</g></svg>