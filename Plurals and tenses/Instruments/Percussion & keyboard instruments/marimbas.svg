  <rect x="190" y="180" width="12" height="20" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Tube 9: length=33 -->
  <rect x="209" y="184" width="12" height="16" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Tube 10 (treble/rightmost): length=27 -->
  <rect x="221" y="187" width="12" height="13" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- 10 wide warm-brown wooden bars across the top -->
