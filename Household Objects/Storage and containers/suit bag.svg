<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- structured tri-fold suit bag, folded for travel (rectangular, on its side) -->
  <!-- main folded body -->
  <rect x="35" y="60" width="220" height="140" rx="10" fill="#1d0e82" stroke="#1a1a1a" stroke-width="8.89" stroke-linejoin="round"/>
  <!-- tri-fold seam lines (three panels visible) -->
  <line x1="108" y1="60" x2="108" y2="200" stroke="#1a1a1a" stroke-width="5.56" stroke-linecap="round"/>
  <line x1="182" y1="60" x2="182" y2="200" stroke="#1a1a1a" stroke-width="5.56" stroke-linecap="round"/>
  <!-- subtle panel shading -->
  <rect x="108" y="60" width="74" height="140" fill="#2a4ec0" stroke="none"/>
  <rect x="108" y="60" width="74" height="140" fill="none" stroke="#1a1a1a" stroke-width="5.56"/>
  <!-- top zipper line across width -->
  <line x1="45" y1="78" x2="245" y2="78" stroke="#1a1a1a" stroke-width="4.45" stroke-dasharray="4,3"/>
  <!-- zipper pull -->
  <rect x="200" y="73" width="10" height="12" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- carry handle on top -->
  <path d="M 120 60 Q 145 30 170 60" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="7.78" stroke-linejoin="round"/>
  <path d="M 120 60 Q 145 40 170 60" fill="#9d7246" stroke="#1a1a1a" stroke-width="5.56" stroke-linejoin="round"/>
  <!-- handle attachment buckles -->
  <rect x="115" y="56" width="12" height="10" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="163" y="56" width="12" height="10" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- side strap with buckle to keep it folded -->
  <rect x="32" y="125" width="226" height="16" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <rect x="135" y="120" width="20" height="26" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.56"/>
  <line x1="142" y1="126" x2="142" y2="140" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="148" y1="126" x2="148" y2="140" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- small luggage tag -->
  <rect x="50" y="170" width="30" height="20" rx="2" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="55" y1="178" x2="75" y2="178" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="55" y1="184" x2="70" y2="184" stroke="#1a1a1a" stroke-width="3.33"/>
</g></svg>