  <line x1="190" y1="74" x2="241" y2="46" stroke="#1a1a1a" stroke-width="5.93" stroke-linecap="round"/>
  <line x1="192" y1="84" x2="251" y2="118" stroke="#1a1a1a" stroke-width="5.93" stroke-linecap="round"/>
