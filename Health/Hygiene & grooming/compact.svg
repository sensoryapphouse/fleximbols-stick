<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Small neat cube (isometric-ish, centred) -->
  <!-- Front face -->
  <rect x="100" y="105" width="90" height="90" rx="6" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Top face (parallelogram) -->
  <polygon points="100,105 140,80 230,80 190,105" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Right face -->
  <polygon points="190,105 230,80 230,170 190,195" fill="#529929" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Inward arrows (4 directions pointing INTO the cube centre) -->
  <!-- Left inward arrow -->
  <line x1="42" y1="150" x2="92" y2="150" stroke="#d01424" stroke-width="4.45" stroke-linecap="round"/>
  <polygon points="100,150 80,141 80,159" fill="#d01424" stroke="#1a1a1a" stroke-width="2.66" stroke-linejoin="round"/>
  <!-- Right inward arrow -->
  <line x1="248" y1="150" x2="198" y2="150" stroke="#d01424" stroke-width="4.45" stroke-linecap="round"/>
  <polygon points="190,150 210,141 210,159" fill="#d01424" stroke="#1a1a1a" stroke-width="2.66" stroke-linejoin="round"/>
  <!-- Top inward arrow -->
  <line x1="145" y1="30" x2="145" y2="72" stroke="#d01424" stroke-width="4.45" stroke-linecap="round"/>
  <polygon points="145,80 136,60 154,60" fill="#d01424" stroke="#1a1a1a" stroke-width="2.66" stroke-linejoin="round"/>
  <!-- Bottom inward arrow -->
  <line x1="145" y1="210" x2="145" y2="202" stroke="#d01424" stroke-width="4.45" stroke-linecap="round"/>
  <polygon points="145,195 136,215 154,215" fill="#d01424" stroke="#1a1a1a" stroke-width="2.66" stroke-linejoin="round"/>
</g></svg>