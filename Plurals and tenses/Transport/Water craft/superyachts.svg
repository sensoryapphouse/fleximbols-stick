<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><g transform="translate(0.000,16.230) scale(0.9683)"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- superyacht: even bigger luxury motor yacht — more decks, helipad on top, very large (grander than megayacht) -->

  <!-- water band -->
  <path d="M 0 195 Q 36 186 72 195 Q 108 204 144 195 Q 180 186 216 195 Q 252 204 290 195 L 290 240 L 0 240 Z" fill="#2a4ec0" stroke="none"/>
  <path d="M 0 195 Q 36 186 72 195 Q 108 204 144 195 Q 180 186 216 195 Q 252 204 290 195" fill="none" stroke="#1a1a1a" stroke-width="5.33" stroke-linecap="round"/>

  <!-- main hull (very long, sweeping bow) -->
  <path d="M 12 184 Q 28 202 80 207 Q 155 213 230 207 L 274 190 L 265 175 L 80 175 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="8.89" stroke-linejoin="round"/>

  <!-- gold/dark waterline stripe -->
  <path d="M 48 200 Q 130 208 210 204 L 256 196 L 252 192 Q 202 201 125 197 L 52 194 Z" fill="#f7de58" stroke="none"/>

  <!-- DECK 1 - main deck -->
  <rect x="62" y="154" width="202" height="23" rx="3" fill="#efefef" stroke="#1a1a1a" stroke-width="7.11" stroke-linejoin="round"/>
  <!-- deck 1 window strip -->
  <rect x="72" y="159" width="182" height="12" rx="2" fill="#dff3fd" stroke="#1a1a1a" stroke-width="3.56"/>

  <!-- DECK 2 - salon/main bridge deck -->
  <rect x="78" y="122" width="168" height="34" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="7.11" stroke-linejoin="round"/>
  <!-- deck 2 windows - large panoramic -->
  <rect x="88" y="128" width="26" height="16" rx="3" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="120" y="128" width="26" height="16" rx="3" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="152" y="128" width="26" height="16" rx="3" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="184" y="128" width="26" height="16" rx="3" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="216" y="128" width="22" height="16" rx="3" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- DECK 3 - upper deck -->
  <rect x="95" y="95" width="130" height="29" rx="4" fill="#efefef" stroke="#1a1a1a" stroke-width="7.11" stroke-linejoin="round"/>
  <!-- deck 3 windows -->
  <rect x="105" y="101" width="20" height="13" rx="2" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="130" y="101" width="20" height="13" rx="2" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="155" y="101" width="20" height="13" rx="2" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="180" y="101" width="20" height="13" rx="2" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="205" y="101" width="12" height="13" rx="2" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- DECK 4 - sky lounge (top most enclosed deck) -->
  <rect x="110" y="72" width="95" height="25" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.33" stroke-linejoin="round"/>
  <!-- sky lounge windows -->
  <rect x="118" y="77" width="16" height="11" rx="2" fill="#dff3fd" stroke="#1a1a1a" stroke-width="3.56"/>
  <rect x="140" y="77" width="16" height="11" rx="2" fill="#dff3fd" stroke="#1a1a1a" stroke-width="3.56"/>
  <rect x="162" y="77" width="16" height="11" rx="2" fill="#dff3fd" stroke="#1a1a1a" stroke-width="3.56"/>
  <rect x="184" y="77" width="13" height="11" rx="2" fill="#dff3fd" stroke="#1a1a1a" stroke-width="3.56"/>

  <!-- HELIPAD (flat pad on top — key superyacht feature) -->
  <ellipse cx="143" cy="60" rx="40" ry="12" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.33"/>
  <!-- helipad H marking -->
  <line x1="133" y1="57" x2="133" y2="64" stroke="#f7de58" stroke-width="5.33" stroke-linecap="round"/>
  <line x1="153" y1="57" x2="153" y2="64" stroke="#f7de58" stroke-width="5.33" stroke-linecap="round"/>
  <line x1="133" y1="60" x2="153" y2="60" stroke="#f7de58" stroke-width="5.33" stroke-linecap="round"/>
  <!-- helipad circle -->
  <ellipse cx="143" cy="60" rx="35" ry="10" fill="none" stroke="#f7de58" stroke-width="3.56"/>

  <!-- comms mast -->
  <line x1="190" y1="72" x2="185" y2="40" stroke="#4d4d4d" stroke-width="5.33" stroke-linecap="round"/>
  <line x1="185" y1="40" x2="215" y2="40" stroke="#4d4d4d" stroke-width="5.33" stroke-linecap="round"/>
  <!-- radar -->
  <rect x="200" y="34" width="20" height="8" rx="3" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="3.56"/>
  <!-- top antenna -->
  <line x1="210" y1="34" x2="210" y2="22" stroke="#4d4d4d" stroke-width="4.45" stroke-linecap="round"/>
  <!-- flag -->
  <path d="M 210 21 L 226 15 L 210 9 Z" fill="#f8130d" stroke="#1a1a1a" stroke-width="2.67"/>

  <!-- exhaust stacks (twin) -->
  <rect x="228" y="146" width="9" height="26" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="3.56"/>
  <rect x="240" y="146" width="9" height="26" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="3.56"/>
  <!-- exhaust smoke wisps -->
  <path d="M 232 143 Q 228 136 234 130 Q 240 124 236 118" fill="none" stroke="#b8b8b8" stroke-width="3.56" stroke-linecap="round"/>

  <!-- tender deck / swim platform -->
  <rect x="22" y="184" width="42" height="14" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.33"/>

  <!-- deck railing lines (indicating multiple levels) -->
  <line x1="62" y1="154" x2="264" y2="154" stroke="#b8b8b8" stroke-width="3.56"/>
  <line x1="78" y1="122" x2="246" y2="122" stroke="#b8b8b8" stroke-width="3.56"/>
  <line x1="95" y1="95" x2="225" y2="95" stroke="#b8b8b8" stroke-width="3.56"/>
</g></g><g transform="translate(360 8) scale(0.2812)"><defs><radialGradient id="plg3664" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#plg3664)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>