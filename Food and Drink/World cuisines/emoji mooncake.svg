  <!-- round mooncake with decorative pattern + cross-section showing filling -->
  <!-- whole mooncake on left -->
  <circle cx="95" cy="120" r="65" fill="#e6b98a" stroke="#1a1a1a" stroke-width="8.89"/>
  <!-- decorative top pattern: scalloped border -->
  <circle cx="95" cy="120" r="50" fill="none" stroke="#9d7246" stroke-width="6.67"/>
  <!-- centre decorative motif (flower-like) -->
  <circle cx="95" cy="120" r="12" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- four petal indents -->
  <circle cx="95" cy="85" r="7" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="95" cy="155" r="7" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="60" cy="120" r="7" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="130" cy="120" r="7" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- cross-section slice on right (half-moon wedge) -->
  <path d="M210 60 L210 180 C175 180 175 60 210 60 Z" fill="#e6b98a" stroke="#1a1a1a" stroke-width="8.89" stroke-linejoin="round"/>
  <!-- inner filling (dark red bean / lotus paste) -->
  <path d="M205 75 L205 165 C185 165 185 75 205 75 Z" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- egg yolk circle inside filling -->
  <circle cx="200" cy="120" r="14" fill="#ff9900" stroke="#1a1a1a" stroke-width="6.67"/>
  <circle cx="196" cy="116" r="3" fill="#fff200" stroke="#1a1a1a" stroke-width="2.22"/>
</g></svg>