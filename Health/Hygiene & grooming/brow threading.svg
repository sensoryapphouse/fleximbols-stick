  <path d="M2 124 L36 122 L36 138 L2 140 Z" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- RIGHT HAND (other end of thread) -->
  <path d="M282 80 Q286 98 282 118 Q278 132 268 134 L256 132 Q248 128 250 118 L254 106 Q250 96 254 90 L258 88 Q262 96 264 100 L266 86 Q270 80 274 82 L276 98 L280 88 Q284 80 282 80 Z" fill="#e6b98a" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Right hand wrist/cuff -->
  <path d="M288 134 L254 132 L254 148 L288 150 Z" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
