<!-- inner cube -->
<rect x="105" y="100" width="80" height="80" fill="#7aaae8" stroke="#1a1a1a" stroke-width="3"/>
<rect x="95" y="80" width="80" height="80" fill="none" stroke="#1a1a1a" stroke-width="3"/>
