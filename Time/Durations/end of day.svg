  <line x1="145" y1="60" x2="145" y2="52" stroke="#f8130d" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="163" y1="66" x2="169" y2="60" stroke="#f8130d" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="127" y1="66" x2="121" y2="60" stroke="#f8130d" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Floor / ground line -->
  <rect x="20" y="198" width="250" height="8" rx="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Empty desk -->
  <rect x="30" y="156" width="160" height="10" rx="3" fill="#9d7246" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <rect x="40" y="166" width="10" height="32" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="168" y="166" width="10" height="32" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Desk chair tucked in (empty) -->
  <rect x="82" y="170" width="50" height="8" rx="3" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="84" y="178" width="8" height="20" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="122" y="178" width="8" height="20" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Clock showing 5 o'clock on wall -->
  <ellipse cx="220" cy="120" rx="28" ry="28" fill="#ffffff" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
