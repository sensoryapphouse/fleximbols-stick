  <!-- Pill organizer: compact 2x2 grid case (4 compartments), clearly smaller than 7-day organizer -->
  <!-- Outer case body -->
  <rect x="70" y="42" width="150" height="156" rx="16" ry="16" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="11.11" stroke-linejoin="round"/>
  <!-- Horizontal divider -->
  <rect x="70" y="116" width="150" height="12" rx="0" ry="0" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Vertical divider -->
  <rect x="141" y="42" width="12" height="156" rx="0" ry="0" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- 4 coloured lids, each inset slightly -->
  <!-- Top-left: blue -->
  <rect x="74" y="46" width="63" height="66" rx="10" ry="10" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="8.89" stroke-linejoin="round"/>
  <!-- Top-right: green -->
  <rect x="157" y="46" width="59" height="66" rx="10" ry="10" fill="#529929" stroke="#1a1a1a" stroke-width="8.89" stroke-linejoin="round"/>
  <!-- Bottom-left: orange -->
  <rect x="74" y="132" width="63" height="62" rx="10" ry="10" fill="#ff9900" stroke="#1a1a1a" stroke-width="8.89" stroke-linejoin="round"/>
  <!-- Bottom-right: red -->
  <rect x="157" y="132" width="59" height="62" rx="10" ry="10" fill="#f8130d" stroke="#1a1a1a" stroke-width="8.89" stroke-linejoin="round"/>
  <!-- Pills in compartments -->
  <!-- Top-left: round pill -->
  <circle cx="105" cy="79" r="13" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Top-right: capsule pill -->
  <rect x="162" y="68" width="42" height="16" rx="8" ry="8" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="162" y="68" width="21" height="16" rx="8" ry="0" fill="#f7de58" stroke="none"/>
  <!-- Bottom-left: round pill -->
  <circle cx="105" cy="163" r="13" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Bottom-right: oval pill -->
  <ellipse cx="186" cy="163" rx="16" ry="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
</g></svg>