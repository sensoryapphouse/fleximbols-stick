  <!-- Quilt block: 4x3 grid of square patches, each split diagonally into two triangles -->
  <!-- Row 1 -->
  <!-- Patch 0,0 -->
  <polygon points="30,20 90,20 30,80" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polygon points="90,20 90,80 30,80" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Patch 1,0 -->
  <polygon points="90,20 150,20 90,80" fill="#529929" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polygon points="150,20 150,80 90,80" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Patch 2,0 -->
  <polygon points="150,20 210,20 150,80" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polygon points="210,20 210,80 150,80" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Patch 3,0 -->
  <polygon points="210,20 270,20 210,80" fill="#7c3fac" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polygon points="270,20 270,80 210,80" fill="#529929" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Row 2 -->
  <!-- Patch 0,1 -->
  <polygon points="30,80 90,80 30,140" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polygon points="90,80 90,140 30,140" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Patch 1,1 -->
  <polygon points="90,80 150,80 90,140" fill="#ff9900" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polygon points="150,80 150,140 90,140" fill="#529929" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Patch 2,1 -->
  <polygon points="150,80 210,80 150,140" fill="#d01424" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polygon points="210,80 210,140 150,140" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Patch 3,1 -->
  <polygon points="210,80 270,80 210,140" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polygon points="270,80 270,140 210,140" fill="#7c3fac" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Row 3 -->
  <!-- Patch 0,2 -->
  <polygon points="30,140 90,140 30,200" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polygon points="90,140 90,200 30,200" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Patch 1,2 -->
  <polygon points="90,140 150,140 90,200" fill="#529929" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polygon points="150,140 150,200 90,200" fill="#ff9900" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Patch 2,2 -->
  <polygon points="150,140 210,140 150,200" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polygon points="210,140 210,200 150,200" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Patch 3,2 -->
  <polygon points="210,140 270,140 210,200" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polygon points="270,140 270,200 210,200" fill="#d01424" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Outer border -->
  <rect x="30" y="20" width="240" height="180" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
</g></svg>