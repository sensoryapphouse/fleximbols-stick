  <!-- Hard clamshell glasses case, closed, landscape oval shape -->
  <!-- Bottom half of clamshell -->
  <rect x="40" y="128" width="210" height="68" rx="34" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Top half of clamshell -->
  <rect x="40" y="62" width="210" height="68" rx="34" fill="#1d0e82" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Highlight sheen on lid -->
  <rect x="55" y="70" width="180" height="22" rx="24" fill="#90a7d6" stroke="none"/>
  <!-- Seam line between top and bottom halves -->
  <line x1="40" y1="128" x2="250" y2="128" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Hinge at right end -->
  <rect x="238" y="118" width="14" height="20" rx="5" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round" stroke-linejoin="round"/>
