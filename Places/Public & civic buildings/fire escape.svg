  <!-- Building wall face (left side) -->
  <rect x="25" y="28" width="60" height="195" fill="#efefef" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Windows on building -->
  <rect x="35" y="45" width="18" height="22" rx="2" fill="#90a7d6" stroke="#1a1a1a" stroke-width="3.33"/>
  <rect x="57" y="45" width="18" height="22" rx="2" fill="#90a7d6" stroke="#1a1a1a" stroke-width="3.33"/>
  <rect x="35" y="88" width="18" height="22" rx="2" fill="#90a7d6" stroke="#1a1a1a" stroke-width="3.33"/>
