  <!-- Step surface top -->
  <rect x="22" y="110" width="130" height="18" rx="4" ry="4" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Step riser -->
  <rect x="130" y="128" width="18" height="100" rx="4" ry="4" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
