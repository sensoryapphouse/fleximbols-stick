  <!-- jigsaw-tool: compact power tool body with top D-handle, thin short straight vertical blade pointing down -->
  <!-- Base plate (shoe) -->
  <rect x="85" y="185" width="115" height="14" rx="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="6.83"/>
  <!-- Thin vertical blade pointing down from base -->
  <rect x="137" y="198" width="10" height="30" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.47"/>
  <!-- Blade teeth on right edge -->
  <polyline points="147,200 152,206 147,212 152,218 147,224" fill="none" stroke="#1a1a1a" stroke-width="4.10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Main compact tool body -->
  <rect x="85" y="100" width="115" height="88" rx="12" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="6.83"/>
  <!-- Motor housing detail -->
  <ellipse cx="143" cy="145" rx="30" ry="28" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.47"/>
  <!-- Ventilation slots -->
  <line x1="92" y1="115" x2="92" y2="180" stroke="#1a1a1a" stroke-width="2.74" stroke-linecap="round"/>
  <line x1="100" y1="115" x2="100" y2="180" stroke="#1a1a1a" stroke-width="2.74" stroke-linecap="round"/>
  <line x1="183" y1="115" x2="183" y2="180" stroke="#1a1a1a" stroke-width="2.74" stroke-linecap="round"/>
  <line x1="191" y1="115" x2="191" y2="180" stroke="#1a1a1a" stroke-width="2.74" stroke-linecap="round"/>
  <!-- Trigger switch -->
  <rect x="108" y="155" width="18" height="26" rx="5" fill="#ff9900" stroke="#1a1a1a" stroke-width="5.47"/>
  <!-- D-handle on top - looped arch -->
  <path d="M105,102 Q105,50 143,42 Q180,42 180,102" fill="none" stroke="#ff9900" stroke-width="30.07" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M105,102 Q105,50 143,42 Q180,42 180,102" fill="none" stroke="#1a1a1a" stroke-width="6.83" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- D-handle inner outline -->
  <path d="M115,102 Q115,60 143,52 Q170,60 170,102" fill="none" stroke="#1a1a1a" stroke-width="4.10" stroke-linecap="round"/>
  <!-- Orbital action dial -->
