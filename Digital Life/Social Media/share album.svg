  <polygon points="50,150 80,100 115,150" fill="#67832d" stroke="#1a1a1a" stroke-width="3.70" stroke-linejoin="round" transform="rotate(-2 96 111)"/>
  <!-- front photo -->
  <rect x="44" y="58" width="120" height="130" rx="6" ry="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
