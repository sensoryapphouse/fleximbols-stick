  <!-- Garden fork: 4 short flat sturdy straight tines, D-grip handle -->
  <!-- 4 tines - flat and sturdy, straight -->
  <!-- Tine 1 (leftmost) -->
  <rect x="86" y="125" width="14" height="80" rx="3" ry="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Tine 2 -->
  <rect x="111" y="125" width="14" height="80" rx="3" ry="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Tine 3 -->
  <rect x="136" y="125" width="14" height="80" rx="3" ry="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Tine 4 (rightmost) -->
  <rect x="161" y="125" width="14" height="80" rx="3" ry="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Tine tips (pointed) -->
  <polygon points="86,205 100,205 93,225" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <polygon points="111,205 125,205 118,225" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <polygon points="136,205 150,205 143,225" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <polygon points="161,205 175,205 168,225" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <!-- Head crossbar connecting tines -->
  <rect x="82" y="118" width="97" height="16" rx="4" ry="4" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Socket/collar -->
  <rect x="118" y="98" width="25" height="28" rx="4" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Long shaft -->
  <rect x="124" y="38" width="13" height="65" rx="5" ry="5" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- D-grip handle -->
  <rect x="124" y="15" width="13" height="42" rx="5" ry="5" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- D curve -->
  <path d="M 137,15 Q 172,36 137,57" fill="none" stroke="#9d7246" stroke-width="12.22" stroke-linecap="round"/>
  <path d="M 137,15 Q 172,36 137,57" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
