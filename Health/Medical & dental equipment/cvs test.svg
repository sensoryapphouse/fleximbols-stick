  <!-- cvs-test: chorionic villus sampling - needle through uterine wall extracting placenta sample -->

  <!-- uterus outline (rounded pear shape) -->
  <path d="M 60,90 Q 50,150 90,190 Q 145,220 200,190 Q 240,150 230,90 Q 220,60 180,55 Q 145,52 110,55 Q 70,60 60,90 Z" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="8.08" stroke-linejoin="round"/>

  <!-- amniotic sac (inner) -->
  <ellipse cx="145" cy="135" rx="60" ry="55" fill="#dff3fd" stroke="#1a1a1a" stroke-width="6.47"/>

  <!-- fetus silhouette (curled) -->
  <path d="M 130,120 Q 120,130 125,145 Q 130,160 145,160 Q 158,158 162,148 Q 165,138 158,130 Q 152,122 145,120 Q 138,118 130,120 Z" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.85" stroke-linejoin="round"/>
  <circle cx="135" cy="125" r="6" fill="#eed5b6" stroke="#1a1a1a" stroke-width="3.23"/>

  <!-- placenta (attached to uterine wall, upper left) -->
  <path d="M 70,90 Q 65,75 80,68 Q 100,62 118,72 Q 128,80 122,95 Q 115,108 95,108 Q 78,106 70,90 Z" fill="#d01424" stroke="#1a1a1a" stroke-width="6.47" stroke-linejoin="round"/>
  <!-- villi texture on placenta -->
  <circle cx="85" cy="82" r="3" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="2.43"/>
  <circle cx="100" cy="78" r="3" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="2.43"/>
  <circle cx="110" cy="90" r="3" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="2.43"/>
  <circle cx="92" cy="95" r="3" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="2.43"/>

  <!-- needle entering through upper wall toward placenta -->
  <line x1="245" y1="35" x2="115" y2="85" stroke="#b8b8b8" stroke-width="8.08" stroke-linecap="round"/>
  <line x1="245" y1="35" x2="115" y2="85" stroke="#1a1a1a" stroke-width="3.23" stroke-linecap="round"/>

  <!-- syringe barrel -->
  <rect x="240" y="20" width="36" height="14" rx="3" ry="3" fill="#dff3fd" stroke="#1a1a1a" stroke-width="6.47" stroke-linejoin="round" transform="rotate(-22 258 27)"/>
  <!-- plunger -->
  <rect x="270" y="14" width="14" height="26" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.85" stroke-linejoin="round" transform="rotate(-22 277 27)"/>

  <!-- sample being drawn (arrow pointing back) -->
  <path d="M 130,80 L 150,72 L 146,78 L 156,75 L 152,82 L 142,84 Z" fill="#d01424" stroke="#1a1a1a" stroke-width="4.04" stroke-linejoin="round"/>
</g></svg>