<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Machine body (orange-toned to differ from coffee-machine) -->
  <rect x="72" y="60" width="116" height="140" rx="12" ry="12" fill="#e65a00" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Top lid / water fill -->
  <rect x="82" y="38" width="96" height="26" rx="8" ry="8" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Basket filter housing (prominent, centred high) -->
  <rect x="100" y="95" width="60" height="38" rx="8" ry="8" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Filter paper shape inside basket -->
  <path d="M108,100 L108,128 Q130,134 152,128 L152,100 Z" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="3.55" stroke-linejoin="round"/>
  <!-- Coffee grounds in filter -->
  <ellipse cx="130" cy="118" rx="18" ry="8" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="2.66"/>
  <!-- Drip drops falling from basket -->
  <ellipse cx="125" cy="140" rx="4" ry="6" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="2.66"/>
  <ellipse cx="135" cy="143" rx="3" ry="5" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="2.66"/>
  <!-- Warming plate -->
  <rect x="82" y="190" width="96" height="10" rx="4" ry="4" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Glass carafe (slightly narrower than coffee-machine) -->
  <path d="M100,152 L104,190 L156,190 L160,152 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Coffee in carafe -->
  <path d="M105,174 L105,190 L155,190 L155,174 Z" fill="#9d7246" stroke="none"/>
  <line x1="103" y1="174" x2="157" y2="174" stroke="#1a1a1a" stroke-width="3.55" stroke-linecap="round"/>
  <!-- Carafe handle -->
  <path d="M160,158 Q176,158 176,170 Q176,185 160,185" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Carafe spout nub -->
  <path d="M100,156 Q90,153 88,146" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Power button -->
  <circle cx="168" cy="80" r="9" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.55"/>
</g></svg>