<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Pitchfork: 3 long thin slightly curved tines, long straight shaft, NO D-grip -->
  <!-- 3 long tines - thinner, longer, slightly curved/spread at tips -->
  <!-- Tine 1 (left) - slightly curves left -->
  <path d="M 108,120 Q 104,165 100,215" fill="none" stroke="#b8b8b8" stroke-width="7.77" stroke-linecap="round"/>
  <!-- Tine 1 tip sharp point -->
  <ellipse cx="100" cy="217" rx="3.5" ry="5" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="2.22"/>
  <!-- Tine 2 (centre) - straight -->
  <line x1="145" y1="120" x2="145" y2="220" stroke="#b8b8b8" stroke-width="7.77" stroke-linecap="round"/>
  <ellipse cx="145" cy="222" rx="3.5" ry="5" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="2.22"/>
  <!-- Tine 3 (right) - slightly curves right -->
  <path d="M 182,120 Q 186,165 190,215" fill="none" stroke="#b8b8b8" stroke-width="7.77" stroke-linecap="round"/>
  <ellipse cx="190" cy="217" rx="3.5" ry="5" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="2.22"/>
  <!-- Outline tines properly -->
  <path d="M 105,120 Q 101,165 97,215" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M 111,120 Q 107,165 103,215" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="142" y1="120" x2="142" y2="220" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="148" y1="120" x2="148" y2="220" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M 179,120 Q 183,165 187,215" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M 185,120 Q 189,165 193,215" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Head crossbar -->
  <rect x="100" y="112" width="90" height="14" rx="4" ry="4" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Socket/collar - narrower than garden fork -->
  <rect x="135" y="88" width="20" height="30" rx="3" ry="3" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Long straight shaft (taller, longer than garden fork) -->
  <rect x="139" y="12" width="12" height="80" rx="5" ry="5" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Simple straight top end (no D-grip - hay fork style) -->
  <rect x="136" y="8" width="18" height="14" rx="6" ry="6" fill="#7d5e23" stroke="#1a1a1a" stroke-width="3.33"/>
</g><g transform="translate(360 8) scale(0.2812)"><defs><radialGradient id="plg2214" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#plg2214)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>