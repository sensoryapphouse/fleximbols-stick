  <!-- Liquid lipstick - glossy bottle with doe-foot wand applicator -->
  <!-- Bottle body (glossy) -->
  <rect x="95" y="100" width="60" height="120" rx="6" ry="6" fill="#d01424" stroke="#1a1a1a" stroke-width="8.08" stroke-linejoin="round"/>
  <!-- Inner glossy liquid window -->
  <rect x="103" y="110" width="44" height="95" rx="3" ry="3" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.04"/>
  <!-- Strong glossy shine lines -->
  <line x1="110" y1="118" x2="110" y2="195" stroke="#ffffff" stroke-width="4.85" stroke-linecap="round"/>
  <line x1="118" y1="120" x2="118" y2="180" stroke="#f4a4b2" stroke-width="3.23" stroke-linecap="round"/>
  <!-- Cap/collar of bottle -->
  <rect x="92" y="84" width="66" height="18" rx="4" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="8.08" stroke-linejoin="round"/>
  <!-- Wand handle extending up from cap -->
  <rect x="118" y="22" width="14" height="64" rx="3" ry="3" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="6.47" stroke-linejoin="round"/>
  <!-- Doe-foot applicator (wide flat paddle tip) -->
  <ellipse cx="125" cy="18" rx="22" ry="10" fill="#d01424" stroke="#1a1a1a" stroke-width="6.47"/>
  <!-- Glossy shine on doe-foot -->
  <ellipse cx="125" cy="18" rx="14" ry="6" fill="#f4a4b2" stroke="none"/>
  <!-- LIQUID label as paths (L I Q U I D) -->
  <!-- Liquid drip from applicator -->
  <path d="M125 28 Q125 38 128 44 Q130 48 125 48 Q120 48 122 44 Q125 38 125 28 Z" fill="#d01424" stroke="#1a1a1a" stroke-width="4.04" stroke-linejoin="round"/>
  <!-- lips + gloss shine (replaces LIQUID text) -->
  <path d="M205 165 Q218 156 232 165 Q238 174 232 181 Q218 188 205 181 Q198 174 205 165 Z" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.04" stroke-linejoin="round"/>
  <path d="M209 165 Q218 161 227 165" fill="none" stroke="#ffffff" stroke-width="4.04" stroke-linecap="round"/>
  <ellipse cx="215" cy="170" rx="4" ry="2" fill="#ffffff" stroke="none" opacity=".6"/>
</g></svg>