  <line x1="155" y1="125" x2="170" y2="125" stroke="#1d0e82" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="155" y1="135" x2="170" y2="135" stroke="#529929" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="265" y1="115" x2="282" y2="115" stroke="#d01424" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="265" y1="125" x2="282" y2="125" stroke="#1d0e82" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="265" y1="135" x2="282" y2="135" stroke="#529929" stroke-width="4.45" stroke-linecap="round"/>
  <!-- check mark on tidy side -->
  <path d="M195 60 L215 80 L250 45" fill="none" stroke="#529929" stroke-width="5.33" stroke-linecap="round" stroke-linejoin="round"/>
