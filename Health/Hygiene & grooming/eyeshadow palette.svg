<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Large modern palette with 12 colours in 3x4 grid + mirror + brushes -->
  <!-- Palette case (large, low) -->
  <rect x="20" y="80" width="250" height="140" rx="12" fill="#000000" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Split: top half = mirror lid (open, integrated), bottom half = pans grid -->
  <!-- Mirror (top portion inside lid) -->
  <rect x="32" y="92" width="226" height="48" rx="6" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.93"/>
  <!-- Mirror sheen lines -->
  <line x1="44" y1="102" x2="100" y2="102" stroke="#ffffff" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="44" y1="112" x2="80" y2="112" stroke="#ffffff" stroke-width="2.96" stroke-linecap="round"/>
  <!-- Hinge divider -->
  <line x1="20" y1="146" x2="270" y2="146" stroke="#1a1a1a" stroke-width="5.93" stroke-linecap="round"/>
  <!-- Pans grid 3 rows x 4 cols, in bottom region (y 152 - 212) -->
  <!-- Row 1 y=162 -->
  <rect x="34" y="152" width="48" height="20" rx="3" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="88" y="152" width="48" height="20" rx="3" fill="#f266aa" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="142" y="152" width="48" height="20" rx="3" fill="#7c3fac" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="196" y="152" width="48" height="20" rx="3" fill="#392170" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Row 2 y=180 -->
  <rect x="34" y="176" width="48" height="20" rx="3" fill="#ff9900" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="88" y="176" width="48" height="20" rx="3" fill="#e65a00" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="142" y="176" width="48" height="20" rx="3" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="196" y="176" width="48" height="20" rx="3" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Row 3 y=204 -->
  <rect x="34" y="200" width="48" height="16" rx="3" fill="#f2e40d" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="88" y="200" width="48" height="16" rx="3" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="142" y="200" width="48" height="16" rx="3" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="196" y="200" width="48" height="16" rx="3" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Two brushes laid across top, angled -->
  <g transform="rotate(-12 100 50)">
    <rect x="40" y="44" width="80" height="8" rx="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
    <rect x="118" y="42" width="8" height="12" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="2.96"/>
    <ellipse cx="138" cy="48" rx="16" ry="8" fill="#7c3fac" stroke="#1a1a1a" stroke-width="4.45"/>
  </g>
  <g transform="rotate(12 200 60)">
    <rect x="148" y="54" width="80" height="8" rx="4" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="4.45"/>
    <rect x="146" y="52" width="8" height="12" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="2.96"/>
    <ellipse cx="136" cy="58" rx="14" ry="7" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>
  </g>
</g></svg>