  <path d="M145 100 L65 70" fill="none" stroke="#fff200" stroke-width="5.93" stroke-linecap="round"/>
  <path d="M145 100 L240 110" fill="none" stroke="#ffffff" stroke-width="5.93" stroke-linecap="round"/>
  <path d="M145 100 L50 110" fill="none" stroke="#ffffff" stroke-width="5.93" stroke-linecap="round"/>
  <path d="M145 100 L215 145" fill="none" stroke="#fff200" stroke-width="5.93" stroke-linecap="round"/>
  <path d="M145 100 L75 145" fill="none" stroke="#fff200" stroke-width="5.93" stroke-linecap="round"/>
