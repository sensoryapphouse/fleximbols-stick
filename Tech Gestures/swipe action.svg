<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Touchscreen/phone with hand swiping horizontally -->

  <!-- Phone/screen device -->
  <rect x="55" y="25" width="180" height="190" rx="16" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="7.40"/>
  <!-- Screen surface -->
  <rect x="65" y="40" width="160" height="160" rx="8" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Home button at bottom -->
  <circle cx="145" cy="207" r="7" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Screen content (simplified icons being swiped) -->
  <!-- Left page content (going out left) -->
  <rect x="68" y="52" width="60" height="48" rx="5" fill="#90a7d6" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="68" y="108" width="60" height="12" rx="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="2.96"/>
  <rect x="68" y="126" width="40" height="10" rx="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="2.96"/>

  <!-- Right page content (coming in from right) -->
  <rect x="152" y="52" width="68" height="48" rx="5" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="152" y="108" width="68" height="12" rx="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="2.96"/>
  <rect x="152" y="126" width="45" height="10" rx="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="2.96"/>

  <!-- Vertical divider line suggesting boundary between pages -->
  <line x1="145" y1="48" x2="145" y2="192" stroke="#7f7f7f" stroke-width="2.96" stroke-dasharray="4,4"/>

  <!-- Index finger swiping horizontally left-to-right -->
  <!-- Finger (pointing right, curved) -->
  <path d="M 72 155 Q 78 148 88 148 L 188 152 Q 198 152 202 158 Q 206 165 198 170 Q 192 174 186 170 L 88 165 Q 80 165 76 162 Z" fill="#e6b98a" stroke="#1a1a1a" stroke-width="5.93"/>
  <!-- Fingertip highlight -->
  <ellipse cx="196" cy="160" rx="10" ry="10" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Swipe trail arrow (horizontal, left to right) -->
  <!-- Trail line -->
  <line x1="80" y1="145" x2="186" y2="145" stroke="#2a4ec0" stroke-width="5.93" stroke-linecap="round" stroke-dasharray="10,5"/>
  <!-- Arrow head pointing right -->
  <polygon points="192,145 178,138 178,152" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Motion lines from swipe (speed cues) -->
  <line x1="72" y1="152" x2="55" y2="152" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="72" y1="160" x2="58" y2="160" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="72" y1="168" x2="60" y2="168" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
</g></svg>