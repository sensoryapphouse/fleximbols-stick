  <rect x="26" y="200" width="238" height="14" rx="2" ry="2" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Main building body -->
  <rect x="34" y="112" width="222" height="90" rx="4" ry="4" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
