  <rect x="30" y="80" width="230" height="14" fill="#e65a00" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="30" y="196" width="230" height="14" fill="#e65a00" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- top lid (closed, thick) -->
  <rect x="20" y="58" width="250" height="28" fill="#ff9900" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- lid bolts (showing sturdiness) -->
  <circle cx="40" cy="72" r="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.22"/>
  <circle cx="250" cy="72" r="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.22"/>
  <!-- heavy latches (two) -->
  <rect x="80" y="78" width="22" height="22" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="188" y="78" width="22" height="22" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="91" cy="89" r="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="2.22"/>
  <circle cx="199" cy="89" r="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="2.22"/>
  <!-- side rigid handle -->
  <rect x="50" y="120" width="38" height="14" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="202" y="120" width="38" height="14" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <g stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round" fill="#000000">
  <!-- corner reinforcements showing rigidity -->
  <path d="M 30 80 L 30 100 M 30 80 L 50 80" stroke="#5e1f0a" stroke-width="4.45"/>
