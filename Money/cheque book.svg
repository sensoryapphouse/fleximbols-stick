<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<!-- back cover -->
<path d="M 96 150 L 400 118 L 416 272 L 112 304 Z" fill="#8a5a2b" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- cheque leaf -->
<path d="M 108 162 L 388 132 L 402 266 L 122 296 Z" fill="#c7e8a0" stroke="#1a1a1a" stroke-width="8" stroke-linejoin="round"/>
<!-- stub perforation -->
<line x1="164" y1="158" x2="176" y2="292" stroke="#1a1a1a" stroke-width="4" stroke-dasharray="8 7"/>
<!-- cheque ruled lines -->
<line x1="204" y1="182" x2="376" y2="164" stroke="#5aa83c" stroke-width="5" stroke-linecap="round"/>
<line x1="208" y1="216" x2="380" y2="198" stroke="#5aa83c" stroke-width="5" stroke-linecap="round"/>
<line x1="212" y1="250" x2="330" y2="238" stroke="#5aa83c" stroke-width="5" stroke-linecap="round"/>
<!-- ===== pen writing on the cheque: nib rests on the middle ruled line ===== -->
<!-- barrel -->
<line x1="238" y1="220" x2="418" y2="356" stroke="#3d7fb5" stroke-width="24" stroke-linecap="round"/>
<!-- barrel gloss -->
<line x1="252" y1="228" x2="410" y2="348" stroke="#6fb0e0" stroke-width="6" stroke-linecap="round"/>
<!-- silver metal grip band near the tip -->
<line x1="238" y1="220" x2="268" y2="242" stroke="#9aa0a6" stroke-width="24" stroke-linecap="round"/>
<!-- pen nib / tip touching the cheque -->
<polygon points="216,204 240,222 226,240 208,224" fill="#cfd6dc" stroke="#1a1a1a" stroke-width="7" stroke-linejoin="round"/>
<!-- fine point of the nib on the paper -->
<line x1="216" y1="204" x2="206" y2="196" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
<!-- pen cap end button -->
<circle cx="418" cy="356" r="14" fill="#3d7fb5" stroke="#1a1a1a" stroke-width="7"/>
</svg>
