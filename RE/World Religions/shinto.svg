  <path d="M40 60 L250 60 L240 50 L50 50 Z" fill="#d01424" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <rect x="60" y="85" width="170" height="9" fill="#d01424" stroke="#1a1a1a" stroke-width="6.67"/>
  <rect x="65" y="74" width="22" height="136" fill="#d01424" stroke="#1a1a1a" stroke-width="6.67"/>
  <rect x="203" y="74" width="22" height="136" fill="#d01424" stroke="#1a1a1a" stroke-width="6.67"/>
  <!-- shimenawa rope across uprights -->
  <path d="M65 110 Q145 130 225 110" fill="none" stroke="#7d5e23" stroke-width="13.34" stroke-linecap="round"/>
  <path d="M75 116 L85 122 M95 119 L105 125 M115 121 L125 127 M145 124 L155 127 M165 122 L175 126 M185 118 L195 124" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- paper streamers (shide) -->
  <path d="M120 124 L116 140 L122 138 L118 152 L126 150 L120 124 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <path d="M170 124 L166 140 L172 138 L168 152 L176 150 L170 124 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- sakaki tree (left of gate, behind) -->
  <rect x="22" y="150" width="10" height="60" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="27" cy="140" r="22" fill="#529929" stroke="#1a1a1a" stroke-width="6.67"/>
  <circle cx="14" cy="130" r="14" fill="#67832d" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="40" cy="128" r="13" fill="#67832d" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- miko priestess (full body, between uprights) -->
  <g transform="translate(145,150)">
    <!-- head -->
    <circle cx="0" cy="-10" r="11" fill="#eed5b6" stroke="#1a1a1a" stroke-width="6.67"/>
    <!-- hair -->
    <path d="M-11 -14 Q-12 -22 0 -22 Q12 -22 11 -14 Q12 -8 8 -6 L-8 -6 Q-12 -8 -11 -14 Z" fill="#000000" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
    <path d="M-6 -2 L-6 14 M6 -2 L6 14" stroke="#1a1a1a" stroke-width="4.45"/>
    <!-- white haori top -->
    <path d="M-14 -2 L-16 30 L16 30 L14 -2 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
    <line x1="0" y1="-2" x2="0" y2="30" stroke="#1a1a1a" stroke-width="4.45"/>
    <!-- arms -->
    <rect x="-20" y="-2" width="6" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
    <rect x="14" y="-2" width="6" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
