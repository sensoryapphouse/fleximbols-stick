<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Vinyl: turntable platter + record disc + centre label + tonearm -->
  <!-- Turntable base -->
  <rect x="30" y="130" width="200" height="88" rx="10" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Platter -->
  <circle cx="130" cy="138" rx="90" ry="90" r="88" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Record disc -->
  <circle cx="130" cy="138" r="78" fill="#000000" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Groove rings -->
  <circle cx="130" cy="138" r="68" fill="none" stroke="#4d4d4d" stroke-width="2.22"/>
  <circle cx="130" cy="138" r="56" fill="none" stroke="#4d4d4d" stroke-width="2.22"/>
  <circle cx="130" cy="138" r="44" fill="none" stroke="#4d4d4d" stroke-width="2.22"/>
  <!-- Centre label -->
  <circle cx="130" cy="138" r="30" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="130" cy="138" r="16" fill="#d01424" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Spindle hole -->
  <circle cx="130" cy="138" r="5" fill="#000000" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Tonearm pivot base -->
  <circle cx="226" cy="72" r="12" fill="#9d7246" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Tonearm -->
  <line x1="226" y1="72" x2="168" y2="118" stroke="#9d7246" stroke-width="8.88" stroke-linecap="round"/>
  <!-- Headshell -->
  <rect x="155" y="112" width="22" height="10" rx="4" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Stylus -->
  <line x1="168" y1="122" x2="168" y2="132" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Tonearm counterweight -->
  <circle cx="226" cy="60" r="8" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
</g></svg>