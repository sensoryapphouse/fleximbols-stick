<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<!-- handheld energy display unit -->
<rect x="206" y="116" width="180" height="246" rx="26" fill="#f4c430" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- screen showing usage figure -->
<rect x="230" y="144" width="132" height="74" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="6"/>
<!-- bar-graph reading on screen -->
<g stroke="#1a1a1a" stroke-width="4">
<rect x="244" y="190" width="14" height="18" fill="#8cc152"/>
<rect x="266" y="178" width="14" height="30" fill="#8cc152"/>
<rect x="288" y="166" width="14" height="42" fill="#f4c430"/>
<rect x="310" y="172" width="14" height="36" fill="#e08a3a"/>
<rect x="332" y="160" width="14" height="48" fill="#d63b46"/>
</g>
<!-- control buttons -->
<g stroke="#1a1a1a" stroke-width="5" fill="#cfd6dc">
<circle cx="244" cy="252" r="14"/><circle cx="296" cy="252" r="14"/><circle cx="348" cy="252" r="14"/>
</g>
<!-- big round centre button -->
<circle cx="296" cy="312" r="26" fill="#5aa83c" stroke="#1a1a1a" stroke-width="7"/>
<!-- power cable trailing out -->
<path d="M 296 362 Q 200 400 150 360 Q 120 336 96 366" fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
</svg>
