    <path d="M-16 30 L-18 58 L-2 58 L0 30 L2 58 L18 58 L16 30 Z" fill="#d01424" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
    <!-- feet -->
