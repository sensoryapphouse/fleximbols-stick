  <!-- covid-vaccine: vial labelled with virus icon + syringe -->

  <!-- vaccine vial (left) -->
  <!-- vial cap (rubber stopper top) -->
  <rect x="60" y="50" width="50" height="14" rx="3" ry="3" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
