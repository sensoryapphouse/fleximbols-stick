  <!-- collar -->
  <rect x="118" y="44" width="54" height="10" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- upper tube body -->
  <rect x="120" y="54" width="50" height="100" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- modern minimal branding line -->
  <path d="M128 90 L162 90" fill="none" stroke="#ffffff" stroke-width="4.45" stroke-linecap="round"/>

  <!-- twist dial (lower) -->
  <rect x="118" y="154" width="54" height="22" fill="#137827" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
