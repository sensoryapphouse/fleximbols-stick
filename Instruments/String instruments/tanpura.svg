<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Tanpura: long-necked drone, slim long neck, round gourd body, NO frets, 4 strings, tall -->
  <!-- Round gourd body at bottom -->
  <ellipse cx="145" cy="197" rx="52" ry="36" fill="#9d7246" stroke="#1a1a1a" stroke-width="11.11"/>
  <ellipse cx="145" cy="190" rx="40" ry="26" fill="#7d5e23" stroke="#1a1a1a" stroke-width="0.00"/>
  <ellipse cx="145" cy="197" rx="52" ry="36" fill="none" stroke="#1a1a1a" stroke-width="11.11"/>
  <!-- Slim long neck (no frets — plain) -->
  <rect x="136" y="30" width="18" height="172" rx="4" fill="#7d5e23" stroke="#1a1a1a" stroke-width="11.11"/>
  <!-- Nut at bottom of neck / top of body -->
  <rect x="134" y="158" width="22" height="5" rx="2" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="6.67"/>
  <!-- NO fret lines (distinguishes from sitar) -->
  <!-- Headstock -->
  <rect x="130" y="15" width="30" height="20" rx="4" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="11.11"/>
  <!-- 4 tuning pegs -->
  <circle cx="136" cy="11" r="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="142" cy="11" r="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="148" cy="11" r="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="154" cy="11" r="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- 4 strings from headstock to body -->
  <line x1="137" y1="15" x2="137" y2="197" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="141" y1="15" x2="141" y2="197" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="146" y1="15" x2="146" y2="197" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="151" y1="15" x2="151" y2="197" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Bridge -->
  <rect x="133" y="155" width="24" height="5" rx="2" fill="#7d5e23" stroke="#1a1a1a" stroke-width="6.67"/>
</g></svg>