<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Serger / overlock sewing machine with 3-4 thread cones and looper threads -->
  <!-- Machine body -->
  <rect x="60" y="100" width="180" height="110" rx="10" ry="10" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Top arm/head of machine -->
  <rect x="80" y="60" width="130" height="50" rx="8" ry="8" fill="#efefef" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Arm extension -->
  <rect x="190" y="70" width="30" height="80" rx="6" ry="6" fill="#efefef" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Presser foot area -->
  <rect x="195" y="140" width="18" height="20" rx="3" ry="3" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Needle(s) -->
  <line x1="202" y1="140" x2="202" y2="162" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="207" y1="140" x2="207" y2="162" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Throat plate / bed -->
  <rect x="60" y="155" width="180" height="12" rx="4" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Base plate -->
  <rect x="45" y="195" width="210" height="18" rx="6" ry="6" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Thread cone 1 (leftmost) -->
  <polygon points="55,95 65,40 75,95" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Thread cone 2 -->
  <polygon points="78,95 88,42 98,95" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Thread cone 3 -->
  <polygon points="101,95 111,44 121,95" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Thread cone 4 -->
  <polygon points="124,95 134,46 144,95" fill="#529929" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Cone holders (pins) -->
  <line x1="65" y1="95" x2="65" y2="65" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="88" y1="95" x2="88" y2="65" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="111" y1="95" x2="111" y2="65" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="134" y1="95" x2="134" y2="65" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Thread guides / looper threads running to needle area -->
  <path d="M65,65 Q100,55 202,140" fill="none" stroke="#f8130d" stroke-width="2.22" stroke-linecap="round"/>
  <path d="M88,65 Q130,50 205,140" fill="none" stroke="#f7de58" stroke-width="2.22" stroke-linecap="round"/>
  <path d="M111,65 Q150,52 202,142" fill="none" stroke="#2a4ec0" stroke-width="2.22" stroke-linecap="round"/>
  <!-- Tension dials on arm -->
  <circle cx="105" cy="82" r="7" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="125" cy="82" r="7" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Front panel button -->
  <circle cx="90" cy="130" r="8" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Cutting blade indicator -->
  <rect x="192" y="130" width="6" height="25" rx="2" ry="2" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="3.33"/>
</g></svg>