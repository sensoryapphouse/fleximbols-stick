<svg xmlns="http://www.w3.org/2000/svg" viewBox="15.52 29.17 480.97 480.97">
<!-- lightest: a feather floating up high (bold) vs a heavy stone weight on ground (faded); arrow on feather -->
<!-- ground -->
<line x1="50" y1="430" x2="462" y2="430" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
<!-- heavy weight (faded), grounded -->
<g opacity="0.34">
<g transform="translate(370 430)">
<path d="M -70 0 L -56 -150 L 56 -150 L 70 0 Z" fill="#7da0c4" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<rect x="-24" y="-180" width="48" height="32" rx="7" fill="none" stroke="#1a1a1a" stroke-width="9"/>
</g>
</g>
<!-- feather (bold), floating high -->
<g transform="translate(150 200)">
<!-- shaft -->
<line x1="60" y1="-90" x2="-20" y2="80" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
<!-- vane outline -->
<path d="M 60 -90 Q 120 -40 84 30 Q 30 95 -20 80 Q -8 40 6 0 Q 22 -50 60 -90 Z" fill="#cdeefc" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- barbs -->
<line x1="40" y1="-50" x2="70" y2="-36" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
<line x1="28" y1="-20" x2="66" y2="-6" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
<line x1="16" y1="10" x2="58" y2="24" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
<line x1="4" y1="42" x2="40" y2="54" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
</g>
<!-- little float/motion marks under feather -->
<line x1="110" y1="320" x2="130" y2="300" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
<line x1="160" y1="335" x2="180" y2="315" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
<!-- bold green arrow pointing at the feather -->
<line x1="250" y1="120" x2="250" y2="190" stroke="#1a1a1a" stroke-width="24.0" stroke-linecap="round"/><line x1="250" y1="190" x2="223" y2="160" stroke="#1a1a1a" stroke-width="24.0" stroke-linecap="round"/><line x1="250" y1="190" x2="277" y2="160" stroke="#1a1a1a" stroke-width="24.0" stroke-linecap="round"/><line x1="250" y1="120" x2="250" y2="190" stroke="#2f9e4a" stroke-width="18.5" stroke-linecap="round"/>
<line x1="250" y1="190" x2="223" y2="160" stroke="#2f9e4a" stroke-width="18.5" stroke-linecap="round"/>
<line x1="250" y1="190" x2="277" y2="160" stroke="#2f9e4a" stroke-width="18.5" stroke-linecap="round"/>
</svg>
