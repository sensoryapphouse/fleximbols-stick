  <!-- Pterosaur (Pteranodon-style): front 3/4 view, large backward crest, toothless beak, broad wings -->
  <!-- Left wing membrane — large bat-like membrane -->
  <path d="M 118 118 Q 62 90 12 62 Q 30 108 52 148 Q 82 155 118 148 Z" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right wing membrane -->
  <path d="M 172 118 Q 228 90 278 62 Q 260 108 238 148 Q 208 155 172 148 Z" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Body -->
  <ellipse cx="145" cy="140" rx="34" ry="25" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Head with backward crest (Pteranodon-style: long bony crest sweeping back-up) -->
  <path d="M 168 125 Q 198 112 226 120 Q 245 118 256 128 Q 246 140 226 138 Q 198 138 168 132 Z" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Beak (long, toothless) -->
  <path d="M 252 124 Q 275 126 278 133 Q 272 142 252 134" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Backward crest (long bone pointing up-back-left from head) -->
  <path d="M 168 124 Q 152 100 140 70 Q 140 82 145 96 Q 152 110 168 128 Z" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Wing finger bone (leading edge) -->
  <line x1="118" y1="118" x2="12" y2="62" stroke="#392170" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="172" y1="118" x2="278" y2="62" stroke="#392170" stroke-width="2.96" stroke-linecap="round"/>
  <!-- Legs -->
  <path d="M 135 163 L 128 192 M 128 192 L 120 202 M 128 192 L 136 202" stroke="#5e1f0a" stroke-width="7.40" stroke-linecap="round" fill="none"/>
  <path d="M 155 163 L 162 192 M 162 192 L 154 202 M 162 192 L 170 202" stroke="#5e1f0a" stroke-width="7.40" stroke-linecap="round" fill="none"/>
  <!-- Eye -->
  <circle cx="220" cy="127" r="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.22"/>
  <circle cx="220" cy="127" r="2" fill="#000000"/>
