  <rect x="95" y="42" width="100" height="55" rx="6" ry="6" fill="#1d0e82" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Display: drawn digit segments (decorative) -->
  <rect x="110" y="52" width="5" height="14" rx="1" fill="#90a7d6"/>
  <rect x="106" y="52" width="14" height="5" rx="1" fill="#90a7d6"/>
  <rect x="106" y="65" width="14" height="5" rx="1" fill="#90a7d6"/>
  <rect x="120" y="52" width="5" height="14" rx="1" fill="#90a7d6"/>
  <rect x="120" y="65" width="14" height="5" rx="1" fill="#90a7d6"/>
  <rect x="116" y="52" width="14" height="5" rx="1" fill="#90a7d6"/>
  <rect x="116" y="65" width="14" height="5" rx="1" fill="#90a7d6"/>
  <rect x="130" y="52" width="5" height="14" rx="1" fill="#90a7d6"/>
  <rect x="140" y="52" width="14" height="5" rx="1" fill="#90a7d6"/>
  <rect x="140" y="65" width="14" height="5" rx="1" fill="#90a7d6"/>
  <rect x="154" y="52" width="5" height="27" rx="1" fill="#90a7d6"/>
  <rect x="154" y="78" width="14" height="5" rx="1" fill="#90a7d6"/>
  <!-- Rotary dial selector -->
  <circle cx="145" cy="140" r="38" fill="#efefef" stroke="#1a1a1a" stroke-width="5.55"/>
  <circle cx="145" cy="140" r="28" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Dial positions around outer ring -->
  <circle cx="145" cy="106" r="4" fill="#f8130d" stroke="#1a1a1a" stroke-width="3.33"/>
  <circle cx="173" cy="118" r="4" fill="#000000" stroke="#1a1a1a" stroke-width="2.22"/>
  <circle cx="181" cy="148" r="4" fill="#000000" stroke="#1a1a1a" stroke-width="2.22"/>
  <circle cx="168" cy="170" r="4" fill="#000000" stroke="#1a1a1a" stroke-width="2.22"/>
  <circle cx="145" cy="176" r="4" fill="#000000" stroke="#1a1a1a" stroke-width="2.22"/>
  <circle cx="122" cy="170" r="4" fill="#000000" stroke="#1a1a1a" stroke-width="2.22"/>
  <circle cx="109" cy="148" r="4" fill="#000000" stroke="#1a1a1a" stroke-width="2.22"/>
  <circle cx="117" cy="118" r="4" fill="#000000" stroke="#1a1a1a" stroke-width="2.22"/>
  <!-- Dial pointer (knob indicator) -->
  <line x1="145" y1="140" x2="145" y2="116" stroke="#ffffff" stroke-width="4.45" stroke-linecap="round"/>
  <circle cx="145" cy="140" r="8" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="3.33"/>
