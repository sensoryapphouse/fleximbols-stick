  <rect x="24" y="130" width="22" height="18" rx="4" fill="#f8130d" stroke="#1a1a1a" stroke-width="5.18" stroke-linejoin="round"/>
  <line x1="43" y1="130" x2="35" y2="128" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
