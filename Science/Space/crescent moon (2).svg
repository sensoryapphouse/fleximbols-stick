  <!-- Occluding circle to carve crescent shape -->
  <circle cx="158" cy="108" r="70" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- Single star (5-point) to the upper right of crescent -->
