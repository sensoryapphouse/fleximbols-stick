<path d="M 322 372 Q 322 338 360 338 L 470 338 Q 484 338 484 360 L 484 372 Z" fill="#bfe3e0" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
<!-- patient head on pillow -->
