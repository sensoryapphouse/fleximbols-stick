<rect x="-34" y="-30" width="64" height="34" rx="8" fill="#e23c3c" stroke="#1a1a1a" stroke-width="8"/>
<rect x="34" y="-28" width="52" height="32" rx="8" fill="#f4a93c" stroke="#1a1a1a" stroke-width="8"/>
<!-- seat dividers -->
