  <rect x="160" y="82" width="14" height="6" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.55"></rect>
  <!-- Meat strips -->
  <rect x="115" y="94" width="20" height="6" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="3.55"></rect>
  <rect x="155" y="94" width="20" height="6" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="3.55"></rect>
