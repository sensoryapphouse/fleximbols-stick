  <path d="M118 92 Q132 105 122 128" fill="none" stroke="#eed5b6" stroke-width="10.00" stroke-linecap="round"/>
  <!-- Legs -->
  <rect x="83" y="148" width="14" height="60" rx="5" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="3.33"/>
  <rect x="103" y="148" width="14" height="60" rx="5" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Feet -->
  <ellipse cx="90" cy="214" rx="9" ry="6" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="2.78"/>
  <ellipse cx="110" cy="214" rx="9" ry="6" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="2.78"/>
  <!-- Breath-in arrow (4) -->
  <path d="M135 60 Q160 55 180 60" fill="none" stroke="#137827" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M173 53 L180 60 L173 67" fill="none" stroke="#137827" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 4 numeral (drawn as path) -->
  <path d="M195 45 L195 65 L220 65 M215 45 L215 80" fill="none" stroke="#137827" stroke-width="5.55" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hold arrow (7) - circular hold loop -->
