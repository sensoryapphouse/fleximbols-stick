<rect x="120" y="150" width="118" height="60" rx="8" fill="#dfe6ec" stroke="#1a1a1a" stroke-width="8"/>
<rect x="120" y="146" width="34" height="78" rx="6" fill="#cfd6dc" stroke="#1a1a1a" stroke-width="8"/>
<rect x="200" y="158" width="44" height="30" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="7"/>
<line x1="138" y1="210" x2="138" y2="246" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
<line x1="226" y1="210" x2="226" y2="246" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
<!-- front bed -->
<rect x="120" y="300" width="200" height="74" rx="10" fill="#eef1f4" stroke="#1a1a1a" stroke-width="9"/>
