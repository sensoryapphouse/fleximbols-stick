  <!-- Tread wheels inside treads -->
  <circle cx="40" cy="187" r="10" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="80" cy="187" r="10" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="120" cy="187" r="10" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="160" cy="187" r="10" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="200" cy="187" r="10" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="240" cy="187" r="10" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Tread grooves (vertical lines) -->
  <line x1="30" y1="170" x2="30" y2="205" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="55" y1="170" x2="55" y2="205" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="100" y1="170" x2="100" y2="205" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="140" y1="170" x2="140" y2="205" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="180" y1="170" x2="180" y2="205" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="220" y1="170" x2="220" y2="205" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="260" y1="170" x2="260" y2="205" stroke="#1a1a1a" stroke-width="3.33"/>

  <!-- Cabin body -->
  <path d="M70 100 L210 100 L225 170 L55 170 Z" fill="#f7de58" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- Cabin windshield -->
  <path d="M82 110 L200 110 L210 145 L72 145 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="5.56" stroke-linejoin="round"/>
  <!-- Windshield split -->
  <line x1="141" y1="110" x2="141" y2="145" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Side door line -->
  <line x1="155" y1="145" x2="160" y2="170" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Cabin roof light bar -->
  <rect x="95" y="92" width="90" height="10" rx="2" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="110" cy="97" r="3" fill="#fff200" stroke="#1a1a1a" stroke-width="3.33"/>
  <circle cx="140" cy="97" r="3" fill="#fff200" stroke="#1a1a1a" stroke-width="3.33"/>
  <circle cx="170" cy="97" r="3" fill="#fff200" stroke="#1a1a1a" stroke-width="3.33"/>

  <!-- Front grooming blade attachment (right side) -->
  <path d="M225 150 L275 130 L275 175 L225 170 Z" fill="#d01424" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- Blade ridges -->
  <line x1="240" y1="140" x2="240" y2="172" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="255" y1="135" x2="255" y2="174" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="270" y1="131" x2="270" y2="175" stroke="#1a1a1a" stroke-width="4.45"/>
