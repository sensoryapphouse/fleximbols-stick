<!-- whole tool rotated -38deg so it lies on a diagonal, tip up-right -->
<g transform="rotate(-38 256 256)">
<!-- power cord trailing from base of handle -->
<path d="M 120 256 Q 78 256 86 300 Q 94 340 132 322" fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
<!-- red moulded handle -->
<rect x="118" y="224" width="170" height="64" rx="30" fill="#d63b46" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- grip ridges -->
<line x1="150" y1="232" x2="150" y2="280" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
<line x1="172" y1="232" x2="172" y2="280" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
<!-- metal barrel -->
<rect x="280" y="232" width="118" height="48" rx="16" fill="#9aa0a6" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- copper soldering tip (cone) attached to barrel end -->
<polygon points="392,234 452,256 392,278" fill="#c89a5b" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- molten glow at the very tip -->
<circle cx="452" cy="256" r="12" fill="#f4c430" stroke="#1a1a1a" stroke-width="6"/>
</g>
</svg>
