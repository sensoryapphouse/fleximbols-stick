<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- ground line -->
  <line x1="10" y1="200" x2="280" y2="200" stroke="#1a1a1a" stroke-width="6.67"/>
  <!-- crossover: between sedan and SUV - moderate height, car-based -->
  <!-- main body (medium height, rounded) -->
  <path d="M20 180 L20 130 Q30 115 50 115 L70 115 L95 90 L195 90 L222 115 L260 115 Q270 120 270 130 L270 180 Z" fill="#ff9900" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- windshield (moderate rake) -->
  <path d="M75 118 L100 95 L138 95 L138 118 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- rear hatch window (slopes down at back) -->
  <path d="M148 95 L185 95 L215 118 L148 118 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- door pillar -->
  <line x1="143" y1="95" x2="143" y2="160" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- hatchback seam (rear hatch goes all way to roof) -->
  <line x1="215" y1="118" x2="222" y2="115" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- door handles -->
  <rect x="100" y="140" width="14" height="4" fill="#000000"/>
  <rect x="170" y="140" width="14" height="4" fill="#000000"/>
  <!-- headlight -->
  <rect x="22" y="140" width="14" height="12" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- taillight -->
  <rect x="254" y="140" width="14" height="12" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- grille -->
  <rect x="22" y="158" width="20" height="14" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- side cladding (crossover trait - body cladding around wheel arches) -->
  <path d="M45 175 Q70 165 100 175" fill="none" stroke="#4d4d4d" stroke-width="13.34" stroke-linecap="round"/>
  <path d="M195 175 Q220 165 245 175" fill="none" stroke="#4d4d4d" stroke-width="13.34" stroke-linecap="round"/>
  <!-- wheels -->
  <circle cx="70" cy="190" r="20" fill="#000000"/>
  <circle cx="70" cy="190" r="13" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="70" cy="190" r="5" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="220" cy="190" r="20" fill="#000000"/>
  <circle cx="220" cy="190" r="13" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="220" cy="190" r="5" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
</g></svg>