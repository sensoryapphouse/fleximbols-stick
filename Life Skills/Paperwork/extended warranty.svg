  <line x1="172" y1="78" x2="172" y2="84" stroke="#1a1a1a" stroke-width="3.81" stroke-linecap="round"/>
  <line x1="172" y1="136" x2="172" y2="142" stroke="#1a1a1a" stroke-width="3.81" stroke-linecap="round"/>
