  <ellipse cx="160" cy="135" rx="10" ry="16" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="4.45" transform="rotate(30 160 135)"/>
  <ellipse cx="120" cy="128" rx="8" ry="14" fill="#f266aa" stroke="#1a1a1a" stroke-width="4.45" transform="rotate(-55 120 128)"/>
  <ellipse cx="170" cy="128" rx="8" ry="14" fill="#f266aa" stroke="#1a1a1a" stroke-width="4.45" transform="rotate(55 170 128)"/>
