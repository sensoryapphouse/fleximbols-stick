  <!-- Flag waving right edge (slight taper/wave effect) -->
  <path d="M216,35 Q224,54 216,73" fill="none" stroke="#d01424" stroke-width="3.33" stroke-linecap="round"/>
  <path d="M216,129 Q224,148 216,167" fill="none" stroke="#d01424" stroke-width="3.33" stroke-linecap="round"/>

