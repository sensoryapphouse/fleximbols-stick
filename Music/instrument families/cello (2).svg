  <!-- Scroll spiral -->
  <path d="M 109,5 Q 105,6 106,10 Q 107,14 111,15 Q 115,16 116,13 Q 117,10 115,8"
    fill="none" stroke="#5e1f0a" stroke-width="2.96" stroke-linecap="round"/>

  <!-- Pegbox -->
  <path d="M 113,22 L 109,22 L 107,42 L 131,42 L 129,22 L 125,22 Z"
