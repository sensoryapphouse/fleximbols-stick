<!-- snowflake centred on front face -->
<g stroke="#3aa6d6" stroke-linecap="round" fill="none">
<line x1="172" y1="295" x2="258" y2="295" stroke-width="9"/>
<line x1="194" y1="258" x2="236" y2="332" stroke-width="9"/>
<line x1="236" y1="258" x2="194" y2="332" stroke-width="9"/>
<g stroke-width="6">
<line x1="240" y1="295" x2="252" y2="285"/>
<line x1="240" y1="295" x2="252" y2="305"/>
<line x1="190" y1="295" x2="178" y2="285"/>
