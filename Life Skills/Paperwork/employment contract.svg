  <path d="M100,158 L145,150 L190,158 L190,170 L145,178 L100,170 Z" fill="#e6b98a" stroke="#1a1a1a" stroke-width="5.56" stroke-linejoin="round"/>
  <line x1="120" y1="158" x2="125" y2="170" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="135" y1="155" x2="140" y2="172" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="150" y1="155" x2="155" y2="172" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="165" y1="158" x2="170" y2="170" stroke="#1a1a1a" stroke-width="3.33"/>
