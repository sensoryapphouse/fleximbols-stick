  <line x1="140" y1="215" x2="108" y2="195" stroke="#1a1a1a" stroke-width="6.67" stroke-linecap="round"/>
  <line x1="108" y1="195" x2="98" y2="187" stroke="#529929" stroke-width="4.45" stroke-linecap="round"/>
