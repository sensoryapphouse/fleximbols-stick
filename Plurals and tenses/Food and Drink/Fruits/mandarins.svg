  <defs>
    <!-- Large 5-point star r=26 -->
    <path id="bigstar" d="M0,-26 L6.1,-8.4 L24.7,-8.1 L10.0,3.2 L15.3,22.4 L0,11.7 L-15.3,22.4 L-10.0,3.2 L-24.7,-8.1 L-6.1,-8.4 Z"/>
    <!-- Small 5-point star r=9 -->
    <path id="smstar" d="M0,-9 L2.1,-2.9 L8.6,-2.8 L3.5,1.1 L5.3,7.8 L0,4.1 L-5.3,7.8 L-3.5,1.1 L-8.6,-2.8 L-2.1,-2.9 Z"/>
