  <!-- Main body - tall chunky arm -->
  <rect x="40" y="108" width="210" height="68" rx="12" ry="12" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Top ridge on body -->
  <rect x="50" y="112" width="190" height="16" rx="6" ry="6" fill="#90a7d6" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Staple magazine bay at front underside -->
  <rect x="44" y="155" width="120" height="18" rx="4" ry="4" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Heavy staples visible in magazine -->
  <rect x="55" y="159" width="14" height="8" rx="1" ry="1" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="2.96"/>
  <rect x="75" y="159" width="14" height="8" rx="1" ry="1" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="2.96"/>
  <rect x="95" y="159" width="14" height="8" rx="1" ry="1" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="2.96"/>
  <rect x="115" y="159" width="14" height="8" rx="1" ry="1" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- Hinge at back -->
  <circle cx="235" cy="142" r="14" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.93"/>
  <circle cx="235" cy="142" r="6" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Handle top cap -->
  <rect x="42" y="90" width="206" height="26" rx="10" ry="10" fill="#1d0e82" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
