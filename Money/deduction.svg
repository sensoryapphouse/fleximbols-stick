  <!-- Dollar amount with arrow subtracting, minus sign, result lower -->
  <!-- Top: full coin -->
  <circle cx="80" cy="55" r="28" fill="#f2e40d" stroke="#1a1a1a" stroke-width="4.45"/>
  <path d="M80 40 L80 70 M73 47 Q65 47 65 54 Q65 59 80 59 Q95 59 95 64 Q95 70 88 70 L73 70" fill="none" stroke="#137827" stroke-width="5.93" stroke-linecap="round"/>
  <!-- Minus sign (big, central) -->
  <rect x="120" y="100" width="60" height="16" fill="#d01424" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Subtracted bill flying off -->
  <rect x="180" y="50" width="50" height="28" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" transform="rotate(-12 205 64)"/>
  <path d="M205 64 L205 64 M193 56 L193 72 M217 56 L217 72" stroke="#7f7f7f" stroke-width="1.48" transform="rotate(-12 205 64)"/>
  <!-- Down arrow showing reduction -->
  <path d="M80 95 L80 165" fill="none" stroke="#d01424" stroke-width="8.88" stroke-linecap="round"/>
  <path d="M80 165 L70 153 M80 165 L90 153" stroke="#d01424" stroke-width="8.88" stroke-linecap="round"/>
  <!-- Bottom: smaller coin (result lower) -->
  <circle cx="80" cy="195" r="18" fill="#f2e40d" stroke="#1a1a1a" stroke-width="4.45"/>
  <path d="M80 185 L80 207 M75 190 Q70 190 70 195 Q70 198 80 198 Q90 198 90 202 Q90 207 85 207 L75 207" fill="none" stroke="#137827" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Equals sign -->
  <rect x="125" y="180" width="30" height="6" fill="#000000" stroke="#1a1a1a" stroke-width="2.96"/>
  <rect x="125" y="195" width="30" height="6" fill="#000000" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- Smaller result coin on right -->
  <circle cx="200" cy="190" r="22" fill="#f2e40d" stroke="#1a1a1a" stroke-width="4.45"/>
  <path d="M200 178 L200 202 M194 184 Q188 184 188 190 Q188 194 200 194 Q212 194 212 198 Q212 202 206 202 L194 202" fill="none" stroke="#137827" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Curved arrow showing subtraction action -->
  <path d="M108 55 Q140 50 145 95" fill="none" stroke="#7f7f7f" stroke-width="4.45" stroke-linecap="round" stroke-dasharray="4 3"/>
</g></svg>