<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<!-- tartan / plaid swatch -->
<defs>
<clipPath id="sw"><rect x="116" y="116" width="280" height="280" rx="10"/></clipPath>
</defs>
<g clip-path="url(#sw)">
<rect x="116" y="116" width="280" height="280" fill="#5aa83c"/>
<!-- broad vertical bands -->
<rect x="150" y="116" width="40" height="280" fill="#3a7d28"/>
<rect x="300" y="116" width="40" height="280" fill="#3a7d28"/>
<!-- broad horizontal bands -->
<rect x="116" y="150" width="280" height="40" fill="#3a7d28"/>
<rect x="116" y="300" width="280" height="40" fill="#3a7d28"/>
<!-- red stripes -->
<rect x="210" y="116" width="16" height="280" fill="#d63b46"/>
<rect x="116" y="210" width="280" height="16" fill="#d63b46"/>
<!-- yellow thin stripes -->
<rect x="170" y="116" width="6" height="280" fill="#f4c430"/>
<rect x="320" y="116" width="6" height="280" fill="#f4c430"/>
<rect x="116" y="170" width="280" height="6" fill="#f4c430"/>
<rect x="116" y="320" width="280" height="6" fill="#f4c430"/>
<!-- black grid lines -->
<rect x="256" y="116" width="8" height="280" fill="#1a1a1a"/>
<rect x="116" y="256" width="280" height="8" fill="#1a1a1a"/>
</g>
<rect x="116" y="116" width="280" height="280" rx="10" fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
</svg>
