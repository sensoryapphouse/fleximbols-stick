  <!-- chimney/smoke hole at top -->
  <rect x="135" y="48" width="20" height="16" fill="#7d5e23" stroke="#1a1a1a" stroke-width="5.33" stroke-linejoin="round"/>
  <!-- smoke -->
  <path d="M140 48 C135 38 150 32 145 22 C140 14 155 10 150 0" fill="none" stroke="#b8b8b8" stroke-width="7.11" stroke-linecap="round"/>
