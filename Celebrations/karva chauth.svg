<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Karva Chauth: moon viewed through sieve + Indian woman in sari + henna hand -->
  <!-- Night sky stars -->
  <circle cx="40" cy="30" r="1.5" fill="#f2e40d"/>
  <circle cx="75" cy="20" r="1.5" fill="#f2e40d"/>
  <circle cx="265" cy="35" r="1.5" fill="#f2e40d"/>
  <circle cx="245" cy="20" r="1.5" fill="#f2e40d"/>
  <!-- Moon (top right, partially visible) -->
  <circle cx="220" cy="55" r="28" fill="#fff200" stroke="#1a1a1a" stroke-width="5.56"/>
  <!-- Moon crater details -->
  <circle cx="210" cy="48" r="4" fill="#eed5b6" stroke="#1a1a1a" stroke-width="3.33"/>
  <circle cx="228" cy="60" r="3" fill="#eed5b6" stroke="#1a1a1a" stroke-width="3.33"/>
  <circle cx="218" cy="68" r="2.5" fill="#eed5b6" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Sieve held in front of moon (round flat sieve) -->
  <circle cx="220" cy="55" r="35" fill="none" stroke="#7d5e23" stroke-width="8.89"/>
  <!-- Sieve mesh pattern -->
  <path d="M188 45 L252 45 M188 55 L252 55 M188 65 L252 65 M195 25 L195 85 M205 23 L205 87 M215 22 L215 88 M225 22 L225 88 M235 23 L235 87 M245 25 L245 85" stroke="#7d5e23" stroke-width="2.67"/>
  <!-- Sieve outer rim -->
  <circle cx="220" cy="55" r="35" fill="none" stroke="#1a1a1a" stroke-width="5.56"/>
  <circle cx="220" cy="55" r="38" fill="none" stroke="#9d7246" stroke-width="6.67"/>
  <!-- Woman in traditional sari (full body, left side) -->
  <!-- Head -->
  <circle cx="95" cy="65" r="18" fill="#eed5b6" stroke="#1a1a1a" stroke-width="6.67"/>
  <!-- Hair (long dark hair) -->
  <path d="M77 60 Q77 42 95 38 Q113 42 113 60 Q108 50 95 50 Q82 50 77 60 Z" fill="#000000" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Bindi (red dot on forehead) -->
  <circle cx="95" cy="55" r="3" fill="#f8130d" stroke="#1a1a1a" stroke-width="2.22"/>
  <!-- Eyes -->
  <circle cx="89" cy="64" r="2" fill="#000000"/>
  <circle cx="101" cy="64" r="2" fill="#000000"/>
  <!-- Smile -->
  <path d="M88 72 Q95 76 102 72" fill="none" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Earrings -->
  <circle cx="77" cy="70" r="2.5" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.33"/>
  <circle cx="113" cy="70" r="2.5" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Sari draped (red+gold) over body -->
  <path d="M75 85 L115 85 L125 165 L65 165 Z" fill="#d01424" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- Sari pallu drape over shoulder -->
  <path d="M115 85 L130 80 L140 130 L125 120 Z" fill="#f8130d" stroke="#1a1a1a" stroke-width="5.56" stroke-linejoin="round"/>
  <!-- Gold trim on sari -->
  <path d="M65 160 L125 160" stroke="#f7de58" stroke-width="6.67" stroke-linecap="round"/>
  <path d="M125 90 L140 125" stroke="#f7de58" stroke-width="5.56" stroke-linecap="round"/>
  <!-- Necklace -->
  <path d="M82 92 Q95 100 108 92" fill="none" stroke="#f7de58" stroke-width="5.56" stroke-linecap="round"/>
  <!-- Right arm raised (holding sieve handle area) -->
  <path d="M115 90 Q145 90 165 75 L170 85 Q150 100 120 100 Z" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.56" stroke-linejoin="round"/>
  <!-- Left arm extended down -->
  <rect x="60" y="90" width="13" height="55" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.56"/>
  <!-- Henna hand (decorated palm) -->
  <ellipse cx="170" cy="92" rx="14" ry="11" fill="#e6b98a" stroke="#1a1a1a" stroke-width="5.56"/>
  <!-- Henna patterns on hand -->
  <circle cx="170" cy="92" r="4" fill="none" stroke="#5e1f0a" stroke-width="3.33"/>
  <circle cx="170" cy="92" r="2" fill="#5e1f0a"/>
  <path d="M163 89 L160 86 M177 89 L180 86 M163 95 L160 98 M177 95 L180 98" stroke="#5e1f0a" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Fingers -->
  <ellipse cx="184" cy="92" rx="4" ry="2.5" fill="#e6b98a" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Left hand -->
  <circle cx="66" cy="150" r="6" fill="#e6b98a" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Bangles on left wrist -->
  <ellipse cx="66" cy="143" rx="7" ry="2" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.33"/>
  <ellipse cx="66" cy="146" rx="7" ry="2" fill="#f8130d" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Legs (covered by long sari, just feet visible) -->
  <path d="M75 165 L115 165 L120 210 L70 210 Z" fill="#d01424" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- Feet -->
  <ellipse cx="83" cy="220" rx="10" ry="5" fill="#e6b98a" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="107" cy="220" rx="10" ry="5" fill="#e6b98a" stroke="#1a1a1a" stroke-width="4.45"/>
</g></svg>