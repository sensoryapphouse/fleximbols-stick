  <!-- Main box body -->
  <rect x="30" y="100" width="170" height="90" rx="6" fill="#9d7246" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Box roof -->
  <rect x="30" y="87" width="170" height="18" rx="4" fill="#7d5e23" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Roll door panel lines -->
  <line x1="68" y1="120" x2="158" y2="120" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="68" y1="130" x2="158" y2="130" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="68" y1="140" x2="158" y2="140" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="68" y1="150" x2="158" y2="150" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Roll door outline -->
  <rect x="68" y="112" width="90" height="60" rx="2" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Roll door handle -->
  <rect x="105" y="168" width="20" height="5" rx="2" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
