  <path d="M 95 160 Q 100 155 105 160" fill="none" stroke="#7d5e23" stroke-width="3.33" stroke-linecap="round"/>
  <path d="M 170 170 Q 175 165 180 170" fill="none" stroke="#7d5e23" stroke-width="3.33" stroke-linecap="round"/>
