<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Two horizontal cymbals stacked on tall stand with foot pedal at bottom -->

  <!-- Base plate of foot pedal -->
  <rect x="75" y="205" width="110" height="15" rx="5" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>

  <!-- Foot pedal board (hinged) -->
  <rect x="88" y="190" width="85" height="22" rx="5" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- Pedal spring/rod going up from base -->
  <rect x="126" y="100" width="8" height="110" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- Connecting rod (thinner inner rod) -->
  <rect x="128" y="95" width="4" height="30" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="2.22"/>

  <!-- Stand legs (two visible) -->
  <line x1="85" y1="205" x2="105" y2="165" stroke="#4d4d4d" stroke-width="5.55" stroke-linecap="round"/>
  <line x1="175" y1="205" x2="160" y2="165" stroke="#4d4d4d" stroke-width="5.55" stroke-linecap="round"/>

  <!-- Bottom cymbal (lower of the two stacked) -->
  <ellipse cx="130" cy="105" rx="82" ry="17" fill="#f7de58" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Bottom cymbal bell -->
  <ellipse cx="130" cy="103" rx="20" ry="8" fill="#f2e40d" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="130" cy="100" rx="10" ry="5" fill="#fff200" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Bottom cymbal underside edge (slight 3D) -->
  <ellipse cx="130" cy="109" rx="82" ry="14" fill="none" stroke="#7d5e23" stroke-width="2.22"/>

  <!-- Gap between cymbals - subtle -->
  <!-- Top cymbal (slightly above bottom) -->
  <ellipse cx="130" cy="88" rx="80" ry="15" fill="#f7de58" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Top cymbal bell (faces down, seen from above) -->
  <ellipse cx="130" cy="86" rx="20" ry="7" fill="#f2e40d" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="130" cy="84" rx="10" ry="4" fill="#fff200" stroke="#1a1a1a" stroke-width="3.33"/>

  <!-- Pull rod / clutch on top -->
  <rect x="126" y="60" width="8" height="28" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Clutch nut -->
  <rect x="122" y="56" width="16" height="10" rx="3" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
</g></svg>