  <line x1="210" y1="115" x2="222" y2="133" stroke="#1a1a1a" stroke-width="8.88" stroke-linecap="round"/>
  <!-- Arrow pointing toward stairs -->
  <polygon points="196,100 178,107 196,114" fill="#000000" stroke="none"/>
