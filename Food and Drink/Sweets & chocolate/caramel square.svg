  <!-- caramel-square: caramel cube candy + wrapper + chewy texture -->
  <!-- Wrapper twist - left -->
  <path d="M 60,120 Q 35,95 20,115 Q 30,135 50,135 Q 30,150 25,170 Q 50,170 70,150 Z" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="5.08" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Wrapper twist - right -->
  <path d="M 230,120 Q 255,95 270,115 Q 260,135 240,135 Q 260,150 265,170 Q 240,170 220,150 Z" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="5.08" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Wrapper crinkle lines left -->
  <line x1="35" y1="110" x2="50" y2="125" stroke="#1a1a1a" stroke-width="2.54" stroke-linecap="round"/>
  <line x1="32" y1="150" x2="50" y2="155" stroke="#1a1a1a" stroke-width="2.54" stroke-linecap="round"/>
  <!-- Wrapper crinkle lines right -->
  <line x1="255" y1="110" x2="240" y2="125" stroke="#1a1a1a" stroke-width="2.54" stroke-linecap="round"/>
  <line x1="258" y1="150" x2="240" y2="155" stroke="#1a1a1a" stroke-width="2.54" stroke-linecap="round"/>
  <!-- Caramel cube body (3D cube with top and side faces) -->
  <!-- Top face (parallelogram) -->
  <path d="M 80,95 L 145,80 L 210,95 L 145,110 Z" fill="#e6b98a" stroke="#1a1a1a" stroke-width="5.08" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Front face -->
  <path d="M 80,95 L 80,180 L 145,195 L 145,110 Z" fill="#9d7246" stroke="#1a1a1a" stroke-width="5.08" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right face -->
  <path d="M 210,95 L 210,180 L 145,195 L 145,110 Z" fill="#7d5e23" stroke="#1a1a1a" stroke-width="5.08" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Chewy texture: subtle dots on front face -->
  <circle cx="100" cy="130" r="2" fill="#5e1f0a"/>
  <circle cx="115" cy="150" r="2" fill="#5e1f0a"/>
  <circle cx="95" cy="160" r="2" fill="#5e1f0a"/>
  <circle cx="125" cy="170" r="2" fill="#5e1f0a"/>
  <circle cx="110" cy="180" r="2" fill="#5e1f0a"/>
