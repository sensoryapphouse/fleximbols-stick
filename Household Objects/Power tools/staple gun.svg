  <!-- Compact staple gun body — no strip magazine, squeeze mechanism -->
  <!-- Upper body / head (where staples discharge) -->
  <path d="M 55,60 L 235,60 Q 248,60 248,75 L 248,130 Q 248,140 235,140 L 55,140 Q 42,140 42,130 L 42,75 Q 42,60 55,60 Z" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="11.11" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Staple nose / front discharge slot -->
  <rect x="42" y="140" width="28" height="40" rx="3" ry="3" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="8.89" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Staple slot at front -->
  <rect x="48" y="176" width="16" height="6" rx="1" ry="1" fill="#000000" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Squeeze lever / trigger arm — hinged from back, squeezes up to body -->
  <path d="M 90,140 L 248,140 L 248,178 Q 220,196 180,196 L 90,196 Q 70,196 68,178 Z" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="11.11" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Hinge point at rear -->
  <circle cx="235" cy="140" r="8" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="6.67"/>
  <!-- Gap between lever and body (squeeze gap) -->
  <line x1="90" y1="140" x2="90" y2="196" stroke="#1a1a1a" stroke-width="6.67" stroke-linecap="round"/>
  <!-- Detail lines on lever -->
  <line x1="110" y1="156" x2="220" y2="156" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="110" y1="170" x2="220" y2="170" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="110" y1="184" x2="220" y2="184" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Body vents on top section -->
  <line x1="70" y1="80" x2="230" y2="80" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="70" y1="95" x2="230" y2="95" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Brand / label area on body -->
  <rect x="90" y="105" width="110" height="22" rx="3" ry="3" fill="#f8130d" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Staple refill door on top -->
  <rect x="140" y="60" width="80" height="10" rx="2" ry="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" stroke-linecap="round"/>
</g></svg>