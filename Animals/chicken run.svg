<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<!-- ground -->
<line x1="110" y1="398" x2="402" y2="398" stroke="#5aa83c" stroke-width="12" stroke-linecap="round"/>
<!-- grass tufts -->
<path d="M150 398 l-6 -18 m6 18 l6 -18" fill="none" stroke="#5aa83c" stroke-width="6" stroke-linecap="round"/>
<path d="M356 398 l-6 -18 m6 18 l6 -18" fill="none" stroke="#5aa83c" stroke-width="6" stroke-linecap="round"/>
<!-- fence posts (low, wide outdoor pen) -->
<rect x="120" y="248" width="14" height="152" rx="4" fill="#8a5a2b" stroke="#1a1a1a" stroke-width="8"/>
<rect x="378" y="248" width="14" height="152" rx="4" fill="#8a5a2b" stroke="#1a1a1a" stroke-width="8"/>
<rect x="249" y="248" width="14" height="152" rx="4" fill="#8a5a2b" stroke="#1a1a1a" stroke-width="8"/>
<!-- top rail only (open top run) -->
<rect x="120" y="240" width="272" height="14" rx="4" fill="#8a5a2b" stroke="#1a1a1a" stroke-width="8"/>
<!-- chicken-wire mesh: light vertical + diagonal, clearly behind -->
<g stroke="#b9bdc2" stroke-width="3.5">
<line x1="148" y1="256" x2="148" y2="396"/>
<line x1="176" y1="256" x2="176" y2="396"/>
<line x1="204" y1="256" x2="204" y2="396"/>
<line x1="226" y1="256" x2="226" y2="396"/>
<line x1="286" y1="256" x2="286" y2="396"/>
<line x1="314" y1="256" x2="314" y2="396"/>
<line x1="342" y1="256" x2="342" y2="396"/>
<line x1="366" y1="256" x2="366" y2="396"/>
<line x1="134" y1="300" x2="246" y2="300"/>
<line x1="134" y1="348" x2="246" y2="348"/>
<line x1="264" y1="300" x2="378" y2="300"/>
<line x1="264" y1="348" x2="378" y2="348"/>
</g>
<!-- chicken standing on the ground inside the run -->
<g transform="translate(300 350)">
<ellipse cx="0" cy="0" rx="40" ry="32" fill="#ffffff" stroke="#1a1a1a" stroke-width="8"/>
<circle cx="30" cy="-30" r="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="8"/>
<path d="M46 -42 q-2 -16 -16 -16 q7 14 0 20 Z" fill="#d63b46" stroke="#1a1a1a" stroke-width="4"/>
<path d="M48 -32 l20 -3 l-20 11 Z" fill="#e08a3a" stroke="#1a1a1a" stroke-width="4"/>
<circle cx="33" cy="-34" r="3.5" fill="#1a1a1a"/>
<path d="M-30 -6 q-22 4 -30 22" fill="none" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
<line x1="-12" y1="30" x2="-12" y2="46" stroke="#e08a3a" stroke-width="6" stroke-linecap="round"/>
<line x1="10" y1="32" x2="10" y2="46" stroke="#e08a3a" stroke-width="6" stroke-linecap="round"/>
</g>
</svg>
