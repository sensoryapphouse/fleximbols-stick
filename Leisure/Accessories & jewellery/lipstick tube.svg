  <!-- Lipstick sleeve (middle ring) -->
  <rect x="98" y="130" width="94" height="22" rx="5" ry="5" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
