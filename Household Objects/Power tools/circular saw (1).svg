  <!-- circular-saw: power saw with large round toothed blade, blade guard, top handle, base plate -->
  <!-- Base plate (shoe) -->
  <rect x="40" y="170" width="200" height="18" rx="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="11.11"/>
  <!-- Motor body housing -->
  <rect x="100" y="95" width="105" height="75" rx="10" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="11.11"/>
  <!-- Motor body detail lines -->
  <line x1="110" y1="110" x2="195" y2="110" stroke="#7f7f7f" stroke-width="5.56" stroke-linecap="round"/>
  <line x1="110" y1="122" x2="195" y2="122" stroke="#7f7f7f" stroke-width="5.56" stroke-linecap="round"/>
  <!-- Ventilation slots on motor -->
  <line x1="180" y1="100" x2="180" y2="165" stroke="#7f7f7f" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="188" y1="100" x2="188" y2="165" stroke="#7f7f7f" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Blade guard (semi-circular, protects upper half of blade) -->
  <path d="M75,90 Q75,155 145,170 L145,170 Q80,168 68,100Z" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="11.11" stroke-linejoin="round"/>
