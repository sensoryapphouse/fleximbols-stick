  <circle cx="45" cy="155" r="5" fill="#ff9900" stroke="#1a1a1a" stroke-width="3.33"/>
  <circle cx="245" cy="155" r="5" fill="#ff9900" stroke="#1a1a1a" stroke-width="3.33"/>
