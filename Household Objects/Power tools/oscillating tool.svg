  <!-- Grip texture / rubber overmold section -->
  <rect x="55" y="95" width="80" height="50" rx="12" ry="12" fill="#67832d" stroke="#1a1a1a" stroke-width="5.93"/>
  <!-- Grip ridges -->
  <line x1="68" y1="95" x2="68" y2="145" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="80" y1="95" x2="80" y2="145" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="92" y1="95" x2="92" y2="145" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="104" y1="95" x2="104" y2="145" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="116" y1="95" x2="116" y2="145" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>

  <!-- On/off switch on top -->
  <rect x="148" y="88" width="32" height="14" rx="5" ry="5" fill="#f8130d" stroke="#1a1a1a" stroke-width="5.93"/>

  <!-- Head / attachment hub (slightly wider nub before blade) -->
  <rect x="200" y="102" width="24" height="36" rx="5" ry="5" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="7.40"/>

