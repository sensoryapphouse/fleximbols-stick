  <circle cx="265" cy="105" r="2" fill="#000000"/>
  <circle cx="285" cy="125" r="2" fill="#000000"/>
  <circle cx="245" cy="125" r="2" fill="#000000"/>
  <circle cx="265" cy="145" r="2" fill="#000000"/>
