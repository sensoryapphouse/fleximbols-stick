<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Vaccine vial (left) -->
  <rect x="30" y="80" width="55" height="115" rx="4" fill="#dff3fd" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- Vial cap -->
  <rect x="38" y="60" width="40" height="22" rx="3" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="6.67"/>
  <rect x="34" y="76" width="48" height="8" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Vial label -->
  <rect x="35" y="110" width="45" height="75" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.56"/>

  <!-- Three icon rows on label: measles, mumps, rubella -->
  <!-- Row 1: measles - face with red spots -->
  <circle cx="57" cy="125" r="9" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="53" cy="123" r="1.5" fill="#f8130d"/>
  <circle cx="60" cy="122" r="1.5" fill="#f8130d"/>
  <circle cx="55" cy="128" r="1.5" fill="#f8130d"/>
  <circle cx="61" cy="129" r="1.5" fill="#f8130d"/>

  <!-- Row 2: mumps - swollen cheek face -->
  <circle cx="57" cy="148" r="9" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Swollen cheek (bulge on right side) -->
  <ellipse cx="65" cy="151" rx="5" ry="6" fill="#f266aa" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Frown -->
  <path d="M53 152 Q57 149 60 152" fill="none" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="54" cy="145" r="1" fill="#000000"/>
  <circle cx="60" cy="145" r="1" fill="#000000"/>

  <!-- Row 3: rubella - face with rash spots (pink, smaller) -->
  <circle cx="57" cy="171" r="9" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="52" cy="169" r="1.2" fill="#f266aa"/>
  <circle cx="56" cy="167" r="1.2" fill="#f266aa"/>
  <circle cx="61" cy="168" r="1.2" fill="#f266aa"/>
  <circle cx="54" cy="173" r="1.2" fill="#f266aa"/>
  <circle cx="60" cy="174" r="1.2" fill="#f266aa"/>
  <circle cx="58" cy="171" r="1.2" fill="#f266aa"/>

  <!-- Liquid line in vial (above label) -->
  <line x1="30" y1="105" x2="85" y2="105" stroke="#1a1a1a" stroke-width="3.33"/>
  <rect x="32" y="85" width="51" height="20" fill="#ff9900" stroke="none"/>

  <!-- Syringe (right) -->
  <!-- Barrel -->
  <rect x="125" y="105" width="100" height="28" fill="#ffffff" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- Measurement ticks -->
  <line x1="140" y1="105" x2="140" y2="113" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="155" y1="105" x2="155" y2="113" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="170" y1="105" x2="170" y2="113" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="185" y1="105" x2="185" y2="113" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="200" y1="105" x2="200" y2="113" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Liquid -->
  <rect x="128" y="108" width="60" height="22" fill="#ff9900" stroke="none"/>
  <!-- Flange -->
  <rect x="222" y="95" width="8" height="48" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.56"/>
  <!-- Plunger rod -->
  <rect x="230" y="113" width="32" height="12" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.56"/>
  <!-- Thumb rest -->
  <rect x="260" y="105" width="6" height="28" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.56"/>
  <!-- Needle hub -->
  <rect x="115" y="113" width="12" height="12" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.56"/>
  <!-- Needle -->
  <line x1="115" y1="119" x2="95" y2="119" stroke="#1a1a1a" stroke-width="6.67" stroke-linecap="round"/>
  <!-- Droplet -->
  <path d="M95 115 Q92 119 95 123 Q98 119 95 115 Z" fill="#ff9900" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
</g></svg>