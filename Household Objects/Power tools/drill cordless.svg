<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Cordless drill: pistol-grip body, chuck at front, chunky battery at base of handle -->

  <!-- Main motor body (horizontal barrel) -->
  <rect x="55" y="72" width="140" height="58" rx="12" ry="12" fill="#f8130d" stroke="#1a1a1a" stroke-width="5.55"/>

  <!-- Chuck (cylindrical, at front/right) -->
  <rect x="190" y="85" width="45" height="32" rx="8" ry="8" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Chuck jaws (3 lines) -->
  <line x1="210" y1="85" x2="210" y2="117" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="220" y1="85" x2="220" y2="117" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Drill bit extending from chuck -->
  <line x1="235" y1="101" x2="270" y2="101" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <polygon points="270,97 282,101 270,105" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>

  <!-- Gear selector ring on barrel -->
  <rect x="175" y="80" width="16" height="42" rx="5" ry="5" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Pistol grip handle (angled down from body) -->
  <path d="M 80,128 L 100,128 L 108,205 L 68,205 Z" fill="#f8130d" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>

  <!-- Trigger -->
  <rect x="97" y="140" width="18" height="24" rx="4" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Chunky battery pack at base of handle -->
  <rect x="52" y="200" width="72" height="30" rx="6" ry="6" fill="#1d0e82" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Battery contacts -->
  <rect x="60" y="196" width="10" height="8" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.33"/>
  <rect x="78" y="196" width="10" height="8" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.33"/>
  <rect x="96" y="196" width="10" height="8" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Battery indicator stripe -->
  <rect x="52" y="212" width="72" height="8" rx="2" ry="2" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="2.22"/>

  <!-- Speed selector on top of body -->
  <rect x="90" y="66" width="50" height="12" rx="4" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
</g></svg>