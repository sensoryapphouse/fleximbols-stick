  <path d="M 175,122 L 162,118" fill="none" stroke="#4d4d4d" stroke-width="3.55" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Fishing line at top -->
  <line x1="210" y1="28" x2="210" y2="18" stroke="#7f7f7f" stroke-width="2.66" stroke-linecap="round"/>
  <!-- Envelope body (hanging on hook) -->
