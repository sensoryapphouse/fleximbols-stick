  <!-- Investor pitch: person presenting to seated investors with a chart board -->

  <!-- Chart/whiteboard on stand -->
  <rect x="115" y="28" width="115" height="85" rx="5" ry="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Stand legs -->
