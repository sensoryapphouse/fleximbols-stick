  <!-- Lash individual: tweezers placing a single cluster of lashes -->
  <!-- Tweezers (two angled arms meeting at a top hinge, pointing down) -->
  <!-- Left arm -->
  <polygon points="100,30 116,30 158,150 148,154" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Right arm -->
  <polygon points="174,30 190,30 162,154 152,150" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Hinge / top connector -->
  <rect x="100" y="26" width="90" height="14" rx="4" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Tweezer tips (fine point holding lash) -->
  <polygon points="148,154 162,154 156,164" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Lash cluster being held (a small fan of 3-4 lashes) -->
  <path d="M156,164 Q146,184 138,210" stroke="#1a1a1a" stroke-width="4.45" fill="none" stroke-linecap="round"/>
  <path d="M156,164 Q154,188 150,214" stroke="#1a1a1a" stroke-width="4.45" fill="none" stroke-linecap="round"/>
  <path d="M156,164 Q160,188 162,214" stroke="#1a1a1a" stroke-width="4.45" fill="none" stroke-linecap="round"/>
  <path d="M156,164 Q166,184 174,210" stroke="#1a1a1a" stroke-width="4.45" fill="none" stroke-linecap="round"/>
  <!-- Small base knot of cluster -->
  <circle cx="156" cy="166" r="4" fill="#000000" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- Tweezer metal shine lines -->
  <line x1="108" y1="40" x2="148" y2="148" stroke="#efefef" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="182" y1="40" x2="162" y2="148" stroke="#efefef" stroke-width="2.96" stroke-linecap="round"/>
  <!-- One stray single lash beside (for context) -->
  <path d="M40,160 Q44,184 42,210" stroke="#1a1a1a" stroke-width="4.45" fill="none" stroke-linecap="round"/>
  <circle cx="40" cy="160" r="3" fill="#000000" stroke="#1a1a1a" stroke-width="2.96"/>
</g></svg>