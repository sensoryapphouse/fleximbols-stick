  <line x1="220" y1="95" x2="220" y2="101" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="220" y1="139" x2="220" y2="145" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="195" y1="120" x2="201" y2="120" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="239" y1="120" x2="245" y2="120" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Hour hand to 5 (~150 degrees) -->
  <line x1="220" y1="120" x2="234" y2="134" stroke="#1a1a1a" stroke-width="5.93" stroke-linecap="round"/>
