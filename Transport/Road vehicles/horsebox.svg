<circle cx="180" cy="350" r="15" fill="#cfd6dc" stroke="#1a1a1a" stroke-width="7"/>
<circle cx="300" cy="350" r="40" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="9"/>
<circle cx="300" cy="350" r="15" fill="#cfd6dc" stroke="#1a1a1a" stroke-width="7"/>
