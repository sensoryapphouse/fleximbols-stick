<svg xmlns="http://www.w3.org/2000/svg" viewBox="81.30 84.71 380.12 380.12"><g>
<!-- inflatable arm cuff (rounded wrap) -->
<rect x="120" y="170" width="180" height="150" rx="22" fill="#4a8cc8" stroke="#1a1a1a" stroke-width="9"/>
<!-- velcro band straps -->
<rect x="108" y="196" width="204" height="22" rx="6" fill="#3f7fbb" stroke="#1a1a1a" stroke-width="6"/>
<rect x="108" y="272" width="204" height="22" rx="6" fill="#3f7fbb" stroke="#1a1a1a" stroke-width="6"/>
<!-- velcro hatch -->
<line x1="120" y1="207" x2="300" y2="207" stroke="#2b6fb0" stroke-width="4" stroke-dasharray="8 6"/>
<line x1="120" y1="283" x2="300" y2="283" stroke="#2b6fb0" stroke-width="4" stroke-dasharray="8 6"/>
<!-- squeeze bulb -->
<ellipse cx="392" cy="372" rx="42" ry="52" fill="#39414b" stroke="#1a1a1a" stroke-width="9"/>
<!-- tube cuff -> bulb -->
<path d="M 300 250 Q 392 256 392 320" fill="none" stroke="#39414b" stroke-width="11" stroke-linecap="round"/>
<!-- gauge dial -->
<circle cx="372" cy="180" r="56" fill="#ffffff" stroke="#1a1a1a" stroke-width="9"/>
<line x1="372" y1="138" x2="372" y2="150" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
<line x1="372" y1="222" x2="372" y2="210" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
<line x1="414" y1="180" x2="402" y2="180" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
<line x1="330" y1="180" x2="342" y2="180" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
<!-- needle -->
<line x1="372" y1="180" x2="402" y2="152" stroke="#e0473c" stroke-width="7" stroke-linecap="round"/>
<circle cx="372" cy="180" r="8" fill="#1a1a1a"/>
<!-- tube cuff -> gauge -->
<path d="M 300 200 Q 340 196 354 152" fill="none" stroke="#39414b" stroke-width="9" stroke-linecap="round"/>
</g></svg>
