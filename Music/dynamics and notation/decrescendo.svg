  <path d="M 90 95 Q 75 105 90 115" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 75 135 Q 50 155 75 175" fill="none" stroke="#1a1a1a" stroke-width="5.18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 90 145 Q 75 155 90 165" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
