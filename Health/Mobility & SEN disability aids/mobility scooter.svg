<svg xmlns="http://www.w3.org/2000/svg" viewBox="95.96 116.44 306.42 306.42">
<!-- mobility scooter: seat, tiller column, handlebars, deck, wheels -->
<!-- deck/base -->
<path d="M 130 320 L 360 320 L 360 348 L 130 348 Z" fill="#3f7fae" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- seat post -->
<rect x="288" y="232" width="20" height="90" fill="#cfd6dc" stroke="#1a1a1a" stroke-width="8"/>
<!-- seat -->
<path d="M 268 210 L 348 210 Q 356 210 356 222 L 356 234 L 268 234 Z" fill="#7a5230" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- seat back -->
<path d="M 336 210 L 356 150 Q 358 140 348 140 L 332 142 L 326 210 Z" fill="#7a5230" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- tiller column -->
<line x1="172" y1="180" x2="160" y2="316" stroke="#1a1a1a" stroke-width="11" stroke-linecap="round"/>
<!-- handlebars -->
<path d="M 140 178 Q 172 158 210 178" fill="none" stroke="#1a1a1a" stroke-width="11" stroke-linecap="round"/>
<!-- wheels -->
<circle cx="170" cy="360" r="40" fill="#444b52" stroke="#1a1a1a" stroke-width="9"/>
<circle cx="170" cy="360" r="13" fill="#cfd6dc" stroke="#1a1a1a" stroke-width="6"/>
<circle cx="328" cy="360" r="40" fill="#444b52" stroke="#1a1a1a" stroke-width="9"/>
<circle cx="328" cy="360" r="13" fill="#cfd6dc" stroke="#1a1a1a" stroke-width="6"/>
</svg>
