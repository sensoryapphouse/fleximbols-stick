  <rect x="38" y="140" width="22" height="18" rx="2" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <line x1="38" y1="149" x2="60" y2="149" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="49" y1="140" x2="49" y2="158" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Cab body -->
  <rect x="200" y="118" width="62" height="72" rx="8" fill="#7d5e23" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Cab roof -->
  <path d="M200 118 Q200 96 222 94 L248 94 Q262 94 262 118" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
