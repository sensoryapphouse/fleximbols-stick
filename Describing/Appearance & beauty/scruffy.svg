<svg xmlns="http://www.w3.org/2000/svg" viewBox="83.36 32.16 374.30 374.30"><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
<!-- worn-out scruffy old boot: holes, flapping sole, patch -->
<g transform="translate(256 270)">
<!-- boot body -->
<path d="M -110 80 L -110 -90 L -40 -90 L -28 10 Q 40 18 96 40 Q 130 54 130 80 Z" fill="#a9764a" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- flapping detached sole at the toe -->
<path d="M 130 80 L 60 80 Q 86 104 132 108 Q 150 96 130 80 Z" fill="#6b4a2c" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- sole -->
<path d="M -110 80 L 60 80 L 60 102 L -110 102 Z" fill="#6b4a2c" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- hole in the side -->
<ellipse cx="20" cy="46" rx="20" ry="14" fill="#5a3a1f" stroke="#1a1a1a" stroke-width="6"/>
<!-- patch -->
<rect x="-92" y="-66" width="44" height="40" rx="4" fill="#8a6038" stroke="#1a1a1a" stroke-width="6"/>
<g stroke="#1a1a1a" stroke-width="3" stroke-linecap="round">
<line x1="-92" y1="-56" x2="-48" y2="-56"/>
<line x1="-92" y1="-44" x2="-48" y2="-44"/>
<line x1="-80" y1="-66" x2="-80" y2="-26"/>
<line x1="-64" y1="-66" x2="-64" y2="-26"/>
</g>
<!-- loose dangling lace -->
<path d="M -40 -90 q -30 -16 -56 6 q 22 18 6 40" fill="none" stroke="#3a2a18" stroke-width="6" stroke-linecap="round"/>
<!-- frayed/torn top edge -->
<path d="M -110 -90 l 14 12 l 14 -12 l 14 12 l 14 -12" fill="none" stroke="#1a1a1a" stroke-width="6" stroke-linejoin="round"/>
</g>
<!-- stink/grime wavy lines above -->
<g fill="none" stroke="#9a8b53" stroke-width="6" stroke-linecap="round">
<path d="M 196 120 q -10 -16 4 -28 q 12 -10 2 -24"/>
<path d="M 256 110 q -10 -16 4 -28 q 12 -10 2 -24"/>
</g>
</svg>
