  <rect x="85" y="98" width="55" height="6" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Mid landing platform -->
  <rect x="140" y="152" width="55" height="6" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Bottom landing / ground platform -->
  <rect x="85" y="206" width="55" height="6" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Stair flight 1: top landing down-right to mid landing (zigzag) -->
  <!-- Left rail -->
  <line x1="92" y1="104" x2="147" y2="152" stroke="#4d4d4d" stroke-width="5.55" stroke-linecap="round"/>
  <!-- Right rail -->
  <line x1="105" y1="104" x2="160" y2="152" stroke="#4d4d4d" stroke-width="5.55" stroke-linecap="round"/>
  <!-- Steps on flight 1 -->
  <line x1="99" y1="112" x2="110" y2="112" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="107" y1="120" x2="118" y2="120" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="115" y1="128" x2="126" y2="128" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="123" y1="136" x2="134" y2="136" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="131" y1="144" x2="142" y2="144" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Stair flight 2: mid landing down-left to bottom landing -->
  <!-- Left rail -->
  <line x1="147" y1="158" x2="92" y2="206" stroke="#4d4d4d" stroke-width="5.55" stroke-linecap="round"/>
  <!-- Right rail -->
  <line x1="160" y1="158" x2="105" y2="206" stroke="#4d4d4d" stroke-width="5.55" stroke-linecap="round"/>
  <!-- Steps on flight 2 -->
  <line x1="143" y1="166" x2="132" y2="166" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="135" y1="174" x2="124" y2="174" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="127" y1="182" x2="116" y2="182" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="119" y1="190" x2="108" y2="190" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="111" y1="198" x2="100" y2="198" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
