  <!-- Red prohibition ring + slash over black U-turn arrow -->
  <!-- U-turn arrow: shaft going down left, arc at top, shaft going down right with arrowhead -->
  <!-- Left shaft -->
  <line x1="100" y1="185" x2="100" y2="105" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- U arc -->
  <path d="M 100 105 A 45 45 0 0 1 190 105" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Right shaft -->
  <line x1="190" y1="105" x2="190" y2="175" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Arrowhead pointing down, tip-on-axis at bottom of right shaft -->
  <polygon points="190,200 170,168 210,168" fill="#000000" stroke="#1a1a1a" stroke-width="0.95" stroke-linejoin="round"/>
  <!-- Prohibition ring (red, no fill) -->
  <circle cx="145" cy="120" r="103" fill="none" stroke="#f8130d" stroke-width="5.72"/>
  <!-- Prohibition slash -->
  <line x1="68" y1="47" x2="222" y2="193" stroke="#f8130d" stroke-width="5.72" stroke-linecap="round"/>
  <!-- Outer black outline ring -->
  <circle cx="145" cy="120" r="103" fill="none" stroke="#1a1a1a" stroke-width="1.59"/>
  <!-- Inner black outline ring -->
  <circle cx="145" cy="120" r="85" fill="none" stroke="#1a1a1a" stroke-width="1.59"/>
</g></svg>