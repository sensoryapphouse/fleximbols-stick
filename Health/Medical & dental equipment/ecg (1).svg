<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- ECG: red/blue-themed monitor with heart-rate waveform + electrodes on chest -->
  <!-- Differs from EKG by colour scheme: red waveform on dark blue screen, red+blue lead wires -->
  <!-- Floor line -->
  <path d="M10 222 L280 222" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Monitor -->
  <rect x="20" y="30" width="150" height="110" rx="6" fill="#1d0e82" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Screen -->
  <rect x="32" y="42" width="126" height="78" fill="#000000" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- Grid lines -->
  <path d="M32 60 L158 60" stroke="#2a4ec0" stroke-width="1.48"/>
  <path d="M32 80 L158 80" stroke="#2a4ec0" stroke-width="1.48"/>
  <path d="M32 100 L158 100" stroke="#2a4ec0" stroke-width="1.48"/>
  <path d="M60 42 L60 120" stroke="#2a4ec0" stroke-width="1.48"/>
  <path d="M90 42 L90 120" stroke="#2a4ec0" stroke-width="1.48"/>
  <path d="M120 42 L120 120" stroke="#2a4ec0" stroke-width="1.48"/>
  <!-- ECG waveform - red -->
  <path d="M34 82 L46 82 L52 82 L56 78 L60 86 L64 50 L68 110 L72 82 L84 82 L90 74 L98 82 L110 82 L116 78 L120 86 L124 50 L128 110 L132 82 L156 82" fill="none" stroke="#f8130d" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- HR readout box -->
  <rect x="135" y="46" width="20" height="14" fill="#000000" stroke="#f8130d" stroke-width="1.48"/>

  <!-- Monitor stand -->
  <rect x="86" y="140" width="18" height="40" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="95" cy="184" rx="32" ry="6" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Patient chest -->
  <path d="M190 70 Q190 50 220 50 L260 50 Q280 50 280 72 L278 200 L190 200 Z" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="225" y="34" width="22" height="20" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="236" cy="22" rx="18" ry="16" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45"/>
  <path d="M220 18 Q236 6 252 18" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="2.96"/>

  <!-- Electrodes - tinted differently from EKG -->
  <g>
    <circle cx="210" cy="90" r="9" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="4.45"/>
    <circle cx="210" cy="90" r="3" fill="#d01424" stroke="#1a1a1a" stroke-width="2.96"/>
  </g>
  <g>
    <circle cx="245" cy="90" r="9" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="4.45"/>
    <circle cx="245" cy="90" r="3" fill="#d01424" stroke="#1a1a1a" stroke-width="2.96"/>
  </g>
  <g>
    <circle cx="225" cy="130" r="9" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="4.45"/>
    <circle cx="225" cy="130" r="3" fill="#d01424" stroke="#1a1a1a" stroke-width="2.96"/>
  </g>
  <g>
    <circle cx="260" cy="135" r="9" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="4.45"/>
    <circle cx="260" cy="135" r="3" fill="#d01424" stroke="#1a1a1a" stroke-width="2.96"/>
  </g>

  <!-- Lead wires - red and blue colour scheme -->
  <path d="M210 90 Q180 100 170 110 Q150 120 130 130" fill="none" stroke="#f8130d" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M245 90 Q200 105 180 120 Q150 135 130 140" fill="none" stroke="#2a4ec0" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M225 130 Q200 140 180 145 Q150 150 130 150" fill="none" stroke="#f8130d" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M260 135 Q220 150 180 155 Q150 158 130 160" fill="none" stroke="#2a4ec0" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Heart icon on monitor (extra ECG distinguishing detail) -->
  <path d="M148 50 Q145 46 142 50 Q139 46 136 50 Q136 56 142 60 Q148 56 148 50 Z" fill="#f8130d" stroke="#ffffff" stroke-width="2.22" stroke-linejoin="round"/>
</g></svg>