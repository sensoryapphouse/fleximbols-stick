<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- tab divider: binder tab dividers sticking out from a stack of pages, colour-coded -->
  <!-- stack of pages (white) -->
  <rect x="40" y="40" width="180" height="170" fill="#ffffff" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- a few page edge lines to show stack -->
  <line x1="40" y1="200" x2="220" y2="200" stroke="#b8b8b8" stroke-width="4.45"/>
  <line x1="40" y1="205" x2="220" y2="205" stroke="#b8b8b8" stroke-width="4.45"/>
  <!-- punched holes on left edge (binder pages) -->
  <circle cx="55" cy="70" r="5" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="55" cy="125" r="5" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="55" cy="180" r="5" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- four colour-coded tabs sticking out to the right at staggered heights -->
  <!-- tab 1 - red -->
  <path d="M220 55 L255 55 L260 60 L260 80 L255 85 L220 85 Z" fill="#d01424" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <line x1="225" y1="70" x2="252" y2="70" stroke="#ffffff" stroke-width="4.45" stroke-linecap="round"/>
  <!-- tab 2 - yellow -->
  <path d="M220 95 L255 95 L260 100 L260 120 L255 125 L220 125 Z" fill="#f7de58" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <line x1="225" y1="110" x2="252" y2="110" stroke="#4d4d4d" stroke-width="4.45" stroke-linecap="round"/>
  <!-- tab 3 - green -->
  <path d="M220 135 L255 135 L260 140 L260 160 L255 165 L220 165 Z" fill="#529929" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <line x1="225" y1="150" x2="252" y2="150" stroke="#ffffff" stroke-width="4.45" stroke-linecap="round"/>
  <!-- tab 4 - blue -->
  <path d="M220 175 L255 175 L260 180 L260 200 L255 205 L220 205 Z" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <line x1="225" y1="190" x2="252" y2="190" stroke="#ffffff" stroke-width="4.45" stroke-linecap="round"/>
</g></svg>