  <rect x="50" y="32" width="190" height="14" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="58" y1="39" x2="100" y2="39" stroke="#ffffff" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="190" y1="39" x2="232" y2="39" stroke="#ffffff" stroke-width="4.45" stroke-linecap="round"/>
  <!-- briefcase (centered, prominent) -->
  <rect x="115" y="78" width="60" height="46" fill="#7d5e23" stroke="#1a1a1a" stroke-width="6.67" rx="3"/>
  <rect x="132" y="65" width="26" height="16" fill="#7d5e23" stroke="#1a1a1a" stroke-width="5.56"/>
  <rect x="138" y="71" width="14" height="4" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="3.33"/>
