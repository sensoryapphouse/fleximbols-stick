<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Knife mid-chop coming down hard, food split into chunks, motion lines -->

  <!-- Cutting board -->
  <rect x="20" y="185" width="250" height="30" rx="6" fill="#9d7246" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>

  <!-- Food chunks scattered (e.g. carrot/veg chunks) -->
  <!-- Chunk left -->
  <rect x="35" y="155" width="45" height="32" rx="5" fill="#ff9900" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Chunk centre-left -->
  <rect x="90" y="160" width="40" height="27" rx="5" fill="#ff9900" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Chunk centre-right -->
  <rect x="143" y="153" width="38" height="34" rx="5" fill="#ff9900" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Chunk right -->
  <rect x="193" y="158" width="44" height="29" rx="5" fill="#ff9900" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>

  <!-- Split line between chunks -->
  <line x1="65" y1="155" x2="68" y2="187" stroke="#1a1a1a" stroke-width="4.45" stroke-dasharray="5,4"/>
  <line x1="118" y1="155" x2="121" y2="187" stroke="#1a1a1a" stroke-width="4.45" stroke-dasharray="5,4"/>
  <line x1="172" y1="153" x2="175" y2="187" stroke="#1a1a1a" stroke-width="4.45" stroke-dasharray="5,4"/>

  <!-- Knife blade (cleaver/heavy knife, angled downward) -->
  <polygon points="95,25 210,25 230,140 100,140" fill="#efefef" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Blade bevel -->
  <line x1="100" y1="133" x2="225" y2="133" stroke="#b8b8b8" stroke-width="4.45"/>
  <!-- Knife spine top -->
  <line x1="95" y1="25" x2="210" y2="25" stroke="#7f7f7f" stroke-width="4.45"/>
  <!-- Knife handle -->
  <rect x="210" y="18" width="60" height="42" rx="9" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Handle rivets -->
  <circle cx="225" cy="39" r="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="2.96"/>
  <circle cx="245" cy="39" r="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="2.96"/>
  <circle cx="260" cy="39" r="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="2.96"/>

  <!-- Motion lines above knife (forceful downstroke) -->
  <line x1="105" y1="15" x2="105" y2="5" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="135" y1="18" x2="133" y2="8" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="165" y1="18" x2="163" y2="8" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="195" y1="15" x2="193" y2="5" stroke="#1a1a1a" stroke-width="4.45"/>
</g></svg>