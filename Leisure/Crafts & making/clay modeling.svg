<svg xmlns="http://www.w3.org/2000/svg" viewBox="79.52 130.72 352.97 352.97"><g>
<!-- potter's wheel (drawn first, pot sits on it) -->
<ellipse cx="256" cy="392" rx="150" ry="34" fill="#b9bdc2" stroke="#1a1a1a" stroke-width="9"/>
<line x1="122" y1="392" x2="390" y2="392" stroke="#9aa0a6" stroke-width="5" stroke-linecap="round"/>

<!-- clay pot sitting on the wheel -->
<path d="M 196 240
         Q 148 280 172 340
         Q 188 384 256 388
         Q 324 384 340 340
         Q 364 280 316 240 Z"
      fill="#b5651d" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- open rim of the pot -->
<ellipse cx="256" cy="238" rx="60" ry="22" fill="#8a5a2b" stroke="#1a1a1a" stroke-width="8"/>
<!-- throwing rings on the clay -->
<path d="M 182 300 Q 256 320 330 300" fill="none" stroke="#8a5a2b" stroke-width="5" stroke-linecap="round"/>

<!-- hands shaping the clay: left hand cupping the near-left side -->
<path d="M 150 250 Q 128 268 140 300 Q 148 322 176 318 Q 168 300 176 282 Q 160 274 168 258 Z"
      fill="#f5d6b0" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- right hand cupping the near-right side -->
<path d="M 362 250 Q 384 268 372 300 Q 364 322 336 318 Q 344 300 336 282 Q 352 274 344 258 Z"
      fill="#f5d6b0" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
</g></svg>
