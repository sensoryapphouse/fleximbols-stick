<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Gel eyeliner pot + angled brush + dark liner -->
  <!-- Gel pot (small open jar) -->
  <!-- Pot base (cylinder) -->
  <ellipse cx="100" cy="200" rx="58" ry="12" fill="#000000" stroke="#1a1a1a" stroke-width="4.94"/>
  <rect x="42" y="140" width="116" height="60" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.94"/>
  <ellipse cx="100" cy="140" rx="58" ry="14" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.94"/>
  <!-- Inner rim -->
  <ellipse cx="100" cy="140" rx="48" ry="11" fill="#000000" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- Glossy gel product surface -->
  <ellipse cx="100" cy="142" rx="42" ry="8" fill="#000000" stroke="#1a1a1a" stroke-width="1.97"/>
  <!-- Gel shine highlights (gel is wet/shiny) -->
  <ellipse cx="84" cy="138" rx="14" ry="3" fill="#ffffff" stroke="none"/>
  <ellipse cx="116" cy="144" rx="6" ry="2" fill="#7f7f7f" stroke="none"/>
  <!-- Label band on pot -->
  <rect x="42" y="170" width="116" height="18" fill="#dff3fd" stroke="#1a1a1a" stroke-width="2.96"/>

  <!-- Angled brush (top right, the iconic gel-liner angled brush) -->
  <g transform="rotate(-30 210 80)">
    <!-- Handle -->
    <rect x="156" y="74" width="120" height="12" rx="5" fill="#000000" stroke="#1a1a1a" stroke-width="4.94"/>
    <!-- Ferrule -->
    <rect x="150" y="71" width="12" height="18" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="2.96"/>
    <!-- Angled brush head (asymmetric, slanted tip) -->
    <polygon points="150,72 150,88 124,94 116,82" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="3.95" stroke-linejoin="round"/>
    <!-- Inky tip -->
    <polygon points="124,94 116,82 110,86 118,96" fill="#000000" stroke="#1a1a1a" stroke-width="2.96" stroke-linejoin="round"/>
  </g>

  <!-- Dark liner stroke on canvas (winged eyeliner line drawn) -->
  <path d="M 188 196 Q 218 188 246 196 Q 256 198 264 208" fill="none" stroke="#1a1a1a" stroke-width="5.93" stroke-linecap="round"/>
  <!-- Wing flick -->
  <path d="M 264 208 L 274 200" fill="none" stroke="#1a1a1a" stroke-width="4.94" stroke-linecap="round"/>
</g></svg>