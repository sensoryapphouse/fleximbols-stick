  <!-- Strap clips -->
  <rect x="100" y="94" width="18" height="18" rx="4" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <rect x="172" y="94" width="18" height="18" rx="4" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Cylinder body (tall rounded rectangle) -->
  <rect x="80" y="100" width="130" height="118" rx="24" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Rugged ribbing lines -->
  <line x1="80" y1="128" x2="210" y2="128" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="80" y1="148" x2="210" y2="148" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
