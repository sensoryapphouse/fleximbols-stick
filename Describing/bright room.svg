<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<!-- room box -->
<rect x="96" y="96" width="320" height="320" fill="#fdf3b0" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- back wall -->
<rect x="176" y="176" width="160" height="160" fill="#fbe78a" stroke="#1a1a1a" stroke-width="7" stroke-linejoin="round"/>
<!-- perspective lines to corners -->
<line x1="96" y1="96" x2="176" y2="176" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
<line x1="416" y1="96" x2="336" y2="176" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
<line x1="96" y1="416" x2="176" y2="336" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
<line x1="416" y1="416" x2="336" y2="336" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
<!-- floor brighter -->
<polygon points="96,416 416,416 336,336 176,336" fill="#f4c430" stroke="#1a1a1a" stroke-width="7" stroke-linejoin="round"/>
<!-- ceiling lamp -->
<line x1="256" y1="176" x2="256" y2="196" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
<path d="M 236 220 L 276 220 L 268 196 L 244 196 Z" fill="#f4c430" stroke="#1a1a1a" stroke-width="7" stroke-linejoin="round"/>
<!-- light rays -->
<line x1="256" y1="232" x2="256" y2="300" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
<line x1="224" y1="228" x2="200" y2="288" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
<line x1="288" y1="228" x2="312" y2="288" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
<line x1="210" y1="232" x2="176" y2="270" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
<line x1="302" y1="232" x2="336" y2="270" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
</svg>
