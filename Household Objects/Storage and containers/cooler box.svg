  <rect x="218" y="50" width="20" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- handle on side -->
  <path d="M 60 110 Q 60 100 70 100 L 110 100 Q 120 100 120 110" fill="none" stroke="#1a1a1a" stroke-width="5.93" stroke-linecap="round"/>
  <!-- carry handle right -->
