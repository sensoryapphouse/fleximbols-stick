<rect x="172.0" y="118.0" width="168.0" height="64.0" rx="0" fill="#d6cdb4" stroke="#5e5640" stroke-width="7"/>
<rect x="222.0" y="150.0" width="68.0" height="64.0" rx="0" fill="#d6cdb4" stroke="#5e5640" stroke-width="7"/>
