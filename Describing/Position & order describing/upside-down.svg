<svg xmlns="http://www.w3.org/2000/svg" viewBox="29.09 59.81 453.82 453.82">
<!-- UPSIDE-DOWN: a mug. Left (faded) sits upright; right (highlighted) is flipped over, opening downward. Green arrow points to the upside-down one. -->
<!-- ground line -->
<line x1="60" y1="392" x2="452" y2="392" stroke="#9aa7b5" stroke-width="6" stroke-linecap="round"/>

<!-- LEFT: upright mug (faded) -->
<g opacity="0.34">
  <path d="M 110 300 L 110 388 Q 110 392 114 392 L 178 392 Q 182 392 182 388 L 182 300 Z" fill="#e8a23d" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
  <ellipse cx="146" cy="300" rx="36" ry="11" fill="#fbe7a8" stroke="#1a1a1a" stroke-width="9"/>
  <path d="M 182 318 Q 218 318 218 344 Q 218 370 182 370" fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
</g>

<!-- RIGHT: upside-down mug (highlighted) — opening at the bottom, handle still on side -->
<path d="M 330 308 L 330 380 Q 330 384 334 384 L 398 384 Q 402 384 402 380 L 402 308 Z" fill="#e8a23d" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<ellipse cx="366" cy="384" rx="36" ry="11" fill="#fbe7a8" stroke="#1a1a1a" stroke-width="9"/>
<path d="M 402 326 Q 438 326 438 352 Q 438 378 402 378" fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>

<!-- bold green arrow pointing DOWN at the upside-down mug -->
<line x1="366" y1="180" x2="366" y2="262" stroke="#1a1a1a" stroke-width="22.0" stroke-linecap="round"/><line x1="366" y1="262" x2="338" y2="232" stroke="#1a1a1a" stroke-width="22.0" stroke-linecap="round"/><line x1="366" y1="262" x2="394" y2="232" stroke="#1a1a1a" stroke-width="22.0" stroke-linecap="round"/><line x1="366" y1="180" x2="366" y2="262" stroke="#2f9e4a" stroke-width="16.5" stroke-linecap="round"/>
<line x1="366" y1="262" x2="338" y2="232" stroke="#2f9e4a" stroke-width="16.5" stroke-linecap="round"/>
<line x1="366" y1="262" x2="394" y2="232" stroke="#2f9e4a" stroke-width="16.5" stroke-linecap="round"/>
</svg>
