  <!-- Motorhome - Class A flat-front bus-style RV, side profile, back-to-front -->
  <!-- Shadow -->
  <ellipse cx="145" cy="208" rx="116" ry="7" fill="#4d4d4d" stroke="none"/>
  <!-- Main body -->
  <rect x="28" y="95" width="234" height="93" rx="6" fill="#efefef" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Flat roof -->
  <rect x="28" y="82" width="234" height="18" rx="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Flat front face -->
  <rect x="228" y="82" width="34" height="106" rx="4" fill="#dff3fd" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Front windshield inset -->
  <rect x="234" y="90" width="24" height="42" rx="3" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Front lower grille -->
  <rect x="234" y="140" width="24" height="12" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Side windows row -->
  <rect x="168" y="103" width="36" height="28" rx="3" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="122" y="103" width="36" height="28" rx="3" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="76" y="103" width="36" height="28" rx="3" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Entry door -->
  <rect x="36" y="110" width="28" height="54" rx="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <circle cx="58" cy="138" r="3" fill="#000000"/>
  <!-- Body stripe -->
  <rect x="28" y="158" width="200" height="10" rx="2" fill="#529929" stroke="none"/>
  <!-- Lower body accent -->
  <rect x="28" y="168" width="200" height="10" rx="2" fill="#137827" stroke="none"/>
  <!-- Roof AC unit -->
  <rect x="120" y="74" width="50" height="12" rx="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Rear bumper -->
  <rect x="28" y="182" width="14" height="8" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Front bumper -->
  <rect x="248" y="182" width="14" height="8" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Front wheel -->
  <circle cx="218" cy="192" r="22" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.55"/>
  <circle cx="218" cy="192" r="10" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Rear wheel -->
  <circle cx="68" cy="192" r="22" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.55"/>
  <circle cx="68" cy="192" r="10" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
