<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Theatre stage: proscenium arch + red curtains drawn open + footlights + stage floor -->

  <!-- Proscenium arch frame -->
  <rect x="22" y="20" width="246" height="195" rx="4" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>

  <!-- Stage opening (arch interior) -->
  <rect x="52" y="44" width="186" height="148" rx="0" fill="#000000" stroke="none"/>
  <!-- Arch curve at top of opening -->
  <path d="M52,90 Q52,44 100,44 L190,44 Q238,44 238,90" fill="#000000" stroke="none"/>

  <!-- Back wall of stage (visible through opening) -->
  <rect x="52" y="44" width="186" height="148" rx="0" fill="#4d4d4d" stroke="none"/>

  <!-- Stage floor -->
  <rect x="52" y="158" width="186" height="34" rx="0" fill="#9d7246" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Floor boards -->
  <line x1="85"  y1="158" x2="85"  y2="192" stroke="#7d5e23" stroke-width="2.96"/>
  <line x1="118" y1="158" x2="118" y2="192" stroke="#7d5e23" stroke-width="2.96"/>
  <line x1="151" y1="158" x2="151" y2="192" stroke="#7d5e23" stroke-width="2.96"/>
  <line x1="184" y1="158" x2="184" y2="192" stroke="#7d5e23" stroke-width="2.96"/>
  <line x1="217" y1="158" x2="217" y2="192" stroke="#7d5e23" stroke-width="2.96"/>

  <!-- Left curtain (drawn open to left) -->
  <path d="M52,44 Q62,60 58,90 Q54,118 62,140 Q68,158 52,158" fill="#d01424" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Left curtain folds -->
  <path d="M58,55 Q50,72 56,95" fill="none" stroke="#5e1f0a" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M62,70 Q54,90 60,115" fill="none" stroke="#5e1f0a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Left curtain tie-back -->
  <path d="M52,110 Q72,118 62,130" fill="none" stroke="#f2e40d" stroke-width="5.93" stroke-linecap="round"/>
  <circle cx="52" cy="110" r="5" fill="#f2e40d" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Right curtain (drawn open to right) -->
  <path d="M238,44 Q228,60 232,90 Q236,118 228,140 Q222,158 238,158" fill="#d01424" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Right curtain folds -->
  <path d="M232,55 Q240,72 234,95" fill="none" stroke="#5e1f0a" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M228,70 Q236,90 230,115" fill="none" stroke="#5e1f0a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Right curtain tie-back -->
  <path d="M238,110 Q218,118 228,130" fill="none" stroke="#f2e40d" stroke-width="5.93" stroke-linecap="round"/>
  <circle cx="238" cy="110" r="5" fill="#f2e40d" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Pelmet / valance at top -->
  <path d="M52,44 Q80,58 110,48 Q145,38 180,48 Q210,58 238,44" fill="#d01424" stroke="#1a1a1a" stroke-width="7.40" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Footlights row -->
  <rect x="58" y="188" width="174" height="10" rx="3" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <circle cx="78"  cy="188" r="5" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="103" cy="188" r="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="128" cy="188" r="5" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="153" cy="188" r="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="178" cy="188" r="5" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="203" cy="188" r="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Two performer silhouettes on stage -->
  <!-- Performer left, bowing -->
  <ellipse cx="105" cy="140" rx="9" ry="9" fill="#000000"/>
  <path d="M96,149 Q88,165 96,172 Q105,162 114,172 Q122,165 114,149 Z" fill="#000000"/>
  <!-- Performer right, standing arms open -->
  <ellipse cx="185" cy="132" rx="9" ry="9" fill="#000000"/>
  <rect x="178" y="141" width="14" height="22" rx="4" fill="#000000"/>
  <line x1="178" y1="146" x2="162" y2="136" stroke="#1a1a1a" stroke-width="5.93" stroke-linecap="round"/>
  <line x1="192" y1="146" x2="208" y2="136" stroke="#1a1a1a" stroke-width="5.93" stroke-linecap="round"/>
  <line x1="181" y1="163" x2="176" y2="180" stroke="#1a1a1a" stroke-width="5.93" stroke-linecap="round"/>
  <line x1="189" y1="163" x2="194" y2="180" stroke="#1a1a1a" stroke-width="5.93" stroke-linecap="round"/>
</g></svg>