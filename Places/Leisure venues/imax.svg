<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Cinema screen - huge, tall, wide, dominates canvas -->
  <rect x="22" y="22" width="246" height="158" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Screen inner (slightly inset, lit) -->
  <rect x="30" y="30" width="230" height="142" rx="3" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Movie content on screen: simple wide-format landscape silhouette -->
  <rect x="30" y="130" width="230" height="42" rx="0" fill="#1d0e82"/>
  <!-- Mountain silhouette on screen -->
  <polygon points="60,130 100,80 140,130" fill="#2a4ec0"/>
  <polygon points="110,130 160,60 210,130" fill="#1d0e82"/>
  <polygon points="180,130 220,90 260,130" fill="#2a4ec0"/>
  <!-- Sun/moon on screen -->
  <circle cx="80" cy="60" r="18" fill="#f7de58" stroke="none"/>
  <!-- Screen frame border highlight -->
  <rect x="22" y="22" width="246" height="158" rx="5" fill="none" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Floor / audience area -->
  <rect x="22" y="180" width="246" height="38" rx="0" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Tiny seated viewers - row of small heads to show massive scale contrast -->
  <!-- Viewer 1 -->
  <circle cx="60" cy="196" r="6" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="52" y="202" width="16" height="10" rx="2" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Viewer 2 -->
  <circle cx="90" cy="194" r="6" fill="#e6b98a" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="82" y="200" width="16" height="10" rx="2" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Viewer 3 -->
  <circle cx="120" cy="196" r="6" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="112" y="202" width="16" height="10" rx="2" fill="#529929" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Viewer 4 -->
  <circle cx="150" cy="195" r="6" fill="#e6b98a" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="142" y="201" width="16" height="10" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Viewer 5 -->
  <circle cx="180" cy="196" r="6" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="172" y="202" width="16" height="10" rx="2" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Viewer 6 -->
  <circle cx="210" cy="194" r="6" fill="#e6b98a" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="202" y="200" width="16" height="10" rx="2" fill="#d01424" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Viewer 7 -->
  <circle cx="240" cy="196" r="6" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="232" y="202" width="16" height="10" rx="2" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Scale indicator arrows on sides showing tall screen height -->
  <line x1="12" y1="22" x2="12" y2="178" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <polygon points="12,18 8,28 16,28" fill="#000000"/>
  <polygon points="12,182 8,172 16,172" fill="#000000"/>
</g></svg>