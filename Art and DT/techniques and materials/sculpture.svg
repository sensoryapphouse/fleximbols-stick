<svg xmlns="http://www.w3.org/2000/svg" viewBox="77.58 84.40 356.85 356.85">
<!-- sculpture: carved stone bust on a plinth (an art object, statue) -->
<!-- plinth / pedestal -->
<rect x="176" y="356" width="160" height="58" rx="4" fill="#9aa0a6" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<rect x="196" y="330" width="120" height="32" rx="4" fill="#b9bdc2" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- bust shoulders -->
<path d="M 188 330 Q 188 272 256 272 Q 324 272 324 330 Z" fill="#b9bdc2" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- neck -->
<rect x="234" y="234" width="44" height="48" fill="#b9bdc2" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- head -->
<ellipse cx="256" cy="180" rx="58" ry="66" fill="#b9bdc2" stroke="#1a1a1a" stroke-width="9"/>
<!-- carved hair ridge -->
<path d="M 200 156 Q 210 110 256 110 Q 302 110 312 156 Q 284 134 256 134 Q 228 134 200 156 Z" fill="#9aa0a6" stroke="#1a1a1a" stroke-width="6" stroke-linejoin="round"/>
<!-- nose profile cue -->
<path d="M 256 168 L 248 198 L 262 198" fill="none" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<!-- brow / eye hint -->
<line x1="222" y1="170" x2="244" y2="172" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
</svg>
