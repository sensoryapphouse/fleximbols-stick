  <!-- Sweatband inner strip -->
  <path d="M72,155 Q145,148 218,155 L218,162 Q145,156 72,162 Z" fill="#eed5b6" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Velcro/adjustment strap at back centre top of band -->
  <rect x="118" y="98" width="54" height="14" rx="5" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
