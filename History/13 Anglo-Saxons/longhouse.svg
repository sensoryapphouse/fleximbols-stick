<!-- ground -->
<rect x="0.0" y="430.0" width="512.0" height="82.0" rx="0" fill="#6f9a4a" stroke="#1a1a1a" stroke-width="0"/>
<line x1="0" y1="430" x2="512" y2="430" stroke="#557a36" stroke-width="6" stroke-linecap="round"/>

<!-- ===== long low single dwelling at a 3/4 angle ===== -->
<!-- gable end (left, nearer) -->
<polygon points="40 430 40 330 132 286 132 386" fill="#d8c8a6" stroke="#553722" stroke-width="6" stroke-linejoin="round"/>
<!-- long front wall receding to the right -->
<polygon points="132 386 132 286 470 320 470 408" fill="#e4d5b7" stroke="#553722" stroke-width="6" stroke-linejoin="round"/>
<!-- timber uprights down the long wall -->
<line x1="200" y1="291" x2="200" y2="392" stroke="#7a5230" stroke-width="5" stroke-linecap="round"/>
<line x1="268" y1="298" x2="268" y2="397" stroke="#7a5230" stroke-width="5" stroke-linecap="round"/>
<line x1="336" y1="305" x2="336" y2="401" stroke="#7a5230" stroke-width="5" stroke-linecap="round"/>
<line x1="404" y1="312" x2="404" y2="405" stroke="#7a5230" stroke-width="5" stroke-linecap="round"/>
<!-- row of small wall openings down the long side -->
<rect x="222" y="330" width="22" height="30" fill="#3a2a18" stroke="#7a5230" stroke-width="3"/>
<rect x="290" y="336" width="22" height="30" fill="#3a2a18" stroke="#7a5230" stroke-width="3"/>
<rect x="358" y="342" width="22" height="30" fill="#3a2a18" stroke="#7a5230" stroke-width="3"/>
<!-- low doorway in the near gable end -->
<path d="M 70 386 L 70 348 A 16 16 0 0 1 102 348 L 102 386 Z" fill="#3a2a18" stroke="#7a5230" stroke-width="4" stroke-linejoin="round"/>

<!-- long thatched roof: gable triangle (near) + long ridge sloping back -->
<polygon points="20 332 86 252 152 286" fill="#c49a45" stroke="#a07c30" stroke-width="6" stroke-linejoin="round"/>
<polygon points="86 252 152 286 488 320 432 244" fill="#d9b35e" stroke="#a07c30" stroke-width="6" stroke-linejoin="round"/>
<!-- thatch combing lines along the long roof -->
<line x1="120" y1="272" x2="452" y2="305" stroke="#a07c30" stroke-width="3" stroke-linecap="round"/>
<line x1="100" y1="293" x2="470" y2="313" stroke="#a07c30" stroke-width="3" stroke-linecap="round"/>
<!-- long ridge line -->
<line x1="86" y1="252" x2="432" y2="244" stroke="#8a6a26" stroke-width="6" stroke-linecap="round"/>
<!-- smoke louvre / roof vent on the ridge with rising smoke -->
<rect x="250" y="236" width="36" height="20" fill="#3a2a18" stroke="#8a6a26" stroke-width="4"/>
<path d="M 268 236 Q 256 214 270 198 Q 282 184 270 168" fill="none" stroke="#b9b3a6" stroke-width="6" stroke-linecap="round"/>
