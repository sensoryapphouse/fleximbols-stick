  <!-- Speaker (smaller, subdued) on left -->
  <!-- Speaker box -->
  <rect x="22" y="100" width="45" height="40" rx="5" fill="#90a7d6" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Speaker cone -->
  <path d="M67 100 L67 140 L105 160 L105 80 Z" fill="#90a7d6" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Speaker grille -->
  <circle cx="44" cy="120" r="12" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="3.33"/>
  <circle cx="44" cy="120" r="5" fill="#90a7d6" stroke="#1a1a1a" stroke-width="2.22"/>
  <!-- Single small sound wave arc only -->
  <path d="M118 105 Q133 113 133 120 Q133 127 118 135" fill="none" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <!-- "Shh" face: simple small face with finger to lips, right side -->
  <!-- Face circle -->
  <circle cx="210" cy="105" r="42" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Eyes -->
  <circle cx="196" cy="96" r="5" fill="#000000"/>
  <circle cx="224" cy="96" r="5" fill="#000000"/>
  <!-- Small calm mouth (neutral line) -->
  <path d="M200 116 Q210 122 220 116" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Finger held up to lips (index finger vertical in front of mouth) -->
  <rect x="206" y="118" width="10" height="28" rx="5" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Finger tip -->
  <ellipse cx="211" cy="118" rx="5" ry="5" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Small "shh" dashes / quiet indicator -->
  <path d="M155 165 L172 165" stroke="#b8b8b8" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M180 170 L192 170" stroke="#b8b8b8" stroke-width="3.33" stroke-linecap="round"/>
</g></svg>