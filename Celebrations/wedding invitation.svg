  <circle cx="75" cy="170" r="16" fill="#d01424" stroke="#1a1a1a" stroke-width="6.67"/>
  <path d="M75 158 L78 164 L85 164 L79 168 L81 175 L75 171 L69 175 L71 168 L65 164 L72 164 Z" fill="#f2e40d" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
