  <!-- App tiles on screen (2 rows x 4 cols) -->
  <!-- Row 1 -->
  <rect x="46" y="52" width="44" height="36" rx="6" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="100" y="52" width="44" height="36" rx="6" fill="#529929" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="154" y="52" width="44" height="36" rx="6" fill="#ff9900" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="208" y="52" width="36" height="36" rx="6" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Row 2 -->
  <rect x="46" y="98" width="44" height="36" rx="6" fill="#7c3fac" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="100" y="98" width="44" height="36" rx="6" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="154" y="98" width="44" height="36" rx="6" fill="#f266aa" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="208" y="98" width="36" height="36" rx="6" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Wifi arc in top-right of screen -->
  <path d="M218 148 Q226 140 234 148" fill="none" stroke="#ffffff" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M212 155 Q226 138 240 155" fill="none" stroke="#ffffff" stroke-width="3.33" stroke-linecap="round"/>
  <circle cx="226" cy="158" r="4" fill="#ffffff" stroke="none"/>
