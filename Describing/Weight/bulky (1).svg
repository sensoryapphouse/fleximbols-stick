  <!-- Huge oversized box (centre, takes most of canvas width) -->
  <rect x="50" y="75" width="190" height="145" rx="8" fill="#f7de58" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Box cross detail -->
  <line x1="50" y1="147" x2="240" y2="147" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="145" y1="75" x2="145" y2="220" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Person peeking over / hugging box -->
  <!-- Head (just above box top) -->
  <circle cx="145" cy="52" r="18" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Eyes (strained) -->
  <circle cx="138" cy="49" r="3" fill="#000000"/>
  <circle cx="152" cy="49" r="3" fill="#000000"/>
  <!-- Mouth (strained) -->
  <path d="M138,58 Q145,54 152,58" fill="none" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Left arm reaching around box -->
  <path d="M127,70 Q60,70 50,120" fill="none" stroke="#eed5b6" stroke-width="8.88" stroke-linecap="round"/>
  <!-- Left hand gripping side -->
  <circle cx="46" cy="127" r="9" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Right arm reaching around box -->
  <path d="M163,70 Q230,70 240,120" fill="none" stroke="#eed5b6" stroke-width="8.88" stroke-linecap="round"/>
  <!-- Right hand gripping side -->
  <circle cx="244" cy="127" r="9" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Torso behind box (implied) -->
  <!-- Legs below box -->
  <line x1="128" y1="220" x2="118" y2="220" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <rect x="115" y="218" width="20" height="16" rx="4" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="155" y="218" width="20" height="16" rx="4" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Feet -->
