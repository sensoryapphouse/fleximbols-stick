<svg xmlns="http://www.w3.org/2000/svg" viewBox="51.51 10.55 449.94 449.94">
<!-- SCALDING: red thermometer (maxed out) + strong steam/heat -->
<!-- steam plumes -->
<g fill="none" stroke="#e0473c" stroke-width="9" stroke-linecap="round">
<path d="M 330 150 q -22 -24 0 -48 q 22 -24 0 -48"/>
<path d="M 388 138 q -22 -24 0 -48 q 22 -24 0 -48"/>
</g>
<!-- thermometer, centred-left, mercury at very top -->
<rect x="176" y="96" width="44" height="280" rx="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="9"/>
<circle cx="198" cy="384" r="44" fill="#e0473c" stroke="#1a1a1a" stroke-width="9"/>
<rect x="187" y="118" width="22" height="266" rx="11" fill="#e0473c" stroke="#1a1a1a" stroke-width="0"/>
<!-- scale ticks -->
<g stroke="#ffffff" stroke-width="6" stroke-linecap="round">
<line x1="209" y1="160" x2="195" y2="160"/>
<line x1="209" y1="208" x2="195" y2="208"/>
<line x1="209" y1="256" x2="195" y2="256"/>
<line x1="209" y1="304" x2="195" y2="304"/>
</g>
<!-- radiating heat lines top-right of bulb area -->
<g stroke="#f6a93b" stroke-width="9" stroke-linecap="round">
<line x1="300" y1="300" x2="338" y2="300"/>
<line x1="296" y1="262" x2="330" y2="246"/>
<line x1="296" y1="338" x2="330" y2="354"/>
</g>
</svg>
