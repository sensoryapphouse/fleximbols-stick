  <!-- modern slim LED task lamp with clip base -->
  <!-- clip base attached to desk edge -->
  <rect x="40" y="190" width="50" height="14" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>
  <path d="M45 180 L85 180 L88 200 L80 210 L50 210 L42 200 Z" fill="#efefef" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- clip screw knob -->
  <circle cx="65" cy="215" r="7" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- thin slim vertical arm -->
  <rect x="62" y="100" width="6" height="80" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- pivot joint -->
  <circle cx="65" cy="100" r="6" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- slim horizontal LED bar arm -->
  <rect x="65" y="60" width="160" height="10" rx="5" ry="5" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- elbow at top of vertical arm -->
  <line x1="65" y1="100" x2="65" y2="70" stroke="#1a1a1a" stroke-width="5.93" stroke-linecap="round"/>
  <!-- LED bar (underside) -->
  <rect x="75" y="70" width="140" height="6" fill="#fff200" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- LED dot indicators -->
  <circle cx="92" cy="73" r="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.48"/>
  <circle cx="115" cy="73" r="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.48"/>
  <circle cx="140" cy="73" r="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.48"/>
  <circle cx="165" cy="73" r="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.48"/>
  <circle cx="190" cy="73" r="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.48"/>
  <!-- light beam shapes (downward cone) -->
  <path d="M85 78 L205 78 L215 130 L75 130 Z" fill="#fff200" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- touch button on arm -->
  <circle cx="220" cy="65" r="4" fill="#000000" stroke="#1a1a1a" stroke-width="2.96"/>
</g></svg>