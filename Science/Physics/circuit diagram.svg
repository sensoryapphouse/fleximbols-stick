  <line x1="55" y1="68" x2="235" y2="68" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Wire: battery + to bottom-right loop -->
  <line x1="55" y1="172" x2="55" y2="174" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="55" y1="172" x2="235" y2="172" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Battery symbol (left) -->
  <!-- long line = + -->
  <line x1="47" y1="108" x2="63" y2="108" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- short line = - -->
  <line x1="50" y1="120" x2="60" y2="120" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- long line = + -->
  <line x1="47" y1="132" x2="63" y2="132" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- short line = - -->
  <line x1="50" y1="144" x2="60" y2="144" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="55" y1="108" x2="55" y2="68" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="55" y1="144" x2="55" y2="172" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Resistor zigzag (top wire, centre) -->
  <!-- node in from left -->
  <line x1="100" y1="68" x2="112" y2="68" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <polyline points="112,68 118,52 126,84 134,52 142,84 150,52 158,68 170,68" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="170" y1="68" x2="235" y2="68" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- LED symbol (right vertical branch) -->
  <!-- vertical wire segment at right -->
  <line x1="235" y1="68" x2="235" y2="100" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- LED triangle pointing down (anode top, cathode bottom) -->
  <polygon points="235,100 215,130 255,130" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- cathode bar -->
  <line x1="215" y1="130" x2="255" y2="130" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- LED light rays -->
  <line x1="258" y1="118" x2="270" y2="108" stroke="#1a1a1a" stroke-width="3.55" stroke-linecap="round"/>
  <line x1="258" y1="126" x2="272" y2="120" stroke="#1a1a1a" stroke-width="3.55" stroke-linecap="round"/>
  <line x1="235" y1="130" x2="235" y2="172" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
