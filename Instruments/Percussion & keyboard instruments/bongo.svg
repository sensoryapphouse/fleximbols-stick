  <line x1="55" y1="160" x2="52" y2="210" stroke="#7d5e23" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="77" y1="162" x2="77" y2="213" stroke="#7d5e23" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="99" y1="160" x2="102" y2="210" stroke="#7d5e23" stroke-width="2.96" stroke-linecap="round"/>
  <!-- Wood grain lines on right drum -->
  <line x1="151" y1="168" x2="150" y2="212" stroke="#7d5e23" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="166" y1="170" x2="166" y2="213" stroke="#7d5e23" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="181" y1="168" x2="182" y2="212" stroke="#7d5e23" stroke-width="2.96" stroke-linecap="round"/>
