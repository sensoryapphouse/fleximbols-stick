  <!-- LEFT: messy tangled cables -->
  <path d="M30 60 Q 50 80 35 100 Q 25 130 60 140 Q 90 150 70 170 Q 50 195 100 200" fill="none" stroke="#d01424" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M40 50 Q 90 90 50 120 Q 30 150 90 160 Q 130 175 80 200" fill="none" stroke="#1d0e82" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M60 70 Q 30 100 80 130 Q 110 155 40 175 Q 60 195 110 195" fill="none" stroke="#529929" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M100 50 Q 70 90 110 110 Q 130 140 90 165" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- RIGHT: tidy cable sleeve/box -->
  <!-- management box / sleeve -->
  <rect x="160" y="100" width="115" height="50" rx="22" ry="22" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="3.55" stroke-linejoin="round"/>
