  <!-- Trunk — golden-brown, straight, tall, slender (differentiated from mahogany) -->
  <rect x="136" y="140" width="18" height="80" rx="3" fill="#7d5e23" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Trunk bark texture lines -->
  <line x1="141" y1="150" x2="149" y2="150" stroke="#9d7246" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="141" y1="163" x2="149" y2="163" stroke="#9d7246" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="141" y1="176" x2="149" y2="176" stroke="#9d7246" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="141" y1="189" x2="149" y2="189" stroke="#9d7246" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="141" y1="202" x2="149" y2="202" stroke="#9d7246" stroke-width="2.96" stroke-linecap="round"/>
  <!-- Trunk up into canopy -->
  <rect x="139" y="80" width="12" height="70" rx="2" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Branches — spread wide -->
  <line x1="145" y1="110" x2="70" y2="80" stroke="#9d7246" stroke-width="10.36" stroke-linecap="round"/>
  <line x1="145" y1="105" x2="220" y2="75" stroke="#9d7246" stroke-width="10.36" stroke-linecap="round"/>
  <line x1="145" y1="100" x2="75" y2="120" stroke="#9d7246" stroke-width="7.40" stroke-linecap="round"/>
  <line x1="145" y1="100" x2="215" y2="120" stroke="#9d7246" stroke-width="7.40" stroke-linecap="round"/>
  <!-- Very large broad leaves — teak has huge leaves, ovate -->
  <!-- Canopy base -->
  <ellipse cx="145" cy="90" rx="105" ry="70" fill="#529929" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Large individual leaf shapes across canopy -->
  <ellipse cx="80" cy="75" rx="30" ry="45" fill="#67832d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" transform="rotate(-20,80,75)"/>
  <ellipse cx="210" cy="72" rx="30" ry="45" fill="#67832d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" transform="rotate(20,210,72)"/>
  <ellipse cx="145" cy="50" rx="30" ry="42" fill="#67832d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <ellipse cx="108" cy="58" rx="25" ry="38" fill="#529929" stroke="#1a1a1a" stroke-width="2.96" stroke-linejoin="round" transform="rotate(-10,108,58)"/>
  <ellipse cx="182" cy="58" rx="25" ry="38" fill="#529929" stroke="#1a1a1a" stroke-width="2.96" stroke-linejoin="round" transform="rotate(10,182,58)"/>
  <!-- Leaf veins on large visible leaves -->
  <line x1="80" y1="58" x2="80" y2="92" stroke="#529929" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="210" y1="55" x2="210" y2="89" stroke="#529929" stroke-width="2.96" stroke-linecap="round"/>
</g></svg>