<path d="M 214 150 q 16 -16 0 -32 q -16 -16 0 -32" fill="none" stroke="#bcded6" stroke-width="9"/>
<path d="M 256 138 q 16 -16 0 -32 q -16 -16 0 -32" fill="none" stroke="#bcded6" stroke-width="9"/>
<path d="M 298 150 q 16 -16 0 -32 q -16 -16 0 -32" fill="none" stroke="#bcded6" stroke-width="9"/>
<!-- heart (yum) top-left -->
<path d="M 138 196 q -22 -24 -44 0 q -22 24 44 56 q 66 -32 44 -56 q -22 -24 -44 0 Z" fill="#e0473c" stroke="#1a1a1a" stroke-width="8"/>
