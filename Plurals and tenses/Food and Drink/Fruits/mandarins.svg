  <!-- Lower right -->
  <use href="#smstar" transform="translate(183,143)" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Lower -->
  <use href="#smstar" transform="translate(162,162)" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
