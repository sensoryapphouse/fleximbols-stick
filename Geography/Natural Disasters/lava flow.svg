  <!-- Ground base -->
  <rect x="26" y="168" width="238" height="34" fill="#7f7f7f" stroke="none"/>
  <line x1="26" y1="168" x2="264" y2="168" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Volcano cone body -->
  <polygon points="145,35 55,172 235,172" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Volcano cone dark face shading -->
  <polygon points="145,35 100,172 145,155 190,172" fill="#7f7f7f" stroke="none"/>
  <!-- Lava flow stream left -->
  <polygon points="120,80 110,100 90,130 75,155 88,162 108,138 125,108 132,85" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Lava flow stream right -->
  <polygon points="158,75 165,95 180,125 195,152 182,160 168,130 155,100 150,78" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Lava bright orange core/highlight in streams -->
  <polygon points="122,88 115,108 100,135 90,155 100,158 115,138 128,112 134,92" fill="#ff9900" stroke="none"/>
  <polygon points="157,82 162,102 174,130 184,154 176,157 165,132 152,105 152,85" fill="#ff9900" stroke="none"/>
  <!-- Lava at crater/vent -->
  <ellipse cx="145" cy="50" rx="22" ry="14" fill="#f2e40d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Eruption glow above crater -->
  <ellipse cx="145" cy="38" rx="16" ry="10" fill="#f8130d" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Lava pool at base -->
  <ellipse cx="145" cy="172" rx="60" ry="10" fill="#e65a00" stroke="#1a1a1a" stroke-width="4.45"/>
