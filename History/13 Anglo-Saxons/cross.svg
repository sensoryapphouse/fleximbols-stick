<line x1="256" y1="250" x2="256" y2="268" stroke="#5e5640" stroke-width="5" stroke-linecap="round"/>
<line x1="256" y1="304" x2="256" y2="322" stroke="#5e5640" stroke-width="5" stroke-linecap="round"/>
