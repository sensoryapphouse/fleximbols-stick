<circle cx="396.0" cy="120.0" r="46.0" fill="#f6a800" stroke="#1a1a1a" stroke-width="0"/>

<!-- dry cracked ground: solid soil slab -->
<rect x="0.0" y="312.0" width="512.0" height="200.0" rx="0" fill="#c98f42" stroke="#1a1a1a" stroke-width="0"/>
<!-- top lip of ground, slightly darker, wavy horizon -->
<path d="M 0 312 Q 130 300 260 312 Q 390 324 512 312 L 512 344 L 0 344 Z" fill="#b97f37" stroke="#1a1a1a" stroke-width="0" stroke-linejoin="round"/>

<!-- CRACK NETWORK cut into the dry ground: lighter-than-soil joined fissures.
     Wide pale base = the open crack, thin dark line = the depth, so each
     fissure reads as a gap cut INTO the earth, all joined at nodes. -->
<g stroke-linecap="round" stroke-linejoin="round" fill="none">
  <!-- crack network forms joined polygon CELLS across the dry ground,
       like cracked mud. Same path drawn twice: wide pale = open crack,
       thin dark = the depth, so every fissure reads as cut INTO the earth. -->
  <!-- node ring (closed cells) -->
  <path d="M 24 360 L 150 372 L 286 358 L 392 374 L 488 360
           M 70 432 L 196 418 L 320 432 L 440 420
           M 24 360 L 70 432
           M 150 372 L 196 418
           M 286 358 L 320 432
           M 392 374 L 440 420
           M 70 432 L 60 512
           M 196 418 L 210 512
           M 320 432 L 312 512
           M 440 420 L 462 512
           M 150 372 L 138 344
           M 392 374 L 404 346"
        stroke="#ecd3a6" stroke-width="20"/>
  <path d="M 24 360 L 150 372 L 286 358 L 392 374 L 488 360
           M 70 432 L 196 418 L 320 432 L 440 420
           M 24 360 L 70 432
           M 150 372 L 196 418
           M 286 358 L 320 432
           M 392 374 L 440 420
           M 70 432 L 60 512
           M 196 418 L 210 512
           M 320 432 L 312 512
           M 440 420 L 462 512
           M 150 372 L 138 344
           M 392 374 L 404 346"
        stroke="#7a5328" stroke-width="6"/>
</g>

<!-- wilted / drooping plant, growing up from the dry ground, front-left -->
<!-- small soil mound at the base of the stem (on the soil surface) -->
<ellipse cx="118" cy="356" rx="46" ry="15" fill="#a9742f" stroke="#1a1a1a" stroke-width="0"/>
<!-- stem rising then bending over limply (no water) -->
<path d="M 118 356
         C 116 280 128 232 168 220
         C 206 209 200 262 162 262"
      fill="none" stroke="#8a7b3f" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
<!-- drooping leaf, left, hanging down -->
<path d="M 120 296
         C 70 292 60 340 100 350
         C 90 322 104 304 120 296 Z"
      fill="#9a8a45" stroke="#1a1a1a" stroke-width="0" stroke-linejoin="round"/>
<!-- drooping leaf, right, hanging down -->
<path d="M 128 270
         C 178 262 190 308 152 320
         C 162 292 144 278 128 270 Z"
      fill="#9a8a45" stroke="#1a1a1a" stroke-width="0" stroke-linejoin="round"/>
<!-- drooping flower head at the limp tip -->
<path d="M 162 262
         C 138 252 142 222 170 226
         C 192 229 188 262 162 262 Z"
      fill="#b69a3a" stroke="#1a1a1a" stroke-width="0" stroke-linejoin="round"/>
</g></svg>
