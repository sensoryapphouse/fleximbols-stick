  <rect x="118" y="146" width="9" height="20" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="3.33"/>
  <circle cx="135" cy="164" r="2" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="2.22"/>
  <rect x="143" y="146" width="9" height="20" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="3.33"/>
  <rect x="158" y="146" width="9" height="20" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- unit label (kg/g indicator) -->
  <rect x="173" y="155" width="16" height="10" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- tare button (touch-style) -->
  <circle cx="55" cy="155" r="11" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="6.67"/>
  <circle cx="55" cy="155" r="5" fill="#f2e40d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- unit / mode button -->
