<g>
<!-- handle (one bar, behind tub), running from tub up to the right grip -->
<line x1="300" y1="252" x2="440" y2="206" stroke="#1a1a1a" stroke-width="20" stroke-linecap="round"/>
<line x1="300" y1="252" x2="440" y2="206" stroke="#c08a3e" stroke-width="12" stroke-linecap="round"/>
<!-- front leg / strut down from front of tub to ground -->
<line x1="320" y1="300" x2="320" y2="392" stroke="#1a1a1a" stroke-width="18" stroke-linecap="round"/>
<line x1="320" y1="300" x2="320" y2="392" stroke="#5b6b78" stroke-width="10" stroke-linecap="round"/>
<line x1="300" y1="392" x2="340" y2="392" stroke="#5b6b78" stroke-width="12" stroke-linecap="round"/>
<!-- the tub / tray (open box, sloped, front lower) -->
<path d="M 96 200 L 360 200 L 320 300 L 156 300 Z" fill="#c7ced6" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- rim highlight -->
<path d="M 96 200 L 360 200 L 348 226 L 110 226 Z" fill="#e3e8ec" stroke="#1a1a1a" stroke-width="0" stroke-linejoin="round"/>
<!-- soil heaped in the tub -->
<path d="M 118 200 Q 170 162 230 200 Q 280 178 320 200 Z" fill="#6b4423" stroke="#4e3219" stroke-width="6" stroke-linejoin="round"/>
<circle cx="170" cy="194" r="9" fill="#4e3219"/>
<circle cx="214" cy="186" r="9" fill="#4e3219"/>
<circle cx="262" cy="194" r="9" fill="#4e3219"/>
<!-- wheel under the front of the tub -->
<circle cx="150" cy="384" r="46" fill="#5b6b78" stroke="#1a1a1a" stroke-width="9"/>
<circle cx="150" cy="384" r="18" fill="#c7ced6" stroke="#1a1a1a" stroke-width="6"/>
<!-- short frame strut linking tub front to wheel hub -->
<line x1="150" y1="300" x2="150" y2="346" stroke="#1a1a1a" stroke-width="14" stroke-linecap="round"/>
<line x1="150" y1="300" x2="150" y2="346" stroke="#5b6b78" stroke-width="8" stroke-linecap="round"/>
