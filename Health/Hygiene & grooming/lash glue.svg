<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Lash glue: small tube + brush applicator + adhesive drop -->
  <!-- Tube body -->
  <rect x="100" y="70" width="60" height="120" rx="10" fill="#efefef" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Tube label band -->
  <rect x="102" y="100" width="56" height="42" fill="#f266aa" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Lash icon on label (simple curved lashes) -->
  <path d="M115,128 Q130,118 145,128" stroke="#1a1a1a" stroke-width="4.45" fill="none" stroke-linecap="round"/>
  <line x1="118" y1="125" x2="116" y2="116" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="125" y1="121" x2="124" y2="112" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="132" y1="120" x2="132" y2="110" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="139" y1="122" x2="140" y2="112" stroke="#1a1a1a" stroke-width="2.96" stroke-linecap="round"/>
  <!-- Cap -->
  <rect x="108" y="42" width="44" height="30" rx="6" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Collar -->
  <rect x="100" y="66" width="60" height="8" rx="3" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.93"/>
  <!-- Brush stem (sticking out below tube, like wand pulled) -->
  <line x1="190" y1="100" x2="220" y2="170" stroke="#4d4d4d" stroke-width="7.40" stroke-linecap="round"/>
  <!-- Brush bristles (small oval) -->
  <ellipse cx="224" cy="178" rx="7" ry="14" fill="#000000" stroke="#1a1a1a" stroke-width="4.45" transform="rotate(25 224 178)"/>
  <!-- Glue drop dangling from brush -->
  <path d="M232,195 Q238,202 234,212 Q230,215 226,212 Q222,202 232,195 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Highlight on drop -->
  <line x1="230" y1="200" x2="230" y2="208" stroke="#ffffff" stroke-width="2.96" stroke-linecap="round"/>
  <!-- Tube shine -->
  <line x1="108" y1="80" x2="108" y2="180" stroke="#b8b8b8" stroke-width="4.45" stroke-linecap="round"/>
</g></svg>