<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- cabinet carcass -->
  <rect x="20" y="30" width="250" height="180" fill="#e6b98a" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- inner cavity (dark) -->
  <rect x="35" y="45" width="220" height="150" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- drawer body extended out partially -->
  <rect x="80" y="80" width="190" height="90" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- drawer top opening (looking in) -->
  <path d="M80 80 L95 70 L285 70 L270 80 Z" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <path d="M270 80 L285 70 L285 160 L270 170 Z" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- drawer front handle -->
  <rect x="92" y="115" width="10" height="22" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- side rail with damper (hydraulic cylinder) -->
  <rect x="35" y="155" width="55" height="10" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- damper cylinder -->
  <rect x="42" y="143" width="32" height="14" rx="3" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="46" y="146" width="24" height="8" fill="#90a7d6" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- piston rod -->
  <rect x="74" y="148" width="18" height="4" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- slow motion arrow (closing direction) -->
  <path d="M180 200 L130 200" fill="none" stroke="#137827" stroke-width="7.40" stroke-linecap="round"/>
  <path d="M140 192 L128 200 L140 208 Z" fill="#137827" stroke="#1a1a1a" stroke-width="2.96" stroke-linejoin="round"/>
  <!-- small motion lines suggesting slow -->
  <line x1="195" y1="195" x2="205" y2="195" stroke="#137827" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="195" y1="205" x2="205" y2="205" stroke="#137827" stroke-width="4.45" stroke-linecap="round"/>
</g></svg>