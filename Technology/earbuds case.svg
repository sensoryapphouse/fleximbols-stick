  <circle cx="180" cy="158" r="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.93" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right earbud speaker dot -->
  <circle cx="180" cy="162" r="9" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
