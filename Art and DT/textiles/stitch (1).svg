  <!-- Fabric piece - close up view -->
  <rect x="15" y="70" width="260" height="120" rx="8" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="7.40" stroke-linecap="round" stroke-linejoin="round"/>
