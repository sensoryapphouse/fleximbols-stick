<line x1="166" y1="118" x2="166" y2="382" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
<!-- sticker sheet inset -->
<rect x="186" y="138" width="138" height="224" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="7" stroke-linejoin="round"/>
