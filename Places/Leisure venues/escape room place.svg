  <rect x="148" y="103" width="44" height="52" rx="3" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="98" y="162" width="44" height="52" rx="3" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="148" y="162" width="44" height="52" rx="3" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Big padlock body - mounted on door -->
  <rect x="120" y="120" width="50" height="42" rx="6" fill="#f7de58" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
