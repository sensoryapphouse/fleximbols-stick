<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<!-- simple clinical cross-section: uterus + vaginal canal leading to external opening, plain educational -->
<!-- uterus (pear shape) at top -->
<path d="M 256 92
         Q 196 96 192 168
         Q 190 214 224 236
         L 232 286
         L 280 286
         L 288 236
         Q 322 214 320 168
         Q 316 96 256 92 Z"
      fill="#f5d6b0" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- cervix / inner opening line at base of uterus -->
<line x1="228" y1="252" x2="284" y2="252" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
<!-- vaginal canal: clear tube descending from cervix to external opening -->
<path d="M 232 286 L 232 408 Z" fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
<path d="M 280 286 L 280 408 Z" fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
<!-- canal walls fill (light skin) to read as a passage -->
<rect x="236" y="290" width="40" height="116" fill="#f5d6b0"/>
<!-- external opening: open mouth at the bottom -->
<path d="M 232 408 Q 256 432 280 408" fill="#f5d6b0" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<!-- arrow marker pointing to the opening -->
<line x1="360" y1="418" x2="298" y2="418" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
<line x1="298" y1="418" x2="314" y2="408" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
<line x1="298" y1="418" x2="314" y2="428" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
</svg>
