  <rect x="20" y="410" width="280" height="34" rx="12" fill="#7bc070" stroke="#1a1a1a" stroke-width="5"/>
  <!-- Vertical posts -->
  <rect x="55" y="120" width="20" height="295" rx="6" fill="#ff8855" stroke="#1a1a1a" stroke-width="5"/>
  <rect x="175" y="120" width="20" height="295" rx="6" fill="#ff8855" stroke="#1a1a1a" stroke-width="5"/>
  <rect x="130" y="170" width="20" height="245" rx="6" fill="#3aa3e0" stroke="#1a1a1a" stroke-width="5"/>
  <rect x="250" y="170" width="20" height="245" rx="6" fill="#3aa3e0" stroke="#1a1a1a" stroke-width="5"/>
  <!-- Top horizontal bars (front frame) -->
  <rect x="50" y="115" width="150" height="18" rx="6" fill="#ff5533" stroke="#1a1a1a" stroke-width="5"/>
  <!-- Back frame top -->
  <rect x="125" y="165" width="150" height="18" rx="6" fill="#2080c8" stroke="#1a1a1a" stroke-width="5"/>
  <!-- Connecting depth bars -->
  <line x1="65" y1="124" x2="140" y2="174" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
  <line x1="185" y1="124" x2="260" y2="174" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
  <!-- Front horizontal rungs -->
  <rect x="65" y="200" width="120" height="13" rx="5" fill="#ffb088" stroke="#1a1a1a" stroke-width="5"/>
  <rect x="65" y="265" width="120" height="13" rx="5" fill="#ffb088" stroke="#1a1a1a" stroke-width="5"/>
  <rect x="65" y="330" width="120" height="13" rx="5" fill="#ffb088" stroke="#1a1a1a" stroke-width="5"/>
  <!-- Back horizontal rungs -->
  <rect x="140" y="240" width="120" height="13" rx="5" fill="#80c4e8" stroke="#1a1a1a" stroke-width="5"/>
  <rect x="140" y="305" width="120" height="13" rx="5" fill="#80c4e8" stroke="#1a1a1a" stroke-width="5"/>
  <!-- Top connector knobs -->
  <circle cx="65" cy="124" r="9" fill="#ff5533" stroke="#1a1a1a" stroke-width="5"/>
  <circle cx="185" cy="124" r="9" fill="#ff5533" stroke="#1a1a1a" stroke-width="5"/>
