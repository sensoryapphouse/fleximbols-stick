  <!-- mirror with reflection of smiling face + thought bubble with heart -->
  <!-- mirror frame (oval) -->
  <ellipse cx="110" cy="120" rx="74" ry="92" fill="#7d5e23" stroke="#1a1a1a" stroke-width="5.18"/>
  <!-- mirror glass -->
  <ellipse cx="110" cy="120" rx="60" ry="78" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- mirror handle -->
  <rect x="100" y="210" width="20" height="22" rx="4" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- shine on glass -->
  <path d="M76 70 Q72 84 76 100" fill="none" stroke="#ffffff" stroke-width="5.93" stroke-linecap="round"/>
  <path d="M86 64 Q84 72 86 80" fill="none" stroke="#ffffff" stroke-width="4.45" stroke-linecap="round"/>
  <!-- reflection: smiling head -->
  <circle cx="110" cy="118" r="40" fill="#e6b98a" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- hair -->
  <path d="M74 108 Q78 76 110 70 Q142 76 146 108 Q142 90 110 86 Q78 90 74 108 Z" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="3.70" stroke-linejoin="round"/>
  <!-- eyes (happy curves) -->
  <path d="M90 116 Q96 110 102 116" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M118 116 Q124 110 130 116" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- cheeks -->
  <circle cx="86" cy="130" r="5" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="2.22"/>
  <circle cx="134" cy="130" r="5" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="2.22"/>
  <!-- big smile -->
  <path d="M88 134 Q110 152 132 134" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <path d="M88 134 Q110 142 132 134" fill="none" stroke="#1a1a1a" stroke-width="2.96"/>

  <!-- thought bubble cluster (right side) -->
  <circle cx="200" cy="160" r="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.70"/>
  <circle cx="214" cy="146" r="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.70"/>
  <!-- big thought bubble with heart -->
  <ellipse cx="240" cy="84" rx="44" ry="38" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- heart inside bubble -->
  <path d="M240 110 L218 88 Q210 72 224 66 Q234 64 240 76 Q246 64 256 66 Q270 72 262 88 Z" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- shine on heart -->
  <ellipse cx="232" cy="76" rx="4" ry="6" fill="#ffffff"/>
</g></svg>