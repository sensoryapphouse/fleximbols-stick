<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- ironing-board-modern: open board with legs + iron on top + cord -->

  <!-- Crossed support legs (behind board) -->
  <g stroke="#1a1a1a" stroke-width="11.11" stroke-linecap="round">
    <line x1="75" y1="220" x2="175" y2="120"/>
    <line x1="225" y1="220" x2="125" y2="120"/>
  </g>
  <!-- Leg inner highlight -->
  <g stroke="#b8b8b8" stroke-width="4.45" stroke-linecap="round">
    <line x1="75" y1="220" x2="175" y2="120"/>
    <line x1="225" y1="220" x2="125" y2="120"/>
  </g>

  <!-- Leg feet caps -->
  <circle cx="75" cy="220" r="6" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="6.67"/>
  <circle cx="225" cy="220" r="6" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="6.67"/>

  <!-- Pivot point -->
  <circle cx="150" cy="170" r="5" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Board (oval/teardrop on side, narrow end to right) -->
  <path d="M40 100 Q35 115 40 130 Q60 135 130 135 Q200 135 240 130 L260 122 Q265 115 260 110 L240 100 Q200 95 130 95 Q60 95 40 100 Z"
        fill="#f4a4b2" stroke="#1a1a1a" stroke-width="8.89" stroke-linejoin="round"/>

  <!-- Board cover pattern (subtle stripes) -->
  <path d="M60 105 Q130 100 230 105" fill="none" stroke="#f266aa" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M55 125 Q130 130 235 125" fill="none" stroke="#f266aa" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Iron body (sitting on board) -->
  <path d="M90 90 L155 90 Q170 90 175 80 L170 65 Q165 60 100 60 Q90 60 85 75 Z"
        fill="#3aa6a0" stroke="#1a1a1a" stroke-width="8.89" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Iron handle -->
  <path d="M105 60 Q105 40 125 35 Q150 30 160 45 Q162 55 158 60"
        fill="#1d0e82" stroke="#1a1a1a" stroke-width="8.89" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Iron control knob/dial -->
  <circle cx="130" cy="75" r="6" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Steam button -->
  <rect x="142" y="72" width="10" height="6" rx="2" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Iron sole plate edge -->
  <path d="M90 90 L155 90 Q170 90 175 80" fill="none" stroke="#137827" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Cord from back of iron, curling off board -->
  <path d="M90 75 Q60 60 45 75 Q35 95 50 105 Q70 110 55 140 Q40 170 25 200"
        fill="none" stroke="#1a1a1a" stroke-width="11.11" stroke-linecap="round"/>
  <path d="M90 75 Q60 60 45 75 Q35 95 50 105 Q70 110 55 140 Q40 170 25 200"
        fill="none" stroke="#4d4d4d" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Plug at cord end -->
  <rect x="15" y="200" width="20" height="14" rx="2" fill="#efefef" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <line x1="20" y1="200" x2="20" y2="195" stroke="#1a1a1a" stroke-width="6.67" stroke-linecap="round"/>
  <line x1="30" y1="200" x2="30" y2="195" stroke="#1a1a1a" stroke-width="6.67" stroke-linecap="round"/>

  <!-- Steam puffs from iron tip -->
  <ellipse cx="185" cy="70" rx="6" ry="4" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="200" cy="60" rx="7" ry="5" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="215" cy="68" rx="5" ry="4" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>
</g></svg>