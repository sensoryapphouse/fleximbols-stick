<svg xmlns="http://www.w3.org/2000/svg" viewBox="114.35 67.41 341.33 341.33"><!-- tinkly: a small triangle (percussion) with a beater and tiny sparkles -->
<!-- triangle instrument -->
<path d="M 256 130 L 366 332 L 146 332 Z" fill="none" stroke="#d9b43a" stroke-width="20" stroke-linejoin="round"/>
<path d="M 256 130 L 366 332 L 146 332 Z" fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- small gap at top-right corner -->
<line x1="356" y1="312" x2="372" y2="340" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
<!-- hanging string -->
<line x1="256" y1="100" x2="256" y2="130" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
<!-- beater striking -->
<line x1="300" y1="360" x2="392" y2="300" stroke="#9aa7b5" stroke-width="12" stroke-linecap="round"/>
<line x1="300" y1="360" x2="392" y2="300" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
<circle cx="296" cy="364" r="12" fill="#cfd6dc" stroke="#1a1a1a" stroke-width="6"/>
<!-- tiny sparkle/ting notes -->
<g stroke="#2f9e4a" stroke-width="7" stroke-linecap="round">
<line x1="384" y1="150" x2="384" y2="180"/>
<line x1="369" y1="165" x2="399" y2="165"/>
<line x1="420" y1="206" x2="420" y2="228"/>
<line x1="409" y1="217" x2="431" y2="217"/>
<line x1="150" y1="180" x2="150" y2="202"/>
<line x1="139" y1="191" x2="161" y2="191"/>
</g>
</svg>
