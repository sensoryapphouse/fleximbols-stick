  <!-- Envelope body -->
  <rect x="22" y="52" width="246" height="168" rx="12" ry="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Envelope flap (V shape) -->
  <polyline points="22,52 145,148 268,52" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Envelope bottom fold lines (triangles at corners for sealed look) -->
  <line x1="22" y1="220" x2="108" y2="148" stroke="#1a1a1a" stroke-width="3.55" stroke-linecap="round"/>
  <line x1="268" y1="220" x2="182" y2="148" stroke="#1a1a1a" stroke-width="3.55" stroke-linecap="round"/>
  <!-- @ symbol drawn as path (swirl) centered bottom half of envelope -->
  <!-- Outer circle of @ -->
  <circle cx="145" cy="172" r="30" fill="none" stroke="#2a4ec0" stroke-width="4.45"/>
  <!-- Inner circle of @ -->
  <circle cx="145" cy="172" r="14" fill="#dff3fd" stroke="#2a4ec0" stroke-width="3.55"/>
  <!-- The tail of the @ (arc coming off the right side, curving back in) -->
  <path d="M175 172 L175 158 Q175 148 163 148" fill="none" stroke="#2a4ec0" stroke-width="4.45" stroke-linecap="round"/>
