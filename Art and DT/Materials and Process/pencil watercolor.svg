  <!-- watercolour pencil, colour swatch wash, water droplet -->
  <!-- soft blue wash swatch behind, suggesting blendability -->
  <path d="M 40 165 Q 90 145 140 160 Q 190 175 230 158 L 235 200 Q 185 215 130 200 Q 80 188 40 205 Z" fill="#dff3fd" stroke="#2a4ec0" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- second tone swatch on top of first -->
  <path d="M 60 175 Q 110 162 160 175 Q 200 184 220 172" fill="none" stroke="#2a4ec0" stroke-width="5.93" stroke-linecap="round"/>
  <!-- water droplet, top-right -->
  <path d="M 235 50 Q 220 75 230 90 Q 245 95 250 80 Q 250 65 235 50 Z" fill="#dff3fd" stroke="#2a4ec0" stroke-width="4.45" stroke-linejoin="round"/>
  <ellipse cx="234" cy="68" rx="3" ry="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.22"/>
  <!-- watercolour pencil, painted blue body, diagonal -->
  <g transform="rotate(-22 145 110)">
    <!-- sharpened wood cone -->
    <polygon points="45,110 80,92 80,128" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
    <!-- blue pigment tip -->
    <polygon points="45,110 58,103 58,117" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
    <!-- wood-paint boundary -->
    <line x1="80" y1="92" x2="80" y2="128" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
    <!-- blue shaft -->
    <rect x="80" y="92" width="155" height="36" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
    <!-- end cap dipped in matching colour -->
    <rect x="235" y="92" width="14" height="36" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  </g>
</g></svg>