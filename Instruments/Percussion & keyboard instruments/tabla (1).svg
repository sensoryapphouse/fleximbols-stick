  <!-- Tabla: pair of hand drums — small wooden (right) + larger metal bowl (left), tuning straps, black spot on heads -->
  <!-- === LARGER METAL BOWL DRUM (bayan) LEFT === -->
  <!-- Bowl body -->
  <ellipse cx="88" cy="180" rx="52" ry="30" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <path d="M36,175 Q36,218 88,220 Q140,218 140,175" fill="#9d7246" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
