  <!-- L-shaped framing square: long arm goes right, short arm goes up -->
  <!-- Long arm (horizontal, bottom) -->
  <rect x="30" y="170" width="230" height="30" rx="3" ry="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="11.11" stroke-linejoin="round"/>
  <!-- Short arm (vertical, left) -->
  <rect x="30" y="30" width="30" height="142" rx="3" ry="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="11.11" stroke-linejoin="round"/>
  <!-- Inner corner fillet -->
  <rect x="60" y="170" width="4" height="4" fill="#b8b8b8" stroke="none"/>
  <!-- Graduation marks on long arm (top edge) -->
  <line x1="70" y1="170" x2="70" y2="178" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="90" y1="170" x2="90" y2="178" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="110" y1="170" x2="110" y2="178" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="130" y1="170" x2="130" y2="178" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="150" y1="170" x2="150" y2="178" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="170" y1="170" x2="170" y2="178" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="190" y1="170" x2="190" y2="178" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="210" y1="170" x2="210" y2="178" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="230" y1="170" x2="230" y2="178" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Minor marks long arm -->
  <line x1="80" y1="170" x2="80" y2="175" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="100" y1="170" x2="100" y2="175" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="120" y1="170" x2="120" y2="175" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="140" y1="170" x2="140" y2="175" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="160" y1="170" x2="160" y2="175" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="180" y1="170" x2="180" y2="175" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="200" y1="170" x2="200" y2="175" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="220" y1="170" x2="220" y2="175" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Graduation marks on short arm (right edge) -->
  <line x1="52" y1="60" x2="60" y2="60" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="52" y1="80" x2="60" y2="80" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="52" y1="100" x2="60" y2="100" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="52" y1="120" x2="60" y2="120" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="52" y1="140" x2="60" y2="140" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="52" y1="160" x2="60" y2="160" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="55" y1="50" x2="60" y2="50" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="55" y1="70" x2="60" y2="70" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="55" y1="90" x2="60" y2="90" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="55" y1="110" x2="60" y2="110" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="55" y1="130" x2="60" y2="130" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="55" y1="150" x2="60" y2="150" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Right-angle mark in corner -->
  <polyline points="60,190 60,170 80,170" fill="none" stroke="#1a1a1a" stroke-width="6.67"/>
  <!-- Holes in square (typical framing square detail) -->
  <circle cx="45" cy="50" r="5" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="100" cy="185" r="5" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="200" cy="185" r="5" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45"/>
