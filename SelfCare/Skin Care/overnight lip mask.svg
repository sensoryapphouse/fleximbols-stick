  <!-- Overnight lip mask: jar + moon icon + nighttime sleeping treatment -->
  <!-- Dark blue night sky panel background (NOT full canvas - smaller framed sky) -->
  <rect x="20" y="25" width="250" height="80" rx="6" ry="6" fill="#1d0e82" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Stars -->
  <path d="M50 50 L52 55 L57 55 L53 58 L55 63 L50 60 L45 63 L47 58 L43 55 L48 55 Z" fill="#fff200" stroke="#1a1a1a" stroke-width="2.22" stroke-linejoin="round"/>
  <path d="M230 45 L231 48 L234 48 L232 50 L233 53 L230 51 L227 53 L228 50 L226 48 L229 48 Z" fill="#fff200" stroke="#1a1a1a" stroke-width="2.22" stroke-linejoin="round"/>
  <circle cx="90" cy="40" r="2" fill="#ffffff"/>
  <circle cx="190" cy="80" r="2" fill="#ffffff"/>
  <circle cx="120" cy="85" r="1.5" fill="#ffffff"/>
  <circle cx="245" cy="75" r="2" fill="#ffffff"/>
  <!-- Crescent moon (key overnight indicator) -->
  <path d="M165 35 Q140 45 145 70 Q150 95 175 90 Q160 75 158 60 Q160 45 165 35 Z" fill="#fff200" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
