  <!-- Apple TV: small rounded-square black streaming box + slim remote -->
  <!-- Streaming box -->
  <rect x="38" y="80" width="130" height="80" rx="18" fill="#000000" stroke="#1a1a1a" stroke-width="6.34" stroke-linejoin="round"/>
  <rect x="48" y="90" width="110" height="60" rx="12" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.08" stroke-linejoin="round"/>
  <!-- Status LED -->
  <circle cx="103" cy="148" r="5" fill="#529929" stroke="#1a1a1a" stroke-width="3.81"/>
  <!-- HDMI port hint -->
  <rect x="82" y="156" width="42" height="10" rx="3" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.08" stroke-linejoin="round"/>
  <!-- Slim remote -->
  <rect x="196" y="55" width="46" height="148" rx="22" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="6.34" stroke-linejoin="round"/>
  <rect x="204" y="63" width="30" height="52" rx="10" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.08" stroke-linejoin="round"/>
  <!-- Touch area oval highlight -->
  <ellipse cx="219" cy="89" rx="11" ry="14" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.81"/>
  <!-- Menu button -->
  <rect x="208" y="122" width="22" height="10" rx="5" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.81" stroke-linejoin="round"/>
  <!-- Select circle button -->
  <circle cx="219" cy="152" r="12" fill="#efefef" stroke="#1a1a1a" stroke-width="5.08"/>
  <circle cx="219" cy="152" r="5" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.81"/>
  <!-- Volume buttons -->
  <rect x="206" y="172" width="10" height="18" rx="4" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="3.81" stroke-linejoin="round"/>
  <rect x="222" y="172" width="10" height="18" rx="4" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="3.81" stroke-linejoin="round"/>
