  <rect x="86"  y="112" width="6" height="16" rx="2" fill="#ffffff" stroke="none"/>
  <rect x="96"  y="106" width="6" height="28" rx="2" fill="#ffffff" stroke="none"/>
  <rect x="106" y="111" width="6" height="18" rx="2" fill="#ffffff" stroke="none"/>
  <!-- Unplayed waveform bars -->
  <rect x="142" y="112" width="6" height="16" rx="2" fill="#b8b8b8" stroke="none"/>
  <rect x="152" y="107" width="6" height="26" rx="2" fill="#b8b8b8" stroke="none"/>
