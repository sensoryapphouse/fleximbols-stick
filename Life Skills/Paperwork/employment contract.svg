  <line x1="55" y1="200" x2="135" y2="200" stroke="#1a1a1a" stroke-width="4.45"/>
  <path d="M60,198 q6,-6 12,0 q6,4 12,-2 q5,-3 10,2" fill="none" stroke="#1d0e82" stroke-width="5.56" stroke-linecap="round"/>
  <line x1="155" y1="200" x2="235" y2="200" stroke="#1a1a1a" stroke-width="4.45"/>
  <path d="M160,198 q6,-6 12,0 q6,4 12,-2 q5,-3 10,2" fill="none" stroke="#1d0e82" stroke-width="5.56" stroke-linecap="round"/>
