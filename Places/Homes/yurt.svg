  <rect x="60" y="138" width="170" height="12" fill="#d01424" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- diamond pattern on band -->
  <polygon points="85,144 92,138 99,144 92,150" fill="#fff200" stroke="#1a1a1a" stroke-width="2.67"/>
  <polygon points="125,144 132,138 139,144 132,150" fill="#fff200" stroke="#1a1a1a" stroke-width="2.67"/>
  <polygon points="165,144 172,138 179,144 172,150" fill="#fff200" stroke="#1a1a1a" stroke-width="2.67"/>
  <polygon points="205,144 212,138 219,144 212,150" fill="#fff200" stroke="#1a1a1a" stroke-width="2.67"/>
  <!-- door -->
