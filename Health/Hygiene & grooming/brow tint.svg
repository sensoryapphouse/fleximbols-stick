<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Brow tint: tint tube with dye + applicator + colour transformation -->
  <!-- Tint tube (laid horizontally) -->
  <rect x="20" y="60" width="120" height="40" rx="8" fill="#efefef" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Tube colour band -->
  <rect x="50" y="64" width="80" height="32" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Tube nozzle/cap (left side, small) -->
  <rect x="6" y="68" width="18" height="24" rx="3" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Crimp seal at right end of tube -->
  <rect x="138" y="60" width="6" height="40" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Dye dollop squeezed onto applicator -->
  <ellipse cx="80" cy="120" rx="14" ry="8" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Applicator (small angled brush) -->
  <rect x="60" y="125" width="60" height="10" rx="3" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <polygon points="118,125 138,118 142,138 120,135" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <!-- Colour transformation: two brows side by side, before/after -->
  <!-- Before brow (light, sparse) -->
  <path d="M30,180 Q60,168 90,180" stroke="#e6b98a" stroke-width="4.45" fill="none" stroke-linecap="round"/>
  <line x1="42" y1="176" x2="40" y2="166" stroke="#e6b98a" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="56" y1="172" x2="56" y2="162" stroke="#e6b98a" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="72" y1="172" x2="73" y2="162" stroke="#e6b98a" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Arrow between -->
  <line x1="110" y1="180" x2="150" y2="180" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <polygon points="150,174 162,180 150,186" fill="#000000" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <!-- After brow (dark, full) -->
  <path d="M180,180 Q220,162 260,180" stroke="#5e1f0a" stroke-width="8.88" fill="none" stroke-linecap="round"/>
  <line x1="192" y1="174" x2="190" y2="162" stroke="#5e1f0a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="208" y1="168" x2="208" y2="156" stroke="#5e1f0a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="224" y1="166" x2="224" y2="154" stroke="#5e1f0a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="240" y1="168" x2="241" y2="156" stroke="#5e1f0a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="254" y1="174" x2="256" y2="162" stroke="#5e1f0a" stroke-width="4.45" stroke-linecap="round"/>
</g></svg>