  <path d="M122,142 Q145,158 168,142" fill="none" stroke="#b8b8b8" stroke-width="6.67" stroke-linecap="round"/>
  <!-- Frosted glass pane on top — filled pale blue-white to obscure detail -->
  <rect x="46" y="36" width="198" height="172" rx="14" ry="14" fill="#dff3fd" stroke="#1a1a1a" stroke-width="11.11" stroke-linejoin="round"/>
