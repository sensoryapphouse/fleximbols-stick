<svg xmlns="http://www.w3.org/2000/svg" viewBox="66.72 54.77 395.64 395.64">
<!-- papier mache: round form covered in overlapping torn paper strips + paste brush -->
<!-- main rounded form (balloon/ball base) -->
<circle cx="238" cy="262" r="142" fill="#e8d9b8" stroke="#1a1a1a" stroke-width="9"/>
<!-- clip paper strips to the ball so they wrap it -->
<clipPath id="ball"><circle cx="238" cy="262" r="138"/></clipPath>
<g clip-path="url(#ball)">
<!-- overlapping torn newspaper strips banding across the form -->
<path d="M 88 168 Q 238 150 392 172 L 392 214 Q 238 192 88 214 Z" fill="#fff" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
<path d="M 88 226 Q 238 246 392 224 L 392 268 Q 238 290 88 270 Z" fill="#f4f0e4" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
<path d="M 88 282 Q 238 262 392 284 L 392 326 Q 238 306 88 326 Z" fill="#fff" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
<path d="M 88 338 Q 238 360 392 338 L 392 392 Q 238 372 88 392 Z" fill="#f4f0e4" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
<!-- printed-text dashes hinting newspaper -->
<line x1="150" y1="186" x2="214" y2="184" stroke="#9aa0a6" stroke-width="5" stroke-linecap="round"/>
<line x1="262" y1="184" x2="326" y2="188" stroke="#9aa0a6" stroke-width="5" stroke-linecap="round"/>
<line x1="150" y1="246" x2="214" y2="250" stroke="#9aa0a6" stroke-width="5" stroke-linecap="round"/>
<line x1="262" y1="250" x2="326" y2="246" stroke="#9aa0a6" stroke-width="5" stroke-linecap="round"/>
<line x1="150" y1="302" x2="214" y2="300" stroke="#9aa0a6" stroke-width="5" stroke-linecap="round"/>
<line x1="262" y1="300" x2="326" y2="304" stroke="#9aa0a6" stroke-width="5" stroke-linecap="round"/>
</g>
<!-- paste brush dabbing top-right -->
<line x1="430" y1="104" x2="362" y2="196" stroke="#8a5a2b" stroke-width="15" stroke-linecap="round"/>
<line x1="382" y1="172" x2="364" y2="196" stroke="#9aa0a6" stroke-width="16" stroke-linecap="round"/>
<path d="M 366 194 L 346 222 L 366 226 Z" fill="#f4c430" stroke="#1a1a1a" stroke-width="6" stroke-linejoin="round"/>
</svg>
