  <circle cx="255" cy="62" r="24" fill="#f7de58" stroke="#1a1a1a" stroke-width="5.55"/>
  <circle cx="255" cy="62" r="15" fill="none" stroke="#1a1a1a" stroke-width="3.33"/>

