  <!-- Gauge bezel -->
  <circle cx="145" cy="130" r="98" fill="#efefef" stroke="#1a1a1a" stroke-width="6.34"/>
  <circle cx="145" cy="130" r="90" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.81"/>
  <!-- E–F arc tick marks (arc from ~200° to ~-20°, i.e. 200° span) -->
  <!-- E tick (far left ~200°) -->
  <line x1="145" y1="42" x2="145" y2="58" stroke="#1a1a1a" stroke-width="6.34" stroke-linecap="round" transform="rotate(-110 145 130)"/>
  <!-- quarter left -->
  <line x1="145" y1="42" x2="145" y2="52" stroke="#1a1a1a" stroke-width="3.81" stroke-linecap="round" transform="rotate(-82 145 130)"/>
  <!-- half -->
  <line x1="145" y1="42" x2="145" y2="58" stroke="#1a1a1a" stroke-width="6.34" stroke-linecap="round" transform="rotate(-55 145 130)"/>
  <!-- quarter right -->
  <line x1="145" y1="42" x2="145" y2="52" stroke="#1a1a1a" stroke-width="3.81" stroke-linecap="round" transform="rotate(-28 145 130)"/>
  <!-- F tick (far right ~-20°) -->
  <line x1="145" y1="42" x2="145" y2="58" stroke="#1a1a1a" stroke-width="6.34" stroke-linecap="round" transform="rotate(0 145 130)"/>
  <!-- Minor ticks -->
  <line x1="145" y1="42" x2="145" y2="50" stroke="#1a1a1a" stroke-width="3.81" stroke-linecap="round" transform="rotate(-96 145 130)"/>
  <line x1="145" y1="42" x2="145" y2="50" stroke="#1a1a1a" stroke-width="3.81" stroke-linecap="round" transform="rotate(-68 145 130)"/>
  <line x1="145" y1="42" x2="145" y2="50" stroke="#1a1a1a" stroke-width="3.81" stroke-linecap="round" transform="rotate(-41 145 130)"/>
  <line x1="145" y1="42" x2="145" y2="50" stroke="#1a1a1a" stroke-width="3.81" stroke-linecap="round" transform="rotate(-14 145 130)"/>
  <!-- E label region red arc (low fuel) -->
  <path d="M 57 160 A 90 90 0 0 1 75 96" fill="none" stroke="#f8130d" stroke-width="12.69" stroke-linecap="round"/>
  <!-- Needle near E (low, pointing ~-100° from top = left side) -->
  <line x1="145" y1="130" x2="82" y2="96" stroke="#f8130d" stroke-width="6.34" stroke-linecap="round"/>
  <!-- Needle pivot -->
  <circle cx="145" cy="130" r="9" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="3.81"/>
