  <line x1="15" y1="120" x2="275" y2="120" stroke="#e6b98a" stroke-width="2.22" stroke-linecap="round"/>
  <line x1="15" y1="140" x2="275" y2="140" stroke="#e6b98a" stroke-width="2.22" stroke-linecap="round"/>
  <line x1="15" y1="160" x2="275" y2="160" stroke="#e6b98a" stroke-width="2.22" stroke-linecap="round"/>
  <!-- Running stitch line (dashed thread) -->
  <!-- Above-fabric segments (visible stitches) -->
  <line x1="28" y1="130" x2="68" y2="130" stroke="#f8130d" stroke-width="7.40" stroke-linecap="round"/>
  <line x1="88" y1="130" x2="128" y2="130" stroke="#f8130d" stroke-width="7.40" stroke-linecap="round"/>
  <line x1="148" y1="130" x2="188" y2="130" stroke="#f8130d" stroke-width="7.40" stroke-linecap="round"/>
  <!-- Under-fabric segments (implied, dimmer) -->
  <line x1="68" y1="130" x2="88" y2="130" stroke="#f8130d" stroke-width="3.70" stroke-linecap="round" stroke-dasharray="4,4"/>
  <line x1="128" y1="130" x2="148" y2="130" stroke="#f8130d" stroke-width="3.70" stroke-linecap="round" stroke-dasharray="4,4"/>
  <!-- Stitch entry/exit dots in fabric -->
  <circle cx="68" cy="130" r="5" fill="#000000" stroke="none"/>
  <circle cx="88" cy="130" r="5" fill="#000000" stroke="none"/>
  <circle cx="128" cy="130" r="5" fill="#000000" stroke="none"/>
  <circle cx="148" cy="130" r="5" fill="#000000" stroke="none"/>
  <!-- Needle at end of last stitch coming through fabric -->
  <!-- Needle body -->
  <rect x="184" y="108" width="7" height="50" rx="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
