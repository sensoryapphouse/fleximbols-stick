<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<!-- pool water -->
<path d="M 250 300 L 430 300 L 430 420 L 250 420 Z" fill="#a9d8f0" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<path d="M 270 330 Q 300 316 330 330 T 390 330" fill="none" stroke="#3d7fb5" stroke-width="7" stroke-linecap="round"/>
<path d="M 270 366 Q 300 352 330 366 T 390 366" fill="none" stroke="#3d7fb5" stroke-width="7" stroke-linecap="round"/>
<!-- hoist base -->
<rect x="86" y="330" width="80" height="90" rx="6" fill="#f3cd6e" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- mast -->
<rect x="116" y="120" width="22" height="216" rx="6" fill="#b9bdc2" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- swing arm reaching over the water -->
<line x1="127" y1="130" x2="300" y2="170" stroke="#1a1a1a" stroke-width="16" stroke-linecap="round"/>
<line x1="127" y1="130" x2="300" y2="170" stroke="#b9bdc2" stroke-width="8" stroke-linecap="round"/>
<!-- lift line down to seat -->
<line x1="300" y1="170" x2="300" y2="232" stroke="#1a1a1a" stroke-width="6"/>
<!-- hoist seat over the pool -->
<path d="M 264 232 L 336 232 L 336 268 L 322 268 L 322 300 L 278 300 L 278 268 L 264 268 Z" fill="#e23c3c" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
</svg>
