<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Music staff with low bass-clef notes - thick notes near bottom of staff -->

  <!-- Staff page -->
  <rect x="20" y="50" width="250" height="140" rx="6" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="5.08"/>

  <!-- Five staff lines -->
  <line x1="32" y1="80" x2="258" y2="80" stroke="#1a1a1a" stroke-width="3.18" stroke-linecap="round"/>
  <line x1="32" y1="100" x2="258" y2="100" stroke="#1a1a1a" stroke-width="3.18" stroke-linecap="round"/>
  <line x1="32" y1="120" x2="258" y2="120" stroke="#1a1a1a" stroke-width="3.18" stroke-linecap="round"/>
  <line x1="32" y1="140" x2="258" y2="140" stroke="#1a1a1a" stroke-width="3.18" stroke-linecap="round"/>
  <line x1="32" y1="160" x2="258" y2="160" stroke="#1a1a1a" stroke-width="3.18" stroke-linecap="round"/>

  <!-- Bass clef (F clef): backwards-C with two dots -->
  <path d="M44 80 Q72 80 72 110 Q72 142 44 156 Q40 156 40 152 Q40 144 50 144 Q66 144 66 124 Q66 96 50 96 Q44 96 44 102" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Two dots after bass clef -->
  <circle cx="80" cy="92" r="4" fill="#000000"/>
  <circle cx="80" cy="108" r="4" fill="#000000"/>

  <!-- Thick, low bass notes (filled black) sitting on bottom lines -->
  <!-- Note 1 - bottom space -->
  <ellipse cx="106" cy="160" rx="11" ry="8" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45" transform="rotate(-15 106 160)"/>
  <line x1="115" y1="155" x2="115" y2="120" stroke="#1a1a1a" stroke-width="5.71" stroke-linecap="round"/>

  <!-- Note 2 - second from bottom -->
  <ellipse cx="138" cy="150" rx="11" ry="8" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45" transform="rotate(-15 138 150)"/>
  <line x1="147" y1="145" x2="147" y2="110" stroke="#1a1a1a" stroke-width="5.71" stroke-linecap="round"/>

  <!-- Note 3 - bottom line -->
  <ellipse cx="170" cy="160" rx="11" ry="8" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45" transform="rotate(-15 170 160)"/>
  <line x1="179" y1="155" x2="179" y2="120" stroke="#1a1a1a" stroke-width="5.71" stroke-linecap="round"/>

  <!-- Note 4 - low below staff (ledger line) -->
  <ellipse cx="202" cy="170" rx="11" ry="8" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45" transform="rotate(-15 202 170)"/>
  <line x1="190" y1="170" x2="214" y2="170" stroke="#1a1a1a" stroke-width="3.18" stroke-linecap="round"/>
  <line x1="211" y1="165" x2="211" y2="130" stroke="#1a1a1a" stroke-width="5.71" stroke-linecap="round"/>

  <!-- Note 5 - low -->
  <ellipse cx="234" cy="160" rx="11" ry="8" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45" transform="rotate(-15 234 160)"/>
  <line x1="243" y1="155" x2="243" y2="120" stroke="#1a1a1a" stroke-width="5.71" stroke-linecap="round"/>

  <!-- Beam connecting note stems for that bass-line feel -->
  <rect x="115" y="108" width="130" height="6" fill="#000000" stroke="#1a1a1a" stroke-width="2.54"/>

  <!-- Downward arrow indicating LOW pitch -->
  <line x1="148" y1="208" x2="148" y2="224" stroke="#1d0e82" stroke-width="5.08" stroke-linecap="round"/>
  <polygon points="148,224 140,216 156,216" fill="#1d0e82" stroke="#1a1a1a" stroke-width="3.18" stroke-linejoin="round"/>
  <line x1="120" y1="208" x2="176" y2="208" stroke="#1d0e82" stroke-width="3.81" stroke-linecap="round"/>

  <!-- Bar lines -->
  <line x1="254" y1="80" x2="254" y2="160" stroke="#1a1a1a" stroke-width="3.18" stroke-linecap="round"/>

  <!-- Large bass note decoration top corner -->
  <ellipse cx="246" cy="32" rx="10" ry="8" fill="#1d0e82" stroke="#1a1a1a" stroke-width="3.81" transform="rotate(-15 246 32)"/>
  <line x1="255" y1="28" x2="255" y2="12" stroke="#1d0e82" stroke-width="5.08" stroke-linecap="round"/>
</g></svg>