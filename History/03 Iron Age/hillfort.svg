<!-- fortified hill: broad mound with a flat hilltop plateau -->
<path d="M 40 432 Q 96 300 176 264 L 336 264 Q 416 300 472 432 Z" fill="#7d9a52" stroke="#5a7038" stroke-width="6" stroke-linejoin="round"/>
