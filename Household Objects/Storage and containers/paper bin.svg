  <rect x="100" y="188" width="90" height="14" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" transform="rotate(-3 145 195)"/>
  <!-- Middle sheet -->
  <rect x="103" y="172" width="84" height="18" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Top sheet (newspaper fold) -->
  <rect x="106" y="152" width="78" height="22" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
