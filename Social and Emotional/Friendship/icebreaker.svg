  <path d="M218 58 Q212 50 216 44 Q220 38 215 32" fill="none" stroke="#b8b8b8" stroke-width="6.67" stroke-linecap="round"/>
  <!-- Antenna mast -->
  <line x1="178" y1="85" x2="178" y2="55" stroke="#1a1a1a" stroke-width="6.67" stroke-linecap="round"/>
  <line x1="168" y1="60" x2="188" y2="60" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <circle cx="178" cy="55" r="4" fill="#f2e40d" stroke="#1a1a1a" stroke-width="4.45"/>
