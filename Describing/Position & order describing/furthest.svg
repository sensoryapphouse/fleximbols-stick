<svg xmlns="http://www.w3.org/2000/svg" viewBox="42.32 67.92 432.48 432.48">
<!-- FURTHEST: a row of trees receding down a path. The small tree far away at the top is highlighted; the big near ones faded. Green arrow points at the furthest. -->
<!-- receding path: wide at bottom (near), narrow at top (far) -->
<polygon points="206,140 306,140 392,470 120,470" fill="#e9d9b8" stroke="#9aa7b5" stroke-width="6" stroke-linejoin="round"/>

<!-- NEAR tree (big, bottom-front, faded) -->
<g opacity="0.34">
  <rect x="240" y="402" width="32" height="56" fill="#7a4a22" stroke="#1a1a1a" stroke-width="9"/>
  <polygon points="256,290 196,410 316,410" fill="#3fb24a" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
</g>

<!-- MID tree (medium, faded) -->
<g opacity="0.34">
  <rect x="247" y="250" width="18" height="44" fill="#7a4a22" stroke="#1a1a1a" stroke-width="6"/>
  <polygon points="256,176 216,256 296,256" fill="#3fb24a" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
</g>

<!-- FAR tree = FURTHEST (small, top, highlighted) -->
<rect x="249" y="148" width="14" height="30" fill="#7a4a22" stroke="#1a1a1a" stroke-width="6"/>
<polygon points="256,100 228,152 284,152" fill="#3fb24a" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>

<!-- bold green arrow pointing at the furthest (far, small) tree -->
<line x1="392" y1="120" x2="320" y2="132" stroke="#1a1a1a" stroke-width="22.0" stroke-linecap="round"/><line x1="320" y1="132" x2="352" y2="142" stroke="#1a1a1a" stroke-width="22.0" stroke-linecap="round"/><line x1="320" y1="132" x2="344" y2="108" stroke="#1a1a1a" stroke-width="22.0" stroke-linecap="round"/><line x1="392" y1="120" x2="320" y2="132" stroke="#2f9e4a" stroke-width="16.5" stroke-linecap="round"/>
<line x1="320" y1="132" x2="352" y2="142" stroke="#2f9e4a" stroke-width="16.5" stroke-linecap="round"/>
<line x1="320" y1="132" x2="344" y2="108" stroke="#2f9e4a" stroke-width="16.5" stroke-linecap="round"/>
</svg>
