  <!-- shelf shadow line -->
  <line x1="30" y1="216" x2="260" y2="216" stroke="#1a1a1a" stroke-width="5.34" stroke-linecap="round"/>
  <!-- large folded bath towel: stacked layers -->
  <!-- back layer (lightest) -->
  <rect x="40" y="50" width="210" height="166" rx="10" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="7.11" stroke-linejoin="round"/>
  <!-- middle fold edge -->
  <path d="M40 130 L250 130" stroke="#1a1a1a" stroke-width="5.34" stroke-linecap="round"/>
  <!-- top folded edge stripes (showing folded thickness) -->
  <rect x="40" y="50" width="210" height="18" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="5.34" stroke-linejoin="round"/>
  <!-- bottom band -->
  <rect x="40" y="190" width="210" height="26" fill="#1d0e82" stroke="#1a1a1a" stroke-width="5.34" stroke-linejoin="round"/>
  <!-- decorative stripe -->
  <rect x="40" y="148" width="210" height="10" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="3.55"/>
  <!-- vertical fold lines indicating thickness on side -->
  <line x1="46" y1="56" x2="46" y2="210" stroke="#1a1a1a" stroke-width="3.55" stroke-linecap="round"/>
  <line x1="244" y1="56" x2="244" y2="210" stroke="#1a1a1a" stroke-width="3.55" stroke-linecap="round"/>
  <!-- soft texture lines -->
  <path d="M60 100 L100 100 M120 100 L160 100 M180 100 L220 100" stroke="#1d0e82" stroke-width="3.55" stroke-linecap="round"/>
  <path d="M60 168 L100 168 M120 168 L160 168 M180 168 L220 168" stroke="#1d0e82" stroke-width="3.55" stroke-linecap="round"/>
</g></svg>