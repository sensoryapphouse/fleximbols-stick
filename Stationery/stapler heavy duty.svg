  <line x1="80" y1="95" x2="80" y2="111" stroke="#90a7d6" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="100" y1="95" x2="100" y2="111" stroke="#90a7d6" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="120" y1="95" x2="120" y2="111" stroke="#90a7d6" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="140" y1="95" x2="140" y2="111" stroke="#90a7d6" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="160" y1="95" x2="160" y2="111" stroke="#90a7d6" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="180" y1="95" x2="180" y2="111" stroke="#90a7d6" stroke-width="4.45" stroke-linecap="round"/>
