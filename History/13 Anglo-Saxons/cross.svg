<rect x="188.0" y="424.0" width="136.0" height="24.0" rx="0" fill="#c6bca0" stroke="#5e5640" stroke-width="5"/>
<rect x="208.0" y="404.0" width="96.0" height="22.0" rx="0" fill="#d6cdb4" stroke="#5e5640" stroke-width="5"/>
