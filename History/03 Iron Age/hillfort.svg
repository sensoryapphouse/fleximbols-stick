<path d="M 64 374 Q 256 314 448 374 L 448 400 Q 256 340 64 400 Z" fill="#8aa861" stroke="#4c5f30" stroke-width="6" stroke-linejoin="round"/>
<!-- defensive ditch (dark groove) below the rampart -->
<path d="M 60 408 Q 256 350 452 408 L 452 420 Q 256 362 60 420 Z" fill="#4c5f30" stroke="#3c4d26" stroke-width="3" stroke-linejoin="round"/>
<!-- flat hilltop -->
<path d="M 176 264 Q 256 246 336 264" fill="none" stroke="#6b8744" stroke-width="10" stroke-linecap="round"/>
<!-- ring of tall pointed timber stakes (palisade) around the flat top -->
<polygon points="170,262 186,262 178,206" fill="#9c6b3a" stroke="#5a3a1f" stroke-width="4" stroke-linejoin="round"/>
<polygon points="192,260 208,260 200,200" fill="#a9763c" stroke="#5a3a1f" stroke-width="4" stroke-linejoin="round"/>
<polygon points="214,258 230,258 222,196" fill="#9c6b3a" stroke="#5a3a1f" stroke-width="4" stroke-linejoin="round"/>
<polygon points="236,256 252,256 244,193" fill="#a9763c" stroke="#5a3a1f" stroke-width="4" stroke-linejoin="round"/>
<polygon points="260,256 276,256 268,193" fill="#9c6b3a" stroke="#5a3a1f" stroke-width="4" stroke-linejoin="round"/>
<polygon points="282,258 298,258 290,196" fill="#a9763c" stroke="#5a3a1f" stroke-width="4" stroke-linejoin="round"/>
<polygon points="304,260 320,260 312,200" fill="#9c6b3a" stroke="#5a3a1f" stroke-width="4" stroke-linejoin="round"/>
<polygon points="326,262 342,262 334,206" fill="#a9763c" stroke="#5a3a1f" stroke-width="4" stroke-linejoin="round"/>
<!-- horizontal rail binding the stakes -->
<line x1="172" y1="232" x2="340" y2="232" stroke="#7a5230" stroke-width="6" stroke-linecap="round"/>
</g></svg>
