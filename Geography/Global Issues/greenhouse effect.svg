  <!-- Ground strip -->
  <rect x="25" y="195" width="240" height="22" rx="4" fill="#529929" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Glass dome -->
  <path d="M55 195 Q55 90 145 65 Q235 90 235 195" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Dome highlight -->
  <path d="M72 185 Q68 110 120 82" fill="none" stroke="#ffffff" stroke-width="3.55" stroke-linecap="round"/>
  <!-- Sun -->
  <circle cx="145" cy="32" r="22" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Sun rays -->
  <line x1="145" y1="5" x2="145" y2="18" stroke="#f2e40d" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="118" y1="13" x2="126" y2="23" stroke="#f2e40d" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="172" y1="13" x2="164" y2="23" stroke="#f2e40d" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Incoming rays (orange, entering dome) -->
  <line x1="120" y1="54" x2="108" y2="100" stroke="#ff9900" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="145" y1="57" x2="145" y2="105" stroke="#ff9900" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="170" y1="54" x2="182" y2="100" stroke="#ff9900" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Trapped / bouncing rays (red, reflected inside dome) -->
  <!-- Left bounce -->
  <path d="M98 115 L80 155 L110 170" fill="none" stroke="#f8130d" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="104,168 110,170 108,162" fill="none" stroke="#f8130d" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right bounce -->
  <path d="M192 115 L210 155 L180 170" fill="none" stroke="#f8130d" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="186,168 180,170 182,162" fill="none" stroke="#f8130d" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Centre bounce up -->
  <path d="M145 110 L145 165" fill="none" stroke="#f8130d" stroke-width="4.45" stroke-linecap="round"/>
  <polyline points="138,160 145,165 152,160" fill="none" stroke="#f8130d" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
</g></svg>