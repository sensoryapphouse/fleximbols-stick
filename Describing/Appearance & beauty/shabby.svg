<svg xmlns="http://www.w3.org/2000/svg" viewBox="28.59 20.05 405.33 405.33"><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
<!-- smart neat armchair (faded) vs shabby worn armchair (full); arrow at shabby -->
<g opacity="0.34" transform="translate(132 270) scale(0.95)">
<g stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
<!-- back -->
<path d="M -58 -70 Q -58 -96 -32 -96 L 32 -96 Q 58 -96 58 -70 L 58 6 L -58 6 Z" fill="#5aa0c8"/>
<!-- seat cushion -->
<rect x="-58" y="2" width="116" height="34" rx="10" fill="#4a90b8"/>
<!-- left arm -->
<rect x="-78" y="-34" width="26" height="70" rx="12" fill="#5aa0c8"/>
<!-- right arm -->
<rect x="52" y="-34" width="26" height="70" rx="12" fill="#5aa0c8"/>
<!-- legs -->
<line x1="-62" y1="36" x2="-66" y2="62"/>
<line x1="62" y1="36" x2="66" y2="62"/>
</g>
</g>
<!-- shabby worn armchair full opacity -->
<g transform="translate(330 270) scale(0.95)">
<g stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
<!-- back, sagging top -->
<path d="M -58 -70 Q -58 -96 -32 -96 Q 0 -84 32 -96 Q 58 -96 58 -70 L 58 6 L -58 6 Z" fill="#a98f6a"/>
<!-- seat cushion, sagging -->
<path d="M -58 6 L 58 6 L 58 22 Q 0 44 -58 22 Z" fill="#977c58"/>
<!-- left arm, worn -->
<rect x="-78" y="-34" width="26" height="70" rx="12" fill="#a98f6a"/>
<!-- right arm, worn -->
<rect x="52" y="-34" width="26" height="70" rx="12" fill="#a98f6a"/>
<!-- legs -->
<line x1="-62" y1="36" x2="-66" y2="62"/>
<line x1="62" y1="36" x2="66" y2="62"/>
</g>
<!-- patch on backrest -->
<rect x="-34" y="-66" width="38" height="34" rx="3" fill="#7a8b53" stroke="#1a1a1a" stroke-width="6"/>
<line x1="-34" y1="-57" x2="4" y2="-57" stroke="#1a1a1a" stroke-width="4" stroke-dasharray="6 6"/>
<line x1="-34" y1="-49" x2="4" y2="-49" stroke="#1a1a1a" stroke-width="4" stroke-dasharray="6 6"/>
<line x1="-25" y1="-66" x2="-25" y2="-32" stroke="#1a1a1a" stroke-width="4" stroke-dasharray="6 6"/>
<line x1="-5" y1="-66" x2="-5" y2="-32" stroke="#1a1a1a" stroke-width="4" stroke-dasharray="6 6"/>
<!-- rip on right arm -->
<path d="M 64 -22 l -6 12 l 8 6 l -6 12" fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<!-- spring poking out of seat -->
<path d="M 24 6 q 0 -16 14 -16 q 14 0 14 12 q 0 10 -10 10 q -8 0 -8 -8 q 0 -6 6 -6" fill="none" stroke="#8a8f98" stroke-width="5" stroke-linecap="round"/>
<!-- stuffing tuft on seat -->
<path d="M -36 8 q -8 -10 -2 -18 q 8 4 6 14" fill="#f2ead2" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round"/>
</g>
<!-- green arrow at the shabby (right) one -->
<line x1="334" y1="120" x2="334" y2="170" stroke="#1a1a1a" stroke-width="23.0" stroke-linecap="round"/><line x1="334" y1="170" x2="310" y2="144" stroke="#1a1a1a" stroke-width="23.0" stroke-linecap="round"/><line x1="334" y1="170" x2="358" y2="144" stroke="#1a1a1a" stroke-width="23.0" stroke-linecap="round"/><line x1="334" y1="120" x2="334" y2="170" stroke="#2f9e4a" stroke-width="17.5" stroke-linecap="round"/>
<line x1="334" y1="170" x2="310" y2="144" stroke="#2f9e4a" stroke-width="17.5" stroke-linecap="round"/>
<line x1="334" y1="170" x2="358" y2="144" stroke="#2f9e4a" stroke-width="17.5" stroke-linecap="round"/>
</svg>
