  <!-- Series A: small money plant/seedling sprout with ONE coin + small up bar -->

  <!-- Soil mound -->
  <ellipse cx="145" cy="200" rx="75" ry="22" fill="#9d7246" stroke="#1a1a1a" stroke-width="5.55"/>

  <!-- Pot -->
  <polygon points="110,200 180,200 170,225 120,225" fill="#f8130d" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>

  <!-- Plant stem -->
  <line x1="145" y1="200" x2="145" y2="130" stroke="#529929" stroke-width="7.77" stroke-linecap="round"/>

  <!-- Small seedling leaves (2 small leaves) -->
  <!-- Left leaf -->
  <path d="M 145 160 Q 110 140 108 115 Q 135 130 145 155" fill="#67832d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Right leaf -->
  <path d="M 145 145 Q 178 125 180 100 Q 155 118 145 140" fill="#529929" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- ONE coin (single, small) -->
  <ellipse cx="145" cy="90" rx="20" ry="8" fill="#f7de58" stroke="#1a1a1a" stroke-width="5.55"/>
  <ellipse cx="145" cy="82" rx="20" ry="8" fill="#f2e40d" stroke="#1a1a1a" stroke-width="5.55"/>
  <line x1="125" y1="82" x2="125" y2="90" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="165" y1="82" x2="165" y2="90" stroke="#1a1a1a" stroke-width="3.33"/>

  <!-- Small up bar chart (one short bar, modest growth) -->
  <rect x="58" y="170" width="18" height="18" fill="#90a7d6" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="80" y="158" width="18" height="30" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Baseline -->
  <line x1="55" y1="188" x2="102" y2="188" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Small up arrow above bars -->
  <line x1="90" y1="150" x2="90" y2="136" stroke="#529929" stroke-width="4.45" stroke-linecap="round"/>
  <polygon points="90,130 83,142 97,142" fill="#529929" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
