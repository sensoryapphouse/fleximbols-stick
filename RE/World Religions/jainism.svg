  <!-- lotus base -->
  <ellipse cx="145" cy="210" rx="80" ry="12" fill="#f266aa" stroke="#1a1a1a" stroke-width="4.45"/>
  <path d="M75 210 Q90 180 110 195 Q120 178 145 192 Q170 178 180 195 Q200 180 215 210 Z" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <path d="M110 200 Q125 175 145 188 Q165 175 180 200" fill="#f266aa" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- tirthankara seated silhouette (full figure, meditation) -->
  <ellipse cx="145" cy="60" rx="20" ry="22" fill="#e6b98a" stroke="#1a1a1a" stroke-width="6.67"/>
  <path d="M139 56 Q145 60 151 56" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <circle cx="138" cy="58" r="1.5" fill="#000000"/>
  <circle cx="152" cy="58" r="1.5" fill="#000000"/>
  <!-- torso -->
  <path d="M125 82 Q120 130 115 160 L175 160 Q170 130 165 82 Z" fill="#f7de58" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- arms in meditation, hands resting on lap -->
  <path d="M125 95 Q105 120 120 150 L145 145 Q170 150 170 150 Q185 120 165 95" fill="#e6b98a" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- crossed legs -->
  <path d="M110 160 Q105 175 130 178 L160 178 Q185 175 180 160" fill="#e6b98a" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>

  <!-- raised open hand with wheel (ahimsa) -->
  <g transform="translate(220,90)">
    <!-- hand palm -->
    <rect x="-16" y="-2" width="32" height="38" rx="6" fill="#e6b98a" stroke="#1a1a1a" stroke-width="6.67"/>
    <rect x="-14" y="-22" width="6" height="24" rx="2" fill="#e6b98a" stroke="#1a1a1a" stroke-width="4.45"/>
    <rect x="-6" y="-26" width="6" height="28" rx="2" fill="#e6b98a" stroke="#1a1a1a" stroke-width="4.45"/>
    <rect x="2" y="-24" width="6" height="26" rx="2" fill="#e6b98a" stroke="#1a1a1a" stroke-width="4.45"/>
    <rect x="10" y="-20" width="6" height="22" rx="2" fill="#e6b98a" stroke="#1a1a1a" stroke-width="4.45"/>
    <!-- thumb -->
    <path d="M-16 8 Q-26 14 -22 26 L-14 22 Z" fill="#e6b98a" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
    <!-- wheel on palm -->
    <circle cx="0" cy="16" r="9" fill="#fff200" stroke="#1a1a1a" stroke-width="4.45"/>
    <circle cx="0" cy="16" r="2" fill="#000000"/>
    <line x1="0" y1="8" x2="0" y2="24" stroke="#1a1a1a" stroke-width="3.33"/>
    <line x1="-8" y1="16" x2="8" y2="16" stroke="#1a1a1a" stroke-width="3.33"/>
    <line x1="-6" y1="10" x2="6" y2="22" stroke="#1a1a1a" stroke-width="3.33"/>
    <line x1="6" y1="10" x2="-6" y2="22" stroke="#1a1a1a" stroke-width="3.33"/>
  </g>

  <!-- small lotus accent left -->
  <g transform="translate(55,90)">
    <path d="M-12 8 Q-8 -10 0 -12 Q8 -10 12 8 Z" fill="#f266aa" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="3" fill="#fff200" stroke="#1a1a1a" stroke-width="3.33"/>
  </g>
