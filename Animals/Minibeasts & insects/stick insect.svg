  <path d="M141 100 Q114 98 88 106 Q72 112 58 122" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Mid right leg -->
  <path d="M155 100 Q182 98 208 106 Q224 112 238 122" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Rear left leg -->
  <path d="M141 106 Q116 112 92 124 Q76 132 64 148" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Rear right leg -->
  <path d="M155 106 Q180 112 204 124 Q220 132 232 148" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
