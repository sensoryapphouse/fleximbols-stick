  <!-- mid layer (rock) -->
  <rect x="20" y="155" width="250" height="35" rx="0" ry="0" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- upper layer (soil) -->
  <rect x="20" y="125" width="250" height="35" rx="0" ry="0" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- surface ground -->
  <rect x="20" y="105" width="250" height="25" rx="0" ry="0" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- grass top -->
  <rect x="20" y="95" width="250" height="15" rx="4" ry="4" fill="#529929" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- geothermal pipe (down into ground) -->
  <rect x="130" y="90" width="22" height="130" rx="4" ry="4" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- pipe cap at bottom (heat exchanger) -->
  <ellipse cx="141" cy="210" rx="20" ry="8" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="3.55" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- plant building on surface -->
  <rect x="95" y="55" width="100" height="45" rx="5" ry="5" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- plant roof -->
  <polygon points="90,58 195,58 185,40 100,40" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
