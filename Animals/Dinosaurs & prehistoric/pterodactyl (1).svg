  <!-- Right wing membrane -->
  <path d="M 168 120 Q 225 95 276 68 Q 258 112 235 148 Q 204 152 168 148 Z" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Body -->
  <ellipse cx="145" cy="140" rx="32" ry="24" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Head + beak (pointing right) -->
  <path d="M 170 128 Q 198 118 224 125 Q 245 122 254 132 Q 244 144 223 142 Q 197 142 170 136 Z" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
