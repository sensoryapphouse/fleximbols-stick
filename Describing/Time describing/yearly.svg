<line x1="170" y1="100" x2="170" y2="134" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
<line x1="318" y1="100" x2="318" y2="134" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
<!-- 12 month squares (3 cols x 4 rows) -->
