<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Wall calendar: flat rectangle, photo top half, month grid bottom half, hanging hole at top -->
  <!-- Calendar backing -->
  <rect x="40" y="30" width="210" height="200" rx="8" ry="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="11.11" stroke-linejoin="round"/>
  <!-- Hanging hole at top centre -->
  <rect x="126" y="20" width="38" height="20" rx="6" ry="6" fill="#efefef" stroke="#1a1a1a" stroke-width="8.89"/>
  <circle cx="145" cy="28" r="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="6.67"/>
  <!-- Photo section top half - landscape scene (sky + hill) -->
  <rect x="40" y="30" width="210" height="96" rx="8" ry="8" fill="#dff3fd" stroke="#1a1a1a" stroke-width="8.89" stroke-linejoin="round"/>
  <!-- Sky gradient suggestion - flat colour clouds -->
  <ellipse cx="90" cy="55" rx="28" ry="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="115" cy="50" rx="22" ry="13" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Sun -->
  <circle cx="220" cy="54" r="18" fill="#f7de58" stroke="#1a1a1a" stroke-width="6.67"/>
  <!-- Rolling hills -->
  <ellipse cx="80" cy="126" rx="80" ry="38" fill="#529929" stroke="#1a1a1a" stroke-width="6.67"/>
  <ellipse cx="200" cy="130" rx="72" ry="34" fill="#67832d" stroke="#1a1a1a" stroke-width="6.67"/>
  <!-- Divider between photo and grid -->
  <line x1="40" y1="126" x2="250" y2="126" stroke="#1a1a1a" stroke-width="8.89"/>
  <!-- Month header strip -->
  <rect x="40" y="126" width="210" height="24" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- Month header bar representing text -->
  <rect x="100" y="132" width="90" height="10" rx="3" ry="3" fill="#ffffff"/>
  <!-- Day-of-week header row -->
  <rect x="40" y="150" width="210" height="16" fill="#90a7d6" stroke="none"/>
  <!-- Grid lines vertical -->
  <line x1="70" y1="150" x2="70" y2="230" stroke="#b8b8b8" stroke-width="3.33"/>
  <line x1="100" y1="150" x2="100" y2="230" stroke="#b8b8b8" stroke-width="3.33"/>
  <line x1="130" y1="150" x2="130" y2="230" stroke="#b8b8b8" stroke-width="3.33"/>
  <line x1="160" y1="150" x2="160" y2="230" stroke="#b8b8b8" stroke-width="3.33"/>
  <line x1="190" y1="150" x2="190" y2="230" stroke="#b8b8b8" stroke-width="3.33"/>
  <line x1="220" y1="150" x2="220" y2="230" stroke="#b8b8b8" stroke-width="3.33"/>
  <!-- Grid lines horizontal -->
  <line x1="40" y1="166" x2="250" y2="166" stroke="#b8b8b8" stroke-width="3.33"/>
  <line x1="40" y1="182" x2="250" y2="182" stroke="#b8b8b8" stroke-width="3.33"/>
  <line x1="40" y1="198" x2="250" y2="198" stroke="#b8b8b8" stroke-width="3.33"/>
  <line x1="40" y1="214" x2="250" y2="214" stroke="#b8b8b8" stroke-width="3.33"/>
  <!-- Highlighted today cell -->
  <rect x="130" y="182" width="30" height="16" rx="2" ry="2" fill="#f8130d"/>
  <!-- Outer border redraw on top -->
  <rect x="40" y="30" width="210" height="200" rx="8" ry="8" fill="none" stroke="#1a1a1a" stroke-width="11.11" stroke-linejoin="round"/>
</g></svg>