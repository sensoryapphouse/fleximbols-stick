  <!-- Rim top ellipse -->
  <ellipse cx="145" cy="68" rx="77" ry="18" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Interior at rim -->
  <ellipse cx="145" cy="68" rx="67" ry="13" fill="#dff3fd" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Lid dome -->
  <path d="M70,68 Q70,38 145,32 Q220,38 220,68" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Lid highlight -->
  <path d="M95,55 Q112,36 145,33" fill="none" stroke="#ffffff" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Lid rim -->
  <ellipse cx="145" cy="68" rx="75" ry="11" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Lid knob -->
  <rect x="137" y="22" width="16" height="12" rx="4" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <ellipse cx="145" cy="22" rx="8" ry="5" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Left side handle loop -->
  <path d="M68,105 Q38,105 38,120 Q38,138 68,138" fill="none" stroke="#1a1a1a" stroke-width="7.77" stroke-linecap="round"/>
  <!-- Right side handle loop -->
  <path d="M222,105 Q252,105 252,120 Q252,138 222,138" fill="none" stroke="#1a1a1a" stroke-width="7.77" stroke-linecap="round"/>
  <!-- Base -->
