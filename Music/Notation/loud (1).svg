  <!-- Speaker cone (trapezoid pointing right) -->
  <path d="M90 95 L90 145 L145 175 L145 65 Z" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Speaker grille circles -->
