  <!-- hand-cream: squeeze tube (taller than wide) with screw cap, small hand on front -->
  <!-- Tube body -->
  <rect x="103" y="55" width="84" height="130" rx="14" ry="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="6.34" stroke-linejoin="round"/>
  <!-- Tube bottom crimp (folded flat end) -->
  <rect x="107" y="170" width="76" height="20" rx="4" ry="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.08"/>
  <line x1="110" y1="180" x2="180" y2="180" stroke="#7f7f7f" stroke-width="3.81"/>
  <line x1="115" y1="174" x2="175" y2="174" stroke="#7f7f7f" stroke-width="2.54"/>
  <!-- Tube shoulder taper -->
  <path d="M103,55 Q103,35 117,28 L173,28 Q187,35 187,55 Z" fill="#efefef" stroke="#1a1a1a" stroke-width="6.34" stroke-linejoin="round"/>
  <!-- Screw cap/nozzle -->
  <rect x="122" y="8" width="46" height="24" rx="8" ry="8" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="6.34"/>
  <!-- Cap screw lines -->
  <line x1="122" y1="16" x2="168" y2="16" stroke="#1a1a1a" stroke-width="3.18"/>
  <line x1="122" y1="23" x2="168" y2="23" stroke="#1a1a1a" stroke-width="3.18"/>
  <!-- Small hand silhouette on tube front -->
  <!-- Palm -->
  <ellipse cx="145" cy="125" rx="18" ry="16" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Thumb -->
  <ellipse cx="126" cy="118" rx="7" ry="10" transform="rotate(-25,126,118)" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Index finger -->
  <rect x="136" y="95" width="9" height="28" rx="4" ry="4" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Middle finger -->
  <rect x="147" y="90" width="9" height="32" rx="4" ry="4" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Ring finger -->
  <rect x="158" y="95" width="8" height="28" rx="4" ry="4" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Pinky -->
  <rect x="166" y="101" width="7" height="22" rx="3" ry="3" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45"/>
