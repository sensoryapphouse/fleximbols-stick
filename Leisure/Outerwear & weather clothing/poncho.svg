<line x1="214" y1="392" x2="214" y2="412"/>
<line x1="238" y1="386" x2="238" y2="406"/>
<line x1="274" y1="386" x2="274" y2="406"/>
<line x1="298" y1="392" x2="298" y2="412"/>
