  <!-- Decorative border outer -->
  <rect x="63" y="38" width="154" height="164" fill="none" stroke="#7c3fac" stroke-width="6.67"/>
  <!-- Decorative border inner -->
  <rect x="70" y="45" width="140" height="150" fill="none" stroke="#f266aa" stroke-width="4.45"/>
