<line x1="341" y1="222" x2="294" y2="232" stroke="#9aa3ad" stroke-width="4" stroke-linecap="round"/>
<!-- tummy -->
<circle cx="170" cy="270" r="9" fill="#e8a33d" stroke="#1a1a1a" stroke-width="0"/>
<line x1="179" y1="271" x2="220" y2="276" stroke="#9aa3ad" stroke-width="4" stroke-linecap="round"/>
<!-- private region -->
<circle cx="352" cy="312" r="9" fill="#7a5fb0" stroke="#1a1a1a" stroke-width="0"/>
<line x1="343" y1="312" x2="284" y2="306" stroke="#9aa3ad" stroke-width="4" stroke-linecap="round"/>
