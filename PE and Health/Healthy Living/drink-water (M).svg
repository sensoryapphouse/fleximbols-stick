<ellipse cx="266" cy="252" rx="15" ry="12" fill="#7a3b2e" stroke="#1a1a1a" stroke-width="5"/>
<!-- raising arm: shoulder -> elbow -> hand at the glass -->
<path d="M 292 392 L 332 372 L 356 348" fill="none" stroke="#1a1a1a" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 292 392 L 332 372 L 356 348" fill="none" stroke="#f5d6b0" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
