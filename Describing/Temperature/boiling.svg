<svg xmlns="http://www.w3.org/2000/svg" viewBox="48.29 15.86 475.15 475.15">
<!-- BOILING: pot of bubbling water + rising steam + hot red thermometer -->
<!-- steam plumes rising from pot -->
<g fill="none" stroke="#9aa7b3" stroke-width="9" stroke-linecap="round">
<path d="M 196 150 q -20 -22 0 -44 q 20 -22 0 -44"/>
<path d="M 246 138 q -20 -22 0 -44 q 20 -22 0 -44"/>
<path d="M 296 150 q -20 -22 0 -44 q 20 -22 0 -44"/>
</g>
<!-- pot body -->
<path d="M 150 250 L 350 250 L 342 372 Q 342 392 312 392 L 188 392 Q 158 392 158 372 Z" fill="#c7ced6" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- handles -->
<path d="M 150 268 q -38 4 -38 34 q 0 28 38 28" fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<path d="M 350 268 q 38 4 38 34 q 0 28 -38 28" fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- water surface -->
<path d="M 158 250 L 342 250 L 340 282 Q 256 304 160 282 Z" fill="#5fb4e0" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- bubbles -->
<circle cx="206" cy="266" r="13" fill="#cdeafb" stroke="#1a1a1a" stroke-width="6"/>
<circle cx="256" cy="272" r="17" fill="#cdeafb" stroke="#1a1a1a" stroke-width="6"/>
<circle cx="302" cy="266" r="12" fill="#cdeafb" stroke="#1a1a1a" stroke-width="6"/>
<!-- pot rim -->
<line x1="150" y1="250" x2="350" y2="250" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
<!-- hot thermometer (red, high) at right -->
<rect x="418" y="246" width="30" height="180" rx="15" fill="#ffffff" stroke="#1a1a1a" stroke-width="9"/>
<circle cx="433" cy="430" r="28" fill="#e0473c" stroke="#1a1a1a" stroke-width="9"/>
<rect x="424" y="262" width="18" height="172" rx="9" fill="#e0473c" stroke="#1a1a1a" stroke-width="0"/>
</svg>
