<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Board background -->
  <rect x="26" y="32" width="238" height="176" rx="8" ry="8" fill="#dff3fd" stroke="#1a1a1a" stroke-width="8.89" stroke-linejoin="round"/>

  <!-- ATOM diagram (left portion) -->
  <!-- Nucleus -->
  <circle cx="95" cy="118" r="18" fill="#f8130d" stroke="#1a1a1a" stroke-width="7.11"/>
  <!-- Neutrons/protons in nucleus -->
  <circle cx="90" cy="114" r="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.56"/>
  <circle cx="100" cy="122" r="6" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="3.56"/>
  <circle cx="88" cy="124" r="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.56"/>
  <circle cx="102" cy="113" r="5" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="3.56"/>

  <!-- Electron orbit 1 (horizontal ellipse) -->
  <ellipse cx="95" cy="118" rx="55" ry="22" fill="none" stroke="#4d4d4d" stroke-width="4.45" stroke-dasharray="5,3"/>
  <!-- Electron 1 -->
  <circle cx="148" cy="118" r="6" fill="#fff200" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Electron orbit 2 (tilted ellipse ~60deg) -->
  <ellipse cx="95" cy="118" rx="55" ry="22" fill="none" stroke="#4d4d4d" stroke-width="4.45" stroke-dasharray="5,3" transform="rotate(60 95 118)"/>
  <!-- Electron 2 -->
  <circle cx="71" cy="165" r="6" fill="#fff200" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Electron orbit 3 (tilted ellipse ~-60deg) -->
  <ellipse cx="95" cy="118" rx="55" ry="22" fill="none" stroke="#4d4d4d" stroke-width="4.45" stroke-dasharray="5,3" transform="rotate(-60 95 118)"/>
  <!-- Electron 3 -->
  <circle cx="70" cy="72" r="6" fill="#fff200" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- FORCE ARROW (F = ma concept) — right portion -->
  <!-- Object block -->
  <rect x="185" y="135" width="45" height="35" rx="4" fill="#eed5b6" stroke="#1a1a1a" stroke-width="7.11"/>
  <!-- Mass symbol: "m" drawn as two humps -->
  <path d="M193,155 L193,145 Q197,140 201,145 Q205,140 209,145 L209,155" fill="none" stroke="#1a1a1a" stroke-width="5.33" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Force arrow pointing right -->
  <line x1="230" y1="152" x2="268" y2="152" stroke="#f8130d" stroke-width="10.67" stroke-linecap="round"/>
  <polygon points="272,152 260,145 260,159" fill="#f8130d" stroke="#1a1a1a" stroke-width="3.56"/>
  <!-- "F" label indicator: rectangle representing force label -->
  <rect x="247" y="132" width="16" height="12" rx="2" fill="#f8130d" stroke="#1a1a1a" stroke-width="3.56"/>

  <!-- Acceleration dots (small dots showing motion) -->
  <circle cx="240" cy="172" r="4" fill="#2a4ec0"/>
  <circle cx="252" cy="172" r="5" fill="#2a4ec0"/>
  <circle cx="265" cy="172" r="6" fill="#2a4ec0"/>

  <!-- Speed/motion lines behind the object -->
  <line x1="160" y1="145" x2="182" y2="145" stroke="#7f7f7f" stroke-width="4.45" stroke-linecap="round" stroke-dasharray="6,4"/>
  <line x1="165" y1="152" x2="182" y2="152" stroke="#7f7f7f" stroke-width="4.45" stroke-linecap="round" stroke-dasharray="6,4"/>
  <line x1="160" y1="160" x2="182" y2="160" stroke="#7f7f7f" stroke-width="4.45" stroke-linecap="round" stroke-dasharray="6,4"/>

  <!-- Wave symbol (represents wave-particle duality / energy) -->
  <path d="M170,50 Q178,38 186,50 Q194,62 202,50 Q210,38 218,50 Q226,62 234,50"
        fill="none" stroke="#529929" stroke-width="6.22" stroke-linecap="round"/>
  <!-- Wave label: small lightning bolt shape -->
  <polyline points="242,38 237,52 244,52 239,66" fill="none" stroke="#f2e40d" stroke-width="7.11" stroke-linecap="round" stroke-linejoin="round"/>
</g></svg>