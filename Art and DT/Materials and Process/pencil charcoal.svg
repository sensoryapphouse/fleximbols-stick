  <!-- thick black charcoal stick, smudgy texture, artistic mark below -->
  <!-- smudgy mark on paper, drawn first so stick sits on top -->
  <path d="M 50 180 Q 110 150 180 175 Q 230 190 250 175" fill="none" stroke="#4d4d4d" stroke-width="14.81" stroke-linecap="round"/>
  <path d="M 60 195 Q 130 175 210 200" fill="none" stroke="#7f7f7f" stroke-width="8.88" stroke-linecap="round"/>
  <!-- charcoal stick, thick, blunt, diagonal -->
  <g transform="rotate(-18 145 105)">
    <!-- main black body -->
    <rect x="55" y="85" width="180" height="40" rx="6" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
    <!-- chunky tip end, slightly broken -->
    <polygon points="55,85 40,105 55,125" fill="#000000" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
    <!-- texture cracks along shaft -->
    <line x1="80" y1="90" x2="85" y2="120" stroke="#7f7f7f" stroke-width="2.96" stroke-linecap="round"/>
    <line x1="120" y1="92" x2="125" y2="118" stroke="#7f7f7f" stroke-width="2.96" stroke-linecap="round"/>
    <line x1="160" y1="90" x2="166" y2="120" stroke="#7f7f7f" stroke-width="2.96" stroke-linecap="round"/>
    <line x1="200" y1="92" x2="206" y2="118" stroke="#7f7f7f" stroke-width="2.96" stroke-linecap="round"/>
    <!-- paper wrap band near right end -->
    <rect x="200" y="83" width="20" height="44" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  </g>
</g></svg>