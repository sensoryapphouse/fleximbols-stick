  <circle cx="255" cy="205" r="22" fill="#efefef" stroke="#1a1a1a" stroke-width="6.67"/>
  <!-- N -->
  <polygon points="255,185 250,200 260,200" fill="#f8130d"/>
  <!-- S -->
  <polygon points="255,225 250,210 260,210" fill="#4d4d4d"/>
  <!-- E -->
