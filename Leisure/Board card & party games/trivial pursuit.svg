<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Trivial Pursuit: round playing token with 6 coloured pie wedges -->
  <circle cx="145" cy="120" r="92" fill="#efefef" stroke="#1a1a1a" stroke-width="5.93"/>
  <!-- 6 pie wedges around centre, each a different colour -->
  <!-- wedge 1 (top): blue -->
  <path d="M 145 120 L 145 28 A 92 92 0 0 1 224.7 74 Z" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- wedge 2 (upper right): pink -->
  <path d="M 145 120 L 224.7 74 A 92 92 0 0 1 224.7 166 Z" fill="#f266aa" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- wedge 3 (lower right): yellow -->
  <path d="M 145 120 L 224.7 166 A 92 92 0 0 1 145 212 Z" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- wedge 4 (lower left): purple -->
  <path d="M 145 120 L 145 212 A 92 92 0 0 1 65.3 166 Z" fill="#7c3fac" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- wedge 5 (left): orange -->
  <path d="M 145 120 L 65.3 166 A 92 92 0 0 1 65.3 74 Z" fill="#ff9900" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- wedge 6 (upper left): green -->
  <path d="M 145 120 L 65.3 74 A 92 92 0 0 1 145 28 Z" fill="#137827" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- centre hub -->
  <circle cx="145" cy="120" r="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="145" cy="120" r="8" fill="#000000" stroke="#1a1a1a" stroke-width="2.96"/>
</g></svg>