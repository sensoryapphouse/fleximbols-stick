<!-- ===== operating table + patient (surgery cue, right side) ===== -->
<!-- table legs -->
<line x1="330" y1="400" x2="330" y2="452" stroke="#5a6172" stroke-width="12" stroke-linecap="round"/>
<line x1="466" y1="400" x2="466" y2="452" stroke="#5a6172" stroke-width="12" stroke-linecap="round"/>
<!-- table top -->
<rect x="312" y="372" width="172" height="28" rx="8" fill="#9aa3b4" stroke="#1a1a1a" stroke-width="5"/>
