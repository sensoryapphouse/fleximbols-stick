  <!-- Dial markings -->
  <line x1="125" y1="80" x2="125" y2="90" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="135" y1="76" x2="135" y2="94" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="145" y1="75" x2="145" y2="95" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="155" y1="76" x2="155" y2="94" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="165" y1="80" x2="165" y2="90" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Selected character indicator -->
  <rect x="140" y="70" width="10" height="14" rx="2" ry="2" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45"/>

