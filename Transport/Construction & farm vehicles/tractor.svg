<!-- body chassis (connects hood, cab and both axles) -->
<rect x="120" y="300" width="230" height="26" fill="#2e7d40" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- exhaust -->
<rect x="200" y="150" width="18" height="60" rx="6" fill="#9aa0a6" stroke="#1a1a1a" stroke-width="8"/>
<!-- engine hood (front) -->
<path d="M 122 305 L 122 250 Q 122 233 140 233 L 210 233 L 210 305 Z" fill="#5aa83c" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- grille lines -->
<line x1="132" y1="252" x2="132" y2="292" stroke="#1a1a1a" stroke-width="5"/>
<line x1="146" y1="252" x2="146" y2="292" stroke="#1a1a1a" stroke-width="5"/>
<!-- cab -->
<path d="M 210 305 L 210 196 L 278 196 L 312 250 L 312 305 Z" fill="#8cc152" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- cab window -->
<path d="M 224 248 L 224 210 L 270 210 L 296 248 Z" fill="#cfd6dc" stroke="#1a1a1a" stroke-width="6" stroke-linejoin="round"/>
<!-- small front wheel -->
<circle cx="158" cy="352" r="34" fill="#1a1a1a"/>
<circle cx="158" cy="352" r="14" fill="#f4c430" stroke="#1a1a1a" stroke-width="6"/>
<!-- big rear wheel -->
<circle cx="300" cy="330" r="68" fill="#1a1a1a"/>
<circle cx="300" cy="330" r="30" fill="#f4c430" stroke="#1a1a1a" stroke-width="7"/>
<circle cx="300" cy="330" r="9" fill="#1a1a1a"/>
<!-- hub spokes (inside tyre) -->
<line x1="300" y1="300" x2="300" y2="271" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
<line x1="300" y1="360" x2="300" y2="389" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
<line x1="270" y1="330" x2="241" y2="330" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
<line x1="330" y1="330" x2="359" y2="330" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
</svg>
