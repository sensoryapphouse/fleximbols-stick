  <!-- large Z + moon (replaces HIBERNATE text) -->
  <path d="M40 185 L40 210 L60 185 L60 210" fill="none" stroke="#2a4ec0" stroke-width="11.85" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- moon -->
  <path d="M80 195 Q72 195 72 205 Q72 215 80 215 Q74 215 74 205 Q74 195 80 195 Z" fill="#f2e40d" stroke="#1a1a1a" stroke-width="3.70" stroke-linejoin="round"/>
