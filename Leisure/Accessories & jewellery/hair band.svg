<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Rigid plastic semicircular hairband - arc shape with teeth on inside -->
  <!-- Outer arc of the band -->
  <path d="M 55,190 Q 55,60 145,50 Q 235,60 235,190" fill="none" stroke="#f266aa" stroke-width="26.65" stroke-linecap="round"/>
  <!-- Inner arc outline (to close band shape) -->
  <path d="M 55,190 Q 55,60 145,50 Q 235,60 235,190" fill="none" stroke="#1a1a1a" stroke-width="7.40" stroke-linecap="round"/>
  <!-- Simulate band thickness with offset inner arc -->
  <path d="M 68,190 Q 68,75 145,65 Q 222,75 222,190" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-dasharray="1,0"/>
  <!-- Teeth on inner edge - small vertical lines along the inside -->
  <line x1="80" y1="175" x2="74" y2="166" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="95" y1="152" x2="88" y2="144" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="112" y1="134" x2="105" y2="126" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="131" y1="120" x2="124" y2="112" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="145" y1="115" x2="145" y2="106" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="159" y1="120" x2="166" y2="112" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="178" y1="134" x2="185" y2="126" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="195" y1="152" x2="202" y2="144" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="210" y1="175" x2="216" y2="166" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Small end nubs at the base of the band -->
  <circle cx="55" cy="190" r="7" fill="#f266aa" stroke="#1a1a1a" stroke-width="5.93"/>
  <circle cx="235" cy="190" r="7" fill="#f266aa" stroke="#1a1a1a" stroke-width="5.93"/>
</g></svg>