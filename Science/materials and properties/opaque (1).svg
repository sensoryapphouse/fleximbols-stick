<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Shape being hidden (circle) — only the left and right edges peek out from behind the panel -->
  <!-- Left arc peek — partial circle edge visible left of panel -->
  <path d="M62,80 A80,80 0 0,0 62,164" fill="none" stroke="#f8130d" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Right arc peek — partial circle edge visible right of panel -->
  <path d="M228,80 A80,80 0 0,1 228,164" fill="none" stroke="#f8130d" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Top arc peek — small arc of circle peeking above panel -->
  <path d="M100,56 A80,80 0 0,1 190,56" fill="none" stroke="#f8130d" stroke-width="4.45" stroke-linecap="round"/>
  <!-- The hidden shape's fill peek (very narrow crescent on left) -->
  <path d="M62,80 A80,80 0 0,0 62,164 L72,164 A70,70 0 0,1 72,80 Z" fill="#f8130d" stroke="none"/>
  <!-- Solid opaque panel — covers the centre, complete block -->
  <rect x="78" y="50" width="134" height="144" rx="10" ry="10" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="3.70" stroke-linejoin="round"/>
  <!-- Panel surface detail — slight bevel edge highlight -->
  <rect x="84" y="56" width="134" height="144" rx="10" ry="10" fill="none" stroke="#7f7f7f" stroke-width="1.48"/>
</g></svg>