  <!-- Beam cone -->
  <path d="M 90,80 L 30,40 L 30,200 L 90,160 Z" fill="#fff200" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Beam inner highlight -->
  <path d="M 90,95 L 50,70 L 50,170 L 90,145 Z" fill="#f2e40d" stroke="none"/>
  <!-- Flashlight head (wider end with lens) -->
  <path d="M 90,70 L 130,70 L 130,170 L 90,170 Z" fill="#d01424" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Lens / bulb at front -->
  <ellipse cx="90" cy="120" rx="10" ry="40" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="90" cy="120" rx="4" ry="20" fill="#ffffff" stroke="none"/>
  <!-- Cylindrical body -->
  <rect x="130" y="90" width="120" height="60" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Grip ridges -->
  <path d="M 150,90 L 150,150 M 165,90 L 165,150 M 180,90 L 180,150 M 195,90 L 195,150 M 210,90 L 210,150 M 225,90 L 225,150" fill="none" stroke="#1a1a1a" stroke-width="2.22" stroke-linecap="round"/>
  <!-- Power switch on top -->
  <rect x="195" y="78" width="22" height="14" rx="3" fill="#f8130d" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <!-- Tail cap -->
  <rect x="250" y="100" width="14" height="40" rx="3" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
</g></svg>