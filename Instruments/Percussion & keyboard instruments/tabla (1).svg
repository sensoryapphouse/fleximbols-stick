  <line x1="220" y1="150" x2="218" y2="222" stroke="#5e1f0a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="232" y1="152" x2="226" y2="221" stroke="#5e1f0a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Tuning ring blocks on small drum -->
  <rect x="168" y="164" width="10" height="8" rx="2" fill="#7d5e23" stroke="#1a1a1a" stroke-width="3.33"/>
  <rect x="226" y="164" width="10" height="8" rx="2" fill="#7d5e23" stroke="#1a1a1a" stroke-width="3.33"/>
