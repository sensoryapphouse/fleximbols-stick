  <rect x="35" y="74" width="220" height="70" rx="35" fill="#392170" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lid sheen -->
  <rect x="52" y="82" width="185" height="22" rx="26" fill="#7c3fac" stroke="none"/>
  <!-- Seam -->
  <line x1="35" y1="142" x2="255" y2="142" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
