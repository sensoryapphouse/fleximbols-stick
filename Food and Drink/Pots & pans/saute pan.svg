  <!-- Body fill (straight-sided) -->
  <rect x="62" y="100" width="160" height="75" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Bottom base ellipse -->
  <ellipse cx="142" cy="175" rx="80" ry="12" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Interior base -->
  <ellipse cx="142" cy="100" rx="75" ry="14" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="2.66"/>
  <!-- Lid sitting on top rim of straight sides -->
