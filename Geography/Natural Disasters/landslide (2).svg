  <!-- Soil chunks sliding -->
  <ellipse cx="100" cy="165" rx="22" ry="14" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="155" cy="180" rx="18" ry="11" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.45"/>
  <ellipse cx="190" cy="155" rx="14" ry="9" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Small rock on slope -->
  <polygon points="70,148 82,135 94,150 80,160" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <polygon points="195,140 208,130 216,145 202,152" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Tree 1 toppling left -->
  <line x1="130" y1="100" x2="95" y2="145" stroke="#5e1f0a" stroke-width="7.77" stroke-linecap="round"/>
  <circle cx="86" cy="158" r="0" fill="none"/>
  <ellipse cx="125" cy="90" rx="16" ry="20" fill="#529929" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Tree 2 toppling right -->
  <line x1="210" y1="90" x2="240" y2="130" stroke="#5e1f0a" stroke-width="7.77" stroke-linecap="round"/>
  <ellipse cx="205" cy="80" rx="15" ry="19" fill="#529929" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Motion lines indicating slide direction -->
  <line x1="50" y1="175" x2="25" y2="200" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="80" y1="190" x2="58" y2="212" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="115" y1="195" x2="98" y2="215" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Ground baseline -->
