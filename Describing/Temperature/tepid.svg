<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Plain water glass - tall straight-sided glass (not mug) -->
  <!-- Glass body trapezoid shape -->
  <polygon points="85,60 205,60 195,220 95,220" fill="#dff3fd" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Glass rim top -->
  <rect x="82" y="54" width="126" height="12" rx="4" fill="#efefef" stroke="#1a1a1a" stroke-width="5.93"/>
  <!-- Water fill level (mid-height) -->
  <polygon points="91,140 199,140 195,220 95,220" fill="#90a7d6" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Glass shine/highlights -->
  <line x1="96" y1="75" x2="98" y2="130" stroke="#ffffff" stroke-width="7.40" stroke-linecap="round"/>
  <line x1="104" y1="72" x2="106" y2="120" stroke="#ffffff" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Thermometer beside glass -->
  <!-- Thermometer tube -->
  <rect x="220" y="40" width="18" height="140" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.93"/>
  <!-- Thermometer bulb -->
  <circle cx="229" cy="190" r="16" fill="#f8130d" stroke="#1a1a1a" stroke-width="5.93"/>
  <!-- Mercury column - mid level (tepid = mid) -->
  <rect x="225" y="110" width="8" height="80" rx="4" fill="#f8130d" stroke="none"/>
  <!-- Thermometer scale marks -->
  <line x1="238" y1="80" x2="244" y2="80" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="238" y1="100" x2="244" y2="100" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="238" y1="120" x2="246" y2="120" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="238" y1="140" x2="244" y2="140" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="238" y1="160" x2="244" y2="160" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- "So-so" neutral marker - a horizontal dash/equals near mid -->
  <!-- Neutral indicator panel -->
  <rect x="28" y="85" width="50" height="32" rx="6" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Two equal horizontal lines (= sign) -->
  <line x1="36" y1="96" x2="70" y2="96" stroke="#7f7f7f" stroke-width="5.93" stroke-linecap="round"/>
  <line x1="36" y1="108" x2="70" y2="108" stroke="#7f7f7f" stroke-width="5.93" stroke-linecap="round"/>
  <!-- Tiny bubble in glass (barely warm) -->
  <circle cx="130" cy="170" r="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.96"/>
  <circle cx="155" cy="185" r="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.96"/>
  <circle cx="175" cy="168" r="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.96"/>
</g></svg>