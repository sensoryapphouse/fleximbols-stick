  <!-- Stopwatch outer ring -->
  <circle cx="145" cy="135" r="88" fill="#efefef" stroke="#1a1a1a" stroke-width="7.40"/>
  <circle cx="145" cy="135" r="75" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Stopwatch top button crown -->
  <rect x="132" y="40" width="26" height="14" rx="6" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.93"/>
  <!-- Crown loop -->
  <path d="M132,47 Q120,35 125,25 Q130,15 145,15 Q160,15 165,25 Q170,35 158,47" fill="none" stroke="#1a1a1a" stroke-width="5.93" stroke-linecap="round"/>
  <!-- Tick marks on face -->
  <line x1="145" y1="65" x2="145" y2="78" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="145" y1="192" x2="145" y2="205" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="60" y1="135" x2="73" y2="135" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="217" y1="135" x2="230" y2="135" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Center pivot -->
  <circle cx="145" cy="135" r="6" fill="#000000"/>
