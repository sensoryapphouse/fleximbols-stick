<svg xmlns="http://www.w3.org/2000/svg" viewBox="63.11 28.97 370.42 370.42">
<!-- complete circuit loop with closed switch and a LIT bulb -->
<!-- battery on left side -->
<rect x="120" y="232" width="44" height="48" rx="4" fill="#f4c430" stroke="#1a1a1a" stroke-width="8"/>
<line x1="142" y1="218" x2="142" y2="232" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
<!-- wires forming loop -->
<path d="M 142 232 L 142 140 L 372 140" fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
<path d="M 142 280 L 142 372 L 372 372" fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
<path d="M 372 372 L 372 140" fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
<!-- closed switch: lever down, contacts touching -->
<circle cx="372" cy="296" r="9" fill="#1a1a1a"/>
<circle cx="372" cy="232" r="9" fill="#1a1a1a"/>
<line x1="372" y1="296" x2="372" y2="232" stroke="#5aa83c" stroke-width="9" stroke-linecap="round"/>
<!-- lit bulb at top middle with glow rays -->
<circle cx="257" cy="140" r="40" fill="#f4c430" stroke="#1a1a1a" stroke-width="9"/>
<path d="M 240 174 L 274 174 L 270 194 L 244 194 Z" fill="#9aa0a6" stroke="#1a1a1a" stroke-width="7" stroke-linejoin="round"/>
<line x1="257" y1="78" x2="257" y2="56" stroke="#f4c430" stroke-width="8" stroke-linecap="round"/>
<line x1="305" y1="92" x2="320" y2="77" stroke="#f4c430" stroke-width="8" stroke-linecap="round"/>
<line x1="209" y1="92" x2="194" y2="77" stroke="#f4c430" stroke-width="8" stroke-linecap="round"/>
</svg>
