  <!-- lollipop-flat: flat round lollipop on stick + plain colour + wrapper -->
  <!-- Stick -->
  <rect x="141" y="135" width="8" height="95" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Wrapper twist - left -->
  <path d="M 95,90 Q 80,80 72,90 Q 78,100 88,100 Q 82,110 74,118 Q 88,120 100,108 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Wrapper twist - right -->
  <path d="M 195,90 Q 210,80 218,90 Q 212,100 202,100 Q 208,110 216,118 Q 202,120 190,108 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lollipop disc (flat, plain colour) -->
  <circle cx="145" cy="100" r="60" fill="#d01424" stroke="#1a1a1a" stroke-width="7.40"/>
  <!-- Subtle inner ring to suggest flat disc -->
  <circle cx="145" cy="100" r="48" fill="none" stroke="#f8130d" stroke-width="2.96"/>
  <!-- Highlight gloss -->
  <path d="M 115,75 Q 130,65 150,68" fill="none" stroke="#f4a4b2" stroke-width="5.93" stroke-linecap="round"/>
