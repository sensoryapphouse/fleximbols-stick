  <!-- Equator -->
  <ellipse cx="115" cy="125" rx="95" ry="6" fill="none" stroke="#ffffff" stroke-width="2.96"/>
  <!-- Zigzag 180 deg International Date Line through Pacific (centre) -->
  <path d="M 115 32 L 100 60 L 125 88 L 105 115 L 130 142 L 110 168 L 125 195 L 115 218" fill="none" stroke="#f8130d" stroke-width="8.88" stroke-linecap="round" stroke-linejoin="round"/>
