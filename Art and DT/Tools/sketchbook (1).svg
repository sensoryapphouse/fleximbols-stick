  <!-- sketchbook-modern: open spiral artbook with pencil sketch on page -->
  <!-- Book body left page -->
  <rect x="30" y="40" width="105" height="160" rx="4" ry="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
