<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- pregnant belly profile -->
  <path d="M 30 220 L 30 130 Q 30 80 90 70 Q 130 60 165 75 Q 220 95 220 160 Q 220 200 200 220 Z" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.33" stroke-linejoin="round"/>
  <!-- belly highlight -->
  <path d="M 60 100 Q 80 90 100 95" fill="none" stroke="#e6b98a" stroke-width="5.33" stroke-linecap="round"/>
  <!-- navel -->
  <circle cx="135" cy="155" r="5" fill="#9d7246" stroke="#1a1a1a" stroke-width="3.56"/>
  <!-- ultrasound probe (top left) -->
  <rect x="40" y="20" width="40" height="50" rx="6" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.33"/>
  <rect x="48" y="60" width="24" height="12" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- ultrasound cone (rays into belly) -->
  <path d="M 50 72 L 30 130 L 90 130 L 72 72 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <line x1="55" y1="90" x2="80" y2="90" stroke="#90a7d6" stroke-width="3.56"/>
  <line x1="50" y1="105" x2="85" y2="105" stroke="#90a7d6" stroke-width="3.56"/>
  <line x1="45" y1="120" x2="90" y2="120" stroke="#90a7d6" stroke-width="3.56"/>
  <!-- fetus silhouette in belly -->
  <path d="M 110 130 Q 100 110 115 100 Q 135 95 145 115 Q 160 110 170 125 Q 175 145 165 165 Q 150 180 130 175 Q 110 170 110 150 Z" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <circle cx="118" cy="115" r="2" fill="#000000"/>
  <!-- amniotic fluid pocket (indicated by lighter region around fetus) -->
  <path d="M 95 145 Q 100 175 130 185 Q 165 190 185 165" fill="none" stroke="#3aa6a0" stroke-width="3.56" stroke-linecap="round"/>
  <!-- needle entering belly from upper right -->
  <path d="M 270 30 L 175 140" stroke="#1a1a1a" stroke-width="8.89" stroke-linecap="round"/>
  <path d="M 270 30 L 175 140" stroke="#b8b8b8" stroke-width="4.45" stroke-linecap="round"/>
  <!-- syringe barrel -->
  <rect x="245" y="5" width="40" height="20" fill="#dff3fd" stroke="#1a1a1a" stroke-width="5.33" transform="rotate(-50 265 15)"/>
  <!-- plunger -->
  <rect x="280" y="0" width="14" height="22" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" transform="rotate(-50 287 11)"/>
  <!-- fluid sample droplet -->
  <circle cx="220" cy="80" r="6" fill="#3aa6a0" stroke="#1a1a1a" stroke-width="3.56"/>
  <!-- entry point marker on belly -->
  <circle cx="178" cy="140" r="5" fill="#d01424" stroke="#1a1a1a" stroke-width="3.56"/>
</g></svg>