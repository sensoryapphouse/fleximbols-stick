<!-- heart sticker -->
<path d="M 290 188 C 290 176 308 176 308 190 C 308 176 326 176 326 188 C 326 202 308 214 308 214 C 308 214 290 202 290 188 Z" fill="#d63b46" stroke="#1a1a1a" stroke-width="6" stroke-linejoin="round"/>
