  <!-- Dog face: brown/tan, flopped ears, smiling tongue -->
  <!-- Head -->
  <ellipse cx="145" cy="125" rx="80" ry="75" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.74" stroke-linejoin="round"/>
  <!-- Left ear flopped -->
  <ellipse cx="80" cy="105" rx="30" ry="45" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.74" transform="rotate(-20 80 105)"/>
  <!-- Right ear flopped -->
  <ellipse cx="210" cy="105" rx="30" ry="45" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.74" transform="rotate(20 210 105)"/>
  <!-- Head on top of ears -->
  <ellipse cx="145" cy="125" rx="80" ry="75" fill="#9d7246" stroke="#1a1a1a" stroke-width="4.74"/>
  <!-- Snout -->
  <ellipse cx="145" cy="155" rx="38" ry="28" fill="#eed5b6" stroke="#1a1a1a" stroke-width="3.56"/>
  <!-- Nose -->
  <ellipse cx="145" cy="142" rx="14" ry="9" fill="#000000"/>
  <!-- Eyes -->
  <circle cx="115" cy="110" r="10" fill="#000000"/>
  <circle cx="175" cy="110" r="10" fill="#000000"/>
  <circle cx="119" cy="107" r="3" fill="#ffffff"/>
  <circle cx="179" cy="107" r="3" fill="#ffffff"/>
  <!-- Smile -->
  <path d="M125 168 Q145 182 165 168" fill="none" stroke="#1a1a1a" stroke-width="4.15" stroke-linecap="round"/>
  <!-- Tongue -->
  <ellipse cx="145" cy="180" rx="14" ry="11" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="2.96"/>
  <line x1="145" y1="169" x2="145" y2="191" stroke="#d01424" stroke-width="2.37" stroke-linecap="round"/>
