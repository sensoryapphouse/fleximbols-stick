  <!-- Snowy ground -->
  <path d="M0 215 Q145 205 290 215 L290 235 L0 235 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- Treads / tracks (left and right) - rectangular treaded base -->
