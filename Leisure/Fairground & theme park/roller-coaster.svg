<svg xmlns="http://www.w3.org/2000/svg" viewBox="50.42 61.52 411.15 411.15">
<!-- ground -->
<line x1="80" y1="432" x2="432" y2="432" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
<!-- track support posts -->
<line x1="120" y1="220" x2="120" y2="432" stroke="#1a1a1a" stroke-width="7"/>
<line x1="190" y1="320" x2="190" y2="432" stroke="#1a1a1a" stroke-width="7"/>
<line x1="256" y1="150" x2="256" y2="432" stroke="#1a1a1a" stroke-width="7"/>
<line x1="330" y1="300" x2="330" y2="432" stroke="#1a1a1a" stroke-width="7"/>
<line x1="392" y1="220" x2="392" y2="432" stroke="#1a1a1a" stroke-width="7"/>
<!-- main coaster track (wavy hills) -->
<path d="M 96 360 Q 120 200 160 250 Q 200 300 230 180 Q 250 120 280 200 Q 310 290 340 250 Q 372 210 416 360" fill="none" stroke="#3a8fd6" stroke-width="13" stroke-linecap="round"/>
<path d="M 96 376 Q 120 216 160 266 Q 200 316 230 196 Q 250 136 280 216 Q 310 306 340 266 Q 372 226 416 376" fill="none" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
