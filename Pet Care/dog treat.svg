  <!-- classic bone shape: shaft + 4 knobs -->
  <!-- left knobs -->
  <circle cx="68" cy="110" r="28" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <circle cx="68" cy="140" r="28" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- right knobs -->
  <circle cx="222" cy="110" r="28" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <circle cx="222" cy="140" r="28" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- shaft (fills gap between knob pairs) -->
  <rect x="68" y="103" width="154" height="44" fill="#eed5b6"/>
  <!-- shaft outline strokes -->
  <line x1="75" y1="100" x2="215" y2="100" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="75" y1="150" x2="215" y2="150" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- texture dots on bone -->
  <circle cx="130" cy="120" r="5" fill="#9d7246"/>
  <circle cx="150" cy="132" r="5" fill="#9d7246"/>
  <circle cx="170" cy="120" r="5" fill="#9d7246"/>
