  <!-- Slim tube body (clear/pink) -->
  <rect x="110" y="100" width="38" height="120" rx="6" ry="6" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="6.34" stroke-linejoin="round"/>
  <!-- Clear gloss liquid in tube (lighter window) -->
  <rect x="115" y="108" width="28" height="80" rx="3" ry="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.18"/>
  <!-- Glossy sheen lines on liquid -->
  <line x1="120" y1="118" x2="120" y2="178" stroke="#f266aa" stroke-width="2.54" stroke-linecap="round"/>
  <line x1="130" y1="115" x2="130" y2="181" stroke="#f266aa" stroke-width="1.91" stroke-linecap="round"/>
  <!-- Cap/top of tube -->
  <rect x="108" y="85" width="42" height="18" rx="5" ry="5" fill="#f266aa" stroke="#1a1a1a" stroke-width="6.34" stroke-linejoin="round"/>
  <!-- Wand/handle extending up from cap -->
  <rect x="125" y="28" width="8" height="60" rx="2" ry="2" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.08"/>
  <!-- Doe-foot applicator (wide flat paddle shape) -->
  <ellipse cx="129" cy="22" rx="16" ry="9" fill="#f266aa" stroke="#1a1a1a" stroke-width="5.08"/>
  <!-- Gloss on doe-foot (shiny clear blob) -->
  <ellipse cx="129" cy="22" rx="11" ry="6" fill="#ffffff" stroke="none"/>
  <!-- Gloss drip/sticky strand -->
  <line x1="129" y1="31" x2="129" y2="42" stroke="#f4a4b2" stroke-width="3.81" stroke-linecap="round"/>
  <!-- Shine dot on doe-foot -->
  <ellipse cx="122" cy="19" rx="4" ry="3" fill="#ffffff" stroke="none"/>
</g></svg>