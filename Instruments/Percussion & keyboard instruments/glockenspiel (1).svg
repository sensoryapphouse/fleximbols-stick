<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- GLOCKENSPIEL: bright metal bars, NO resonator tubes, compact black-metal frame, crossed hard-headed mallets -->

  <!-- Stand legs -->
  <line x1="65" y1="192" x2="50" y2="228" stroke="#1a1a1a" stroke-width="6.34" stroke-linecap="round"/>
  <line x1="225" y1="192" x2="240" y2="228" stroke="#1a1a1a" stroke-width="6.34" stroke-linecap="round"/>
  <line x1="50" y1="228" x2="95" y2="228" stroke="#1a1a1a" stroke-width="6.34" stroke-linecap="round"/>
  <line x1="195" y1="228" x2="240" y2="228" stroke="#1a1a1a" stroke-width="6.34" stroke-linecap="round"/>

  <!-- Frame: two side uprights and two horizontal rails -->
  <rect x="58" y="108" width="9" height="84" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.08" stroke-linejoin="round"/>
  <rect x="223" y="108" width="9" height="84" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.08" stroke-linejoin="round"/>
  <rect x="55" y="108" width="180" height="9" rx="3" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.08" stroke-linejoin="round"/>
  <rect x="55" y="183" width="180" height="9" rx="3" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.08" stroke-linejoin="round"/>

  <!-- Inner tray background (dark, so bars pop) -->
  <rect x="67" y="117" width="156" height="66" fill="#4d4d4d" stroke="none"/>

  <!-- 8 silver metal bars, graduated narrow(left) to wide(right), NO tubes beneath -->
  <!-- Widths: 13, 14, 16, 17, 18, 20, 21, 22. Gaps=3. Total=141+21=162. Start x=68. -->
  <!-- Bar 1: x=68, w=13 -->
  <rect x="68" y="120" width="13" height="56" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.81"/>
  <rect x="70" y="122" width="4" height="52" rx="1" fill="#efefef" stroke="none"/>
  <!-- Bar 2: x=84, w=14 -->
  <rect x="84" y="120" width="14" height="56" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.81"/>
  <rect x="86" y="122" width="4" height="52" rx="1" fill="#efefef" stroke="none"/>
  <!-- Bar 3: x=101, w=16 -->
  <rect x="101" y="120" width="16" height="56" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.81"/>
  <rect x="103" y="122" width="5" height="52" rx="1" fill="#efefef" stroke="none"/>
  <!-- Bar 4: x=120, w=17 -->
  <rect x="120" y="120" width="17" height="56" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.81"/>
  <rect x="122" y="122" width="5" height="52" rx="1" fill="#efefef" stroke="none"/>
  <!-- Bar 5: x=140, w=18 -->
  <rect x="140" y="120" width="18" height="56" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.81"/>
  <rect x="142" y="122" width="5" height="52" rx="1" fill="#efefef" stroke="none"/>
  <!-- Bar 6: x=161, w=20 -->
  <rect x="161" y="120" width="20" height="56" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.81"/>
  <rect x="163" y="122" width="6" height="52" rx="1" fill="#efefef" stroke="none"/>
  <!-- Bar 7: x=184, w=21 -->
  <rect x="184" y="120" width="21" height="56" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.81"/>
  <rect x="186" y="122" width="6" height="52" rx="1" fill="#efefef" stroke="none"/>
  <!-- Bar 8: x=208, w=14 (last one fits remaining space) -->
  <rect x="208" y="120" width="14" height="56" rx="2" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.81"/>
  <rect x="210" y="122" width="4" height="52" rx="1" fill="#efefef" stroke="none"/>

  <!-- Crossed mallets with hard round heads -->
  <!-- Mallet 1: bottom-left crossing to upper-right -->
  <line x1="88" y1="220" x2="163" y2="88" stroke="#4d4d4d" stroke-width="6.34" stroke-linecap="round"/>
  <circle cx="165" cy="84" r="10" fill="#d01424" stroke="#1a1a1a" stroke-width="3.81"/>
  <!-- Mallet 2: bottom-right crossing to upper-left -->
  <line x1="202" y1="220" x2="127" y2="88" stroke="#4d4d4d" stroke-width="6.34" stroke-linecap="round"/>
  <circle cx="125" cy="84" r="10" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.81"/>
</g></svg>