<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- rapid-test: lateral-flow cassette, 1 result line (negative) -->

  <!-- cassette body -->
  <rect x="45" y="60" width="200" height="130" rx="14" ry="14" fill="#efefef" stroke="#1a1a1a" stroke-width="5.33" stroke-linejoin="round"/>

  <!-- sample well (round hole on left) -->
  <circle cx="90" cy="125" r="22" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="90" cy="125" r="13" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="2.66"/>
  <text x="90" y="166" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">S</text>

  <!-- result window (rectangle on right) -->
  <rect x="130" y="88" width="90" height="74" rx="8" ry="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- C label (control) -->
  <text x="138" y="108" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#4d4d4d">C</text>
  <!-- T label (test) -->
  <text x="138" y="148" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#4d4d4d">T</text>

  <!-- Control line (always present = 1 line shown) -->
  <line x1="152" y1="103" x2="212" y2="103" stroke="#f8130d" stroke-width="5.33" stroke-linecap="round"/>

  <!-- NO test line — 1 line = negative rapid test -->

  <!-- cassette label -->
  <text x="140" y="212" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#000000">RAPID TEST</text>

  <!-- result indicator: single line negative note -->
  <rect x="200" y="78" width="32" height="18" rx="5" ry="5" fill="#529929" stroke="#1a1a1a" stroke-width="2.66" stroke-linejoin="round"/>
  <text x="216" y="91" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">NEG</text>
</g></svg>