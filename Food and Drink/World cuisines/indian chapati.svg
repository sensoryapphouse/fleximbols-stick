  <!-- Chapati: thin, pale flatbread folded into quarters (fan fold showing two visible faces) -->
  <!-- Bottom half fold (back face) - pale yellowish -->
  <path d="M145 210 Q80 195 68 145 Q72 110 145 100 Q218 110 222 145 Q210 195 145 210 Z" fill="#eed5b6" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Fold crease (horizontal centre fold) -->
  <path d="M75 155 Q145 148 215 155" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Top-right quarter lifted/folded up showing inner face (slightly darker) -->
  <path d="M145 155 Q155 110 200 90 Q222 85 228 100 Q230 120 215 155 Z" fill="#e6b98a" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Vertical fold crease -->
  <path d="M145 100 Q148 128 145 155" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Slight puff bubble on top quarter -->
  <ellipse cx="185" cy="125" rx="18" ry="14" fill="#eed5b6" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- Pale spots (no heavy charring, just softer speckling) -->
  <ellipse cx="102" cy="175" rx="8" ry="6" fill="#e6b98a" stroke="#1a1a1a" stroke-width="2.96"/>
  <ellipse cx="165" cy="185" rx="7" ry="5" fill="#e6b98a" stroke="#1a1a1a" stroke-width="2.96"/>
</g></svg>