  <path d="M70 70 L82 70 L70 82 L82 82" fill="none" stroke="#ffffff" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M205 60 L213 60 L205 68 L213 68" fill="none" stroke="#ffffff" stroke-width="3.70" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lip mask jar (below the night sky) -->
  <ellipse cx="90" cy="135" rx="36" ry="9" fill="#f266aa" stroke="#1a1a1a" stroke-width="4.45"/>
  <path d="M54 135 L57 215 Q90 228 123 215 L126 135" fill="#7c3fac" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Jar lid -->
  <ellipse cx="90" cy="126" rx="38" ry="9" fill="#392170" stroke="#1a1a1a" stroke-width="5.93"/>
  <!-- Tiny moon on lid -->
  <path d="M95 121 Q88 124 90 130 Q92 132 98 128 Q93 125 95 121 Z" fill="#fff200" stroke="#1a1a1a" stroke-width="2.22" stroke-linejoin="round"/>
  <!-- Jar label -->
  <rect x="65" y="170" width="50" height="22" rx="2" ry="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- Lip pictogram on label -->
  <path d="M75 181 Q83 176 90 178 Q97 176 105 181 Q97 188 90 188 Q83 188 75 181 Z" fill="#f8130d" stroke="#1a1a1a" stroke-width="2.22" stroke-linejoin="round"/>
