  <line x1="85" y1="105" x2="85" y2="98" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="85" y1="129" x2="85" y2="136" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="73" y1="117" x2="66" y2="117" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="97" y1="117" x2="104" y2="117" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="76" y1="108" x2="71" y2="103" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="94" y1="108" x2="99" y2="103" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="76" y1="126" x2="71" y2="131" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="94" y1="126" x2="99" y2="131" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- spike tips (small dots) -->
  <circle cx="85" cy="96" r="2.5" fill="#000000"/>
  <circle cx="85" cy="138" r="2.5" fill="#000000"/>
  <circle cx="64" cy="117" r="2.5" fill="#000000"/>
  <circle cx="106" cy="117" r="2.5" fill="#000000"/>

  <!-- syringe (right side, angled) -->
  <!-- barrel -->
  <polygon points="135,165 150,150 245,80 230,65" fill="#dff3fd" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- liquid in syringe -->
  <polygon points="148,160 158,150 230,76 220,68" fill="#d01424" stroke="none"/>
  <!-- tick marks -->
  <line x1="170" y1="135" x2="178" y2="143" stroke="#1a1a1a" stroke-width="3.70" stroke-linecap="round"/>
  <line x1="185" y1="120" x2="193" y2="128" stroke="#1a1a1a" stroke-width="3.70" stroke-linecap="round"/>
