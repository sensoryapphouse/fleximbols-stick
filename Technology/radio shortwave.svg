  <!-- shortwave radio body, boxy with multi-band selector -->
  <rect x="30" y="70" width="230" height="140" rx="8" ry="8" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="13.34"/>
  <rect x="38" y="78" width="214" height="124" rx="4" ry="4" fill="#392170" stroke="#1a1a1a" stroke-width="8.89"/>
  <!-- long antenna telescoping up -->
  <line x1="225" y1="70" x2="265" y2="15" stroke="#1a1a1a" stroke-width="17.78" stroke-linecap="round"/>
  <line x1="225" y1="70" x2="265" y2="15" stroke="#b8b8b8" stroke-width="8.89" stroke-linecap="round"/>
  <circle cx="265" cy="15" r="4" fill="#d01424" stroke="#1a1a1a" stroke-width="8.89"/>
  <!-- secondary antenna stub -->
  <line x1="45" y1="70" x2="20" y2="40" stroke="#1a1a1a" stroke-width="13.34" stroke-linecap="round"/>
