  <path d="M180 175 Q180 195 195 200 L225 200 Q240 195 240 175" fill="#eed5b6" stroke="#1a1a1a" stroke-width="5.33" stroke-linejoin="round"/>
  <!-- Gel polish bottle (left side) -->
  <!-- Bottle body (squat square gel bottle) -->
  <rect x="35" y="115" width="80" height="95" rx="6" ry="6" fill="#f8130d" stroke="#1a1a1a" stroke-width="8.89" stroke-linejoin="round"/>
  <!-- Glossy liquid window -->
  <rect x="44" y="125" width="62" height="75" rx="3" ry="3" fill="#d01424" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Strong glossy gel shine -->
  <line x1="52" y1="132" x2="52" y2="190" stroke="#ffffff" stroke-width="6.22" stroke-linecap="round"/>
  <line x1="62" y1="135" x2="62" y2="180" stroke="#f4a4b2" stroke-width="3.56" stroke-linecap="round"/>
