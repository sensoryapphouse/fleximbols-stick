  <!-- tool-chest: metal multi-drawer tool chest/cabinet with stacked drawers and handles -->

  <!-- cabinet body (main metal box) -->
  <rect x="45" y="35" width="200" height="185" rx="6" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>

  <!-- top lid/surface -->
  <rect x="45" y="35" width="200" height="28" rx="6" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>

  <!-- lid handle bar -->
  <rect x="105" y="43" width="80" height="12" rx="6" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- drawer 1 (top) -->
  <rect x="55" y="75" width="180" height="32" rx="3" fill="#efefef" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- drawer 1 handle -->
  <rect x="118" y="86" width="54" height="10" rx="5" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- drawer 2 -->
  <rect x="55" y="115" width="180" height="32" rx="3" fill="#efefef" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- drawer 2 handle -->
  <rect x="118" y="126" width="54" height="10" rx="5" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- drawer 3 (tall middle) -->
  <rect x="55" y="155" width="180" height="38" rx="3" fill="#efefef" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- drawer 3 handle -->
  <rect x="118" y="169" width="54" height="10" rx="5" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- drawer 4 (bottom, tall) -->
  <rect x="55" y="200" width="180" height="12" rx="3" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- corner reinforcements (metal corner trim) -->
  <rect x="45" y="35" width="14" height="185" rx="3" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="231" y="35" width="14" height="185" rx="3" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- caster wheels at bottom -->
  <circle cx="75" cy="221" r="10" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="75" cy="221" r="4" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="2.96"/>
  <circle cx="215" cy="221" r="10" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="215" cy="221" r="4" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="2.96"/>

  <!-- keylock on side panel -->
  <circle cx="237" cy="133" r="6" fill="#f7de58" stroke="#1a1a1a" stroke-width="2.96"/>

  <!-- shadow/depth edge on bottom of cabinet -->
  <path d="M 45 215 L 245 215 L 245 220 L 45 220 Z" fill="#4d4d4d" stroke="none"/>
</g></svg>