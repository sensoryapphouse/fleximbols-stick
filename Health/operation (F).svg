<line x1="216" y1="222" x2="300" y2="300" stroke="#2f9e8f" stroke-width="22" stroke-linecap="round"/>
<circle class="skin" cx="306" cy="306" r="13" fill="#f5d6b0" stroke="#1a1a1a" stroke-width="4"/>
<!-- scalpel in hand -->
<line x1="306" y1="306" x2="334" y2="320" stroke="#c9ced6" stroke-width="6" stroke-linecap="round"/>
<line x1="296" y1="300" x2="312" y2="308" stroke="#39414b" stroke-width="8" stroke-linecap="round"/>
<!-- left arm down -->
<line x1="156" y1="222" x2="136" y2="306" stroke="#2f9e8f" stroke-width="22" stroke-linecap="round"/>
<circle class="skin" cx="133" cy="312" r="12" fill="#f5d6b0" stroke="#1a1a1a" stroke-width="4"/>
