  <rect x="160" y="60" width="36" height="24" rx="4" ry="4" fill="#d01424" stroke="#1a1a1a" stroke-width="5.93"/>
  <!-- trigger indicator line -->
  <rect x="170" y="68" width="16" height="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- cocking lever -->
  <rect x="208" y="62" width="22" height="14" rx="3" ry="3" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- device grip -->
  <rect x="220" y="130" width="34" height="40" rx="4" ry="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.93"/>
