  <!-- skewer stick -->
  <rect x="142" y="20" width="8" height="170" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- top piece: daikon radish (white round) -->
  <circle cx="146" cy="55" r="28" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.93"/>
  <circle cx="146" cy="55" r="18" fill="none" stroke="#b8b8b8" stroke-width="2.96"/>
  <!-- middle piece: boiled egg (oval, cream) -->
  <ellipse cx="146" cy="115" rx="26" ry="22" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="5.93"/>
  <ellipse cx="146" cy="115" rx="12" ry="9" fill="#fff200" stroke="#1a1a1a" stroke-width="2.96"/>
