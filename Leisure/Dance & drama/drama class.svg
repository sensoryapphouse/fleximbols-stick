<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- TRAGEDY mask (left, sad, dark) -->
  <!-- Mask face -->
  <ellipse cx="90" cy="108" rx="52" ry="58" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Tragedy eyes: downward-slant ovals -->
  <ellipse cx="74" cy="95" rx="10" ry="7" fill="#000000" stroke="#1a1a1a" stroke-width="2.22"/>
  <ellipse cx="106" cy="95" rx="10" ry="7" fill="#000000" stroke="#1a1a1a" stroke-width="2.22"/>
  <!-- Tragedy brow lines (sad, furrowed) -->
  <line x1="64" y1="82" x2="84" y2="88" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="116" y1="82" x2="96" y2="88" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Tragedy mouth: downward curve -->
  <path d="M70,135 Q90,118 110,135" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Tear drop -->
  <ellipse cx="74" cy="115" rx="5" ry="7" fill="#90a7d6" stroke="#1a1a1a" stroke-width="2.22"/>
  <!-- Mask holes for eyes -->
  <ellipse cx="74" cy="95" rx="7" ry="5" fill="#4d4d4d" stroke="none"/>
  <ellipse cx="106" cy="95" rx="7" ry="5" fill="#4d4d4d" stroke="none"/>

  <!-- COMEDY mask (right, happy, bright) -->
  <ellipse cx="200" cy="105" rx="52" ry="55" fill="#f7de58" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Comedy eyes: upward arcs -->
  <path d="M178,92 Q184,84 190,92" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M208,92 Q214,84 220,92" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Comedy brow lines (happy, raised) -->
  <line x1="172" y1="80" x2="188" y2="85" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="226" y1="80" x2="210" y2="85" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Comedy mouth: upward curve smile -->
  <path d="M175,125 Q200,148 225,125" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Mask holes for eyes -->
  <ellipse cx="184" cy="92" rx="7" ry="5" fill="#4d4d4d" stroke="none"/>
  <ellipse cx="214" cy="92" rx="7" ry="5" fill="#4d4d4d" stroke="none"/>

  <!-- Spotlight beam from top-right down onto masks -->
  <polygon points="258,20 236,20 180,165 200,165" fill="#f7de58" stroke="none"/>
  <polygon points="258,20 236,20 180,165 200,165" fill="none" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <!-- Spotlight lamp housing -->
  <rect x="232" y="12" width="32" height="18" rx="5" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Spotlight lens -->
  <circle cx="248" cy="21" r="7" fill="#f7de58" stroke="#1a1a1a" stroke-width="3.33"/>
</g></svg>