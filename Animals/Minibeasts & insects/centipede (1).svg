  <!-- Centipede-modern: flatter body, one pair of long legs per segment, antennae, fang-claws -->

  <!-- Body segments back-to-front (tail left, head right) -->
  <!-- Segment 1 - tail -->
  <ellipse cx="35" cy="120" rx="12" ry="8" fill="#e65a00" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <line x1="35" y1="112" x2="28" y2="94" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="35" y1="128" x2="28" y2="146" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Segment 2 -->
  <ellipse cx="58" cy="120" rx="12" ry="8" fill="#ff9900" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <line x1="58" y1="112" x2="48" y2="92" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="58" y1="128" x2="48" y2="148" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Segment 3 -->
  <ellipse cx="81" cy="120" rx="12" ry="8" fill="#e65a00" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <line x1="81" y1="112" x2="68" y2="90" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="81" y1="128" x2="68" y2="150" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Segment 4 -->
  <ellipse cx="104" cy="120" rx="12" ry="8" fill="#ff9900" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <line x1="104" y1="112" x2="90" y2="90" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="104" y1="128" x2="90" y2="150" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Segment 5 -->
  <ellipse cx="127" cy="120" rx="12" ry="8" fill="#e65a00" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <line x1="127" y1="112" x2="113" y2="90" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="127" y1="128" x2="113" y2="150" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Segment 6 -->
  <ellipse cx="150" cy="120" rx="12" ry="8" fill="#ff9900" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <line x1="150" y1="112" x2="136" y2="90" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="150" y1="128" x2="136" y2="150" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Segment 7 -->
  <ellipse cx="173" cy="120" rx="12" ry="8" fill="#e65a00" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <line x1="173" y1="112" x2="159" y2="90" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="173" y1="128" x2="159" y2="150" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Segment 8 -->
  <ellipse cx="196" cy="120" rx="12" ry="8" fill="#ff9900" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <line x1="196" y1="112" x2="185" y2="90" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="196" y1="128" x2="185" y2="150" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Head -->
  <ellipse cx="222" cy="120" rx="20" ry="15" fill="#ff9900" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Eyes -->
  <circle cx="224" cy="115" r="4" fill="#000000"/>
  <!-- Antennae from head -->
  <line x1="236" y1="110" x2="260" y2="88" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <circle cx="260" cy="88" r="4" fill="#000000"/>
  <line x1="236" y1="116" x2="262" y2="104" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <circle cx="262" cy="104" r="4" fill="#000000"/>

  <!-- Fang-claws (forcipules) below head -->
  <path d="M 215 133 Q 205 148 195 155" fill="none" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <path d="M 215 133 Q 210 150 218 158" fill="none" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <!-- Claw tips -->
  <circle cx="195" cy="155" r="5" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="218" cy="158" r="5" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45"/>
</g></svg>