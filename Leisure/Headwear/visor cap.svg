  <circle cx="145" cy="105" r="3" fill="#b8b8b8" stroke="none"/>
  <circle cx="157" cy="105" r="3" fill="#b8b8b8" stroke="none"/>
  <!-- Brim stitch -->
  <path d="M52,176 Q145,182 238,176" fill="none" stroke="#f7de58" stroke-width="2.22" stroke-linecap="round" stroke-dasharray="5,4"/>
