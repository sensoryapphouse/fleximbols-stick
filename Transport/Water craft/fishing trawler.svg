<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- fishing-trawler: working fishing boat with tall wheelhouse, outrigger booms/derricks, hanging nets, sturdy hull -->

  <!-- water band -->
  <path d="M 0 192 Q 36 183 72 192 Q 108 201 144 192 Q 180 183 216 192 Q 252 201 290 192 L 290 240 L 0 240 Z" fill="#2a4ec0" stroke="none"/>
  <path d="M 0 192 Q 36 183 72 192 Q 108 201 144 192 Q 180 183 216 192 Q 252 201 290 192" fill="none" stroke="#1a1a1a" stroke-width="5.33" stroke-linecap="round"/>

  <!-- sturdy main hull (wide, deep, working boat) -->
  <path d="M 28 180 Q 38 202 90 208 Q 155 214 220 207 L 252 188 L 244 170 L 70 170 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="8.89" stroke-linejoin="round"/>

  <!-- rust/work stripe at waterline -->
  <path d="M 55 200 Q 130 208 205 204 L 238 196 L 235 191 Q 195 200 125 196 L 58 194 Z" fill="#e65a00" stroke="none"/>

  <!-- main deck (flat working deck) -->
  <rect x="70" y="155" width="175" height="17" rx="2" fill="#9d7246" stroke="#1a1a1a" stroke-width="5.33" stroke-linejoin="round"/>

  <!-- TALL wheelhouse (prominent, boxy) -->
  <rect x="150" y="108" width="88" height="50" rx="4" fill="#f5e7c4" stroke="#1a1a1a" stroke-width="7.11" stroke-linejoin="round"/>
  <!-- wheelhouse windows (large for visibility) -->
  <rect x="158" y="115" width="24" height="18" rx="3" fill="#dff3fd" stroke="#1a1a1a" stroke-width="5.33"/>
  <rect x="188" y="115" width="24" height="18" rx="3" fill="#dff3fd" stroke="#1a1a1a" stroke-width="5.33"/>
  <rect x="215" y="115" width="16" height="18" rx="3" fill="#dff3fd" stroke="#1a1a1a" stroke-width="5.33"/>

  <!-- wheelhouse roof / bridge top -->
  <rect x="148" y="100" width="92" height="10" rx="3" fill="#9d7246" stroke="#1a1a1a" stroke-width="5.33" stroke-linejoin="round"/>

  <!-- exhaust stack on wheelhouse -->
  <rect x="228" y="78" width="12" height="24" rx="2" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.33"/>
  <!-- smoke -->
  <path d="M 234 75 Q 230 66 236 59 Q 242 52 238 45" fill="none" stroke="#7f7f7f" stroke-width="4.45" stroke-linecap="round"/>

  <!-- mast / derrick pole (main boom support) -->
  <line x1="195" y1="100" x2="192" y2="48" stroke="#4d4d4d" stroke-width="8.89" stroke-linecap="round"/>
  <!-- crow's nest / top light -->
  <rect x="183" y="42" width="18" height="10" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="3.56"/>
  <!-- radar/antenna -->
  <line x1="192" y1="42" x2="192" y2="28" stroke="#4d4d4d" stroke-width="5.33" stroke-linecap="round"/>
  <line x1="180" y1="32" x2="205" y2="32" stroke="#4d4d4d" stroke-width="5.33" stroke-linecap="round"/>

  <!-- LEFT outrigger boom (derrick angled out to left) -->
  <line x1="185" y1="82" x2="52" y2="130" stroke="#4d4d4d" stroke-width="7.11" stroke-linecap="round"/>
  <!-- left boom support stay -->
  <line x1="192" y1="58" x2="52" y2="130" stroke="#4d4d4d" stroke-width="4.45" stroke-linecap="round"/>

  <!-- RIGHT outrigger boom (derrick angled out to right — but constrained within frame) -->
  <line x1="202" y1="82" x2="260" y2="128" stroke="#4d4d4d" stroke-width="7.11" stroke-linecap="round"/>
  <!-- right boom support stay -->
  <line x1="195" y1="58" x2="260" y2="128" stroke="#4d4d4d" stroke-width="4.45" stroke-linecap="round"/>

  <!-- HANGING NETS from left boom tip -->
  <path d="M 52 130 L 45 162 L 65 162 L 72 135 Z" fill="none" stroke="#7d5e23" stroke-width="3.56"/>
  <!-- net mesh lines horizontal -->
  <line x1="46" y1="142" x2="70" y2="140" stroke="#7d5e23" stroke-width="2.67"/>
  <line x1="45" y1="152" x2="68" y2="150" stroke="#7d5e23" stroke-width="2.67"/>
  <!-- net mesh lines vertical -->
  <line x1="52" y1="130" x2="50" y2="162" stroke="#7d5e23" stroke-width="2.67"/>
  <line x1="58" y1="132" x2="56" y2="162" stroke="#7d5e23" stroke-width="2.67"/>
  <line x1="64" y1="135" x2="62" y2="162" stroke="#7d5e23" stroke-width="2.67"/>

  <!-- HANGING NETS from right boom tip -->
  <path d="M 260 128 L 256 160 L 275 160 L 272 130 Z" fill="none" stroke="#7d5e23" stroke-width="3.56"/>
  <line x1="257" y1="140" x2="273" y2="139" stroke="#7d5e23" stroke-width="2.67"/>
  <line x1="256" y1="151" x2="274" y2="150" stroke="#7d5e23" stroke-width="2.67"/>
  <line x1="260" y1="128" x2="259" y2="160" stroke="#7d5e23" stroke-width="2.67"/>
  <line x1="265" y1="130" x2="264" y2="160" stroke="#7d5e23" stroke-width="2.67"/>
  <line x1="270" y1="132" x2="270" y2="160" stroke="#7d5e23" stroke-width="2.67"/>

  <!-- foredeck fish hold hatch -->
  <rect x="78" y="158" width="55" height="12" rx="2" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.33"/>
  <line x1="105" y1="158" x2="105" y2="170" stroke="#4d4d4d" stroke-width="3.56"/>

  <!-- deck winch -->
  <circle cx="120" cy="158" r="8" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.33"/>
  <circle cx="120" cy="158" r="4" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="3.56"/>

  <!-- anchor at bow -->
  <line x1="83" y1="170" x2="78" y2="182" stroke="#4d4d4d" stroke-width="7.11" stroke-linecap="round"/>
  <line x1="74" y1="178" x2="83" y2="178" stroke="#4d4d4d" stroke-width="5.33" stroke-linecap="round"/>

  <!-- flag at masthead -->
  <path d="M 192 27 L 208 21 L 192 15 Z" fill="#529929" stroke="#1a1a1a" stroke-width="2.67"/>
</g></svg>