  <!-- Lemon meringue pie: yellow filling + TALL TOASTED MERINGUE PEAKS on top -->
  <!-- Plate -->
  <ellipse cx="145" cy="218" rx="108" ry="14" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Pie dish/crust bottom edge -->
  <path d="M 48,210 L 242,210 L 232,194 L 58,194 Z" fill="#e6b98a" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Pie crust pastry side -->
  <path d="M 58,194 L 232,194 L 218,132 L 72,132 Z" fill="#e6b98a" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Lemon filling - bright yellow layer inside crust -->
  <path d="M 68,188 L 222,188 L 212,136 L 78,136 Z" fill="#f2e40d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Filling gloss -->
  <path d="M 95,168 Q 145,164 195,168" fill="none" stroke="#f2e40d" stroke-width="3.33" stroke-linecap="round"/>
  <!-- TALL TOASTED MERINGUE PEAKS - THE key feature: white cloud with browned tops -->
  <!-- Meringue base layer -->
  <path d="M 72,136 Q 145,120 218,136" fill="#ffffff" stroke="none"/>
  <!-- Peak 1 left -->
  <path d="M 72,136 Q 78,112 88,98 Q 96,86 100,100 Q 106,115 112,130 Q 88,124 72,136 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Peak 2 left-centre -->
  <path d="M 100,118 Q 108,96 116,78 Q 124,62 130,80 Q 136,98 138,118 Q 118,112 100,118 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Peak 3 centre (tallest) -->
  <path d="M 128,110 Q 138,84 145,62 Q 152,84 162,110 Q 145,104 128,110 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Peak 4 right-centre -->
  <path d="M 152,118 Q 154,98 160,80 Q 166,62 172,80 Q 178,96 180,118 Q 165,112 152,118 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Peak 5 right -->
  <path d="M 178,130 Q 184,115 190,100 Q 194,86 202,98 Q 210,112 218,136 Q 200,124 178,130 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- TOASTED BROWN TIPS on meringue peaks - key visual detail -->
  <path d="M 84,102 Q 88,96 92,102" fill="#e6b98a" stroke="#9d7246" stroke-width="2.22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 112,82 Q 116,72 120,82" fill="#e6b98a" stroke="#9d7246" stroke-width="2.22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 141,66 Q 145,56 149,66" fill="#e6b98a" stroke="#9d7246" stroke-width="2.22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 168,82 Q 172,72 176,82" fill="#e6b98a" stroke="#9d7246" stroke-width="2.22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 196,102 Q 200,94 204,102" fill="#e6b98a" stroke="#9d7246" stroke-width="2.22" stroke-linecap="round" stroke-linejoin="round"/>
</g></svg>