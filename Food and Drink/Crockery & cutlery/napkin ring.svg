  <!-- Pleat lines on top napkin -->
  <path d="M130,40 L132,108 M145,38 L145,108 M160,40 L158,108" fill="none" stroke="#d01424" stroke-width="3.70" stroke-linecap="round"/>
  <!-- Napkin tail flaring downward out of ring (bottom) -->
  <path d="M125,150 L165,150 L180,225 L110,225 Z" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round" stroke-linecap="round"/>
