<svg xmlns="http://www.w3.org/2000/svg" viewBox="11.29 65.05 494.55 494.55">
<!-- longest: three pencils of increasing length, arrow on the longest -->
<!-- pencil helper drawn inline; lengths differ -->
<!-- short pencil (faded) -->
<g opacity="0.34">
<g transform="translate(70 150)">
<rect x="0" y="0" width="120" height="36" fill="#f3c84a" stroke="#1a1a1a" stroke-width="9"/>
<polygon points="120,0 120,36 158,18" fill="#e8b89a" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<polygon points="143,11 158,18 143,25" fill="#1a1a1a"/>
<rect x="-22" y="0" width="22" height="36" fill="#f3a0a0" stroke="#1a1a1a" stroke-width="9"/>
</g>
</g>
<!-- medium pencil (faded) -->
<g opacity="0.34">
<g transform="translate(70 240)">
<rect x="0" y="0" width="230" height="36" fill="#f3c84a" stroke="#1a1a1a" stroke-width="9"/>
<polygon points="230,0 230,36 268,18" fill="#e8b89a" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<polygon points="253,11 268,18 253,25" fill="#1a1a1a"/>
<rect x="-22" y="0" width="22" height="36" fill="#f3a0a0" stroke="#1a1a1a" stroke-width="9"/>
</g>
</g>
<!-- long pencil (bold) -->
<g transform="translate(70 340)">
<rect x="0" y="0" width="360" height="38" fill="#e0473c" stroke="#1a1a1a" stroke-width="9"/>
<polygon points="360,0 360,38 400,19" fill="#e8b89a" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<polygon points="383,11 400,19 383,27" fill="#1a1a1a"/>
<rect x="-24" y="0" width="24" height="38" fill="#f3a0a0" stroke="#1a1a1a" stroke-width="9"/>
</g>
<!-- bold green arrow pointing at the longest -->
<line x1="220" y1="430" x2="220" y2="470" stroke="#1a1a1a" stroke-width="24.0" stroke-linecap="round"/><line x1="220" y1="470" x2="193" y2="440" stroke="#1a1a1a" stroke-width="24.0" stroke-linecap="round"/><line x1="220" y1="470" x2="247" y2="440" stroke="#1a1a1a" stroke-width="24.0" stroke-linecap="round"/><line x1="220" y1="430" x2="220" y2="470" stroke="#2f9e4a" stroke-width="18.5" stroke-linecap="round"/>
<line x1="220" y1="470" x2="193" y2="440" stroke="#2f9e4a" stroke-width="18.5" stroke-linecap="round"/>
<line x1="220" y1="470" x2="247" y2="440" stroke="#2f9e4a" stroke-width="18.5" stroke-linecap="round"/>
</svg>
