<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- ground shadow -->
  <ellipse cx="145" cy="218" rx="90" ry="10" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- deck / board (horizontal skateboard-style platform) -->
  <!-- rear deck half -->
  <rect x="28" y="138" width="98" height="28" rx="10" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- front deck half -->
  <rect x="164" y="138" width="98" height="28" rx="10" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- deck grip tape strips (rear) -->
  <rect x="36" y="142" width="82" height="6" rx="2" fill="#7f7f7f" stroke="none"/>
  <rect x="36" y="152" width="82" height="6" rx="2" fill="#7f7f7f" stroke="none"/>
  <!-- deck grip tape strips (front) -->
  <rect x="172" y="142" width="82" height="6" rx="2" fill="#7f7f7f" stroke="none"/>
  <rect x="172" y="152" width="82" height="6" rx="2" fill="#7f7f7f" stroke="none"/>

  <!-- central hub / motor housing around wheel -->
  <rect x="118" y="118" width="54" height="68" rx="8" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>

  <!-- the ONE big central wheel -->
  <circle cx="145" cy="175" r="40" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.55"/>
  <circle cx="145" cy="175" r="28" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- tyre tread rings -->
  <circle cx="145" cy="175" r="36" fill="none" stroke="#1a1a1a" stroke-width="3.33"/>
  <circle cx="145" cy="175" r="32" fill="none" stroke="#1a1a1a" stroke-width="2.22"/>
  <!-- hub spokes -->
  <line x1="145" y1="147" x2="145" y2="155" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="145" y1="195" x2="145" y2="203" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="117" y1="175" x2="125" y2="175" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <line x1="165" y1="175" x2="173" y2="175" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <!-- hub centre cap -->
  <circle cx="145" cy="175" r="10" fill="#f7de58" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- foot pads on deck ends -->
  <rect x="30" y="136" width="30" height="8" rx="4" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="230" y="136" width="30" height="8" rx="4" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- bumpers at deck ends -->
  <rect x="26" y="140" width="8" height="22" rx="4" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="256" y="140" width="8" height="22" rx="4" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- LED strip on motor housing -->
  <rect x="120" y="130" width="50" height="6" rx="3" fill="#fff200" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
</g></svg>