  <!-- machine outer shell (large rounded rectangle) -->
  <rect x="40" y="50" width="210" height="140" rx="20" ry="20" fill="#dff3fd" stroke="#1a1a1a" stroke-width="5.93"/>
  <!-- inner tunnel (dark circular opening) -->
  <ellipse cx="145" cy="120" rx="68" ry="48" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.93"/>
  <!-- magnet rings (inside tunnel rim) -->
  <ellipse cx="145" cy="120" rx="58" ry="40" fill="none" stroke="#90a7d6" stroke-width="4.45"/>
  <ellipse cx="145" cy="120" rx="48" ry="32" fill="none" stroke="#2a4ec0" stroke-width="4.45"/>
  <!-- side ring band -->
  <rect x="40" y="100" width="210" height="14" fill="#90a7d6" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- bed (sliding into tunnel) -->
  <rect x="80" y="160" width="180" height="14" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- bed support legs -->
  <rect x="230" y="174" width="6" height="30" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="90" y="174" width="6" height="30" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- patient on bed (full body simplified - lying) -->
  <!-- head -->
  <circle cx="220" cy="150" r="14" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- body (covered) -->
  <rect x="100" y="140" width="110" height="20" rx="6" ry="6" fill="#90a7d6" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- feet -->
  <rect x="92" y="142" width="14" height="16" rx="3" ry="3" fill="#eed5b6" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- control panel light -->
  <circle cx="62" cy="70" r="6" fill="#67832d" stroke="#1a1a1a" stroke-width="2.96"/>
  <circle cx="78" cy="70" r="6" fill="#d01424" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- M letter shape on machine (drawn as path) -->
  <path d="M222 70 L222 90 L230 80 L238 90 L238 70" fill="none" stroke="#1d0e82" stroke-width="5.93" stroke-linecap="round" stroke-linejoin="round"/>
</g></svg>