  <!-- simple steepled church (left) -->
  <rect x="25" y="130" width="90" height="90" fill="#efefef" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- pitched roof -->
  <path d="M20 132 L70 95 L120 132 Z" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- steeple -->
  <rect x="60" y="55" width="20" height="40" fill="#efefef" stroke="#1a1a1a" stroke-width="2.96"/>
  <path d="M58 55 L70 30 L82 55 Z" fill="#7d5e23" stroke="#1a1a1a" stroke-width="2.96" stroke-linejoin="round"/>
  <!-- tiny steeple cross -->
  <line x1="70" y1="14" x2="70" y2="30" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="63" y1="20" x2="77" y2="20" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- church door -->
  <path d="M55 220 L55 180 Q70 168 85 180 L85 220 Z" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="2.96" stroke-linejoin="round"/>
  <!-- plain wooden cross (right, prominent) -->
