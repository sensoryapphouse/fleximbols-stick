  <line x1="50" y1="213" x2="90" y2="213" stroke="#f8130d" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="55" y1="188" x2="88" y2="188" stroke="#f8130d" stroke-width="2.96" stroke-linecap="round"/>
