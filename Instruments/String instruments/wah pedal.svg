  <!-- Wah pedal: rocker-style guitar effects pedal, angled treadle top, body, jacks -->
  <!-- Pedal body base (trapezoidal, angled) -->
  <polygon points="55,195 235,195 220,75 70,75" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Treadle rocker plate (angled, tilted forward at toe) -->
  <polygon points="68,80 222,80 210,58 80,58" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Rocker hinge line -->
  <line x1="68" y1="80" x2="222" y2="80" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Rubber grip ridges on treadle -->
  <line x1="105" y1="63" x2="100" y2="77" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="130" y1="61" x2="125" y2="78" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="155" y1="60" x2="150" y2="78" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="180" y1="59" x2="175" y2="77" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- LED indicator -->
  <circle cx="200" cy="110" r="7" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Input jack (left side) -->
  <rect x="38" y="155" width="22" height="12" rx="4" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <circle cx="60" cy="161" r="5" fill="#000000"/>
  <!-- Output jack (right side) -->
  <rect x="230" y="155" width="22" height="12" rx="4" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <circle cx="230" cy="161" r="5" fill="#000000"/>
  <!-- Non-slip base strips -->
  <rect x="70" y="190" width="30" height="8" rx="3" fill="#000000"/>
  <rect x="190" y="190" width="30" height="8" rx="3" fill="#000000"/>
  <!-- Brand circle on body -->
  <circle cx="145" cy="150" r="18" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="145" cy="150" r="9" fill="#dff3fd" stroke="#1a1a1a" stroke-width="3.33"/>
</g></svg>