<!-- torso / shoulders -->
<path d="M 150 470 Q 150 360 232 360 Q 314 360 314 470 Z" fill="#3aa6d6" stroke="#1a1a1a" stroke-width="8" stroke-linejoin="round"/>
<!-- neck -->
<rect x="208" y="300" width="44" height="60" rx="14" fill="#f5d6b0" stroke="#1a1a1a" stroke-width="6"/>
<!-- head -->
<circle cx="222" cy="222" r="84" fill="#f5d6b0" stroke="#1a1a1a" stroke-width="8"/>
