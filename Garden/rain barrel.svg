  <!-- Barrel body - tall cylinder -->
  <rect x="90" y="65" width="110" height="145" rx="8" fill="#9d7246" stroke="#1a1a1a" stroke-width="5.55"/>
  <!-- Barrel top ellipse -->
  <ellipse cx="145" cy="65" rx="55" ry="12" fill="#7d5e23" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Barrel horizontal bands -->
  <line x1="90" y1="100" x2="200" y2="100" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="90" y1="135" x2="200" y2="135" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="90" y1="170" x2="200" y2="170" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Downspout entering from top-right -->
  <rect x="185" y="20" width="16" height="50" rx="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Downspout elbow directing into barrel -->
  <path d="M185 62 Q175 65 170 68" fill="none" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <!-- Spout at base -->
  <rect x="145" y="200" width="30" height="10" rx="3" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Spout nozzle -->
  <circle cx="178" cy="205" r="6" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Water dripping from spout -->
  <ellipse cx="178" cy="218" rx="4" ry="5" fill="#2a4ec0"/>
  <!-- Ground -->
  <line x1="60" y1="215" x2="230" y2="215" stroke="#529929" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Raindrops above barrel -->
  <line x1="120" y1="25" x2="116" y2="38" stroke="#2a4ec0" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="145" y1="18" x2="141" y2="31" stroke="#2a4ec0" stroke-width="4.45" stroke-linecap="round"/>
</g></svg>