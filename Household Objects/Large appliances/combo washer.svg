  <!-- Control knob on top panel -->
  <circle cx="195" cy="45" r="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="195" y1="37" x2="195" y2="41" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Door porthole outer ring -->
  <circle cx="145" cy="138" r="72" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Door porthole glass -->
  <circle cx="145" cy="138" r="56" fill="#dff3fd" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Drum fins -->
  <line x1="145" y1="82" x2="145" y2="98" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="145" y1="178" x2="145" y2="194" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="89" y1="138" x2="105" y2="138" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="185" y1="138" x2="201" y2="138" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Door handle -->
  <rect x="195" y="131" width="12" height="14" rx="4" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
