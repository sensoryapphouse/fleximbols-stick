<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Correction fluid: classic twin-pot Wite-Out style bottle with brush cap -->
  <!-- Bottle body: squat rectangular with rounded corners -->
  <rect x="95" y="110" width="100" height="90" rx="10" ry="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Label band on bottle -->
  <rect x="95" y="130" width="100" height="38" rx="0" fill="#f8130d" stroke="none"/>
  <rect x="95" y="130" width="100" height="38" rx="0" fill="#f8130d" stroke="none"/>
  <!-- Neck of bottle (narrower section above body) -->
  <rect x="120" y="82" width="50" height="32" rx="6" ry="6" fill="#efefef" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Screw cap (wider than neck, sits on top) -->
  <rect x="112" y="52" width="66" height="34" rx="8" ry="8" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Cap thread lines -->
  <line x1="120" y1="62" x2="170" y2="62" stroke="#7f7f7f" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="118" y1="70" x2="172" y2="70" stroke="#7f7f7f" stroke-width="2.96" stroke-linecap="round"/>
  <!-- Brush applicator emerging from top of cap -->
  <rect x="140" y="30" width="10" height="24" rx="3" ry="3" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Brush bristles at top -->
  <path d="M 138,30 Q 145,18 152,30 Z" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- White fluid drip on brush tip -->
  <ellipse cx="145" cy="20" rx="5" ry="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- Bottle label text area (white rectangle on red) -->
  <rect x="103" y="133" width="84" height="30" rx="3" fill="#ffffff" stroke="none"/>
  <!-- Decorative lines to suggest label text -->
  <line x1="110" y1="142" x2="186" y2="142" stroke="#efefef" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="115" y1="150" x2="175" y2="150" stroke="#efefef" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Bottom of bottle rounded -->
  <ellipse cx="145" cy="200" rx="50" ry="7" fill="#efefef" stroke="none"/>
</g></svg>