  <!-- left ball: pink (sakura) -->
  <circle cx="85" cy="119" r="40" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="5.93"/>
  <circle cx="75" cy="108" r="8" fill="#f266aa" stroke="#1a1a1a" stroke-width="2.96"/>
