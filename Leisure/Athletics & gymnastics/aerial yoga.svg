  <path d="M 130,155 Q 102,148 85,138" stroke="#1a1a1a" stroke-width="7.77" stroke-linecap="round" fill="none"/>
  <circle cx="82" cy="136" r="9" fill="#eed5b6" stroke="#1a1a1a" stroke-width="3.33"/>
