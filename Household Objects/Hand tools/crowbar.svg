<!-- long shaft + curved hooked claw at top, slight angle -->
<g transform="rotate(18 256 256)">
<!-- shaft -->
<path d="M 256 150 L 256 408" fill="none" stroke="#1a1a1a" stroke-width="42" stroke-linecap="round"/>
<path d="M 256 150 L 256 408" fill="none" stroke="#d63b46" stroke-width="28" stroke-linecap="round"/>
<!-- curved hooked head (gooseneck claw) -->
<path d="M 256 158 Q 250 110 206 110 Q 178 110 174 138" fill="none" stroke="#1a1a1a" stroke-width="42" stroke-linecap="butt" stroke-linejoin="round"/>
<path d="M 256 158 Q 250 110 206 110 Q 178 110 174 138" fill="none" stroke="#d63b46" stroke-width="28" stroke-linecap="butt" stroke-linejoin="round"/>
<!-- flat splayed pry/chisel end on the curved head (matches the bottom foot) -->
<path d="M 188 150 L 160 158 L 152 134 L 180 126 Z" fill="#9aa0a6" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- V-notch slot in the pry tip -->
<path d="M 156 146 L 168 142" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
<!-- chisel foot at bottom -->
<path d="M 240 406 L 272 406 L 280 430 L 232 430 Z" fill="#9aa0a6" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
</g>
</svg>
