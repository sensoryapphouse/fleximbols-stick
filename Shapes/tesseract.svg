<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" width="290" height="240">
<polygon points="55,75 235,75 235,210 55,210" fill="#5a8ad6" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round"/>
<polygon points="35,30 215,30 215,170 35,170" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round"/>
<line x1="55" y1="75" x2="35" y2="30" stroke="#1a1a1a" stroke-width="4"/>
