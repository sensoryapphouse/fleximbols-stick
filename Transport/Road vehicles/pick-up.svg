  <!-- ground line -->
  <line x1="10" y1="200" x2="280" y2="200" stroke="#1a1a1a" stroke-width="5.33" stroke-linecap="round"/>
  <!-- pickup CAB (left half, taller) -->
  <path d="M 25 195 L 25 155 L 50 100 L 135 100 L 145 155 L 145 195 Z" fill="#e65a00" stroke="#1a1a1a" stroke-width="5.33" stroke-linejoin="round"/>
  <!-- OPEN CARGO BED (right half, walls only - open top) -->
  <path d="M 145 195 L 145 130 L 270 130 L 270 195 Z" fill="#e65a00" stroke="#1a1a1a" stroke-width="5.33" stroke-linejoin="round"/>
  <!-- bed interior (darker, shows open top) -->
  <path d="M 152 188 L 152 138 L 263 138 L 263 188 Z" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- bed floor line -->
  <line x1="152" y1="180" x2="263" y2="180" stroke="#1a1a1a" stroke-width="3.56"/>
  <!-- cab windshield (sloped) -->
  <path d="M 60 110 L 75 145 L 130 145 L 130 105 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- cab door seam -->
  <line x1="95" y1="145" x2="95" y2="195" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- door handle -->
  <rect x="105" y="160" width="14" height="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.67"/>
  <!-- tailgate vertical line at rear -->
  <line x1="255" y1="138" x2="255" y2="188" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- headlight -->
  <rect x="28" y="155" width="14" height="12" fill="#fff200" stroke="#1a1a1a" stroke-width="3.56"/>
  <!-- grille -->
  <rect x="28" y="172" width="14" height="14" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="3.56"/>
  <!-- tail light -->
  <rect x="248" y="160" width="14" height="12" fill="#f8130d" stroke="#1a1a1a" stroke-width="3.56"/>
  <!-- wheels (chunkier than sedan) -->
  <circle cx="75" cy="200" r="22" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.33"/>
  <circle cx="75" cy="200" r="10" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.56"/>
  <circle cx="220" cy="200" r="22" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.33"/>
  <circle cx="220" cy="200" r="10" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.56"/>
</g></svg>