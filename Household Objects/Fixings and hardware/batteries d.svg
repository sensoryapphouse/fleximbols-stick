  <!-- D battery: largest cylindrical, horizontal + 'D' label as path -->
  <!-- Body (largest: ~130 tall, almost fills canvas) -->
  <rect x="20" y="50" width="220" height="140" rx="8" ry="8" fill="#efefef" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Positive cap -->
  <rect x="240" y="85" width="26" height="70" rx="5" ry="5" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Negative flat end band -->
  <rect x="20" y="50" width="22" height="140" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Coloured label band -->
  <rect x="52" y="64" width="178" height="112" fill="#7c3fac" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- 'D' label as a thick path: vertical stem + curved bowl -->
  <line x1="115" y1="90" x2="115" y2="150" stroke="#fff200" stroke-width="14.81" stroke-linecap="round"/>
  <path d="M 115 90 Q 160 90 160 120 Q 160 150 115 150" fill="none" stroke="#fff200" stroke-width="14.81" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- + sign -->
  <line x1="253" y1="115" x2="253" y2="125" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="248" y1="120" x2="258" y2="120" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- - sign -->
  <line x1="25" y1="120" x2="37" y2="120" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Size dot pattern in corner showing 'largest' (three filled dots) -->
  <circle cx="200" cy="200" r="5" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.96"/>
  <circle cx="215" cy="200" r="5" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.96"/>
  <circle cx="230" cy="200" r="5" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.96"/>
</g></svg>