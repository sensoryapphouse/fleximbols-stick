  <!-- C battery: medium-large cylindrical, horizontal + 'C' label as path -->
  <!-- Body (medium width: ~90 tall) -->
  <rect x="40" y="75" width="200" height="90" rx="6" ry="6" fill="#efefef" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Positive cap -->
  <rect x="240" y="100" width="20" height="40" rx="4" ry="4" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Negative flat end -->
  <rect x="40" y="75" width="18" height="90" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Coloured label band -->
  <rect x="68" y="85" width="160" height="70" fill="#137827" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- 'C' label as a thick arc path -->
  <path d="M 165 100 Q 130 100 130 120 Q 130 140 165 140" fill="none" stroke="#fff200" stroke-width="13.33" stroke-linecap="round"/>
  <!-- + sign -->
  <line x1="250" y1="116" x2="250" y2="126" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="245" y1="121" x2="255" y2="121" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- - sign -->
  <line x1="44" y1="120" x2="54" y2="120" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Size indicator (medium) -->
  <line x1="40" y1="190" x2="260" y2="190" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <path d="M 40 190 L 50 185 L 50 195 Z" fill="#000000"/>
  <path d="M 260 190 L 250 185 L 250 195 Z" fill="#000000"/>
</g></svg>