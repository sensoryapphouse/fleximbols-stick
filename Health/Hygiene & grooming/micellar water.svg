  <!-- Micellar water: wider clear bottle with flat sealed top + cotton pad -->
  <!-- Bottle body: wider, squat -->
  <rect x="80" y="65" width="90" height="145" rx="12" ry="12" fill="#dff3fd" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Liquid inside -->
  <rect x="85" y="100" width="80" height="105" rx="8" ry="8" fill="#efefef"/>
  <!-- Bottle body outline on top -->
  <rect x="80" y="65" width="90" height="145" rx="12" ry="12" fill="none" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Flat sealed top (flip-cap style flat lid) -->
  <rect x="80" y="45" width="90" height="24" rx="4" ry="4" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="5.93" stroke-linejoin="round"/>
  <!-- Flat top seal line -->
  <line x1="80" y1="57" x2="170" y2="57" stroke="#7f7f7f" stroke-width="2.96"/>
  <!-- Highlight on bottle -->
  <rect x="88" y="73" width="8" height="55" rx="4" ry="4" fill="#ffffff"/>
  <!-- Cotton pad: circle with texture beside bottle -->
  <ellipse cx="216" cy="155" rx="30" ry="30" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.93"/>
  <!-- Pad texture lines -->
  <line x1="200" y1="148" x2="232" y2="148" stroke="#b8b8b8" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="198" y1="155" x2="234" y2="155" stroke="#b8b8b8" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="200" y1="162" x2="232" y2="162" stroke="#b8b8b8" stroke-width="2.96" stroke-linecap="round"/>
</g></svg>