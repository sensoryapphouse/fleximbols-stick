  <!-- Tile frame -->
  <rect x="25" y="20" width="240" height="200" rx="18" ry="18" fill="#efefef" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>

  <!-- Chat input box (rounded rect) -->
  <rect x="42" y="120" width="180" height="52" rx="14" ry="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Cursor line inside box -->
  <line x1="62" y1="136" x2="62" y2="156" stroke="#4d4d4d" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Placeholder dots -->
  <circle cx="82" cy="146" r="4" fill="#b8b8b8"/>
  <circle cx="98" cy="146" r="4" fill="#b8b8b8"/>
  <circle cx="114" cy="146" r="4" fill="#b8b8b8"/>

  <!-- Send button -->
  <rect x="192" y="126" width="22" height="40" rx="6" ry="6" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polygon points="196,146 207,140 218,146 207,152" fill="#000000"/>

  <!-- Needle/arrow stabbing into input box from outside (red, aggressive angle) -->
  <!-- Needle shaft -->
  <line x1="145" y1="40" x2="130" y2="118" stroke="#f8130d" stroke-width="10.36" stroke-linecap="round"/>
  <!-- Needle tip (sharp triangle) -->
  <polygon points="124,120 133,110 142,122" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Needle tail (vane) -->
