  <rect x="147" y="68" width="13" height="36" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="2.66"/>
  <rect x="166" y="55" width="13" height="49" fill="#529929" stroke="#1a1a1a" stroke-width="2.66"/>
