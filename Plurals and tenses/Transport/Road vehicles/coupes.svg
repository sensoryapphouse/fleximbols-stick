  <!-- ground line -->
  <line x1="15" y1="200" x2="275" y2="200" stroke="#1a1a1a" stroke-width="5.33" stroke-linecap="round"/>
  <!-- LOW sleek 2-door coupe with sloping roofline -->
  <!-- main body, low slung -->
  <path d="M 25 195 L 30 165 L 70 145 L 110 110 L 195 110 L 235 155 L 265 165 L 265 195 Z" fill="#d01424" stroke="#1a1a1a" stroke-width="5.33" stroke-linejoin="round"/>
  <!-- sloping greenhouse (one continuous arc, no B-pillar = coupe) -->
  <path d="M 80 145 L 115 118 L 190 118 L 225 150 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- single door split (one door per side = 2-door coupe) -->
  <line x1="152" y1="118" x2="152" y2="195" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- door handle -->
  <rect x="130" y="158" width="14" height="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="2.67"/>
  <!-- sleek headlight -->
  <path d="M 30 168 L 55 162 L 55 172 L 30 178 Z" fill="#fff200" stroke="#1a1a1a" stroke-width="3.56" stroke-linejoin="round"/>
  <!-- tail light -->
  <path d="M 260 168 L 240 165 L 240 175 L 260 178 Z" fill="#f8130d" stroke="#1a1a1a" stroke-width="3.56" stroke-linejoin="round"/>
  <!-- racing stripe down hood -->
  <line x1="55" y1="155" x2="100" y2="125" stroke="#ffffff" stroke-width="5.33"/>
  <!-- wheels (low-profile larger rims) -->
  <circle cx="80" cy="200" r="22" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.33"/>
  <circle cx="80" cy="200" r="11" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.56"/>
  <circle cx="80" cy="200" r="4" fill="#4d4d4d"/>
  <circle cx="215" cy="200" r="22" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.33"/>
  <circle cx="215" cy="200" r="11" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.56"/>
  <circle cx="215" cy="200" r="4" fill="#4d4d4d"/>
