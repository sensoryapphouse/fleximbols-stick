  <circle cx="145" cy="165" r="7" fill="none" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Sketch lines on right page (pencil sketch of a simple house) -->
  <line x1="175" y1="130" x2="240" y2="130" stroke="#7f7f7f" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="175" y1="150" x2="240" y2="150" stroke="#7f7f7f" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="175" y1="110" x2="207" y2="80" stroke="#7f7f7f" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="207" y1="80" x2="240" y2="110" stroke="#7f7f7f" stroke-width="2.96" stroke-linecap="round"/>
  <line x1="175" y1="110" x2="240" y2="110" stroke="#7f7f7f" stroke-width="2.96" stroke-linecap="round"/>
  <rect x="193" y="130" width="20" height="20" fill="none" stroke="#7f7f7f" stroke-width="2.96"/>
