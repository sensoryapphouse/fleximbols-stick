  <rect x="125" y="82" width="40" height="12" rx="6" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Wheel axle bar -->
  <rect x="90" y="215" width="110" height="8" rx="4" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
