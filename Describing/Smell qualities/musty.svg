<g fill="none" stroke="#8f8a5e" stroke-width="13" stroke-linecap="round">
<path d="M 198 208 q -24 -26 0 -52 q 24 -26 0 -52"/>
<path d="M 260 188 q -24 -26 0 -52 q 24 -26 0 -52"/>
<path d="M 322 208 q -24 -26 0 -52 q 24 -26 0 -52"/>
</g>
<!-- dust specks -->
<circle cx="160" cy="150" r="9" fill="#8f8a5e"/>
<circle cx="360" cy="138" r="8" fill="#8f8a5e"/>
<circle cx="146" cy="196" r="7" fill="#8f8a5e"/>
<circle cx="372" cy="190" r="6" fill="#8f8a5e"/>
