<!-- CHRONOLOGY: events ordered in time along a left-to-right time arrow -->
<!-- ===== the time arrow (the spine of the concept) ===== -->
<line x1="56" y1="300" x2="452" y2="300" stroke="#34404e" stroke-width="10" stroke-linecap="round"/>
<polygon points="468.0,300.0 440.0,284.0 440.0,316.0" fill="#34404e" stroke="#1a1a1a" stroke-width="6"/>
<!-- node dots on the timeline under each event -->
<circle cx="112" cy="300" r="11" fill="#34404e"/>
<circle cx="244" cy="300" r="11" fill="#34404e"/>
<circle cx="376" cy="300" r="11" fill="#34404e"/>
<!-- stems from timeline up to each card -->
<line x1="112" y1="300" x2="112" y2="250" stroke="#34404e" stroke-width="6" stroke-linecap="round"/>
<line x1="244" y1="300" x2="244" y2="250" stroke="#34404e" stroke-width="6" stroke-linecap="round"/>
<line x1="376" y1="300" x2="376" y2="250" stroke="#34404e" stroke-width="6" stroke-linecap="round"/>

<!-- ===== event card 1 ===== -->
<rect x="62" y="150" width="100" height="100" rx="8" fill="#fbf5e4" stroke="#34404e" stroke-width="5"/>
<circle cx="86" cy="172" r="8" fill="#d6533f"/>
<line x1="78" y1="196" x2="146" y2="196" stroke="#9aa6b2" stroke-width="6" stroke-linecap="round"/>
<line x1="78" y1="214" x2="130" y2="214" stroke="#9aa6b2" stroke-width="6" stroke-linecap="round"/>
<line x1="78" y1="232" x2="138" y2="232" stroke="#9aa6b2" stroke-width="6" stroke-linecap="round"/>
<!-- order badge 1 -->
<circle cx="62" cy="150" r="22" fill="#3f6f9e" stroke="#2c4f72" stroke-width="4"/>
<rect x="58" y="138" width="9" height="26" rx="4" fill="#fbf5e4"/>
<rect x="50" y="142" width="11" height="8" rx="3" fill="#fbf5e4" transform="rotate(-34 55 146)"/>

<!-- ===== event card 2 ===== -->
<rect x="194" y="150" width="100" height="100" rx="8" fill="#fbf5e4" stroke="#34404e" stroke-width="5"/>
<circle cx="218" cy="172" r="8" fill="#d6533f"/>
<line x1="210" y1="196" x2="278" y2="196" stroke="#9aa6b2" stroke-width="6" stroke-linecap="round"/>
<line x1="210" y1="214" x2="262" y2="214" stroke="#9aa6b2" stroke-width="6" stroke-linecap="round"/>
<line x1="210" y1="232" x2="270" y2="232" stroke="#9aa6b2" stroke-width="6" stroke-linecap="round"/>
<!-- order badge 2 -->
<circle cx="194" cy="150" r="22" fill="#3f6f9e" stroke="#2c4f72" stroke-width="4"/>
<path d="M 186 144 A 8 8 0 1 1 202 145 C 202 152 186 156 186 162 L 203 162" fill="none" stroke="#fbf5e4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

<!-- ===== event card 3 ===== -->
<rect x="326" y="150" width="100" height="100" rx="8" fill="#fbf5e4" stroke="#34404e" stroke-width="5"/>
<circle cx="350" cy="172" r="8" fill="#d6533f"/>
<line x1="342" y1="196" x2="410" y2="196" stroke="#9aa6b2" stroke-width="6" stroke-linecap="round"/>
<line x1="342" y1="214" x2="394" y2="214" stroke="#9aa6b2" stroke-width="6" stroke-linecap="round"/>
<line x1="342" y1="232" x2="402" y2="232" stroke="#9aa6b2" stroke-width="6" stroke-linecap="round"/>
<!-- order badge 3 -->
<circle cx="326" cy="150" r="22" fill="#3f6f9e" stroke="#2c4f72" stroke-width="4"/>
<path d="M 318 142 A 7.5 7.5 0 1 1 326 150 A 7.5 7.5 0 1 1 318 158" fill="none" stroke="#fbf5e4" stroke-width="5" stroke-linecap="round"/>

<!-- ===== sequence arrows between cards (1->2->3) ===== -->
<line x1="172" y1="200" x2="186" y2="200" stroke="#1a1a1a" stroke-width="15.0" stroke-linecap="round"/><line x1="304" y1="200" x2="318" y2="200" stroke="#1a1a1a" stroke-width="15.0" stroke-linecap="round"/><line x1="172" y1="200" x2="186" y2="200" stroke="#3fae5a" stroke-width="9.5" stroke-linecap="round"/>
<polygon points="194 200 178 192 178 208" fill="#3fae5a"/>
<line x1="304" y1="200" x2="318" y2="200" stroke="#3fae5a" stroke-width="9.5" stroke-linecap="round"/>
<polygon points="326 200 310 192 310 208" fill="#3fae5a"/>
</g></svg>
