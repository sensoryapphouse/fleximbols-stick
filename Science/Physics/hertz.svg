  <path d="M105 65 C105 40 215 40 215 65" fill="none" stroke="#d01424" stroke-width="5.93" stroke-linecap="round"/>
  <!-- bracket tick marks at endpoints -->
  <path d="M105 65 L105 75" stroke="#d01424" stroke-width="5.93" stroke-linecap="round"/>
  <path d="M215 65 L215 75" stroke="#d01424" stroke-width="5.93" stroke-linecap="round"/>
