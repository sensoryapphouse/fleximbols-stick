  <line x1="80" y1="148" x2="75" y2="168" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="110" y1="148" x2="105" y2="168" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="140" y1="148" x2="135" y2="168" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="170" y1="148" x2="165" y2="168" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <!-- Large superstructure - substantial, high -->
