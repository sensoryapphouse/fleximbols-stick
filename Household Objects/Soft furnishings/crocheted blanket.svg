  <rect x="210" y="95" width="40" height="36" fill="#ff9900" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Row 2 -->
  <rect x="30" y="131" width="36" height="36" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45"/>
