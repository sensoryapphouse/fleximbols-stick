<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Wall socket on the right — prongs withdrawn -->
  <rect x="185" y="38" width="88" height="164" rx="10" ry="10" fill="#efefef" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Socket screw dots -->
  <circle cx="229" cy="56" r="5" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.33"/>
  <circle cx="229" cy="184" r="5" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- Socket holes (empty, no prongs inside) -->
  <rect x="205" y="96" width="16" height="26" rx="5" ry="5" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="237" y="96" width="16" height="26" rx="5" ry="5" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Gap / separation zone — dashed gap line between plug and socket -->
  <line x1="176" y1="70" x2="176" y2="170" stroke="#f8130d" stroke-width="4.45" stroke-dasharray="10,6" stroke-linecap="round"/>
  <!-- Plug body — pulled leftward away from socket -->
  <rect x="42" y="78" width="110" height="84" rx="12" ry="12" fill="#f7de58" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Plug face -->
  <rect x="54" y="90" width="86" height="60" rx="8" ry="8" fill="#f2e40d" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <!-- Prongs (pointing right, away from socket — still partially extended) -->
  <rect x="120" y="102" width="14" height="26" rx="3" ry="3" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="142" y="102" width="14" height="26" rx="3" ry="3" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Cord going left from plug -->
  <path d="M42 120 Q18 120 14 120" fill="none" stroke="#4d4d4d" stroke-width="11.11" stroke-linecap="round"/>
  <!-- Motion arrows indicating plug moving LEFT (pulling out) -->
  <polygon points="98,104 82,120 98,136" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <polygon points="78,104 62,120 78,136" fill="#f8130d" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
</g></svg>