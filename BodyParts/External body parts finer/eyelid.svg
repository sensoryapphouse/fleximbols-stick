<!-- a closed eye: the eyelid covering the eye, lash line + crease highlighted -->
<!-- eye socket outline -->
<path d="M96 300 Q256 232 416 300" fill="none" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round" opacity="0.35"/>
<!-- the eyelid (skin) -->
<path d="M104 300 Q256 196 408 300 Q256 332 104 300 Z" fill="#f5d6b0" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- crease above lid -->
<path d="M120 256 Q256 196 392 256" fill="none" stroke="#c89a5b" stroke-width="8" stroke-linecap="round"/>
<!-- closed lash line at bottom of lid -->
<path d="M104 300 Q256 332 408 300" fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
<!-- short lashes pointing down -->
<line x1="170" y1="320" x2="160" y2="352" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
<line x1="222" y1="328" x2="216" y2="362" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
<line x1="290" y1="328" x2="296" y2="362" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
<line x1="342" y1="320" x2="352" y2="352" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
