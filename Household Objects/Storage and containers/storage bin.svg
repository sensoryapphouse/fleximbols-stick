  <!-- Lidded plastic tote bin (rigid, rectangular, with snap lid and handles) -->

  <!-- Lid -->
  <rect x="50" y="38" width="190" height="30" rx="8" ry="8" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Lid ridge/lip overhang -->
  <rect x="58" y="62" width="174" height="10" rx="4" ry="4" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Lid handle (centre) -->
  <rect x="115" y="26" width="60" height="18" rx="9" ry="9" fill="#2a4ec0" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Lid handle inner cutout suggestion -->
  <rect x="125" y="30" width="40" height="10" rx="5" ry="5" fill="#1d0e82" stroke="#1a1a1a" stroke-width="2.66" stroke-linejoin="round"/>

  <!-- Bin body -->
  <path d="M62 72 L55 205 L235 205 L228 72 Z" fill="#90a7d6" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- Body reinforcement ribs (horizontal) -->
  <line x1="60" y1="115" x2="230" y2="115" stroke="#1a1a1a" stroke-width="2.66" stroke-linecap="round"/>
  <line x1="58" y1="158" x2="232" y2="158" stroke="#1a1a1a" stroke-width="2.66" stroke-linecap="round"/>

  <!-- Left side handle -->
  <path d="M55 100 Q35 100 35 120 Q35 140 55 140" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right side handle -->
  <path d="M235 100 Q255 100 255 120 Q255 140 235 140" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Base (slightly narrower) -->
  <rect x="55" y="200" width="180" height="12" rx="4" ry="4" fill="#1d0e82" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
