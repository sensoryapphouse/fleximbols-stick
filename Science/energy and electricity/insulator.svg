<svg xmlns="http://www.w3.org/2000/svg" viewBox="65.94 65.94 380.12 380.12">
<!-- insulator: insulated wire with a blocked / no-flow cross showing current can't pass -->
<!-- two wire ends with bare copper tips -->
<line x1="96" y1="256" x2="206" y2="256" stroke="#1a1a1a" stroke-width="14" stroke-linecap="round"/>
<line x1="306" y1="256" x2="416" y2="256" stroke="#1a1a1a" stroke-width="14" stroke-linecap="round"/>
<line x1="186" y1="256" x2="216" y2="256" stroke="#e08a3a" stroke-width="14" stroke-linecap="round"/>
<line x1="296" y1="256" x2="326" y2="256" stroke="#e08a3a" stroke-width="14" stroke-linecap="round"/>
<!-- rubber/plastic insulating block in the middle -->
<rect x="216" y="212" width="80" height="88" rx="14" fill="#8cc152" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- "no current" cross over the gap -->
<circle cx="256" cy="256" r="58" fill="none" stroke="#d63b46" stroke-width="10"/>
<line x1="216" y1="216" x2="296" y2="296" stroke="#d63b46" stroke-width="10" stroke-linecap="round"/>
</svg>
