  <path d="M62 159 L57 159 Q55 159 55 162 L55 166 Q55 168 57 168 L62 168 L62 164 L60 164" fill="none" stroke="#1a1a1a" stroke-width="3.56" stroke-linecap="round" stroke-linejoin="round"/>
