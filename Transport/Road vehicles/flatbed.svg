<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- ground line -->
  <line x1="5" y1="205" x2="285" y2="205" stroke="#1a1a1a" stroke-width="6.67" stroke-linecap="round"/>
  <!-- cab on left -->
  <path d="M 15 200 L 15 145 L 35 100 L 95 100 L 105 145 L 105 200 Z" fill="#7f7f7f" stroke="#1a1a1a" stroke-width="6.67" stroke-linejoin="round"/>
  <!-- cab windshield -->
  <path d="M 42 110 L 55 142 L 95 142 L 95 105 Z" fill="#dff3fd" stroke="#1a1a1a" stroke-width="5.56" stroke-linejoin="round"/>
  <!-- cab door seam -->
  <line x1="70" y1="142" x2="70" y2="200" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- door handle -->
  <rect x="78" y="160" width="12" height="3" fill="#000000"/>
  <!-- FLAT cargo platform - no walls, no roof - just a flat deck -->
  <rect x="105" y="155" width="170" height="18" fill="#7d5e23" stroke="#1a1a1a" stroke-width="6.67"/>
  <!-- platform plank lines (wood grain detail) -->
  <line x1="135" y1="155" x2="135" y2="173" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="165" y1="155" x2="165" y2="173" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="195" y1="155" x2="195" y2="173" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="225" y1="155" x2="225" y2="173" stroke="#1a1a1a" stroke-width="3.33"/>
  <line x1="255" y1="155" x2="255" y2="173" stroke="#1a1a1a" stroke-width="3.33"/>
  <!-- chassis frame visible under platform -->
  <rect x="105" y="173" width="170" height="10" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="5.56"/>
  <!-- visible empty space ABOVE platform showing no walls/no roof -->
  <!-- headlight -->
  <rect x="18" y="148" width="14" height="12" fill="#fff200" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- grille -->
  <rect x="18" y="165" width="14" height="20" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- wheels (front + dual rear typical for flatbed) -->
  <circle cx="55" cy="205" r="22" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="6.67"/>
  <circle cx="55" cy="205" r="10" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="200" cy="205" r="22" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="6.67"/>
  <circle cx="200" cy="205" r="10" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="245" cy="205" r="22" fill="#4d4d4d" stroke="#1a1a1a" stroke-width="6.67"/>
  <circle cx="245" cy="205" r="10" fill="#b8b8b8" stroke="#1a1a1a" stroke-width="4.45"/>
</g></svg>